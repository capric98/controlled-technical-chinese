      reasoning: 不变式写明的失败触发条件是报告「禁止使用被动语态」或「缺少明确施事者」，输出两者都没有报告，被动句「会被自动清理」也没有被标记。但该不变式同时规定正确行为是输出空列表，而实际输出了两条
        ERROR 级发现（触发阈值未定义、「旧快照」范围未定义）。按评审规则 5，额外的发现只有在被标记文本确实无歧义且合规时才算误报。这两条是否合规，取决于技能规则中
