# 中文渲染、语域、过度编辑控制
# 由 tools/curate_cases.py 从 dev/inbox 提升而来；策展变更见 git 历史与 decision 002。
# provenance: orchestrator-reviewed —— 已由编排者按已接受语义审阅，尚未经人工复核。
cases:
- id: G-R-001
  category: translationese-light-verbs
  task: translate
  mode: standard
  source: 'The SDK will perform parsing of the uploaded configuration file and carry out validity checks
    by invoking the schema validator.

    '
  instruction: null
  invariants:
  - kind: actor
    detail: '施事者「SDK」必须保留为主语或动作发出者，不得省略或漂移为其他组件。

      '
  - kind: causality
    detail: '必须保留「通过调用 schema 校验器来执行有效性检查」的手段与目的关系，不得倒置或割裂。

      '
  - kind: rendering
    detail: '判据是轻动词名物化的堆叠，不是单个搭配的出现。「进行解析」「进行有效性检查」等搭配单独出现时属于正常的技术中文，不判为失败。判定方法：对输出的每个句子，数其中轻动词名物化结构的个数（计入「进行
      X」「来进行 Y」「对……执行……操作」「实施……」等形式）；任何一个句子中出现两个或两个以上，即判为翻译腔失败。

      '
  protected_tokens:
  - SDK
  authorized_token_changes: []
  invalid_transformations:
  - output: SDK 将对上传的配置文件进行解析，并通过调用 schema 校验器来进行有效性检查。
    violated:
    - rendering
    reason: 机械对译 perform parsing 与 carry out checks，产生严重的名物化轻动词翻译腔。
  - output: 上传的配置文件将被解析并完成校验。
    violated:
    - actor
    - causality
    reason: 丢失了施事者 SDK 以及手段组件 schema validator。
  over_edit_trap: false
  provenance: orchestrator-reviewed
  notes: '测试英文技术文档中 perform/carry out + noun 结构向自然中文动词的转换。 策展修正：schema validator 是需要翻译的普通名词，不是受保护标记；受保护标记只保留
    SDK。

    '
  source_file: r2-gemini-cases.yaml
- id: G-R-002
  category: translationese-clunky-connectors
  task: translate
  mode: strict
  source: 'Read-only replicas do not process write requests and will automatically forward all write operations
    to the primary database.

    '
  instruction: null
  invariants:
  - kind: modality
    detail: '源文「do not process」是系统客观行为描述；输出必须使用客观陈述（如「不处理」），不得强化为面向运维人员的规范禁止（如「禁止处理」「不得处理」）。

      '
  - kind: quantifier
    detail: '「all write operations」的全称量词必须完整保留（如「所有写操作」），不得漏译或泛化。

      '
  - kind: rendering
    detail: '必须消除「对于只读副本而言」「它们将会」等机械从句外壳与冗余代词，使用自然紧凑的主谓顺承表达；若输出包含「对于...而言，其/它们...」，判为翻译腔失败。

      '
  protected_tokens: []
  authorized_token_changes: []
  invalid_transformations:
  - output: 对于只读副本而言，它们不处理写请求，并且将会自动地将所有的写操作转发给主数据库。
    violated:
    - rendering
    reason: 机械套用「对于...而言」句套与冗余人称代词「它们」，副词「自动地」带生硬虚词。
  - output: 只读副本严禁处理写请求，必须将写操作转发至主库。
    violated:
    - modality
    - quantifier
    reason: 将客观行为描述强化为禁止/义务情态，并丢失了全称量词「所有」。
  over_edit_trap: false
  provenance: orchestrator-reviewed
  notes: 测试客观系统行为翻译时的情态保真与去翻译腔能力。
  source_file: r2-gemini-cases.yaml
- id: G-R-003
  category: translationese-passive-stacking
  task: translate
  mode: strict
  source: 'Due to the fact that the connection was closed by the remote peer, uncommitted transactions
    were aborted and an error code `ERR_CONN_RESET` was returned to the client.

    '
  instruction: null
  invariants:
  - kind: causality
    detail: '必须完整保留「对端关闭连接」作为事务中止与返回错误码的直接诱因，不得弱化为无因果关系的相关并列。

      '
  - kind: condition
    detail: '「uncommitted transactions」限定必须准确保留为「未提交的事务」，不得扩大为「所有事务」或漏掉限定。

      '
  - kind: fact
    detail: '受保护错误码 `ERR_CONN_RESET` 与接收方「客户端」必须完整保留。

      '
  - kind: rendering
    detail: '必须消除「由于...的事实」「被中止」「一个错误码被返回」等多重机械被动与同位语直译，使用自然中文因果顺承语序；若输出保留「由于...的事实」或连续使用「被...被...」，判为翻译腔失败。

      '
  protected_tokens:
  - '`ERR_CONN_RESET`'
  authorized_token_changes: []
  invalid_transformations:
  - output: 由于连接被远端对等节点关闭的事实，未提交的事务被中止，并且一个错误代码 `ERR_CONN_RESET` 被返回给客户端。
    violated:
    - rendering
    reason: 直译 due to the fact that，且堆叠三个被动语态「被关闭」「被中止」「被返回」。
  - output: 因连接中断，所有事务已回滚。
    violated:
    - condition
    - fact
    reason: 丢失了对端关闭诱因、将未提交事务扩大为所有事务，且丢失了受保护错误码及客户端响应。
  over_edit_trap: false
  provenance: orchestrator-reviewed
  notes: 测试同位语从句与多重被动语态在错误诊断信息中的自然中文转换。
  source_file: r2-gemini-cases.yaml
- id: G-R-004
  category: over-edit-concise-sop
  task: rewrite
  mode: strict
  source: '修改配置后须重启网关生效。

    '
  instruction: null
  invariants:
  - kind: modality
    detail: '原文「须」表达紧凑义务情态，不得弱化为「建议/可」，亦不得过度扩写为「您必须...以使...生效」。

      '
  - kind: rendering
    detail: '原文已经紧凑、准确且无歧义。输出若强加第二人称代词（如「您/用户」）、把「须」替换展开为「必须执行网关重启操作」、补齐长从句外壳（「在...之后」「以使修改后的配置生效」）或拆为多句，判为过度编辑失败。

      '
  protected_tokens: []
  authorized_token_changes: []
  invalid_transformations:
  - output: 在您修改了配置文件之后，您必须重新启动网关服务，以使修改后的配置生效。
    violated:
    - rendering
    reason: 强加第二人称代词、添加功能动词并补全冗余连接词，将原本高效的操作说明膨胀为啰嗦会话。
  - output: 修改配置后，重启网关即可生效。
    violated:
    - modality
    reason: 将强制义务情态「须」弱化为顺承效果描述「即可」，削弱了运维操作约束力。
  over_edit_trap: true
  provenance: orchestrator-reviewed
  notes: 防过度编辑陷阱：检验模型是否克制对已经极度凝练的运维 SOP 进行无意义的主谓扩写。
  source_file: r2-gemini-cases.yaml
- id: G-R-005
  category: over-edit-api-contract
  task: rewrite
  mode: standard
  source: '接口支持批量写入，单次上限 500 条。

    '
  instruction: null
  invariants:
  - kind: threshold
    detail: '「单次上限 500 条」是封闭数值上限，数值 500 与单次限制必须准确保留。

      '
  - kind: rendering
    detail: '原文采用无主语声明式，参数能力与边界清晰利落。输出若引入客套主语（如「允许用户/调用方」）、套用轻动词（如「进行批量写入操作」）或将上限扩写为「在单次请求中最多可以写入五百条数据记录」，判为过度编辑失败。

      '
  protected_tokens:
  - '500'
  authorized_token_changes: []
  invalid_transformations:
  - output: 该接口允许用户进行批量写入操作，在单次请求中最多可以写入 500 条数据记录。
    violated:
    - rendering
    reason: 添加拟人化主语「用户」和轻动词「进行...操作」，稀释了 API 契约的信息密度。
  - output: 接口支持批量写入，每次最多 500 条左右。
    violated:
    - threshold
    reason: 将精确确定的硬上限「上限 500 条」篡改为模糊估值「500 条左右」。
  over_edit_trap: true
  provenance: orchestrator-reviewed
  notes: 防过度编辑陷阱：API 契约声明已满足最高信息密度，严禁展开为口语化解释。
  source_file: r2-gemini-cases.yaml
- id: G-R-006
  category: over-edit-alert-rule
  task: rewrite
  mode: strict
  source: '磁盘用量超 90% 触发告警。

    '
  instruction: null
  invariants:
  - kind: threshold
    detail: '开区间比较「超 90%」与数值 90% 必须严格保持，不得篡改为闭区间「达到 90%」或「高于等于 90%」。

      '
  - kind: rendering
    detail: '原文是监控告警看板的标准紧缩句。输出若机械扩充为「当磁盘的使用量超过百分之九十的时候，系统将会触发告警信息」，判为过度编辑失败。

      '
  protected_tokens:
  - 90%
  authorized_token_changes: []
  invalid_transformations:
  - output: 当磁盘的使用量超过 90% 的时候，系统将会触发告警。
    violated:
    - rendering
    reason: 套用「当...的时候」模版并添加虚拟施事「系统」，大幅降低监控告警规则的扫读效率。
  - output: 磁盘用量达到 90% 触发告警。
    violated:
    - threshold
    reason: 比较符漂移：将开区间「超」（> 90%）改变为闭区间「达到」（>= 90%）。
  over_edit_trap: true
  provenance: orchestrator-reviewed
  notes: 防过度编辑陷阱：监控看板紧缩表达无需补齐时间从句外壳。
  source_file: r2-gemini-cases.yaml
- id: G-R-007
  category: over-edit-serial-verb-review
  task: review
  mode: review
  source: '备份数据库后，将流量路由至备用集群。

    '
  instruction: null
  invariants:
  - kind: order
    detail: '源文严格规定先「备份数据库」后「路由流量」的时序关系。

      '
  - kind: rendering
    detail: '原文「备份数据库后，将流量路由至备用集群。」属于标准自然的中文连动 SOP，承前省略主语且兼类词「备份」「路由」动用准确，完全符合 CTC 规范。审阅模式下正确行为是「不报告任何问题」（输出空列表）；若错误报告「缺少主语」「单句多动词」或「词性不当」，判为误报失败。

      '
  protected_tokens: []
  authorized_token_changes: []
  invalid_transformations:
  - output: "- category: missing-actor\n  severity: ERROR\n  locus: 备份数据库后\n  problem: 缺少明确的操作执行主体。\n"
    violated:
    - rendering
    reason: 误报：将自然的无主祈使 SOP 误判为主语缺失。
  expected_issues: []
  over_edit_trap: true
  provenance: orchestrator-reviewed
  notes: 误报控制用例：验证审阅模式不会对合规连动结构和名词活用产生误报。
  source_file: r2-gemini-cases.yaml
- id: G-R-008
  category: over-edit-objective-constraint
  task: rewrite
  mode: strict
  source: '生产环境禁用调试模式。

    '
  instruction: null
  invariants:
  - kind: modality
    detail: '「禁用」表示该模式在生产环境中不启用。输出不得把它弱化为「建议关闭」「尽量避免开启」等可选表述。本用例不要求判定「禁用」是状态描述还是祈使指令，输出保留任一读法都可以，但不得改变强度。

      '
  - kind: rendering
    detail: '原文属于客观环境配置基线约束。输出若强加主语（如「管理员必须...」「开发人员不得...」）或膨胀为「在生产环境中，系统必须禁止开启调试模式」，判为过度编辑失败。

      '
  protected_tokens: []
  authorized_token_changes: []
  invalid_transformations:
  - output: 在生产环境中，管理员必须禁止开启调试模式。
    violated:
    - rendering
    reason: 强加主语「管理员」，将全局系统级配置基线窄化为特定角色的行为约束，并造成句式臃肿。
  - output: 生产环境建议关闭调试模式。
    violated:
    - modality
    reason: 模态严重弱化：将绝对禁止「禁用」降级为「建议关闭」。
  over_edit_trap: true
  provenance: orchestrator-reviewed
  notes: 防过度编辑陷阱：客观系统基线规则无需捏造主体责任人。
  source_file: r2-gemini-cases.yaml
- id: G-R-009
  category: register-agent-instruction
  task: rewrite
  mode: strict
  source: '请您在注意到用户的输入里面好像有 SQL 相关词汇的时候，尽可能帮忙调用一下 `sanitize_query` 工具对输入进行清理哦，千万不要直接拿去拼接字符串。

    '
  instruction: null
  invariants:
  - kind: rendering
    detail: '对话客套与语气词（「请您」「帮忙」「一下」「哦」）属于语域噪声，输出应予清除。残留一两个语气词属于轻微问题，不单独判为失败；但「请您……」这类客套句式整体未清除，判为失败。清除语域噪声时若语义随之改变，按下面三条判。

      '
  - kind: modality
    detail: '源文用「尽可能」表达尽力而非义务，用「千万不要」表达强告诫。输出不得把「尽可能」改写为「必须」「须」「一律」等义务表述。这不是因为强制调用是错的，而是因为提高义务等级是作者的决定，不是改写的授权范围。输出若提高了调用义务的等级，判为失败。

      '
  - kind: condition
    detail: '源文的触发条件「好像有 SQL 相关词汇」本身带有不确定性。输出若把它改写为「输入包含 SQL 关键字」这类确定的可判定条件，而没有任何标注说明这是补充的判定标准，判为静默消歧失败。若输出保留不确定表述，或保留并附「待确认」说明，均判为通过。

      '
  - kind: token
    detail: '`sanitize_query` 须逐字保留。

      '
  protected_tokens:
  - '`sanitize_query`'
  authorized_token_changes: []
  invalid_transformations:
  - output: 若用户输入包含 SQL 关键字，必须先调用 `sanitize_query` 过滤；禁止直接拼接字符串。
    violated:
    - modality
    - condition
    reason: 语域清理是对的，但同时把「尽可能」升为「必须」、把「千万不要」升为「禁止」，并把不确定的触发条件固定为确定判据。三处都超出了改写授权。
  - output: 请您在发现用户输入疑似包含 SQL 词汇时，尽可能先调用 `sanitize_query` 工具清理，不要直接拼接字符串。
    violated:
    - rendering
    reason: 情态与条件都正确保留，但「请您」等客套语气未清除，语域噪声仍在。
  - output: 用户输入含 SQL 时必须调用 `sanitize_query`。
    violated:
    - modality
    - condition
    - rendering
    reason: 在提高义务等级和固定触发条件之外，还删除了「不要直接拼接字符串」这条独立约束。
  over_edit_trap: false
  provenance: orchestrator-reviewed
  notes: 本用例检验一个真实冲突：agent 指令的语域要求确定性，而决策 003 政策 5 禁止改写抬高目标文档的情态等级。正确行为是清理语域、保留情态、把弱情态作为可报告的问题交回作者，而不是自行「修好」。见
    eval/disagreements/D003。
  source_file: r2-gemini-cases.yaml
- id: G-R-010
  category: register-tool-description
  task: rewrite
  mode: standard
  source: '这个工具能够允许调用者去获取指定时间范围内的系统审计日志，你可以用它来根据用户 ID 和操作类型进行日志筛选，单次调用最多能够为你返回 100 条记录。

    '
  instruction: null
  invariants:
  - kind: fact
    detail: '工具核心功能「查询指定时间范围内的系统审计日志」与过滤维度「用户 ID」「操作类型」必须完整保留。

      '
  - kind: threshold
    detail: '单次返回上限数值 100 条必须精确保持，不得删除或改为模糊描述。

      '
  - kind: rendering
    detail: '必须消除「这个工具能够允许...」「你可以用它来...」「为你返回」等交互口语套话与轻动词「进行日志筛选」，改写为声明式、动宾直接破题的工具契约描述。

      '
  protected_tokens:
  - '100'
  authorized_token_changes: []
  invalid_transformations:
  - output: 本工具用于获取系统审计日志，你可以按用户 ID 筛选，最多返回 100 条。
    violated:
    - fact
    - rendering
    reason: 遗漏了「时间范围」与「操作类型」两个关键过滤条件，且仍残留第二人称口吻「你可以」。
  - output: 查询指定时间范围内的系统审计日志，支持按用户 ID 和操作类型筛选。
    violated:
    - threshold
    reason: 丢失了「单次最多返回 100 条」的硬性容量契约边界。
  over_edit_trap: false
  provenance: orchestrator-reviewed
  notes: 语域适配：消除工具描述中的会话引导套话，保留完整契约参数与边界。
  source_file: r2-gemini-cases.yaml
- id: G-R-011
  category: register-error-message
  task: rewrite
  mode: strict
  source: '糟糕！由于某些未知的网络连接问题，系统好像无法连接到数据库服务器 `10.0.1.5:5432` 了，请求在等待 5000ms 后超时，请您稍后重试或者联系管理员检查网络。

    '
  instruction: null
  invariants:
  - kind: fact
    detail: '故障核心事实「数据库连接超时」以及上下文参数目标地址 `10.0.1.5:5432` 与超时时间 5000ms 必须精确保留。

      '
  - kind: fact
    detail: '源文把原因表述为「某些未知的网络连接问题」，是未确认的推测。输出可以删除口语化的「好像」，但必须以「可能」「疑似」或等价方式保留原因未确认这一状态。输出若把网络问题写成已确认原因，判为失败。

      '
  - kind: scope
    detail: '源文给出两条替代动作：稍后重试，或联系管理员检查网络。二者是选择关系。输出若改成必须同时执行，或删除其中一条，判为失败。

      '
  - kind: threshold
    detail: '超时点是等待 5000ms 后超时。输出若改成「超过 5000ms」「约 5 秒」或其他改变边界或单位的表述，判为失败。

      '
  - kind: rendering
