- id: G-L-006
  category: quantifier-scope-drift
  task: rewrite
  mode: standard
  source: '错误 `E_LOCKED`：由于该资源正在被另一个进程占用的事实，当前请求已被拒绝。释放该进程持有的锁后重试。

