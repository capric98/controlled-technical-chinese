cases:
- id: G-L-001
  category: condition-deletion
  task: rewrite
  mode: strict
  source: '故障切换步骤：

    1. 记录本次健康检查结果。

    2. 仅当健康检查在 2 分钟内连续失败 3 次，且主集群已进入只读状态时，才切换到备用集群。

    3. 任一次检查恢复成功后，将连续失败计数清零。

    '
  invariants:
  - kind: condition
    detail: '切换必须同时满足两个前提：健康检查在 2 分钟内连续失败 3 次，以及主集群已经进入只读状态。输出删除任一前提，判为失败。

      '
  - kind: condition
    detail: '「连续失败」不等于在时间窗口内累计失败；任一次成功都会按第 3 步清零计数。

      '
  - kind: quantity
    detail: '时间窗口必须保持为 2 分钟，连续失败阈值必须保持为 3 次。

      '
  protected_tokens: []
  authorized_token_changes: []
  invalid_transformations:
  - output: '故障切换步骤：

      1. 记录健康检查结果。

      2. 健康检查在 2 分钟内失败 3 次后，切换到备用集群。

      3. 检查恢复成功后，将失败计数清零。

      '
    violated:
    - condition
    reason: '候选输出删除了「连续」要求和主集群只读前提，允许在更多状态下切换。

      '
  over_edit_trap: false
  provenance: orchestrator-reviewed
  source_file: r2-gpt-cases.yaml
