  - '`/healthz`'
  - '`#incident`'
  authorized_token_changes: []
  invalid_transformations:
  - output: '## 紧急回滚（目标 5 分钟内完成）


      1. 事故值班工程师登录发布平台。

      2. 事故值班工程师点击「回滚到上一版本」。

      3. 事故值班工程师确认目标版本号为 `v3.14.2`。

      4. 如果回滚已经完成，那么事故值班工程师刷新健康检查页。

      5. 事故值班工程师确认 `/healthz` 连续 3 次返回 `200`。

      6. 事故值班工程师在 `#incident` 频道同步回滚结果与影响范围。

      '
    violated:
    - over-edit
    - procedure
    reason: '目标 5 分钟内完成的清单被膨胀成 6 步并附加了源文没有的登录步骤；重复主语与

      「如果…那么…」句式没有带来任何消歧收益（§17.6、§17.7）。

      '
  - output: '1. 在发布平台点击「回滚到上一版本」，确认目标版本号为 `v3.14.2`。

      2. 回滚完成后刷新健康检查页，确认 `/healthz` 连续 3 次返回 `200`。

      3. 在 `#incident` 频道同步回滚结果与影响范围。

      4. 若健康检查未通过，联系发布负责人决定是否二次回滚。

      '
    violated:
    - fact
    reason: '第 4 步是新增的操作规程，源文没有规定失败分支，也没有「发布负责人」这一角色。

      '
  over_edit_trap: true
  provenance: orchestrator-reviewed
  notes: '§17.7 的正面样本：已经合格的流程，正确行为是基本不动。

