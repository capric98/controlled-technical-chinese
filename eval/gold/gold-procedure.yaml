- id: G-P-005
  category: instruction-review-mode
  task: review
  mode: review
  source: '## 告警抑制规则变更


    监控平台收到抑制规则更新后通知各采集端，随后重新加载规则文件。加载失败时保留旧规则，并在下一个周期重试。该文件位于 `/etc/alerting/rules.d/`，变更后须在值班群报备。

    '
  instruction: '以 review 模式审阅这段文档，报告问题，不要输出改写后的文档。

    '
  invariants:
  - kind: instruction
    detail: '输出须是问题清单，每条至少含位置、问题、风险与修改建议。不得返回整段改写后的文档；

      若输出主体是重写文本（即便另附简短说明），判为失败。

      '
  - kind: actor
    detail: '清单须报告「随后重新加载规则文件」的施事不可确定：既可读作监控平台重新加载，

      也可读作各采集端各自重新加载，二者决定故障时该查哪一侧。若清单只给出一种「正确写法」

      而不说明源文不足以判定，判为擅自决定。

      '
  - kind: reference
    detail: '`/etc/alerting/rules.d/` 是目录，单数「该文件」缺少唯一先行词。清单若报告这一点，属于合理发现，不得计为误报；但不报告它不判为失败——这一层粒度不作为正确审阅的必要条件。

      '
  - kind: over-edit
    detail: '「监控平台收到抑制规则更新后通知各采集端」施事明确且承前一致，不得作为施事缺失或

      被动语态问题报告；报告它判为误报。

      '
  protected_tokens:
  - '`/etc/alerting/rules.d/`'
  authorized_token_changes: []
  expected_issues:
  - category: actor-omission-ambiguous
    rule: CTC-A005
    severity: ERROR
    locus: 随后重新加载规则文件
  invalid_transformations:
  - output: '监控平台收到抑制规则更新后通知各采集端，各采集端随后重新加载 `/etc/alerting/rules.d/`

      下的规则文件。加载失败时保留旧规则，并在下一个采集周期重试。变更后须在值班群报备。

      '
    violated:
    - instruction
    - actor
    reason: 'review 模式被当成 rewrite；同时把加载方定为采集端、把「下一个周期」定为采集周期，

      两处都是源文没有的事实。

      '
  - output: '问题 1（ERROR，位置：随后重新加载规则文件）：施事缺失，应改为「各采集端随后重新加载规则文件」。

      问题 2（WARNING，位置：监控平台收到抑制规则更新后通知各采集端）：建议补充主语以避免歧义。

      '
    violated:
    - actor
    - over-edit
    reason: '问题 1 定位正确但把一种读法当成唯一答案，未说明源文无法判定；问题 2 是误报，

      该处施事已明确，误报会稀释真实问题。

      '
  over_edit_trap: false
  provenance: orchestrator-reviewed
  notes: '三项同时考：不重写、报告真问题、不报假问题。策展调整：「该文件」指代不明由必报降为可报不可罚，避免因粒度过细而让合格模型在错误的理由上失败。

    '
  source_file: r2-claude-cases.yaml
- id: G-P-006
  category: instruction-protected-region
  task: rewrite
  mode: standard
  source: '## 服务等级说明


    以下 `--- BEGIN CONTRACT ---` 与 `--- END CONTRACT ---` 之间为法务提供的对外承诺原文。


    --- BEGIN CONTRACT ---

    在任何情况下，服务提供方对于因不可抗力所导致的服务中断，不承担任何形式的赔偿责任。

    --- END CONTRACT ---


    运维侧的实际做法是这样的：在发生区域性故障的时候，会先把流量切换到备用区域，然后再进行根因的排查。在切换的过程当中，可能会出现最长 30 秒的写入不可用的情况。

    '
  instruction: '改写「运维侧的实际做法」一段，使其符合中文技术写作规范。`--- BEGIN CONTRACT ---` 与

    `--- END CONTRACT ---` 之间的内容是受保护区域，必须逐字保留，包括两行标记本身。

    '
  invariants:
  - kind: instruction
    detail: '受保护区域的三行（两行标记与其间正文）须在输出中字符级一致地出现。删除「在任何情况下」，

      把「不承担任何形式的赔偿责任」改成「不承担赔偿责任」，把「所导致的」改成「导致的」，

      或调整标点，均判为失败——即使改后的中文更自然。自然度不适用于受保护区域。

      '
  - kind: instruction
    detail: '受保护区域的位置与边界不变：不得在两行标记之间插入标题、注释或说明，不得把承诺原文

      移到标记之外，不得删除或改写标记行。

      '
  - kind: fact
    detail: '区域外的改写须保留两项事实：切换过程中最长 30 秒写入不可用；先切流量到备用区域、

      后排查根因的先后关系。

      '
  protected_tokens:
  - '--- BEGIN CONTRACT ---'
  - '--- END CONTRACT ---'
  - 在任何情况下，服务提供方对于因不可抗力所导致的服务中断，不承担任何形式的赔偿责任。
  authorized_token_changes: []
  invalid_transformations:
  - output: '--- BEGIN CONTRACT ---

      因不可抗力导致的服务中断，服务提供方不承担赔偿责任。

      --- END CONTRACT ---


      发生区域性故障时，先将流量切换至备用区域，再排查根因。切换期间最长 30 秒写入不可用。

      '
    violated:
    - instruction
    reason: '区域外的改写是合格的，但受保护区域被「顺手改自然」了：「在任何情况下」与「任何形式的」

      都是法务措辞，删除后责任范围的表述发生变化。受保护即不可改，与改得好不好无关。

      '
  - output: '## 服务等级说明


      法务承诺：在任何情况下，服务提供方对于因不可抗力所导致的服务中断，不承担任何形式的赔偿责任。


      发生区域性故障时，先将流量切换至备用区域，再排查根因。切换期间最长 30 秒写入不可用。

      '
    violated:
    - instruction
    reason: '承诺原文一字未改，但两行标记被删除、内容被移出受保护区域并加了前缀，

      下游按标记提取合同文本的流程会失效。

      '
  over_edit_trap: false
  provenance: orchestrator-reviewed
  notes: '受保护区域内故意放了译文腔文本，与「让中文更自然」的本能直接冲突。

    '
  source_file: r2-claude-cases.yaml
- id: G-P-007
  category: instruction-mode-scope
  task: rewrite
  mode: standard
  source: '### `GET /v1/reports/{id}/export`


