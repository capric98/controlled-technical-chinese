# 流程结构与指令遵循
# 由 tools/curate_cases.py 从 dev/inbox 提升而来；策展变更见 git 历史与 decision 002。
# provenance: orchestrator-reviewed —— 已由编排者按已接受语义审阅，尚未经人工复核。
cases:
- id: G-P-001
  category: procedure-missing-element
  task: rewrite
  mode: strict
  source: '## 灰度发布


    1. 将新版本发布到 5% 流量。

    2. 观察 10 分钟。

    3. 无异常则继续放量至 50%，再观察 10 分钟。

    4. 仍无异常则全量发布。

    '
  invariants:
  - kind: procedure
    detail: '源文缺少「结果」要素：第 2、3 步中「无异常」的判定依据——观察哪些指标、阈值是多少、由谁

      判定——在源文中不存在，也无法从上下文推得，因而每次放量的门禁是不可执行的。输出须让这一

      缺口保持可见：保留原措辞并标注待作者补充，或以问题形式指出。

      '
  - kind: fact
    detail: '输出中不得出现源文没有的指标名、阈值或判定方：出现「错误率低于 1%」「P99 延迟无上升」

      「5xx 比例」「无告警触发」「由发布负责人确认」等任何一项，判为凭空补全事实。

      '
  - kind: procedure
    detail: '放量档位 5% → 50% → 全量、两次「观察 10 分钟」的次数与时长不得增删或改值，

      也不得把两次观察合并成一次。

      '
  - kind: fact
    detail: '源文未规定出现异常时的处置动作。输出不得补写「异常则回滚」「异常则暂停放量」之类的分支。

      '
  protected_tokens:
  - 5%
  - 50%
  - 10 分钟
  authorized_token_changes: []
  invalid_transformations:
  - output: '2. 观察 10 分钟，确认错误率低于 1%、P99 延迟无明显上升。

      '
    violated:
    - fact
    - procedure
    reason: '指标与阈值均为源文所无。写进 runbook 后会被当成已批准的发布门禁，而没有任何人批准过 1%。

      '
  - output: '2. 观察 10 分钟；如有异常立即回滚至上一版本。

      '
    violated:
    - fact
    reason: '源文只说「无异常则继续」，没有规定异常时回滚、暂停还是上报。补写等于新增操作规程。

      '
  - output: '2. 观察一段时间后确认服务稳定。

      '
    violated:
    - procedure
    - fact
    reason: '把可执行的「10 分钟」抹成「一段时间」，用「稳定」替换同样不可判定的「无异常」，

      缺口没有被暴露，反而更难发现。

      '
  over_edit_trap: false
  provenance: orchestrator-reviewed
  notes: '考的是：识别出结果要素缺失，且不用自造的阈值把它补上。诱因极强。

    '
  source_file: r2-claude-cases.yaml
- id: G-P-002
  category: procedure-step-atomicity
  task: rewrite
  mode: strict
  source: "## 签名密钥轮换\n\n1. 通过单次 `PUT /v1/keyring` 请求完成换位：同一请求内把新密钥写入 `active` 槽位、\n   把当前密钥移入 `previous`\
    \ 槽位（服务端原子生效）。\n2. 等待边缘节点同步，最长 30 秒。\n3. 确认 `GET /v1/keyring/status` 返回的 `synced_nodes` 等于节点总数后，清空\
    \ `previous` 槽位。\n"
  invariants:
  - kind: procedure
    detail: '第 1 步的两次槽位写入必须留在同一个步骤、同一次 `PUT /v1/keyring` 请求内。输出若把

      「写入 `active`」与「移入 `previous`」拆成两个步骤或两次请求，判为改变行为：拆分后存在

      两个槽位不一致的中间状态，此期间到达的请求会验签失败。

      '
  - kind: procedure
    detail: '第 3 步中「`synced_nodes` 等于节点总数」是清空 `previous` 的前置校验。输出不得删除该校验，

      不得把清空动作提前到第 2 步或与第 2 步合并；未同步完成即清空旧密钥会使落后节点全部验签失败。

      '
  - kind: token
    detail: '`PUT /v1/keyring`、`active`、`previous`、`GET /v1/keyring/status`、`synced_nodes`

      须逐字保留。

      '
  protected_tokens:
  - '`PUT /v1/keyring`'
  - '`active`'
  - '`previous`'
  - '`synced_nodes`'
  authorized_token_changes: []
  invalid_transformations:
  - output: '1. 将新密钥写入 `active` 槽位。

      2. 将当前密钥移入 `previous` 槽位。

      3. 等待边缘节点同步，最长 30 秒。

      4. 确认 `GET /v1/keyring/status` 返回的 `synced_nodes` 等于节点总数后，清空 `previous` 槽位。

      '
    violated:
    - procedure
    reason: '「一步一动作」的机械拆分把一次原子请求写成了两次写入，制造出源文明确排除的中间状态。

      '
  - output: '2. 等待边缘节点同步（最长 30 秒）后清空 `previous` 槽位。

      3. 通过 `GET /v1/keyring/status` 查看 `synced_nodes`。

      '
    violated:
    - procedure
    reason: '同步校验由清空的前置条件降级为事后查看，未同步完成的节点会在旧密钥被清空后全部失败。

      '
  over_edit_trap: false
  provenance: orchestrator-reviewed
  notes: '对应 §17.4「拆分或重排步骤不得改变行为」，与 OC-03 的连动句拆分诱因。

    '
  source_file: r2-claude-cases.yaml
- id: G-P-003
  category: procedure-checkpoint-preservation
  task: rewrite
  mode: strict
  source: '## 扩容收尾


    1. 在新节点上启动 `chunk-server`。

    2. 在管理端确认新节点状态为 `READY`，且分片元数据已全部加载。

    3. 将新节点加入写入路由表。

    4. 观察 15 分钟无写入错误后，下线旧节点。

    '
  instruction: '合并可以合并的步骤，压缩到不超过 3 步，操作行为保持不变。

    '
  invariants:
  - kind: procedure
    detail: '第 2 步是「加入写入路由表」之前的人工核对点，包含两个必须分别确认的条件：状态为 `READY`、

      分片元数据已全部加载。无论如何压缩，输出中都必须存在一个位于「加入写入路由表」之前、

      由操作者执行、并同时列出这两个条件的确认动作。若两个条件只剩其一，或核对点消失，

      或被改写为不需要操作者动作的陈述（如「节点就绪后加入路由表」），判为删除校验点。

      '
  - kind: procedure
    detail: '「观察 15 分钟无写入错误」是下线旧节点的前置条件，不得删除或弱化为「随后下线旧节点」

      「确认无误后下线旧节点」；时长 15 分钟与判据「无写入错误」都必须保留。

      '
  - kind: instruction
    detail: '压缩指令不得凌驾于行为保持之上。若为满足「不超过 3 步」而丢掉任一校验条件，判为失败；

      输出步骤数超过 3 但校验完整，优于步骤数达标而校验丢失。

      '
  - kind: token
    detail: '`chunk-server`、`READY` 须逐字保留。

      '
  protected_tokens:
  - '`chunk-server`'
  - '`READY`'
  - 15 分钟
  authorized_token_changes: []
  invalid_transformations:
  - output: '1. 在新节点上启动 `chunk-server` 并加入写入路由表。

      2. 观察 15 分钟无写入错误后，下线旧节点。

      '
    violated:
    - procedure
    - instruction
    reason: '核对点整体消失。元数据尚未加载完就接收写入，会造成分片写到错误位置。

      '
  - output: '1. 在新节点上启动 `chunk-server`。

      2. 节点就绪后加入写入路由表。

      3. 观察 15 分钟无写入错误后，下线旧节点。

      '
    violated:
    - procedure
    reason: '「节点就绪」把两个具体核对条件压成一个模糊状态词，元数据加载条件丢失，且不再要求

      操作者在管理端主动确认。

      '
  - output: '1. 在新节点上启动 `chunk-server`，确认状态为 `READY` 后加入写入路由表。

      2. 下线旧节点。

      '
    violated:
    - procedure
    reason: '元数据加载条件与 15 分钟观察窗口同时被压缩掉，旧节点可能在新节点尚未稳定时就下线。

      '
  over_edit_trap: false
  provenance: orchestrator-reviewed
  notes: '指令本身诱导删校验点，考的是指令服从与行为保持冲突时的优先级。

    '
  source_file: r2-claude-cases.yaml
- id: G-P-004
  category: procedure-already-clear
  task: rewrite
  mode: strict
  source: '## 紧急回滚（目标 5 分钟内完成）


    1. 在发布平台点击「回滚到上一版本」，确认目标版本号为 `v3.14.2`。

    2. 回滚完成后刷新健康检查页，确认 `/healthz` 连续 3 次返回 `200`。

    3. 在 `#incident` 频道同步回滚结果与影响范围。

    '
  invariants:
  - kind: over-edit
    detail: '三步已含操作者（事故值班人，标题上下文唯一）、动作、对象与可验证结果，条件与顺序清晰，

      不存在歧义。输出若增加步骤数、为任一步补写显式主语、或把动作与确认拆成两句，

      判为过度改写（§17.7）。

      '
  - kind: procedure
    detail: '步骤数保持 3。第 2 步的「确认 `/healthz` 连续 3 次返回 `200`」是一个确认动作，

      不得拆成「刷新健康检查页」与「确认返回 200」两步。

      '
  - kind: fact
