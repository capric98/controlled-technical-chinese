  notes: '状语辖及并列谓语一项还是两项。诱因很强：模型倾向补一个「变更时」使句子看起来更合理。策展调整：原稿同时禁止「固定其中一种读法」，但汉语默认读法足够强，那样会因读者共识而误伤正确输出；现仅保留「不得虚构触发条件」这一无争议的半边。

