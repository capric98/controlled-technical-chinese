  rule_count: 29
  family_counts: {S: 7, A: 5, P: 5, T: 2, L: 4, R: 6}
  level_counts: {MUST: 19, SHOULD: 9, MAY: 1}
  must_ratio_note: >-
    19 of 29 rules are MUST, which is high for a rule set whose governing principle is minimality.
    Seven of them are the semantic core that 000-design.md §7.1 places above all stylistic
    preference, and four rest on failures demonstrated in D001 or in 002's own gold-case example.
    Every MUST carries the six items required by the admission gate. The candidates a synthesis
    pass should re-examine first, in order, are A002, P004 and S007: each is defensible but each
    could be a SHOULD that strict mode enforces, at the cost of losing its ERROR severity.
  conventions:
    pending_block: >-
      「待确认」is the single channel through which a rewrite reports what it refused to decide.
      Seven rules route into it — A005, P003, P005, R004, S002, S005, S001 (length cap) — and the
      list is closed (004 §1; 005 C1, C4); see modes[].output_contract.
    severity_mapping: MUST -> ERROR, SHOULD -> WARNING, MAY -> STYLE (000-design.md §28)
    detection_note: >-
      Per 002-gold-case-schema.md, `deterministic` is reserved for properties decidable by string
      or number comparison alone. Where a deterministic signal exists but the verdict needs
      judgement, the rule is `mixed` and `detection_note` names the computable part.

families:
  S: semantic preservation — truth conditions, modality, quantity, tokens, causality, scope
  A: ambiguity and reference — actor, reference expression, modifier/negation/coordination scope
  P: procedures and action structure — steps, operability, verification, guarded actions
  T: terminology — consistency of the concept-to-term mapping in both directions
  L: logic, conditions, temporal order, and the scope of conditions carried by document structure (005 C8)
  R: rendering and controlled style — minimal intervention, naturalness, structure, typography

priority_ladder:
  - level: 1
    name: truth-and-semantic-invariants
    means: >-
      The output asserts the same propositions as the source, with the same modal strength and
      speech-act type, the same conditions, exceptions and applicability scope, the same numbers,
      units, thresholds and comparators, the same causal strength, the same temporal relations,
      the same actor-action-object relations, and byte-identical protected tokens.
    overrides: >-
      Overrides levels 2-5 unconditionally. If a clearer, more consistent, more natural or more
      house-style-conformant wording changes any property above, the change is abandoned, not
      negotiated. Clarity gained by inventing content is not clarity (see A005).
  - level: 2
    name: operational-clarity
    means: >-
      A competent reader of the target document type can determine, without guessing, who does
      what to which object, under what condition, in what order, and how success is recognised.
    overrides: >-
      Overrides levels 3-5. May not be purchased by adding facts, actors, parameters or criteria
      not recoverable from the source or the invoking context; when clarity would require such an
      addition, level 1 wins and the gap is reported under 「待确认」.
  - level: 3
    name: terminology-consistency
    means: >-
      One concept keeps one term inside the unit of work; two distinct concepts keep two distinct
      terms. The preferred term is chosen from what the source and the invoking context already
      use, never from the model's own habit.
    overrides: >-
      Overrides levels 4-5. Yields to level 1 when unifying two surface forms would merge two
      concepts (T002) and to level 2 when the consistent term is genuinely ambiguous in context.
  - level: 4
    name: natural-technical-chinese
    means: >-
      Professional Chinese technical register: no translationese, no pseudo-legal padding, no
      mechanically repeated subjects, no artificial fragmentation, no needless passive.
    overrides: >-
      Overrides level 5 only. Naturalness may change wording; it may not change meaning
      (000-design.md §33). D001 is the demonstrated case of this boundary being crossed.
  - level: 5
    name: project-editorial-style
    means: >-
      Punctuation width, spacing between Chinese and Latin script, heading style, person and
      voice preferences, brand naming.
    overrides: none
priority_tie_breaks:
    - within_same_level: >-
        When two candidate edits sit at the same level, keep the form already present in the
        source. Minimal intervention (R001) is the tie-break, not the model's preference.
    - level_2_versus_level_4: >-
        An explicitness gain at level 2 outranks a naturalness loss at level 4 only when it removes
        an indeterminacy. Two kinds count: a divergent reading, and operational indeterminacy —
        which action, which object, which node. Writing out an action, object or location that the
        source or context determines removes the second kind; that is P002 and is licensed.
        Explicitness that removes neither kind is an R002 violation, not a level-2 win (005 C5).
    - level_1_unreachable: >-
        If level 2 cannot be reached without violating level 1, do not rewrite that span: leave it
        and report it. Silence about an ambiguity is a lesser failure than deciding it (D001 §5).
    - no_post_hoc_appeal: >-
        The ladder resolves conflicts between rules; it does not authorise edits by itself. Every
        edit must cite a rule id (R001). "This is more natural" is not a rule id.
    - level_confusion: >-
        A house-style or locale preference may not be promoted into a semantic rule to win an
        argument (000-design.md §7.5). Report it as STYLE or not at all.

ladder_layers:
  # 005 structural gap 1: without a layer per rule, 000-design.md §26's definition of SHOULD —
  # "may be overridden by a higher priority" — cannot be executed. Mirrors SKILL.md §2.
  by_family: {S: 1, L: 1, A: 2, P: 2, T: 3}
  by_rule:
    CTC-R001: cross-cutting   # governs how every layer is applied; no layer of its own
    CTC-R002: 4
    CTC-R003: 4
    CTC-R004: 2               # not in 005's list; placed by SKILL.md §2 (commit a0678b6) — see meta.revisions
    CTC-R005: 4
    CTC-R006: 5

modes:
  - id: strict
    use_for:
      - agent instructions and system prompts
      - tool and function descriptions
      - SOPs, runbooks, change procedures
      - operational and safety-sensitive procedures
      - troubleshooting instructions
      - warnings, alerts and error messages
    behavior: >-
      All rules apply. The ambiguity threshold is at its lowest: a reading counts as divergent if
      it is executable in the document's context and leads to a different action. Lowering the
      threshold makes more sites count as ambiguous and so triggers more A- and P-family rules;
      what changes is the trigger surface, not the level recorded here (004 §2). Severities exist
      only in review mode — a rewrite has no findings to grade — and the only permitted escalation
      is the one stated under modes[review] (005 C7, 004 §6). Conditions, prerequisites,
      exceptions, guards and success criteria are never dropped for brevity. Strict is not maximal
      verbosity (000-design.md §6.1).
    must_not: >-
      Must not invent an actor, parameter, threshold, criterion or failure cause in order to look
      explicit; must not repeat a subject that disambiguates nothing; must not split clauses into
      one-line fragments; must not raise descriptive text to normative text or a request to an
      obligation; must not add defensive warnings absent from the source.
    output_contract: >-
      Return the rewritten Chinese text only; Markdown structure, list granularity, code fences and
      inline code are kept per R005. No preamble, no explanation of the changes. The per-edit rule
      attribution R001 requires is internal discipline here and is not written into the output
      (005). If and only if unresolved items exist, append one final section headed 「待确认」
      containing at most one line per item, each as: 位置 | 问题 | 需要的信息 | 建议（可选）; the
      fourth column is filled only when a rule requires a suggestion (R004 on modal-strength
      hedges) and is otherwise omitted. The admissible items form a closed list of seven (004 §1;
      005 C1, C4): (1) an ambiguity evidence could not resolve (A005); (2) a success criterion the
      source never stated (P003); (3) a trigger condition missing from a tool description (P005);
      (4) an undefined normative criterion (R004); (5) information execution needs that neither
      source nor context supplies (S002); (6) a protected token whose source spelling is suspect
      (S005); (7) a caller-given length cap that cannot be met without deleting a condition or
      exception (S001). Nothing else enters. If there are none, the section is absent.
  - id: standard
    use_for:
      - API documentation
      - README-style technical documentation
      - developer guides
      - FAQs
      - release notes
      - explanatory technical prose
    behavior: >-
      All S, L and T rules apply unchanged: semantic invariants are mode-independent. A and P rules
      apply at their recorded level with a higher ambiguity threshold: a reading counts as divergent
      when an ordinary technical reader would plausibly disagree about it, not when a reading is
      merely constructible. Idiomatic compression, clause merging and topic-chaining are permitted
      wherever interpretation stays stable.
    must_not: >-
      Must not drop a condition, exception, threshold, default value or protected token in the name
      of concision; must not generalise an example or a specific value into a summary claim; must
      not treat compression as a licence to re-decide meaning.
    output_contract: >-
      Same as strict: rewritten text only, source structure preserved per R005, optional trailing
      「待确认」 section under the same four-column format and the same closed list of seven items.
  - id: review
    use_for:
      - auditing existing Chinese technical text
      - reviewing a candidate SKILL.md (self-hosting, 000-design.md §15)
      - pre-release gates
      - checking another model's rewrite
    behavior: >-
      Report; do not rewrite. Every finding cites one rule id, and a span of the reviewed text that
      is quoted verbatim. The ambiguity threshold follows the reviewed document's type: strict's
      threshold for agent instructions and runbooks, standard's for explanatory documents (004 §2).
      Severity follows the recorded level: MUST -> ERROR, SHOULD -> WARNING, MAY -> STYLE. The
      single permitted escalation: a SHOULD violation may be reported as ERROR only when the
      finding's 风险 field names the specific different action an operator would take as a result;
      no other escalation, and no de-escalation (004 §6). Suggested corrections are fragment-level
      and are proposals, not applied edits. Text that triggers no rule produces no finding; absence
      of findings is a valid result.
    must_not: >-
      Must not emit a whole-document rewrite; must not report a finding without a rule id; must not
      classify a style preference as ERROR (000-design.md §28); must not manufacture findings to
      appear thorough; must not edit the reviewed text, the gold cases, or the acceptance criteria
      after detecting a conflict (000-design.md §8, §15; 002 no-silent-edit rule).
    output_contract: >-
      A list of findings, each with exactly these fields: rule, severity, location (verbatim quoted
      span), problem, risk, suggestion. Ordered by severity then by document position. When nothing
      is found, return 「未发现违规」 followed by at most three STYLE observations.

rules:

  # ---------------------------------------------------------------- S: semantic preservation

  - id: CTC-S001
    family: S
    concept: assertion-set-preservation
    level: MUST
    scope: [rewrite, translate, review]
    modes: [strict, standard, review]
    trigger: "改写、压缩、合并或翻译一段已包含具体断言的技术文本。"
    requirement: "输出必须能还原来源中的每一条独立断言：对象、属性、行为、数值、条件、结果、失败分支。压缩只允许删除同一断言的重复表述与纯修饰成分。"
    prohibition: "删除一条独立断言；把一组并列断言概括为上位表述；把具体值或具体示例替换为「相关配置」「若干」「一些情况下」之类的占位说法；在合并句子时丢弃其中一个谓词。"
    exceptions: "调用方给定的长度上限不授权删除任何条件、例外、阈值、告警或失败分支；无法在不删除的前提下满足上限时，返回完全合规的最短文本，并在「待确认」（第 7 类）中说明上限未能满足。（005 C4：原「最后删除并说明」的例外与 L001 的 MUST 级冲突，已删除。）"
    invariant: "assertion-set-complete — 来源断言集合包含于输出断言集合。"
    detection: semantic
    detection_note: "确定性层可提供两个信号：输出长度显著下降；来源中出现的数值或标识符未出现在输出中（与 S004/S005 共用检查）。是否构成断言丢失由语义层判定。"
    examples:
      positive:
        source_zh: "网关在连续 3 次健康检查失败后将实例标记为不可用，并在 30 秒后重新检查该实例。"
        good_zh: "连续 3 次健康检查失败后，网关将实例标记为不可用，并在 30 秒后重新检查。"
      negative:
        source_zh: "网关在连续 3 次健康检查失败后将实例标记为不可用，并在 30 秒后重新检查该实例。"
        bad_zh: "健康检查失败后，网关会将实例标记为不可用。"
        why_bad: "「连续 3 次」与「30 秒后重新检查」两条断言被删除。读者会认为单次失败即摘除实例、且实例不会自动恢复，于是对一个本可自愈的抖动执行人工干预。"
      boundary:
        source_zh: "该接口返回 JSON 格式的响应，响应体使用 JSON 编码。"
        output_zh: "该接口返回 JSON 格式的响应。"
        why_not_triggered: "删除的是同一断言的重复表述，断言集合未变；这属于 R001 允许的最小改动。"
    justification: "压缩型改写最常见的失败：读者据以决策的限定条件被当作冗余删掉。"
    gate_evidence:
      failing_input: "网关在连续 3 次健康检查失败后将实例标记为不可用，并在 30 秒后重新检查该实例。"
      observed_bad_output: "健康检查失败后，网关会将实例标记为不可用。"
      risk: "运维据此判断实例不会自动恢复而手动重建实例，扩大故障影响面。"
      not_covered_by: "S004 只保护数值本身在输出中出现，不要求整条断言存在；把「30 秒后重新检查」整句删除时不会有数值被改写。L001 只覆盖条件与例外，不覆盖普通陈述性断言。"
      distinguishing_criterion: "逐条列出来源断言后在输出中定位；有一条无法定位且不属于重复表述，即失败。"

  - id: CTC-S002
    family: S
    concept: no-unsupported-addition
    level: MUST
    scope: [rewrite, translate, review, author]
    modes: [strict, standard, review]
    trigger: "输出中出现一条来源与调用上下文都没有给出、也无法由二者推出的命题。"
    requirement: "输出中的每一条命题必须可追溯到来源文本或调用方提供的上下文。缺失的信息以「待确认」提出，不以补写方式填平。"
    prohibition: "补写频率或典型性断言（「最常见的原因是」「通常」「一般来说」）；补写来源未给的默认值、上限、超时、重试次数；补写未经说明的失败原因；补写来源没有的告警或免责声明；把推测写成陈述。"
    exceptions: "author 模式下调用方提供的素材即为来源；把素材中的事实写入正文不算新增。翻译中补出目标语言必需的显性成分（如量词、连接词）在不引入新命题时不算新增。"
    invariant: "proposition-provenance — 输出命题集合包含于（来源 ∪ 上下文）命题集合的推论闭包。"
    detection: semantic
    detection_note: "确定性层可对一个小的高风险词表（通常、一般来说、最常见、大多数、默认、建议值）做出现差分并给出 WARNING；是否属于无据新增由语义层判定。"
    examples:
      positive:
        source_zh: "如果连接失败，检查代理配置。"
        good_zh: "连接失败时，请检查代理配置。"
      negative:
        source_zh: "如果连接失败，检查代理配置。"
        bad_zh: "连接失败时，请检查代理配置；该问题最常见的原因是代理地址配置错误。"
        why_bad: "来源未给出原因分布，「最常见的原因」是凭空引入的经验性断言。读者会先排查代理地址而跳过真正的原因，且无法分辨这一判断来自文档还是改写者。"
      boundary:
        source_zh: "磁盘写满会导致写入失败。请清理归档日志。"
        output_zh: "磁盘写满会导致写入失败，因此请先清理归档日志。"
        why_not_triggered: "「因此」表达的因果已由来源的「导致」给出，显式化未引入新命题，因果强度也未提升（参见 S006）。"
    justification: "解释性补全是改写模型最强的自发倾向，且补出的内容与原文在体例上无法区分。"
    gate_evidence:
      failing_input: "如果连接失败，检查代理配置。"
      observed_bad_output: "连接失败时，请检查代理配置；该问题最常见的原因是代理地址配置错误。"
      risk: "虚构的先验概率改变排查顺序；错误信息中的虚构原因会直接误导用户操作。"
      not_covered_by: "S001 是保留方向的规则（不得少），对多出来的内容不置一词。S006 只约束因果强度的改变，不覆盖新增的频率、默认值、参数等非因果命题。"
      distinguishing_criterion: "对输出中的每条命题回答「它在来源或上下文的哪一处」；答不出即失败。"

  - id: CTC-S003
    family: S
    concept: modality-and-speech-act-preservation
    level: MUST
    scope: [rewrite, translate, review, author]
    modes: [strict, standard, review]
    trigger: "来源含有情态词、义务表述、请求、许可、禁止、建议或对系统行为的描述性陈述。"
    requirement: "输出必须保持三项：认识情态强度（可能／会／一定）、道义情态强度（必须／应／建议／可以／不得）、以及言语行为类型（描述陈述／规范要求／请求／许可）。要求的行为类型本身也必须保持：要求「使其为真」不得降级为要求「核对是否为真」。"
    prohibition: "可能→会；建议→必须；请→须；确保→确认；不会→禁止；禁止→不建议；必须→应；描述性陈述→规范条款；规范条款→描述性陈述；把可选步骤写成必需步骤或反之。"
    exceptions: "同强度同类型的词形替换允许（不得↔禁止，应↔应当）。调用方明确要求调整规范强度时允许，且该调整不属于渲染决定。"
    invariant: "modality-profile — (认识强度, 道义强度, 言语行为类型) 三元组逐处不变。"
    detection: mixed
    detection_note: "确定性层对情态词表做出现剖面差分（可能／会／必须／应／建议／请／确保／确认／禁止／不得／可以），差异输出 WARNING；强度是否真的改变由语义层判定，因为合法改写可以改变表层词形。"
    examples:
      positive:
        source_zh: "如果证书已过期，握手可能失败。请确保在到期前 7 天完成轮换。"
        good_zh: "证书过期时，握手可能失败。请在到期前 7 天完成轮换。"
      negative:
        source_zh: "确保数据已备份，并且所有从节点都已同步主节点数据。"
        bad_zh: "确认数据备份完成，且所有从节点已与主节点数据同步。"
        why_bad: "「确保」要求操作者促成该状态，包含未达成时的补救义务；「确认」只要求观察当前是否为真。改写静默删除了补救义务，操作者在从节点未同步时会直接继续执行后续步骤。"
      boundary:
        source_zh: "不得在生产环境启用调试日志。"
        output_zh: "禁止在生产环境启用调试日志。"
        why_not_triggered: "「不得」与「禁止」同为禁止级道义情态，言语行为类型同为规范条款，词形变化未改变强度。"
    justification: "情态是中文技术文本中最容易被自然度改写顺手替换的成分，且替换后句子完全通顺，读者无从察觉。"
    gate_evidence:
      failing_input: "D001 §1: 确保数据已被成功备份，并且所有从节点都已正确地同步了主节点的数据。 / D001 §2: 如果你想在生产环境中部署该服务，请确保你已经配置了环境变量。 / D001 §4: 系统不会在工作时间重启主数据库并清空缓存。"
      observed_bad_output: "确认数据备份完成，且所有从节点已与主节点数据同步。 / 在生产环境部署该服务前，须完成环境变量配置。 / 工作时间内，系统禁止重启主数据库，亦禁止清空缓存。"
      risk: "义务降级为核验会删除补救责任；请求升级为义务会替作者做出规范决定；描述升级为禁令改变了真值条件与受众——前者描述系统行为，后者向人下达规则。"
      not_covered_by: "三例都发生在一次自称 meaning_delta: none 的自然度改写中（D001），即「保持语义」的一般性要求不足以阻止它。S001 不触发：没有任何断言消失，只是强度与言语行为类型变了。R003 反译文腔规则本身就是驱动这些替换的力量，不可能同时约束它们。"
      distinguishing_criterion: "对来源与输出逐句抽取 (认识强度, 道义强度, 言语行为类型)；任一处不同即失败。该判据可作为 gold case 的 invariant kind: modality 直接使用。"

  - id: CTC-S004
    family: S
    concept: quantity-preservation
    level: MUST
    scope: [rewrite, translate, review, author]
    modes: [strict, standard, review]
    trigger: "来源含有数值、单位、范围、精度、日期、时长、次数、大小、比例或状态码。"
    requirement: "数值与其单位必须逐一保留且不改变精度。范围的两端、日期、时长、重试次数、超时值与配额都按来源给出的形式保留。"
    prohibition: "把精确值改为约数（500 ms→约 0.5 秒）；静默换算单位；提高或降低精度；把可枚举的次数写成「若干」「多次」；把两个数值合并为一个区间；改动状态码。"
    exceptions: "呈现层的数字形式变化允许（三次→3 次，1,000→1000）。来源自身给出换算（5000 毫秒（5 秒））时，保留任一形式都可以。"
    invariant: "quantity-multiset — (数值, 单位) 多重集不变；精度不变。"
    detection: mixed
    detection_note: "确定性层做 (value, unit) 多重集相等比较，不等即 ERROR（002 两层验证）。仅当来源与输出使用不同表达形式（中文数字、换算单位）时需要语义层确认等值。"
    examples:
      positive:
        source_zh: "重试间隔为 500 ms，最多重试 3 次；两次重试之间不做退避。"
        good_zh: "重试间隔 500 ms，最多重试 3 次，两次重试之间不做退避。"
      negative:
        source_zh: "重试间隔为 500 ms，最多重试 3 次；两次重试之间不做退避。"
        bad_zh: "重试间隔约 0.5 秒，可重试若干次，其间不做退避。"
        why_bad: "「3 次」被抹成「若干」，实施者无法配置；单位由毫秒静默换算为秒，而对应配置项以毫秒为单位，按 0.5 填写会得到 0.5 ms 的重试间隔。"
      boundary:
        source_zh: "最多重试三次。"
        output_zh: "最多重试 3 次。"
        why_not_triggered: "中文数字改为阿拉伯数字属于呈现层格式，数值、单位与精度均未改变。"
    justification: "数值是技术文档中唯一可以被确定性验证的语义成分，也是被「读起来更顺」改写顺手模糊掉的成分。"
    gate_evidence:
      failing_input: "超时时间为 5000 毫秒，超过该值的请求按失败处理。"
      observed_bad_output: "超时时间约为 5 秒，超时的请求按失败处理。"
      risk: "配置字段单位为毫秒，读者按「5」填写得到 5 毫秒超时，所有请求立即失败；「约」还把一个精确配置值变成了估计值。"
      not_covered_by: "S001 不触发：断言仍在，只是值被替换。S005 只保护标记形式的内容，裸露在中文句子里的数值不属于受保护标记。S003 不覆盖数值。"
      distinguishing_criterion: "抽取来源与输出的 (数值, 单位) 多重集并比较；差异即失败，除非语义层确认为等值的呈现形式变化。"

  - id: CTC-S005
    family: S
    concept: protected-token-and-region-preservation
    level: MUST
    scope: [rewrite, translate, review, author]
    modes: [strict, standard, review]
    trigger: "文本含有代码、命令、路径、标识符、字段名、API 名、URL、状态码、占位符、正则、配置键、错误码，或行内代码与代码块。"
    requirement: "受保护标记逐字符不变，包括大小写、连字符、下划线、点号与斜杠。行内代码与围栏代码块的内部内容整体不改动，语言标注保留。占位符（`{project_id}`、`<region>`）按原形保留。"
    prohibition: "翻译标识符；改动大小写或分隔符；把标记内的半角符号改为全角；改写代码块内容；把命令替换为对命令的描述；替换或补全占位符；规范化 URL。"
    exceptions: "调用方显式授权的改动（对应 002 的 `authorized_token_changes`）；代码块之外的自然语言照常改写；受保护标记本身的拼写疑似有误时保持原样，按「待确认」第 6 类提出（005 C1）。判定按顺序做（005 C6）：出现在代码标记内，或被用作命令、路径、标识符、字段名或取值的字符串，是受保护标记；在正文中作普通名词使用的产品名与项目名（Node-RED、GitLab、.NET）不是——其拼写、大小写与连字符仍逐字符保留且不得翻译，但可以在句中改变位置。"
    invariant: "protected-token-multiset — 受保护标记多重集在来源与输出之间相等。"
    detection: deterministic
    detection_note: "002 确定性层：受保护标记多重集相等，不等即 ERROR。无需语义判断。"
    examples:
      positive:
        source_zh: "执行 `kubectl rollout restart deployment/api-gateway`，然后检查 `/healthz` 是否返回 200。"
        good_zh: "执行 `kubectl rollout restart deployment/api-gateway`，随后确认 `/healthz` 返回 200。"
      negative:
        source_zh: "执行 `kubectl rollout restart deployment/api-gateway`，然后检查 `/healthz` 是否返回 200。"
        bad_zh: "执行 `kubectl rollout restart deployment/api网关`，然后检查健康检查接口是否返回 200。"
        why_bad: "标识符被部分翻译，命令粘贴后不可执行；`/healthz` 被替换为描述性说法，读者无法知道该请求哪个路径。"
      boundary:
        source_zh: "把 `retry_count` 配置项改为 5。"
        output_zh: "将配置项 `retry_count` 改为 5。"
        why_not_triggered: "标识符原样保留，只调整了它周围中文成分的语序。"
    justification: "机器可读内容一旦被自然语言化处理就不可逆地失效，且这是全部规则中唯一可以完全脱离模型判断来验证的一类。"
    gate_evidence:
      failing_input: "执行 `kubectl rollout restart deployment/api-gateway`，然后检查 `/healthz` 是否返回 200。"
      observed_bad_output: "执行 `kubectl rollout restart deployment/api网关`，然后检查健康检查接口是否返回 200。"
      risk: "命令失败或作用于错误对象；在运维场景下这可能是不可逆操作作用于错误目标。"
      not_covered_by: "S001 与 S002 都是语义层规则，需要模型判断；标记突变必须在语义层之前被确定性地拦截（000-design.md §24，002 两层验证）。R006 是 MAY 级排版规则，强度不足以承担此项。"
      distinguishing_criterion: "抽取两侧受保护标记多重集比较相等；差异即 ERROR，不进入语义层讨论。"

  - id: CTC-S006
    family: S
    concept: causal-strength-preservation
    level: MUST
    scope: [rewrite, translate, review, author]
    modes: [strict, standard, review]
    trigger: "来源陈述了两个事件、状态或指标之间的关系，或多处并列陈述可能被读作因果链。"
    requirement: "因果强度与方向保持不变：同现保持同现，可能导致保持可能，机制性因果保持因果，一种原因不写成唯一原因。"
    prohibition: "同现或相关升格为因果；「可能导致」写成「导致」；「一种原因」写成「根本原因」；因果方向反转；把仅有时间先后的两句用「因此／从而／由于」连成因果；把因果降级为单纯时序。"
    exceptions: "来源已明确给出因果时，可以改换连接词（由于／因此／导致／引起）而不改变强度；补出的连接词所表达的关系必须已由来源给出。"
    invariant: "causal-profile — (原因, 结果, 强度∈{同现, 可能导致, 导致, 唯一原因}) 三元组不变。"
    detection: semantic
    detection_note: "确定性层可对因果连接词（导致、引起、因此、由于、从而、根本原因）做出现差分并给出 WARNING；强度是否改变由语义层判定。"
    examples:
      positive:
        source_zh: "在这些实例上，超时错误与磁盘 IO 饱和同时出现。"
        good_zh: "这些实例上的超时错误与磁盘 IO 饱和同时出现。"
      negative:
        source_zh: "在这些实例上，超时错误与磁盘 IO 饱和同时出现。"
        bad_zh: "磁盘 IO 饱和导致这些实例出现超时错误。"
        why_bad: "同现被升格为因果。排障人员据此扩容磁盘，真正的原因（例如连接池耗尽）未被处理，故障持续，而文档看起来已经给出了结论。"
      boundary:
        source_zh: "该错误通常由证书过期引起。"
        output_zh: "证书过期通常会引起该错误。"
        why_not_triggered: "只调换了因果句的语序，强度限定词「通常」保留，因果方向与强度均未变。"
    justification: "因果升级让文本显得更有解释力，因此是自发改写的强吸引子；而降级（因果写成时序）同样常见于压缩改写。"
    gate_evidence:
      failing_input: "在这些实例上，超时错误与磁盘 IO 饱和同时出现。"
      observed_bad_output: "磁盘 IO 饱和导致这些实例出现超时错误。"
      risk: "排障方向被错误锁定；在故障复盘文档中，虚假因果会固化为组织认知。"
      not_covered_by: "S002 只覆盖新增命题；此处没有新增句子，而是改变了两个既有成分之间关系的强度，且反方向的失败（导致→之后）是一次弱化而非新增，S002 在结构上无法覆盖。S003 覆盖情态强度，不覆盖因果强度。"
      distinguishing_criterion: "抽取两侧的 (原因, 结果, 强度) 三元组比较；强度档位不同即失败。"

  - id: CTC-S007
    family: S
    concept: quantifier-and-applicability-scope-preservation
    level: MUST
    scope: [rewrite, translate, review, author]
    modes: [strict, standard, review]
    trigger: "来源含有量化词（所有、每个、部分、某些、任一、另一个、仅、只有）或对适用对象集合的限定。"
    requirement: "量化强度（全称／存在／特指／排他）与规则适用的对象集合保持不变。"
    prohibition: "部分→全部；全部→部分；特指的「另一个 X」→开放集合的「其他 X」；带限定的适用范围→无限定；每次→首次；把「仅限于某类对象」的限定删除。"
    exceptions: "同强度量化词的替换允许（所有↔每个↔任何一个）。"
    invariant: "quantification-profile — 每个量化位置的 (量化类型, 论域) 不变。"
    detection: mixed
    detection_note: "确定性层可对量化词表（所有、全部、每个、部分、某些、任一、另一个、其他、仅、只有、首次、每次）做出现差分并给出 WARNING；论域是否改变由语义层判定。"
    examples:
      positive:
        source_zh: "部分区域尚未开放该功能。"
        good_zh: "该功能在部分区域尚未开放。"
      negative:
        source_zh: "由于该资源正在被另一个进程占用的事实，当前请求已被拒绝。"
        bad_zh: "因该资源正被其他进程占用，当前请求已被拒绝。"
        why_bad: "删除「的事实」这一文腔结构是正当改进，但「另一个进程」特指某一个占用者，「其他进程」是开放集合。在错误信息中读者据此决定是否重试：特指单个占用者时重试通常很快成功，开放集合则暗示持续争用。"
      boundary:
        source_zh: "所有请求都必须携带 `Authorization` 头。"
        output_zh: "每个请求都必须携带 `Authorization` 头。"
        why_not_triggered: "「所有」与「每个」在此同为全称量化，论域同为请求集合，量化剖面未变。"
    justification: "量化词短、无重音、在中文里常被视作可省的赘词，因此是压缩改写中最不设防的语义成分。"
    gate_evidence:
      failing_input: "D001 §6: 由于该资源正在被另一个进程占用的事实，当前请求已被拒绝。 另一例：部分区域尚未开放该功能。"
      observed_bad_output: "因该资源正被其他进程占用，当前请求已被拒绝。 / 该功能尚未开放。"
      risk: "第一例改变用户的重试决策；第二例把存在量化升格为全称，用户与支持人员会认为该功能在所有区域都不可用，从而放弃可用区域的部署。"
      not_covered_by: "D001 §6 是在一次自称保持语义的自然度改写中发生的，说明一般性的保义要求不足。S001 不触发：没有断言消失，句子结构完整。S003 不覆盖量化，L002 覆盖的是条件的逻辑方向而非论域大小。"
      distinguishing_criterion: "抽取每个量化位置的 (量化类型, 论域) 比较；类型或论域不同即失败，可直接用作 gold case 的 invariant kind: quantifier。"

  # ---------------------------------------------------------- A: ambiguity and reference

  - id: CTC-A001
    family: A
    concept: actor-preservation-and-disambiguation
    level: MUST
    scope: [rewrite, translate, review, author]
    modes: [strict, standard, review]
    trigger: "来源指明了某个动作的执行者；或来源省略了执行者，而上下文中存在两个以上可能的执行者，且不同读法会改变由谁执行。"
    requirement: "来源中出现的执行者必须在输出中仍可定位，包括被动句中的施事。省略执行者的句子，只有在存在多个可能执行者且不同读法改变谁去做时才补出执行者，且补出的执行者必须能从来源或上下文确定。"
    prohibition: "删除具名执行者（包括在改为被动、自动化或无主句表述时）；把具名组件替换为更笼统的称呼（存储管理机制→系统）；在只有一个可能执行者时逐句补出主语；凭猜测补出执行者。"
    exceptions: "本规则不要求每个句子都有显性主语（000-design.md §7.2）；中文话题链中承前省略主语是正常且首选的。被动句本身不受限制：受限制的是删除施事，不是使用被动（参见 R003）。"
    invariant: "actor-binding — 每个动作的 (施事, 受事) 绑定不变；来源中的具名施事在输出中仍可定位。"
    detection: semantic
    examples:
      positive:   # 005 self-demonstration: the earlier good_zh swapped 销毁→清理 (T002) and added 自动 (S002)
        source_zh: "磁盘空间不足时，旧快照数据会被存储管理机制销毁。"
        good_zh: "磁盘空间不足时，存储管理机制会销毁旧快照数据。"
      negative:
        source_zh: "存储管理机制会在磁盘空间不足时把旧快照数据销毁。"
        bad_zh: "磁盘空间不足时，旧快照会被自动清理。"
        why_bad: "具名执行者「存储管理机制」被删除。事故响应人需要知道是哪个组件在删数据，才能查它的日志、改它的策略；「会被自动清理」把一个可定位的组件变成了不可定位的系统行为。"
      boundary:
        source_zh: "调用 `GET /v1/jobs/{id}` 查询任务状态；若状态为 `failed`，读取 `error.code` 定位原因。"
        output_zh: "调用 `GET /v1/jobs/{id}` 查询任务状态；若状态为 `failed`，读取 `error.code` 定位原因。"
        why_not_triggered: "上下文中只有一个可能的执行者（接口调用方）。补出主语不消除任何歧义，只会造成逐句重复的主语（R002）。"
    justification: "执行者既会在压缩时被删掉，也会在追求显式时被无据补出；两种失败方向都需要同一条规则来界定。"
    gate_evidence:
      failing_input: "D001 §3: 存储管理机制会在磁盘空间不足时把旧快照数据销毁。"
      observed_bad_output: "磁盘空间不足时，旧快照会被自动清理。"
      risk: "排障时无法定位是哪个组件删除了数据，也无法找到对应的保留策略配置；在数据丢失事件中这是关键信息。"
      not_covered_by: "该删除发生在一次正当的去被动化改进中（D001 §3 明确指出被动本身无问题），因此 R003 反译文腔规则不但不能拦截它，反而是它的动机。S001 不触发：改写后动作与受事仍在，消失的是施事这一成分而非一条断言，语义层若只比对断言集合会判为通过。"
      distinguishing_criterion: "列出来源中所有具名施事，在输出中逐一定位；有一个无法定位即失败（gold case 的 invariant kind: actor）。"

  - id: CTC-A002
    family: A
    concept: reference-resolvability
    level: MUST
    scope: [rewrite, translate, review, author]
    modes: [strict, standard, review]
    trigger: "输出中出现指代成分（它、其、该、这、此、上述、前者、后者），且在其可及范围内存在两个以上可能的先行词。"
    requirement: "每个指代成分必须有唯一可确定的先行词。若合并句子或压缩会造成先行词竞争，改用名词回指或调整语序。"
    prohibition: "通过合并句子制造指代竞争；把唯一明确的名词替换为「其」「该」；在存在多个先行词时按就近原则默认取一个（该情形转 A005）。"
    exceptions: "先行词唯一时保持指代成分不变；不得为求显式把每个「其」都展开为名词，那会造成 R002 的冗余。"
    invariant: "reference-binding — 每个指代成分到先行词的映射唯一且与来源一致。"
    detection: semantic
    examples:
      positive:
        source_zh: "任务队列积压时，先扩容消费者，再清理死信队列。清理前必须确认死信队列已停止写入。"
        good_zh: "任务队列积压时，先扩容消费者，再清理死信队列；清理前必须确认死信队列已停止写入。"
      negative:
        source_zh: "任务队列积压时，先扩容消费者，再清理死信队列。清理前必须确认死信队列已停止写入。"
        bad_zh: "任务队列积压时，先扩容消费者，再清理死信队列；清理前必须确认其已停止写入。"
        why_bad: "「其」可指消费者、死信队列或任务队列。若读作任务队列，操作员会等待一个在积压场景下不会满足的条件，流程停滞在一个没有出口的等待上。"
      boundary:
        source_zh: "该接口返回分页结果，其中 `next_cursor` 为空表示没有更多数据。"
        output_zh: "该接口返回分页结果，其中 `next_cursor` 为空表示没有更多数据。"
        why_not_triggered: "「其中」只有一个可能先行词（分页结果），不存在竞争；展开为名词只会增加冗余。"
    justification: "句子合并是改写最常见的操作，而中文的「其／该」在合并后极易同时获得多个可及先行词。"
    gate_evidence:
      failing_input: "任务队列积压时，先扩容消费者，再清理死信队列。清理前必须确认死信队列已停止写入。"
      observed_bad_output: "…；清理前必须确认其已停止写入。"
      risk: "前置条件被绑定到错误对象，操作员或者停滞、或者跳过一个真实的前置检查执行清理，造成消息丢失。"
      not_covered_by: "S001 不触发：信息在理论上仍可从上下文推断，没有断言消失。A001 只覆盖施事，此处被指代的是受事对象。这是改写动作本身制造出的新歧义，任何保留型规则都不覆盖。"
      distinguishing_criterion: "对输出中每个指代成分枚举其可及先行词；数量大于 1 且不同选择改变操作对象即失败。"

  - id: CTC-A003
    family: A
    concept: attachment-scope-ambiguity
    level: SHOULD
    scope: [rewrite, translate, review, author]
    modes: [strict, standard, review]
    trigger: "一个修饰或限定成分（定语、数量限定、时间限定、路径限定、否定以外的算子）在字面上可以只作用于第一个并列项，也可以作用于全部并列项，且两种结合方式对应不同的操作对象集合。"
    requirement: "当两种结合方式导致不同操作结果时，应通过重复中心语、拆分并列项、调整语序或分句消除结合歧义。所选读法必须有来源或上下文证据；无证据时转 A005 报告，不得改写。"
    prohibition: "在无证据的情况下通过改写把某一种结合读法固化；把原本只作用于一项的限定扩展到全部并列项。"
    exceptions: "两种读法导致相同操作结果时不触发；正常的中文多层定语不因长度或嵌套触发本规则。"
    invariant: "attachment-set — 每个限定成分所作用的成分集合与来源一致。"
    detection: semantic
    examples:
      positive:
        source_zh: "清理超过 7 天的容器日志和镜像缓存。两者的保留期相同。"
        good_zh: "清理超过 7 天的容器日志，以及超过 7 天的镜像缓存。"
      negative:
        source_zh: "清理超过 7 天的容器日志和镜像缓存。镜像缓存的回收由 `image_gc` 策略单独控制。"
        bad_zh: "清理超过 7 天的容器日志与镜像缓存，两者均按 7 天保留。"
        why_bad: "限定被固化为作用于两个并列项，与下一句「由 `image_gc` 单独控制」直接矛盾；仍在被引用的镜像缓存会被删除，随后的部署因缺少基础镜像而失败。"
      boundary:
        source_zh: "备份数据库的配置文件和数据目录。"
        output_zh: "备份数据库的配置文件和数据目录。"
        why_not_triggered: "「数据库的」作用于两个并列项是唯一合理读法；另一读法（备份任意位置的配置文件）不对应任何可执行操作，不产生分歧的操作结果。"
    justification: "中文并列结构不标记分组，「A 的 B 和 C」在技术文本里是稳定的歧义源，且改写时极易被顺手统一。"
    gate_evidence:
      failing_input: "清理超过 7 天的容器日志和镜像缓存。镜像缓存的回收由 `image_gc` 策略单独控制。"
      observed_bad_output: "清理超过 7 天的容器日志与镜像缓存，两者均按 7 天保留。"
      risk: "删除范围被扩大到仍在使用的对象；在清理类脚本文档中这是不可逆操作。"
      not_covered_by: "S007 覆盖量化词本身的强度，不覆盖修饰语与并列项的结合方式。A005 规定无证据时不得择一，但不给出有证据时的修复方式，也不把结合歧义定义为一个需要主动识别的触发条件。"
      why_defeasible: "结合歧义的判定依赖领域知识：某些结合在专业读者看来只有一种读法。定为 MUST 会让规则在正常多层定语上大量误触发，产生 R002 式的过度显式化。strict 模式降低的是歧义阈值：更多结合歧义会被判为改变操作对象而触发本规则；级别与严重级不变（004 §2，005 C7）。"
      distinguishing_criterion: "对每个限定成分枚举可能的作用集合；集合数大于 1 且对应不同操作对象，而输出未消歧或消歧无证据，即为 WARNING。"

  - id: CTC-A004
    family: A
    concept: negation-scope-preservation
    level: MUST
    scope: [rewrite, translate, review, author]
    modes: [strict, standard, review]
    trigger: "否定或禁止成分（不、未、不会、不得、禁止、无需）在其后跟随并列成分、条件成分或范围限定成分。"
    requirement: "否定的作用域必须与来源一致：分别否定保持分别否定，对合取的否定保持对合取的否定。改写时通过重复否定词或拆句把作用域固定下来。"
    prohibition: "把「禁止 A，也禁止 B」改写为「禁止同时 A 和 B」或反向；把「不在条件 C 下做 A」改写为「不做 A」；把否定移到条件之外或之内从而改变其覆盖范围。"
    exceptions: "作用域唯一时保持原表述；当来源的否定作用域本身歧义且无证据可判时，转 A005 报告，不得择一改写。"
    invariant: "negation-scope — 否定算子所辖成分集合不变。"
    detection: semantic
    detection_note: "确定性层可对否定词出现次数做差分（分别否定改为合取否定时否定词数量通常从 2 降为 1），作为 WARNING 信号；作用域判定属语义层。"
    examples:
      positive:
        source_zh: "维护窗口外，系统不会重启主数据库并清空缓存。两项操作都只在维护窗口内执行。"
        good_zh: "维护窗口外，系统不会重启主数据库，也不会清空缓存；两项操作都只在维护窗口内执行。"
      negative:
        source_zh: "业务高峰期禁止重启网关，也禁止清空缓存。"
        bad_zh: "业务高峰期禁止同时重启网关和清空缓存。"
        why_bad: "两项分别的禁止被改写为只禁止并发执行，操作员会认为高峰期单独清空缓存是允许的，从而在高峰期触发缓存击穿。"
      boundary:
        source_zh: "未通过健康检查的实例不会接收流量。"
        output_zh: "健康检查未通过的实例不接收流量。"
        why_not_triggered: "两个否定各自作用于原来的成分，改写只调整了定语语序，不存在竞争作用域。"
    justification: "否定作用域的错误会反转一条禁令的适用范围，而句子在两种读法下都完全通顺。"
    gate_evidence:
      failing_input: "业务高峰期禁止重启网关，也禁止清空缓存。（相关歧义源见 D001 §4：系统不会在工作时间重启主数据库并清空缓存。）"
      observed_bad_output: "业务高峰期禁止同时重启网关和清空缓存。"
      risk: "一条禁令被缩小到只覆盖并发情形，被禁止的单项操作变为看似允许；这类错误在告警与安全策略文本中直接导致违规操作。"
      not_covered_by: "S001 不触发：两个动作与否定词都还在。S003 不触发：情态仍为禁止级、言语行为类型仍是规范条款，变的是所辖范围。A003 覆盖修饰语与并列项的结合，但其判据是操作对象集合，无法表达「否定覆盖合取还是覆盖各项」这一区别。"
      distinguishing_criterion: "把两侧的否定表达式还原为 ¬(A∧B) 或 (¬A)∧(¬B) 后比较；形式不同即失败。"

  - id: CTC-A005
    family: A
    concept: ambiguity-resolution-requires-evidence
    level: MUST
    scope: [rewrite, translate, review, author]
    modes: [strict, standard, review]
    trigger: "来源存在两种以上读法且导致不同行为，而来源与调用上下文都不足以确定作者意图；或来源缺少执行所需的参数、阈值、接收方、判据。"
    requirement: "保持原有表述不做消歧改写，并在「待确认」中给出：位置、两种（或多种）读法或缺失项、判定所需的信息。review 模式下作为一条 finding 报告。"
    prohibition: "静默选定一种读法；用改写把歧义掩盖成流畅句子；补出缺失参数以使文本看起来可执行；在同一处既消歧又替换关键动词，使两处改动无法分别审查。"
    exceptions: "调用方明确授权在指定读法下改写时，按授权执行并在「待确认」中记录所选读法。当一种读法在该领域中不可能成立（不对应任何可执行操作）时，不算真歧义。"
    invariant: "ambiguity-conserved — 未获证据的歧义在输出中仍然存在，且被显式报告。"
    detection: semantic
    examples:
      positive:
        source_zh: "超时后重试，多次失败则升级处理。"
        good_zh: |-
          超时后重试；多次失败则升级处理。

          待确认
          - 多次失败 | 「多次」未给出具体次数 | 触发升级的失败次数阈值
          - 升级处理 | 未给出升级的接收方与方式 | 升级对象（值班组／工单系统）
      negative:
        source_zh: "隔离受感染的主机和网关通信。"
        bad_zh: "阻断受感染主机与网关之间的通信链路。"
        why_bad: "来源有两种读法：(a) 隔离受感染主机，并隔离网关通信；(b) 切断受感染主机与网关之间的通信。改写静默选定 (b)，同时把「隔离」换成「阻断」。应急响应中两种读法对应不同的处置范围，选错会留下未隔离的主机，而输出读起来完全确定，审查者不会再回头看原文。"
      boundary:
        source_zh: "若响应返回 429，按 `Retry-After` 指定的秒数等待后重试。"
        output_zh: "若响应返回 429，按 `Retry-After` 指定的秒数等待后重试。"
        why_not_triggered: "「指定的秒数」由响应头在运行时唯一确定，不是未定义参数；把它替换成一个具体数字才会触发本规则（同时违反 S002）。"
    justification: "A001-A004 都要求消除歧义，本规则给出它们的上限：消歧不得以制造事实为代价，且必须留下可审查的痕迹。"
    gate_evidence:
      failing_input: "D001 §5: 隔离受感染的主机和网关通信。"
      observed_bad_output: "阻断受感染主机与网关之间的通信链路。"
      risk: "选定一种读法等于替作者做出未经授权的技术决定，且改写后的文本不再显示曾经存在过歧义，后续审查者失去了发现它的机会。"
      not_covered_by: "S002 禁止新增命题，但不规定遇到歧义时应当做什么；没有本规则，S002 的合规做法可以是「什么都不改也不说」，歧义随之被静默带入下游。A001-A004 单独作用时都会推动模型去消歧，需要一条明确的兜底规则来约束它们。"
      distinguishing_criterion: "对来源可枚举出多于一种导致不同行为的读法，而输出只呈现一种且「待确认」中无对应条目，即失败。"

  # ------------------------------------------------- P: procedures and action structure

  - id: CTC-P001
    family: P
    concept: step-decomposition-safety
    level: MUST
    scope: [rewrite, translate, review, author]
    modes: [strict, standard, review]
    trigger: "改写涉及步骤的拆分、合并、编号或重排；或来源用一句话描述了包含多个操作的过程。"
    requirement: "一个步骤对应一个可验证的操作目标。拆分或合并之后，执行顺序、原子性约束（必须在同一维护窗口、同一事务、同一会话内完成）与可回滚点必须与来源一致；原子性约束必须显式落在它所约束的那一组动作上。"
    prohibition: "把带原子性约束的一组动作拆成互不引用的独立步骤；把有依赖关系的步骤合并成一句从而抹掉顺序；把约束保留下来却挂到错误的步骤上；按「一句一动词」机械拆分。"
    exceptions: "本规则不采用「一句一动词」（000-design.md §7.3）。多个动作构成同一操作目标时保持在同一步骤内。调用方明确要求逐条编号时，仍须保留原子性约束。"
    invariant: "step-graph — (步骤集合, 顺序依赖, 原子性分组, 回滚点) 与来源一致。"
    detection: semantic
    examples:
      positive:
        source_zh: "在同一维护窗口内停止写入并创建快照，然后卸载数据卷。"
        good_zh: |-
          1. 停止写入，并在同一维护窗口内创建快照。
          2. 卸载数据卷。
      negative:
        source_zh: "在同一维护窗口内停止写入并创建快照，然后卸载数据卷。"
        bad_zh: |-
          1. 停止写入。
          2. 创建快照。
          3. 在同一维护窗口内卸载数据卷。
        why_bad: "约束文字被保留，却绑定到了错误的步骤：需要落在同一窗口内的是「停止写入」与「创建快照」这一对操作。逐条比对断言看不出任何丢失，执行结果却是一个在写入恢复之后创建的、不一致的快照——而该快照正是回滚依据。"
      boundary:
        source_zh: "执行 `make build` 并运行 `make test`。"
        output_zh: |-
          1. 执行 `make build`。
          2. 运行 `make test`。
        why_not_triggered: "两个命令之间只有先后关系，没有原子性约束，拆分不改变执行语义，也没有引入新的失败模式。"
    justification: "步骤边界本身携带操作语义；改写模型把编号视为排版，因而会自由地拆合。"
    gate_evidence:
      failing_input: "在同一维护窗口内停止写入并创建快照，然后卸载数据卷。"
      observed_bad_output: "1. 停止写入。 2. 创建快照。 3. 在同一维护窗口内卸载数据卷。"
      risk: "得到一个不一致的快照，且这一点只有在真正需要回滚时才会暴露。"
      not_covered_by: "S001 不触发：所有断言（含约束短语）都在输出中。L003 覆盖动作之间的先后关系，不覆盖「哪些动作必须落在同一时间窗口内」这一分组关系；先后关系在坏输出中恰好是正确的。"
      distinguishing_criterion: "抽取两侧的 (步骤, 顺序依赖, 原子性分组)；分组归属不同即失败。"

  - id: CTC-P002
    family: P
    concept: step-operability
    level: SHOULD
    scope: [rewrite, translate, review, author]
    modes: [strict, standard, review]
    trigger: "目标文本是可执行步骤（runbook、SOP、agent 指令、工具使用说明），而某一步骤缺少执行所必需的成分：动作、动作对象、或对象所在位置。"
    requirement: "步骤应当可直接执行：动作、对象与位置在来源或上下文中可确定时应写出。无法确定时按 A005 在「待确认」中提出，不得猜测。"
    prohibition: "把已给出的操作对象压缩为「相关配置」「对应服务」「必要的调整」；把具体命令替换为「按需处理」；删除操作发生的位置（节点、环境、命名空间）。"
    exceptions: "命令行或代码块已完整表达动作与对象时，不再补写自然语言描述，否则触发 R002。说明性文档中对机制的概述不属于步骤，不触发本规则。"
    invariant: "step-executability — 步骤的 (动作, 对象, 位置) 三元组在来源中可确定的部分，在输出中仍然可确定。"
    detection: semantic
    examples:
      positive:
        source_zh: "在网关节点上确认 `gateway.yaml` 的 `upstream` 配置无误，然后重启。"
        good_zh: "在网关节点上确认 `gateway.yaml` 中的 `upstream` 配置无误，然后重启网关进程。"
      negative:
        source_zh: "在网关节点上确认 `gateway.yaml` 的 `upstream` 配置无误，然后重启网关进程。"
        bad_zh: "确认配置无误后重启。"
        why_bad: "操作位置、配置文件、字段与重启对象全部被压缩掉。步骤不可执行；在同时运行多个组件的节点上，「重启」还可能被理解为重启节点本身。"
      boundary:
        source_zh: "执行 `systemctl restart api-gateway`。"
        output_zh: "执行 `systemctl restart api-gateway`。"
        why_not_triggered: "命令本身已完整给出动作与对象。补写「由值班工程师在网关节点上执行该命令以重启网关服务」只增加冗余，不提高可执行性。"
    justification: "过度压缩会把一个可执行步骤变成一句提示，而它在文档里看起来仍然像一个步骤。"
    gate_evidence:
      failing_input: "在网关节点上确认 `gateway.yaml` 的 `upstream` 配置无误，然后重启网关进程。"
      observed_bad_output: "确认配置无误后重启。"
      risk: "执行者要么停下来提问（流程延迟），要么按自己的理解重启错误的对象。"
      not_covered_by: "S001 是通用的断言保留规则，但它不区分「说明性文本」与「必须可执行的步骤」；本规则给出的是可执行性判据，也是 A001／A005 补出成分时的适用边界。"
      why_defeasible: "可执行性的门槛随读者与文档类型变化：面向开发者的 README 与面向值班的 runbook 要求不同。定为 MUST 会迫使说明性文本补出无关的操作细节。strict 模式只降低歧义阈值，不改变本规则的级别（004 §2）。"
      distinguishing_criterion: "对每个步骤询问：不查阅其他材料能否执行？来源可确定而输出不可确定，即为 WARNING。"

  - id: CTC-P003
    family: P
    concept: verification-binding
    level: SHOULD
    scope: [rewrite, translate, review, author]
    modes: [strict, standard, review]
    trigger: "来源给出了某个步骤的成功判据、等待条件或验证方式。"
    requirement: "成功判据应与它所验证的步骤保持绑定，并保持其阻塞性质：「直到…为止再继续」必须仍然是继续的前提。来源把验证单独列为一个步骤时：未获压缩授权则该步骤保持独立；调用方授权合并步骤时可以并入相邻步骤，但合并后它必须仍是由操作者执行、位于被守护动作之前、且逐项列全原有判据的确认动作（D004）。来源未给出判据时不得虚构，可在「待确认」中提出缺失。"
    prohibition: "把阻塞条件移到附注、脚注或文末；把「确认 X 后再继续」改写为「随后可继续」；把祈使的验证动作改写为对系统行为的描述；为步骤补写来源没有的验收标准；合并步骤时把校验改写为不需要操作者动作的状态描述（「节点就绪后加入路由表」），或丢掉其中任一判据——两者都是删除校验点（D004）。"
    exceptions: "判据的呈现位置可以变化（正文、表格、检查清单），只要仍绑定同一步骤且保持阻塞性质。调用方授权压缩或合并步骤属于 R001 意义上的归因；本规则不要求独立的验证步骤在获授权时仍保持独立（D004 撤回了该条款）。"
    invariant: "verification-binding — (步骤, 判据, 是否阻塞) 三元组不变。"
    detection: semantic
    examples:
      positive:
        source_zh: "重启网关，直到 `/healthz` 返回 200 为止再继续下一步。"
        good_zh: |-
          1. 重启网关。
          2. 确认 `/healthz` 返回 200 后，再继续下一步。
      negative:
        source_zh: "重启网关，直到 `/healthz` 返回 200 为止再继续下一步。"
        bad_zh: |-
          1. 重启网关。
          2. 继续执行后续步骤。

          附注：`/healthz` 正常时返回 200。
        why_bad: "阻塞条件被降级为附注，并从祈使变成描述。操作员会在网关尚未就绪时继续，后续步骤作用于一个半启动的实例，产生的错误又会被误判为新故障。"
      boundary:
        source_zh: "运行 `terraform plan` 并检查输出。"
        output_zh: "运行 `terraform plan` 并检查输出。"
        why_not_triggered: "来源没有给出可判定的成功判据。补写「确认变更数量为 0」等于虚构验收标准（S002）；缺失本身可在「待确认」中提出。"
      authorized_merge:   # D004 / G-P-003: a caller's compression instruction versus checkpoint integrity
        source_zh: |-
          1. 启动 `chunk-server`。
          2. 确认状态为 `READY` 且元数据已加载。
          3. 加入写入路由表。
        instruction: "合并可合并的步骤，压缩到不超过 2 步。"
        bad_zh: |-
          1. 启动 `chunk-server`。
          2. 节点就绪后加入写入路由表。
        why_bad: "步骤数达标，但校验被改写成不需要操作者动作的状态描述，且丢了元数据判据。"
        good_zh: |-
          1. 启动 `chunk-server`。
          2. 确认状态为 `READY` 且元数据已加载。
          3. 加入写入路由表。
        why_good: "并附「待确认」说明上限未能满足（第 7 类）。步骤数达标而校验丢失，不如超出上限而校验完整。合并为 2 步而仍保留由操作者执行、位于加入路由表之前、且列全两项判据的确认动作，同样合规。"
    justification: "把校验挪成附注读起来更整洁，但它同时把一个前置条件变成了可选的参考信息。"
    gate_evidence:
      failing_input: "重启网关，直到 `/healthz` 返回 200 为止再继续下一步。"
      observed_bad_output: "1. 重启网关。 2. 继续执行后续步骤。 附注：`/healthz` 正常时返回 200。"
      risk: "后续步骤在服务未就绪时执行；在滚动发布类流程中这会把一次可控重启变成一次故障。"
      not_covered_by: "S001 不触发：判据的文字仍在文档中。S003 覆盖情态强度，但此处的降级发生在结构位置上，句子内部的情态词甚至可以完全不变。"
      why_defeasible: "文档体例差异很大，判据可以合法地出现在检查清单或表格中；只要仍绑定同一步骤且保持阻塞性质就不算违规，因此需要判断而非硬性位置要求。"
      distinguishing_criterion: "对每条判据追问：它绑定哪个步骤？它仍是继续的前提吗？绑定丢失或阻塞性质降级，即为 WARNING；review 唯一允许的升级见 modes[review]（004 §6）。"

  - id: CTC-P004
    family: P
    concept: guard-precedes-irreversible-action
    level: MUST
    scope: [rewrite, translate, review, author]
    modes: [strict, standard, review]
    trigger: "某步骤包含破坏性、不可逆或改变外部状态的操作（删除、DROP、覆盖、重启、扩缩容、发布、回滚、密钥轮换、清空缓存），且来源给出了它的前置条件、前提或告警。"
    requirement: "前置条件与告警必须出现在被守护的动作之前——同一句的前段，或紧邻的上一句。"
    prohibition: "把前置条件或告警置于命令之后；移到章节末尾、附注或折叠块中；把它降级为不显眼的补充说明。"
    exceptions: "动作可逆、且条件只作用于结果处理而非执行前提时不触发。来源没有给出条件时不得虚构条件或告警（S002）。"
    invariant: "guard-order — 对每个不可逆动作，其守护条件在文本顺序上位于该动作之前。"
    detection: mixed
    detection_note: "确定性层可定位破坏性动作的关键词与代码块，并检查其前置条件短语的字符位置是否更早，作为 WARNING；动作是否不可逆、条件是否为守护条件由语义层判定。"
    examples:
      positive:
        source_zh: "执行 `DROP TABLE staging_events;`。执行前必须确认已完成备份。"
        good_zh: "确认备份已完成后，执行 `DROP TABLE staging_events;`。"
      negative:
        source_zh: "执行 `DROP TABLE staging_events;`。执行前必须确认已完成备份。"
        bad_zh: "执行 `DROP TABLE staging_events;`；该操作要求已完成备份。"
        why_bad: "前置条件出现在不可逆命令之后。运维逐条阅读并执行时，读到条件时表已经被删除；备份是否存在此刻已无法补救。"
      boundary:
        source_zh: "执行 `SELECT count(*) FROM events;`；若结果为 0，检查采集任务是否在运行。"
        output_zh: "执行 `SELECT count(*) FROM events;`；若结果为 0，检查采集任务是否在运行。"
        why_not_triggered: "查询可逆，且条件作用于结果处理而不是执行前提，前置反而会打乱阅读顺序。"
    justification: "运行手册是被边读边执行的；条件的文本位置在这里是语义的一部分，而不是排版。"
    gate_evidence:
      failing_input: "执行 `DROP TABLE staging_events;`。执行前必须确认已完成备份。"
      observed_bad_output: "执行 `DROP TABLE staging_events;`；该操作要求已完成备份。"
      risk: "不可逆操作在前置条件未满足时被执行，且损失无法回滚。"
      not_covered_by: "S001 与 L001 都只要求条件存在于输出中，对它出现在哪里不置一词；两条规则在这个坏输出上都判通过。风险完全来自位置。"
      distinguishing_criterion: "定位每个不可逆动作及其守护条件的字符位置；条件位置晚于动作即 ERROR。"

  - id: CTC-P005
    family: P
    concept: instruction-trigger-explicitness
    level: SHOULD
    scope: [author, rewrite, review]
    modes: [strict, review]
    trigger: "目标文本是 agent 指令、系统提示，或工具／函数描述。"
    requirement: "应写明使用时机（触发条件）与已知的适用边界（何时不适用）。author 模式下这些内容取自调用方素材；rewrite 模式下来源未给出时不得补写，在「待确认」中提出。"
    prohibition: "在改写模式下补出来源没有的能力、参数上限或使用限制；用「用于处理相关请求」这类不含触发条件的描述充当工具描述。"
    exceptions: "触发条件已由工具名与参数唯一确定时不再重复说明；边界未知且素材未提供时留空并报告，不得推测。"
    invariant: "no-invented-capability — 描述中声明的能力集合包含于素材给出的能力集合。"
    detection: semantic
    examples:
      positive:
        source_zh: "工具：`get_order_status`。描述：查询订单。（调用方素材：按 `order_id` 返回单个订单的当前状态；不支持批量与历史快照。）"
        good_zh: "工具：`get_order_status`。按 `order_id` 查询单个订单的当前状态。不用于批量导出，也不返回历史快照。"
      negative:
        source_zh: "工具：`get_order_status`。描述：查询订单。"
        bad_zh: "工具：`get_order_status`。查询订单，支持按时间范围批量查询，单次最多返回 100 条。"
        why_bad: "改写模式下补出了来源没有的能力与上限。agent 会据此调用不存在的功能；失败之后也无法从描述判断是描述写错了还是实现有缺陷。"
      boundary:
        source_zh: "工具：`cancel_job`。取消指定的任务。任务已完成时调用会返回 `409`。"
        output_zh: "工具：`cancel_job`。取消指定的任务。任务已完成时调用会返回 `409`。"
        why_not_triggered: "触发条件与边界都已给出；追加「当用户希望取消任务时使用本工具」是纯冗余（R002）。"
    justification: "agent 指令与工具描述是本技能的首要使用场景之一（000-design.md §1），其失败方式与散文不同：描述不全导致选错工具，描述过全导致调用不存在的能力。"
    gate_evidence:
      failing_input: "工具：`get_order_status`。描述：查询订单。"
      observed_bad_output: "查询订单，支持按时间范围批量查询，单次最多返回 100 条。"
      risk: "工具选择与调用参数被一段虚构的能力说明驱动；错误在运行时才暴露，且指向错误的排查方向。"
      not_covered_by: "S002 覆盖了坏输出这一半（虚构能力），但不覆盖另一半：缺少触发条件的描述本身就是一种失败，而 S002 恰恰禁止用补写来修复它。本规则把两半连起来：缺失就报告，不填空。"
      why_defeasible: "能否写出触发条件完全取决于素材是否包含它。定为 MUST 会与 S002 直接冲突，逼出虚构。"

  # ------------------------------------------------------------------- T: terminology

  - id: CTC-T001
    family: T
    concept: term-consistency
    level: SHOULD
    scope: [rewrite, translate, review, author]
    modes: [strict, standard, review]
    trigger: "同一概念在本次工作单位（被改写的文本，加上调用方给出的上下文）内出现两种以上称呼。"
    requirement: "同一概念应统一为一个术语。选择顺序：调用方提供的术语约定 > 来源中最明确且出现最多的形式 > 来源中首次出现的形式。"
    prohibition: "引入来源与上下文都没有出现过的新术语或新译名；在同一文档内无理由地交替使用中英形式；把来源已经统一的术语替换为模型自己偏好的说法。"
    exceptions: "首次出现处给出中英对照属于术语定义，不算不一致。引用外部系统或标准的固有名称时保持原名。本技能不附带产品术语表（000-design.md §7.4）：术语只能来自来源文本与调用上下文。作用域仅限本次调用可见的文本加调用方术语表（004 §3）；只有明确同指时才统一，不明确时不合并，各说法保持原样——改写模式下差异本身不进「待确认」，只有当它妨碍执行时按第 5 类（S002）报告；review 模式下它是一条普通 finding（005 C1）。"
    invariant: "concept-to-term — 概念到术语的映射在工作单位内是函数（一个概念一个术语）。"
    detection: mixed
    detection_note: "当调用方提供了术语约定时，约定内术语可做确定性字符串检查；无约定时，同义变体的识别属于语义层。"
    examples:
      positive:
        source_zh: "访问令牌的有效期为 1 小时。token 过期后需要重新获取凭证。"
        good_zh: "访问令牌的有效期为 1 小时；访问令牌过期后需要重新获取。"
      negative:
        source_zh: "访问令牌的有效期为 1 小时。访问令牌过期后需要重新获取。"
        bad_zh: "access token 的有效期为 1 小时。令牌过期后需重新申请凭据。"
        why_bad: "同一对象在两句里出现三种称呼，且都不是来源使用的形式。读者无法确定「凭据」与「access token」是否同一件东西，排查权限问题时会去找两套配置。"
      boundary:
        source_zh: "服务端返回访问令牌（access token）与刷新令牌（refresh token）。"
        output_zh: "服务端返回访问令牌（access token）与刷新令牌（refresh token）。"
        why_not_triggered: "首次出现处的中英对照是术语定义；且访问令牌与刷新令牌是两个不同概念，统一为「令牌」反而会违反 T002。"
    justification: "术语漂移不改变任何单句的真值，却让读者在文档内部建立错误的对象数量模型。"
    gate_evidence:
      failing_input: "访问令牌的有效期为 1 小时。访问令牌过期后需要重新获取。"
      observed_bad_output: "access token 的有效期为 1 小时。令牌过期后需重新申请凭据。"
      risk: "读者把一个对象当成两个或三个；在鉴权文档里这直接导致配置错项。"
      not_covered_by: "S001 不触发：断言完整。T002 是反方向的规则（禁止合并概念），不要求统一。"
      why_defeasible: "同一概念的不同形式有时承担不同分工：正文用中文名，示例与字段说明用英文标识符。硬性统一会破坏这种分工，也会与 S005 冲突，因此必须保持可反驳。000-design.md §7.4 使用「should normally」的措辞，本级别与之一致。"

  - id: CTC-T002
    family: T
    concept: concept-distinction
    level: MUST
    scope: [rewrite, translate, review, author]
    modes: [strict, standard, review]
    trigger: "改写把两个术语合并为一个，或用近义词替换一个已确立的术语。"
    requirement: "不同的领域概念必须保持不同的术语。替换术语之前必须确认二者在本文档的领域内确实同指。"
    prohibition: "合并这类近义对：认证／授权、参数／属性／字段、缓存／缓冲、重启／重载、告警／错误、限流／熔断、副本／备份、幂等／去重；用上位词覆盖下位区分。"
    exceptions: "来源本身在同一意义上交替使用两个词时，统一为其中之一不算合并，那属于 T001。"
    invariant: "term-to-concept — 术语到概念的映射是单射（一个术语不覆盖两个概念）。"
    detection: semantic
    examples:
      positive:
        source_zh: "该接口先做身份认证，再做权限校验。"
        good_zh: "该接口先进行身份认证，再进行权限校验。"
      negative:
        source_zh: "该接口先做身份认证，再做权限校验。"
        bad_zh: "该接口会进行权限认证。"
        why_bad: "认证（你是谁）与授权（你能做什么）被合并为一个词，两个步骤也塌缩成一个。读者无法据此区分 401 与 403，排查时会从错误的方向开始。"
      boundary:
        source_zh: "请求会被网关拒绝并返回 403。被拒绝的调用不计入配额。"
        output_zh: "请求会被网关拒绝并返回 403；被拒绝的请求不计入配额。"
        why_not_triggered: "「请求」与「调用」在本文中指同一对象，来源自身在交替使用；统一为「请求」没有合并任何区分。"
    justification: "统一术语的压力天然会推向合并；必须有一条同等强度的规则限定它的上限。"
    gate_evidence:
      failing_input: "该接口先做身份认证，再做权限校验。"
      observed_bad_output: "该接口会进行权限认证。"
      risk: "两个安全语义不同的阶段被合并，读者失去区分 401 与 403 的依据；在权限设计文档中这会传播成实现缺陷。"
      not_covered_by: "T001 要求统一，本规则给出统一的上限；只有 T001 时，「保持术语一致」反而成为合并概念的正当理由。S001 不触发方式很隐蔽：坏输出中断言数量减少了，但语义层若按「概念相近」判断，很容易接受这次合并。"
      distinguishing_criterion: "对每一次术语替换追问：被替换的两个词在本领域是否同指？答否即 ERROR。"

  # -------------------------------------------------- L: logic, conditions, temporal order

  - id: CTC-L001
    family: L
    concept: condition-and-exception-preservation
    level: MUST
    scope: [rewrite, translate, review]
    modes: [strict, standard, review]
    trigger: "来源含有条件、前提、例外、适用限定或告警。"
    requirement: "条件、前提与例外必须保留，并继续限定同一对象。有条件的陈述必须仍然是有条件的。标题或父级列表项建立的条件管辖其子树：拍平结构不得让该条件逃出子树，也不得把它缩小到比原本管辖的更少的步骤；也不得把结构条件静默复制进每个子步骤（003 §4，005 C8）。"
    prohibition: "删除例外（「只读副本除外」）；把有条件的规则降格为一般规则；把「在 X 情况下」改为无限定表述；把例外挪到一个不再修饰目标句的位置；拍平标题或列表结构，使其建立的条件逃出子树或缩小管辖范围。"
    exceptions: "条件的表述形式可变（若…则／…时／前提是），只要限定对象与逻辑方向不变（L002）。"
    invariant: "condition-set — 每条断言所附带的 (条件, 例外) 集合不变，含由标题或父级列表项建立的条件。"
    detection: semantic
    examples:
      positive:
        source_zh: "除只读副本外，所有节点都需要重新加载证书。"
        good_zh: "所有节点都需要重新加载证书，只读副本除外。"
      negative:
        source_zh: "除只读副本外，所有节点都需要重新加载证书。"
        bad_zh: "所有节点都需要重新加载证书。"
        why_bad: "例外被删除，规则的适用范围被扩大。只读副本会被执行一次不必要的证书重载，而在部分实现中该操作会触发副本重建。"
      boundary:
        source_zh: "在启用了 TLS 的集群中，还需要同时更新 CA 包。"
        output_zh: "启用 TLS 的集群还需同时更新 CA 包。"
        why_not_triggered: "条件仍限定同一对象集合，只是语序与助词变化。"
      structural_scope:   # 003 §4 evidence (GPT F-14); assigned to this rule by 005 C8, formerly listed under R005
        source_zh: |-
          ## 仅用于测试环境
          1. 清空缓存。
          2. 重置计数器。
        bad_zh: "清空缓存并重置计数器。"
        why_bad: "标题建立的条件「仅用于测试环境」管辖两个步骤；拍平成散文后条件消失，清空缓存在生产环境获得了授权。"
        output_zh: |-
          ## 仅用于测试环境
          1. 清空缓存。
          2. 重置计数器。
        why_good: "原样返回；条件留在原位，也不复制进每个子步骤。格式与粒度本身由 R005 管，此处的失败是条件保持，按本规则的 MUST 级判定。"
    justification: "例外与前提是句子里最像赘余的成分，因此在以简洁为目标的改写中最先被牺牲。"
    gate_evidence:
      failing_input: "除只读副本外，所有节点都需要重新加载证书。"
      observed_bad_output: "所有节点都需要重新加载证书。"
      risk: "一条被明确排除的对象被纳入操作范围；在证书轮换这类全集群操作中，例外通常正是为了避免一次已知的破坏性副作用。"
      not_covered_by: "S001 的判据是「来源断言能否在输出中定位」，而条件降格会让输出的断言变得更强、更概括，逐条比对断言时不会显示为缺失；输出甚至看起来信息更完整。检测条件降格需要逐条检查断言的适用范围，这是与 S001 不同的判据。"
      distinguishing_criterion: "对来源中每条断言列出 (条件, 例外)，在输出的对应断言上比较；集合缩小即 ERROR。"

  - id: CTC-L002
    family: L
    concept: logical-direction-fidelity
    level: MUST
    scope: [rewrite, translate, review]
    modes: [strict, standard, review]
    trigger: "来源含有逻辑连接成分（且、或、若…则、仅当…才、只有…才、除非…否则、即使…也）。"
    requirement: "连接成分表达的逻辑关系必须保持：合取不变析取，充分条件不变必要条件，让步不变条件，分组结构不变。"
    prohibition: "「仅当 A 才 B」→「A 时 B」；「A 且 B」→「A 或 B」；「除非 A，否则 B」→「若 A 则 B」；「即使 A，也 B」→「若 A，则 B」；把 (A 且 B) 或 C 改写为 A、B、C 三选一。"
    exceptions: "同义连接词替换允许（若…则 ↔ …时 ↔ 当…时），前提是逻辑方向不变。"
    invariant: "logical-form — 命题的逻辑式（合取／析取／蕴含方向／分组）不变。"
    detection: mixed
    detection_note: "确定性层可对连接词表（仅当、只有、才、除非、否则、即使、且、或、以及、和）做出现差分并给出 WARNING；方向是否真的改变由语义层判定。"
    examples:
      positive:
        source_zh: "仅当集群处于维护模式时，才允许手动删除 PVC。"
        good_zh: "只有在集群处于维护模式时，才允许手动删除 PVC。"
      negative:
        source_zh: "仅当集群处于维护模式时，才允许手动删除 PVC。"
        bad_zh: "集群处于维护模式时，允许手动删除 PVC。"
        why_bad: "必要条件被改写为充分条件。原文排除了其他一切情形下的手动删除，改写后不再排除，读者会认为还存在别的被允许的路径，于是在非维护期删除 PVC，数据卷被回收。"
      boundary:
        source_zh: "如果队列长度超过 1000，则触发扩容。"
        output_zh: "队列长度超过 1000 时触发扩容。"
        why_not_triggered: "「如果…则」与「…时」在此同为充分条件表达，逻辑方向未变。"
    justification: "「仅」「才」「除非」都是单字级成分，删除它们既不影响流畅度也不触发任何长度或断言检查，但它们承载整句的逻辑方向。"
    gate_evidence:
      failing_input: "仅当集群处于维护模式时，才允许手动删除 PVC。"
      observed_bad_output: "集群处于维护模式时，允许手动删除 PVC。"
      risk: "一条排他性授权条件被读作普通条件；破坏性操作的适用范围被静默放宽。"
      not_covered_by: "S001 不触发：删掉一个「仅」字不会被判为断言丢失。S007 覆盖量化词的论域大小，不覆盖条件与结论之间的蕴含方向。L001 只检查条件是否仍在，此处条件完好，改变的是它与结论的关系。"
      distinguishing_criterion: "把两侧还原为逻辑式（A→B / B→A / A∧B / A∨B）比较；式子不同即 ERROR。"

  - id: CTC-L003
    family: L
    concept: temporal-order-preservation
    level: MUST
    scope: [rewrite, translate, review]
    modes: [strict, standard, review]
    trigger: "来源给出了动作、事件或状态之间的先后、并发或期间关系。"
    requirement: "时间关系必须保持：先后不变并发，并发不变先后，「在 X 完成之后」不变「在 X 期间」。顺序标记被删除时，顺序必须仍可从文本恢复。"
    prohibition: "交换存在依赖关系的步骤；把顺序执行改写为同时执行；把「完成后」改为「期间」或「同时」；删除唯一表达顺序的标记。"
    exceptions: "陈述顺序可以与时间顺序不同（「临时文件应在服务重启之后清理」），只要时间关系本身不变。"
    invariant: "temporal-relations — 事件对之间的 (先于, 同时, 期间) 关系集合不变。"
    detection: semantic
    examples:
      positive:
        source_zh: "先禁用定时任务，再执行数据库迁移；迁移完成后重新启用定时任务。"
        good_zh: |-
          1. 禁用定时任务。
          2. 执行数据库迁移。
          3. 迁移完成后，重新启用定时任务。
      negative:
        source_zh: "先禁用定时任务，再执行数据库迁移；迁移完成后重新启用定时任务。"
        bad_zh: "执行数据库迁移，并在迁移期间禁用定时任务。"
        why_bad: "「先禁用、再迁移」变成了「迁移期间禁用」。迁移开始时定时任务仍在运行，可能在迁移中途按旧表结构写入数据，而这类损坏在迁移完成后才会显现。"
      boundary:
        source_zh: "重启服务后清理临时文件。"
        output_zh: "临时文件应在服务重启之后清理。"
        why_not_triggered: "陈述顺序改变，但两个动作的时间关系（重启在前）未变。"
    justification: "把顺序关系压缩成并列是中文改写中很自然的一步，且改写后的句子通常更短更顺。"
    gate_evidence:
      failing_input: "先禁用定时任务，再执行数据库迁移；迁移完成后重新启用定时任务。"
      observed_bad_output: "执行数据库迁移，并在迁移期间禁用定时任务。"
      risk: "数据在迁移窗口内被并发写入，产生难以定位的数据损坏。"
      not_covered_by: "S001 不触发：两个动作都在。P001 覆盖原子性分组，此处分组正确、顺序错误；P001 的判据（哪些动作必须落在同一窗口内）恰恰会把这个坏输出判为通过。"
      distinguishing_criterion: "抽取两侧的事件对时间关系集合比较；关系类型不同即 ERROR。"

  - id: CTC-L004
    family: L
    concept: threshold-boundary-preservation
    level: MUST
    scope: [rewrite, translate, review, author]
    modes: [strict, standard, review]
    trigger: "来源含有比较关系或边界表述（达到、超过、不少于、至少、最多、不超过、以上、以下、以内、之前、之后）。"
    requirement: "比较算子与边界包含性必须保持不变：「达到 N」包含 N，「超过 N」不包含 N，「N 以内」包含 N。"
    prohibition: "达到→超过；至少→多于；最多→少于；不少于→大于；「N 秒内」→「N 秒后」；把闭区间写成开区间或反向。"
    exceptions: "同义算子替换允许（不少于 N ↔ N 及以上 ↔ 大于等于 N）。当来源的边界表述本身歧义（如「3 次以上」在中文中可含可不含 3）且边界值会改变行为时，不得静默择一，转 A005。"
    invariant: "comparator-and-inclusivity — 每个阈值的 (比较方向, 边界是否包含) 不变。"
    detection: mixed
    detection_note: "002 的确定性层执行 threshold-comparator drift 检查并给出 WARNING；等值替换与真实漂移的区分留给语义层，因为合法改写可以改变表层算子。"
    examples:
      positive:
        source_zh: "当队列长度达到 100 时拒绝新任务。"
        good_zh: "队列长度达到 100 时，拒绝新任务。"
      negative:
        source_zh: "当队列长度达到 100 时拒绝新任务。"
        bad_zh: "当队列长度超过 100 时拒绝新任务。"
        why_bad: "边界包含性被改变：队列长度恰为 100 时的行为从拒绝变成接受。容量告警与压测断言都以该边界为准，这一位偏移会表现为「文档与实现不符」，并被误判为实现缺陷。"
      boundary:
        source_zh: "重试间隔不少于 500 ms。"
        output_zh: "重试间隔为 500 ms 及以上。"
        why_not_triggered: "「不少于 N」与「N 及以上」是同一闭区间下界的两种表述，比较方向与包含性均未变。"
    justification: "中文的边界词（达到／超过／以上／以内）在日常语用中可互换，在规格文本中不可互换。此 ID 与 002-gold-case-schema.md 中示例案例 G-L-003 引用的 `rule: CTC-L004` 对齐。"
    gate_evidence:
      failing_input: "当队列长度达到 100 时拒绝新任务。（002-gold-case-schema.md 示例案例 G-L-003）"
      observed_bad_output: "当队列长度超过 100 时拒绝新任务。"
      risk: "边界处行为反转；限流、配额、告警阈值类文档中的 off-by-one 会直接产生生产事故或误告警。"
      not_covered_by: "S004 保证数值与单位不变——在这个坏输出里 100 完好无损，变的是比较算子。002 的确定性层也把两者分成两项独立检查（quantity multiset 与 comparator drift），说明它们不是同一个属性。L001 只检查条件是否存在，不检查条件的边界值。"
      distinguishing_criterion: "抽取每个阈值的 (比较方向, 包含性) 比较；任一不同即 ERROR。"

  # ------------------------------------------------ R: rendering and controlled style

  - id: CTC-R001
    family: R
    concept: minimal-attributable-intervention
    level: MUST
    scope: [rewrite, translate, review]
    modes: [strict, standard, review]
    trigger: "任何改写或翻译任务；尤其是来源本身已经正确、清晰、合规的情形。"
    requirement: "每一处改动都必须能归因到一条具体规则 ID。未触发任何规则的文本原样返回；整段合规时，合法的输出就是原文。"
    prohibition: "无规则依据的重写；以「更清楚」「更专业」为由的等义替换；为体现工作量而改写；把多处不相关改动混在一起，使审查无法分别核对。"
    exceptions: "调用方明确要求统一风格、调整体例或指定改写目标时，该要求本身即为归因，需在改动上标注其来源。"
    invariant: "edit-attribution — 改动集合与规则触发集合一一对应；无触发即无改动。"
    detection: mixed
    detection_note: "确定性层可给出未改动字符占比与改动处数；某一处改动是否可归因由语义层判定。002 的 `over_edit_trap: true` 案例（至少五分之一）正是为这条规则准备的。"
    examples:
      positive:
        source_zh: "调用 `POST /v1/jobs` 创建任务。任务创建后返回 `job_id`，可用于查询状态。"
        good_zh: "调用 `POST /v1/jobs` 创建任务。任务创建后返回 `job_id`，可用于查询状态。"
      negative:
        source_zh: "调用 `POST /v1/jobs` 创建任务。任务创建后返回 `job_id`，可用于查询状态。"
        bad_zh: "通过调用 `POST /v1/jobs` 接口，可以完成任务的创建操作。在任务创建完成之后，系统将会返回 `job_id`，该 `job_id` 可以被用于对任务状态进行查询。"
        why_bad: "没有任何规则被触发。长度翻倍而信息不变，并引入了名词化与被动赘语；更严重的是，审查者现在必须重新核对每一句，而真正需要注意的改动（如果有）被淹没在其中。"
      boundary:
        source_zh: "请求失败时可能会返回 5xx。建议客户端进行重试。"
        output_zh: "请求失败时可能返回 5xx，建议客户端重试。"
        why_not_triggered: "两处改动都可归因于 R003（冗余的「会」与「进行」），情态词「可能」「建议」原样保留；这是可归因的最小改动，不是自由重写。"
    justification: "过度改写是 000-design.md §17.7 与 §32 单列的评估维度，也是一个成熟受控语言系统与一个改写模型之间的差别。"
    gate_evidence:
      failing_input: "调用 `POST /v1/jobs` 创建任务。任务创建后返回 `job_id`，可用于查询状态。（已合规，属 over_edit_trap）"
      observed_bad_output: "通过调用 `POST /v1/jobs` 接口，可以完成任务的创建操作。在任务创建完成之后，系统将会返回 `job_id`，该 `job_id` 可以被用于对任务状态进行查询。"
      risk: "每一次不必要的改写都是一次 S 族违规的机会；D001 的六处语义损失全部发生在被认为只是措辞改进的改动中。累积效应是文档的可信度下降与审查成本上升。"
      not_covered_by: "S 族全部是「不得改变 X」形式的规则，它们共同允许一次保持全部不变量的等义重写。等义重写本身不违反其中任何一条，却是全部语义漂移的载体，因此需要一条独立的、可归因性的硬规则。"
      distinguishing_criterion: "对输出与来源做差分，对每一处改动要求给出规则 ID；给不出即 ERROR。这一判据同时提供了 over-edit 评估维度的度量方式。"

  - id: CTC-R002
    family: R
    concept: anti-over-explicitation
    level: SHOULD
    scope: [rewrite, translate, review, author]
    modes: [strict, standard, review]
    trigger: "输出中出现逐句重复的主语、被机械拆分的短句，或不消除任何歧义的补充限定。"
    requirement: "显式化必须换来歧义的消除。每一个补出的主语、重复的中心语、拆出的短句，都应对应一处具体的歧义风险。"
    prohibition: "在只有一个执行者的语境中逐句补出主语；把正常复句拆成一行一句；给每个步骤补写「以确保操作正确执行」之类的空补语；对已经唯一确定的对象反复加限定。"
    exceptions: "多执行者交替出现时重复主语具有消歧价值（A001）。写出来源或上下文中可确定的动作、对象或位置，消除的是操作未定，属 P002，不在本规则禁止之列（005 C5）。面向 agent 的指令中为使每条可被单独引用而分条编号，不算机械拆句。strict 模式提高的是歧义敏感度，不是显式化的数量要求。本规则描述的是缺陷，不是改写许可：来源已有的缺陷只在本规则触发时修复，取能去除该缺陷的最小改动（R001）；不含该缺陷的文本不授权重写（005 结构性缺口 2）。"
    invariant: "explicitness-justified — 每个显式成分对应一处可指认的歧义风险。"
    detection: semantic
    examples:
      positive:
        source_zh: "操作员登录堡垒机。操作员切换到运维账号。操作员执行部署脚本。"
        good_zh: "操作员登录堡垒机，切换到运维账号后执行部署脚本。"
      negative:
        source_zh: "登录堡垒机，切换到运维账号，执行部署脚本。"
        bad_zh: |-
          操作员登录堡垒机。
          操作员切换到运维账号。
          操作员执行部署脚本。
        why_bad: "全文只有一个执行者，重复的主语不消除任何歧义；拆句也没有改变任何依赖关系。文本变长、信息密度下降，需要特别注意的步骤与例行步骤之间失去了区分。"
      boundary:
        source_zh: "值班工程师确认影响范围，平台组执行回滚。"
        output_zh: "值班工程师确认影响范围，平台组执行回滚。"
        why_not_triggered: "两个主语指向不同执行者，重复具有消歧价值；删掉任何一个都会违反 A001。"
    justification: "受控语言最典型的失败不是不够严格，而是把严格等同于显式，产出没有人愿意读、因而没有人会照做的文档。"
    gate_evidence:
      failing_input: "登录堡垒机，切换到运维账号，执行部署脚本。"
      observed_bad_output: "操作员登录堡垒机。／操作员切换到运维账号。／操作员执行部署脚本。"
      risk: "文档冗长导致实际执行者跳读；000-design.md §17.6 把重复主语与原子化短句列为需要扣分的自然度失败。"
      not_covered_by: "R001 只约束「有没有规则依据」；此处 A001 与 P002 确实提供了依据，只是被过度应用。需要一条规则为它们设置上限，正如 A005 为消歧设置上限。"
      why_defeasible: "「是否消除歧义」是判断问题，且 strict 模式下同一段文本确实可能需要更多显式成分。定为 MUST 会与 A001／P002 在边界上互相拉扯，产生无法同时满足的规则对。"

  - id: CTC-R003
    family: R
    concept: anti-translationese
    level: SHOULD
    scope: [rewrite, translate, review, author]
    modes: [strict, standard, review]
    trigger: "文本含无必要的被动式、名词化赘语（进行／作出／予以 + 动词）、过长的「的」字串、英语从句语序残留（「由于…的事实」「在…的情况下」滥用），或直译的连接词。"
    requirement: "在语义完全不变的前提下，使用中文技术写作的常规表达。"
    prohibition: "为求正式而使用「被…所」；用「进行处理」代替「处理」；保留英语原文的从句语序；把简单谓语改写成「对…进行…操作」。"
    exceptions: "被动用于突出受事、施事未知、或施事已在同句给出时是自然的技术表述。术语内部的固定搭配不改。本规则永远低于 S 族：任何自然度改进一旦改变不变量即作废（D001）。本规则描述的是缺陷，不是改写许可：来源已有的译文腔只在本规则触发处修复，取能去除该缺陷的最小改动（R001）；不含该缺陷的文本不授权重写（005 结构性缺口 2）。"
    invariant: "meaning-under-rendering — 渲染改动前后，S、A、P、T、L 各族不变量全部不变。"
    detection: semantic
    examples:
      positive:
        source_zh: "该配置项被用于对超时时间进行控制。"
        good_zh: "该配置项用于控制超时时间。"
      negative:
        source_zh: "网关会拒绝超出配额的请求。"
        bad_zh: "超出配额的请求将会被网关所拒绝。"
        why_bad: "「被…所」是书面化冗余结构，主动语序更短且信息完全相同；这类改动通常发生在把「正式」误当作「精确」的方向上。"
      boundary:
        source_zh: "该字段由服务端生成，客户端不得修改。"
        output_zh: "该字段由服务端生成，客户端不得修改。"
        why_not_triggered: "被动在此突出受事且施事已显式给出，是自然的技术表述；改成主动句属于无归因改动（R001），删除施事则违反 A001。"
    justification: "翻译体是中文技术文档最普遍的质量问题，也是本技能存在的部分理由；但它必须被限定为一条可反驳的低优先级规则。"
    gate_evidence:
      failing_input: "网关会拒绝超出配额的请求。"
      observed_bad_output: "超出配额的请求将会被网关所拒绝。"
      risk: "文档可读性下降；在 agent 指令中，冗长的被动结构还会稀释指令的可执行性。"
      not_covered_by: "R001 只要求改动可归因，不提供「什么是好的中文技术表达」的判据；R002 覆盖过度显式化，不覆盖句法层面的翻译腔。"
      why_defeasible: "自然度是判断问题且随体裁变化。更重要的是 D001 证明了自然度改写本身正是语义损失的来源：这条规则必须始终可以被 S 族推翻，因此不能是 MUST。"

  - id: CTC-R004
    family: R
    concept: normative-decidability
    level: SHOULD
    scope: [author, rewrite, review]
    modes: [strict, review]
    trigger: "目标文本是规范性指令（agent 指令、SOP、策略、门禁条件），且其判定条件由「尽量、尽可能、最好、适当、必要时、一般来说、合理」这类无判据词承担，包括承担义务本身的情态模糊词（004 §8）。"
    requirement: "author 模式下，规范性条件应给出可判定的触发条件：阈值、状态或事件。rewrite 模式下不得补出来源没有的判据，应在「待确认」中提出；无判据词承担义务时，报告其可能的两种以上强度并在第四栏给出建议，然后停手，由作者决定（D003，003 §5，004 §8）。规范强度词（必须／应／可以）在同一文档内应保持稳定用法（000-design.md §26）。"
    prohibition: "在改写中把无判据词替换为具体阈值（那是 S002 违规）；在同一文档内让「应」时而表示义务、时而表示建议；把目标文档中限定观测事实的普通汉语副词当作违规删除。"
    exceptions: "本规则只适用于规范性指令文本。目标文档中对观测事实的限定（「该接口通常在 100 ms 内返回」）不受限制（000-design.md §26 末段）。"
    invariant: "criterion-decidable — 每个规范性条件都对应一个可观测的判定依据，或被显式标记为未定义。"
    detection: mixed
    detection_note: "确定性层可对无判据词表（尽量、尽可能、最好、适当、必要时、一般来说、合理、酌情）做字符串检查并给出 WARNING；该词是否承担判定条件、附近是否已定义判据，由语义层判定。"
    examples:
      positive:
        source_zh: "（author 模式；调用方素材：SLO 规定服务异常后 15 分钟内恢复，超时升级至平台组）服务异常时应尽量快速恢复。"
        good_zh: "服务异常后应在 15 分钟内恢复；15 分钟内未恢复的，升级至平台组。"
      negative:
        source_zh: "服务异常时应尽量快速恢复。"
        bad_zh: "服务异常时应尽量快速恢复，必要时可采取适当措施。"
        why_bad: "「尽量」「必要时」「适当」都没有判定条件。执行者无法判断何时算达标、何时该升级；这段补充读起来像是加强了要求，实际上没有增加任何可执行内容，还稀释了原句。"
      boundary:
        source_zh: "该接口通常在 100 ms 内返回。"
        output_zh: "该接口通常在 100 ms 内返回。"
        why_not_triggered: "「通常」限定的是一个观测事实，不是规范判定条件。删除它会把统计描述变成性能保证（S003），量化它则是虚构（S002）。"
    justification: "本技能的首要产出对象是 agent 指令与 SOP，其中一个不可判定的条件等于没有条件；同时必须防止这条规则外溢到普通技术散文。"
    gate_evidence:
      failing_input: "服务异常时应尽量快速恢复。"
      observed_bad_output: "服务异常时应尽量快速恢复，必要时可采取适当措施。"
      risk: "规范文本看起来完备而实际不可执行；不同执行者对同一条款做出不同判断，事故处置时间无法约束。"
      not_covered_by: "S002 禁止虚构判据，但不要求识别并报告判据缺失；S003 保持情态强度不变，对「强度明确但触发条件不可判定」的条款不置一词。"
      why_defeasible: "能否给出判据完全取决于素材。在 rewrite 模式下本规则只能以报告形式生效，因此不能是 MUST；000-design.md §26 本身也把限制范围限定在规范性指令上。"

  - id: CTC-R005
    family: R
    concept: document-structure-preservation
    level: SHOULD
    scope: [rewrite, translate, review]
    modes: [strict, standard, review]
    trigger: "来源包含 Markdown 结构：标题层级、有序或无序列表、表格、围栏代码块及其语言标注、链接、引用块。"
    requirement: "结构标记及其承载的粒度应保持不变：表格仍是表格，代码块仍是代码块并保留语言标注，列表项数保持一致（P001 允许的合法拆合除外），标题层级不变。"
    prohibition: "把表格展平为句子；把围栏代码块改为行内代码或普通段落；删除语言标注；把编号步骤改写成散文段落；调整标题层级从而改变文档结构。"
    exceptions: "调用方明确要求改变格式时按要求执行。把顺序敏感的无序列表改为有序列表是允许的，前提是顺序已由来源给出（否则属 S002 新增）。结构所承载的条件作用域（标题或父级列表项的条件管辖其子树）不属于本规则，属 L001 的 MUST 级条件保持，调用方的格式授权不能豁免它；本规则只管格式与粒度（005 C8）。"
    invariant: "structure-counts — (标题层级序列, 列表项数, 代码块数与语言标注, 表格行列数) 不变。"
    detection: mixed
    detection_note: "确定性层可比较结构计数（标题、列表项、代码围栏与语言标注、表格行列）并给出 WARNING；差异是否被任务授权由语义层判定。"
    examples:
      positive:
        source_zh: |-
          | 状态码 | 含义 |
          | --- | --- |
          | 429 | 触发限流 |
        good_zh: |-
          | 状态码 | 含义 |
          | --- | --- |
          | 429 | 已触发限流 |
      negative:
        source_zh: |-
          | 状态码 | 含义 |
          | --- | --- |
          | 429 | 触发限流 |
        bad_zh: "状态码 429 表示已触发限流。"
        why_bad: "表格被展平。后续追加状态码时没有可对齐的位置，版本差异从「新增一行」变成「重写一段」，从文档抽取状态码表的工具也直接失效。"
      boundary:
        source_zh: |-
          响应示例：

          ```json
          {"job_id": "j-123"}
          ```
        output_zh: |-
          响应示例如下：

          ```json
          {"job_id": "j-123"}
          ```
        why_not_triggered: "代码块及其语言标注未被改动，只调整了块外的引导语；结构计数完全一致。"
    justification: "技术文档的结构承载可维护性与机器可读性，而改写模型倾向于把结构视为可自由重排的排版。"
    gate_evidence:
      failing_input: "一张三行的状态码表。"
      observed_bad_output: "状态码 429 表示已触发限流。"
      risk: "文档的可维护性与可抽取性下降；在 API 文档中，表格常常是被工具消费的接口契约。"
      not_covered_by: "S005 保护标记内部的字符，不保护标记之外的块级结构；P001 覆盖步骤语义上的拆合，不覆盖表格、标题与代码块。"
      why_defeasible: "结构变化有时正是任务本身（把一段散文整理成步骤列表）。因此规则要求的是「未经要求不改，且改动须报告」，而不是绝对禁止。"

  - id: CTC-R006
    family: R
    concept: typography-and-locale
    level: MAY
    scope: [rewrite, translate, review, author]
    modes: [strict, standard, review]
    trigger: "标点全半角、中英文之间的空格、引号样式、数字格式等排版约定不一致。"
    requirement: "可以在不触碰受保护标记的前提下统一排版约定；统一的目标是来源或项目已有的一致风格，不是模型的偏好。"
    prohibition: "为统一排版而改动受保护标记内部（S005 优先）；把排版偏好按 ERROR 上报（000-design.md §28）；在来源已有一致风格时按模型偏好改写（R001）。"
    exceptions: "none"
    invariant: "typography-subordinate — 排版改动不触及任何受保护标记，也不改变任何语义不变量。"
    detection: deterministic
    detection_note: "全半角、空格与引号样式可用字符级检查判定。本规则的作用主要是限定这些检查的效力，而不是扩大它们。"
    examples:
      positive:
        source_zh: "重启服务,等待30秒."
        good_zh: "重启服务，等待 30 秒。"
      negative:
        source_zh: "执行 `kubectl get pods -n prod`。"
        bad_zh: "执行 `kubectl get pods —n prod`。"
        why_bad: "为统一标点把命令中的半角连字符改成了全角破折号，命令不可执行。排版偏好不得凌驾于受保护标记之上。"
      boundary:
        source_zh: "错误码:404 表示资源不存在。（全文一致使用半角标点）"
        output_zh: "错误码:404 表示资源不存在。"
        why_not_triggered: "全篇一致的半角标点是项目风格，不造成解释歧义；为统一而改动属于无归因改动（R001），且 000-design.md §7.5 明确禁止把区域风格偏好升格为语义规则。"
    justification: "排版问题会以两种方式出错：被当作语义问题上报，或在统一过程中破坏受保护标记。把它显式定为 MAY 级，同时堵住这两个方向。"
    gate_evidence:
      level_rationale: "MAY 级不经过硬规则门禁。保留它的理由是它排除了两类错误，而不是它要求了什么；若删除本规则，排版检查会以 STYLE 之外的严重级重新出现。"
      observed_bad_output: "执行 `kubectl get pods —n prod`。"
      not_covered_by: "S005 会拦截这个具体的坏输出，但不说明排版统一本身是否被允许以及处于什么优先级。"

self_check:
  - step: "改写之前，先抽取来源的不变量清单并写下来。"
    checks:
      - "列出全部受保护标记（S005）。"
      - "列出全部 (数值, 单位) 与精度（S004）。"
      - "列出每个阈值的比较方向与边界包含性（L004）。"
      - "逐句记录 (认识强度, 道义强度, 言语行为类型)（S003）。"
      - "列出全部条件、前提与例外，及其限定对象（L001）。"
      - "列出每个量化位置的 (量化类型, 论域)（S007）。"
      - "列出全部具名施事及其动作（A001）。"
      - "列出事件之间的先后／并发／期间关系（L003）与原子性分组（P001）。"
      - "记录术语到概念的映射（T001、T002）。"
  - step: "确定规则触发集合，而不是先想怎么改。"
    checks:
      - "逐条规则回答：本文中哪一处触发它？记录触发点与规则 ID。"
      - "没有触发点的规则不产生任何改动。"
      - "触发集合为空时，直接返回原文；这是合法且常见的结果（R001）。"
  - step: "只修改触发处；冲突用优先级阶梯解决。"
    checks:
      - "每一处改动都记下它的规则 ID。"
      - "语义类改动先做，渲染类改动后做（000-design.md §27）。"
      - "两条规则冲突时高层胜出；同层冲突时保留来源已有形式。"
      - "若不违反第 1 层就无法达成第 2 层，则不改写该处，转 A005 报告。"
  - step: "从输出文本重新抽取同一张清单——重新读，不要凭记忆。"
    checks:
      - "禁止用「我没有改变含义」代替本步骤；自述无变化不构成证据（D001 结论 1）。"
      - "两张清单逐项比对：标记、数值、阈值、情态、条件、量化、施事、时序、术语。"
      - "任一项不同且不属于已授权改动，回退该处改动而不是解释它。"
  - step: "检查是否新增了来源没有的内容。"
    checks:
      - "输出中每条命题都能指回来源或调用上下文的具体位置（S002）。"
      - "新出现的因果连接词有来源依据（S006）。"
      - "没有新出现的数字、参数、执行者、判据或能力（S002、A005、P003、P005）。"
      - "长度上限没有成为删除任何条件、例外、阈值、告警或失败分支的理由；无法满足的上限已按第 7 类报告（S001）。"
  - step: "检查改写本身是否制造了新的歧义。"
    checks:
      - "每个指代成分的可及先行词唯一（A002）。"
      - "句子合并没有制造修饰语与并列项的结合歧义（A003）。"
      - "否定的作用域与来源一致（A004）。"
      - "步骤拆合保留了原子性分组与顺序依赖（P001、L003）。"
      - "不可逆动作的守护条件仍在动作之前（P004）。"
  - step: "检查过度改写与自然度。"
    checks:
      - "未触发任何规则的段落与来源逐字相同（R001）。"
      - "没有无消歧价值的重复主语或机械拆句（R002）。"
      - "保留的被动与名词化都有理由（R003）。"
      - "结构计数与来源一致：标题、列表项、代码块与语言标注、表格行列（R005）。"
  - step: "按模式的输出契约组装结果。"
    checks:
      - "strict／standard：正文 + 可选「待确认」；无待确认项时不输出该节。"
      - "「待确认」条目只来自七类：A005、P003、P005、R004、S002、S005、S001（长度上限），每条给出 位置 | 问题 | 需要的信息 | 建议（可选），第四栏只在 R004 要求给出建议时填写。"
      - "review：只输出 findings，每条含规则 ID、严重级、逐字引用的位置、问题、风险、建议。"
      - "任何模式下都不输出对自身改动的辩解性说明。"

# Every item below was adjudicated in 004-rule-set-adjudications.md (and refined by 005 where
# noted). The drafting text is kept verbatim as the record of what was open; each item now carries
# its resolution. Where a recommendation's tentative answer was rejected, the resolution says so.
open_issues:
  - issue: "000-design.md 定义了 review 模式的输出结构，但没有定义 rewrite／translate 模式的输出格式。A005、P003、P005、R004 都依赖一个「报告而不改写」的通道。"
    options:
      - "只输出正文，未决歧义静默保留。"
      - "正文 + 可选「待确认」小节（本文件采用）。"
      - "由调用方开关决定是否输出「待确认」。"
    recommendation: "采用第二项并设为默认。没有这个通道时，A005 只能在「静默带入歧义」与「虚构以求确定」之间二选一，而 D001 §5 表明模型会选后者。建议在 SKILL.md 中固定该小节的字段格式，并限制条目数量以免它变成免责声明列表。"
    resolved_by: "004 §1; expanded by 005 C1, C4"
    resolution: >-
      Adopted: body plus an optional trailing 「待确认」 section with a fixed line format. The list of admissible items is closed and now has seven categories (see modes[].output_contract).
  - issue: "strict 模式如何加强 A 族与 P 族的 SHOULD 规则，设计文档只说 strict「应当偏好显式」，没有说这是否改变规则级别。"
    options:
      - "级别固定，模式只改变触发阈值（本文件采用）。"
      - "每个模式一张独立的级别表。"
      - "不做任何加强，strict 与 standard 仅在语气上不同。"
    recommendation: "采用第一项。第二项会让实际规则数量接近三倍，且同一条规则在不同模式下拥有不同 ID 语义，破坏 ID 稳定性。需要一并确认的是：strict 下被抬升执行的 SHOULD 违规，在 review 输出中应报 ERROR 还是标注为 WARNING (strict)。本文件暂按前者，即严重级随执行级别一起抬升。"
    resolved_by: "004 §2; 005 C7"
    resolution: >-
      Option one adopted: levels are mode-invariant and modes change only the ambiguity threshold. The recommendation's tentative answer to its own follow-up — severity rising with strict enforcement — is rejected: severities exist only in review mode, a rewrite has no findings to grade, and the only escalation is the demonstrated one in 004 §6. The 'enforced as if MUST' wording formerly in modes[strict] and in the A003 / P002 / P003 notes is withdrawn.
  - issue: "术语一致性的作用域单位。000-design.md §7.4 说「in a document or project」，但改写任务通常只看到文档片段。"
    options:
      - "仅限本次输入文本加调用方提供的上下文（本文件采用）。"
      - "允许模型使用自身的通用术语知识补齐一致性。"
      - "要求调用方显式提供术语约定，否则不执行 T001。"
    recommendation: "采用第一项。第二项等价于附带一份隐式术语表，违反 §7.4；第三项会让 T001 在绝大多数调用中失效。建议在 SKILL.md 中明确说明片段级一致性的局限：跨片段的不一致本技能无法发现，也不应假装发现。"
    resolved_by: "004 §3; 005 C1"
    resolution: >-
      Option one adopted. Variants not clearly co-referential are kept, not merged; in rewrite mode the variance enters 「待确认」 only when it impedes execution (category 5, S002); in review mode it is an ordinary finding.
  - issue: "CTC-L004 的 ID 归属。002-gold-case-schema.md 的示例案例 G-L-003（category: threshold-boundary）引用了 `rule: CTC-L004`，而 000-design.md §7 说 ID 在被决策或评估案例引用后即稳定。"
    options:
      - "按 002 的引用把阈值边界规则定为 CTC-L004（本文件采用），并放弃原先设想的 L004「隐含逻辑关系显式化」。"
      - "视 002 中的片段为示意性，另行编号。"
    recommendation: "采用第一项。分类上也讲得通：边界包含性决定的是条件的边界，属于 L 族而非 S 族；且 002 的确定性层把 comparator drift 与 quantity 分成两项检查，与本文件把 L004 与 S004 分开一致。若合成阶段改变这一编号，需要同步更新 002 的示例。"
    resolved_by: "004 §4"
    resolution: >-
      Option one adopted. CTC-L004 = threshold-boundary preservation, frozen in spec/rule-ids.txt.
  - issue: "000-design.md §7.2 把「隐含逻辑关系」列为候选歧义领域，本文件没有为它设立规则。"
    options:
      - "不设立，等待评估中出现真实失败（本文件采用）。"
      - "设为 SHOULD：当两个小句之间的关系有分歧读法且改变行为时，应显式化。"
      - "并入 A003 的结合歧义。"
    recommendation: "采用第一项。中文技术文本大量使用意合结构，一条要求显式化逻辑关系的规则会在正常并列句上广泛误触发，与 R002 直接冲突；而插入连接词又极易违反 S006。真正危险的子情形（条件读作现象）已被 L001 与 A005 覆盖。若评估中出现该类失败，再按门禁新增。"
    resolved_by: "004 §5"
    resolution: >-
      Option one adopted and recorded as a deliberate rejection with its counterexamples (GPT OR-04, Gemini OC-03), so that the gap is not 'fixed' by a later review pass.
  - issue: "严重级与规则级别是否恒等映射。T001 是 SHOULD，但鉴权文档中的术语混乱可能造成配置错误；A003 在 strict 下按 MUST 执行。"
    options:
      - "恒等映射，strict 抬升时严重级一并抬升（本文件采用）。"
      - "引入按上下文风险调整的严重级。"
    recommendation: "采用第一项。第二项需要一个风险模型，而本项目没有可靠的风险标注来源；用上下文风险调整严重级还会让同一条规则在不同文档中给出不同判决，破坏 review 输出的可比较性。"
    resolved_by: "004 §6; 005 C7"
    resolution: >-
      Identity mapping adopted (MUST→ERROR, SHOULD→WARNING, MAY→STYLE). The clause 'severity rises with strict escalation' is rejected — strict escalates nothing. The single escalation: a SHOULD violation may be reported as ERROR when the finding's 风险 names the specific different action an operator would take; no de-escalation.
  - issue: "CTC-R001（最小可归因改动）被放在 R 族，但它约束的是全部规则族的适用方式，不只是渲染。"
    options:
      - "留在 R 族（本文件采用）。"
      - "提升为一条与优先级阶梯并列的元规则，不进入任何族。"
      - "新设一个族。"
    recommendation: "采用第一项，但在合成时值得重新考虑第二项。留在 R 族的理由是保持 ID 空间简单、且它确实在渲染阶段被违反；反对的理由是它与 A005 一样是「上限型」规则，而 A005 在 A 族里也有同样的错位。若合成阶段引入元规则层，R001 与 A005 应一并迁移。"
    resolved_by: "004 §7"
    resolution: >-
      Option one adopted: CTC-R001 stays in family R. Family letters are stable prefixes, not a taxonomy; SKILL.md states that R001 governs all families.
