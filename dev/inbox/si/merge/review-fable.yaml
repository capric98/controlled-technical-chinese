# T4 自然度与过度控制（1–5）
naturalness:
  score: 4
  scale: "1 = 译文腔／伪法律赘语严重，5 = 地道的中文技术语体"
  quotes:
    - text: "更自然的句子若改变了真值条件，更显式的句子若凭空造出一项要求，更短的句子若丢掉一个条件或例外，都不是改进。"
      comment: 三个平行分句，话题链自然，无赘语；是全篇的高点。
    - text: "冻结普通名词短语会挡住正当改写，翻译标识符会造成不可逆损坏。"
      comment: 以对举句给理据，短而完整。
    - text: "来源把验证单独列为一个步骤时：未获压缩授权则该步骤保持独立；调用方授权合并步骤时可以并入相邻步骤，但合并后它必须仍是**由操作者执行**、位于被守护动作**之前**、且**逐项列全**原有判据的确认动作。"
      comment: CTC-P003 单元格超过 250 字、嵌套四层条件，读者须回头找「它」的先行词；是全篇最不易读的一处。
    - text: "部分↛全部、特指的「另一个 X」↛开放集合的「其他 X」、每次↛首次"
      comment: 用「↛」记号压缩规则，紧凑但已不是自然中文；对不熟悉记号的读者增加解析负担。
over_control:
  score: 2
  scale: "1 = 无多余约束，5 = 约束显著损害中文或可用性"
  quotes:
    - text: "**本步不得以「我没有改变语义」作结论**：模型对自身保持了语义的判断不是证据，也不能替代本步，只有逐项对照的结果算数。"
      comment: 同一禁令连说三遍；按候选自身的 R002 标准，后两句不消除任何歧义。
    - text: "保护的是**库存**：标记多重集必须相等。"
      comment: 把库存等式写成无例外的「必须」，连带封死了 S001／R002 允许的、含标记的重复成分删除（F2）。
    - text: "可进入该小节的只有七类，此外一律不得进入"
      comment: 封闭清单的口气很硬，但第 5 类兜底使它实际开放；硬口气与软内容不匹配，属表述上的过度控制而非行为上的。
    - text: "本技能假定技术数值会被直接复制进单位由字段名固定的配置项，且文档不标明哪些值是这样的：换算在算术上无损，在操作上有损。"
      comment: 理据句写进运行指令，拉长篇幅；但它解释的是一条真正必要的禁令，不构成新约束。
  note: |
    整体不过度：候选用 §9、R002、A001「本规则不要求每句都有显性主语」、§3「strict 不等于最大冗长」等多处主动限制自身的显式化倾向；
    过度控制集中在少数强调句的重复与一两处无例外的「必须」。
