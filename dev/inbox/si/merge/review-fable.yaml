summary:
  verdict: |
    候选是基线的压缩渲染（373 行 → 233 行）：29 条规则行的级别全部相同，28 条正文逐字相同，1 条（P003）只有措辞差异。
    删除的内容——§4 语义不变量表、§11 自检、§8 的 10 条「不得做的事」、§12 的 6 组示例、§10 的格式示例与严重级别定义——经逐项核对均可由保留的规则行或条文蕴含，归为 STYLE。
    候选同时消除了基线的五处内部矛盾：准入第 5 类「一律归第 5 类」与第 2–4 类的冲突（V11）；告警块管辖范围在 §5（子树／L001）与 P004 行（整个流程）之间的冲突（V8）；授权清单「四类」与 P003／R005 行自带授权的冲突（V10）；P003 示例正例与 P003／S001 行的冲突（V34）；流程第 1 步把数值放入「不可改集合」与 §5 允许半角化的张力（V12）。
