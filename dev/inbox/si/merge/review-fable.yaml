# T2 自宿主审阅（候选当作 agent 指令，strict 阈值，review 模式）
# 「规则」字段 = 问题所在／所引规则；严重级别按候选 §8 映射（必须→ERROR，应→WARNING，可以→STYLE），不升不降。
selfhost_findings:
  - id: F1
    rule: CTC-A005
    severity: ERROR
    location: |
      §1「覆盖 §3 strict 与 standard 适用范围所列的文档类型，以及状态提示、技术文本的英译中与既有中文技术文本的审校」；
      §1「其余任务按 §3 中 strict 与 standard 的适用范围推定，文档类型跨界时取 strict」；
      §3 review「属于 strict 适用范围的用 strict 的阈值，属于 standard 适用范围的用 standard 的阈值」
    problem: |
      「状态提示」被 §1 列为本技能覆盖的文档类型，但 §3 strict 适用范围只有「告警与错误信息」，standard 适用范围也不含它。
      模式未指定时，§1 的推定规则（按两个适用范围推定；跨界取 strict）对「状态提示」无解：它不属于任一范围，也不是「跨界」。
      review 模式的阈值选取同样只覆盖「属于 strict 适用范围」与「属于 standard 适用范围」两种情形，既不处理两者皆不属的类型，也未援引 §1 的「跨界取 strict」。
    risk: |
      对状态提示类文本，执行者在 strict 与 standard 阈值之间无据可择；两种阈值直接改变 A、P 两族 finding 的数量与改写触发。
    suggestion: |
      把「状态提示」并入 strict 适用范围（与「告警与错误信息」并列），并在 §3 review 的阈值选取处写明「两者皆不属或跨界时按 §1 取 strict」。
  - id: F2
    rule: CTC-R002
    severity: WARNING
    location: |
      CTC-R002「输出中出现逐句重复的主语、被机械拆分的短句，或不消除任何歧义的补充限定时，应删去」；
      §4「保护的是**库存**：标记多重集必须相等」；
      CTC-S001「只可删除同一断言的重复表述与纯修饰成分」
    problem: |
      R002 要求删去逐句重复的主语，S001 允许删除同一断言的重复表述；但当被删成分含受保护标记（如以行内代码写出的组件名作主语，或重复句含命令／路径）时，§4 的「标记多重集必须相等」（第 1 层）禁止该删除。
      两条规则都未写明这一边界，§2 阶梯只裁决「低层不得覆盖高层」，对 S001（第 1 层许可）与 §4 库存（第 1 层要求）的同层关系无裁决。
    risk: |
      执行者或按 R002 删除后在 §7 第 7 步被库存核对打回而回退，或直接保留机械重复——不同执行者行为不一致。无语义损失，但 R002 对这类主语实际失效。
    suggestion: |
      在 §4 库存句后加一条边界：「依 CTC-S001 删除的重复表述与依 CTC-R002 删去的重复主语，其中的标记随之减少，不计为库存不等」；或反向写明「含受保护标记的重复成分不删」。
  - id: F3
    rule: CTC-P004
    severity: ERROR
    location: |
      CTC-P004「该条件必须出现在被守护动作之前——同句前段，或紧邻的上一句」
    problem: |
      破折号后的补语把「之前」限定为「同句前段」或「紧邻的上一句」。来源中前置条件位于被守护动作之前但不紧邻（例如备份要求在破坏性步骤前两步、或条件句与动作句之间隔了一句）时，按字面，即使原样返回也不满足本规则；
      而要满足它只能移动或复制条件，前者触碰 CTC-R005／CTC-R001，后者正是 §4「不得把结构条件静默复制进每个子步骤」所禁止的。
      规则未区分「来源已满足的前置位置保持原位」与「改写新落位的条件须紧邻」。
    risk: |
      执行者可能在破坏性步骤旁复述来源已有但不紧邻的条件（产出重复的伪法律文本），或重排步骤；另一些执行者原样保留——同一来源得到不同输出。
    suggestion: |
      改为「该条件必须仍位于被守护动作之前；来源中已在前的条件保持原位，改写后新落位的条件取同句前段或紧邻的上一句」。
  - id: F4
    rule: CTC-R004
    severity: WARNING
    location: |
      CTC-T001「选择顺序：调用方给出的术语约定 > 来源中最明确且出现最多的形式 > 来源中首次出现的形式」
    problem: |
      「最明确」没有可观测判据；且第二档用「且」连接「最明确」与「出现最多」，两者不是同一形式时，第二档无解，规则未说明此时取其一还是落到第三档。
      候选自身的 CTC-R004 要求规范性指令的判定条件不得由无判据词承担。
    risk: |
      同一来源在不同执行者处被统一到不同术语，且选择无法归因。
    suggestion: |
      改为「来源中出现最多的形式；并列时取首次出现的形式」，或为「明确」给出可观测判据（如：带中英对照的全称优先于缩写）。
  - id: F5
    rule: CTC-T001
    severity: WARNING
    location: |
      §8「在发现冲突后修改被审文本或验收标准」；对照 §2「冲突裁决」与 §8「逐句定位违规，每条违规确定唯一的规则 ID」
    problem: |
      「冲突」在 §2 指规则与规则之间的冲突，在 §8 这一句指审阅中发现的违规；同一文档内一个词两个概念，而 §8 其余各处用「违规」。
    risk: |
      低；读者可能一时把这条禁令读成「发现规则冲突后不得修改验收标准」，从而漏掉它对「发现违规后改动被审文本」的禁止。
    suggestion: |
      改为「在发现违规后修改被审文本或验收标准」。
selfhost_findings_summary:
  total: 5
  ERROR: 2
  WARNING: 3
  STYLE: 0

# T3 反向解码（仅凭候选重建；fork=yes 表示能读出两种以上导致不同执行行为的读法）
reverse_decoding:
  - probe: CTC-S001
    level: 必须
    scope: 改写、压缩、合并或翻译含具体断言的文本（strict／standard／翻译；review 中作为对改写的核对项）
    trigger: 来源含独立断言（对象、属性、行为、数值、条件、结果、失败分支）
    requirement: 每条独立断言在输出中可还原；长度上限无法在不删除的前提下满足时，返回完全合规的最短文本并在「待确认」第 7 类说明
    prohibited: 删除条件、例外、阈值、告警、失败分支；以长度上限为由删除
    exceptions: 只可删除同一断言的重复表述与纯修饰成分
    invariants: 断言集合（可还原性，而非逐字）
    fork: "no"
    note: |
      「可还原」允许合并与重排，不要求逐字保留。唯一张力：删除含受保护标记的重复表述与 §4「标记多重集必须相等」相撞（见 F2）；
      许可（只可删除）不压过要求（必须相等），多数执行者会保留，不构成本规则自身的 fork。
  - probe: CTC-S003
    level: 必须
    scope: 任何模式；来源含情态、义务、请求、许可、禁止、建议或对系统行为的描述
    trigger: 上述成分出现
    requirement: (认识强度, 道义强度, 言语行为类型) 逐处不变；翻译时按强度类别对译
    prohibited: 列举的六类位移（确保→确认、请→须、不会→禁止、建议→必须、可能→会、必须→应）；描述升格为规范、请求升格为义务（§3 strict）；归一到本技能自身的规范词表（§7 翻译附则）
    exceptions: 同强度换词（不得↔禁止）；调用方显式授权调整道义强度（§3 调用方授权）
    invariants: 三元组 (认识强度, 道义强度, 言语行为类型)
    fork: "no"
  - probe: CTC-A001
    level: 必须
    scope: 来源指明了执行者（含被动句施事）的文本；review 同理
    trigger: 来源指明执行者
    requirement: 执行者在输出中仍可定位；补出执行者只在「存在多个可能执行者且不同读法改变由谁执行」时进行，且补出者须可由来源或上下文确定
    prohibited: 具名组件替换为笼统称呼；要求每句显性主语；把自然的无施事被动句报为施事缺失（review）
    exceptions: 施事可由上下文唯一推定时不补、不报
    invariants: 执行者—动作—对象关系
    fork: "no"
    note: 「可定位」= 可由话题链／上下文恢复，不等于显性主语，§9 第 1 条与 R002 共同锁定这一读法。
  - probe: CTC-A005
    level: 必须
    scope: 任何模式；阈值随模式变化（A 族受阈值影响）
    trigger: 两种以上导致不同行为的读法且来源与上下文不足以确定作者意图；或缺少执行所需的参数、阈值、接收方、判据
    requirement: 保持原表述；「待确认」给出位置、竞争读法或缺失项、判定所需的信息；review 模式下作为 finding（ERROR）
    prohibited: 静默择一；补出缺失项；输出多个完整备选版本（§5）
    exceptions: §5 不算真歧义的两种情形（读法不对应任何可执行操作；参数运行时由外部唯一确定）；standard 下只有普通技术读者会分歧的读法才算
    invariants: 该处来源表述
    fork: "no"
    note: |
      规则 ID 归属上有一处松动：缺失参数在 A005 正文归 A005，在「待确认」准入清单第 5 类归 CTC-S002。
      strict／standard 的「待确认」不写规则 ID，无行为差异；review 下 S002 的触发是「输出命题不可追溯」，对被审文本自身的缺失项不成立，因而落回 A005——可推定，不计 fork。
  - probe: CTC-P003
    level: 应
    scope: 来源给出成功判据、等待条件或验证方式的步骤文本
    trigger: 判据存在；或（缺判据分支）该步破坏性／不可逆且后续步骤安全性取决于它
    requirement: 判据与所验证步骤保持绑定并保持阻塞性质；独立验证步骤未获压缩授权则保持独立；授权合并后仍须由操作者执行、位于被守护动作之前、逐项列全
    prohibited: 移入附注／脚注／文末；祈使验证改为状态描述；虚构判据；缺判据的普通步骤进「待确认」
    exceptions: 调用方授权合并步骤；缺判据只在破坏性且后续依赖时报第 2 类
    invariants: 判据—步骤绑定、阻塞性、判据集合
    fork: "yes"
    readings:
      - reading: 「压缩授权」等同于「授权合并步骤」；调用方只给长度上限（如「不超过 200 字」）不算压缩授权
        behavior: 验证步骤保持独立；长度上限不满足时按 S001 返回最短合规文本并报第 7 类
      - reading: 任何压缩类指令（含纯长度上限）都构成压缩授权
        behavior: 可把验证步骤并入相邻步骤以满足上限
    note: §3 授权清单把「长度上限」与「CTC-P003 的合并步骤」分列为两项，偏向第一种读法；§10 示例的指令同时含「合并可合并的步骤」与步数上限，未能区分两者。
  - probe: CTC-P004
    level: 必须
    scope: 含破坏性、不可逆或改变外部状态操作的步骤，且来源给出了前置条件、前提或告警
    trigger: 二者同时成立
    requirement: 条件出现在被守护动作之前——同句前段，或紧邻的上一句；独立结构块告警管辖整个流程，不移动
    prohibited: 来源无条件时虚构；移动独立告警块（属 R005 违规）
    exceptions: 独立结构块告警不受「紧邻」要求约束
    invariants: 守护条件相对被守护动作的先后；告警块的管辖范围
    fork: "yes"
    readings:
      - reading: 「之前」= 任何在前位置；破折号补语只是改写新落位时的放置指引
        behavior: 来源条件已在前（即使隔了几句或几步）则原样保留
      - reading: 「之前」被限定为同句前段或紧邻上一句（字面）
        behavior: 来源条件在前但不紧邻时，执行者移动或复述条件到破坏性步骤旁，与 R001／R005／§4「不得复制进每个子步骤」相撞
    note: 另一未定点：作为先行步骤出现的前提动作（「1. 备份数据库」）是否算本规则的「前置条件」，候选未说。见 F3。
  - probe: CTC-R001
    level: 必须
    scope: 任何改写或翻译任务（含来源已合规的情形）；横跨全部五层
    trigger: 每一处改动
    requirement: 每处改动可归因到一条规则 ID；未触发规则的文本原样返回；归因在 strict／standard 下为内部纪律，在 review 下为「规则」字段
    prohibited: 以「更清楚」「更专业」为由等义替换；为体现工作量改写；混合多处不相关改动
    exceptions: 调用方授权即构成归因
    invariants: 未触发文本的原文
    fork: "no"
    note: 翻译任务中「原样返回」无法字面适用（整段语言改变）；候选未明说翻译本身即归因，但 §7 翻译附则「在同一流程内执行」足以让执行者把 R001 理解为约束翻译之外的额外改动。
  - probe: CTC-R002
    level: 应
    scope: 输出文本（含来源自带的缺陷），第 4 层
    trigger: 逐句重复的主语、机械拆分的短句、不消除任何歧义的补充限定
    requirement: 删去；每个补出的主语／重复中心语／拆出短句对应一处可指认的歧义风险；修复取最小改动
    prohibited: 为 strict 增加显式化数量；不含该缺陷的文本重写
    exceptions: 多执行者交替出现时重复主语；写出可确定的动作／对象／位置（属 P002）
    invariants: 无（风格规则，永远低于 S 族）
    fork: "no"
    note: 边界缺口见 F2（重复主语为受保护标记时与 §4 库存相撞）；阶梯可裁决（第 1 层压第 4 层），不计 fork。
  - probe: CTC-R004 与 §5 情态模糊段
    level: 应（R004）；§5 段落以「按本节处理」「不得」陈述，未另标级别
    scope: 规范性指令（agent 指令、SOP、策略、门禁条件）；第 2 层
    trigger: 判定条件由无判据词承担（「尽量」「尽可能」「最好」「适当」「必要时」「合理」——§3 示例另用「尽快」，表明清单为示例而非封闭）
    requirement: 新写时给出可观测触发条件；改写时在「待确认」第 4 类提出：指出缺失判据、列出两种以上可能强度、给出建议（第四栏），然后停手
    prohibited: 改写时补出判据；替换为具体强度或具体阈值
    exceptions: 限定观测事实的普通副词（「通常在 100 ms 内返回」）
    invariants: 该处来源表述；作者的规范决定权
    fork: "yes"
    readings:
      - reading: §5 的「列出其可能的两种以上强度并给出建议」适用于每一个 R004 触发点（R004 全部被定性为情态强度模糊）
        behavior: 「必要时重启」也要列出 必须／应 两档强度并建议，第四栏必填
      - reading: 仅当无判据词同时使义务强度未定（如「尽快」「尽量」）时才列强度与建议；像「必要时」这类只缺触发条件的，按 A005 格式报缺失判据，第四栏省略
        behavior: 第四栏有无、条目内容不同
    note: R004 规则行本身只说「在「待确认」中提出」，强度与建议的要求只在 §5 出现；两处合读才得出完整要求。
  - probe: 模式（阈值差异；是否改变级别；未指定时如何推定）
    level: n/a
    scope: 全部任务
    trigger: 动手前确定任务与模式
    requirement: |
      三种模式下全部规则按其级别生效；模式只改变歧义阈值：strict = 只要存在一种可执行且导致不同动作的读法即算竞争读法；standard = 普通技术读者会就此分歧才算；review = 按被审文档类型选 strict 或 standard 的阈值，只报告不改写。
      S、L、T 三族与阈值无关。严重级别只在 review 存在。未指定时：审阅任务用 review；其余按 §3 两个适用范围推定；跨界取 strict。
    prohibited: strict 把「应」提升为「必须」；任何模式以简洁或长度为名删除条件等
    exceptions: 无
    invariants: 规则级别不随模式变化
    fork: "yes"
    readings:
      - reading: 「状态提示」（§1 列出、两范围皆不含）归 strict（与告警并列的近邻类型）
        behavior: strict 阈值
      - reading: 「状态提示」归 standard 的「说明性技术散文」兜底
        behavior: standard 阈值
    note: |
      另两处未定但可推定：（a）「新写」任务无专属流程与输出契约，执行者只能把 §7 以「调用方素材 = 来源」套用；
