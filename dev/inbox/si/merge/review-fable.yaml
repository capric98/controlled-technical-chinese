    prohibited: 未获授权的同类改动；授权之外的同类改动
    exceptions: 调用方提供的事实属「调用上下文」，可依 S002 追溯，不需走授权
    invariants: 语义不变量的验证方式
    fork: "yes"
    readings:
      - reading: 「即」后的清单封闭：只有列出的几类改动可被授权；调用方要求的其他本来禁止的改动（如四舍五入、删除某个平台的章节）不可做，按 S001／S004 处理并在「待确认」说明
        behavior: 拒绝执行并报告
      - reading: 清单为示例；调用方的显式请求优先（§1「调用方给定的上下文…已授权的改动」），可授权任何本来禁止的改动
        behavior: 照做，授权即归因
    note: 「指定改写目标」未定义，它能否覆盖「只保留 Linux 部分」这类范围裁剪无法从候选判定；S001 只排除了「长度上限」这一种授权形式。
  - probe: review 流程与「未发现违规」时的输出
    level: 必须（流程为祈使；「不得」三项）
    scope: review 模式
