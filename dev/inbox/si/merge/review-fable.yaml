    prohibited: 无规则 ID 的 finding；凑数 finding；发现问题后改被审文本或验收标准；降级；其他升级
    exceptions: 无
    invariants: 被审文本；验收标准
    fork: "yes"
    readings:
      - reading: 「问题」= ERROR／WARNING 级 finding；R006（可以）项永远是「观察」
        behavior: 只有 R006 项时返回「未发现违规」并附最多三条；有 ERROR／WARNING 时 STYLE 项是否进列表、是否封顶，候选未说
      - reading: 「问题」= 任何 finding，含 STYLE
        behavior: 只有 R006 项时返回 finding 列表（无封顶），不返回「未发现违规」
    note: |
