# T2 自宿主审阅（review 模式，strict 阈值；按严重级别、再按文档位置排序）
selfhost_findings:
  - id: F1
    rule: CTC-A005
    severity: ERROR
    location: "模式未指定时，审阅任务用 review；其余任务按 §3 中 strict 与 standard 的适用范围推定，文档类型跨界时取 strict。"
    problem: |
      任务（改写／翻译／审阅／新写）与模式（strict／standard／review）是两个独立的选择，候选只规定了「模式未指定」时如何推定，没有规定调用方显式给出的模式与任务不一致时怎么办，例如「用 strict 审阅这份 SOP」。§3 输出契约按模式定义返回物（strict／standard → 只返回改写后的正文；review → 只返回 finding 列表），而 review 的歧义阈值又按被审文档类型选取，不按调用方指定。
    risk: |
      读法 A：模式 = strict，按输出契约返回改写后的正文，审阅请求被执行成改写。读法 B：任务 = 审阅，按 §8 输出 finding，并把 strict 当作歧义阈值（若被审文档属于 standard 范围，又与「阈值按被审文档的类型选取」冲突）。同一请求得到改写稿或 finding 列表两种不同产出。
    suggestion: |
      在 §1 补一句：「审阅任务始终按 review 模式输出 finding；调用方为审阅指定 strict 或 standard 时，指定的是歧义阈值，优先于按文档类型选取。改写、翻译、新写任务不使用 review 模式。」
  - id: F2
    rule: CTC-A005
    severity: ERROR
    location: "歧义阈值按被审文档的类型选取：属于 strict 适用范围的用 strict 的阈值，属于 standard 适用范围的用 standard 的阈值。"
    problem: |
      阈值选择有两处未覆盖：(1) §1 把「状态提示」列为覆盖对象（「以及状态提示、技术文本的英译中……」），但它既不在 strict 适用范围（只列「告警与错误信息」），也不在 standard 适用范围，改写时的模式推定与审阅时的阈值都无从选取；(2) 「文档类型跨界时取 strict」只写在 §1「其余任务」的推定规则里，review 行为对跨界文档（例如含 runbook 段落的 README）没有对应规定。
    risk: |
      跨界文档可读作整篇用 strict、整篇用 standard，或逐段分别取阈值；状态提示可读作 strict（类比告警与错误信息）或 standard。不同读法下 A、P 两族的触发数量不同，审阅产出的 finding 集合与改写产出的「待确认」都不同。
    suggestion: |
      把 strict 适用范围中的「告警与错误信息」改为「告警、错误与状态提示」；把 review 行为改为「……属于 standard 适用范围的用 standard 的阈值；跨界时用 strict 的阈值（与 §1 一致）。」
  - id: F3
    rule: CTC-A005
    severity: ERROR
    location: "可进入该小节的只有七类，此外一律不得进入："
    problem: |
      封闭清单与把内容送进「待确认」的规则不一致。(a) CTC-P005 适用于「agent 指令、系统提示或工具／函数描述」，并要求把来源未给出的「能力、参数上限或使用限制」在「待确认」中提出；第 3 类只写「工具描述缺失的触发条件（CTC-P005）」。(b) CTC-S001 的长度上限情形覆盖「条件、例外、阈值、告警或失败分支」，第 7 类只写「无法在不删除条件或例外的前提下满足」。(c) §2「不牺牲第 1 层就达不到第 2 层时，该处不改写，在「待确认」中报告。」没有对应类别；其典型情形（见 F5：先行词有证据可定，但写出标识符会改变标记库存）既不是证据不足（第 1 类），也不是信息缺失（第 5 类）。第 5 类兜底以「执行所需」为条件，而系统提示缺少使用时机、工具描述缺少参数上限是否「执行所需」，正文没有判据。
    risk: |
      系统提示缺少使用时机时，一种读法按 CTC-P005 写入「待确认」，另一种按封闭清单（第 3 类仅限工具描述、第 5 类要求「执行所需」）不写；§2 的不可达情形一种读法报告、一种读法静默。同一输入的「待确认」内容不同。(b) 项因 CTC-S001 自身写明「在「待确认」中说明上限未能满足」，执行上大多能消解，列出供一并修正。
    suggestion: |
      第 3 类改为「agent 指令、系统提示或工具描述缺失的触发条件、能力、参数上限或使用限制（CTC-P005）」；第 7 类改为「……无法在不删除条件、例外、阈值、告警或失败分支的前提下满足（CTC-S001）」；§2「第 1 层不可达」一条写明归入哪一类，或删去「在「待确认」中报告」并改为「保持原文」。
  - id: F4
    rule: CTC-A005
    severity: ERROR
    location: "调用方可以显式授权本来禁止的改动，即调整道义强度（规范强度）、精确的单位换算、解除某个受保护标记的保护、指定改写目标或长度上限"
    problem: |
      「指定改写目标」被列为能解锁「本来禁止的改动」的授权，且「授权本身即构成 CTC-R001 所要求的归因」，但正文没有界定改写目标能解锁哪类改动。§1 中「改写目标」指营销、品牌等文本的风格目标，与此处是否同一概念未说明。
    risk: |
      调用方给出「改写目标：面向新用户，精简背景说明」时，读法 A：该目标授权为达成目标所需的改写，包括 CTC-R001 本会禁止的等义替换，乃至删减背景断言（第 7 步「调用方已授权的改动不计为不成立」使其通过核对）；读法 B：改写目标只决定规则触发处怎样改，不解锁任何 S、L 族禁止的改动。两种输出可能相差整段内容。
    suggestion: |
      删去「指定改写目标」；或改为「指定改写目标（例如目标读者或语体；只授权对未触发规则的文本做等义改写，不授权改变第 1 层的任何不变量）」。
  - id: F5
    rule: CTC-A005
    severity: ERROR
    location: "保护的是**库存**：标记多重集必须相等。"
    problem: |
      「多重集必须相等」冻结了每个受保护标记的出现次数，而其他规则会合法地改变次数：CTC-A002（必须）要求先行词不唯一时「改用名词回指」，先行词是标识符时（如「调用 `get_user` 后调用 `update_user`，若其返回 404 则重试」），名词回指就是多写一次 `update_user`；CTC-P002 要求写出可确定的对象，常常就是命名空间或服务名标记；CTC-R002 合并重复的标识符主语、CTC-T001 把「最大重试次数」统一为 `max_retries`、CTC-S001 删除同一断言的重复表述，都会改变次数。正文没有说明「相等」是「来源中的标记不丢不改」还是「次数严格相等」。
    risk: |
      读法 A（次数严格相等）：S 族在第 1 层，压过第 2 层的 CTC-A002／P002，agent 不替换「其」，保留真实的指代歧义；按 §2 本应进「待确认」，但七类中无对应类别（见 F3），结果是静默留下歧义。读法 B（只要求不丢不改）：agent 用标识符替换指代。同一 strict 文本两种输出；review 模式下对同一改写一个判 ERROR、一个不报。
    suggestion: |
      改为「保护的是**库存**：来源中的每个受保护标记都必须在输出中逐字符出现，不得删除或改动；规则要求的名词回指、对象补写与术语统一可以增加已有标记的出现次数。」若作者意图是次数严格相等，则在 CTC-A002 中写明先行词为受保护标记时只能调整语序，无法调整时按第 1 类报告。
  - id: F6
    rule: CTC-A005
    severity: ERROR
    location: "该条件必须出现在被守护动作之前——同句前段，或紧邻的上一句。"
    problem: |
      位置要求只给出「同句前段或紧邻的上一句」两种合格位置，没有说明它约束的是改写造成的位移，还是来源本身的排列。来源为「1. 确认已备份。2. 停止服务。3. 执行 DROP TABLE。」时，前置条件在被守护动作之前，但不在紧邻的上一句。
    risk: |
      读法 A（约束来源排列）：agent 必须把「确认已备份」重述进第 3 步，或把第 1 步移到第 2 步之后——前者是 §4 所说的重复伪法律文本、不消歧的补充限定（CTC-R002），后者改变来源的步骤顺序（CTC-L003、CTC-P001）。读法 B（只禁止改写把条件挪到动作之后或挪远）：原样返回。审阅时读法 A 会对大量正常 runbook 报 ERROR。
    suggestion: |
      改为「……该条件在输出中必须仍位于被守护动作之前，且不得比来源中离该动作更远；来源中条件原本就位于被守护动作之前时保持原位。」
  - id: F7
    rule: CTC-A005
    severity: ERROR
    location: "没有改动任何规则并未要求改动的地方（CTC-R001）"
    problem: |
      第 7 步把 CTC-R001 的判据转述为「规则要求」，而 CTC-R001 本身的判据是「每一处改动必须能归因到一条具体规则 ID」。CTC-R006 是「可以」级许可规则，§4 也写明「受保护标记之外的全角数字半角化属于排版，可以做」：这类改动有规则 ID，但没有规则「要求」它们。
    risk: |
      读法 A（按第 7 步字面）：返回前回退全部排版统一与全角数字半角化；读法 B（按 CTC-R001）：保留。同一次改写返回的文本不同；review 模式下对同一改写，一个审阅者按 CTC-R001 报 ERROR，另一个不报。
    suggestion: |
      改为「没有改动任何不能归因到具体规则 ID 的地方（CTC-R001）」。
  - id: F8
    rule: CTC-T001
    severity: WARNING
    location: "第四栏只在规则要求给出建议时填写（§5 的情态模糊），其余情形省略。"
    problem: |
      第四栏的触发对象有三种称呼：§3 的「§5 的情态模糊」、§5 的「规范性指令中由无判据词（见 CTC-R004）承担义务的条件」、第 4 类的「无判据的规范条件（CTC-R004）」。按 §5 的定义，它覆盖全部第 4 类条目，每条都要「列出其可能的两种以上强度并给出建议」；但示例第一行「多次失败 | 「多次」未给出具体次数 | 触发升级的失败次数阈值」是规范条件由无判据词「多次」承担的情形，没有第四栏，只有「尽快回滚」一行有。
    risk: |
      对「多次失败后升级」「必要时重启」这类条目，一种读法填第四栏并给出建议，另一种读法省略；且「列出其可能的两种以上强度」对阈值类无判据词（多次）无法执行。改写输出的「待确认」格式与内容因此不一致。
    suggestion: |
      统一为一个术语并界定范围，例如在 §3 与 §5 都写：「第四栏只在无判据词使义务强度未定时填写（如「尽快」可读作「必须立即」或「应在窗口内」）；无判据词只使阈值或触发条件未定时（如「多次」），不填第四栏。」
  - id: F9
    rule: CTC-A003
    severity: WARNING
    location: "不得换算单位、四舍五入、改变数制（`3`↔`三`）或在比例与百分比之间转换，只有在调用方明确授权、换算精确、且该值不在受保护标记内时才可以换算（CTC-S004）"
    problem: |
      例外「只有在调用方明确授权……时才可以换算」既可以只作用于第一并列项「换算单位」，也可以作用于全部并列项（比例与百分比互换、改变数制都可以称为换算；四舍五入因「换算精确」被排除）。§3「调用方授权」只列「精确的单位换算」，支持前一种结合；「才可以换算」紧跟整个并列结构，支持后一种。
    risk: |
      调用方要求「把比例统一写成百分比」或「正文数字用中文数字」时，读法 A 视为清单外改动而拒绝，读法 B 照做。两种输出的数值表面形式不同，而 CTC-S004 是必须级。
    suggestion: |
      改为「……只有在调用方明确授权、换算精确、且该值不在受保护标记内时才可以换算单位（CTC-S004）；改变数制与比例和百分比的互换不在授权范围内。」或在 §3 授权清单中补列这两项。
  - id: F10
    rule: CTC-T001
    severity: WARNING
    location: "未获压缩授权则该步骤保持独立；调用方授权合并步骤时可以并入相邻步骤"
    problem: |
      同一条规则用「压缩授权」与「授权合并步骤」两个称呼，§3 授权清单则分列「长度上限」与「CTC-P003 的合并步骤」。调用方只给出步骤数上限（「压缩到不超过 2 步」）而没有说「合并」时，是否构成本条所说的「压缩授权」无从判定；§10 示例的指令同时含「合并可合并的步骤」与「压缩到不超过 2 步」，不能区分两者。
    risk: |
      读法 A：步骤数上限即压缩授权，验证步骤并入相邻步骤；读法 B：只有明确的合并授权才能并入，验证步骤保持独立，上限无法满足时按第 7 类报告。两种输出的步骤结构不同。
    suggestion: |
      统一为「调用方授权合并步骤」，并写明「只给出长度或步骤数上限不构成合并授权」（或按作者意图写明相反结论）。
  - id: F11
    rule: CTC-R004
    severity: WARNING
    location: "过长的「的」字串"
    problem: |
      CTC-R003 的触发条件之一由无判据词「过长」承担，没有可观测的界限（层数或字数）。CTC-A003 又写明「正常的中文多层定语不因长度或嵌套触发本规则」，读者无法据此推出 CTC-R003 的界限。
    risk: |
      改写时，同一个三层「的」字串一种读法改写、一种读法保留；审阅时一个审阅者报 WARNING、另一个不报。改写一侧正是 §9 要防止的过度编辑。
    suggestion: |
      给出可观测界限（例如同一定语串中「的」的个数上限，数值由作者确定），或删去该项，把结合歧义交给 CTC-A003 处理。
selfhost_findings_count:
  ERROR: 7
  WARNING: 4
  STYLE: 0
  total: 11

# T3 反向解码（仅凭候选重建）
reverse_decoding:
  - probe: CTC-S001
    level: 必须
    scope: 改写、压缩、合并、翻译任务；review 模式核对改写稿时同样适用
    trigger: 改写、压缩、合并或翻译含具体断言的文本
    requires: 来源每条独立断言（对象、属性、行为、数值、条件、结果、失败分支）在输出中可还原；调用方给定的长度上限无法在不删除的前提下满足时，返回完全合规的最短文本，并在「待确认」中说明上限未能满足（第 7 类）
    prohibits: 删除独立断言；以长度上限为由删除条件、例外、阈值、告警或失败分支；（§3 重申）任何模式下以简洁或长度为名删除前提、守护条件、成功判据、默认值或受保护标记
    exceptions: 可以删除同一断言的重复表述与纯修饰成分；软限定词（可能、通常、预计）不属于可删的纯修饰成分（§9 第 4 条）
    invariants: 断言集合
    fork: no
    notes: 第 7 类措辞（条件或例外）比本条列举的范围窄，但本条自身写明要报告，执行上可消解（见 F3(b)）。删除含受保护标记的重复表述会改变标记出现次数，与 §4「多重集必须相等」相撞（见 F5）。
  - probe: CTC-S003
    level: 必须
    scope: 全部改写、翻译；review 核对
    trigger: 来源含情态、义务、请求、许可、禁止、建议或对系统行为的描述
    requires: (认识强度, 道义强度, 言语行为类型) 逐处不变；翻译时情态词按强度类别对译，不按字面，也不归一到本技能自身的规范词表
    prohibits: 确保→确认、请→须、不会→禁止、建议→必须、可能→会、必须→应；（strict）把描述升格为规范、把请求升格为义务；删除软限定词
    exceptions: 同强度换词（不得↔禁止）允许；调用方显式授权「调整道义强度（规范强度）」时可以改
    invariants: 三元组逐处不变
    fork: yes
    readings:
      - id: A
        reading: 授权「调整道义强度」覆盖「请→须」这类同时改变言语行为类型（请求→义务）的改动
        behavior: 调用方要求把「请」统一为「须」时照做
      - id: B
        reading: 授权清单只列道义强度，言语行为类型不在其中；「请→须」被本条单独列为违规
        behavior: 即使调用方要求也不改，或按清单外改动拒绝
    notes: 低频，未升为 finding。另：§10 示例 2 的反例把「须」改为「必须」而未标 CTC-S003，隐含二者同强度，正文未明说。
  - probe: CTC-A001
    level: 必须
    scope: 全部模式；review 模式有专门的不报条件
    trigger: 来源指明执行者（含被动句施事）；或存在多个可能执行者且不同读法改变由谁执行
    requires: 来源指明的执行者在输出中仍可定位；需要补出时，补出的执行者必须能从来源或上下文确定
    prohibits: 把具名组件替换为笼统称呼；在不满足「多个可能执行者且改变由谁执行」时补执行者；虚构执行者（strict 段、§9 第 3 条）
    exceptions: 不要求每句有显性主语；review 模式下施事可由上下文唯一推定时不产生 finding；执行者无法确定时转 CTC-A005
    invariants: 执行者—动作—对象关系
    fork: no
  - probe: CTC-A005
    level: 必须
    scope: 全部模式；也是 CTC-A003、CTC-L004、CTC-P002 无证据时的去向
    trigger: (a) 两种以上导致不同行为的读法，来源与上下文都不足以确定作者意图；(b) 缺少执行所需的参数、阈值、接收方或判据
    requires: 保持原表述；在「待确认」中给出位置、竞争读法或缺失项、判定所需的信息；review 模式下作为 finding，严重级别 ERROR
    prohibits: 静默择一；补出缺失项；输出多个完整备选版本；用流畅改写把歧义掩盖成确定句
    exceptions: §5「不算真歧义」两种情形（一种读法不对应可执行操作；参数在运行时由外部唯一确定）；standard 下竞争读法的门槛更高
    invariants: 该处原表述不变
    fork: no
    notes: (a) 进第 1 类，(b) 进第 5 类（「第 2–4 类之外……不论由哪条规则发现」），路由可消解。
  - probe: CTC-P003
    level: 应（正文中的「必须」按 §6 不改变本栏级别）
    scope: 含成功判据、等待条件、验证方式或独立验证步骤的可执行流程
    trigger: 来源给出成功判据、等待条件或验证方式；来源把验证单独列为一步；来源未给出成功判据
    requires: 判据与所验证的步骤绑定，保持阻塞性质；独立验证步骤未获压缩授权时保持独立；获合并授权时，合并后仍由操作者执行、位于被守护动作之前、逐项列全原有判据；破坏性或不可逆、且后续安全取决于其成败的步骤缺判据时进「待确认」第 2 类
    prohibits: 把判据移入附注、脚注或文末；把祈使的验证动作改写为系统行为描述；虚构判据；丢掉任一判据；对其余步骤的缺判据提出未决项
    exceptions: 调用方授权合并步骤
    invariants: 判据集合、阻塞性、执行者（操作者）、判据与动作的先后
    fork: yes
    readings:
      - id: A
        reading: 调用方只给出步骤数或长度上限（「压缩到不超过 2 步」）即构成「压缩授权」
        behavior: 把验证步骤并入相邻步骤
      - id: B
        reading: 只有明确的「授权合并步骤」才能并入；上限不构成合并授权
        behavior: 验证步骤保持独立，上限无法满足时按第 7 类报告
    notes: 见 F10。
  - probe: CTC-P004
    level: 必须
    scope: 含破坏性、不可逆或改变外部状态操作的步骤
    trigger: 步骤含此类操作（删除、DROP、覆盖、重启、扩缩容、发布、回滚、密钥轮换、清空缓存），且来源给出了前置条件、前提或告警
    requires: 该条件出现在被守护动作之前：同句前段，或紧邻的上一句
    prohibits: 来源没有给出条件时虚构；移动独立告警结构块（按本条记为 CTC-R005 违规）
    exceptions: 独立结构块形式的告警（「警告：」「注意：」段落、告警框）管辖所依附的整个流程，不论位于流程前后，不要求移动
    invariants: 条件与被守护动作的绑定及先后
    fork: yes
    readings:
      - id: A
        reading: 位置要求约束来源本身的排列；前置条件与动作之间隔了其他步骤也算违规
        behavior: 把条件重述进被守护步骤，或重排步骤；审阅时对此类正常 runbook 报 ERROR
      - id: B
        reading: 位置要求只约束改写造成的位移
        behavior: 来源条件已在动作之前时原样保留
    notes: 见 F6。另：「移动它属于 CTC-R005 违规」与 CTC-R005 的定义不一致——CTC-R005 保护的是层级、项数、行列等粒度，不涉及块的位置；改写时 CTC-R001 同样禁止移动，行为一致，只影响审阅时引用哪条规则，未升为 finding。
  - probe: CTC-R001
    level: 必须
    scope: 任何改写或翻译任务；review 模式下即 finding 的「规则」字段
    trigger: 任何改写或翻译，尤其来源已正确、清晰、合规时
    requires: 每一处改动能归因到一条具体规则 ID；未触发任何规则的文本原样返回；改动可分别审查
    prohibits: 以「更清楚」「更专业」为由的等义替换；为体现工作量而改写；混合不相关改动
    exceptions: 调用方授权本身构成归因（§3）；CTC-R006 与 §4 允许的排版改动有规则 ID 可归因
    invariants: 未触发处逐字不变
    fork: no
    notes: 本条自身单义；与之相关的分叉来自转述与授权处（F4「指定改写目标」、F7 第 7 步「规则并未要求」）。翻译任务中「原样返回」的基准未定义，但 CTC-R002／R003 会把直译残留归因修复，两种理解的输出大体收敛。
  - probe: CTC-R002
    level: 应
    scope: 全部改写、翻译；strict 不改变其强度（「strict 提高的是歧义敏感度，不是显式化的数量要求」）
    trigger: 输出中出现逐句重复的主语、机械拆分的短句，或不消除任何歧义的补充限定
    requires: 删去；每个补出的主语、重复的中心语、拆出的短句都应对应一处可指认的歧义风险；修复取最小改动
    prohibits: 不含该缺陷的文本借本条重写（§6 R 族表后说明）
    exceptions: 多执行者交替时重复主语有消歧价值；写出可确定的动作、对象或位置属 CTC-P002，不在禁止之列
    invariants: 层级低于 S、L 等第 1 层规则
    fork: no
    notes: 重复主语是受保护标记时，合并会改变标记次数（F5）。
  - probe: CTC-R004
    level: 应
    scope: 规范性指令（agent 指令、SOP、策略、门禁条件）
    trigger: 判定条件由无判据词承担——「尽量」「尽可能」「最好」「适当」「必要时」「合理」
    requires: 新写时给出可观测的触发条件（阈值、状态或事件）；改写时在「待确认」中提出（第 4 类），按 §5 指出缺失判据、列出两种以上强度并给出建议
    prohibits: 改写时补出来源没有的判据
    exceptions: 目标文档中限定观测事实的普通副词（「该接口通常在 100 ms 内返回」）
    invariants: 来源的规范条件原样保留
    fork: yes
    readings:
      - id: A
        reading: 无判据词限于所列六词及同类评价词；「多次」「尽快」类数量或时限词按第 5 类处理
        behavior: 不填第四栏，类别记第 5 类
      - id: B
        reading: 任何承担规范条件的无判据数量或时限词都属第 4 类
        behavior: 按 §5 填第四栏并给出建议
    notes: 见 F8。新写时触发条件从何而来未写明，但 CTC-S002（第 1 层）压过本条，按阶梯可消解为「无素材时进待确认」。
  - probe: §5 情态模糊段
    level: 按 CTC-R004（应）；替换为具体强度或阈值同时触犯 CTC-S002／S003（必须）
    scope: 改写时的规范性指令；新写；review 时作为 finding
    trigger: 规范性指令中由无判据词承担义务的条件
    requires: 改写：在「待确认」中指出缺失的判据，列出两种以上可能强度并给出建议（第四栏），然后停手；新写：给出可观测的触发条件
    prohibits: 替换为具体强度或具体阈值
    exceptions: 未写明
    invariants: 原表述
    fork: yes
    readings:
      - id: A
        reading: 本段覆盖全部第 4 类条目（其定义句「由无判据词承担义务的条件」与第 4 类同范围）
        behavior: 「多次失败」也要列强度并给建议，与 §3 示例不符
      - id: B
        reading: 本段只覆盖使义务强度未定的情形（标题句「情态强度的模糊」）
        behavior: 只有「尽快」类填第四栏，与 §3 示例一致
    notes: 见 F8。
  - probe: 模式
    threshold_difference: strict——只要存在一种在本文档语境下可执行、且导致不同动作的读法即算竞争读法；standard——只有普通技术读者会就此产生分歧时才算；review——按被审文档类型选 strict 或 standard 的阈值
    changes_rule_levels: 否。「模式改变的是歧义阈值，不是规则级别」；S、L、T 三族的触发与阈值无关；严重级别只存在于 review 模式
    default_inference: 审阅任务用 review；其余任务按 §3 两种适用范围推定；文档类型跨界时取 strict
    fork: yes
    readings:
      - id: A
        reading: 调用方显式给出的模式决定输出契约（「用 strict 审阅」→ 返回改写稿）
        behavior: 输出改写后的正文
      - id: B
        reading: 任务决定流程，模式只决定阈值
        behavior: 输出 finding 列表，用 strict 阈值
      - id: C
        reading: 状态提示或跨界文档在 review 中逐段取阈值／按 standard 处理
        behavior: A、P 两族的触发数量与 A／B 读法下不同
    notes: 见 F1、F2。
  - probe: 「待确认」准入清单
    content: 七类封闭清单——1 证据不足的歧义（A005）；2 来源从未给出的成功判据（P003，只限破坏性或不可逆且后续安全依赖其成败的步骤）；3 工具描述缺失的触发条件（P005）；4 无判据的规范条件（R004）；5 第 2–4 类之外、执行所需而来源与上下文都未提供的信息（S002，不论由哪条规则发现）；6 受保护标记拼写疑似有误（S005）；7 长度上限无法在不删除条件或例外的前提下满足（S001）。此外一律不得进入；不记录风格偏好；格式「位置 | 问题 | 需要的信息 | 建议（可选）」，第四栏只用于 §5 的情态模糊；仅存在未决项时追加
    routes_in: CTC-A003、CTC-L004、CTC-P002 经 CTC-A005 进入；术语差异只在妨碍执行时按第 5 类进入；§2「第 1 层不可达」要求报告但无对应类别
    fork: yes
    readings:
      - id: A
        reading: 类别描述即准入边界（第 3 类只限工具描述的触发条件）
        behavior: 系统提示缺少使用时机、工具缺少参数上限、§2 不可达情形不写入
      - id: B
        reading: 类别按所引规则的全部范围理解，或由第 5 类兜底
        behavior: 写入
    notes: 见 F3、F8。
  - probe: 调用方授权清单
    content: 调整道义强度（规范强度）；精确的单位换算；解除某个受保护标记的保护；指定改写目标或长度上限；规则条文中写明的授权（CTC-P003 合并步骤、CTC-R005 改变格式）。授权须显式；授权本身构成 CTC-R001 的归因；未获授权的同类改动一律不得做；授权不改变语义不变量的验证方式（第 7 步不把已授权改动计为不成立）。另：调用方可以向保护集追加字符串（这是加限制，不是解锁）
    fork: yes
    readings:
      - id: A
        reading: 「指定改写目标」可解锁为达成目标所需的任何改写；「换算」例外覆盖比例与百分比互换和改变数制；步骤数上限即压缩授权；道义强度授权覆盖「请→须」
        behavior: 照调用方要求做这些改动
      - id: B
        reading: 清单逐项从严：改写目标不解锁语义改动；只有单位换算；只有明确的合并授权；言语行为类型不在清单内
        behavior: 拒绝或按第 7 类报告
    notes: 见 F4、F9、F10，以及 CTC-S003 探针。
  - probe: review 流程与「未发现违规」时的输出
    flow: 1 按 §7 第 1–3 步建立比对基准（受保护标记、语义骨架、按文档类型的歧义阈值）；2 逐句定位违规，每条唯一规则 ID，同处多规则分列；3 六字段（规则、严重级别、位置、问题、风险、建议修改），位置逐字引用；4 按严重级别、再按文档位置排序
    severity: 必须→ERROR，应→WARNING，可以→STYLE；唯一升级：「应」级违规在「风险」字段指名操作者因此会做的不同动作时可以按 ERROR 报告；无其他升级，无降级；排版问题不得按 ERROR 上报
    prohibitions: 报告无规则 ID 的 finding；为显得周全制造 finding；发现冲突后修改被审文本或验收标准
    no_findings_output: 返回「未发现违规」，其后最多三条 STYLE 观察，每条引用规则 ID；没有 finding 是有效结果
    fork: yes
    readings:
      - id: A
        reading: 「未发现问题」指没有 ERROR／WARNING；只有 CTC-R006 类排版不一致时输出「未发现违规」加至多三条观察
        behavior: 至多三条，非六字段格式
      - id: B
        reading: STYLE 也是 finding（可以→STYLE 映射）；只要有任何 finding 就输出完整的六字段列表
        behavior: 全部 STYLE 条目按六字段列出，不设上限
    notes: 影响限于格式与条数，未升为 finding。另：升级用「可以」，满足条件时是否升级由审阅者自行决定，同一违规在不同审阅者处可能得到不同级别；这是许可的本义，未列为分叉。
  - probe: 返回前核对（§7 第 7 步）
    requires: 渲染后与来源逐句对照，重新抽取第 1、2 步登记的全部项逐项比较；S、A、P、T、L 五族每条规则的保持项与来源相同；核对没有不消歧的补出成分、没有译文腔（R002、R003）、没有改动规则并未要求改动的地方（R001）；任一项不成立先修复再返回；调用方已授权的改动不计为不成立；不得以「我没有改变语义」作结论
    fork: yes
    readings:
      - id: A
        reading: 「规则并未要求改动」按字面——只保留规则要求的改动
        behavior: 回退 CTC-R006 排版统一与全角数字半角化
      - id: B
        reading: 按 CTC-R001 原文——能归因到规则 ID 即可
        behavior: 保留
    notes: 见 F7。「保持项都须与来源相同」需理解为语义项，否则与 CTC-A002、CTC-P002、CTC-T001 要求的改动相撞；上下文可消解。§7 只覆盖改写与翻译，新写任务没有对应流程，第 7 步的「来源」在新写中指调用方素材，正文未明说。

# T4 自然度与过度控制
naturalness:
  scale: 1 = 译文腔或机械化严重，5 = 自然的专业技术中文
  score: 4
  rationale: 主体是凝练、自然的技术中文，话题链与连动用得当；扣分处是元组与箭头记号、个别并列结构生硬，以及 §4 与 §7 第 7 步的长句。
  quotes:
    - "对歧义保持沉默是较轻的失败，替作者决定不是。"
    - "保护的是**库存**：标记多重集必须相等。**绑定**由语义层负责——`发送 A 给 B` 与 `发送 B 给 A` 库存相同而语义相反。"
    - "未定分两种：竞争读法，与操作未定（做哪个动作、对哪个对象、在哪个节点）"
    - "本技能假定技术数值会被直接复制进单位由字段名固定的配置项，且文档不标明哪些值是这样的：换算在算术上无损，在操作上有损。"
over_control:
  scale: 1 = 几乎没有不必要的约束，5 = 普遍过度约束
  score: 2
  rationale: 多数规则带有明确边界与反例（CTC-A001、CTC-R002、CTC-P003 的未决项限制、§9），整体是在抑制过度控制；过度约束集中在少数位置：CTC-P004 的「紧邻的上一句」会在来源已正确时也触发（F6），CTC-P003 单元格过长，第 7 步与封闭准入清单的防御性措辞偏重。
  quotes:
    - "该条件必须出现在被守护动作之前——同句前段，或紧邻的上一句。"
    - "**本步不得以「我没有改变语义」作结论**：模型对自身保持了语义的判断不是证据，也不能替代本步，只有逐项对照的结果算数。"
    - "但合并后它必须仍是**由操作者执行**、位于被守护动作**之前**、且**逐项列全**原有判据的确认动作。"
    - "其余步骤缺少判据不提出，以免正常的流程文档产生成串的未决项。"
---
judge_phase: 2
reviewer_model: Opus 5.5 (claude-opus-5-5)
