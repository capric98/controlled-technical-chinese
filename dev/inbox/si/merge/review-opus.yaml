summary: |
  候选 232 行，基线 372 行。frontmatter 逐字相同。29 条规则行中 28 条逐字相同，只有 CTC-P003 行有两处措辞改动（「验收标准」→「判据」；理据句改为目的说明，V22）；规则级别与规则 ID 归属没有变化。
  vs_baseline 共 44 项，没有 ERROR 级差异：WARNING 14 项，STYLE 30 项。
  WARNING 项大多是消解基线内部冲突：§6「必须消歧」与规则级别（V16）；§6 固定 ERROR 与映射（V17）；封闭「四类」授权与规则行内授权（V10）；第 5 类与第 2–4 类重叠（V8）；第 1 步「不可改集合」与半角化许可（V29）；翻译「代码块一律不译」与 CTC-S005 示意块例外（V34）；§5 告警块管辖范围与 CTC-P004（V15）；自检与已授权改动（V32）；两套严重级别定义（V35）。另有审阅任务模式推定（V1）、情态模糊段的范围与强度（V19）、「规则正文中的必须不改变该栏级别」（V21），以及 CTC-P003 示例由不合并改为合并的 example-correction（V44）。
  实质性丢失只有一项：返回前对输出契约与结构粒度的核对（V33，WARNING）。其余丢失都是示例、理据或在规则行中仍有承载的重复表述：基线 §12 八则示例删去六则，§8 十五条压缩为五条，§4 不变量表的「破坏后的后果」列，§10 finding 示例块。基线中与规则行矛盾的四则示例，候选删去两则（V24「归零」、V42「去被动正当」），更正两则（V23 删执行者、V44 拒绝已授权的合并）。
  阶段 1 的 11 条 finding 与 10 个分叉在基线中全部存在，候选没有引入新的 finding 级问题。但候选删去了基线中两处偏向单一读法的佐证（不变量表与自检中的守护顺序措辞、§6 的「多次」对照例），使 F6、F8 的分叉略有加重。
