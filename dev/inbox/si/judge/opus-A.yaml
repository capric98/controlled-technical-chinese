      - probe: 返回前核对
        level: 必须（§4「返回之前必须逐项验证」；§11「任一项为「否」，先修复再返回」）
        scope: "改写、压缩与翻译之后，返回之前。"
        trigger: "改写完成、返回前。"
        required: "§4：21 项不变量逐项验证；§9 第 7 步：10 项重抽比对；§11：12 问逐项回答。"
        prohibited: "以「我没有改变语义」作结论。"
        exceptions: "无显式例外（没有写明调用方已授权的改动如何计）。"
        invariant: "三份清单的并集才覆盖全部规则族。"
        fork: yes
        readings:
          - "读法 1（§4 为准）→ 验证全部 21 项，含逻辑式（L002）、修饰结合域（A003）、步骤图（P001）；任一偏离记为带严重级别的 finding。"
