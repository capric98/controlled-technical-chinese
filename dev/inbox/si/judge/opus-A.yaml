        exceptions: "多角色交替执行时补主语。"
        invariant: "示例应与所引规则方向一致，但第 1、2 条示例各自违反 CTC-A001、CTC-S002。"
        fork: yes
        readings:
          - "读法 1（以示例为范本）→ 合句时删去全部具名执行者（第 1 条），并补出来源没有的等待判据「归零」（第 2 条）。"
