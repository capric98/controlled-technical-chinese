      - probe: 优先级阶梯
        level: "冲突裁决机制（不授权改动）"
        scope: "规则之间的冲突。"
        trigger: "规则或候选改动冲突。"
        required: "五层与各族归属同 X（S、L 在 1；A、P、R004 在 2；T 在 3；R002、R003、R005 在 4；R006 在 5；R001 横跨）。低层不覆盖高层；需要新增才能达到第 2 层时第 1 层胜出、缺口进「待确认」；同层保留来源形式；第 2 对第 4 层只有消除未定时显式化胜出；第 1 层不可达时不改写、进「待确认」。"
