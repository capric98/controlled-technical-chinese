judge_phase: 1
files_read:
  - dev/inbox/si/blind/A.md
  - dev/inbox/si/blind/C.md
# 说明：为确认输出目录存在，执行过一次 mkdir -p 与 ls（列出了 judge/ 下的文件名），未读取其中任何文件内容。

documents:
  X:
    path: dev/inbox/si/blind/A.md
    rule_levels:
      CTC-S001: 必须
      CTC-S002: 必须
      CTC-S003: 必须
      CTC-S004: 必须
      CTC-S005: 必须
      CTC-S006: 必须
      CTC-S007: 必须
      CTC-A001: 必须
      CTC-A002: 必须
      CTC-A003: 应
      CTC-A004: 必须
      CTC-A005: 必须
      CTC-P001: 必须
      CTC-P002: 应
      CTC-P003: 应
      CTC-P004: 必须
      CTC-P005: 应
      CTC-T001: 应
      CTC-T002: 必须
      CTC-L001: 必须
      CTC-L002: 必须
      CTC-L003: 必须
      CTC-L004: 必须
      CTC-R001: 必须
      CTC-R002: 应
      CTC-R003: 应
      CTC-R004: 应
      CTC-R005: 应
      CTC-R006: 可以
    selfhost_findings:
      - id: X-F1
        rule: CTC-A005
        severity: ERROR
        locus: "§5：「规范性指令中，义务的强度由「最好」「尽量」「尽可能」这类无判据词承担时，报告其可能的两种以上强度并在第四栏给出建议，然后停手；「必要时」「适当」「合理」承担的是判定条件而非强度，只按第 4 类提出（CTC-R004）」；§6 CTC-R004：「规范性指令（agent 指令、SOP、策略、门禁条件）的判定条件由无判据词承担时——「尽量」「尽可能」「最好」「适当」「必要时」「合理」——」"
        problem: "两处对同一批词给出不同归类。§5 把「最好」「尽量」「尽可能」划为承担强度（按 §5 情态模糊处理，填第四栏建议，review 下按「所引规则」定级），只把「必要时」「适当」「合理」划入 CTC-R004；CTC-R004 正文却把六个词都列为承担判定条件的无判据词。对「尽量在窗口内回滚」这类句子，文本同时支持两种处理。按 §8 第 1 步，文内两处陈述对同一情形要求不同行为，按 CTC-A005 报告。"
        risk: "review 模式下，同一处「尽量」一位审阅者按 CTC-R004（应 → WARNING）报告，另一位按 §5／CTC-A005（必须 → ERROR）报告；改写模式下，一个 agent 在第四栏给出强度建议，另一个按第 4 类只报缺失判据、不填第四栏。输出不可比，门禁结果取决于审阅者选了哪一处。"
        suggestion: "在 CTC-R004 的词表中删去「尽量」「尽可能」「最好」，或在其后加一句：「其中「最好」「尽量」「尽可能」承担强度时按 §5 的情态模糊处理」；并在 §5 写明情态模糊在 review 模式下所引的规则 ID。"
    reverse_decoding:
      - probe: CTC-S001
        level: 必须
        scope: "改写、压缩、合并或翻译任务中含具体断言的文本；所有模式（§3 重申任何模式下不得以简洁或长度为名删除条件等）。"
        trigger: "来源含具体断言（对象、属性、行为、数值、条件、结果、失败分支）。"
        required: "来源的每条独立断言在输出中可还原；调用方长度上限无法在不删除的前提下满足时，返回完全合规的最短文本，并在「待确认」（第 7 类）说明上限未满足。"
        prohibited: "以长度上限为由删除任何条件、例外、阈值、告警或失败分支。"
        exceptions: "可以删除同一断言的重复表述与纯修饰成分；调用方授权的长度上限只改变目标，不授权删除。"
        invariant: "断言集合可还原（输出 ⊇ 来源的独立断言，模除重复与纯修饰）。"
        fork: no
        readings: []
      - probe: CTC-S003
        level: 必须
        scope: "所有改写与翻译；翻译时情态词按强度类别对译。"
        trigger: "来源含情态、义务、请求、许可、禁止、建议或对系统行为的描述。"
        required: "(认识强度, 道义强度, 言语行为类型) 逐处不变。"
        prohibited: "确保→确认、请→须、不会→禁止、建议→必须、可能→会、必须→应 等跨强度或跨言语行为的替换；把描述升格为规范、请求升格为义务（§3）。"
        exceptions: "同强度换词（不得↔禁止）允许；调用方可显式授权调整道义强度（§3 调用方授权 (1)）。"
        invariant: "情态三元组逐处相等。"
        fork: no
        readings: []
      - probe: CTC-A001
        level: 必须
        scope: "所有改写、翻译；review 模式同样适用（含误报边界）。"
        trigger: "来源指明执行者（含被动句施事），或存在多个可能执行者且读法改变由谁执行。"
        required: "来源执行者在输出中仍可定位；仅在多执行者且读法改变执行者时补出，补出者须能从来源或上下文确定。"
        prohibited: "把具名组件替换为笼统称呼；review 中把施事可唯一推定的无施事被动句报为施事缺失。"
        exceptions: "不要求每句都有显性主语；施事可由上下文唯一推定时不产生 finding。§9 第 1 条示例保留首个「用户」，与规则一致。"
        invariant: "具名执行者可定位；执行者—动作绑定不变。"
        fork: no
        readings: []
      - probe: CTC-A005
        level: 必须
        scope: "所有模式；review 下作为 finding，严重级别按所引规则（§5、§8）。"
        trigger: "(a) 两种以上导致不同行为的读法且证据不足；或 (b) 缺少执行所需的参数、阈值、接收方、判据。"
        required: "保持原表述；在「待确认」给出位置、竞争读法或缺失项、判定所需信息。"
        prohibited: "静默择一；补出缺失项；用流畅改写掩盖歧义；输出多个完整备选；同处既消歧又换关键动词。"
        exceptions: "不算真歧义：一种读法在领域内不对应可执行操作；参数运行时由外部唯一确定（Retry-After 例）；「理论上可解析出两种读法」不报。缺失信息按 §3 归第 5 类，review 下规则字段取 CTC-S002（「缺失信息的规则 ID 与其所属类别括注的规则一致」），文本已明示，不构成分叉。"
        invariant: "未获证据的歧义在输出中仍然存在且被报告。"
        fork: no
        readings: []
      - probe: CTC-P003
        level: 应
        scope: "含成功判据、等待条件或验证方式的步骤文本；压缩授权下的合并。"
        trigger: "来源给出判据／等待条件／验证方式；或来源缺判据且该步破坏性或不可逆、后续安全性依赖其成功。"
        required: "判据与所验证步骤绑定并保持阻塞性质；独立验证步骤未获压缩授权时保持独立；获授权合并时仍由操作者执行、位于被守护动作之前、逐项列全判据。缺判据且满足破坏性条件时按「待确认」第 2 类提出。"
        prohibited: "移入附注、脚注或文末；把祈使验证改写为系统行为描述；虚构判据；合并时丢判据或改成状态描述。"
        exceptions: "其余步骤缺判据不提出。规则正文中的「必须」不改变该规则的「应」级（§6）。§10 示例（合并为 2 步，「确认…后，加入写入路由表」）与规则一致。"
        invariant: "(步骤, 判据, 是否阻塞, 执行者=操作者) 不变。"
        fork: no
        readings: []
      - probe: CTC-P004
        level: 必须
        scope: "含破坏性、不可逆或改变外部状态操作的步骤。"
        trigger: "该类操作存在，且来源给出前置条件、前提或告警。"
        required: "条件出现在被守护动作之前（同句前段或紧邻上一句）。"
        prohibited: "虚构来源没有的条件；把独立告警块移到某步骤旁（属 CTC-R005 违规）。"
        exceptions: "独立结构块告警（「警告：」「注意：」段落、告警框）不论在流程前后都管辖整个流程，不需移动。"
        invariant: "守护条件先于被守护动作被读到；结构块告警的管辖范围不变。"
        fork: no
        readings: []
      - probe: CTC-R001
        level: 必须
        scope: "任何改写或翻译任务，横跨全部五层、约束全部六族。"
        trigger: "任何改写或翻译任务，尤其来源已正确清晰合规时。"
        required: "每处改动归因到一条规则 ID；未触发规则的文本原样返回；strict／standard 下归因是内部纪律不写入输出，review 下即 finding 的「规则」字段。"
        prohibited: "以「更清楚」「更专业」为由做等义替换；为体现工作量改写；混合不相关改动。"
        exceptions: "调用方授权本身即构成归因（§3）。"
        invariant: "改动集合 ⊆ 被触发规则所要求的改动集合。"
        fork: no
        readings: []
      - probe: CTC-R002
        level: 应
        scope: "改写与翻译的输出；第 4 层。"
        trigger: "输出中出现逐句重复的主语、机械拆分的短句，或不消歧的补充限定。"
        required: "删去；每个补出的主语、重复中心语、拆出的短句应对应一处可指认的歧义风险；修复取最小改动。"
        prohibited: "把 R002 当作重写许可（只在缺陷出现时修复）；strict 下把歧义敏感度当作显式化数量要求。"
        exceptions: "多执行者交替时重复主语有消歧价值；写出可确定的动作、对象、位置属 CTC-P002（消除操作未定），不在禁止之列。"
        invariant: "删减不改变执行者可定位性（CTC-A001）与语义骨架。"
        fork: no
        readings: []
      - probe: 模式
        level: "不适用（模式不改变规则级别）"
        scope: "strict：agent 指令、系统提示、工具描述、SOP、runbook、变更流程、运维与安全敏感操作、排障、告警与错误信息；standard：API 文档、README、开发者指南、FAQ、发布说明、说明性散文；review：审计、检查他人改写、发布前门禁、自身复核。"
        trigger: "调用方指定；未指定时按适用范围推定，文档类型跨界取更严一档。"
        required: "strict 阈值最低：只要存在一种在本文档语境下可执行且导致不同动作的读法即算竞争读法；standard 阈值更高：普通技术读者会就此产生分歧才算；review 按被审文档类型选阈值（agent 指令与 runbook 用 strict，说明性文档用 standard）。S、L、T 三族与阈值无关。"
        prohibited: "strict 把「应」升为「必须」；任何模式以简洁为名删除条件等；strict 为显得明确而虚构执行者等；standard 把压缩当作重新决定语义的许可。"
        exceptions: "严重级别只存在于 review 模式。"
        invariant: "模式只改变 A、P 两族的触发面，不改变任何规则的级别。"
        fork: no
        readings: []
        # 边界备注（未达 fork）：review 阈值只点名「agent 指令与 runbook」与「说明性文档」，工具描述、告警与错误信息需按 strict 适用范围类推；standard 未提 R 族，但 §6 与输出契约表明 R 族全模式生效。
      - probe: 待确认准入清单
        level: "封闭清单（「此外一律不得进入」）"
        scope: "strict／standard 输出末尾，仅当存在未决项时。"
        trigger: "存在以下七类之一。"
        required: "可进入：1 证据不足的歧义（A005）；2 来源从未给出的成功判据（P003，且限破坏性步骤）；3 工具描述缺失的触发条件（P005）；4 无判据的规范条件（R004）；5 执行所需而来源与上下文未提供的信息，不属第 2–4 类的缺失信息一律归此（S002）；6 受保护标记拼写疑似有误（S005）；7 长度上限无法在不删条件或例外时满足（S001）。每项一行 `位置 | 问题 | 需要的信息 | 建议（可选）`，第四栏只用于 §5 情态模糊。"
        prohibited: "风格偏好；非阻碍执行的术语差异（改写模式下）；七类以外的任何内容；无未决项时出现该小节。"
        exceptions: "术语差异妨碍执行时按第 5 类进入。"
        invariant: "清单封闭；类别数与 S001、P003、P005、R004、S005 各处的引用一致（七类均有定义处对应）。"
        fork: no
        readings: []
        # 备注：情态模糊（§5）归第 1 类还是第 4 类未明示，但两者都可进入，且输出格式不显示类别号，改写行为不分叉；review 定级的分叉见 X-F1。
      - probe: 优先级阶梯
        level: "冲突裁决机制（不授权改动）"
        scope: "规则之间的冲突。"
        trigger: "两个规则或候选改动冲突。"
        required: "五层：1 真值与语义不变量（S、L 族）；2 操作清晰度（A、P 族与 CTC-R004）；3 术语一致（T 族）；4 自然技术中文（CTC-R002、R003、R005）；5 体例与排版（CTC-R006）；CTC-R001 横跨五层。低层不覆盖高层；第 2 层不得用新增事实等换取；同层等价保留来源形式；第 2 对第 4 层只有消除未定（竞争读法或操作未定）时显式化胜出；第 1 层不可达时不改写、进「待确认」。"
        prohibited: "以阶梯为改动依据（依据始终是规则 ID）；把体例或地区偏好升格为语义规则。"
        exceptions: "体例偏好只能按 STYLE 报告或不报告。"
        invariant: "改写后第 1 层不变量不劣于来源。"
        fork: no
        readings: []
      - probe: 不得做的事
        level: 不得
        scope: "所有改写与翻译。"
        trigger: "出现看似更「受控」的改写冲动。"
        required: "按括注规则的边界处理。"
        prohibited: "1 要求每句显式主语、一句一动词、拆散连动句、加序数虚词（CTC-A001、CTC-P001、CTC-R002）；2 补出省略的量词（CTC-R002）；3 给客观约束添加责任人（CTC-S002、CTC-S007）；4 删除软限定词（CTC-S003、CTC-S006）；5 展开凝练技术四字格（CTC-R001）。"
        exceptions: "多执行者交替时补主语（CTC-A001、CTC-R002 的边界）。"
        invariant: "五条示例与所引规则方向一致（第 1 条示例保留首个「用户」）。"
        fork: no
        readings: []
      - probe: 返回前核对
        level: 必须（流程步骤「按顺序执行」，第 7 步「任一项不成立，先修复再返回」）
        scope: "改写与翻译流程 §7 第 7 步；review 复用第 1–3 步。"
        trigger: "渲染完成、返回之前。"
        required: "把渲染后文本与来源逐句对照，重新抽取第 1、2 步登记的全部项（受保护标记、数值与单位、执行者、动作、对象、条件、例外、顺序、原子性分组、阈值与边界包含性、情态强度、量化论域、因果强度、否定作用域、指代先行词），S、A、P、T、L 五族每条规则的保持项与来源相同；并核对无不消歧的补充、无译文腔、无规则未要求的改动。"
        prohibited: "以「我没有改变语义」作结论；用模型自我判断替代逐项对照。"
        exceptions: "调用方已授权的改动不计为不成立。"
        invariant: "任一项不成立 → 先修复再返回（不是生成 finding）。"
        fork: no
        readings: []
    naturalness:
      score: 4
      evidence:
        - "「三条判据：更自然的句子若改变了真值条件，更显式的句子若凭空造出一项要求，更短的句子若丢掉一个条件或例外，都不是改进。」（正：排比紧凑、自然）"
        - "「对歧义保持沉默是较轻的失败，替作者决定不是。」（正：地道、简洁）"
        - "「本技能假定技术数值会被直接复制进单位由字段名固定的配置项，且文档不标明哪些值是这样的：换算在算术上无损，在操作上有损。」（反：「的」字串偏长，信息压得过密）"
        - "「CTC-R001 要求的逐处规则归因在 strict／standard 下是内部纪律，不写入输出；review 模式下它就是 finding 的「规则」字段，缺失信息的规则 ID 与其所属类别括注的规则一致。」（反：一句承载三件事，交叉引用密集）"
    over_control:
      score: 5
      evidence:
        - "「不得要求每句都有显式主语，不得一句一动词，不得拆散连动句。」（正：明确排除为显得受控的约束）"
        - "「strict 不等于最大冗长」（正）"
        - "「不得把结构条件静默复制进每个子步骤——那会产出重复的伪法律文本，条件留在原位。」（正）"
        - "「来源未给出成功判据时：只有当该步是破坏性或不可逆操作、且后续步骤的安全性取决于它是否成功，才按「待确认」第 2 类提出」（正：主动限制未决项膨胀）"

  Y:
    path: dev/inbox/si/blind/C.md
    rule_levels:
      CTC-S001: 必须
      CTC-S002: 必须
      CTC-S003: 必须
      CTC-S004: 必须
      CTC-S005: 必须
      CTC-S006: 必须
      CTC-S007: 必须
      CTC-A001: 必须
      CTC-A002: 必须
      CTC-A003: 应
      CTC-A004: 必须
      CTC-A005: 必须
      CTC-P001: 必须
      CTC-P002: 应
      CTC-P003: 应
      CTC-P004: 必须
      CTC-P005: 应
      CTC-T001: 应
      CTC-T002: 必须
      CTC-L001: 必须
      CTC-L002: 必须
      CTC-L003: 必须
      CTC-L004: 必须
      CTC-R001: 必须
      CTC-R002: 应
      CTC-R003: 应
      CTC-R004: 应
      CTC-R005: 应
      CTC-R006: 可以
    # 规则表（§7）与 §4 不变量表的「级别」栏一致。
    selfhost_findings:
      - id: Y-F1
        rule: CTC-A005
        severity: ERROR
        locus: "§3 strict：「严重级别只存在于 review 模式——改写没有可分级的 finding」；§4：「改写、压缩与翻译之后逐项核对；任一项出现偏离都是一处 finding，其严重级别由 §7 中该行所引规则的级别决定」；§11：「任一项为「否」，先修复再返回。」"
        problem: "改写模式下核对出偏离时，三处规定了不同行为：§4 要求把偏离记为带严重级别的 finding；§3 称改写没有可分级的 finding；§11 要求修复后返回。"
        risk: "agent 在 strict／standard 改写中可能把带 ERROR／WARNING 的 finding 附进输出（违反输出契约「只返回改写后的中文正文」），或不修复就报告偏离后返回。"
        suggestion: "§4 首段改为：「改写、压缩与翻译之后逐项核对；任一项偏离，先修复再返回（§11）。review 模式下，偏离是一条 finding，其严重级别由 §7 中该行所引规则的级别决定。」"
      - id: Y-F2
        rule: CTC-A005
        severity: ERROR
        locus: "§3：「可进入该小节的只有六类，此外一律不得进入」；CTC-S001：「无法在不删除的前提下满足上限时，返回完全合规的最短文本，并在「待确认」中说明上限未能满足」；§12：「并附「待确认」说明上限未能满足」"
        problem: "封闭的六类清单中没有「长度上限未能满足」这一类，而 CTC-S001 与 §12 示例都要求把它写进「待确认」。"
        risk: "遵守封闭清单的 agent 静默超出调用方长度上限、不作说明；遵守 CTC-S001 的 agent 追加一项清单之外的条目。调用方无法预期哪种行为。"
        suggestion: "在清单中增列第 7 类：「调用方给定的长度上限无法在不删除条件或例外的前提下满足（CTC-S001）」，并把「六类」改为「七类」。"
      - id: Y-F3
        rule: CTC-A005
        severity: ERROR
        locus: "§4：「本节列出返回之前必须逐项验证的属性」；§9 第 7 步：「重新抽取 (情态, 数值, 量化, 因果, 否定作用域, 施事, 指代, 条件, 时序, 受保护标记) 并与第 2 步的记录逐项比较」；§11：「返回之前逐项回答。」"
        problem: "三处返回前核对清单的项目集合不一致。§4 表列 21 行，含逻辑式（CTC-L002）、修饰结合域（CTC-A003）、步骤图（CTC-P001）；§9 第 7 步只列 10 项，不含逻辑式、步骤图、判据、守护顺序、术语、阈值边界；§11 的 12 问也没有逻辑方向、修饰结合域与原子性分组。"
        risk: "按 §9 或 §11 执行的 agent 在「仅当…才」被改为「若…则」、或原子性分组被拆开后仍判定核对通过并返回。"
        suggestion: "§9 第 7 步改为「重新抽取 §4 表中的全部属性并与第 2 步的记录逐项比较」；§11 第 6 问补入「逻辑方向（合取／析取／条件方向）、修饰结合域、原子性分组与回滚点」。"
      - id: Y-F4
        rule: CTC-A005
        severity: ERROR
        locus: "§6：「review 模式作为一条 finding，严重级别为 ERROR」；§6：「规范性指令中由无判据词（见 CTC-R004）承担义务的条件，必须报告其可能的两种以上强度并给出建议，然后停手」；CTC-R004 级别栏：「应」；§10：「映射：必须 → ERROR，应 → WARNING，可以 → STYLE。……没有其他升级，也没有降级。」"
        problem: "§6 规定情态模糊「同样按本节处理」，review 下固定报 ERROR；同一现象又由 CTC-R004（应 → WARNING）覆盖。§6 还把 CTC-R004 词表里的全部词（含「必要时」「适当」「合理」）都当作承担义务强度处理，要求给出两种强度与建议；CTC-R004 则把它们当作判定条件，只报缺失判据。"
        risk: "对「必要时重启网关」，一个审阅者报 ERROR 并填强度建议，另一个按 CTC-R004 报 WARNING、只报缺判据；门禁通过与否取决于审阅者。"
        suggestion: "§6 第 3 点改为「review 模式作为一条 finding，严重级别按所引规则的级别（§10）」；情态模糊一段改为只针对承担强度的词（如「最好」「尽量」「尽可能」），并写明「必要时」「适当」「合理」按「待确认」第 4 类（CTC-R004）提出。"
      - id: Y-F5
        rule: CTC-A005
        severity: ERROR
        locus: "§6：「上下文能确定读法时，必须消歧」；CTC-A003 级别栏：「应」；CTC-P002 级别栏：「应」"
        problem: "§6 以「必须」重述消歧义务，而承担消歧的 CTC-A003、CTC-P002 记录级别为「应」，可被更高优先级或明确边界推翻。规范强度在重述处漂移。"
        risk: "agent 把 A003／P002 的默认要求当作硬性要求，在「应」允许不改的情形（如改动会与更高层冲突）仍强行改写；review 中未消歧的 A003 情形被报为 ERROR 而非 WARNING。"
        suggestion: "改为「上下文能确定读法时，按所触发的规则消歧（CTC-A001–A004、CTC-P002 等），所选读法必须有来源或上下文证据」。"
      - id: Y-F6
        rule: CTC-A005
        severity: ERROR
        locus: "§10：「ERROR — 语义损坏、不安全的歧义、受保护标记突变，或硬不变量被违反。WARNING — 可能的歧义或规则风险，需要人工判断。STYLE — 不影响语义的自然度或一致性问题。」与「映射：必须 → ERROR，应 → WARNING，可以 → STYLE。」"
        problem: "同一节给出两套定级依据：按现象描述定级，与按规则级别映射定级。两者对 CTC-R002、CTC-R003（应，自然度问题）与 CTC-T001（应，一致性问题）给出不同结果：按描述是 STYLE，按映射是 WARNING。「不安全的歧义」也没有判据。"
        risk: "同一条译文腔 finding 被不同审阅者报为 STYLE 或 WARNING；按 §10「没有 ERROR 或 WARNING 级 finding 时返回「未发现违规」」，这会直接决定是否返回「未发现违规」。"
        suggestion: "删去三条描述性定义，只保留映射与唯一升级条件；如需说明，写成「映射结果的典型表现」并注明不作定级依据。"
      - id: Y-F7
        rule: CTC-A001
        severity: ERROR
        locus: "§8 第 1 条：「「用户打开控制台。用户点击设置。用户修改端口。」应写成「打开控制台后，点击「设置」修改端口。」」"
        problem: "示例删除了来源中唯一指明的执行者「用户」，与 CTC-A001「来源指明的执行者……必须在输出中仍可定位」矛盾；规则只允许删去重复的主语（CTC-R002），不允许删去全部。示例还给「设置」加了引号，这一处改动没有触发的规则。"
        risk: "照示例执行的 agent 删去具名执行者；在多角色文档中，读者无法判断这一步由谁执行。"
        suggestion: "改为「应写成「用户打开控制台后，点击设置修改端口。」」"
      - id: Y-F8
        rule: CTC-S002
        severity: ERROR
        locus: "§8 第 2 条：「「停止写入。等待。检查复制延迟。执行切换。」应写成「停止写入，等待复制延迟归零后执行切换。」」"
        problem: "示例输出补出了来源没有的判据「归零」，并把祈使的验证动作「检查复制延迟」改写成等待条件；前者违反 CTC-S002（不得虚构判据），后者也触及 CTC-P003（不得把祈使的验证动作改写为对系统行为的描述）。"
        risk: "agent 学到可以为了合句补出切换阈值；操作者会按虚构的「归零」判据等待或切换，而来源从未规定这一阈值。"
        suggestion: "改为「停止写入，等待后检查复制延迟，再执行切换。」，或选用来源本身含判据的例句。"
      - id: Y-F9
        rule: CTC-R001
        severity: ERROR
        locus: "§12 执行者删除：「反例：磁盘空间不足时，旧快照会被自动清理。 ← 去被动正当，删掉具名施事不正当」；「正例：磁盘空间不足时，存储管理机制会销毁旧快照数据。」"
        problem: "说明文字称反例「去被动」，但反例仍是被动句；正例把施事已在同句给出的被动句改为主动句，而 CTC-R003 明言「被动用于……施事已在同句给出时是自然的技术表述」，这一改动没有触发的规则。"
        risk: "agent 学到可以对施事已在同句的被动句做无规则依据的主动化，违反「未触发任何规则的文本原样返回」。"
        suggestion: "把正例改为原样返回「磁盘空间不足时，旧快照数据会被存储管理机制销毁。」，说明文字改为「← 删掉具名施事，并把「销毁」换成「清理」」。"
      - id: Y-F10
        rule: CTC-L004
        severity: ERROR
        locus: "§12 阈值边界翻转：「反例：磁盘用量超过 90% 时触发告警。」与「正例：磁盘用量超过 90% 时触发告警。」"
        problem: "正例与反例逐字相同，都把来源的「达到 90%」（含 90%）改成了「超过 90%」（不含 90%）。正例本身违反 CTC-L004。"
        risk: "照正例执行的 agent 翻转边界包含性，恰好 90% 时不触发告警。"
        suggestion: "正例改为「磁盘用量达到 90% 时触发告警。（原样返回）」。"
      - id: Y-F11
        rule: CTC-S001
        severity: ERROR
        locus: "§12 压缩指令与校验点冲突：「正例：1. 启动 `chunk-server`。2. 确认状态为 `READY` 且元数据已加载。3. 加入写入路由表。　　　并附「待确认」说明上限未能满足。」"
        problem: "CTC-S001 只在「无法在不删除的前提下满足上限时」才允许超出上限并报告。CTC-P003 明确允许在获授权时把验证并入相邻步骤，只要仍由操作者执行、在被守护动作之前、判据列全，即「2. 确认状态为 `READY` 且元数据已加载后，加入写入路由表」这种 2 步合规形式。正例却声称上限无法满足，与两条规则矛盾。"
        risk: "agent 学到只要有校验步骤就拒绝压缩，违背调用方授权的步骤上限，还追加一项清单外的「待确认」（见 Y-F2）。"
        suggestion: "正例改为「1. 启动 `chunk-server`。2. 确认状态为 `READY` 且元数据已加载后，加入写入路由表。」，并注明合并后仍满足 CTC-P003 的三项条件。"
      - id: Y-F12
        rule: CTC-T001
        severity: WARNING
        locus: "§2：「未定分两种：分歧读法是一种」；§3：「即按分歧读法处理」「才算分歧读法」；CTC-A005：「竞争读法或缺失项」"
        problem: "同一概念（导致不同行为的备选解读）有「分歧读法」「竞争读法」两个称呼，没有定义说明二者同指。"
        risk: "读者可能把 §3 的阈值（定义「分歧读法」）与 CTC-A005 的触发（「竞争读法」）视为两个概念，不确定模式阈值是否作用于 A005。"
        suggestion: "全文统一为「竞争读法」（或统一为「分歧读法」）。"
      - id: Y-F13
        rule: CTC-T001
        severity: WARNING
        locus: "CTC-P003：「不得虚构验收标准」；§10：「在发现冲突后修改被审文本或验收标准」；其余各处（CTC-P003 前文、§2、CTC-A005）：「判据」「成功判据」"
        problem: "「验收标准」在 CTC-P003 中指步骤的成功判据，在 §10 中指 review 的验收标准；同时 CTC-P003 前文对同一概念用「判据」。一个术语覆盖两个概念，一个概念又有两个术语。"
        risk: "读者可能把 §10「不得修改验收标准」理解为只约束步骤判据，或把 CTC-P003 的禁止理解为只针对 review 标准。"
        suggestion: "CTC-P003 中改为「不得虚构判据」；「验收标准」只保留在 §10 的 review 语境中。"
    # 未入 finding 的次阈值观察：§9 末段「另加三条」后实际列出四条（显性成分、标识符不译、数词、情态词）。数量与列举不一致，但看不出会导致不同执行行为，故不报。
    reverse_decoding:
      - probe: CTC-S001
        level: 必须
        scope: "改写、压缩、合并或翻译中含具体断言的文本；所有模式（strict、standard 各自重述不得以简洁为名删除）。"
        trigger: "来源含具体断言。"
        required: "每条独立断言可还原；上限不可满足时返回最短合规文本，并在「待确认」说明上限未满足。"
        prohibited: "以长度上限为由删除条件、例外、阈值、告警、失败分支。"
        exceptions: "可以删除重复表述与纯修饰成分。"
        invariant: "断言集合可还原。"
        fork: yes
        readings:
          - "读法 1（CTC-S001 与 §12 示例优先）→ 超出上限时追加一条「待确认」说明上限未满足。"
          - "读法 2（§3 六类封闭清单优先，「此外一律不得进入」）→ 返回最短合规文本，但不写入「待确认」，静默超出上限。"
          - "附带分叉（§12 示例）：判定「上限能否满足」时，读法 A 按 CTC-P003 允许的合并压到 2 步；读法 B 照示例保留 3 步并报告。"
      - probe: CTC-S003
        level: 必须
        scope: "所有改写与翻译。"
        trigger: "来源含情态、义务、请求、许可、禁止、建议或系统行为描述。"
        required: "(认识强度, 道义强度, 言语行为类型) 逐处不变。"
        prohibited: "列举的跨强度替换；描述升格为规范、请求升格为义务。"
        exceptions: "同强度换词；调用方授权「调整规范强度」。"
        invariant: "情态三元组逐处相等。"
        fork: no
        readings: []
        # 备注：授权条款用「规范强度」，规则用「道义强度」，未显式等同；但上下文足以推定同指。
      - probe: CTC-A001
        level: 必须
        scope: "所有改写、翻译与 review。"
        trigger: "来源指明执行者，或多执行者且读法改变执行者。"
        required: "具名执行者仍可定位；补出者须可确定。"
        prohibited: "具名组件换为笼统称呼；把施事可推定的被动句报为缺失。"
        exceptions: "不要求每句显性主语；§8 第 1 条称「只有多角色交替执行时才补主语」。"
        invariant: "具名执行者可定位。"
        fork: yes
        readings:
          - "读法 1（规则正文）→ 删去重复的「用户」，保留一次：「用户打开控制台后，点击设置修改端口。」"
          - "读法 2（§8 第 1 条示例）→ 删去全部「用户」：「打开控制台后，点击「设置」修改端口。」在多角色文档中，执行者因此不可定位。"
      - probe: CTC-A005
        level: 必须
        scope: "所有模式；review 下 §6 固定为 ERROR（与 A005 本身的级别一致）。"
        trigger: "两种以上导致不同行为的读法且证据不足；或缺少执行所需的参数、阈值、接收方、判据。"
        required: "保持原表述；「待确认」给出位置、竞争读法或缺失项、所需信息。"
        prohibited: "静默择一；补出缺失项；流畅掩盖；多个备选版本；消歧兼换动词。"
        exceptions: "不对应可执行操作的读法；运行时外部唯一确定的参数；「理论上」的两种解析。"
        invariant: "未获证据的歧义在输出中仍存在且被报告。"
        fork: no
        readings: []
        # 备注：缺失信息在 review 中的规则字段取 CTC-A005 还是 CTC-S002（第 5 类括注）未明示；两者都是「必须」→ ERROR，只有标签不同，未计为 fork。
      - probe: CTC-P003
        level: 应
        scope: "含判据、等待条件、验证方式的步骤；压缩授权下的合并。"
        trigger: "来源给出判据等；或缺判据且该步破坏性、后续安全依赖其成功。"
        required: "判据绑定、阻塞性保持；独立验证步骤未获压缩授权时保持独立；获授权合并时须由操作者执行、在前、判据列全。"
        prohibited: "移入附注或文末；改为系统行为描述；虚构验收标准；丢判据。"
        exceptions: "其余步骤缺判据不提出。"
        invariant: "(步骤, 判据, 是否阻塞) 不变。"
        fork: yes
        readings:
          - "读法 1（规则正文）→ 调用方授权压到 2 步时，合并为「2. 确认状态为 `READY` 且元数据已加载后，加入写入路由表」，满足上限，不报「待确认」。"
          - "读法 2（§12 正例）→ 保留 3 个独立步骤，不满足上限，并附「待确认」说明上限未满足。"
      - probe: CTC-P004
        level: 必须
        scope: "含破坏性、不可逆或改变外部状态操作的步骤。"
        trigger: "该类操作存在且来源给出前置条件、前提或告警。"
        required: "条件在被守护动作之前（同句前段或紧邻上一句）。"
        prohibited: "虚构条件；移动独立告警块（CTC-R005 违规）。"
        exceptions: "独立结构块告警管辖整个流程，不论前后。"
        invariant: "守护先于动作；结构块告警管辖范围不变。"
        fork: no
        readings: []
        # 备注：§5 把告警块并入「标题、列表层级、表格单元格与告警块所建立的条件管辖其子树……按 CTC-L001 判定」，与 P004「管辖它所依附的整个流程」表述不同，但执行结果一致。
      - probe: CTC-R001
        level: 必须
        scope: "任何改写或翻译。"
        trigger: "任何改写或翻译任务。"
        required: "每处改动归因到规则 ID；未触发文本原样返回。"
        prohibited: "等义替换；为体现工作量改写；混合改动。"
        exceptions: "调用方授权即归因。"
        invariant: "改动集合 ⊆ 被触发规则要求的改动集合。"
        fork: yes
        readings:
