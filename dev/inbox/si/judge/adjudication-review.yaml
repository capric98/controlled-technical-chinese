    verdict: agree
    reason: "同 C13。"
  - claim: C131
    verdict: agree
    reason: "这条最临界。基线「并按「待确认」第 6 类提出」是一项报告要求，A 只保留了第 6 类的准入。不过 A §3「仅当存在未决项时……追加「待确认」小节，每项一行」加上第 6 类的定义，可以还原「疑似拼写错误须列出」；「保持原样」由 S005 的「逐字符不变」保证。不算独立断言丢失。"
  - claim: C120
    verdict: agree
    reason: "替换或补全占位符、用描述替换命令、半角改全角，都会改变标记字符或标记多重集，被 A 的 S005「逐字符不变」与 §4「标记多重集必须相等」（必须级）覆盖。"
