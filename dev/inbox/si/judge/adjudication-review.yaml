  # ---------- D-A1：重点复核严重级别 ----------
  - claim: C1
    orchestrator_ruling: confirmed (ERROR) · D-A1
    verdict: agree
    your_ruling: confirmed
    your_severity: ERROR
    reason: "A §5 写「义务的强度由「最好」「尽量」「尽可能」这类无判据词承担时，报告其可能的两种以上强度并在第四栏给出建议……「必要时」「适当」「合理」承担的是判定条件而非强度」，A 的 CTC-R004 行写「判定条件由无判据词承担时——「尽量」「尽可能」「最好」「适当」「必要时」「合理」——」。同一个词被两处归入不同类别，而且行为确实分叉：(1) 改写时，「待确认」行要不要列强度、填第四栏；(2) review 时引 §5 的路径（「按本节处理」→A005，ERROR）还是 R004（应→WARNING）；(3) 新写时，R004 要求给「可观测的触发条件」，而 §5 把这三个词归为承担强度，它们在新写时怎么处理没有着落。这属于预先登记的「两种读法、行为不同」→A005→ERROR，A 自己的 §8 第 1 步也把文内冲突指派给 A005。基线对六个词一视同仁（「由无判据词（见 CTC-R004）承担义务的条件」），没有这个归类冲突；基线在同一位置的冲突是另一种（§6 固定 ERROR 对 R004 的「应」）。因此这个分叉是 A 的拆分新造成的，计入第 2 判据。Fable 按 R004 计 WARNING，针对的是词表缺判据，并没有指向这个归类冲突。"
  - claim: C108
    orchestrator_ruling: confirmed (ERROR) · D-A1
    verdict: agree
    your_ruling: confirmed
    your_severity: ERROR
    reason: "与 C1 是同一缺陷，Fable 描述的问题本身就是「同一组词在两处被归入不同类别，处理方式不同」。最直接描述这个缺陷的是 A005（文内两处对同一情形要求不同行为），不是 R004（无判据词）。按预先登记的规则应计 ERROR，Fable 定的 WARNING 偏低。"

