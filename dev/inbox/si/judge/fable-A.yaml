        rule: CTC-A005
        severity: ERROR
        locus: "「可进入该小节的只有六类，此外一律不得进入」；「无法在不删除的前提下满足上限时，返回完全合规的最短文本，并在「待确认」中说明上限未能满足」"
        problem: "CTC-S001 要求把「上限未能满足」写入「待确认」，§12「压缩指令与校验点冲突」正例也「附「待确认」说明上限未能满足」；但 §3 的准入清单只有六类且「此外一律不得进入」，六类中没有一类容纳该说明（它既非歧义、非缺判据、非缺触发条件、非缺信息、非拼写疑误）。两处对同一情形要求不同行为。"
        risk: "遇到无法满足的长度上限时，模型要么违反 §3 写入一条不属于任何类的未决项，要么违反 S001 静默返回超长文本，调用方不知道上限为何未满足。"
        suggestion: "在准入清单中增加第 7 类：「调用方给定的长度上限无法在不删除条件或例外的前提下满足（CTC-S001）」，并把「六类」改为「七类」。"
      - id: Y-F2
        rule: CTC-S002
        severity: ERROR
        locus: "「停止写入。等待。检查复制延迟。执行切换。」应写成「停止写入，等待复制延迟归零后执行切换。」"
        problem: "示例的「应写成」版本补出了来源没有的判据「归零」，并把操作者的验证动作「检查复制延迟」改写为等待条件。这与 CTC-S002「不得以补写填平」、CTC-A005「不得补出缺失项」和 CTC-P003「不得把祈使的验证动作改写为对系统行为的描述」直接矛盾；示例本意是演示合句，却演示了虚构阈值。"
        risk: "模型以此示例为范本，在合并 runbook 步骤时替作者补出阈值（延迟归零、状态就绪），操作者按虚构判据执行切换。"
        suggestion: "改为不引入新判据的合句，例如「停止写入，检查复制延迟后执行切换。」或「停止写入，等待并检查复制延迟，再执行切换。」"
      - id: Y-F3
        rule: CTC-A005
        severity: ERROR
        locus: "「返回之前逐项回答。任一项为「否」，先修复再返回。」；「有没有做过单位换算？」；「我有没有把两个不确定是否同指的说法合并掉？」；「我有没有补出不消除任何歧义的主语、限定或短句？有没有留下译文腔？」；「我有没有改动任何规则并未要求改动的地方？有则还原。」"
        problem: "§11 的停机条件是「任一项为「否」，先修复」，但第 4、9、10、11 项的后半问是「有没有…」，合规答案恰是「否」；第 11 项自带的条件又是「有则还原」。同一清单对不同题目的触发极性相反，字面执行与意图执行得到不同结果。"
        risk: "严格按字面执行的 agent 在合规输出上被要求「修复」不存在的问题，可能为凑「是」而做无依据改动；或整份自检因极性混乱而被跳过。"
        suggestion: "统一极性：把「有没有…」类问题改写为「…都没有做吗？」或在句首注明「以下各问，答案与括注不符时先修复」，并逐项括注期望答案。"
      - id: Y-F4
        rule: CTC-L004
        severity: ERROR
        locus: "正例：磁盘用量超过 90% 时触发告警。"
        problem: "「阈值边界翻转」示例的正例与反例逐字相同（「超过 90%」），而来源是「达到 90%」。正例本身违反了它所演示的 CTC-L004（「达到 N」含 N，「超过 N」不含 N），示例与规则矛盾。"
        risk: "模型据正例把「达到」改为「超过」，边界值上的告警不触发；示例失去教学价值并给出错误范本。"
        suggestion: "正例改为「磁盘用量达到 90% 时触发告警。（原样返回）」。"
      - id: Y-F5
        rule: CTC-A003
        severity: WARNING
        locus: "一个字符串出现在代码标记内（行内代码、围栏代码块含语言标注）"
        problem: "「含语言标注」既可读作对「围栏代码块」的限定（只有带语言标注的围栏块才算代码标记），也可读作补充说明（围栏代码块，连同其语言标注一起受保护）。两种结合对应不同操作对象：不带语言标注的围栏块是否受代码标记保护。CTC-S005 的「代码块内部整体不动，语言标注保留」支持后一读法，但本句未消除结合歧义。"
        risk: "不带语言标注的围栏块被当作普通文本改写，命令或路径被翻译或改动，粘贴后不可执行。"
        suggestion: "改为「行内代码；围栏代码块，不论是否带语言标注」，并在此处交叉引用 CTC-S005 关于只承载示意文本的围栏块的例外。"
      - id: Y-F6
        rule: CTC-R004
        severity: WARNING
        locus: "规范性指令中由无判据词（见 CTC-R004）承担义务的条件，必须报告其可能的两种以上强度并给出建议，然后停手。"
        problem: "§6 把 R004 词表中的全部词（含「适当」「必要时」「合理」）都按「报告两种以上强度并给建议」处理；但这三个词承担的是判定条件而非强度，对「必要时重启」报告「强度」没有可执行内容。R004 自身对改写的要求是「在「待确认」中提出」，未提「建议」；§3 又规定第四栏只在「§6 的情态模糊」时填写。三处对同一类词的处理不一致。"
        risk: "对「必要时」「适当」，模型要么虚构两种「强度」并给建议（等于替作者决定），要么按 R004 只报缺判据，同一输入两种输出格式。"
        suggestion: "把 §6 限定为强度词（最好、尽量、尽可能、尽快），判定条件词只按「待确认」第 4 类提出、不填第四栏；R004 词表按此拆分。"
      - id: Y-F7
        rule: CTC-R004
        severity: WARNING
        locus: "文本含无必要的被动、名词化赘语（进行／作出／予以 + 动词）、过长的「的」字串"
        problem: "CTC-R003 的触发条件之一由无判据词「过长」承担；文档没有给出多长算过长的可观测判据或边界示例。"
        risk: "review 模式下不同评审对同一「的」字串是否报 R003 不一致；改写模式下模型以「过长」为由拆改并未妨碍理解的定语，产生无法归因的改动。"
        suggestion: "给「过长」一个可观测边界或正反例。"
      - id: Y-F8
        rule: CTC-P002
        severity: WARNING
        locus: "按 §9 第 1–3 步建立比对基准：受保护标记、语义骨架、文档类型对应的歧义阈值。"
        problem: "review 的适用范围包括「审计既有中文技术文本」与「对本技能自身文本的复核」，这两类没有独立来源；§4 不变量表与 S、L 两族的要求都是「与来源相同」。§10 第 1 步没有说明无来源时以什么为比对基准、哪些规则可报、文内两处陈述冲突时引用哪条规则。"
        risk: "审计既有文本时，评审可能把 S、L 族全部判为不可报而只报 A、P、T，或反之把文本自身的陈述当作「来源」而报出空洞的 finding；对自身复核的结果不可比较。"
        suggestion: "补一句：「被审文本没有独立来源时，以被审文本自身为来源，只报告其自身可观测的违规（竞争读法、指代、无判据条件、术语不一致）；文内两处陈述对同一情形要求不同行为时，按 CTC-A005 报告并引用两处。」"
      - id: Y-F9
        rule: CTC-R004
        severity: WARNING
        locus: "「ERROR — 语义损坏、不安全的歧义、受保护标记突变，或硬不变量被违反。」；「WARNING — 可能的歧义或规则风险，需要人工判断。」"
        problem: "严重级别既由「映射：必须 → ERROR，应 → WARNING」决定，又由这两条描述性定义决定。描述引入了映射中不存在的判据「不安全的」「可能的」，而 §6 规定上下文不能确定的歧义一律 ERROR；一条需要人工判断的 A005 finding 按描述属 WARNING、按映射属 ERROR。「不安全」没有判据。"
        risk: "同一条未决歧义在不同评审处得到不同严重级别，门禁结果不可复现。"
        suggestion: "删去描述性定义中的「不安全的歧义」「可能的歧义」，或明确「以映射为准，描述仅为说明」。"
      - id: Y-F10
        rule: CTC-P003
        severity: WARNING
        locus: "正例：1. 启动 `chunk-server`。2. 确认状态为 `READY` 且元数据已加载。3. 加入写入路由表。　　　并附「待确认」说明上限未能满足。"
        problem: "指令「合并可合并的步骤，压缩到不超过 2 步」是调用方授权。CTC-P003 明文允许「调用方授权合并步骤时可以并入相邻步骤」，只要仍由操作者执行、位于被守护动作之前、逐项列全判据——「确认状态为 `READY` 且元数据已加载后，加入写入路由表」满足全部三项且步骤数达标。正例却拒绝合并、超出上限并附「待确认」，而 CTC-S001 的这一兜底只适用于「无法在不删除的前提下满足上限时」。示例与 P003、S001 都矛盾。"
        risk: "模型据此拒绝已授权且可合规完成的压缩，产生多余的未决项，调用方得不到它授权的结果。"
        suggestion: "正例改为「1. 启动 `chunk-server`。2. 确认状态为 `READY` 且元数据已加载后，加入写入路由表。」并说明校验并入相邻步骤后仍由操作者执行、在被守护动作之前、判据列全。"
    reverse_decoding:
      - probe: CTC-S001
        level: 必须
        scope: "改写、压缩、合并或翻译含具体断言的文本；strict 与 standard 都禁止以简洁为名删除条件、例外、阈值、默认值、受保护标记。"
        trigger: "来源含具体断言且任务会改动文本。"
        required: "每条独立断言在输出中可还原；长度上限无法在不删除的前提下满足时，返回完全合规的最短文本并在「待确认」中说明上限未能满足。"
        prohibited: "删除条件、例外、阈值、告警、失败分支；把长度上限当作删除授权。"
        exceptions: "同一断言的重复表述与纯修饰成分可删；调用方授权指定改写目标或长度上限。"
        invariant: "断言集合在来源与输出之间可双向定位。"
        fork: yes
        readings:
          - "读法 1（按 S001 与 §12 正例）→ 上限无法满足时在「待确认」追加一行「上限未能满足」。"
          - "读法 2（按 §3「只有六类，此外一律不得进入」）→ 该说明不属任何类，不得写入，静默返回超长文本。"
      - probe: CTC-S003
        level: 必须
        scope: "来源含情态、义务、请求、许可、禁止、建议或对系统行为的描述；改写、翻译、review。"
        trigger: "任一处情态或言语行为成分被改动。"
        required: "(认识强度, 道义强度, 言语行为类型) 逐处不变；翻译时情态词按强度类别对译，不归一到本技能自身的规范词表；无判据强度词保持原样、进「待确认」并附建议（§6）。"
        prohibited: "确保→确认、请→须、不会→禁止、建议→必须、可能→会、必须→应；描述升格为规范条款、请求升格为义务（§3 strict、§12「情态强化」）；删除「可能」「通常」「预计」（§8 第 11 条）。"
        exceptions: "同强度换词（不得↔禁止）；调用方授权调整规范强度。"
        invariant: "每处情态三元组与来源相同。"
        fork: no
      - probe: CTC-A001
        level: 必须
        scope: "来源指明了执行者（含被动句施事）的文本；改写、翻译、review。"
        trigger: "改写可能使具名执行者不可定位，或存在多个可能执行者且读法改变由谁执行。"
        required: "来源具名执行者在输出中仍可定位（§8 第 1 条示例表明：单一执行者的话题链中可承前省略，能由上下文推定即算可定位）；补出执行者仅限多角色交替且可确定时。"
        prohibited: "把具名组件替换为笼统称呼（§12「执行者删除」）；要求每句显性主语；一刀切禁用被动（§8 第 3 条）；给客观约束添加责任人（§8 第 9 条）。"
        exceptions: "施事可由上下文唯一推定时不产生 finding；去被动本身正当（§12 反例说明）。"
        invariant: "施事—动作—受事绑定与来源相同；具名施事可定位或可唯一推定。"
        fork: no
      - probe: CTC-A005
        level: 必须
        scope: "所有模式；review 时按 §6 一律 ERROR。"
        trigger: "存在两种以上导致不同行为的读法而证据不足；或缺少执行所需的参数、阈值、接收方、判据。"
        required: "保持原表述；「待确认」给出位置、读法或缺失项、判定所需信息；review 模式作为 finding，ERROR。"
        prohibited: "静默择一；补出缺失项；流畅改写掩盖歧义；多个完整备选版本；同一处既消歧又换动词（§12「静默消歧」）。"
        exceptions: "不算真歧义：读法不对应可执行操作；参数由运行时外部唯一确定；理论上的两种解析不报告（§6、§8 第 13 条）。"
        invariant: "未获证据的歧义在输出中仍存在且被报告。"
        fork: yes
        readings:
          - "读法 1（按 A005 与 P002「无法确定时按 CTC-A005 报告」）→ review 中「多次失败」类缺失阈值的 finding 规则字段填 CTC-A005。"
          - "读法 2（按 §3「缺失信息一律归第 5 类（CTC-S002），不论是哪条规则先发现它」）→ 同一 finding 规则字段填 CTC-S002。文档未像归类那样规定规则字段随类别走，两读法输出不同的规则 ID（严重级别相同）。"
      - probe: CTC-P003
        level: 应
        scope: "来源给出成功判据、等待条件或验证方式的步骤文本。"
        trigger: "改动可能使判据脱离步骤、失去阻塞性质，或压缩指令要求合并含验证步骤的序列。"
        required: "判据与步骤绑定并阻塞；单独验证步骤未获授权时保持独立；授权合并时并入相邻步骤且仍由操作者执行、位于被守护动作之前、逐项列全；来源未给判据时只对破坏性或不可逆且后续安全取决于它的步骤进「待确认」第 2 类。"
        prohibited: "移入附注、脚注或文末；祈使验证改为系统行为描述；虚构验收标准；丢掉任一判据。"
        exceptions: "调用方授权合并步骤。"
        invariant: "(步骤, 判据, 是否阻塞) 不变。"
        fork: yes
        readings:
          - "读法 1（按规则正文）→ 指令「合并可合并的步骤，压缩到不超过 2 步」构成授权，输出两步：「确认状态为 `READY` 且元数据已加载后，加入写入路由表」。"
          - "读法 2（按 §12 正例）→ 拒绝合并，保留三步并附「待确认」说明上限未能满足；「步骤数达标而校验丢失，不如超出上限而校验完整」被读作校验步骤一律不可合并。"
      - probe: CTC-P004
        level: 必须
        scope: "步骤含破坏性、不可逆或改变外部状态的操作且来源给出前置条件、前提或告警。"
        trigger: "改写、压缩或翻译可能改变条件与动作的相对位置。"
        required: "条件出现在被守护动作之前——同句前段或紧邻的上一句。"
        prohibited: "来源未给条件时虚构；移动独立告警块（属 R005 违规）。"
        exceptions: "独立结构块的告警管辖所依附的整个流程，不论前后，不要求移动。"
        invariant: "守护条件先于被守护动作；结构告警块的管辖范围不变。"
        fork: no
      - probe: CTC-R001
        level: 必须
        scope: "任何改写或翻译任务；横跨五层；约束六族。"
        trigger: "任何一处改动。"
        required: "每处改动引用一条规则 ID；未触发规则的文本原样返回；归因在 strict／standard 为内部纪律，review 为「规则」字段；授权本身构成归因；原样返回是合法输出（§8 末句）。"
        prohibited: "以「更清楚」「更专业」为由等义替换；为体现工作量改写；混合多处不相关改动；「这样更自然」不是规则 ID。"
        exceptions: "调用方授权的四类改动。"
        invariant: "改动集合 ⊆ 被触发规则或授权覆盖的位置集合。"
        fork: no
      - probe: CTC-R002
        level: 应
        scope: "输出（含来源已有缺陷，§7 尾注）；第 4 层。"
        trigger: "输出出现逐句重复的主语、机械拆分的短句，或不消除任何歧义的补充限定。"
        required: "删去；每个补出成分对应一处可指认的歧义风险。"
        prohibited: "重写不含该缺陷的文本；补省略的量词（§8 第 8 条）；展开无歧义指代（§8 第 10 条）。"
        exceptions: "多执行者交替时重复主语；P002 的操作未定消除；strict 不提高显式化数量要求。"
        invariant: "显式化数量不超过可指认歧义风险的数量。"
        fork: no
      - probe: 模式
        level: "不适用（模式改变歧义阈值，不改变规则级别）"
        scope: "strict：agent 指令与系统提示、工具与函数描述、SOP、runbook、变更流程、运维与安全敏感操作、排障步骤、告警与错误信息。standard：API 文档、README 式文档、开发者指南、FAQ、发布说明、说明性技术散文。review：按被审文档类型选阈值。"
        trigger: "调用方指定；未指定时按 §3 推定，跨界取更严。"
        required: "strict：存在一种可执行且导致不同动作的读法即按分歧读法处理。standard：只有普通技术读者会产生分歧时才算，「可以构造出另一种解析」不算；允许惯用压缩、并句、话题链。"
