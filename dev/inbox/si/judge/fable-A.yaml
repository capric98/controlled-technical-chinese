    selfhost_findings:
      - id: X-F1
        rule: CTC-R004
        severity: WARNING
        locus: "文本含无必要的被动、名词化赘语（进行／作出／予以 + 动词）、过长的「的」字串"
        problem: "CTC-R003 的触发条件之一由无判据词「过长」承担；文档没有给出多长算过长的可观测判据或边界示例。R003 对「无必要的被动」给了边界（突出受事、施事未知、施事已在同句给出），对「过长」没有。"
        risk: "review 模式下，不同评审对同一「的」字串是否报 R003 WARNING 不一致；改写模式下模型可能以「过长」为由拆改并未妨碍理解的定语，产生无法归因的改动。"
        suggestion: "给「过长」一个可观测边界，例如「连续三个以上「的」且可改为分句而不改变修饰关系时」，或给一个正反例。"
      - id: X-F2
        rule: CTC-R004
        severity: WARNING
        locus: "规范性指令（agent 指令、SOP、策略、门禁条件）的判定条件由无判据词承担时——「尽量」「尽可能」「最好」「适当」「必要时」「合理」——"
        problem: "R004 把「尽量」「尽可能」「最好」与「适当」「必要时」「合理」并列为承担判定条件的词，并要求新写时给出「可观测的触发条件（阈值、状态或事件）」。§5 却把前三个词归为承担义务强度、后三个词归为承担判定条件，并规定前者要在「待确认」第四栏给建议、后者「只按第 4 类提出」。同一组词在两处被归入不同类别，处理方式不同。"
        risk: "新写「尽量在窗口内回滚」时，按 R004 会去补一个阈值或事件，而缺的是强度（应／必须）；改写时对「尽量」是否填第四栏建议，两处指引不一致。"
        suggestion: "在 R004 中把词表按 §5 的划分拆开：强度词（最好、尽量、尽可能）新写时给出规范强度、改写时按 §5 报告并附建议；判定条件词（适当、必要时、合理）新写时给出可观测触发条件、改写时按第 4 类提出。"
    reverse_decoding:
      - probe: CTC-S001
        level: 必须
        scope: "改写、压缩、合并或翻译含具体断言的文本；任何模式（§3 明言任何模式下不得以简洁为名删除条件、前提、例外、守护条件、成功判据、阈值、默认值、受保护标记）。"
        trigger: "来源含具体断言（对象、属性、行为、数值、条件、结果、失败分支）且任务会改动文本。"
        required: "每条独立断言在输出中可还原；调用方给了长度上限而无法在不删除的前提下满足时，返回完全合规的最短文本并在「待确认」第 7 类说明上限未能满足。"
        prohibited: "删除条件、例外、阈值、告警、失败分支；把长度上限当作删除授权。"
        exceptions: "同一断言的重复表述与纯修饰成分可删；调用方显式授权的改写目标或长度上限只授权重组（合并步骤、改格式），不授权删除。"
        invariant: "断言集合（对象、属性、行为、数值、条件、结果、失败分支）在来源与输出之间可双向定位。"
        fork: no
      - probe: CTC-S003
        level: 必须
        scope: "来源含情态、义务、请求、许可、禁止、建议或对系统行为的描述；改写与翻译；review 时作为 ERROR 报告。"
        trigger: "任一处情态或言语行为成分被改动。"
        required: "(认识强度, 道义强度, 言语行为类型) 逐处不变；翻译时情态词按强度类别对译，不归一到本技能自身的规范词表。"
        prohibited: "确保→确认、请→须、不会→禁止、建议→必须、可能→会、必须→应；把描述升格为规范、请求升格为义务（§3 strict）；删除「可能」「通常」「预计」（§9 第 4 条）；把「最好」等无判据强度词替换为具体强度（§5）。"
        exceptions: "同强度换词（不得↔禁止）；调用方显式授权调整道义强度（§3 授权第 1 类）。"
        invariant: "每处情态成分的三元组与来源相同；无判据强度词保持原样并进「待确认」附建议。"
        fork: no
      - probe: CTC-A001
        level: 必须
        scope: "来源指明了执行者（含被动句施事）的文本；改写、翻译、review。"
        trigger: "改写可能使具名执行者不可定位，或存在多个可能执行者且读法改变由谁执行。"
        required: "来源具名执行者在输出中仍可定位；补出执行者仅限多个可能执行者且不同读法改变由谁执行、且能从来源或上下文确定时。"
        prohibited: "把具名组件替换为笼统称呼；要求每句显性主语；review 中把自然的无施事被动句报为施事缺失；给客观约束添加责任人（§9 第 3 条，归 S002/S007）。"
        exceptions: "施事可由上下文唯一推定时不产生 finding；话题链承前省略主语不触发（§9 第 1 条示例保留一次「用户」）。"
        invariant: "执行者—动作—对象绑定与来源相同；具名施事在输出中至少一次可定位或可由上下文唯一推定。"
        fork: no
      - probe: CTC-A005
        level: 必须
        scope: "所有模式；review 时为 ERROR（§5 按所引规则级别）。"
        trigger: "存在两种以上导致不同行为的读法而来源与上下文都不足以确定作者意图；或缺少执行所需的参数、阈值、接收方、判据。"
        required: "保持原表述；在「待确认」给出位置、竞争读法或缺失项、判定所需信息；review 模式作为 finding。"
        prohibited: "静默择一；补出缺失项；用流畅改写掩盖歧义；输出多个完整备选版本；在同一处既消歧又替换关键动词。"
        exceptions: "不算真歧义：一种读法在该领域不对应任何可执行操作；参数在运行时由外部唯一确定（`Retry-After` 例）；「理论上可解析出两种读法」不报告。缺失信息在 review 中的规则 ID 按 §3 所属类别（第 5 类归 S002、第 2 类 P003、第 3 类 P005、第 4 类 R004），不论哪条规则先发现。"
        invariant: "未获证据的歧义在输出中仍存在且被报告。"
        fork: no
      - probe: CTC-P003
        level: 应
        scope: "来源给出成功判据、等待条件或验证方式的步骤文本；改写、压缩、翻译。"
        trigger: "改动可能使判据脱离所验证的步骤、失去阻塞性质，或压缩指令要求合并含验证步骤的序列。"
        required: "判据与步骤保持绑定并保持阻塞；单独的验证步骤未获压缩授权时保持独立；获授权合并时并入相邻步骤，且仍由操作者执行、位于被守护动作之前、逐项列全原有判据。来源未给判据时，只有该步是破坏性或不可逆且后续步骤安全取决于它时，才进「待确认」第 2 类。"
        prohibited: "移入附注、脚注或文末；把祈使验证动作改写为系统行为描述；虚构判据；丢掉任一判据；为普通步骤的缺判据制造未决项。"
        exceptions: "调用方授权合并步骤时可并入相邻步骤（§10 正例：「确认状态为 `READY` 且元数据已加载后，加入写入路由表」）。"
        invariant: "(步骤, 判据, 是否阻塞, 由操作者执行, 位于被守护动作之前) 不变。"
        fork: no
      - probe: CTC-P004
        level: 必须
        scope: "步骤含破坏性、不可逆或改变外部状态的操作（删除、DROP、覆盖、重启、扩缩容、发布、回滚、密钥轮换、清空缓存）且来源给出前置条件、前提或告警。"
        trigger: "改写、压缩或翻译可能改变条件与动作的相对位置。"
        required: "条件出现在被守护动作之前——同句前段或紧邻的上一句。"
        prohibited: "来源未给条件时虚构；把独立告警块移动到某步骤旁（属 R005 违规）。"
        exceptions: "作为独立结构块的告警（「警告：」「注意：」段落、告警框）管辖所依附的整个流程，不论排在流程前后，不要求移动。"
        invariant: "守护条件先于被守护动作被读到；结构告警块的管辖范围不变。"
        fork: no
      - probe: CTC-R001
        level: 必须
        scope: "任何改写或翻译任务，横跨全部五层，约束六族的应用方式。"
        trigger: "任何一处改动。"
        required: "每处改动归因到一条规则 ID；未触发任何规则的文本原样返回；归因在 strict／standard 下是内部纪律不写入输出，review 下是 finding 的「规则」字段；调用方授权本身即构成归因。"
        prohibited: "以「更清楚」「更专业」为由做等义替换；为体现工作量而改写；把多处不相关改动混在一起。"
        exceptions: "调用方显式授权的四类改动。"
        invariant: "改动集合 ⊆ 被触发规则或授权所覆盖的位置集合。"
        fork: no
      - probe: CTC-R002
        level: 应
        scope: "输出（含来源已有的缺陷，§6 尾注：只在该缺陷出现时修复）；第 4 层，低于 S 族与第 2 层。"
        trigger: "输出出现逐句重复的主语、被机械拆分的短句，或不消除任何歧义的补充限定。"
        required: "删去；每个补出的主语、重复的中心语、拆出的短句都对应一处可指认的歧义风险。"
        prohibited: "把不含该缺陷的文本重写；补出省略的量词（§9 第 2 条）。"
        exceptions: "多执行者交替出现时重复主语；写出可确定的动作、对象或位置属 P002；strict 不提高显式化数量要求。"
        invariant: "显式化数量不超过可指认歧义风险的数量。"
        fork: no
      - probe: 模式
        level: "不适用（模式改变歧义阈值，不改变规则级别）"
        scope: "strict：agent 指令与系统提示、工具与函数描述、SOP、runbook、变更流程、运维与安全敏感操作、排障步骤、告警与错误信息。standard：API 文档、README 式文档、开发者指南、FAQ、发布说明、说明性技术散文。review：按被审文档类型选阈值。"
        trigger: "模式由调用方指定；未指定时按 §3 适用范围推定，跨界取更严。"
        required: "strict：只要存在一种在本文档语境下可执行且导致不同动作的读法即按竞争读法处理。standard：只有普通技术读者会就此产生分歧时才算竞争读法；允许惯用压缩、并句、话题链。"
        prohibited: "strict 把「应」提升为「必须」；任何模式以简洁为名删除条件等；standard 把示例或具体值概括为总结性断言。"
        exceptions: "S、L、T 三族的触发与阈值无关；严重级别只存在于 review。"
        invariant: "规则级别不随模式变化；S、L、T 在两种模式下同样全量生效。"
        fork: no
      - probe: 待确认准入清单
        level: "规范性（「只有七类，此外一律不得进入」）"
        scope: "strict／standard 输出正文末尾；仅当存在未决项时出现。"
        trigger: "存在未决项。"
        required: "可进入：1 证据不足的歧义（A005）；2 来源从未给出的成功判据（P003，限破坏性或不可逆且后续安全取决于它的步骤）；3 工具描述缺失的触发条件（P005）；4 无判据的规范条件（R004）；5 执行所需而来源与上下文都未提供的信息（S002；不属 2–4 类的缺失信息一律归本类）；6 受保护标记拼写疑似有误（S005）；7 长度上限无法在不删除条件或例外的前提下满足（S001）。情态模糊按 §5 进入并填第四栏。"
        prohibited: "风格偏好；改写模式下不妨碍执行的术语差异（T 族说明）；普通步骤缺少判据；不算真歧义的情形（运行时唯一确定的参数、理论上的两种解析）；review 模式不使用该小节而用 finding。"
        exceptions: "第四栏只在 §5 情态模糊时填写。"
        invariant: "每一未决项可归入七类之一并有对应规则 ID。"
        fork: no
      - probe: 优先级阶梯
        level: "裁决规则（用于规则冲突，不授权改动）"
        scope: "五层：1 真值与语义不变量（S、L）；2 操作清晰度（A、P、R004）；3 术语一致（T）；4 自然的技术中文（R002、R003、R005）；5 项目体例与排版（R006）；R001 横跨五层。"
        trigger: "两条规则的候选改动冲突。"
        required: "低层不得覆盖高层；同层并列保留来源形式；第 2 层压过第 4 层仅当消除一处未定（竞争读法或操作未定）；第 1 层不可达时不改写、进「待确认」；改动依据始终是规则 ID。"
        prohibited: "用新增事实、执行者、参数或判据换取清晰度；体例或地区偏好升格为语义规则。"
        exceptions: "消除操作未定属 P002，不算 R002 违规。"
        invariant: "三条判据：更自然的句子不改真值条件、更显式的句子不造要求、更短的句子不丢条件或例外。"
        fork: no
      - probe: 不得做的事
        level: "禁止（不得照做）"
        scope: "五条看似受控实则损坏中文或语义的做法。"
        trigger: "改写或 review 中出现这些倾向。"
        required: "1 不要求每句显式主语、不一句一动词、不拆散连动句（A001、P001、R002）；2 不补省略的量词（R002）；3 不给客观约束添加责任人（S002、S007）；4 不删除软限定词（S003、S006）；5 不展开凝练的技术四字格（R001）。"
        prohibited: "上述五种做法。"
        exceptions: "多执行者交替时重复主语（R002 边界）。"
        invariant: "每条对应的规则 ID 给出正确边界。"
        fork: no
      - probe: 返回前核对
        level: 必须
        scope: "§7 第 7 步，改写与翻译流程；review 不适用。"
        trigger: "第 6 步自然中文渲染完成后、返回前。"
        required: "渲染后文本与来源逐句对照；重新抽取第 1、2 步登记的全部项（受保护标记、数值单位；执行者、动作、对象、条件、例外、顺序、原子性分组、阈值与边界包含性、情态强度、量化论域、因果强度、否定作用域、指代先行词）逐项比较；S、A、P、T、L 五族保持项与来源相同；无不消歧的补出主语、限定、短句；无译文腔；无规则未要求的改动。任一项不成立，先修复再返回。"
        prohibited: "以「我没有改变语义」作结论。"
        exceptions: "调用方已授权的改动不计为不成立。"
        invariant: "逐项对照结果是唯一证据。"
        fork: no
    naturalness:
      score: 4
      evidence:
        - "「对歧义保持沉默是较轻的失败，替作者决定不是。」——短句对举，专业语体，无赘语。"
        - "「冻结普通名词短语会挡住正当改写，翻译标识符会造成不可逆损坏。」——动词直接，句式自然。"
        - "「未定分两种：竞争读法，与操作未定（做哪个动作、对哪个对象、在哪个节点）；消除后者属 CTC-P002，不是 CTC-R002 违规。」——为压缩而省略动词，读感生硬。"
        - "「本技能假定技术数值会被直接复制进单位由字段名固定的配置项，且文档不标明哪些值是这样的」——多层定语「单位由字段名固定的配置项」堆叠，需回读。"
    over_control:
      score: 4
      evidence:
        - "「本规则不要求每句都有显性主语。review 模式同理：施事可由上下文唯一推定时不产生 finding」——主动给规则设边界。"
        - "「没有 finding 是一个有效结果。」以及「不得展开凝练的技术四字格」——防误报与防过度显式的约束明确。"
        - "「S、A、P、T、L 五族每条规则的保持项都须与来源相同」——把 T001 允许的术语统一也纳入「与来源相同」，字面上会要求回退合法改动。"
        - "「过长的「的」字串」——无判据触发条件，可能被用作改写口实（见 X-F1）。"
