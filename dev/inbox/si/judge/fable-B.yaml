    selfhost_findings:
      - id: X-F1
        rule: CTC-A005
        severity: ERROR
        locus: "可进入该小节的只有六类，此外一律不得进入："
        problem: "CTC-S001 规定「无法在不删除的前提下满足上限时，返回完全合规的最短文本，并在「待确认」中说明上限未能满足」，§12「压缩指令与校验点冲突」正例也要求「并附「待确认」说明上限未能满足」；但 §3 准入清单的六类中没有这一情形，且明文「此外一律不得进入」。同一事件有两条互斥指令，读者无法确定执行哪一条。"
        risk: "长度上限无法满足时，执行者或写入被准入清单禁止的条目，或按准入清单沉默省略；后者使调用方得不到「上限未满足」的信号，误以为返回文本已满足上限。"
        suggestion: "在准入清单增加一类：「调用方给定的长度上限无法在不删除条件或例外的前提下满足（CTC-S001）」。"
      - id: X-F2
        rule: CTC-L004
        severity: ERROR
        locus: "正例：磁盘用量超过 90% 时触发告警。"
        problem: "示例「阈值边界翻转」的正例与反例字面相同，都把来源的「达到 90%」改为「超过 90%」。正例本身违反 CTC-L004（「达到 N」含 N，「超过 N」不含 N），示例与规则矛盾。"
        risk: "以示例为准的执行者把边界包含性翻转当作正确改写，恰好 90% 时告警不触发。"
        suggestion: "正例改为「磁盘用量达到 90% 时触发告警。（原样返回）」。"
      - id: X-F3
        rule: CTC-R001
        severity: ERROR
        locus: "正例：磁盘空间不足时，存储管理机制会销毁旧快照数据。"
        problem: "来源为「旧快照数据会被存储管理机制销毁」，施事已在同句给出；按 CTC-R003「被动用于突出受事、施事未知或施事已在同句给出时是自然的技术表述」，该被动句不触发任何规则。正例却把被动改为主动，这处改动没有可归因的规则 ID。"
        risk: "执行者据此把「施事在同句的被动句」视为默认改写对象，产生 CTC-R001 禁止的无据改动。"
        suggestion: "正例改为「原样返回」，并注明施事已在同句给出、被动不触发 CTC-R003。"
      - id: X-F4
        rule: CTC-R003
        severity: WARNING
        locus: "← 去被动正当，删掉具名施事不正当；两处改动只有前一处有规则依据。"
        problem: "反例「旧快照会被自动清理」仍是被动句，并没有「去被动」；反例的实际改动是删施事、增「自动」、删「数据」、以「清理」替换「销毁」，共四处而非两处。注释把一处不存在的改动判为「正当」，且其判断（施事在同句时可去被动）与 CTC-R003 写明的边界相反。"
        risk: "读者从注释学到「施事在同句的被动可以去被动」，扩大 CTC-R003 的触发面，与规则边界相反。"
        suggestion: "注释改为「删掉具名施事、另增「自动」、删「数据」、以「清理」替换「销毁」，均无规则依据；施事已在同句给出，被动不触发 CTC-R003」。"
      - id: X-F5
        rule: CTC-S002
        severity: ERROR
        locus: "「停止写入。等待。检查复制延迟。执行切换。」应写成「停止写入，等待复制延迟归零后执行切换。」"
        problem: "来源没有「归零」这一阈值，「检查复制延迟」是操作者的验证动作。示范改写补出了来源没有的判据「归零」，并把验证动作改写成等待条件；与 CTC-S002「不得以补写填平」、§6「不得补出缺失的参数、阈值……使文本看起来可执行」以及 CTC-P003「不得把祈使的验证动作改写为对系统行为的描述」都矛盾。"
        risk: "执行者仿照示例，在并句时为显得可执行而补写阈值，产生与来源无法区分的虚构判据；操作者据「归零」等待，而来源作者可能只要求延迟低于某个未写出的值。"
        suggestion: "改为「停止写入，等待并检查复制延迟，然后执行切换。」，保留「检查复制延迟」为操作者动作，不引入「归零」。"
      - id: X-F6
        rule: CTC-S003
        severity: ERROR
        locus: "3. review 模式作为一条 finding，严重级别为 ERROR。"
        problem: "§6 规定「情态强度的模糊同样按本节处理」，并用「必须报告其可能的两种以上强度并给出建议」；按本节第 3 条，review 下该情形为 ERROR。但同一情形在 §3 准入清单第 4 类归 CTC-R004，R004 级别为「应」，按 §7／§10 映射为 WARNING。同一违规被赋予两个规范强度与两个严重级别。"
        risk: "review 模式下，「尽快回滚」一类条目被不同执行者分别报为 ERROR 与 WARNING，排序与是否需要人工判断随之不同；改写模式下「应」可被更高优先级推翻而「必须」不可。"
        suggestion: "§6 改为「按 CTC-R004 在「待确认」中提出，级别以 §7 规则表为准」，删去本节对该情形的独立强度规定；若要 ERROR，在 R004 或 §10 写明升级条件。"
      - id: X-F7
        rule: CTC-L001
        severity: ERROR
        locus: "改写、压缩与翻译之后逐项核对；任一项出现偏离都是一处 finding，其严重级别由 §7 中该行所引规则的级别决定"
        problem: "该句面向改写、压缩与翻译任务，却规定偏离「是一处 finding」并赋严重级别。§3 明文「严重级别只存在于 review 模式——改写没有可分级的 finding」，§11 规定偏离时「先修复再返回」。该句缺少「review 模式下」这一条件，与 §3、§11 冲突。"
        risk: "改写模式下执行者可能把偏离记为 finding 输出（违反输出契约「无前言，不解释改动」），或在「修复」与「记为 finding」之间择一。"
        suggestion: "改为「改写、压缩与翻译之后逐项核对，任一项被破坏先修复再返回；review 模式下任一项偏离都是一处 finding，严重级别按 §10 确定」。"
      - id: X-F8
        rule: CTC-A005
        severity: ERROR
        locus: "- **STYLE** — 不影响语义的自然度或一致性问题。"
        problem: "STYLE 的定义把「自然度或一致性问题」归入 STYLE，但自然度（CTC-R003）与术语一致（CTC-T001）级别都是「应」，按同节映射「应 → WARNING」；唯一的「可以」级规则是 CTC-R006（排版）。定义与映射对同一类 finding 给出不同严重级别；「最多三条 STYLE 观察」也因此无法确定可引用哪些规则 ID，而 §3 要求每条 finding 引用规则 ID。"
        risk: "review 输出中 R003／T001 类 finding 被不同执行者分别标为 WARNING 与 STYLE，排序与人工判断范围随之改变。"
        suggestion: "STYLE 定义改为「可以级规则（CTC-R006）的排版与地区约定问题」，并写明「STYLE 观察」也须引用规则 ID。"
      - id: X-F9
        rule: CTC-P002
        severity: WARNING
        locus: "重新抽取 (情态, 数值, 量化, 因果, 否定作用域, 施事, 指代, 条件, 时序, 受保护标记) 并与第 2 步的记录逐项比较"
        problem: "第 2 步记录的字段是「执行者、动作、对象、条件、例外、顺序、原子性分组、阈值与边界包含性、情态强度、量化论域、因果强度、否定作用域」。第 7 步的元组少了动作、对象、例外、原子性分组、阈值与边界包含性，多了数值、指代、受保护标记。「逐项比较」的对象在两处定义不一致，第 7 步无法按字面执行。"
        risk: "渲染之后不再核对例外、原子性分组与阈值边界，恰是 CTC-L001／P001／L004 保护的项。"
        suggestion: "第 7 步改为「重新抽取第 2 步的全部字段，另加指代与受保护标记，与第 2 步的记录逐项比较」。"
      - id: X-F10
        rule: CTC-R004
        severity: WARNING
        locus: "返回之前逐项回答。任一项为「否」，先修复再返回。"
        problem: "清单第 4 项后半（「有没有做过单位换算？」）、第 9 项后半、第 10 项、第 11 项是反向提问，答「否」才合规；「任一项为「否」，先修复」这一判定条件对混合极性的清单不可判定。"
        risk: "执行者需自行推断每项的极性，清单失去可机械执行的判据。"
        suggestion: "统一提问极性，或把判定条件改为「任一项不成立（不变量被破坏或存在无据改动），先修复再返回」。"
      - id: X-F11
        rule: CTC-P003
        severity: WARNING
        locus: "正例：1. 启动 `chunk-server`。2. 确认状态为 `READY` 且元数据已加载。3. 加入写入路由表。"
        problem: "指令「合并可合并的步骤」即 CTC-P003 所述的调用方合并授权。按 P003，验证步骤可并入相邻步骤，只要仍由操作者执行、位于被守护动作之前且判据列全；「1. 启动 chunk-server，确认状态为 READY 且元数据已加载。2. 加入写入路由表。」满足 2 步上限且不删校验。正例却断言上限无法满足，与 P003 的合并许可及 CTC-S001「无法在不删除的前提下满足上限时」的触发条件矛盾。"
        risk: "执行者在有授权且可合规合并的情形下拒绝合并，返回超限文本并制造不必要的未决项。"
        suggestion: "正例改为合并后的两步版本；仅在确实无法不删校验而达标时才保留三步并进「待确认」。"
      - id: X-F12
        rule: CTC-P005
        severity: WARNING
        locus: "模式未指定时，按 §3 的适用范围推定，并在文档类型跨界时取更严的一档。"
        problem: "§1 把「状态提示」列为适用文档，但 §3 strict 与 standard 的适用范围都未列出它（strict 仅列「告警与错误信息」）。模式未指定时无法按 §3 推定，也不属于「跨界」。"
        risk: "状态提示文本的歧义阈值在 strict 与 standard 之间不确定，A、P 两族的触发面随执行者而异。"
        suggestion: "在 strict 适用范围中写「告警、错误信息与状态提示」，或在 §1 写明状态提示按哪一档处理。"
    reverse_decoding:
      - probe: CTC-S001
        level: 必须
        scope: "改写、压缩、合并或翻译含具体断言的文本；含调用方给定长度上限的情形"
        trigger: "来源含具体断言（对象、属性、行为、数值、条件、结果、失败分支）且任务为改写／压缩／合并／翻译"
        required: "每条独立断言在输出中可还原；无法在不删除的前提下满足长度上限时，返回完全合规的最短文本并在「待确认」中说明上限未能满足"
        prohibited: "删除条件、例外、阈值、告警或失败分支，包括以长度上限为由"
        exceptions: "同一断言的重复表述与纯修饰成分可删；调用方授权指定长度上限不改变对删除的禁止"
        invariant: "断言集合：来源每条独立断言在输出中可还原"
        fork: yes
        readings:
          - "读法 1（CTC-S001 条文与 §12 压缩正例）：上限无法满足时在「待确认」写一行「上限未能满足」→ 输出含该条目"
          - "读法 2（§3 准入清单「只有六类……此外一律不得进入」）：该情形不在六类内→ 不写入，输出无「上限未满足」信号"
      - probe: CTC-S003
        level: 必须
        scope: "来源含情态、义务、请求、许可、禁止、建议或对系统行为的描述的文本"
        trigger: "上述成分出现"
        required: "(认识强度, 道义强度, 言语行为类型) 逐处不变"
        prohibited: "确保→确认、请→须、不会→禁止、建议→必须、可能→会、必须→应等强度或言语行为类型改变"
        exceptions: "同强度换词（不得↔禁止）；调用方显式授权调整规范强度；翻译时按强度类别对译而非字面对译"
        invariant: "情态剖面"
        fork: no
      - probe: CTC-A001
        level: 必须
        scope: "来源指明执行者（含被动句中的施事）的文本；review 模式同理"
        trigger: "来源指明了执行者"
        required: "执行者在输出中仍可定位；仅当存在多个可能执行者且不同读法改变由谁执行时才补出执行者，且须能从来源或上下文确定"
        prohibited: "把具名组件替换为笼统称呼；删除施事；review 中把可唯一推定施事的无施事被动句报为施事缺失"
        exceptions: "不要求每句都有显性主语；施事可由上下文唯一推定时不产生 finding"
        invariant: "执行者绑定：具名施事在输出中仍可定位"
        fork: yes
        readings:
          - "读法 1（规则条文）：来源具名的执行者须在输出中保留可定位的文本位置→「用户打开控制台。用户点击设置。用户修改端口。」改写后至少保留一次「用户」"
          - "读法 2（§8 第 1 条示例「打开控制台后，点击「设置」修改端口。」）：祈使句的读者即执行者，可把「用户」整体删去→ 输出不再出现执行者"
      - probe: CTC-A005
        level: 必须
        scope: "所有模式；存在两种以上导致不同行为的读法且来源与上下文不足以判定，或缺少执行所需的参数、阈值、接收方、判据"
        trigger: "上述情形"
        required: "保持原表述；在「待确认」中给出位置、竞争读法或缺失项、判定所需的信息；review 模式下为 ERROR finding"
        prohibited: "静默择一；补出缺失项；用流畅改写掩盖歧义；输出多个完整备选版本；同一处既消歧又替换关键动词"
        exceptions: "一种读法在该领域不对应任何可执行操作；参数在运行时由外部唯一确定；仅「理论上可解析出两种读法」不算"
        invariant: "歧义守恒：未获证据的歧义在输出中仍然存在且被报告"
        fork: no
      - probe: CTC-P003
        level: 应
        scope: "来源给出成功判据、等待条件或验证方式的步骤文本；以及来源未给判据的破坏性或不可逆步骤"
        trigger: "来源给出判据；或来源把验证单独列为一步且有合并授权；或来源未给判据而该步破坏性／不可逆且后续步骤安全性取决于它"
        required: "判据与所验证步骤保持绑定并保持阻塞性质；单独验证步骤未获授权则保持独立；授权合并时可并入相邻步骤，但须由操作者执行、位于被守护动作之前、逐项列全；破坏性步骤缺判据按「待确认」第 2 类提出"
        prohibited: "移入附注、脚注或文末；把祈使验证动作改为系统行为描述；虚构验收标准；丢任一判据；对非破坏性步骤缺判据提出未决项"
        exceptions: "调用方授权合并步骤；其余步骤缺少判据不提出"
        invariant: "判据绑定：(步骤, 判据, 是否阻塞) 不变"
        fork: yes
        readings:
          - "读法 1（规则条文）：指令「合并可合并的步骤」构成合并授权→ 把「确认状态为 READY 且元数据已加载」并入步骤 1，输出 2 步且校验完整"
          - "读法 2（§12 正例）：不合并，返回原 3 步并在「待确认」说明上限未能满足"
      - probe: CTC-P004
        level: 必须
        scope: "步骤含破坏性、不可逆或改变外部状态的操作，且来源给出了前置条件、前提或告警"
        trigger: "上述两个条件同时成立"
        required: "条件出现在被守护动作之前：同句前段，或紧邻的上一句；独立结构块告警管辖其依附的整个流程"
        prohibited: "把守护条件放到动作之后；虚构来源没有的条件；移动独立告警块（属 CTC-R005 违规）"
        exceptions: "独立结构块告警不要求移到步骤旁；来源无条件时不补"
        invariant: "守护顺序：守护条件在被守护动作之前"
        fork: no
      - probe: CTC-R001
        level: 必须
        scope: "任何改写或翻译任务；横跨全部五层，约束六族的应用方式"
        trigger: "任何一处改动"
        required: "每处改动可归因到一条规则 ID；未触发规则的文本原样返回；strict／standard 下归因为内部纪律，review 下为「规则」字段"
        prohibited: "以「更清楚」「更专业」为由等义替换；为体现工作量改写；多处不相关改动混在一起"
        exceptions: "调用方授权本身构成归因"
        invariant: "无规则触发即无改动"
        fork: yes
        readings:
          - "读法 1（规则条文 + CTC-R003 边界「施事已在同句给出时是自然的技术表述」）：「旧快照数据会被存储管理机制销毁」不触发任何规则→ 原样返回"
          - "读法 2（§12「执行者删除」正例与注释「去被动正当」）：此类被动句可改为主动→ 输出「存储管理机制会销毁旧快照数据」"
      - probe: CTC-R002
        level: 应
        scope: "改写输出文本"
