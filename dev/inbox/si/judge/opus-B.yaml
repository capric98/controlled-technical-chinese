judge_phase: 1
files_read:
  - dev/inbox/si/blind/C.md
  - dev/inbox/si/blind/B.md
documents:
  X:
    path: dev/inbox/si/blind/C.md
    rule_levels:
      CTC-S001: 必须
      CTC-S002: 必须
      CTC-S003: 必须
      CTC-S004: 必须
      CTC-S005: 必须
      CTC-S006: 必须
      CTC-S007: 必须
      CTC-A001: 必须
      CTC-A002: 必须
      CTC-A003: 应
      CTC-A004: 必须
      CTC-A005: 必须
      CTC-P001: 必须
      CTC-P002: 应
      CTC-P003: 应
      CTC-P004: 必须
      CTC-P005: 应
      CTC-T001: 应
      CTC-T002: 必须
      CTC-L001: 必须
      CTC-L002: 必须
      CTC-L003: 必须
      CTC-L004: 必须
      CTC-R001: 必须
      CTC-R002: 应
      CTC-R003: 应
      CTC-R004: 应
      CTC-R005: 应
      CTC-R006: 可以
    selfhost_findings:
      - id: X-F1
        rule: CTC-L004
        severity: ERROR
        locus: "正例：磁盘用量超过 90% 时触发告警。"
        problem: "§12「阈值边界翻转」的正例与反例逐字相同，都把来源的「达到 90%」改成了「超过 90%」。正例本身就违反了本例要演示的 CTC-L004。"
        risk: "按示例学习的执行者会把「达到 N」改写为「超过 N」，边界值 90% 上不再告警。这正是规则要防止的事故。"
        suggestion: "正例：磁盘用量达到 90% 时触发告警。（原样返回）"
      - id: X-F2
        rule: CTC-S002
        severity: ERROR
        locus: "应写成「停止写入，等待复制延迟归零后执行切换。」"
        problem: "来源「停止写入。等待。检查复制延迟。执行切换。」没有给出任何判据，示例却补出了「归零」这一阈值，同时删掉了「检查」这个动作。这是在补写来源没有的判据，与 CTC-S002、CTC-P003 的「不得虚构验收标准」直接冲突。"
        risk: "执行者会照此示例为等待步骤虚构成功判据。操作者在真实系统中可能一直等待一个永远不会到达的「归零」，也可能以错误的阈值执行切换。"
        suggestion: "应写成「停止写入，等待并检查复制延迟，然后执行切换。」"
      - id: X-F3
        rule: CTC-R001
        severity: ERROR
        locus: "正例：磁盘空间不足时，存储管理机制会销毁旧快照数据。"
        problem: "来源「旧快照数据会被存储管理机制销毁」的施事已在同句给出。按 CTC-R003，这是自然的技术被动句，不触发任何规则。CTC-R001 要求未触发规则的文本原样返回，示例却把它改成主动句，并注明「去被动正当」。"
        risk: "执行者会把施事明确的被动句一律改为主动句，产生没有规则依据的改动，审阅也无法把这类改动归因到任何规则。"
        suggestion: "正例：原样返回。施事已在同句给出，被动是自然的技术表述（CTC-R003），不触发去被动。"
      - id: X-F4
        rule: CTC-A001
        severity: ERROR
        locus: "「用户打开控制台。用户点击设置。用户修改端口。」应写成「打开控制台后，点击「设置」修改端口。」"
        problem: "来源指明的执行者「用户」在示例输出中完全消失。CTC-A001 要求来源指明的执行者在输出中仍可定位。另外，本条的补主语判据是「多角色交替执行」，CTC-A001 的判据是「存在多个可能执行者且不同读法改变由谁执行」，两处判据措辞不一致。"
        risk: "如果文档的读者不是用户本人（例如面向管理员的操作说明），祈使句会把执行者从「用户」变成读者，执行主体随之改变。"
        suggestion: "应写成「用户打开控制台，点击设置，修改端口。」只有存在多个可能执行者、且不同读法改变由谁执行时才补主语（CTC-A001）。"
      - id: X-F5
        rule: CTC-S001
        severity: ERROR
        locus: "可进入该小节的只有六类，此外一律不得进入"
        problem: "CTC-S001 要求长度上限无法满足时「在「待确认」中说明上限未能满足」，§12 CTC-P003 示例也附了这项说明。但「待确认」的六类准入清单里没有「长度上限未能满足」这一类，而清单是封闭的。两条要求互相冲突。"
        risk: "执行者只能二选一：要么违反封闭清单，要么违反 CTC-S001，返回超限文本却不作说明。调用方因此看不到上限未被满足的原因。"
        suggestion: "在准入清单中增加第 7 类：调用方给定的长度上限无法在不删除条件或例外的前提下满足（CTC-S001）。"
      - id: X-F6
        rule: CTC-P003
        severity: WARNING
        locus: "缺失信息一律归第 5 类，不论是哪条规则先发现它"
        problem: "第 2–4 类（缺失的成功判据、缺失的触发条件、无判据的规范条件）本身也是缺失信息。「一律归第 5 类」与第 2–4 类的划分冲突，也会绕过 CTC-P003 的限制：只有破坏性或不可逆步骤缺少判据才提出。"
        risk: "非破坏性步骤缺少判据时，可能被当作第 5 类的「执行所需信息」提出，形成 CTC-P003 明确要避免的成串未决项。"
        suggestion: "5. 第 2–4 类之外、执行所需而来源与上下文都未提供的信息，不论由哪条规则发现（CTC-S002）；"
      - id: X-F7
        rule: CTC-A003
        severity: WARNING
        locus: "**上下文能确定读法时，必须消歧**，并且所选读法必须有来源或上下文证据。"
        problem: "§6 用「必须」统一规定消歧义务，但 CTC-A003（修饰结合域）的级别是「应」，按定义可被更高优先级或明确边界推翻。同一义务在两处强度不同。"
        risk: "执行者会把 CTC-A003 当作不可推翻的义务执行，在自然度层本可保留的结构上也强行重复中心语或拆分并列项。"
        suggestion: "上下文能确定读法时，按对应规则消歧，级别以 §7 规则表为准；所选读法必须有来源或上下文证据。"
      - id: X-F8
        rule: CTC-R004
        severity: WARNING
        locus: "3. review 模式作为一条 finding，严重级别为 ERROR。"
        problem: "§6 规定无法确定的歧义在 review 中一律报 ERROR，又规定「情态强度的模糊同样按本节处理」，并写有「必须报告其可能的两种以上强度」。这样，CTC-R004（应）的违规被固定报为 ERROR，与 §7 的「应 → WARNING」以及 §10 的「没有其他升级」冲突。§6 用「必须」表述的义务也高于 CTC-R004 自身的「应」。"
        risk: "同一处无判据词，不同执行者会给出 ERROR 或 WARNING 两种严重级别，发布门禁的结论因此不稳定。"
        suggestion: "review 模式作为一条 finding，严重级别按所引规则的级别确定（§10）；情态模糊按 CTC-R004 报告。"
      - id: X-F9
        rule: CTC-P003
        severity: WARNING
        locus: "正例：1. 启动 `chunk-server`。2. 确认状态为 `READY` 且元数据已加载。3. 加入写入路由表。"
        problem: "调用方授权「合并可合并的步骤，压缩到不超过 2 步」。CTC-P003 允许在授权下把验证步骤并入相邻步骤，只要验证仍由操作者执行、位于被守护动作之前、判据逐项列全。把第 2 步并入第 1 步即可合规地满足上限，示例却保留 3 步并声称上限未能满足。CTC-S001 的「无法在不删除的前提下满足上限时」这一前提并不成立。"
        risk: "执行者会拒绝可以合规完成的压缩，返回超限文本，附一条不必要的待确认项。"
        suggestion: "正例：1. 启动 `chunk-server`，确认状态为 `READY` 且元数据已加载。2. 加入写入路由表。"
      - id: X-F10
        rule: CTC-R005
        severity: WARNING
        locus: "调用方可以显式授权四类本来禁止的改动：调整规范强度、精确的单位换算、解除某个受保护标记的保护、指定改写目标或长度上限。"
        problem: "此处把可授权的改动限定为四类，并写有「未获授权的同类改动一律不得做」。但 CTC-R005 另有「调用方明确要求改变格式时按要求执行」，CTC-P003 另有「调用方授权合并步骤」。这两类授权不在四类之内，定义处的数量与引用处不一致。"
        risk: "执行者可能以「不属于四类授权」为由，拒绝调用方的格式变更或合并步骤请求。"
        suggestion: "调用方可以显式授权下列本来禁止的改动：……以及规则条文中写明的授权（CTC-P003 的合并步骤、CTC-R005 的改变格式）。"
      - id: X-F11
        rule: CTC-T001
        severity: WARNING
        locus: "改写、压缩与翻译之后逐项核对；任一项出现偏离都是一处 finding"
        problem: "「finding」在 §3、§10 中专指 review 模式的输出项（「严重级别只存在于 review 模式——改写没有可分级的 finding」），§4 却把它用于改写模式下的内部偏离。同一术语覆盖了两个概念。"
        risk: "strict/standard 模式下，执行者可能把偏离写成 finding 输出，违反「只返回改写后的中文正文」的输出契约，而不是先修复再返回。"
        suggestion: "改写、压缩与翻译之后逐项核对，任一项出现偏离先修复再返回；review 模式下，任一项偏离都是一处 finding。"
      - id: X-F12
        rule: CTC-L002
        severity: ERROR
        locus: "返回之前逐项回答。任一项为「否」，先修复再返回。"
        problem: "第 10、11 项的问法是「我有没有补出……？」「我有没有改动任何规则并未要求改动的地方？」，对这两项回答「否」表示没有问题。「任一项为「否」，先修复」的触发条件在这两项上方向相反。第 11 项有「有则还原」可以纠正，第 10 项没有。"
        risk: "照字面执行的执行者会在第 10 项答「有」（确有冗余主语或译文腔）时不修复就返回，或者在答「否」时无事可修却进入修复流程。"
        suggestion: "把第 10、11 项改为肯定问法，例如「10. 补出的每个主语、限定或短句都对应一处歧义风险，且没有留下译文腔吗？」「11. 每一处改动都能归因到一条规则吗？」"
      - id: X-F13
        rule: CTC-R004
        severity: WARNING
        locus: "模式未指定时，按 §3 的适用范围推定，并在文档类型跨界时取更严的一档。"
        problem: "§1 把「状态提示」列为适用对象，但 §3 strict 与 standard 的适用范围都没有列出状态提示。strict 列的是「告警与错误信息」，standard 列的是说明性文档。状态提示的模式因此没有可判定的推定依据。"
        risk: "同一条状态提示，一个执行者可能按 strict 的低阈值处理，另一个按 standard 的高阈值处理，报告的歧义数量和改写范围都会不同。"
        suggestion: "在 strict 适用范围中写入「告警、错误信息与状态提示」，或在 standard 中明确列出状态提示。"
      - id: X-F14
        rule: CTC-R006
        severity: STYLE
        locus: "未发现问题时返回「未发现违规」，其后最多三条 STYLE 观察。"
        problem: "此处没有说明 STYLE 观察是否需要规则 ID。同节「不得：……报告没有规则 ID 的 finding」要求每条 finding 都有规则 ID，§3 又有「未触发规则的文本不产生 finding」。观察的地位不清。"
        risk: "执行者可能附上无规则 ID 的风格意见，把个人偏好带入审阅结果。"
        suggestion: "未发现问题时返回「未发现违规」，其后最多三条 STYLE 观察，每条引用规则 ID。"
    reverse_decoding:
      - probe: CTC-S001
        level: 必须
        scope: "改写、压缩、合并或翻译含具体断言的文本"
        trigger: "文本含具体断言（对象、属性、行为、数值、条件、结果、失败分支）"
        required: "每条独立断言在输出中可还原。长度上限无法满足时，返回完全合规的最短文本，并在「待确认」中说明上限未能满足。"
        prohibited: "删除条件、例外、阈值、告警或失败分支，即使调用方给了长度上限也不行"
        exceptions: "可以删除同一断言的重复表述与纯修饰成分"
        invariant: "断言集合"
        fork: yes
        readings:
          - "读法 1（依 CTC-S001 条文与 §12 示例）：返回超限文本，并在「待确认」中加一行说明上限未能满足。"
          - "读法 2（依 §3「只有六类，此外一律不得进入」）：上限说明不属于任何一类，不写入「待确认」，只返回超限文本，不作说明。"
      - probe: CTC-S003
        level: 必须
        scope: "所有改写与翻译"
        trigger: "来源含情态、义务、请求、许可、禁止、建议或对系统行为的描述"
        required: "(认识强度, 道义强度, 言语行为类型) 逐处不变；翻译时按强度类别对译"
        prohibited: "确保→确认、请→须、不会→禁止、建议→必须、可能→会、必须→应"
        exceptions: "同强度换词（不得↔禁止）；调用方显式授权调整规范强度"
        invariant: "情态剖面"
        fork: no
        readings: []
      - probe: CTC-A001
        level: 必须
        scope: "改写与 review"
        trigger: "来源指明了执行者，包括被动句中的施事"
        required: "执行者在输出中仍可定位；只有存在多个可能执行者且读法改变由谁执行时才补出执行者，补出者必须可从来源或上下文确定"
        prohibited: "把具名组件替换为笼统称呼；review 中把施事可唯一推定的无施事被动句报为施事缺失"
        exceptions: "不要求每句都有显性主语"
        invariant: "执行者绑定"
        fork: yes
        readings:
          - "读法 1（依规则条文）：来源中的「用户」至少保留一次，其余承前省略。"
          - "读法 2（依 §8 第 1 条示例）：只要不是「多角色交替执行」，就可以把来源指明的执行者完全删掉，改成无主语的祈使句。"
      - probe: CTC-A005
        level: 必须
        scope: "改写与 review 中所有无法凭证据消歧的情形"
        trigger: "存在两种以上导致不同行为的读法且来源与上下文不足以确定；或缺少执行所需的参数、阈值、接收方、判据"
        required: "保持原表述；在「待确认」中给出位置、竞争读法或缺失项、判定所需信息；review 中报 ERROR"
        prohibited: "静默择一；补出缺失项；用流畅改写掩盖歧义；输出多个完整备选版本；消歧与替换关键动词混在同一处"
        exceptions: "某一读法在该领域不对应任何可执行操作；参数在运行时由外部唯一确定；仅理论上可解析出两种读法"
        invariant: "歧义守恒"
        fork: no
        readings: []
      - probe: CTC-P003
        level: 应（条内「必须仍是继续的前提」）
        scope: "含成功判据、等待条件或验证方式的步骤文本"
        trigger: "来源给出判据；或验证单独成步；或来源缺判据且该步是破坏性或不可逆操作"
        required: "判据绑定在原步骤上并保持阻塞性质。授权合并时，验证仍由操作者执行、位于被守护动作之前、判据逐项列全。破坏性步骤缺判据时进第 2 类。"
        prohibited: "把判据移入附注或文末；把验证动作改写为状态描述；虚构验收标准；丢失任一判据"
        exceptions: "非破坏性步骤缺判据时不提出"
        invariant: "判据绑定"
        fork: yes
        readings:
          - "读法 1（依规则条文）：授权压缩到 2 步时，把验证并入第 1 步，输出 2 步，不附待确认项。"
          - "读法 2（依 §12 示例）：保持 3 步独立，附「待确认」说明上限未能满足。"
          - "读法 3（依 §3「缺失信息一律归第 5 类」）：非破坏性步骤缺判据时，也可以作为执行所需信息按第 5 类提出，绕过本规则的限制。"
      - probe: CTC-P004
        level: 必须
        scope: "含破坏性、不可逆或改变外部状态操作的步骤"
        trigger: "这类操作存在，且来源给出了前置条件、前提或告警"
        required: "条件出现在被守护动作之前，位于同句前段或紧邻的上一句"
        prohibited: "虚构来源没有的条件；移动独立的告警结构块（移动属 CTC-R005 违规）"
        exceptions: "独立结构块告警管辖整个流程，不论位置在前还是在后"
        invariant: "守护顺序"
        fork: no
        readings: []
      - probe: CTC-R001
        level: 必须
        scope: "所有改写与翻译"
        trigger: "任何改写或翻译任务"
        required: "每处改动可归因到一条规则 ID；未触发规则的文本原样返回"
        prohibited: "以「更清楚」「更专业」为由做等义替换；为体现工作量改写；把不相关改动混在一起"
        exceptions: "调用方授权本身即构成归因"
        invariant: "最小可归因改动"
        fork: yes
        readings:
          - "读法 1（依 CTC-R003 与本条）：施事已在同句给出的被动句不触发规则，原样返回。"
          - "读法 2（依 §12「执行者删除」正例及其注释「去被动正当」）：可以把这类被动句改为主动句。"
      - probe: CTC-R002
        level: 应
        scope: "改写输出"
        trigger: "输出中出现逐句重复的主语、机械拆分的短句，或不消歧的补充限定"
        required: "删去；每个补出的成分都对应一处可指认的歧义风险"
        prohibited: "把 strict 理解为显式化的数量要求"
        exceptions: "多执行者交替出现时重复主语；写出可确定的动作、对象或位置（属 CTC-P002）"
        invariant: "不适用（第 4 层）"
        fork: no
        readings: []
      - probe: 模式
        level: "不适用"
        scope: "strict：agent 指令、工具描述、SOP、runbook、运维操作、排障、告警与错误信息。standard：API 文档、README、指南、FAQ、发布说明。review：审计、门禁、自审。"
        trigger: "由调用方指定；未指定时按适用范围推定，跨界时取更严的一档"
