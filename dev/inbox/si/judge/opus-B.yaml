        doc_quote: absent
        type: weakened
        severity: WARNING
        why: "虚构执行者、参数、失败原因、告警和升格情态，分别仍由 A001、S002、A005、S003 覆盖。但「不得重复不消歧的主语」「不得把复句拆成一行一句」在基线 strict 下是不可推翻的禁止，在 Y 中只剩 CTC-R002 的「应」和只管步骤拆分的 CTC-P001，强度降低。"
      - baseline_quote: "条件、前提、例外、守护条件与成功判据不得为求简洁删除。"
