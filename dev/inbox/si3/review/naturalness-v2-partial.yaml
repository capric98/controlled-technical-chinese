reviewer: naturalness
model: claude-opus-5-5
files_read:
  - dev/prompts/si3-naturalness.md
  - dev/inbox/si3/base/SKILL.md
  - dev/inbox/si3/cand/v2/SKILL.md
passages:
  - id: S1
    note: "本条同时覆盖 §1 删去「状态提示、」与 §3 strict 适用范围末项改为「告警、错误信息与状态提示」，二者是同一次挪动。"
    candidate_text: |-
      §1：写作、改写、翻译或审阅中文技术内容时，本技能生效，覆盖 §3 strict 与 standard 适用范围所列的文档类型，以及技术文本的英译中与既有中文技术文本的审校。
      §3 strict 适用范围末项：告警、错误信息与状态提示。
    naturalness: 5
    quotes:
      - "基线「以及状态提示、技术文本的英译中与既有中文技术文本的审校」在「以及」之后并列了一个文档类型（状态提示）和两项任务（英译中、审校），类别不齐。v2 删去后只剩两项任务，「X 的英译中与 Y 的审校」结构对称，读起来顺。"
      - "§3「告警、错误信息与状态提示」三项同属消息类文本，顿号加「与」收尾是常规列举，与同行「运维与安全敏感操作」「排障步骤」语体一致。"
    ambiguity:
      - "v2 消除了基线的一处修饰结合歧义。基线「状态提示、技术文本的英译中」有两种读法：「（状态提示）、（技术文本的英译中）」，或「（状态提示、技术文本）的英译中」，后者只覆盖状态提示的英译中，不覆盖状态提示本身。v2 没有这个问题。"
      - "v2 的两处新措辞本身没有发现第二种读法。"
      - "（不在 diff 内，仅记录）frontmatter 的 description 仍只写「告警与错误信息」，没有列出状态提示。基线也是如此，所以不是本次回归，但 §3 strict 与 description 的列举从此不一致。"
    over_control_risk:
      - target_text: "请稍候，正在为你生成报告～"
        risk: "状态提示从此落入 strict（歧义阈值最低、全部规则生效），又与 v2 新增的 CTC-R003 口语腔规则同时作用。状态提示恰是「请」「你」、语气符号和产品友好口吻最集中的文体。模型可能把整个「请稍候」当作客套删掉，得到「正在生成报告」。但「请稍候」是让用户等待、不要重复操作的指令，删掉它就丢了一条指令（CTC-S001、CTC-S003）。按 CTC-R003 的最小改动，至多删「为你」和「～」。"
      - target_text: "已保存"
        risk: "strict 的低阈值可能促使模型给极简状态提示补出执行者或对象（「系统已保存您的更改」）。§3「strict 不等于最大冗长」与 CTC-A001、CTC-R002 已经挡住这种做法，措辞本身没有带来新风险。这里只记录：状态提示进入 strict 后，这道防线被触及的频率会上升。"
    normative_vocabulary: ok
  - id: ladder-4
    candidate_text: "| 4 自然的技术中文 | 专业中文技术语体：无译文腔与口语腔、无伪法律赘语、无机械重复的主语、无人为碎句、无多余被动 |"
    naturalness: 4
    quotes:
      - "「无译文腔与口语腔」：本行其余各项都是一项一个「无」（无伪法律赘语、无机械重复的主语、无人为碎句、无多余被动），只有第一项让一个「无」管两个并列名词，节奏不齐。"
      - "把「口语腔」放在第 4 层「自然的技术中文」之下是自洽的：专业技术语体本来就排斥口语腔。同一行的「无伪法律赘语」从另一个方向限定语体，避免去口语腔时滑向公文腔。"
    ambiguity:
      - "「无译文腔与口语腔」理论上有第二种读法：「无（译文腔与口语腔兼有）」，即只排除二者同时出现的情形。中文读者通常按分别否定理解，但这正是本技能 CTC-A004 所管的否定作用域结构，而本行其余各项都分别写「无」，改成一致的写法没有成本。"
      - "第 4 层的「口语腔」与第 5 层的「人称与语态偏好」边界不清：第二人称（「你」「您」）、面向用户的「请」，算第 4 层的口语腔，还是第 5 层的人称偏好？阶梯把第 4 层排在第 5 层之上，归到哪一层就决定了谁覆盖谁。"
    over_control_risk:
      - target_text: "您可以在控制台的「安全组」页面添加入方向规则。"
        risk: "国内云厂商文档的常规体例就是用「您」，属第 5 层的人称偏好。审阅者若引用阶梯，可能把「您」判为第 4 层的口语腔并认定第 4 层压过第 5 层，于是删掉「您」，甚至改成「支持在控制台的「安全组」页面添加入方向规则」，把对读者的许可（可以）改成对系统能力的描述，改变了言语行为类型（CTC-S003）。"
    equivalent_rewording: "| 4 自然的技术中文 | 专业中文技术语体：无译文腔、无口语腔、无伪法律赘语、无机械重复的主语、无人为碎句、无多余被动 |"
    rewording_is_equivalent_because: "「无 A 与 B」的意图读法是分别否定，等于「无 A、无 B」。改写只排除不合意图的合取否定读法，并让第一项与本行其余各项的「无 X」格式一致；层号、各项内容与项目范围都不变。第 4 层与第 5 层的边界问题不属措辞层面，本改写不处理。"
    normative_vocabulary: ok
  - id: R003
    candidate_text: "| CTC-R003 | 应 | 反译文腔与口语腔 | 文本含译文腔——无必要的被动、名词化赘语（进行／作出／予以 + 动词）、过长的「的」字串、英语句式残留（「由于…的事实」「使用户能够…」）、直译连接词——或口语腔——客套与请托（「麻烦您」）、语气词（「啊」「嘛」）、情绪化感叹（「哎呀！」）、口语填充（「一下」）、把读者当作谈话对象的引导（「这个工具可以帮你」）——时，在语义完全不变的前提下改用中文技术写作的常规表达。被动用于突出受事、施事未知或施事已在同句给出时是自然的技术表述。表示强度的「千万」不是口语腔。本规则永远低于 S 族。 |"
    naturalness: 3
    quotes:
      - "「……直译连接词——或口语腔——客套与请托……」：两对破折号首尾相接，中间夹出「——或口语腔——」。线性阅读时，读者会先把「或口语腔」当成一段插入语，读到第二个列表才回头重新切分。"
      - "触发条件从「文本含」到「——时」共 159 字，含 10 个子类、9 处「」引例，圆括号里再套直角引号；读到「时」，条件的主干「文本含译文腔或口语腔」已很难记住。"
      - "「口语填充（「一下」）」：「口语填充」是 filler 的直译，中文语法与写作指南通常说「填充词」「口头禅」或「赘词」，以「口语填充」作类名略生硬，是自宿主层面的轻微译文腔。"
      - "「客套与请托（「麻烦您」）」「语气词（「啊」「嘛」）」「情绪化感叹（「哎呀！」）」三项本身自然，引例典型。"
      - "「表示强度的「千万」不是口语腔。」短句自然，与上一句「被动用于……是自然的技术表述」同为判断句；两条边界句分别对应译文腔与口语腔，顺序与前文一致。"
      - "「英语句式残留（「由于…的事实」「使用户能够…」）」比基线「英语从句语序残留」准确：「使…能够」是句式问题，不是从句语序问题。"
    ambiguity:
      - "切分：「——或口语腔——」可被读成插入语，使第二个列表看起来是对译文腔的继续展开。两种切分都触发同一要求，行为后果小，主要是阅读负担。"
      - "开放还是封闭：两个子类列表都不带「等」，而同一次修订在 CTC-R004 里特意加了「等」表示开放。按本技能自身的这一对照，CTC-R003 的子类像是封闭的，即只有这五种口语腔；但「译文腔」「口语腔」作为中心词又像开放类别。直接后果是「搞定」「挺快」「超稳」这类口语化程度词和网络用语不属于五个子类中的任何一个：按封闭读法应漏过，按开放读法应改写。"
      - "「客套与请托」：「请托」字面含「请」。面向用户的「请输入」「请稍后重试」是中文界面文案的常规礼貌祈使，不是托人办事，但措辞没有把它排除，模型可能把「请」归入「请托」。这会与 CTC-S003 正面冲突：S003 把「请」列为请求类言语行为的标记（「请→须」违规）。"
      - "「把读者当作谈话对象的引导」的修饰结合域有两种读法：(a) 中心语是「引导」，只指「这个工具可以帮你」「接下来我们来看」这类导览或推销式句子；(b) 泛指任何把读者当作谈话对象的写法，即一切第二人称。另有读者身份问题：系统提示的读者就是 agent，「你是…」「你必须…」是对 agent 的指令，按 (b) 读也会触发。读法 (b) 与 §2 第 5 层的「人称与语态偏好」重叠。"
      - "「语气词」：按汉语语法的常规分类，句末的「了」「吗」「呢」「吧」「的」都是语气词。括注只举「啊」「嘛」，触发条件没有区分承载语义的语气词（「吗」表疑问、「吧」表揣测、句末「了」表状态变化）与纯语气的语气词。「在语义完全不变的前提下」理论上兜得住，但前提是模型先认出这些词承载语义。"
      - "「表示强度的「千万」」有两处可疑。(1)「表示强度的」本意应是排除数词「千万」（「千万级数据」），但它也可被读成：还有不表示强度、因而算口语腔的副词「千万」；而副词「千万」只有叮嘱强调一义。(2) 边界句只点名「千万」一个词，容易引出反面推论：「一定要」「务必」「可别」「记得」都不在豁免之列。"
      - "「改用中文技术写作的常规表达」：对感叹词和纯语气词，最小改动通常是删除，并没有可以「改用」的常规对应物；「改用」一词可能促使模型去找替代说法（见下文「哎呀」例）。"
      - "名称「反译文腔与口语腔」：「反」管到两项并列是唯一自然的读法，不构成实际歧义。"
    over_control_risk:
      - target_text: "请求过于频繁，请稍后重试。"
        risk: "把「请」归入「请托」后删去，得到「请求过于频繁，稍后重试」：请求式祈使变成命令式，与 CTC-S003 点名的「请」相冲突。错误信息与状态提示在 v2 中都属 strict，正是「请」最密集的文体。"
      - target_text: "你是代码审查助手。用户提交 diff 后，你先运行 `lint`，再逐条给出意见。"
        risk: "按读法 (b) 删去或改写「你」。这里「用户」与「你」两个执行者交替出现，删「你」会让执行者无法定位；CTC-A001 会拦住，但这次改动本身是 CTC-R003 引起的。把「你」改成「助手」或「模型」则换了指称，还可能把对 agent 的角色指派改成第三人称描述。"
      - target_text: "`keepalive` 参数使客户端能够复用连接。"
        risk: "被当作「使用户能够…」型英语句式残留后，最顺手的改法是「让客户端可以复用连接」。「让」更口语，与同一条规则的口语腔要求相抵；「能够」（能力）改为「可以」（也可读作许可），有情态漂移的风险。而「使…能够」本是规范的书面中文，本不必改。"
      - target_text: "是证书过期了吧？先看一下 `notAfter` 字段。"
        risk: "「吧」表揣测。作为语气词删去后成了「是证书过期了」，揣测变成断言，可能原因变成确定原因（CTC-S003 认识强度、CTC-S006）。"
      - target_text: "重启后就不报错了。"
        risk: "句末「了」表状态变化：之前报错，重启后不再报错，这句记录的是修复效果。作为语气词删去后成了「重启后不报错」，变成泛泛的行为描述，丢掉了「此前报错」这层信息。"
      - target_text: "一定要先备份再执行 `DROP TABLE`。"
        risk: "豁免只点名「千万」，「一定要」可能被当作口语腔，改成本技能自己的规范词「应先备份」。「一定要」≈「必须」，改为「应」就把道义强度从硬性要求降为可推翻的默认要求（CTC-S003 明列「必须→应」违规）。§7 对翻译禁止归一到本技能自身的规范词表，对改写没有同样的明文。"
      - target_text: "长按电源键 3 秒强制关机；按一下电源键进入休眠。"
        risk: "「一下」是唯一点名的口语填充，但这里它表示短按，与「长按」对立，区分的是两个不同动作。删去后「按电源键进入休眠」不再区分短按与长按，造成操作未定。"
      - target_text: "运行 `make` 就行。"
        risk: "两个方向的风险。示例只有「一下」，模型可能漏掉「就行」「就好」这类口语成分（漏改）；若识别出来却直接删去，「就行」承载的「只需此步、无须其他」的充分性断言就丢了（CTC-S001），正确改法是「只需运行 `make`」。同类还有「失败的话重试 3 次」：「的话」是句中唯一的条件标记，只能换成「失败时」，不能删（CTC-L001）。"
      - target_text: "哎呀，出错了！请刷新页面。"
        risk: "「改用常规表达」可能把感叹改写成「警告：发生错误。」，凭空加了告警标签并抬高严重程度（CTC-S002 禁止补写来源没有的告警）。正确的最小改动是删去感叹。"
      - target_text: "搞定！备份已上传到 `s3://backup/2026-10-14/`。"
        risk: "产品刻意的轻松口吻在状态提示里（v2 中属 strict）会被 CTC-R003 洗掉。§1 列出的「调用方给定的上下文」只有术语约定、已授权的改动和长度上限，调用方没有声明「保留产品口吻」的明确通道；人称与语态偏好又在第 5 层，低于 CTC-R003 所在的第 4 层。另一方面「搞定」不属于五个子类中的任何一个：按封闭读法，同一个产品里「哎呀」被改而「搞定」不改，输出口吻不一致。"
    equivalent_rewording: "文本含译文腔或口语腔时，在语义完全不变的前提下改用中文技术写作的常规表达。这里的译文腔指无必要的被动、名词化赘语（进行／作出／予以 + 动词）、过长的「的」字串、英语句式残留（「由于…的事实」「使用户能够…」）与直译连接词；口语腔指客套与请托（「麻烦您」）、语气词（「啊」「嘛」）、情绪化感叹（「哎呀！」）、口语填充词（「一下」）与把读者当作谈话对象的引导（「这个工具可以帮你」）。被动用于突出受事、施事未知或施事已在同句给出时是自然的技术表述。表示强度的「千万」不是口语腔。本规则永远低于 S 族。"
    rewording_is_equivalent_because: "v2 的两对破折号是解释性的同位插入语，作用等于「指」。改写只把它们移出条件句、单列为两个定义句，使「文本含…时」的主干缩到十余字。子类、引例、要求、两条边界句和「低于 S 族」的位次都不变。「指」后既没有加「等」也没有加「仅」，所以开放还是封闭的问题与 v2 一样未决，需另行决定（见 ambiguity 第 2 条），本改写不替作者消解。「口语填充词」只补了中心语「词」，所指与「口语填充」相同；末项前的「、」改为「与」只是列举收尾的写法。"
    normative_vocabulary: ok
    normative_vocabulary_note: "新句不含必须、应、可以、不得；两条边界句都是判断句，与基线已有的被动边界句一致。自宿主方面没有口语腔，只有「口语填充」略带直译痕迹（见 quotes）。"
