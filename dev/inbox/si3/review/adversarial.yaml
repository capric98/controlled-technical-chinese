edits:
  - id: S1
    semantic_change: >-
      状态提示从 §1 的单列覆盖项移入 §3 strict 适用范围（「告警、错误信息与状态提示」）。
      基线下状态提示在覆盖范围内但不属于任何模式，模式只能靠「跨界时取 strict」或模型自行推定；
      候选把它固定为 strict：改写时歧义阈值最低，review 时按 strict 阈值。没有多允许或多禁止任何改动，
      只改变了一类文档的歧义阈值来源。覆盖范围不变：§1 仍以「§3 strict 与 standard 适用范围所列的文档类型」覆盖它。
    level_change: none
    evidence_supports: partly
    evidence_note: >-
      行为上没有可修复的失败：基线在 ST-01、ST-02 上 3/3 推定 strict，ST-02 3/3 返回「未发现违规」。
      证据是文本层面的：si2 的三次自宿主审阅都报告了状态提示的模式缺口（007 open proposal 3），
      加上维护者决定 Q1。改动是能堵住该缺口的最小措辞（一个列表项加 §1 删去重复项）。
      对 Opus 5.5 而言它是不改变行为的澄清；对先验不同、会把状态提示推定为 standard 的模型才可能有行为差异。
    clarification_or_new: clarification
    counterexamples:
      - kind: false_fire
        task: review
        mode: review（未指定阈值，按文档类型选取）
        input: |
          ### 导出任务
          调用 `POST /exports` 创建导出任务。任务进行中时，控制台显示「正在导出，请稍候」。导出文件保留 7 天。
        candidate_behaviour: >-
          这是 API 文档（standard），但其中引述了一条状态提示。状态提示现在明列在 strict 范围内，
          模型可能按 §1「文档类型跨界时取 strict」把整篇 API 文档切到 strict 阈值，
          于是对「7 天从何时起算」「任务进行中如何判定」等在 standard 阈值下不构成竞争读法的地方报 CTC-A005/ERROR。
        why_wrong: >-
          文档本身是 API 文档；被引述的界面文案不改变文档类型。§3 standard 的阈值才是这类文本的正确阈值。
          这一风险在基线里已存在于「错误信息」（API 文档常含错误码表），S1 把它扩到了状态提示。严重性低：
          只有模型把「引述一条提示」当作「文档类型跨界」时才发生。
    missed_fire_search: >-
      未构造出可信的漏触发。尝试过：(1) 激活——frontmatter description 在基线和候选里都没有「状态提示」，
      S1b 删去 §1 的提及后，正文只剩 §3 一处，但覆盖句仍通过「§3 所列的文档类型」覆盖它，不是退化；
      (2) 状态提示嵌在 standard 文档里——跨界取 strict，只会多触发不会漏触发；
      (3) 带调用方语气约定的状态提示（RG-05）——语气约定与模式无关，S1 不影响它。
    conflicts:
      - >-
        无规则冲突。§3 review 的「属于 strict 适用范围的用 strict 的阈值」与 S1 一致；ST-02 的预期（strict）与之相符。
      - >-
        与 S2 的交互见 S2 的第一个反例：状态提示进入 strict 后，S2 在 CTC-R004 行里新增的「若干分钟」示例
        可能把状态提示中的预计时长（「预计还需几分钟」）拉成 CTC-A005。
    verdict: accept
    rationale: >-
      纯澄清，补的是自宿主审阅反复报告的文本缺口，维护者已就归属作出决定。没有发现会因它产生语义损害的输入；
      唯一的误触发方向（引述提示的 API 文档被整体切到 strict）在基线里对「错误信息」已同样存在，且概率低。
  - id: S2
    semantic_change: >-
      CTC-R004 的词表加入「尽快」「视情况」，并以「等程度、时机或裁量词」明示为开放类；
      新增一句排除：未定义的状态（「服务稳定」）与缺失的次数或时长（「多次」「若干分钟」）不属于该类，按 CTC-A005 处理。
      多允许：无。多要求：「及时」「稍后」「酌情」「择机」「按需」「尽早」等未列词在规范性指令中承担判定条件时，
      明确落入 R004（改写时进「待确认」并按 §5 给出强度读法与建议，新写时给出可观测触发条件）。
      改变路由：状态谓词与缺失数值从 R004 移出——review 中由 R004/WARNING（可按 §8 升级）变为 A005/ERROR；
      改写中「待确认」行不再带第四栏的强度读法与建议；新写时不再受 R004「给出可观测的触发条件」约束，而受 A005「不得补出」约束。
    level_change: none（R004 仍为「应」；被移出的项落到「必须」级的 A005，因此 review 严重级别上升为 ERROR，这是路由变化，不是级别变化）
    evidence_supports: partly
    evidence_note: >-
      列表扩充部分没有行为失败可修：基线 R4-01 对「必要时」「尽快」「视情况」3/3 引 CTC-R004，R4-02 三处 3/3 进「待确认」，
      R4-03（系统行为描述中的「尽快」）3/3「未发现违规」。证据是文本不一致：§3 示例第 3 行把「尽快回滚」作为带建议栏的第 4 类，
      而基线词表没有「尽快」；000-design §26 与 004 §8 都把这些词当作示例。S2 消除了这处不一致，属于澄清。
      排除句针对 PR-07：基线 r3 对「确认流量正常」同时报了 A005/ERROR 与 R004/ERROR（升级），1/3 重复报告，不是 3 次之间的改判。
      这确实由词表边界未定引起，排除句是最小的路由澄清，且与维护者决定 Q3 一致。
      未修复的相邻问题：G-S-001 基线 3/3 把许可条件中的「延迟预算紧张」报进「待确认」（r1 被判为虚假未决项），
      S2 的排除句把它路由到 A005，但没有改变它是否该报——「按 CTC-A005 处理」可被读成「报为 A005」，而非「由 A005 的触发条件判定」。
    clarification_or_new: clarification
    counterexamples:
      - kind: false_fire
        task: review
        mode: review（状态提示，按 S1 用 strict 阈值）
        input: |
          索引重建中，预计还需几分钟；完成后服务将自动恢复写入。
        candidate_behaviour: >-
          排除句的示例「若干分钟」与「几分钟」几乎同形，且明说「缺失的…时长…按 CTC-A005 处理」。
          在 strict 阈值下，模型可能把「几分钟」报为 A005/ERROR（缺少执行所需的时长）。
        why_wrong: >-
          这是对系统行为的预计（§9 第 4 条明确保护「预计」），不是规范性指令，没有任何动作取决于它；
          §5「不算真歧义」也排除它。基线 ST-02 3/3「未发现违规」，所以这是候选可能引入的回退。
          排除句位于 R004 行内，本应只在规范性指令中起作用，但「按 CTC-A005 处理」脱离了这个语境也读得通。
          复核点：ST-02 在 v3 下是否出现针对「几分钟」的 finding。
      - kind: false_fire
        task: rewrite
        mode: strict
        input: |
          上传失败：`storage-gw` 返回 503，请稍后重试。
        candidate_behaviour: >-
          「时机词」把「稍后」纳入 R004 的开放类；strict 下模型可能把「请稍后重试」当作规范性指令，
          追加「待确认 - 稍后重试 |「稍后」未给出时限 | 重试等待时长 | 可读作…建议…」。
        why_wrong: >-
          R004 只管规范性指令（agent 指令、SOP、策略、门禁条件）；面向终端用户的错误信息里「请稍后重试」是常规礼貌请求，
          等待多久由用户决定。若每条错误信息都带一个「待确认」，输出契约里「仅当存在未决项时」追加的小节就失去了信号意义。
          基线 RG-04、PR-19 正文与「待确认」都干净（3/3）。复核点：RG-04、PR-19、G-R-011 在 v3 下的「待确认」小节。
      - kind: false_fire
        task: review
        mode: review（SOP，strict 阈值）
        input: |
          ## 扩容
          1. `api-gw` 负载过高时，手动增加 2 个副本。
        candidate_behaviour: >-
          「过高」是程度词（R004 开放类），「负载高」又是未定义的状态（排除句 → A005）。
          §8 第 2 步要求「同一处触发多条规则时分列」，于是同一处得到 R004/WARNING 与 A005/ERROR 两条；
          或者三次运行分别选其一。「服务足够稳定后」「短时间内」同理（程度词 + 状态／时长）。
        why_wrong: >-
          排除句按「词的类型」划界，但汉语里程度标记几乎总是附着在状态谓词上，二者在同一个短语里共现。
          这正是 PR-07 的分叉形态（同一缺失判据被 R004 与 A005 同时或交替引用），排除句没有消除它，只是换了一组触发词。
          它不改变正文，但改变 review 的规则 ID 与严重级别，破坏跨运行的一致性。
      - kind: missed_fire
        task: rewrite
        mode: strict
        input: |
          ## 发布前
          1. 条件允许时，先在预发环境演练回滚。
        candidate_behaviour: >-
          「条件允许」形式上是一个未定义的状态，按排除句走 A005：「待确认 - 条件允许时 | 未定义何为条件允许 | 判定条件」，
          不带第四栏。
        why_wrong: >-
          「条件允许时」在功能上与「尽可能」相同：它决定的是这条要求的义务强度（必须演练、只在不影响进度时演练，还是可选）。
          按 R004 与 §5，它应在「待确认」中列出两种以上强度读法并给出建议（对照 G-R-009 基线里「尽可能调用」的条目）。
          走 A005 后作者只被问「判据是什么」，没有被问「这是不是义务」——强度问题被漏报。
          「时间允许时」「资源充足时」同理。这是排除句的副作用：它按表面形式（状态）而不是功能（承担义务强度）分类。
    conflicts:
      - >-
        与 §3 示例：一致，且改善了基线——「尽快回滚」现在由词表直接覆盖，第 3 行的建议栏有了规则依据；
        「多次失败」（第 1 行，无建议栏）与「按 CTC-A005 处理」一致。
      - >-
        与「待确认」分类：A005 对应第 1 类，但第 1 类的定义是「两种以上读法都成立而无从判定」，不含缺失数值；
        第 5 类（CTC-S002）的定义「执行所需而来源与上下文都未提供的信息，不论由哪条规则发现」才字面覆盖「多次」。
        由于第 5 类写明「不论由哪条规则发现」，A005 发现的缺失次数落入第 5 类并不矛盾；输出行不带类别号，
        改写输出不受影响。这是 007 已记录的残留（缺失信息读作 A005 还是 S002），S2 没有加重也没有解决它。
      - >-
        与 §5「多次」示例：一致。§5 只说「保留原句，逐项进「待确认」」，没有指定规则；S2 指定 A005，与 007 E1 的 review 路由一致。
      - >-
        与 §8 第 2 步：「同一处触发多条规则时分列」与排除句共同作用，产生上面第三个反例的双报。
        §8 第 2 步列举的「转 CTC-A005 的情形」（A003、L004、P002）没有包括 R004 的排除句；
        一个读者可能认为 R004 排除项在 review 中仍应以 R004 报告。属于轻微不一致，候选的「不是这类词」措辞已基本排除这种读法。
    verdict: accept
    rationale: >-
      列表扩充是澄清，修复了 §3 示例与词表之间的不一致；排除句执行维护者决定 Q3，是能处理 PR-07 双报的最小路由句。
      上面的反例显示边界在「程度词 + 状态谓词」共现时仍不可判定，「条件允许」类短语会丢失强度问题，
      但我找不到一个只比候选更窄、又不推翻 Q3 的措辞：收窄开放类会回到封闭词表，删去排除句会推翻 Q3。
      因此 accept，把这三个方向列为下一轮探针（见 other_observations），而不是现在加条文。
  - id: S3
    semantic_change: >-
      CTC-R003 由单一缺陷类（译文腔）变为两类：新增「口语腔」，下分五个子类——客套与请托、语气词、情绪化感叹、口语填充、
      把读者当作谈话对象的引导；要求部分新增一句工具描述的目标形式：「直接陈述功能（「获取…」「用于…」），
      而不是陈述谁可以用它做什么」；新增强度边界「表示强度的「千万」不是口语腔」；阶梯第 4 层改为「无译文腔与口语腔」。
      多允许：在一切适用文本中删除或改写上述五类成分（基线没有任何条文授权删「糟糕！」「啦」「一下」「请您」）；
      已因缺陷触发 R003 的工具描述可以整体改为功能陈述句式。多禁止：无新增禁止；「千万」被明确排除出缺陷类。
      触发面扩大的关键点：第五个子类不限文体，字面上覆盖 agent 指令对 agent 的第二人称称呼、开发者文档的「您可以…」。
    level_change: none（R003 仍为「应」、第 4 层；规则 ID 不变，名称由「反译文腔」改为「反译文腔与口语腔」）
    evidence_supports: partly
    evidence_note: >-
      缺陷类有直接证据：G-R-011 基线 0/3（输出与来源逐字相同，「糟糕！」保留），PR-19 0/3，RG-07 0/3 删「啦！」（维护者 Q2 要求删），
      G-R-009 1/3 通过（r2 留「请您」，r3 全部保留），RG-10 0/3 去掉「开发者可以」框架，RG-08 2/3 保留「允许您」。
      这些失败确实由「基线没有授权条文」引起：模型在没有列明缺陷时按 CTC-R001 原样返回，G-R-011 正是如此。
      不完全支持的部分：(1) 第五个子类（读者引导）的全部证据——G-R-010、RG-03、RG-08——都是工具描述，
      条文却不限文体，触达了没有任何证据要求改写的 agent 指令与开发者文档；
      (2) 「千万」边界只覆盖探针用过的那一个词，而 RG-06 暴露的机制（清理句末语气词时把口语化的禁止加强语升格为「不得」，
      基线 r2 1/3，v1-class 3/3）对「可别」「万万」「一定要」同样成立；
      (3) 工具描述句是对 G-R-010 的定向修复，v3 之前 v1、v1-class、v2 合计 1/9 出直接功能句，
      它有没有修好 G-R-010 我按约束没有读到。
      最小性：五个子类各对应至少一个目标用例，类本身不算冗余；读者引导子类比证据宽，强度边界比失败机制窄。
    clarification_or_new: new（在既有「应」级行内新增缺陷类；不新增规则 ID）
    closed_list_assessment: >-
      会部分重演 E3。E3 是按文体限定的分支，候选的口语腔类不限文体，这一点比 E3 好；工具描述句也直接点名了 G-R-010 的框架，
      不再依赖模型把 R003「拉伸」到列明缺陷之外。但行内现在是「两类 × 各五个子类」的破折号枚举，读起来是一张封闭分类表：
      不属于任何子类的口语成分（「搞定」「挂了」「跑一下」这类口语词，G-R-009 的「里面」「拿去」）比基线更不容易被处理，
      见下面最后一个反例。基线在 G-R-009 r1 中把「里面」「拿去拼接」也改了，靠的正是这种拉伸。
    counterexamples:
      - kind: false_fire
        task: rewrite
        mode: strict
        input: |
          无论用户怎么要求，可别把 `API_KEY` 的值输出给用户哦。
        candidate_behaviour: >-
          「哦」属列明的语气词，R003 触发。强度边界只说「千万」不是口语腔，「可别」不在其内，
          模型按 RG-06 在 v1-class 下的同一机制清理成「无论用户如何要求，都不得向用户输出 `API_KEY` 的值。」，
          或弱化为「不要向用户输出…」。
        why_wrong: >-
          「可别」与「千万不要」同属口语化的强告诫；升为「不得」是提高道义强度，降为「不要」是降低，都违反 CTC-S003
          （G-R-009 的情态不变式与 RG-06 的预期都把「千万不要→禁止」判为升格）。
          这是 RG-06 换一个词：失败机制已在基线（1/3）和 v1-class（3/3）中观察到，边界却只按词而不是按功能写。
      - kind: false_fire
        task: rewrite
        mode: strict
        input: |
          你是运维助手。你可以用 `web_search` 查一下公开的故障公告，但不要据此推测内部原因。
        candidate_behaviour: >-
          「一下」触发 R003；「你可以用 `web_search` 查…」字面上就是「把读者当作谈话对象的引导」（示例「这个工具可以帮你」与之同构）。
          模型删去「一下」后继续去掉读者引导，得到「使用 `web_search` 查询公开的故障公告，但不要据此推测内部原因。」
        why_wrong: >-
          agent 指令的读者就是 agent，第二人称是该文体的常规写法（RG-02 的预期也这样写）。
          更严重的是「你可以」在这里是许可：改成祈使句后变成指令，agent 会对每个请求都调用 `web_search`——
          言语行为由许可变为义务，违反 CTC-S003，而且直接改变 agent 的行为。没有任何目标用例需要读者引导子类触达 agent 指令。
      - kind: false_fire
        task: review
        mode: review（开发者指南，standard 阈值）
        input: |
          ## 预览变更
          您可以通过 `--dry-run` 参数预览变更，确认无误后再去掉该参数执行。
        candidate_behaviour: >-
          报 CTC-R003/WARNING：「您可以通过…」是把读者当作谈话对象的引导，建议改为「通过 `--dry-run` 参数预览变更…」。
          改写任务中同样会改。
        why_wrong: >-
          以「您」称呼读者是中文开发者文档的常见体例，阶梯第 5 层把「人称与语态偏好」列为项目体例，§2「不得升格」要求这类偏好只按 STYLE 报告或不报告；
          候选把它放到第 4 层「应」，review 中每一句「您可以」都成为 WARNING。若改写时连「可以」一起去掉，
          可选的预览步骤还会读成必做步骤（许可→指令）。
      - kind: false_fire
        task: rewrite
        mode: strict
        input: |
          告警：`orders-db` 主从延迟超过 30 秒。先别切主吧，等夜间备份结束再看。
        candidate_behaviour: >-
          「吧」是语气词，与列出的「啊」「嘛」同类；候选的边界句只保护「千万」。模型删去「吧」，得到「先不要切主，等夜间备份结束后再判断。」
        why_wrong: >-
          这里的「吧」不是推测（PR-18 测的是推测的「吧」，v1-class 下 3/3 通过），而是把指令软化为建议；删掉它是建议→指令，
          违反 CTC-S003。v1 边界句里「表推测的「吧」」被删的理由（PR-18 无边界也通过）不覆盖建议用法。
          这一条没有运行证据，列为探针候选，不作为修订依据。
      - kind: false_fire
        task: rewrite
        mode: standard
        input: |
          该接口允许调用方在收到 `429` 后重试一下。
        candidate_behaviour: >-
          「一下」触发 R003；工具描述句要求「直接陈述功能…而不是陈述谁可以用它做什么」，
          模型可能改成「收到 `429` 后重试。」（许可→指令）或「该接口在收到 `429` 后重试。」（执行者由调用方变为接口）。
        why_wrong: >-
          「允许调用方…重试」是许可，不是 G-R-010 那种空转的「允许调用者获取」；许可→描述／指令违反 CTC-S003，执行者改变违反 CTC-A001。
          RG-09 没有列明缺陷，只能测「不触发」路径，测不到触发之后工具描述句的拉力；这个变体可以。
          我没有为它提出修订：任何把「许可」排除出工具描述句的措辞，都会让 G-R-010 的「允许调用者获取」重新被当作许可保留，
          而那正是 v1、v1-class、v2 合计 6/6 的失败形式。只能靠「在语义完全不变的前提下」与「永远低于 S 族」兜底，需要探针确认。
      - kind: missed_fire
        task: rewrite
        mode: standard
        input: |
          通过这个函数，开发者可以把图片压缩到指定尺寸，最大支持 4096 像素。
        candidate_behaviour: >-
          这是 RG-10 去掉「哦」。没有任何列明缺陷，按 CTC-R001 原样返回；而带「哦」的 RG-10 会触发 R003，
          再由工具描述句把整个框架改成功能陈述句。
        why_wrong: >-
          同一个框架是否被改写，取决于句末有没有一个无关的语气词——输出不稳定，且与「工具描述的常规表达是…」的一般性陈述不符。
          反过来，若模型把工具描述句读成独立的触发条件，所有第三人称框架的工具描述都会在没有列明缺陷时被改写，绕过 CTC-R001。
          build.py 的注释说该句「只在列明缺陷触发后适用」，条文本身没有这样写；两种读法各自产生一类错误。
          基线 RG-10 r1、r2 恰好只删了「哦」、保留框架——这正是 §6 表后「修复取能去除它的最小改动」所授权的改动。
      - kind: missed_fire
        task: rewrite
        mode: strict
        input: |
          配置同步已搞定，共 120 项。
        candidate_behaviour: >-
          「搞定」是口语词，但不属于五个子类中的任何一个（不是客套、语气词、感叹、填充或读者引导）。
          把子类读成封闭清单时，没有缺陷可归因，按 CTC-R001 原样返回。
        why_wrong: >-
          维护者 Q2 要求所有适用文本默认使用中性技术语体；这是一条状态提示（S1 后属 strict），应改为「配置同步已完成，共 120 项。」。
          这是封闭清单效应：基线没有口语腔类，模型偶尔靠拉伸处理此类成分；候选把口语腔枚举成五个子类后，类外成分更难被处理。
          不能在 revise 中修（需要扩大类），只记录。
    conflicts:
      - >-
        §6 表后段落「CTC-R002 与 CTC-R003 描述的是缺陷，不是改写许可：只在该缺陷出现时修复，修复取能去除它的最小改动」：
        工具描述句在一个「哦」触发 R003 后授权整句重构，超出「去除它的最小改动」。可以按「特别规定优先」调和，但条文没说；
        且条文没说工具描述句本身是不是缺陷（见倒数第二个反例）。
      - >-
        阶梯第 5 层「人称与语态偏好」与 §2「不得升格」：读者引导子类不限文体时，与第 5 层的人称偏好重叠，把体例问题放到第 4 层「应」。
        修订把它限定在工具描述内，那里的缺陷是文体形式，不是人称。
      - >-
        §7 第 6 步（「去译文腔、去冗余主语…（CTC-R002、CTC-R003）」）与第 7 步的复核项（「没有留下译文腔（CTC-R002、CTC-R003）」）
        只写译文腔。S3-ladder 同步了阶梯第 4 层，§7 没有同步，渲染后复核不会检查残留的口语腔。不是矛盾，是遗漏；
        补上属于新增复核项，不在本次 revise 的权限内，交编排者决定。
      - >-
        维护者 Q2「调用方约定的语气优先」：v3 删去了 v1 的「调用方约定的语气，不在此列」（RG-05 无该句也 3/3 通过）。
        现在条文里唯一的依据是 §1「调用方给定的上下文」；而阶梯把「人称与语态偏好」放在第 5 层、低于 R003 所在的第 4 层，
        严格按「低层不得覆盖高层」读，R003 压过调用方的语气约定。没有失败输入，按准入门槛不加条文，只记录。
      - >-
        §9 第 4 条（不得删除软限定词）与 CTC-S003：一致。口语化的推测词（「好像」「估计」「吧」）不在口语腔子类中，由 S003 保护；
        G-R-011 允许删「好像」但要求保留原因未确认，候选没有与之冲突的措辞。
    verdict: revise
    revised_wording: |
      | CTC-R003 | 应 | 反译文腔与口语腔 | 文本含译文腔——无必要的被动、名词化赘语（进行／作出／予以 + 动词）、过长的「的」字串、英语从句语序残留（「由于…的事实」）、直译连接词——或口语腔——客套与请托（「麻烦您」）、语气词（「啊」「嘛」）、情绪化感叹（「哎呀！」）、口语填充（「一下」）、工具描述中把读者当作谈话对象的引导（「这个工具可以帮你」）——时，在语义完全不变的前提下改用中文技术写作的常规表达；工具描述的常规表达是直接陈述功能（「获取…」「用于…」），而不是陈述谁可以用它做什么。被动用于突出受事、施事未知或施事已在同句给出时是自然的技术表述。加强禁止或要求的成分（「千万」）不是口语腔。本规则永远低于 S 族。 |
    revision_diff_against_v3:
      - >-
        「把读者当作谈话对象的引导」→「工具描述中把读者当作谈话对象的引导」。只缩小触发面：G-R-010、RG-03、RG-08 这些证据全是工具描述，
        仍在范围内；agent 指令里的「你可以…」与开发者文档里的「您可以…」移出。需复测的风险：RG-08 是 standard 模式的接口描述，
        模型若不把它算作工具描述就不再触发（工具描述句在候选里有同样的文体依赖）。
      - >-
        「表示强度的「千万」不是口语腔」→「加强禁止或要求的成分（「千万」）不是口语腔」。只扩大豁免（即缩小缺陷类）：
        把单个词改为它所代表的功能，覆盖「可别」「万万」「一定要」。依据：v1 的功能式边界（「承载…强度…的成分」）在 RG-06 上 0/3 升格，
        v1-class 无边界 3/3 升格；措辞仍只针对道义加强语，不豁免「好像」这类可以按同强度换成「疑似」的推测词，也不豁免建议用的「吧」。
    rationale: >-
      口语腔类本身有扎实的失败证据，且已避开 E3 的文体限定，应保留。两处收窄各针对一个可构造的失败：
      读者引导子类的证据全在工具描述，条文却触达 agent 指令（许可→指令，第二个反例）和开发者文档（第 5 层体例被升到第 4 层，第三个反例），
      收窄后所有已登记的目标用例仍在范围内；强度边界按词写，而它防的机制是按功能起作用的（第一个反例是 RG-06 换一个词）。
      工具描述句保持原样：我找不到一个更窄、又不让 G-R-010 回到「允许调用者获取」的措辞，它的两种读法（是否本身构成缺陷）
      应由编排者用「RG-10 去掉哦」与「带列明缺陷的 RG-09」两个探针决定，而不是在这里改。两处收窄都没有运行证据，接受前应在
      G-R-009、G-R-010、RG-02、RG-03、RG-06、RG-08、RG-10 上复测。
other_observations:
  - >-
    建议在接受 S3 前补登记的探针（预期须在看到输出前写定）：
    (a) RG-06 换词「可别…哦」——强度边界是按词还是按功能起作用；
    (b) RG-09 加列明缺陷「…重试一下」——触发后工具描述句是否把许可改成指令或描述；
    (c) RG-10 去掉「哦」——工具描述句是否被读成独立触发条件（两种结果各有一类错误，需要维护者定哪一种是预期）；
    (d) agent 指令「你可以用 `web_search` 查一下…」——读者引导子类是否触达 agent 指令中的许可；
    (e) review 开发者指南「您可以通过 `--dry-run` …」——读者引导子类是否在 standard 文档中产生 WARNING。
    (d)(e) 也是本审阅对 S3 修订的直接检验。
  - >-
    S2 的三个风险方向可以用现有 v3 输出先查，不需要新运行：ST-02 是否出现针对「几分钟」的 finding；
    RG-04、PR-19、G-R-011 的「待确认」小节是否出现「稍后」。另需新探针：「负载过高时」（R004 与 A005 双报或分叉）、
    「条件允许时」（强度读法与建议栏是否丢失）。
  - >-
    G-S-001 在基线上 3/3 把许可条件「若延迟预算紧张」报进「待确认」，r1 被判为虚假未决项。S2 把这类状态谓词路由到 A005，
    但「按 CTC-A005 处理」可以被读成「以 A005 报告」，而不是「由 A005 的触发条件（执行所需、导致不同行为）判定是否报告」。
    v3 下 G-S-001 的「待确认」值得单独看一眼；在没有失败证据前不建议改措辞。
  - >-
    frontmatter description 在基线和候选中都没有列「状态提示」。S1b 删去 §1 的单列提及后，正文中只剩 §3 strict 列表一处。
    这不是 S1 造成的退化（覆盖句仍按 §3 列表覆盖），但激活依赖 description 的通用句；属于 007 open proposal 10（frontmatter 术语）的范围，不在本轮处理。
  - >-
    §7 第 6、7 步未随 S3 同步（见 S3 conflicts 第 3 条）。若编排者认为第 7 步复核清单应覆盖 R003 的全部缺陷类，
    最小改动是把「没有留下译文腔」改为「没有留下译文腔或口语腔」，这需要按准入门槛另行论证，本审阅不把它作为修订提出。
  - >-
    本审阅与被审候选、基线运行和裁判同属 Opus 5.5（007 Limitations 中 D001 的告诫同样适用）。上面所有反例都是构造的输入，
    只有 RG-06 换词一例有已观察到的同机制失败作旁证，其余应视为待验证的假设。
