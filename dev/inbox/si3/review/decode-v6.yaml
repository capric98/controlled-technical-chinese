reviewer: cold-decoder
model: claude-opus-5-5
files_read:
  - dev/prompts/si3-decode-v6.md
  - dev/inbox/si3/cand/v6/SKILL.md
probes:
  - probe: 1 CTC-R003 全文
    level: 应（review 中为 WARNING，按 §8 唯一升级条款可报 ERROR）；第 4 层，条文写「永远低于 S 族」，按 §2 层级同样低于 L 族（第 1 层）与 A、P 族（第 2 层）
    scope: 全部任务（改写、翻译、新写、审阅）与全部三种模式；CTC 适用的全部文档类型
    trigger: 文本含译文腔或口语腔。按条文，两者由冒号后的类别清单界定；清单无「等」字（对照 CTC-R004 的清单明确以「等」收尾），故最自然的读法是类别封闭、括注是类内示例
    requires: 在语义完全不变的前提下改用中文技术写作的常规表达；按 §6 末段，只在缺陷出现时修复，取能去除缺陷的最小改动；去缺陷时工具描述改为直接陈述功能（「获取…」「用于…」）；去口语腔时口语禁止保留原词或改作「切勿」
    prohibits: 重写不含缺陷的文本（§6 末段、CTC-R001）；修复工具描述时以使用者作主语（「调用者可以…」）；把「千万不要」「可别」类口语禁止改作「不得」「禁止」；以去腔为名改变任何 S 族不变量
    exceptions: 被动用于突出受事、施事未知或施事已在同句给出时不是缺陷；口语禁止可以保留原词
    fork: yes
    readings:
      - id: A1
        reading: 类别封闭、实例开放：五类译文腔与五类口语腔是定义性清单，括注只是各类的示例（「哦」属语气词，「一下」属口语填充）；不落入任何类别的口语词或翻译痕迹（「跑」「将会」「这个」）不触发
        behavior: 「跑脚本」「我们将会…」原样保留；CTC-R001 不允许以 CTC-R003 归因改动它们
      - id: A2
        reading: 开放概念：「译文腔」「口语腔」取通常含义，冒号后只是举例
        behavior: 「跑」改「运行」、删「将会」、「这个」改「该」等，归因仍填 CTC-R003；改动面明显扩大，且可能触碰时态与情态（S003）
      - id: B1
        reading: 修复形式：「去除这些缺陷时，工具描述改为直接陈述功能…」只在列明缺陷出现后适用，且只作用于被去除的那个缺陷所在的成分
        behavior: 不含列明缺陷的「开发者可以…」原样保留；含「一下」的工具描述只删「一下」，主语不动
      - id: B2
        reading: 独立触发：「不以使用者作句子主语（「调用者可以…」）」是工具描述的独立要求，以使用者作主语本身就是缺陷
        behavior: 「通过这个函数，开发者可以把图片压缩到指定尺寸」被改为「将图片压缩到指定尺寸」；与 CTC-A001（具名执行者须可定位）形成张力
      - id: B3
        reading: 整条重写：修复形式只在缺陷出现后适用，但一旦出现任一缺陷（哪怕只是「一下」），整条工具描述按修复形式重写
        behavior: 「该接口允许调用方在收到 429 后重试一下」连带去掉「调用方」主语；若读者不按 §2 让 CTC-A001、CTC-S003 压过本规则，会丢失执行者与许可的授予方
      - id: C1
        reading: 强度条款只管与示例同类的强调型口语禁止（千万不要、千万别、可别、可不要、绝对别）
        behavior: 这些词保留或改「切勿」；普通「别」「不要」不受本条款约束，按 CTC-S003 同强度处理
      - id: C2
        reading: 强度条款管全部口语禁止，含「别」「不要」「甭」
        behavior: 「别删这个文件」可能被改为「切勿删除…」，把普通禁止抬成强调禁止，反而违反 CTC-S003
    notes: 主读法为 A1、B1、C1。依据：A1 来自清单无「等」与 CTC-R001；B1 来自「去除这些缺陷时」的从属结构与 §6 末段「不含该缺陷的文本不授权重写」；C1 来自「这类」以强调型示例为锚、且「切勿」本身是强调型。强度条款隐含「千万不要」与「不得」「禁止」不同强度，细化了 CTC-S003 的「不得↔禁止同强度」。「可以保留原词」意味着去腔后仍允许留下口语禁止，与 §2 第 4 层「无口语腔」和 §7 第 7 步「没有留下口语腔」存在张力（见探针 4）。条文未说明「千万别」本身是否落入五类口语腔之一：它不是客套话、语气词、感叹、填充或引导，只在强度条款中被称作「口语禁止」。
  - probe: 2 四处改写的输出与规则 ID
    level: CTC-R003 应；同时受 CTC-S003、CTC-S004、CTC-S005、CTC-A001、CTC-L003、CTC-L004、CTC-R001（均为必须）约束；CTC-P005 应
    scope: (a)(b)(d) 由调用方指定为 standard（工具描述按 §3 本属 strict，但模式已给定）；(c) agent 指令为 strict。CTC-R003 与 S、L 族在两种模式下相同，模式只影响歧义阈值
    trigger: (a) 引导「这个工具可以帮你」与语气词「哦」；(b) 无列明缺陷；(c) 语气词「啊」，口语禁止「千万别」；(d) 口语填充「一下」
    requires: 删去列明缺陷；工具描述在去缺陷时改为直接陈述功能；保留数值、边界、情态、执行者、受保护标记与时序
    prohibits: 把「千万别」改作「不得」「禁止」；改动无列明缺陷的成分；为工具描述补写来源未给出的能力、上限或使用限制
    exceptions: 「千万别」可以保留原词；(b) 无缺陷时原样返回
    fork: yes
    readings:
      - id: A
        reading: 主读法（探针 1 的 A1、B1、C1），只删列明缺陷，修复形式只作用于被去除的缺陷
        behavior: 见 answer
      - id: B
        reading: 修复形式是工具描述的独立要求（探针 1 的 B2、B3）
        behavior: (b) 改为「将图片压缩到指定尺寸。」；(d) 可能被改为「收到 `429` 后可以重试。」，丢失执行者「调用方」与授予方「该接口」，违反 CTC-A001 与 CTC-S003，按 §2 应回退
      - id: C
        reading: 口语腔取开放概念（探针 1 的 A2）
        behavior: (a) 「将 CSV 转换为 JSON，文件最大 10 MB。」；(c) 「切勿在生产库上运行这个脚本。」（「跑」改「运行」）
      - id: D
        reading: 「千万别」在 R003 允许的两种形式间二选一
        behavior: (c) 输出「千万别…」或「切勿…」，两者都合规；若把 §7 第 7 步「没有留下口语腔」当作强制，则只剩「切勿」
      - id: E
        reading: CTC-P005 要求改写时把来源未给出的使用时机、能力、上限逐项列入「待确认」
        behavior: (a)(b)(d) 各附「待确认」（如 (b) 支持的格式与尺寸上限、(d) 重试次数与间隔）；主读法下这些描述已写出具体功能，不算「缺失的触发条件」，不附「待确认」
    answer:
      a: 「把 CSV 转成 JSON，文件最大 10 MB。」——CTC-R003（删引导「这个工具可以帮你」与语气词「哦」，改为直接陈述功能）、CTC-S004（10 MB 原样）、CTC-L004（「最大」含 10 MB，不改为「小于」）、CTC-S003（能力描述不变）、CTC-R001（「把…转成」不触发任何规则，不改）。无「待确认」。「用于把 CSV 转成 JSON…」同样合规
      b: 原样返回「通过这个函数，开发者可以把图片压缩到指定尺寸。」——CTC-R001；CTC-R003 不触发（无客套话、语气词、感叹、填充，也不是把读者当作谈话对象的「你」式引导；§6 末段不授权重写）；CTC-A001 也要求「开发者」仍可定位
      c: 「千万别在生产库上跑这个脚本。」（最小改动，只删语气词「啊」）；「切勿在生产库上跑这个脚本。」同样合规——CTC-R003（语气词；口语禁止保留原词或改「切勿」）、CTC-S003（禁止的强度与言语行为不变，不得改为「禁止」「不得」）、CTC-R001（「跑」「这个」不在列明类别，不改）。若上下文不能确定「这个脚本」所指，strict 下按 CTC-A005 进「待确认」
      d: 「该接口允许调用方在收到 `429` 后重试。」——CTC-R003（删口语填充「一下」）、CTC-S003（「允许」的许可不变）、CTC-A001（「调用方」保留）、CTC-S005（`429` 逐字符不变）、CTC-L003（「收到…后」时序不变）、CTC-R001（主语不动）
    notes: (c) 的规定输出是一个集合而非唯一字符串：R003 明文允许「保留原词或改作切勿」，两名读者会得到不同输出，可能需要指定优先项。(d) 的残余风险在于「一下」若被读作「一次」，删除就把次数从 1 变为未限定（CTC-S004）；R003 把「一下」列为口语填充示例，故按填充处理，standard 阈值下不构成竞争读法。(a) 的「文件」指输入还是输出，在 standard 阈值下不构成竞争读法；在 strict 阈值下可能需要按 CTC-A005 报告。(b) 在 B 读法下会出现 R003 修复形式与 CTC-A001 的冲突，条文没有直接说明「开发者」这类泛指调用者是否算「来源指明的执行者」。
  - probe: 3 §8 第 2 步，review 模式下 SOP 三处的规则 ID 与严重级别
    level: 「服务稳定」「多次」「升级」按 CTC-A005（必须 → ERROR）；「尽快」按 CTC-R004（应 → WARNING，可按唯一升级条款报 ERROR）
    scope: review 模式；SOP 属 strict 适用范围，用 strict 的歧义阈值（§3 review）
    trigger: 第 2 步的改道清单「CTC-R004 排除的未定义状态与次数、时长」→ 规则字段填 CTC-A005，不另列原规则；「尽快」是 CTC-R004 自身清单中的无判据词，不在改道清单内
    requires: 每条违规一个规则 ID；位置逐字引用；六个字段齐全；按严重级别排序
    prohibits: 对改道情形另列 CTC-R004；把改道后的 ERROR 算作升级；报告没有规则 ID 的 finding
    exceptions: 「应」级 finding 在「风险」字段指名操作者因此会做出的不同动作时可以报 ERROR；改道到 CTC-A005 的按 CTC-A005 定级，不算升级
    fork: yes
    readings:
      - id: A
        reading: 「尽快」只归 CTC-R004（专门规则吸收一般规则），按映射报 WARNING
        behavior: 一条 WARNING
      - id: B
        reading: 同 A，但「风险」字段写明「操作者可能推迟回滚而非立即回滚」，满足唯一升级条件
        behavior: 一条 ERROR；由于风险字段由审阅者自己撰写，且「尽快」天然对应「立即与否」的动作差异，升级条件几乎总能满足，是否升级取决于审阅者
      - id: C
        reading: 「尽快回滚」同时满足 CTC-A005 的字面触发（两种导致不同行为的读法，来源不足以判定；§3 示例亦写「可读作必须立即执行或应在窗口内执行」），按第 2 步「同一处触发多条规则时分列」
        behavior: CTC-R004 WARNING 与 CTC-A005 ERROR 各一条
      - id: D
        reading: 「多次失败后升级」的两个缺失项（次数、接收方）同属 CTC-A005、同一位置，第 2 步只规定多条规则分列，未规定同一规则多项缺失是否合并
        behavior: 一条或两条 CTC-A005 ERROR
    answer:
      服务稳定后关闭变更单: CTC-A005，ERROR。依据 CTC-R004「未定义的状态（「服务稳定」）……不是这类词，按 CTC-A005 处理」与 §8 第 2 步「CTC-R004 排除的未定义状态……finding 的规则字段填 CTC-A005，不另列原规则」；定级依据「按第 2 步转为 CTC-A005 的 finding 按 CTC-A005 定级，不算升级」与「必须 → ERROR」
      多次失败后升级: 「多次」为 CTC-A005，ERROR，依据 CTC-R004「未给出具体值的次数或时长（「多次」……）……按 CTC-A005 处理」与第 2 步同一改道句；「升级」缺接收方与方式，也是 CTC-A005，ERROR，依据 CTC-A005「缺少执行所需的……接收方」与 §5「「多次」与「升级」缺少执行所需的信息……逐项进「待确认」」。我倾向分列两条
      尽快回滚: CTC-R004，WARNING。依据 CTC-R004 清单中的「尽快」与 §8「应 → WARNING」；第 2 步改道清单不含 CTC-R004 自身的无判据词。若「风险」字段指名操作者会推迟回滚这一不同动作，可以按 ERROR 报告（§8 唯一升级条款）
    notes: 前两处没有分叉，条文写得直接。分叉集中在「尽快」：A、B 读法只差严重级别，这是条文给出的裁量；C 读法来自 CTC-A005 触发条件的字面覆盖，加上第 2 步「分列，不合并」，条文没有说 CTC-R004 的无判据词排除 CTC-A005。§5 第 4 段「按 CTC-R004 在待确认中提出」支持 A。
  - probe: 4 §7 第 6、7 步与 CTC-R001
    level: 流程步骤本身没有级别栏；第 7 步「任一项不成立，先修复再返回」是强制检查；所引 CTC-R001 为必须，CTC-R002、CTC-R003 为应
    scope: strict 与 standard 下的改写和翻译任务
    trigger: 第 6 步渲染之后、返回之前，每次都执行
    requires: 逐项核对语义骨架，没有不消歧的补写，没有留下译文腔或口语腔，没有无法归因的改动，并符合输出契约；不成立就先修复
    prohibits: 以「我没有改变语义」作结论；留下无法归因到规则 ID 的改动
    exceptions: 调用方已授权的改动不计为不成立
    fork: yes
    readings:
      - id: A
        reading: 第 7 步只是验证。「译文腔或口语腔」括注了 CTC-R002、CTC-R003，含义即这两条规则定义的缺陷；同一步还核对 CTC-R001；第 4 步「只改写被触发的部分」与 §6 末段也限定了改动面。因此第 7 步不授权改动不含列明缺陷的文本
        behavior: (b) 原样；R003 允许保留的「千万别」不算「留下口语腔」；「跑」不改
      - id: B
        reading: 第 7 步用的是通称「译文腔或口语腔」，配合「先修复再返回」，构成独立的完成标准；任何残留的口语或翻译痕迹都算不成立，修复时归因填 CTC-R003 即可满足同一步的 CTC-R001 核对
        behavior: 「跑」改「运行」；「千万别」被强制改「切勿」，把 R003 的「可以保留原词」收窄为必须改；未列明的翻译痕迹被改写
    answer: 主读法 A，不授权。第 7 步不新增改动许可，修复仍须归因到规则 ID，而 CTC-R003 只在列明缺陷出现时触发（§6 末段「不含该缺陷的文本不授权重写」）
    notes: B 读法要成立，须先接受探针 1 的 A2（开放清单）或认定保留的口语禁止仍是缺陷，所以本探针的分叉大体继承自探针 1。但有一处是第 7 步自身造成的：通称措辞加强制修复，会把 R003 明文允许保留的「千万别」变成必须改的项，直接影响探针 2(c) 的输出。第 6 步「恢复话题链与连动结构」中的「恢复」预设结构此前已被破坏，按 CTC-R002 只在输出中出现机械拆分时适用，不构成独立许可。
