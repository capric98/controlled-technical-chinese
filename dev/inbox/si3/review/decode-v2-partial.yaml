reviewer: cold-decoder
model: claude-opus-5-5
files_read:
  - dev/prompts/si3-decode.md
  - dev/inbox/si3/cand/v2/SKILL.md
probes:
  - probe: 1. CTC-R003（全文）
    level: |-
      应（§6 级别栏）。位于 §2 第 4 层。review 中映射为 WARNING；按 §8，风险字段指名操作者会做出的不同动作时「可以」按 ERROR 报告。条文自述「本规则永远低于 S 族」。
    scope: |-
      三种模式下都生效（§3「三种模式下全部规则按其级别生效」）。条文本身不限文档类型，凡 §1 覆盖的中文技术文本（改写、翻译、新写的输出，以及 review 的被审文本）。按 §6 表后段，只作用于确实含该缺陷的片段。
    trigger: |-
      文本含下列任一缺陷实例时：
      译文腔：(1) 无必要的被动；(2) 名词化赘语（进行／作出／予以 + 动词）；(3) 过长的「的」字串；(4) 英语句式残留（「由于…的事实」「使用户能够…」）；(5) 直译连接词。
      口语腔：(6) 客套与请托（「麻烦您」）；(7) 语气词（「啊」「嘛」）；(8) 情绪化感叹（「哎呀！」）；(9) 口语填充（「一下」）；(10) 把读者当作谈话对象的引导（「这个工具可以帮你」）。
    requires: |-
      在语义完全不变的前提下，把该缺陷实例改用中文技术写作的常规表达。按 §6 表后段，修复取能去除该缺陷的最小改动，并归因到 CTC-R003（CTC-R001）。「应」= 默认要求：缺陷出现时默认要修，除非被更高优先级（S 族、第 1–3 层）或明确边界推翻；所以在 strict／standard 改写中，修复是要求，不只是许可。
    prohibits: |-
      以修复为名改变任何语义不变量（S 族优先；§2 第 4 层低于第 1–3 层）；改写不含该缺陷的文本（表后段「不是改写许可」、CTC-R001）；超出去除缺陷所需的改动；把多处不相关改动混在一起；以「更专业」为由做等义替换（CTC-R001）。
    exceptions: |-
      被动用于突出受事、施事未知或施事已在同句给出时是自然表述，不算 (1)。表示强度的「千万」不是口语腔。与 S 族冲突时本规则让位。
    fork: yes
    readings:
      - id: F1-A
        reading: |-
          十个类别是封闭清单：条文列举后没有「等」，而 CTC-R004 明确用了「等」；表后段称其为「缺陷，不是改写许可」；CTC-R001 要求逐处归因；§2「阶梯不授权改动」排除了直接援引第 4 层的笼统描述。类内成员按类定义开放判定（「哦」「呢」「哈」都属语气词）。
        behavior: |-
          只改十类缺陷的实例。十类之外的口语词（「瞎猜」「别」「没」「过一会儿」「估计」「的时候」「转成」）保留，输出可能仍带口语色彩，例如 probe 5(b) 保留「千万别瞎猜」。
      - id: F1-B
        reading: |-
          十类只是举例：§2 第 4 层只给出「口语腔」「译文腔」这两个总称；括注本身就是示例；「改用中文技术写作的常规表达」是笼统目标。
        behavior: |-
          任何口语词都换成技术语体（别→不要，瞎猜→凭空猜测，过一会儿→稍后，没→未，估计→推测／可能）。改动更多，S 族风险也更大：「瞎猜→猜测」扩大了禁止范围（S001），「估计→可能」可能改变认识强度（S003）。这种读法还实际上掏空了 CTC-R001 对「更专业」式等义替换的禁止。
      - id: F2-A
        reading: |-
          凡语气词都属于第 (7) 类，都可以删。
        behavior: |-
          「先查一下 `price_api` 吧」→「先查 `price_api`」；「使用率 95% 了」→「使用率 95%」；「导出失败了呢」→「导出失败」。
      - id: F2-B
        reading: |-
          承载言语行为、道义或认识强度、体貌的语气词（祈使「吧」、推测「吧」、表变化的「了」）受 CTC-S003 保护，因为本规则低于 S 族、并以「语义完全不变」为前提；只有纯情绪的语气词（啊、嘛、哦、哈、呢）可以删。
        behavior: |-
          保留「吧」「了」，或把强度显式写出（「建议」「已」）；strict 下「V 吧」的道义强度可能被当作竞争读法，按 CTC-A005 进「待确认」。条文没有给出判断语气词何时「承载语义」的检验方法。
      - id: F3-A
        reading: |-
          「请」本身就是第 (6) 类「请托」的实例，因此触发本规则；但 CTC-S003（请→须 违规，言语行为类型不变）阻止改动它，结果是保留，同时在 review 中仍可能报出一条修不了的 R003 finding。「请您」中的「您」作为客套可以删。
        behavior: |-
          改写时删「您」、留「请」；review 可能对「请…」报 WARNING。
      - id: F3-B
        reading: |-
          「请托」只指口语化的请求套语（麻烦您、拜托、劳驾）；「请」「请您」是书面正式语体，根本不触发。
        behavior: |-
          保留「请您」；review 不报。
      - id: F4-A
        reading: |-
          本规则作用于文本中所有中文字符串，包括被引用、规定输出内容的字符串（agent 应回复的话、界面文案示例），因为 §4 明说界面文案不属于受保护标记。
        behavior: |-
          probe 5(c) 中「不客气呀～」被改成「不客气。」，agent 的实际输出随之改变。
      - id: F4-B
        reading: |-
          被引用、作为动作对象的字符串属于断言内容（CTC-S001 的「对象」，§2 第 1 层的执行者—动作—对象关系；也可视为 §4 的「取值」），本规则对它不适用，或者因低于 S 族而让位。
        behavior: |-
          5(c) 原样保留。
      - id: F5-A
        reading: |-
          第 (10) 类覆盖一切第二人称的谈话式框架，包括 agent 指令中的「你要记得」。
        behavior: |-
          删去「你要记得」。
      - id: F5-B
        reading: |-
          第 (10) 类只指把读者当作受益人或谈话对象的说法（「帮你」）；agent 指令以第二人称称呼 agent 是这一文体的常规祈使形式，而且「要」承载道义义务（S003）。
        behavior: |-
          保留「你要记得」，只删「哦」。
      - id: F6-A
        reading: |-
          「过长的「的」字串」「无必要的被动」「直译连接词」这几处没有可判定的阈值，读者 A 取较低阈值（两个「的」就算过长）。
        behavior: |-
          同一句话在 A、B 两种阈值下一个被改写、一个原样返回；review 中的 finding 数量也不同。
      - id: F6-B
        reading: |-
          读者 B 取较高阈值（三个以上「的」，或必须影响理解才算）。
        behavior: |-
          改动更少。
      - id: F7-A
        reading: |-
          修复范围限于缺陷所在的片段（表后段「修复取能去除它的最小改动」）。
        behavior: |-
          5(d)「这个工具可以帮你把 CSV 转成 JSON」→「这个工具可以把 CSV 转成 JSON」。
      - id: F7-B
        reading: |-
          规则一旦在某句触发，整句可以重写：§4「所在句子因规则触发而合法改写时，受保护标记可以随句子移动」预设了整句重写。
        behavior: |-
          5(d) 可能重写成「将 CSV 转换为 JSON。文件大小上限为 10 MB。」，改动远超缺陷本身，还可能丢掉「可以」（S003）。
    notes: |-
      最影响行为的是 F1 与 F2：封闭读法残留口语，开放读法冲击 S 族。F6 是自托管问题：条文自身用了「过长」「无必要」这类无判据词，而 CTC-R004 要求规范性条件避免这类词。
  - probe: 2. CTC-R001 与 CTC-R003 的关系
    level: |-
      CTC-R001 为必须，横跨全部五层（§2），约束全部六族的应用方式（§6 开头）。CTC-R003 为应，位于第 4 层。
    scope: |-
      任何改写或翻译任务（CTC-R001）。新写不在 R001 条文的触发范围内；review 中，R001 的归因就是 finding 的「规则」字段（§3 输出契约）。
    trigger: |-
      输出相对来源的每一处改动。
    requires: |-
      每处改动必须归因到一条具体规则 ID；未触发任何规则的文本原样返回。CTC-R003 为这样的改动提供 ID：改动去除了十类缺陷之一的一个实例，取最小改动，语义完全不变，且不与 S 族冲突（§6 表后段：R002／R003「描述的是缺陷，不是改写许可」）。调用方授权本身也构成归因（§3「调用方授权」）。两个候选修复在同一层上等价时，取更接近来源的形式（§2「同层并列」）。
    prohibits: |-
      R001 禁止：以「更清楚」「更专业」为由做等义替换；为体现工作量而改写；混合多处不相关改动。§2「阶梯不授权改动」：第 4 层「专业中文技术语体」的笼统描述本身不能作为改动依据，依据只能是规则 ID。
    exceptions: |-
      调用方授权（§3）。R003 让位于 S 族。
    fork: yes
    readings:
      - id: A
        reading: |-
          窄读：R003 是 R001 禁止项的窄例外，只覆盖十类缺陷的实例（类别封闭、类内成员开放）。可以归因到 R003 的改动：删「哎呀」「呢」「哈」「哦」「一下」；删「帮你」；把「进行／予以 + V」改成 V；改无必要的被动。不能归因的改动：「再试→重试」「查→查询」「的时候→时」「别→不要」「瞎猜→猜测」「没→未」，以及超出缺陷本身的整句重组。删「请」或改动被引用的回复文本也不行，因为它们受 S 族保护，而 S 族优先。
        behavior: |-
          改动少，可以逐处审查；输出可能残留十类之外的口语词。
      - id: B
        reading: |-
          宽读：「口语腔」「译文腔」是开放概念，十类只是举例；只要某处读起来像口语或像译文，就触发 R003，并可以按「改用中文技术写作的常规表达」重写。
        behavior: |-
          对口语来源，R003 实际上成了「更专业」式等义替换的总许可，R001 的那条禁止被架空；改动数量和 S 族风险都上升（见 probe 1 F1-B）。
    answer: |-
      「口语腔」所列的五类在文字上没有声明封闭或开放，因此存在分叉。我倾向于封闭清单：没有「等」，而相邻的 CTC-R004 用了「等」来表示开放；表后段明确写着「不是改写许可」；§2 写明阶梯不授权改动。每一类的成员则按类定义开放判定，括注里的词（「麻烦您」「啊」「嘛」「哎呀！」「一下」「这个工具可以帮你」）只是实例，不是全部成员。
    notes: |-
      还有第二个分叉（probe 1 F7）：R001 及表后段要求最小改动，而 §4 写着「所在句子因规则触发而合法改写时，受保护标记可以随句子移动」，暗示可以整句重写。两者对 R003 修复的范围给出了不同答案。
  - probe: 3. CTC-R004（全文）
    level: |-
      应；位于 §2 第 2 层；review 中映射为 WARNING，满足 §8 的条件时可以升为 ERROR。
    scope: |-
      规范性指令（括注：agent 指令、SOP、策略、门禁条件）。覆盖新写、改写与 review。条文末句排除「目标文档中限定观测事实的普通汉语副词」，即描述性句子。
    trigger: |-
      规范性指令的判定条件由无判据词承担时：「尽量」「尽可能」「尽快」「最好」「适当」「必要时」「视情况」「合理」等程度、时限或裁量词。
    requires: |-
      新写：给出可观测的触发条件（阈值、状态或事件）。改写：保持原词，不补判据，进「待确认」第 4 类；按 §5，指出缺失的判据，列出两种以上可能的强度并给出建议，然后停手。该行第四栏（建议）必须填写（§3「第四栏只在规则要求给出建议时填写（§5 的情态模糊）」）。review 中作为 finding 报告。
    prohibits: |-
      改写时补出来源没有的判据；把该词替换为具体强度或具体阈值（§5「那是替作者做出未经授权的规范决定」）。
    exceptions: |-
      未定义的状态（「服务稳定」）与缺失的数值（「多次」）不是这类词，按 CTC-A005 处理：必须级，review 中为 ERROR，「待确认」第 1 类或第 5 类，不填建议栏。目标文档中限定观测事实的普通副词（「该接口通常在 100 ms 内返回」）不受限。
    fork: yes
    readings:
      - id: F1-A
        reading: |-
          范围按文档类型判定：括注是穷举，只有 agent 指令、SOP、策略、门禁条件属于规范性指令。
        behavior: |-
          告警（probe 5(e)「先别重启」）、API 文档、工具描述中的规范句不触发 R004。
      - id: F1-B
        reading: |-
          范围按句子功能判定：括注只是举例，任何文档里的规范句都算。末句「限定观测事实的普通副词」把规范句和描述句对立起来，支持这种读法。
        behavior: |-
          API 文档中的「客户端应尽量复用连接」、告警中的「先别重启」（若把「先」视为时限词）都触发 R004，并进「待确认」第 4 类。
      - id: F2-A
        reading: |-
          边界划在 A005 一侧较宽：凡隐含数值或状态的程度词（「频繁」「大量」「较高」「旧」）都视为「缺失的数值／未定义的状态」，转 CTC-A005。
        behavior: |-
          review 中为 ERROR；「待确认」用第 1 类或第 5 类，不给建议。
      - id: F2-B
        reading: |-
          边界划在 R004 一侧较宽：凡程度词都属本规则，只有条文点名的「多次」「服务稳定」这类转 A005。
        behavior: |-
          review 中为 WARNING（可升级）；「待确认」用第 4 类，给出强度与建议。条文没有给出区分「程度词」与「缺失的数值」的检验方法，而两边的级别、严重级别与输出格式都不同。
      - id: F3-A
        reading: |-
          新写时由模型自行给出可观测条件：条文写的是「给出」，未限定来源。
        behavior: |-
          模型会写出具体阈值，例如把「尽快」写成「15 分钟内」。
      - id: F3-B
        reading: |-
          新写时的条件也必须来自调用方素材：CTC-S002 要求每条命题可追溯到来源或调用上下文；CTC-P005 明写了「新写时取自调用方素材」，而 R004 没写。
        behavior: |-
          素材缺失时不写具体阈值，转「待确认」。两种读法产出不同的规范内容。
      - id: F4-A
        reading: |-
          §5「列出其可能的两种以上强度」中的「强度」指道义强度（必须／应／可以）。
        behavior: |-
          「待确认」行写道义强度候选。
      - id: F4-B
        reading: |-
          「强度」指判据的取值范围（立即／窗口内）。§3 的示例「可读作「必须立即执行」或「应在窗口内执行」」把两者混在了一起。
        behavior: |-
          「待确认」行的内容不同。这一分叉不影响是否报告，只影响报告的内容。
    answer: |-
      词表是开放类：列举后有「等」，并以「程度、时限或裁量词」这一类名收束。判定成员的条件有三项，须同时满足：(1) 词义属于程度、时限或裁量；(2) 它在规范性指令中承担判定条件，即决定义务何时、是否、在多大程度上适用；(3) 来源与上下文都没有给出可观测判据。排除的是未定义的状态与缺失的数值（转 A005），以及描述观测事实的普通副词。按此判断，「及时」（时限）与「酌情」（裁量，同「视情况」）属于成员。
    notes: |-
      影响最大的是 F2：R004 与 A005 的边界决定了 WARNING 与 ERROR 之分，也决定「待确认」是否带建议栏，而条文只给出两个点名的例子，没有给出一般判据。
  - probe: 4. 状态提示：未指定模式时的模式与审阅阈值
    level: |-
      不涉及规则级别，这里是 §1 的模式推定和 §3 的阈值选择。
    scope: |-
      调用方没有指定模式的任务。
    trigger: |-
      任务对象是一条状态提示，且调用方没有给出模式。
    requires: |-
      改写（以及翻译、新写）时，按 §3 适用范围推定模式；状态提示列在 strict 适用范围内，因此用 strict。审阅时用 review 模式，歧义阈值按被审文档的类型取，状态提示属于 strict 适用范围，因此用 strict 的阈值（最低阈值：只要存在一种在本文档语境下可执行、且导致不同动作的读法，就按竞争读法处理）。
    prohibits: |-
      用 standard 处理状态提示；在 review 中改写文本。
    exceptions: |-
      调用方显式指定模式时按指定执行，推定只在「模式未指定时」发生。
    fork: no
    answer: |-
      改写用 strict。依据：§1「模式未指定时，审阅任务用 review；其余任务按 §3 中 strict 与 standard 的适用范围推定，文档类型跨界时取 strict。」以及 §3 strict 适用范围「告警、错误信息与状态提示」。审阅用 review 模式、strict 阈值。依据：§1 同一句的前半句，以及 §3 review 行为「歧义阈值按被审文档的类型选取：属于 strict 适用范围的用 strict 的阈值」。
    notes: |-
      本题情形没有分叉。有一个相邻的变体会分叉：状态提示嵌在 API 文档或 README 里（这些属于 standard 类型）时，§1 对模式推定给了「跨界时取 strict」的裁决，但 §3 review 的阈值选择没有对应的跨界裁决，「被审文档的类型」可能指整篇 API 文档，也可能指那条状态提示。阈值只影响 A、P 两族，不影响严重级别的映射。
