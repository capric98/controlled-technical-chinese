        edits: "CTC-R003 要求：删「哎呀，」（情绪化感叹），删「呢」「哈」（语气词），删「一下」（口语填充）"
        not_allowed: "删除「请」或改为「须」（CTC-S003）；把「过一会儿」写成具体时长（CTC-S002）；把「再试」改为「重试」，属无规则可归因的等义替换（CTC-R001）"
        uncertain: "「您」是否属于客套、句末「了」是否属于语气词、「过一会儿」是否算口语腔，条文都未定"
      b:
        output: "你要记得，用户问到价格的时候千万别瞎猜，先查 `price_api`。"
