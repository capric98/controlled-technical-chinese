      - id: F
        reading: "strict 阈值下，「过一会儿」「先别重启」缺少执行所需的时长或解除条件（CTC-A005／第 5 类）"
        behavior: "(a)(e) 追加「待确认」：重试间隔／解除禁止重启的条件"
    answer:
