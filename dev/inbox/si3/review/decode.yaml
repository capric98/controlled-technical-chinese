probes:
  - probe: "1. CTC-R003（全文）"
    level: "应（§6 级别栏）；第 4 层（§2）；review 中映射 WARNING，§8 风险字段条件满足时可按 ERROR；条文明言「永远低于 S 族」"
    scope: "全部任务（改写、翻译、新写的输出；review 中作 finding 依据）与全部文档类型；受保护标记与代码块内部不适用（§4、CTC-S005）"
    trigger: "文本含译文腔五类（无必要的被动、进行／作出／予以 + 动词、过长的「的」字串、英语从句语序残留、直译连接词）或口语腔五类（客套与请托、语气词、情绪化感叹、口语填充、把读者当作谈话对象的引导）的实例"
    requires: "在语义完全不变的前提下改用中文技术写作的常规表达；工具描述改为直接陈述功能（「获取…」「用于…」）；§6 末段：只在缺陷出现时修复，取能去除它的最小改动"
    prohibits: "改变任何语义（前提是「完全不变」，比 S 族逐项保持更严）；重写不含缺陷的文本（§6 末段、CTC-R001）；把自然被动一概改主动"
    exceptions: "被动用于突出受事、施事未知或施事已在同句给出时保留；表示强度的「千万」不是口语腔；与 S 族冲突时 S 族胜；standard 另允许惯用压缩、并句与话题链（§3）"
    fork: yes
    readings:
      - id: A
        reading: "工具描述那一句只规定缺陷触发后的目标形式；「陈述谁可以用它做什么」本身不是触发条件，只有口语腔第五类（「这个工具可以帮你」）才触发"
        behavior: "「调用方可以用该工具查询日志」这类无口语成分的工具描述原样返回"
      - id: B
        reading: "「而不是陈述谁可以用它做什么」独立构成一种缺陷：工具描述以「某角色可以／允许…」开头即触发"
        behavior: "上述描述被改为「查询日志」；(f) 的「允许调用方…重试」也被视为触发，只因 CTC-S003（许可）阻断才不改，归因与 A 不同；不谨慎时会把许可改写成功能陈述"
      - id: C
        reading: "语气词类按语法类别判定，句末「吧」（祈使句表商量／建议）、句末「了」（表变化）都属语气词，可删"
        behavior: "(b) 删「吧」、(e) 可删「了」"
      - id: D
        reading: "语气词承载言语行为或情态时，删除即违反「语义完全不变」与 CTC-S003，不得删"
        behavior: "(b) 保留「吧」（或判定 R003 在该处无法修复）；(e) 保留「了」"
    notes: "口语腔五类是封闭还是举例的分叉见探针 2，同样影响本条的触发面。「语义完全不变」比 S 族逐项保持更严，字面上任何细微语用差别都能阻断修复，阈值未定义。"
  - probe: "2. CTC-R001 与 CTC-R003 的关系；口语腔五类封闭还是举例"
    level: "CTC-R001 必须（横跨五层，约束全部规则的应用方式）；CTC-R003 应（第 4 层）"
    scope: "改写与翻译任务；review 中 CTC-R001 的归因即 finding 的「规则」字段（§3 输出契约）"
    trigger: "CTC-R001：任何改写或翻译；CTC-R003：文本含所列缺陷实例"
    requires: "每处改动归因到一条规则 ID；可归因到 CTC-R003 的编辑 = 去除一个所列缺陷实例的最小改动，且语义完全不变；工具描述的修复目标是直接陈述功能"
    prohibits: "以「更清楚」「更专业」做等义替换；把 CTC-R003 当作通用润色许可（§6 末段「描述的是缺陷，不是改写许可」）；把多处不相关改动混在一起；重写不含缺陷的句子"
    exceptions: "调用方授权本身构成归因（§3）；S 族会被违反时 CTC-R003 不得生效"
    fork: yes
    readings:
      - id: A
        reading: "封闭类别清单：破折号同位语逐项列出十类，无「等」；对照 CTC-R004 明写「等」，可推知此处有意封闭。类内成员按语言学类别判定，括注只是举例（语气词类含呢、哈、哦、吧、呀等）"
        behavior: "类外的口语词——瞎猜、别、没、转成、过一会儿、估计——无规则可归因，按 CTC-R001 原样保留"
      - id: B
        reading: "举例清单：§2 第 4 层把「口语腔」作为一般语体概念使用，十类只是常见表现；「千万」的特别排除也暗示作者把口语腔当作开放概念"
        behavior: "类外口语词也改为书面形式（别→不要、没→未、转成→转换为、过一会儿→稍后、瞎猜→凭空猜测），每处都归因到 CTC-R003，改动面显著扩大"
      - id: C
        reading: "最小改动优先：只删除缺陷成分（§6 末段「修复取能去除它的最小改动」）"
        behavior: "(d) 输出「把 CSV 转成 JSON，文件最大 10 MB。」"
      - id: D
        reading: "常规表达优先：条文要求「改用中文技术写作的常规表达」，工具描述须是「获取…」「用于…」式，可重组句子"
        behavior: "(d) 输出「将 CSV 转换为 JSON，文件最大 10 MB。」或「用于将 CSV 转换为 JSON……」"
    answer: "可归因到 CTC-R003：删除情绪化感叹（哎呀）、语气词（呢、哈、哦、呀、嘛、啊）、口语填充（一下）、客套请托（麻烦您）；把「这个工具可以帮你…」改为直接陈述功能；进行／作出／予以 + V → V；去英语从句残留与直译连接词；把无必要的被动改主动。不可归因：受 S 族保护成分（「请」表请求、「估计」表不确定、「千万」表强度）；引号内被指定输出的字面内容；类外口语词（依读法 A）；超出去除缺陷所需的重组。五类按字面更接近封闭的类别清单（读法 A），但类内成员开放，且条文未明言封闭，故列为分叉。"
    notes: "CTC-R001 不改变 CTC-R003 的级别，只限定其编辑面。主要分叉在类别边界：「你要记得」「您」「过一会儿」「了」是否落入某一类，条文都没有给出判据。"
  - probe: "3. CTC-R004（全文）；词表封闭还是开放；类成员如何判定"
    level: "应；第 2 层（§2）；review 中 WARNING，§8 风险字段条件满足时可按 ERROR"
    scope: "规范性指令（括注：agent 指令、SOP、策略、门禁条件）；新写、改写、review 均适用"
    trigger: "规范性指令的判定条件由无判据的程度、时机或裁量词承担（尽量、尽可能、尽快、最好、适当、必要时、视情况、合理等）"
    requires: "新写：给出可观测的触发条件（阈值、状态或事件）。改写：在「待确认」第 4 类中提出；按 §5 指出缺失的判据，列出两种以上可能的强度并给出建议（第四栏），然后停手"
    prohibits: "改写时补出来源没有的判据；把该词替换为具体强度或具体阈值（§5）"
    exceptions: "未定义的状态（「服务稳定」）与缺失的次数或时长（「多次」「若干分钟」）不属本类，按 CTC-A005 处理；目标文档中限定观测事实的普通副词（「该接口通常在 100 ms 内返回」）不受限"
    fork: yes
    readings:
      - id: A
        reading: "「及时」「适时」「酌情」等未列词按语义类归入：时机词类比「尽快」，裁量词类比「视情况」"
        behavior: "review 记为 CTC-R004／WARNING；改写进「待确认」第 4 类，带强度选项与建议"
      - id: B
        reading: "「及时」本质是未给出的时限，即「缺失的时长」，适用排除条款"
        behavior: "review 记为 CTC-A005／ERROR；改写进「待确认」第 1 类，不给强度选项与建议。同一处的严重级别与待确认格式都不同"
      - id: C
        reading: "括注的四种文档类型是封闭的适用范围"
        behavior: "错误信息（「请稍后重试」）、工具描述（「必要时调用」）中的同类词不触发本规则"
      - id: D
        reading: "括注只是举例，凡含规范性指令的文本都适用"
        behavior: "工具描述的「必要时调用」、错误信息的「过一会儿再试」也可能进「待确认」第 4 类"
    answer: "开放类：条文明写「等」，所列八词是范例。成员判定有三项：(1) 语义上属于程度、时机或裁量词；(2) 本身不给可观测的阈值、状态或事件；(3) 在规范性指令中承担判定条件（§5 的说法是承担义务的条件）。排除项：未定义的状态谓词与缺失的次数或时长（转 CTC-A005），以及描述观测事实的普通副词。"
    notes: "排除条款中的「缺失的时长」与类内的「尽快」语义相邻，边界只能靠类比判定（读法 A／B）。「新写时给出可观测的触发条件」与 CTC-S002（无据不增）的关系未说明：调用方素材也没有阈值时，新写怎样做未写明，可推测是进「待确认」。"
  - probe: "4. 状态提示：未指定模式时改写用哪种模式，审阅用哪种歧义阈值"
    level: "无规则 ID；§1 模式推定句与 §3 适用范围，均为无级别标注的流程规定"
    scope: "调用方未指定模式的任务"
    trigger: "调用方未指定模式"
    requires: "审阅任务用 review；其余任务按 §3 strict／standard 的适用范围推定；文档类型跨界时取 strict。review 的歧义阈值按被审文档的类型选取"
    prohibits: "无"
    exceptions: "调用方显式指定模式时按指定"
    fork: no
    answer: "改写用 strict。依据：§1「模式未指定时，审阅任务用 review；其余任务按 §3 中 strict 与 standard 的适用范围推定」，加上 §3 strict 适用范围列出的「告警、错误信息与状态提示」。审阅用 review 模式、strict 的歧义阈值。依据：§1「审阅任务用 review」，加上 §3 review 行为「歧义阈值按被审文档的类型选取：属于 strict 适用范围的用 strict 的阈值」。"
    notes: "状态提示出现在 API 文档等 standard 文档中时，按「跨界时取 strict」仍为 strict，结论不变。"
  - probe: "5. 七处改写（未注明者为 strict）"
    level: "CTC-R001 必须；CTC-R003 应；S 族、L 族必须；CTC-P005 应"
    scope: "strict：(a)(b)(c)(e)；standard：(d)(f)(g)"
    trigger: "CTC-R003 的语气词、情绪化感叹、口语填充与读者引导实例；其余各处未触发规则，按 CTC-R001 原样保留"
    requires: "只删去或替换缺陷成分，其余逐字保留；受保护标记、数值与情态原样保留"
    prohibits: "删改「请」「千万」「估计」「先」「允许」「最大／最多」；补出时限、重试次数或其他限制；改写被指定输出的字面回复"
    exceptions: "CTC-R003 在会改变语义处不生效（低于 S 族）"
    fork: yes
    readings:
      - id: A
        reading: "封闭类别 + 最小改动（探针 2 读法 A、C）"
        behavior: "按 answer 中的主输出"
      - id: B
        reading: "口语腔为开放概念（探针 2 读法 B）"
        behavior: "(a)「导出失败，请稍后再试。」(b)「用户问到价格时，千万不要凭空猜测，先查询 `price_api`。」(d)「将 CSV 转换为 JSON，文件最大 10 MB。」(e)「`disk-03` 使用率已达 95%，估计是日志未轮转，暂不要重启。」"
      - id: C
