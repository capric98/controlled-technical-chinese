        edits: "无（CTC-R001）。引号内是被指定的输出字面内容，改动会改变 agent 的实际回复，违反 CTC-S001 与 CTC-R003 的「语义完全不变」前提"
        not_allowed: "改写「不客气呀～」；改动「不要追加别的内容」的否定范围（CTC-A004）"
