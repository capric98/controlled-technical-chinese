        behavior: "同两处报 ERROR；两种输出都合规，严重级别实际由审阅者裁量决定"
      - id: C
        reading: "「旧镜像」范围未定（仅上一版本，还是除当前版本外全部），清理是破坏性操作，且会影响回滚点；strict 阈值下属于竞争读法"
        behavior: "另报一条 CTC-A005／ERROR"
      - id: D
        reading: "「旧镜像」在部署语境中按惯例可确定，或已被「酌情」的 finding 覆盖"
        behavior: "不另报"
      - id: E
        reading: "「及时」属于缺失的时长（CTC-R004 的排除条款）"
        behavior: "第 1 条改报 CTC-A005／ERROR"
    answer: "按排序：(1) ERROR CTC-A005，位置「服务稳定后」，「稳定」是未定义的状态，CTC-R004 的排除条款明文点名「服务稳定」转 CTC-A005，风险是不同操作者会在不同时点关闭变更单。(2) ERROR CTC-A005，位置「旧镜像」（属分叉，读法 C），清理范围未定，可能删掉回滚所需的镜像。(3) WARNING CTC-R004，位置「及时通知值班组」，「及时」是无判据的时机词，类比所列的「尽快」；建议修改只能提示补充通知时限，不得代填具体数值。(4) WARNING CTC-R004，位置「酌情清理旧镜像」，「酌情」是裁量词，类比「视情况」，是否清理、清理多少都未定。(3)(4) 可以在风险字段指名不同动作后按 ERROR 报告（读法 B）。不报：「部署完成」，部署系统给出确定事件；「通知值班组」的渠道，对象已写出，CTC-P002 不要求细化；第 3 步的守护条件，来源未给出，CTC-P004 不要求虚构；关闭变更单缺少成功判据，该步不是破坏性操作，CTC-P003 不提出。"
    notes: "同一处（第 3 步）触发两条规则时按 §8 分列，不合并。§8 第 3 步要求的「建议修改」与 §5 的「不得替换为具体阈值」如何协调，条文只对改写模式作了规定；review 中建议修改可否给出示例阈值，未写明。"
