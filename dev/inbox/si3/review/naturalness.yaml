reviewer: naturalness
model: claude-opus-5-5
files_read:
  - dev/prompts/si3-naturalness.md
  - dev/inbox/si3/base/SKILL.md（仅通过 diff 对照）
  - dev/inbox/si3/cand/v3/SKILL.md
passages:
  - id: S1
    scope_note: 本条合并两处配套改动：§1 删去「状态提示、」，§3 strict 适用范围末项改为「告警、错误信息与状态提示」。
    candidate_text: |-
      §1：写作、改写、翻译或审阅中文技术内容时，本技能生效，覆盖 §3 strict 与 standard 适用范围所列的文档类型，以及技术文本的英译中与既有中文技术文本的审校。
      §3 strict 适用范围末项：告警、错误信息与状态提示。
    naturalness: 4
    quotes:
      - 「以及技术文本的英译中与既有中文技术文本的审校」：删去「状态提示」后，「以及」后只剩两项任务，不再把一个文档类型夹在任务之间，并列成分同类，比 base 顺。
      - 「告警、错误信息与状态提示」：三项并列，「、…与」用法规范，单看这一项可评 5。
      - 「覆盖……文档类型，以及……审校」：「覆盖」同时支配文档类型和任务，宾语类别不一致；这是 base 已有的结构，不是本次引入。
    ambiguity:
      - 无新增歧义。「技术文本的」只修饰「英译中」，后项自带定语「既有中文技术文本的」，结合域清楚。
      - 一致性（不是歧义）：frontmatter description 只列「告警与错误信息」，不含「状态提示」；正文现在只在 §3 strict 提到状态提示。激活描述比正文少一项，可能影响只含状态提示的任务能否触发本技能。
    over_control_risk:
      - target_text: 状态提示「更新完成，重启后生效。」
        risk: 状态提示归入 strict 后取最低歧义阈值；「重启」可读作重启应用或重启设备，两种动作不同，strict 下会进「待确认」。界面文案依赖本技能看不到的上下文，这类报告多数是噪声。风险低到中。
      - target_text: 错误提示「同步失败，请稍后重试。」
        risk: 状态提示与 agent 指令、SOP 同列于 strict，模型可能把面向用户的提示也当作 CTC-R004 所说的规范性指令，把「稍后」当作时机词提出「待确认」。详见 R004 条。
    normative_vocabulary: ok（改动部分不含规范用词）
  - id: ladder-4
    candidate_text: 4 自然的技术中文 | 专业中文技术语体：无译文腔与口语腔、无伪法律赘语、无机械重复的主语、无人为碎句、无多余被动
    naturalness: 4
    quotes:
      - 本行其余各项都是「无 + 单项」，只有「无译文腔与口语腔」用「与」合并两项，节奏略不齐，不影响理解。
    ambiguity:
      - 否定作用域：「无译文腔与口语腔」的常规读法是分别否定（两者都不出现）；字面上也可读作合并否定（不同时出现二者）。CTC-A004 正是禁止这两种作用域互换的规则，阶梯用这种句式有轻微的自宿主瑕疵。实际误读概率低。
      - 「口语腔」在阶梯中没有定义，只在 CTC-R003 中以五类示例界定，第 4 层的范围要回到 R003 才能确定。
    over_control_risk:
      - target_text: 「改完配置后重启网关才会生效」
        risk: 若把第 4 层的「口语腔」理解为一切口语常见成分，模型可能把「才」「就」这类在书面技术语体中同样规范的虚词当作口语腔删去；「才」在此标记必要条件，删去即违反 CTC-L002。§2 写明「阶梯不授权改动」，实际改动仍受 R003 条文约束，风险低。
      - target_text: 项目体例规定用第二人称「你」或友好口吻的开发者文档、界面文案
        risk: 口语腔进入第 4 层后，按「低层不得覆盖高层」，第 5 层的「人称与语态偏好」保护不了刻意的口吻，只有调用方显式「指定改写目标」才能保住。具体例子见 R003 条。
    equivalent_rewording: 专业中文技术语体：无译文腔、无口语腔、无伪法律赘语、无机械重复的主语、无人为碎句、无多余被动
    rewording_is_equivalent_because: 只把「无 A 与 B」展开为本行其余各项已用的「无 A、无 B」形式，保留分别否定这一唯一的自然读法，去掉字面上的合并否定读法；不增删任何缺陷类别。
    normative_vocabulary: ok（本行不含规范用词）
  - id: R003
    candidate_text: |-
      CTC-R003 | 应 | 反译文腔与口语腔 | 文本含译文腔——无必要的被动、名词化赘语（进行／作出／予以 + 动词）、过长的「的」字串、英语从句语序残留（「由于…的事实」）、直译连接词——或口语腔——客套与请托（「麻烦您」）、语气词（「啊」「嘛」）、情绪化感叹（「哎呀！」）、口语填充（「一下」）、把读者当作谈话对象的引导（「这个工具可以帮你」）——时，在语义完全不变的前提下改用中文技术写作的常规表达；工具描述的常规表达是直接陈述功能（「获取…」「用于…」），而不是陈述谁可以用它做什么。被动用于突出受事、施事未知或施事已在同句给出时是自然的技术表述。表示强度的「千万」不是口语腔。本规则永远低于 S 族。
    naturalness: 3
    quotes:
      - 「文本含译文腔——……——或口语腔——……——时」：从「文本含」到「时」隔了约 170 字、10 个子项、9 组括注和多层引号，读者要一直记着「文本含」没有收束；第二对破折号的收尾紧贴「时」（「（「这个工具可以帮你」）——时，」），收束点很难找。这是本次最主要的可读性问题。
      - 四个破折号连续出现：「——直译连接词——或口语腔——」一段，第二个破折号既可读作第一对的收尾，也可读作引出「或口语腔」的说明性破折号；靠内容能纠正，但要回读。
      - 「客套与请托」：「请托」在当代汉语里常带「托关系办事」的色彩（多见于「请托事项」「请托人」这类廉政语境），放在技术规则里语体不合。
      - 「工具描述的常规表达是直接陈述功能（「获取…」「用于…」）」与「表示强度的「千万」不是口语腔」：都自然；「表示强度的」顺带把数词「千万」（「千万级 QPS」）排除在外。
    ambiguity:
      - 列举的开放性：破折号插入的列表可读作「即」（封闭的类型清单），也可读作「例如」（开放举例）。base 把译文腔各项直接写成触发项，是封闭清单；新版先给类名再插入列表，可读成类名才是触发条件、列表只是举例，触发面随之扩大到模型自认为的任何「口语腔」。括注里的具体词（「一下」「麻烦您」）显然是示例，这一层开放没有问题；问题在五个类型本身是否封闭。
      - 「而不是陈述谁可以用它做什么」否定什么：读法 A 否定句式，即不以使用者为主语写成「X 可以用它做 Y」；读法 B 否定内容，即工具描述不写谁有权使用、能用来做什么。读法 B 会删掉 CTC-P005 要求的适用边界和 CTC-S007 的适用对象。「可以」恰是本技能许可级的规范词，更容易引出读法 B。从前文示例「这个工具可以帮你」看，作者意图应是 A。
      - 工具描述一句的地位：它以分号接在要求之后，可读作 (a) 只说明工具描述中「常规表达」的样子，仍以出现所列缺陷为前提；也可读作 (b) 独立触发，即凡不是「直接陈述功能」的工具描述都要改写。(b) 与 §6 末「CTC-R002 与 CTC-R003 描述的是缺陷，不是改写许可」冲突，会让 R003 在没有缺陷的工具描述上触发。
      - 「把读者当作谈话对象的引导」：中心语是「引导」，严格读只管引导语（「这个工具可以帮你」「下面我们来看」）；宽读为凡称呼读者的「你／您」都算口语腔。两种读法对系统提示（读者就是 agent）的处理完全不同。
      - 「表示强度的「千万」」只举一个词：可读作唯一豁免（「一定要」「务必」「绝对不要」不在豁免内），也可读作同类的代表。
    over_control_risk:
      - target_text: 「按一下复位键，指示灯闪烁后松开。」（同一文档另有「长按复位键 5 秒恢复出厂设置」）
        risk: 「一下」被标为口语填充的示例，但在硬件与运维文本中「按一下」表示短按一次，与「长按」「按住」对立；删去后成为时长不定的「按复位键」，操作者可能长按，触发恢复出厂。条文的「语义完全不变」原则上能拦住，但示例把「一下」直接标成纯填充，模型更可能照示例删除。风险高。
      - target_text: 排障文档「是 DNS 缓存的问题吧，先清缓存再试。」
        risk: 「吧」属语气词类，在此表示推测；直接删去会变成断言「是 DNS 缓存的问题」，认识强度升格（CTC-S003），原因由可能变为确定（CTC-S006）。正确做法是改为「可能是」，而类名「语气词」诱导的是删除。
      - target_text: FAQ 标题「如果重试后仍然失败呢？」；发布说明「升级到 2.3 后，修改配置不用重启了。」
        risk: 「呢」承载疑问，删去后标题变成残缺的条件小句；句末「了」表示新情况（与旧版本对比），删去后成为一般陈述，丢掉「这是一项变化」。二者在语法上都是语气词。
      - target_text: 错误提示「请检查网络连接后重试。」
        risk: 类名「客套与请托」含「请」字，示例「麻烦您」又是礼貌请求，模型可能把面向用户的「请」一并删去，得到裸祈使句「检查网络连接后重试。」。这偏离中文界面文案惯例；在 agent 指令中删「请」通常无语义损失，在用户可见文本中则是语体退化。
      - target_text: 系统提示「你是订单客服助手。用户提供订单号后，你先调用 `get_order`，再回答。」
        risk: 「你」是称呼 agent 的常规写法，也是区分 agent 与「用户」两个执行者的唯一标记。按宽读删去「你」后，「先调用」的执行者可能落到「用户」（CTC-A001），「你是…」的角色设定这一言语行为也随之消失（CTC-S003）。
      - target_text: 工具描述「你可以用它删除草稿，但不得删除已发布的文章。」
        risk: 按新增一句改为「用于删除草稿…」时，「可以」承载的许可和后半句的禁止可能一起被改成能力描述，言语行为类型改变（CTC-S003），禁止条件丢失（CTC-L001）。新句子示范的正是这种改写方向，而「本规则永远低于 S 族」是唯一的拦截。
      - target_text: 工具描述「当用户要求退款时，可以调用此工具核对订单是否满足退款条件。」
        risk: 按读法 B 或 (b) 改为「用于核对订单是否满足退款条件」，会删掉 CTC-P005 要求的使用时机。
      - target_text: 状态提示「哎呀，网络好像开小差了，请稍后再试～」（产品刻意的友好口吻）
        risk: 默认改写会得到「网络连接异常，请稍后重试。」：口吻被洗掉，「好像」的不确定性也被抹成断言（CTC-S003）。产品口吻属第 5 层「人称与语态偏好」，低于 R003 所在的第 4 层，未经调用方授权保不住。状态提示本次又明确进入 strict，这类文本会更常遇到 R003。
      - target_text: 「改完配置重启下服务就行」「去控制台把开关关掉」
        risk: 漏改与误删并存。口语填充只举了「一下」，模型可能放过「就行」「去」「把…掉」；反过来，「就行」表示只需这一步，若被当作填充直接删去，会丢掉充分性（应改为「只需…即可」）。两个方向的错误都源于只有一个示例。
      - target_text: 「重启前一定要先备份。」
        risk: 「千万」是唯一明文豁免的强度词，模型可能据此推定「一定要」不受保护，当作口语删为「重启前先备份」，义务强度下降（CTC-S003）。
    equivalent_rewording: |-
      (1) 文本含译文腔或口语腔时，在语义完全不变的前提下改用中文技术写作的常规表达。译文腔：无必要的被动、名词化赘语（进行／作出／予以 + 动词）、过长的「的」字串、英语从句语序残留（「由于…的事实」）、直译连接词。口语腔：客套与请托（「麻烦您」）、语气词（「啊」「嘛」）、情绪化感叹（「哎呀！」）、口语填充（「一下」）、把读者当作谈话对象的引导（「这个工具可以帮你」）。工具描述的常规表达是……（其后各句不变）
      (2) 「客套与请托」改为「客套与拜托」。
    rewording_is_equivalent_because: |-
      (1) 触发条件仍是「文本含译文腔或口语腔」；两组列表的项目与顺序不变；破折号插入换成冒号同位说明，二者都不带「包括」「如」「等」，列表的封闭或开放地位与原文相同（上文第 1 条歧义原样保留，不被本改写消解）；其后各句一字不改。只是把 170 字的悬空条件拆成三句。
      (2) 「请托」与「拜托」都指请别人替自己办事，所指相同；换词只去掉「托关系」的语体色彩，并避开与界面用语「请」同字。不增删任何类型。
      注：「而不是陈述谁可以用它做什么」的改写（如「而不是写成「X 可以用它做 Y」的句式」）会消解歧义，只在作者确认读法 A 时才等义，所以不列为等义改写。
    normative_vocabulary: 新句「而不是陈述谁可以用它做什么」中的「可以」是非规范用法，与 §6 许可级的「可以」同形，在规则正文中容易被读作许可（见歧义第 2 条）。其余新句没有用必须、应、可以、不得；要求仍以「改用」表达，级别由「应」栏决定，与 base 一致。新句自身没有口语腔或译文腔。
  - id: R004
    candidate_text: |-
      CTC-R004 | 应 | 规范可判定 | 规范性指令（agent 指令、SOP、策略、门禁条件）的判定条件由无判据词承担时——「尽量」「尽可能」「尽快」「最好」「适当」「必要时」「视情况」「合理」等程度、时机或裁量词——新写时给出可观测的触发条件（阈值、状态或事件）；改写时不得补出来源没有的判据，在「待确认」中提出。未定义的状态（「服务稳定」）与缺失的次数或时长（「多次」「若干分钟」）不是这类词，按 CTC-A005 处理。目标文档中限定观测事实的普通汉语副词（「该接口通常在 100 ms 内返回」）不受本规则限制。
    naturalness: 4
    quotes:
      - 「「合理」等程度、时机或裁量词」：「等程度」三字相邻，容易先被读成固定词「等程度」（同等程度），回读后才切分为「等｜程度、时机或裁量词」。
      - 「缺失的次数或时长（「多次」「若干分钟」）」：「多次」「若干分钟」不是缺失，而是给了量却没给具体值；「缺失的次数」字面上指不存在的次数，与示例略错位。
      - 「未定义的状态（「服务稳定」）……不是这类词，按 CTC-A005 处理」：边界句短而清楚，自然。
    ambiguity:
      - 「等」：后面没有数量收尾（不是「等八个词」），汉语常规读作开放列举；也可读作收尾，即只有这八个词，并按程度、时机、裁量三类归类。开放读法会把「稍后」「及时」「立即」「原则上」都纳入；收尾读法会漏掉与「视情况」同义的「酌情」。
      - 「最好」的归类：「最好在低峰期执行」中，「最好」表达的是建议强度，真正缺判据的是未定义的状态「低峰期」。按新增边界句，同一句同时归 R004 与 CTC-A005，两条路由在这类句子上分工不清。
      - 「规范性指令（agent 指令、SOP、策略、门禁条件）」的括注没有「等」，是封闭还是举例未定（未改动部分，但本次状态提示进入 strict 后与 agent 指令同列，面向用户的「请稍后重试」是否属于规范性指令因此更难判断）。
    over_control_risk:
      - target_text: SOP「发现数据不一致时立即停止写入。」
        risk: 开放读法下「立即」可被归入时机词，被要求补时限或进「待确认」；但「立即」本身就是可判定的时机（§3 示例的建议正是「必须立即执行」）。
      - target_text: 错误提示「同步失败，请稍后重试。」
        risk: 若把面向用户的提示当作规范性指令，「稍后」作为时机词进「待确认」，产生噪声；新写时还可能被要求给出「30 秒后」这类来源没有的数值。
      - target_text: 「必要时酌情扩容」
        risk: 漏改。收尾读法下「酌情」不在八词之内，不触发 R004；它也不是未定义状态或缺失的次数，CTC-A005 不一定接住。「必要时」会被报告，「酌情」被放过。
    equivalent_rewording: 「尽量」「尽可能」「尽快」「最好」「适当」「必要时」「视情况」「合理」等表示程度、时机或裁量的词；未给出具体值的次数或时长（「多次」「若干分钟」）
    rewording_is_equivalent_because: 「程度词」即「表示程度的词」，加「表示」只切断「等程度」的误切分，「等」仍无数量收尾，开放或收尾的地位与原文相同（歧义第 1 条原样保留）。「未给出具体值」与两个示例完全吻合，与 CTC-A005「缺少执行所需的参数、阈值」同指；这句只用来把表达式归类，完全不出现的次数本来就不在这句的作用范围内。
    normative_vocabulary: 新句不含规范用词，ok。小的用词不一致：本句写「按 CTC-A005 处理」，CTC-P002 写「按 CTC-A005 报告」，CTC-A003 与 CTC-L004 写「转 CTC-A005」，§8 第 2 步列举转 A005 的情形时没有列 R004。语义上本句说的是「不是这类词」，不属于「转」，不构成冲突，但三种说法并存。
overall_note: |-
  1. 最大的过度控制风险在 R003 的口语腔清单：几个类名的典型示例本身就有语义用法——「一下」表示短按一次，「吧」表示推测，「呢」承载疑问，「了」表示新情况，「你」标记执行者与角色设定，「可以」表达许可。条文只靠「语义完全不变」和「低于 S 族」两句通用保障来拦截，而类名与示例诱导的是删除，不是等义替换。新增的工具描述一句（「而不是陈述谁可以用它做什么」）还可能被读作独立触发或内容禁令，删掉许可、禁止与使用时机。
  2. 口语腔进入第 4 层后，产品刻意的友好口吻（第 5 层「人称与语态偏好」）在默认情况下保不住；状态提示本次又明确进入 strict，界面文案会更常遇到这条规则。
  3. 可读性：R003 的两对破折号使触发条件悬空约 170 字，是本次唯一自然度明显下降的地方（3 分）；改为「文本含译文腔或口语腔时……。译文腔：……。口语腔：……。」即可，语义不变。
  4. 以上只指出措辞造成的风险。是否为「请」「你」「一下」等加边界，属于规则的触发与例外，由规则作者按变更门槛决定，本审阅不提出规则改动。
  5. 一致性：frontmatter description 不含「状态提示」，正文只在 §3 strict 提到它。
