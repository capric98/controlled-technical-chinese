reviewer: cold-decoder
model: claude-opus-5-5
files_read:
  - dev/prompts/si5-decode-v2.md
  - dev/inbox/si5/cand/v2/SKILL.md
# 运行环境自动注入了 AGENTS.md / CLAUDE.md；未用它们推断技能意图。另执行过一次 ls 确认输出目录存在，未读取其中任何文件。
probes:
  - probe: |-
      1(a) 运维说明：「报表重算建议放在夜间，以减少对查询的影响。若排队任务较多，也可以分两批执行。」
    level: |-
      无规则生效（落入 §5「不算真歧义」第三种情形）。豁免不成立时为 CTC-A005（必须）。
    scope: |-
      运维说明属 strict 适用范围「运维与安全敏感操作」（文档类型跨界时取 strict，§1）；审阅用 strict 阈值。
    trigger: |-
      「若排队任务较多，也可以分两批执行」是「若…，也可以…」型放宽条件；「排队任务较多」用程度词描述运行指标，未给阈值。默认动作（夜间重算）不变；来源只有「建议」，没有被免除的义务。
    requires: |-
      原样保留；strict 改写不提出，审阅不报告。
    prohibits: |-
      不得补出「排队任务超过 N 个」之类阈值（CTC-S002；CTC-R004 改写时不得补判据）；不得删除条件（CTC-L001）；不得把「建议」「也可以」改换强度（CTC-S003）。
    exceptions: |-
      所许可的若是破坏性、不可逆或改变外部状态的操作，或免除了来源义务，豁免失效，转 CTC-A005。
    fork: yes
    readings:
      - id: A
        reading: |-
          「所许可的」指放宽出来的那部分，即「分两批」这种执行方式。重算本身是来源默认建议的动作，分批不新增外部状态改变，豁免成立。
        behavior: |-
          改写原样返回，无「待确认」；审阅无 finding。
      - id: B
        reading: |-
          「所许可的」指被许可的整个操作，即分两批执行报表重算。重算会写入或覆盖报表数据，属于改变外部状态，豁免失效；「排队任务较多」按 CTC-R004 排除项（用程度词描述运行指标的触发条件）转 CTC-A005。
        behavior: |-
          改写保持原句，在「待确认」中提出排队任务数阈值；审阅报 CTC-A005，ERROR。
    answer: |-
      取 A。
      处理方式：strict 改写原样返回，不追加「待确认」；审阅不产生 finding。
      规则 ID：无（豁免依据 §5）。严重级别：无。
      依据：§5「条件只放宽对操作者的限制（「若…，也可以…」），而默认动作不变、来源规定的义务不被免除、所许可的也不是破坏性、不可逆或改变外部状态的操作」，以及「后两种情形即使缺少判据或阈值，也不按 CTC-A005 或 CTC-R004 提出或报告」。
    notes: |-
      「改变外部状态」全文没有定义，只有 CTC-P004 的括注列举（删除、DROP、覆盖、重启、扩缩容、发布、回滚、密钥轮换、清空缓存）。按字面，几乎所有运维动作都改变外部状态，所以豁免边界取决于把「所许可的」读成增量还是整个操作。
      「夜间」不是 CTC-R004 列举的无判据词，也不是触发条件，不报告（§5「不得因「理论上可解析出两种读法」而报告」）。

  - probe: |-
      1(b) 变更规范：「1. 数据库变更须经 DBA 审批后执行。2. 线上故障时，也可以先执行、事后补审批。」
    level: |-
      CTC-A005（必须）→ 审阅 ERROR。
    scope: |-
      变更规范属 strict「SOP、runbook、变更流程」。
    trigger: |-
      第 2 条形式上是「…时，也可以…」放宽，但它免除了第 1 条「须经 DBA 审批后执行」的事前审批义务，所许可的数据库变更也改变外部状态。§5 豁免的三个合取条件有两个不成立，豁免失效。
      豁免失效后：「线上故障」的范围未定（任何线上故障，还是须由该变更处置的故障；哪个严重级别），不同读法决定操作者是否跳过事前审批；「事后」也未给出补审批时限。
    requires: |-
      strict 改写：两条均保持原表述，在「待确认」中提出「线上故障」的判定范围；「事后」的补审批时限可以作为第二项。审阅：一条 CTC-A005 finding。
    prohibits: |-
      不得补出故障等级或补审批时限（CTC-S002、CTC-A005「不得补出缺失项」）；不得把「也可以」改为「须」或删去（CTC-S003、CTC-L001）；不得把例外挪到不再修饰第 1 条义务的位置（CTC-L001）。
    exceptions: |-
      无适用豁免。
    fork: yes
    readings:
      - id: A
        reading: |-
          豁免失效只表示这一句不受豁免保护；是否提出仍要看有无规则触发。「线上故障」是可观测事件（CTC-R004 新写时要求的正是阈值、状态或事件），不是无判据词，也不是「服务稳定」那样的未定义状态，因此不触发。
        behavior: |-
          改写原样返回，无「待确认」；审阅无 finding。
      - id: B
        reading: |-
          豁免失效后按 strict 阈值判断：「线上故障」存在在本文档语境下可执行、且导致不同动作的读法（与该变更无关的轻微故障是否也许可先执行），构成竞争读法；补审批时限缺失。
        behavior: |-
          改写保持原句并进「待确认」；审阅报 CTC-A005，ERROR。
      - id: C
        reading: |-
          把「线上故障时」比作「必要时」一类表示时机或裁量的无判据词，按 CTC-R004 处理。
        behavior: |-
          改写同样进「待确认」，但审阅报 CTC-R004，WARNING（风险字段指名不同动作时可升级为 ERROR）。
    answer: |-
      取 B。
      处理方式：改写保持原句，在「待确认」提出，例如：
        线上故障时，也可以先执行 | 「线上故障」未限定范围或级别，决定能否跳过事前审批 | 允许先执行的故障范围
        事后补审批 | 未给出补审批时限 | 补审批的时限
      审阅：CTC-A005，ERROR。
      依据：§5 豁免句（本例中义务被免除、操作改变外部状态，豁免不适用）；§3 strict「只要存在一种在本文档语境下可执行、且导致不同动作的读法，即按竞争读法处理」；CTC-A005「缺少执行所需的参数、阈值、接收方、判据时：保持原表述，并在「待确认」中给出…」；CTC-R004 排除项「未定义的状态…按 CTC-A005 处理」；§8 第 2 步按 CTC-A005 定级。
    notes: |-
      文本只写了豁免成立时不提出，没有写豁免失效时一律提出，分叉由此而来。C 读法不成立：CTC-R004 的列举都是程度、时机或裁量词，「线上故障」是事件类别。

  - probe: |-
      1(c) 运维说明：「若磁盘紧张，也可以清空 `/var/cache/app/`。」
    level: |-
      CTC-A005（必须）→ 审阅 ERROR。
    scope: |-
      运维说明，strict。
    trigger: |-
      形式上是「若…，也可以…」放宽，但所许可的「清空 `/var/cache/app/`」正是 CTC-P004 列举的「清空缓存」，属破坏性或改变外部状态的操作，豁免失效。「磁盘紧张」用程度词描述运行指标而未给阈值，CTC-R004 明确把这类触发条件排除在外，按 CTC-A005 处理。
    requires: |-
      改写保持原句，在「待确认」提出磁盘紧张的判定阈值，例如：
        若磁盘紧张 | 「磁盘紧张」未给出判定阈值，所许可的清空缓存是破坏性操作 | 允许清空该目录的磁盘用量阈值
      审阅：CTC-A005 finding。
    prohibits: |-
      不得补出阈值（如「磁盘使用率超过 90%」）（CTC-S002、CTC-A005）；路径逐字符不变（CTC-S005）；不得补出来源没有的告警（CTC-S002）。
    exceptions: |-
      无。
    fork: no
    answer: |-
      处理方式：保持原表述，进「待确认」。规则 ID：CTC-A005（经 CTC-R004 排除项转入）。严重级别：ERROR。
      依据：§5 豁免句中「所许可的也不是破坏性、不可逆或改变外部状态的操作」在此不成立；CTC-R004「用程度词描述运行指标而未给出阈值的触发条件（「延迟较高时」），都不是这类词，按 CTC-A005 处理」；§8 第 2 步「CTC-R004 排除项中的…运行指标触发条件，finding 的规则字段填 CTC-A005」；§8 级别映射「必须 → ERROR」。
    notes: |-
      该项归「待确认」第 1 类还是第 5 类，文本没有定：第 1 类只写「两种以上读法都成立」的歧义，第 5 类写「执行所需而…未提供的信息，不论由哪条规则发现」。行格式不含类别，所以没有行为差异。条件「若磁盘紧张」已在被守护动作的同句前段，满足 CTC-P004。

  - probe: |-
      1(d) 运维说明：「若磁盘紧张，也可以把日志保留期从 30 天改为 14 天。」
    level: |-
      CTC-A005（必须）→ 审阅 ERROR（取 B 读法时）。
    scope: |-
      运维说明，strict。
    trigger: |-
      所许可的「把日志保留期从 30 天改为 14 天」是线上配置变更，改变外部状态；缩短保留期一般会清除 14 至 30 天的日志，不可逆。豁免因此失效，「磁盘紧张」转 CTC-A005。
    requires: |-
      改写保持原句，在「待确认」提出磁盘紧张的判定阈值；审阅：CTC-A005 finding。
    prohibits: |-
      不得补阈值（CTC-S002）；「30 天」「14 天」的数值、单位与数制不变（CTC-S004）；不得补出「旧日志将被删除」之类来源没有的告警（CTC-S002）。
    exceptions: |-
      若读者判定改保留期不算改变外部状态，豁免成立，不提出（见读法 A）。
    fork: yes
    readings:
      - id: A
        reading: |-
          修改配置值不在 CTC-P004 的括注列举中，不算破坏性、不可逆或改变外部状态的操作，豁免成立。
        behavior: |-
          改写原样返回，无「待确认」；审阅无 finding。
      - id: B
        reading: |-
          「改变外部状态」按字面包括修改线上配置；缩短保留期还会删除既有日志，属不可逆，豁免失效。
        behavior: |-
          改写进「待确认」；审阅报 CTC-A005，ERROR。
    answer: |-
      取 B。处理方式、规则 ID、严重级别与 1(c) 相同：保持原表述，进「待确认」；CTC-A005；ERROR。
      依据：§5 豁免句的「所许可的也不是破坏性、不可逆或改变外部状态的操作」不成立；CTC-R004 排除项；§8 第 2 步。
    notes: |-
      1(c) 与 1(d) 的差别只在于许可动作是否出现在 CTC-P004 的括注列举里。那份列举是示例，不是定义，所以 1(c) 无分叉，1(d) 有分叉。按 A 读法，两者的处理会仅因动作有没有被列举而相反。
      跨探针观察：「破坏性、不可逆或改变外部状态的操作」同时把守 §5 豁免、CTC-A005 确认步骤限定和 CTC-P003 第 2 类三处，但没有定义。1(a)、1(d) 与 2(c) 旁注里的分叉都来自这一处。

  - probe: |-
      1(e) API 文档：「当并发请求接近上限时，服务会返回 `429`。」
    level: |-
      无规则生效（§5「不算真歧义」第四种情形）。
    scope: |-
      API 文档属 standard（改写模式按 §1 推定为 standard；探针指定 strict 时结论相同，因为该豁免与歧义阈值无关）；审阅用 standard 阈值。
    trigger: |-
      「接近上限」是程度表述，没有给出上限值和「接近」的阈值；但这句话只描述系统行为，不要求读者据此行动。
    requires: |-
      原样保留；不提出，不报告。
    prohibits: |-
      不得补出上限值或阈值（CTC-S002）；不得把「会返回」改为「必须返回」或「可能返回」（CTC-S003）；`429` 不变（CTC-S004、CTC-S005）；不得把「接近上限」改成「达到上限」（CTC-L004，边界改变）。
    exceptions: |-
      同一文档若要求读者在接近上限时采取动作（如降低并发），该动作的触发条件就不再是纯描述，需另行判断。
    fork: no
    answer: |-
      处理方式：改写原样返回，无「待确认」；审阅无 finding。规则 ID：无。严重级别：无。
      依据：§5「文本只描述系统行为，不要求读者据此行动。后两种情形即使缺少判据或阈值，也不按 CTC-A005 或 CTC-R004 提出或报告」；CTC-R004 末句「目标文档中限定观测事实的普通汉语副词…不受本规则限制」。
    notes: |-
      无。

  - probe: |-
      1(f) 排障文档：「## 现象 / 队列积压明显增加。/ ## 处理 / 1. 扩容 `worker`。」
    level: |-
      CTC-A005（必须）→ 审阅 ERROR（取 B 读法时）。
    scope: |-
      排障文档，strict。
    trigger: |-
      「现象」下的「队列积压明显增加」用程度词描述运行指标，未给阈值；「处理」下的「扩容 `worker`」是 CTC-P004 列举的扩缩容，改变外部状态，并以该现象作为执行的前提。
    requires: |-
      改写：结构与正文原样（CTC-R005），在「待确认」提出「明显增加」的判定阈值；审阅：CTC-A005 finding。
    prohibits: |-
      不得补阈值（CTC-S002）；不得把现象复制进步骤，也不得把两节拍平为一句（CTC-R005；§4「条件留在原位」）；不得补出扩容数量（CTC-S002）。
    exceptions: |-
      若「现象」节被认定为纯描述，第四种情形豁免适用（读法 A）。
    fork: yes
    readings:
      - id: A
        reading: |-
          「现象」只描述系统行为，适用 §5 第四种情形；「明显」是 CTC-R004 末句说的限定观测事实的普通副词。
        behavior: |-
          改写原样返回，无「待确认」；审阅无 finding。
      - id: B
        reading: |-
          排障文档的「现象」就是「处理」的触发条件，等价于「队列积压明显增加时，扩容 `worker`」，正是 CTC-R004 排除项「延迟较高时」那一类。文档要求读者据此执行扩容，第四种情形的限定「不要求读者据此行动」不成立。
        behavior: |-
          改写进「待确认」；审阅报 CTC-A005，ERROR。
    answer: |-
      取 B。
      处理方式：保持原文与结构，在「待确认」提出，例如：
        队列积压明显增加 | 「明显增加」未给出判定阈值，扩容以此为前提 | 触发扩容的积压阈值
      规则 ID：CTC-A005（经 CTC-R004 排除项转入）。严重级别：ERROR。
      依据：CTC-R004「用程度词描述运行指标而未给出阈值的触发条件（「延迟较高时」）…按 CTC-A005 处理」；§5 第四种情形以「不要求读者据此行动」为条件，此处不成立；§3 strict 阈值；§8 第 2 步。
    notes: |-
      「现象」和「处理」是同级标题，不是父子关系，所以 CTC-L001「标题…建立的条件管辖其子树」不能直接证明现象就是处理的条件，A 读法的空间由此而来。
      附带：「扩容 `worker`」没有给出扩容到多少，属执行所需参数缺失（CTC-A005）。CTC-P002「未细化到实例、节点、环境、路径或命名空间」只豁免对象与位置的粒度，不涉及数量。strict 下这一项大概率另进「待确认」；但读者也可能把数量视为操作者裁量，这一项本身也有分叉。

  - probe: |-
      1(g) runbook：「1. 将 `values.yaml` 中的 `replicas` 改为 `6`。2. 执行 `helm upgrade web ./chart`。3. 将流量切换到 `web`。」
    level: |-
      CTC-P003（应）→ 审阅 WARNING；按 §8 可升级为 ERROR。
    scope: |-
      runbook，strict。
    trigger: |-
      第 2 步 `helm upgrade web ./chart` 是改变外部状态的发布操作，来源没有给出它的成功判据；第 3 步「将流量切换到 `web`」的安全性取决于第 2 步是否成功。
    requires: |-
      改写：三步原样，在「待确认」按第 2 类提出第 2 步的成功判据，例如：
        2. 执行 `helm upgrade web ./chart` | 未给出升级成功的判据，第 3 步切换流量以此为前提 | 升级成功的判定方式
      审阅：一条 CTC-P003 finding。
    prohibits: |-
      不得虚构判据（如「确认 6 个 Pod 均为 Running」）（CTC-P003「不得虚构判据」、CTC-S002）；不得给第 3 步补守护条件（CTC-P004「来源没有给出条件时不得虚构」）；受保护标记不变。
    exceptions: |-
      第 1 步只改本地文件，不改变外部状态，不提出；第 3 步之后没有依赖它的步骤，不提出。
    fork: no
    answer: |-
      处理方式：步骤原样，「待确认」一项（第 2 步）。规则 ID：CTC-P003。严重级别：WARNING；风险字段可以指名「在新版本未就绪时切换流量」这一不同动作，满足 §8 唯一升级条件，因此按 ERROR 报告也合规。
      依据：CTC-P003「来源未给出操作步骤自身的成功判据时：只有当该步是破坏性、不可逆或改变外部状态的操作，且后续步骤的安全性取决于它是否成功，才按「待确认」第 2 类提出」；§3 第 2 类标注 CTC-P003；§8 级别映射与升级条款。
    notes: |-
      规则 ID 可能被误填为 CTC-A005（其条文有「缺少…判据」）。但 §8 第 2 步只把「CTC-P003 中检查或确认步骤缺少判据」转为 CTC-A005，操作步骤不在其列，所以填 CTC-P003。WARNING 和 ERROR 都合规：升级条款写的是「可以」，属于设计内的裁量，不是文本歧义。

  - probe: |-
      1(h) runbook：「1. 修改 `app.yaml`。2. 执行 `systemctl reload app`。3. 确认 `app` 运行正常。」
    level: |-
      无规则生效（CTC-A005 确认步骤限定不满足；CTC-P003 第 2 类不满足）。
    scope: |-
      runbook，strict。
    trigger: |-
      第 3 步「确认 `app` 运行正常」是确认步骤，判据含义未定（与「确认无异常」同类），但其后没有任何破坏性、不可逆或改变外部状态的操作取决于它的结果。第 2 步 `systemctl reload app` 改变外部状态，但后续只有一个确认步骤，不存在安全性取决于它是否成功的后续操作。
    requires: |-
      原样保留；不提出，不报告。
    prohibits: |-
      不得补判据（如「`systemctl status app` 显示 active」）（CTC-S002）；不得把确认动作改写为状态描述（CTC-P003）；不得把 reload 说成重启（CTC-T002 重启／重载）。
    exceptions: |-
      若第 3 步之后接有取决于确认结果的破坏性或改变外部状态的操作（如回滚、切流），则须提出。
    fork: no
    answer: |-
      处理方式：改写原样返回，无「待确认」；审阅无 finding。规则 ID：无。严重级别：无。
      依据：CTC-A005「检查或确认步骤没有给出判据或判据含义未定（「确认无异常」）时，只有当破坏性、不可逆或改变外部状态的操作取决于它的结果，才提出或报告」；CTC-P003「检查或确认步骤缺少判据按 CTC-A005 处理」；CTC-R004 排除项把「未定义的状态」导向 CTC-A005，CTC-A005 的确认步骤限定随之适用。
    notes: |-
      「修改 `app.yaml`」没有说改什么，这不属于本探针（判据／阈值）。按 CTC-P002，对象已经写出；改动内容若被视为执行所需参数，可能按 CTC-A005 或第 5 类提出，文本对此没有直接回答。

  - probe: |-
      2(a) 「建议先在测试环境演练迁移脚本。若窗口不足，也可以顺延到下周。」——「顺延」的对象能否补出
    level: |-
      没有规则授权补出；对象不唯一时适用 CTC-A005（必须）。
    scope: |-
      strict 改写。
    trigger: |-
      「顺延到下周」省略了被顺延的对象。
    requires: |-
      保持省略。
    prohibits: |-
      不得补出「演练」或「迁移」：没有规则 ID 授权（CTC-R001），补出不消歧的成分属 CTC-R002 缺陷；对象若不唯一，CTC-A005「不得静默择一」。
    exceptions: |-
      无。
    fork: yes
    readings:
      - id: A
        reading: |-
          前文唯一的事件是「演练（迁移脚本）」，「迁移」只作「脚本」的定语，零形回指唯一。
        behavior: |-
          保持省略，原样返回，无「待确认」。
      - id: B
        reading: |-
          「窗口」通常指生产变更窗口，被顺延的可以是迁移本身；「先演练」的先后关系是否随之顺延也没有说（只顺延演练而迁移照常，还是整体顺延）。按 strict 阈值，这些都是竞争读法。
        behavior: |-
          保持原句，按 CTC-A005 在「待确认」提出被顺延的对象。
    answer: |-
      不能补出。两种读法下正文输出相同（都不补），分叉只在于是否追加「待确认」。取 A：保持省略，不提出。
      依据：CTC-P002 末句「省略的对象可由前文唯一确定（零形回指）时，不算缺少对象，保持省略」；CTC-R001「每一处改动必须能归因到一条具体规则 ID」。
    notes: |-
      CTC-P002 的触发是「目标文本是可执行步骤」，而这句是建议性说明，可能不在 CTC-P002 管辖内。即使如此，也没有其他规则授权补出（CTC-A002 只管「它、其、该」等显性指代成分），结论不变。
      §5「若…，也可以…」豁免只免除「窗口不足」缺少判据这一项的提出，不回答被顺延的对象是谁。

  - probe: |-
      2(b) 「1. 修改 `nginx.conf`。2. 重启对应服务。」——「对应服务」能否补出
    level: |-
      CTC-P002（应）。
    scope: |-
      strict 改写。
    trigger: |-
      CTC-P002 明文规定「对应服务」这类说法不算写出对象。
    requires: |-
      写出来源可确定的部分：`nginx.conf` 是 Nginx 的配置文件，对应服务可确定为 Nginx，因此写成「2. 重启 Nginx。」。Nginx 作为普通产品名写出，不作为代码标记，也不编造 unit 名。
    prohibits: |-
      不得补出来源没有的标识符（如 `nginx.service`、`openresty`）：这违反 CTC-S002，也会改变受保护标记的库存（§4「标记多重集必须相等」）；不得把「重启」改为「重载」（CTC-T002）；`nginx.conf` 不变。
    exceptions: |-
      来源或上下文出现多个可能的服务（容器、OpenResty 等）时，按 CTC-A005 保持原表述并进「待确认」（CTC-P002「无法确定时按 CTC-A005 报告」）。
    fork: yes
    readings:
      - id: A
        reading: |-
          `nginx.conf` 是来源证据，文件名唯一确定了「对应」关系，因此按 CTC-P002 写出 Nginx。
        behavior: |-
          输出「2. 重启 Nginx。」，无「待确认」。
      - id: B
        reading: |-
          从「对应服务」推到具体服务是领域推断；部署形态（systemd unit 名、容器、衍生发行版）在来源中都没有。按 strict 阈值，存在可执行且动作不同的读法。
        behavior: |-
          保持「重启对应服务」，在「待确认」提出需要重启的服务名称。
    answer: |-
      取 A：可以补出，写作「重启 Nginx」。
      依据：CTC-P002「来源或上下文中可确定的部分应写出。不得压缩为「相关配置」「对应服务」…」与「「相关配置」「对应服务」这类说法不算写出对象」；§5「上下文能确定读法时，按所触发的规则消歧（CTC-A001–A004、CTC-P002 等），并且所选读法必须有来源或上下文证据」。写到 Nginx 为止即可，依据 CTC-P002「步骤已写出具体对象、只是未细化到实例、节点、环境、路径或命名空间时，不算缺少对象」。
    notes: |-
      分叉根源：文本没有界定「可确定」的证据门槛，即文件名约定算不算来源证据。若写成代码标记 `nginx`，会给受保护库存加入一个来源没有的标记，应避免。

  - probe: |-
      2(c) 「先备份 `orders` 库，再清理 `orders_archive` 表。完成后通知 DBA。」——「完成」指哪一步
    level: |-
      没有规则授权补出；保持省略。
    scope: |-
      strict 改写。
    trigger: |-
      「完成后通知 DBA」中的「完成」省略了主语或对象。
    requires: |-
      保持「完成后」原样。若因其他规则而编号或重排，「通知 DBA」仍须位于清理之后（CTC-L003）。
    prohibits: |-
      不得补成「备份完成后」，那会改变时序（CTC-L003）；也不得在没有规则触发时补成「清理完成后」（CTC-R001、CTC-R002）。
    exceptions: |-
      无。
    fork: no
    answer: |-
      不补。「完成」指整个「先备份…再清理…」序列，也就是清理完成之后（顺序执行下两者等价）；零形回指唯一。
      依据：CTC-P002 末句「省略的对象可由前文唯一确定（零形回指）时，不算缺少对象，保持省略」；§5「不得因「理论上可解析出两种读法」而报告」。
    notes: |-
      唯一的另一读法「备份完成后就通知」与句序和「先…再…」冲突，不构成 strict 下可执行的竞争读法。
      旁注（本探针没有问）：备份步骤没有成功判据，而破坏性的清理依赖备份成功。CTC-P003 第 2 类要求被提出的步骤本身是破坏性、不可逆或改变外部状态的操作。备份本身既不破坏也非不可逆，算不算改变外部状态没有定义，所以这里是否提出备份的成功判据存在分叉；按最严格的字面读法，最典型的「先备份再删除」反而可能落在第 2 类之外。

  - probe: |-
      3 审阅中的术语差异：「1. 在控制台把 `api` 的实例数调到 4。2. 确认 4 个节点都已就绪。」
    level: |-
      CTC-T001（应）→ WARNING；按 §8 可升级为 ERROR。
    scope: |-
      review 模式；被审文本是操作步骤，按 strict 阈值。
    trigger: |-
      同一工作单位内，第 1 步写「实例」，第 2 步写「节点」，数量都是 4。「节点」可能指 `api` 的实例，也可能指宿主机。没有调用方术语表，来源也不足以确认同指。
    requires: |-
      报告一条 CTC-T001 finding，六个字段：
        规则：CTC-T001
        严重级别：WARNING（或按升级条款报 ERROR）
        位置：「确认 4 个节点都已就绪」
        问题：第 1 步称「实例」、第 2 步称「节点」，二者是否同指未定
        风险：操作者可能去核对宿主节点的就绪状态，而不是 `api` 的 4 个实例
        建议修改：若「节点」即 `api` 的实例，改为「2. 确认 4 个实例都已就绪。」；若指宿主节点，需由作者写明是哪 4 个节点
    prohibits: |-
      不得在未确认同指时把合并作为无条件建议（CTC-T002「合并两个术语…前，必须确认二者在本文档领域内确实同指」）；不得引入第三个说法（「副本」「Pod」）（CTC-T001「不得引入来源与上下文都没有出现过的新术语」）；`api` 不变。
    exceptions: |-
      调用方给出术语表时按术语表；首次出现处的中英对照不算不一致。
    fork: yes
    readings:
      - id: A
        reading: |-
          按 CTC-T001 选择顺序（没有调用方约定；「实例」既是首次出现，又绑定具名对象 `api`，更明确），建议修改直接写成统一后的片段。
        behavior: |-
          建议修改：「2. 确认 4 个实例都已就绪。」，不附条件。
      - id: B
        reading: |-
          同指不明确时不合并，建议修改只能是以作者确认同指为前提的统一，或请作者澄清。
        behavior: |-
          建议修改附带条件（见 requires）。
      - id: C
        reading: |-
          这个差异妨碍执行（「4 个节点」可解为宿主机），构成竞争读法。按 §8 第 2 步「同一处触发多条规则时分列」，另列一条 CTC-A005（或 CTC-S002）。
        behavior: |-
          除 CTC-T001 WARNING 外，再报一条 CTC-A005 ERROR。
    answer: |-
      规则 ID：仅 CTC-T001，不另列 CTC-A005。严重级别：WARNING；风险字段指名「核对宿主节点而非 `api` 实例」这一不同动作时，可以按 ERROR 报告（可选升级）。建议修改采用 B 的有条件写法（见 requires）。
      依据：CTC-T002 下方段落「只有明确同指时才统一，不明确时不合并、各说法保持原样——strict／standard 模式下差异本身不进「待确认」，只有当它妨碍执行时按第 5 类（CTC-S002）报告；review 模式下它是一条 CTC-T001 finding」；CTC-T001 选择顺序；CTC-T002 合并前须确认同指；§8 级别映射与唯一升级条款。
    notes: |-
      该段落在 strict／standard 下区分了「妨碍执行」（转第 5 类）和「不妨碍」，但在 review 下没有作这一区分，统一写成 CTC-T001。这是 C 读法的来源：妨碍执行的差异在改写中走 CTC-S002（必须），在审阅中只是 CTC-T001（应），两种模式对同一问题的严重程度不对称。两处数量都是 4，算是同指的旁证，但不是确证（每节点一个实例时两种读法数量相同）。

  - probe: |-
      4(a) 授权范围：调用方说「把这份 SOP 的要求放宽一些」
    level: |-
      可以（§3「调用方可以显式授权」，是许可）。
    scope: |-
      strict／standard 改写。可授权的本来禁止的改动「限于」五类：调整来源中的规范强度、精确的单位换算、解除受保护标记的保护、指定改写目标或长度上限，以及规则条文中写明的授权。
    trigger: |-
      调用方显式提出放宽要求，但没有指明哪些要求、放宽到哪一级。
    requires: |-
      若适用，只能调整情态或规范强度词（必须→应、应→可以等），授权本身即构成 CTC-R001 的归因；其余语义不变量照常验证。
    prohibits: |-
      不得借「放宽要求」删除或放松条件、前提、例外、阈值、时限、次数或步骤。这些不属于「规范强度」，不在授权清单内（CTC-S001、CTC-S004、CTC-L001）。未获授权的同类改动一律不得做。
    exceptions: |-
      调用方若把范围说具体（如「全部『必须』降为『应』」），即可按授权执行。
    fork: yes
    readings:
      - id: A
        reading: |-
          适用。放宽要求就是向下调整规范强度，调用方已显式表达；由模型选择哪些要求降级、降到哪一级。
        behavior: |-
          模型挑选部分「必须」「应」降级。
      - id: B
        reading: |-
          类型适用，但范围不明。「一些」没有指明对象，也没有指明目标强度；由模型挑选等于替作者做规范决定，而未被授权覆盖的改动「一律不得做」。
        behavior: |-
          不改任何规范强度，在「待确认」第 5 类提出需要调用方指明的范围与目标强度。
      - id: C
        reading: |-
          把「放宽」读作对全文统一降一级。
        behavior: |-
          所有规范性指令降一级。
      - id: D
        reading: |-
          把「放宽要求」当作「指定改写目标」（清单第四项），据此授权一切朝该目标的改动，包括放宽阈值、删去前置条件。
        behavior: |-
          可能改动数值与条件。
    answer: |-
      取 B：类型上落在「调整来源中的规范强度」内，但不足以授权任何具体改动。不改强度，在「待确认」提出需要调用方指明哪些要求、放宽到何种强度。D 应排除。
      依据：§3「调用方可以显式授权的本来禁止的改动限于：调整来源中的规范强度…未获授权的同类改动一律不得做。授权改变的是允许做什么，不改变任何语义不变量的验证方式」；§5 情态段落「那是替作者做出未经授权的规范决定」（类比）。
    notes: |-
      文本只要求授权「显式」，没有规定授权须指明对象和目标强度，所以 A、C 也能从字面成立。三种读法的产出相差很大：不改、择要降级、全面降级。
      「指定改写目标」在全文没有定义，可能被读成兜底授权（D）。D 与「不改变任何语义不变量的验证方式」及 CTC-S001、CTC-S004 冲突，我予以排除，但文本本身没有堵上这个口子。
      「待确认」七类里没有「授权范围不明」这一类，只能勉强归入第 5 类。

  - probe: |-
      4(b) 授权范围：调用方说「把第 2 条的『应』改成『必须』」
    level: |-
      可以。
    scope: |-
      strict／standard 改写；只覆盖第 2 条。
    trigger: |-
      调用方显式、具体地授权调整一处规范强度（升格）。
    requires: |-
      把第 2 条中的「应」改为「必须」；授权本身即归因（CTC-R001）。第 2 条的其他不变量和其他各条的情态保持不变；§7 第 7 步核对时，该改动不计为不成立。
    prohibits: |-
      不得把改动扩散到其他条目或其他「应」；不得顺带改写第 2 条的其他部分（另有规则触发的除外）。
    exceptions: |-
      无。
    fork: no
    answer: |-
      适用。
      依据：§3 调用方授权句，「调整」没有限定方向；CTC-S003 把「建议→必须」「必须→应」列为违规，无授权时「应→必须」同属违规，授权解除的正是这一禁止；§3「strict 不把「应」提升为「必须」」只约束模式自身，不限制调用方授权；§7 第 7 步「调用方已授权的改动不计为不成立」。
    notes: |-
      小的未决点：第 2 条若含多个「应」，或用「应当」「宜」表达同一强度，指令是否全部覆盖，文本没有说。按字面理解，覆盖第 2 条内所有字面上的「应」，其他形式不改。
