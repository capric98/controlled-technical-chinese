reviewer: adversarial
model: claude-opus-5-5
files_read:
  - 'dev/prompts/si5-adversarial.md'
  - 'dev/inbox/si5/base/SKILL.md'
  - 'dev/inbox/si5/cand/v1/SKILL.md'
  - 'dev/inbox/si5/cand/build.py'
  - 'dev/inbox/si5/probes/probes.yaml'
  - 'dev/inbox/si5/probes/resolutions.yaml'
  - 'eval/reports/raw/si5-probe-base-r{1,2,3}/*.claude.json'
  - 'eval/reports/raw/si5-selfhost-base-r{1,2}/SH-base.claude.json'
  - 'eval/gold/gold-semantic.yaml (G-S-001)'
  - 'eval/gold/gold-rendering.yaml (G-R-012)'
  - 'eval/gold/gold-ambiguity.yaml (G-A-002)'
  - 'eval/gold/gold-logic.yaml (G-L-012)'
  - 'docs/decisions/000-design.md §20'
  - 'docs/decisions/003-core-semantic-policy.md'
  - 'docs/decisions/004-rule-set-adjudications.md'
  - 'docs/decisions/009-si4-criteria-bounds-metric-conditions-terminology.md'
edits:
  # ------------------------------------------------------------------ N1、N2
  - id: N
    semantic_change: |
      N1、N2 只换名，共两处：§3 授权清单「调整道义强度（规范强度）」改为「调整规范强度」；CTC-S003 三元组第二项「道义强度」改为「规范强度」。
      没有多允许或多禁止任何改动。S003 的触发、要求与「必须」级别不变；授权清单的项目数与范围不变。改动后全文只剩「规范强度」一个名称，与 frontmatter 和 §3 示例一致。
      副作用：唯一只能读作「来源文本的义务／许可强度」的术语「道义强度」被删掉。现在「规范」一词既用在「规范强度」（指来源的情态），也用在 §7「本技能自身的规范词表」（指技能自己的必须／应／可以），二者只靠上下文区分。
    level_change: none
    evidence_supports: partly
    evidence_note: |
      自宿主确实报告了一个概念两个名称：si5 base r1 的 finding 5；009 的提案 22 记为 si2 起多数运行都报。但同一条 finding 推荐的是反方向（统一为「道义强度」），理由正是「规范强度」可能被读成 §6「级别」栏里的规则级别。
      M2 选了「规范强度」。这是维护者决定，本审阅不推翻。对「两个名称」这一失败，两处精确替换已是最小改动，frontmatter 未动。
      无论改动前后，都没有运行证据表明运行时把 S003 或授权清单读错；混淆风险目前只是假设。
    clarification_or_new: clarification
    counterexamples:
      - kind: false_fire
        task: 改写
        mode: standard
        input: |
          调用方说明：这是内部 README，规范强度可以放宽一些，读着顺就行。
          来源：提交前必须运行 `make test`，否则 CI 会拒绝合并。
        candidate_behaviour: >-
          授权清单现在只写「调整规范强度」，调用方的原话逐字命中。模型可能把它当作显式授权，把「必须」降为「应」或「建议」。
        why_wrong: >-
          调用方要放宽的是本技能的控制力度（风格上的「规范」），并没有授权削弱作者写下的义务。把「必须」改弱违反 S003，而且「否则 CI 会拒绝合并」说明这项义务是真实约束。基线括注「（规范强度）」里也有这个词，所以风险基线已有；候选删掉了只能读作情态的锚点「道义强度」，风险略增，并非新增失败面。
      - kind: missed_fire
        task: 审阅（检查另一模型的改写）
        mode: review
        input: |
          来源：上线前建议做一次全量备份。
          改写：上线前应做一次全量备份。
        candidate_behaviour: >-
          审阅者若把 S003 中的「规范强度」对应到本技能自己的三级词表（必须／应／可以），会把「建议」和「应」归入同一级，认定规范强度不变，于是不报 S003。
        why_wrong: >-
          「建议」是推荐，「应」是默认要求，强度和言语行为类型都变了，按 S003 属于违规（003 §5：来源的情态按类别保持，不归一到技能自己的词表）。实际发生的可能性低：三元组里的「言语行为类型」和 §7「不归一到本技能自身的规范词表」都能挡住。列出它，是因为 003 §5 把这种混淆列为发布前必须检查的自宿主隐患。
    conflicts:
      - >-
        与 003 §5 有张力。该决定要求：技能描述自己的规范词表时，不能被误读为针对目标文档的规则。候选让「规范强度」（目标文档）与「规范词表」（技能自身）共用「规范」一词。不过 §3「模式改变的是歧义阈值，不是规则级别」和 §7 翻译附加条款足以区分二者，不构成矛盾。
    verdict: accept
    rationale: |
      N 是纯换名：语义、级别和触发都不变，落实的是 M2。
      两个反例都依赖误读，而且现有条文已能挡住：S003 的言语行为类型、§3「不是规则级别」、§7「不归一到本技能自身的规范词表」。基线括注里本来就有这个词，候选没有引入新的失败面。
      没有运行证据支持进一步改措辞，因此不判 revise。可选的更窄写法见 other_observations。

  # ------------------------------------------------------------------ V1
  - id: V1
    semantic_change: |
      review 模式下，同指不明的术语差异原为「一条普通 finding」，没有规则 ID，与 §8「不得报告没有规则 ID 的 finding」冲突。候选改为按 CTC-T001 报告：级别「应」，默认 WARNING；若风险字段写明操作者会因此做出的不同动作，可按 §8 升为 ERROR。
      实质效果：review 模式下，T001 的触发从「同一概念」扩到「可能是同一概念」。
      strict／standard 的处理不变：差异不进「待确认」，只有妨碍执行时才按第 5 类报告。
      这类 finding 的严重级别由「未定」变为 WARNING（可升级）。
    level_change: none
    evidence_supports: 'yes'
    evidence_note: |
      基线 TV-01 3/3、TV-02 3/3 都把这类差异报为 CTC-T001，其中 TV-02 r3 按 §8 升为 ERROR；没有一次报为 CTC-A005。
      si5 base 自宿主 r1 的 finding 2 正是报告缺少规则 ID（1/2）；009 的提案 21 记录了 si4 中的多次复现。
      004 §3（同指不明时报告、不合并）和 §6（T001 可升级，因为术语不一致可能带来操作后果）都支持这样落地。
      这是让文本对齐运行时行为的最小改动，属于澄清。
    clarification_or_new: clarification
    counterexamples:
      - kind: missed_fire
        task: 审阅
        mode: review
        input: |
          ## 安装
          1. 运行 `tool init` 创建工作区。
          2. 配置文件位于项目根目录的 `.tool/config.yaml`，按需修改。
        candidate_behaviour: |
          候选句为「strict／standard 模式下差异本身不进「待确认」，只有当它妨碍执行时按第 5 类（CTC-S002）报告；review 模式下按 CTC-T001 报告。」。review 分句删掉了基线的主语和系词（「它是一条…finding」）。剩下的谓语「按 CTC-T001 报告」与前一分句的「按第 5 类（CTC-S002）报告」形式平行，可能被读成同样受「只有当它妨碍执行时」约束。
          本例中「工作区」与「项目根目录」是否同指不明，但路径已给全，不妨碍执行；按上述读法就不会报告。
        why_wrong: >-
          M7 的决定是：review 模式下同指不明的差异按 T001 报告，不附「妨碍执行」条件。基线的「review 模式下它是一条普通 finding」不会产生这种继承读法，候选的省略引入了条件作用域歧义。TV-01、TV-02 中的差异都妨碍执行，运行时尚未出现这种读法，所以这属于措辞层面的风险。
      - kind: false_fire
        task: 审阅
        mode: review
        input: |
          ## 更新 `app` 配置
          1. 修改 `app.yaml` 后执行 `systemctl reload app`。
          2. 重启完成后，确认 `/healthz` 返回 `200`。
        candidate_behaviour: >-
          把第 2 步的「重启」与第 1 步的 `reload` 当作同指不明的术语差异，按 CTC-T001 报告（默认 WARNING），建议修改倾向于「统一术语」。
        why_wrong: >-
          重启／重载正是 T002 明列不得合并的一对。这里的分歧不只是用词：一种读法是作者漏写了一次重启，操作者应再执行 restart；另一种是笔误，检查的就是 reload 的结果。两种读法导致不同动作，满足 CTC-A005 的触发，按 003 §1 应定为 ERROR。候选只写了 T001 这一条路，规则 ID 和默认严重级别都偏轻，要报到 ERROR 只能靠审阅者主动按 §8 升级。基线运行没有出现这种情况：TV 两例既没有双报，也没有误合并。因此这是边界风险，不是已证实的失败。
    conflicts:
      - >-
        与 CTC-A005 的触发重叠。同指不明、且两种读法导致不同动作时，A005 自身的触发也成立；§8 第 2 步「同一处触发多条规则时分列」允许两条并列。候选没有说明 T001 是否排除 A005。M7 在 TV-01 的 fail_if 中把以 A005 报告判为失败，但这一点只写在 resolutions 里，SKILL.md 中没有。基线 6/6 都没有双报，没有失败输入，因此不建议增加排除句。
      - >-
        与 §3 第 5 类不矛盾。strict／standard 下，妨碍执行的差异按 CTC-S002 进「待确认」；改写输出本来就不写规则 ID（§3 输出契约），所以两种模式使用不同的规则 ID，在输出上看不出来。
    verdict: revise
    revised_wording: review 模式下它是一条 CTC-T001 finding。
    rationale: |
      方向（报为 T001）有充分的运行证据，也有维护者决定。
      修订只把基线的「普通」换成「CTC-T001」，保留主语「它」和系词，从而消除条件作用域的继承读法。相对基线，这比候选的改动更小；语义与候选的本意相同，不增加要求。
      如果维护者认为继承读法不现实，接受候选原文也可以：这里没有运行层面的失败证据。

  # ------------------------------------------------------------------ H1、H2
  - id: H
    semantic_change: |
      H1 改 CTC-A005 末句。检查或确认步骤缺少判据（或判据含义未定）时，原先只有当破坏性或不可逆操作取决于它的结果才报告；候选把「改变外部状态」的操作也算进来。于是不报告的范围缩小、报告增多：守护重启、扩缩容、发布、切流量、回滚的含糊检查都要报告。
      H2 改 CTC-P003 末句。操作步骤没有给出自身的成功判据时，原先只有该步是破坏性或不可逆操作，才按「待确认」第 2 类提出；候选改为只要该步改变外部状态就可能提出，前提仍是「后续步骤的安全性取决于它是否成功」。runbook 中几乎每个操作步骤都改变外部状态（改配置、apply、reload、重启、切流量），所以提出的范围会明显扩大。
      两处都不改变规则级别（A005 为必须，P003 为应）。H1、H2 中的「改变外部状态」都没有附 CTC-P004 的示例清单。
    level_change: none
    evidence_supports: partly
    evidence_note: |
      H1 有证据。基线 TH-01 3/3 报 A005，TH-02 3/3 进「待确认」，两者都是检查守护 restart；TV-02 中守护放量的「小流量验证通过后」也被报告。这些都是检查步骤，走的是 A005 这条路。H1 让文本对齐运行时，符合 M6 所说的「text only」。
      H2 没有证据。build.py 为 H2 引用的 TH-01、TH-02、TV-02 都是检查步骤缺判据（A005），没有一个探针测的是「非破坏性、但改变状态的操作步骤自身缺成功判据」（P003 第 2 类）。基线中，P3-01、P3-05 的 reload 步骤和 TH-01 的改配置步骤都没有按 P003 提出，说明运行时并没有在报这一类。因此 H2 不是「as the runtime already behaves」，而是会改变行为的新扩展。
      M6 的提问是「基线对守护重启、放量的检查也 3/3 报告」，问的是检查；但 009 中提案 26 把 A005 和 P003 的门槛并列，所以 M6 的字面范围也覆盖 H2。009 的维护者裁决 4 自己写过「widening it would report more」。
      就改动性质而言，H1 是澄清，H2 是新增；整组按 new 记。
    clarification_or_new: new
    counterexamples:
      - kind: false_fire
        task: 改写
        mode: strict
        input: |
          ## 发布 `web` v2.3
          1. 在 `deploy.yaml` 中把 `image.tag` 改为 `v2.3`。
          2. 执行 `kubectl apply -f deploy.yaml`。
          3. 执行 `kubectl rollout restart deploy/web`。
          4. 在网关上把 `web` 的流量权重从 `0` 调到 `100`。
          5. 在 `#release` 频道通报。
        candidate_behaviour: >-
          按 H2，第 1–4 步都改变外部状态，都没有成功判据，而且后一步的安全性都取决于前一步是否成功（apply 失败后再重启，重启失败后再切流量）。候选会按第 2 类连续提出 3–4 条「待确认」：apply 的判据、rollout 完成的判据、切流量前的就绪判据，可能还有改配置的判据。基线下这几步都不是破坏性或不可逆操作，因此什么都不提出；即使把 apply 算作覆盖，也只提 1 条。review 模式同理，会出现 3–4 条 P003 WARNING，风险字段写出不同动作时还可能升为 ERROR。
        why_wrong: >-
          P003 末句写明要「以免正常的流程文档产生成串的未决项」，H2 恰恰让成串的未决项回来了。009 的 B1 门槛表也把「review floods runbooks with ERROR findings」列为必须防止的风险。这份来源没有错，只是作者没给每一步写判据，这正是 P003 有意放过的情形。
      - kind: false_fire
        task: 审阅
        mode: review
        input: |
          ## 轮转 `api` 日志
          1. 执行 `logrotate -f /etc/logrotate.d/api`。
          2. 确认 `/var/log/api/` 下无异常后，在 `#ops` 频道通报完成。
        candidate_behaviour: >-
          H1 中的「改变外部状态」没有附 P004 的示例清单，而在共享频道发消息字面上也算改变外部状态，于是「无异常」被报为 CTC-A005/ERROR。基线下通报不是破坏性或不可逆操作，不会报。
        why_wrong: >-
          这是收尾检查，后面只跟一条通报，性质与 P3-01、P3-05 相同；按 si4 M5，没有破坏性操作取决于它的检查不报。M6 列举的是 restart、scaling、release，不包括通知。是否误报取决于模型如何理解不受限定的「改变外部状态」，可能性中等，需要候选运行验证。
      - kind: missed_fire
        task: 审阅
        mode: review
        input: |
          ## 主库切换后的收尾
          1. 确认新主库运行正常后，通知业务方可以恢复写入。
        candidate_behaviour: >-
          读者自己执行的动作只是「通知」，不在 P004 的清单内。候选可能据此认为没有改变外部状态的操作取决于这项检查，于是不报「运行正常」。
        why_wrong: >-
          这条通知会直接促使其他团队恢复写入，后果是状态改变，而且难以撤回；不同操作者对「运行正常」的判断不同，业务方恢复写入的时机也就不同。这不是 H 引入的回归，基线同样不报。把它与上一个反例放在一起看，可见「改变外部状态」对通知、沟通类动作的边界无法判定，两个方向都可能出错。这里不提新约束，只建议补探针。
    conflicts:
      - >-
        若接受 H2，P3-01、P3-05、TH-01 的第 1–2 步（改配置、reload）可能新出现 P003 finding。这三个探针只对第 3 步计分，所以不会判为失败，但违背 si4 M5 的意图。裁决者应检查候选在这三个探针上的运行，看是否出现针对第 1–2 步的 P003（本审阅没有读候选运行）。
      - >-
        若只接受 H1，A005 写「破坏性、不可逆或改变外部状态」，P003 写「破坏性或不可逆」，自宿主很可能报告「两个门槛」（si4 v3、v4 报过）。但两处门槛判断的对象不同：A005 看检查所守护的下游操作，P003 看操作步骤本身。作者明写了检查，说明那里本来就是一道门，判据含糊才构成真歧义；操作步骤不写判据，多半只是常态。门槛不同有原则依据，不算不一致。
      - >-
        P3-01、P3-05 在 H1 下仍然不报：第 3 步是最后一步，没有任何操作取决于它的结果；reload 发生在检查之前，不属于「取决于它的结果」的操作。只要模型不把「取决于」误读为「它验证的是哪个操作」，这两个探针就保持原样。
    verdict: revise
    revised_wording: |
      H1 照候选原文，CTC-A005 末句为：「检查或确认步骤没有给出判据或判据含义未定（「确认无异常」），而没有破坏性、不可逆或改变外部状态的操作取决于它的结果时，不提出、不报告。」
      不做 H2，CTC-P003 末句保持基线原文：「来源未给出操作步骤自身的成功判据时：只有当该步是破坏性或不可逆操作、且后续步骤的安全性取决于它是否成功，才按「待确认」第 2 类提出；其余操作步骤缺少判据不提出，以免正常的流程文档产生成串的未决项。检查或确认步骤缺少判据按 CTC-A005 处理。」
    rationale: |
      H1 有 3/3 的运行证据，而且只是让文本对齐运行时。H2 没有探针支撑，却直接放宽了 P003 当初为防止成串未决项而设的门槛；第一个反例在一份普通发布 runbook 上就能复现这一风险。
      撤回 H2 比候选更小，也不增加要求。但这比 M6 的字面范围窄（提案 26 把两行并列），需要维护者确认。
      另一条路是保留 H2：先预登记一个「普通 runbook、非破坏性操作步骤无判据」的探针，候选在其上 3/3 不新增 P003 项后再接受。

  # ------------------------------------------------------------------ D1
  - id: D1
    semantic_change: |
      §5「不算真歧义」新增两种情形，并写明二者缺少判据或阈值时不按 CTC-A005 或 CTC-R004 提出或报告：
      (a) 条件只放宽操作者可以做的事，默认动作不变（模板「若…，也可以…」）；
      (b) 文本只描述系统行为，不要求读者据此行动。
      对 A005（必须）而言，这收窄了触发：缺阈值、缺判据的条件只要属于 (a) 或 (b)，就不再进「待确认」，也不再出 finding。
      对 R004（应）而言，(b) 本来就不在其触发范围内（R004 只管规范性指令），属于重复；(a) 则是新的排除，许可句中的「必要时」「视情况」「条件允许时」不再报告。规则级别不变。
      (a) 的判定标准只看「放宽」和「默认不变」，不看被许可的是什么动作，也不看这项许可是否免除了来源原有的义务。
      D1 本身是排除项，所以本组 false_fire 指排除项被误用（应报而未报），missed_fire 指排除项该生效而未生效（误报仍然保留）。
    level_change: none
    evidence_supports: partly
    evidence_note: |
      针对的失败已经证实：基线 OR-01 3/3 就「较长」进「待确认」，OR-02 3/3 报 A005，OR-03 3/3 对纯描述报 A005；G-S-001、G-R-012 是对应的金标。M4、M5 是维护者决定，边界探针 OR-04、OR-05 已登记。
      证据不足之处在覆盖面。OR-01、OR-02、G-S-001 中被许可的都是更保守的做法（拆批、推迟），009 对提案 23 的原文也写作「a vague condition on a permitted, conservative option」。D1(a) 的判定标准却覆盖所有许可，包括免除来源义务或校验、实际降低安全门槛的许可，以及被许可的动作本身就是破坏性操作的情形。这些都没有测过。
      改动属于新增排除，不是澄清，因为它改变了必须级规则 A005 的触发范围。
    clarification_or_new: new
    counterexamples:
      - kind: false_fire
        task: 审阅
        mode: review
        input: |
          ## 生产变更
          1. 生产变更须经双人复核后执行。
          2. 情况紧急时，也可以先执行、事后补复核。
        candidate_behaviour: >-
          第 2 条完全符合 D1(a)：条件只放宽了操作者可以做的事（先执行），默认动作（先复核）不变，句式就是「…时，也可以…」。候选因此不报「情况紧急」这个缺判据的未定义状态；基线会按 A005 报告。
        why_wrong: >-
          这项许可免除的是来源自己规定的安全控制（双人复核），而「默认动作不变」对它起不到区分作用。逻辑上，「须复核；紧急时也可以事后补」等价于「情况不紧急时须先复核」，即一条触发条件含糊的义务，与 OR-04「若导出队列较长，须拆成多批提交」结构相同；按已接受的 si4 M4 和 OR-04 预期，应以 A005 报告。D1(a) 让报不报取决于同一语义写成义务式还是豁免式，两条维护者决定（si4 M4 与 si5 M4）在此冲突。不同操作者对「紧急」的判断不同，就会在复核与不复核之间分岔，结果是生产变更绕过门禁。这是本轮最强的反例。
      - kind: false_fire
        task: 改写
        mode: strict
        input: |
          发布前须在预发环境完整回归；若改动较小，也可以只跑冒烟测试。
        candidate_behaviour: >-
          逐字命中「若…，也可以…」模板，「较小」不进「待确认」。
        why_wrong: >-
          与上例相同，这是对一项义务性校验的豁免：「改动较小」决定的是完整回归这项义务何时生效。题面要求检查的「若…，可以跳过校验」也属于这一类，候选同样会放过。
      - kind: false_fire
        task: 审阅
        mode: review
        input: |
          ## 备份盘维护
          1. 每日 02:00 检查 `/backup` 所在分区使用率。
          2. 若磁盘紧张，也可以删除 `/backup/db/` 下 30 天前的备份。
        candidate_behaviour: >-
          命中 D1(a)，「磁盘紧张」不报告。
        why_wrong: >-
          被许可的是不可逆的删除，触发条件却含糊。有人在 60% 时删，有人到 95% 才删，这种分歧无法挽回。同一条件若写成义务（R4-07「磁盘占用偏大时，删除…」）会以 A005 报告。但按 M4 的字面（许可是有意留下的裁量），候选的行为符合决定，因此本条只作为待维护者确认的问题：M4 提问时只举了保守选项的例子，没有覆盖被许可的动作本身就是破坏性操作的情形。本条不写进 revised_wording。
      - kind: false_fire
        task: 审阅
        mode: review
        input: |
          ## `order-consumer` 积压排障
          ### 现象
          队列积压较多时，`order-consumer` 的消费延迟会明显上升，下游对账任务会超时。
          ### 处理
          1. 执行 `kubectl scale deploy/order-consumer --replicas=8`。
          2. 在 `#ops` 频道通报。
        candidate_behaviour: >-
          「现象」一节逐句看都只是在描述系统行为，句内没有要求读者行动，于是命中 D1(b)，「积压较多」「明显上升」都不报告。参照 OR-03 的 3/3，基线会报告。
        why_wrong: >-
          在排障文档里，「现象」借标题结构决定何时执行「处理」中改变状态的扩容，道理与 §4、CTC-L001 所说的结构条件相同；从全文看，读者正是要据此行动。候选没有说明「文本」以句、段还是全文为单位，按句判定就会漏报。至于题面提到的同句夹带要求（「网关会拒绝新连接，请提前扩容」），因为有「只」字限定，大概率不会被排除；借结构夹带要求才是更隐蔽的漏洞。可能性中等，需要候选运行验证。
      - kind: missed_fire
        task: 审阅
        mode: review
        input: |
          ## 排障
          1. 查看 `api` 错误日志，定位报错的请求。
          2. 必要时也可以联系值班 DBA 协助排查。
        candidate_behaviour: >-
          CTC-R004 行把「必要时」列为无判据词，本身没有例外；D1 则在 §5 说许可条件不按 R004 报告。两处冲突时，模型可能依从更具体的规则行（R004 的词表），仍然报告「必要时」。
        why_wrong: >-
          按 M4，这是给操作者多一个选项的许可，默认动作不变，不应报告。R004 行和 §8 第 2 步都没有指向 §5 的这条例外，排除可能失效，OR-01 一类的误报会以 R004 的名义保留下来。
      - kind: missed_fire
        task: 改写
        mode: strict
        input: |
          导出队列较长时，允许分批提交。
        candidate_behaviour: >-
          句中没有「也可以」，来源也没有写出默认动作。模型可能因为无法确认「默认动作不变」而不适用 D1(a)，继续就「较长」进「待确认」。
        why_wrong: >-
          这与 OR-01 是同一类许可：不分批就是整批提交，默认动作显然不变，按 M4 不应提出。D1(a) 把「默认动作不变」写成判定条件，却没有说明默认动作可以是隐含的。可能性中低。
    conflicts:
      - >-
        与 si4 M4 及 OR-04 的已接受预期冲突（见第一个反例）：豁免式许可在逻辑上等价于一条触发条件含糊的义务，D1(a) 不报，OR-04 要报。这是已接受决定之间的冲突，按 AGENTS.md 需要报告。
      - >-
        与 CTC-R004 行冲突：R004 行列出「必要时」「视情况」「条件允许时」等词，没有例外；D1 在 §5 为许可条件开了例外，而 R004 行和 §8 第 2 步都没有交叉引用。
      - >-
        可能吞并 CTC-R004 的词表。si4 M4 把 R004 的词定义为「把是否、何时、做多少留给读者」的词，这些词本身就表达裁量。R4-01 的「必要时手动触发切换」「视情况暂停…」是不带「也可以」的祈使句，可能被读成「条件只放宽可做的事」而被 D1(a) 排除，从而翻转 R4-01 的已接受预期（R004 3/3）。本审阅没有读候选运行，裁决者应检查 R4-01 是否漂移。009 中 R4-05（「条件允许时」）的来源若是许可句，也会受影响；该探针不在本审阅可读的文件范围内。
      - >-
        与 H1 有张力：检查守护重启要报告（H1），而「若…，也可以重启」这类许可条件不报告（D1(a)），两者的操作风险相同。但二者作用于不同构造（检查步骤与条件），不构成文本矛盾。
      - >-
        与 §2、§3 输出契约及「待确认」七类不矛盾：D1 只减少第 1、4 类条目。
    verdict: revise
    revised_wording: >-
      **不算真歧义**：一种读法在该领域不对应任何可执行操作；参数在运行时由外部唯一确定；条件只放宽操作者可以做的事、默认动作不变，且不免除来源规定的义务（「若…，也可以…」）；文本只描述系统行为，不要求读者据此行动。后两种情形缺少判据或阈值时，同样不按 CTC-A005 或 CTC-R004 提出或报告。不得因「理论上可解析出两种读法」而报告。
    rationale: |
      D1 针对的失败（OR-01、OR-02、OR-03 均为 3/3）是真实的，M4、M5 也授权了这个方向，所以不判 reject。
      修订只加一个限定「且不免除来源规定的义务」，把豁免式许可排除在 D1(a) 之外。这类许可在逻辑上等价于触发条件含糊的义务，已接受的 OR-04 与 si4 M4 要求报告它。
      修订后排除面比候选窄，不增加要求。OR-01、OR-02 的拆批和 G-S-001 的推迟都不免除任何义务（「建议」不是义务），仍被排除；OR-04、OR-05 不受影响。
      破坏性许可（删备份）、借结构夹带的描述（现象／处理）、R004 行的交叉引用，都列为待维护者确认或待探针验证，没有写进措辞，因为按现有已接受语义，无法把它们判为失败。

  # ------------------------------------------------------------------ S1
  - id: S1
    semantic_change: |
      CTC-R005 的要求句增加「独立告警块保持原位」。
      基线中，CTC-P004 说移动独立告警块「属于 CTC-R005 违规」，但 R005 只列了粒度项（标题层级、列表项数、表格行列……），不涉及位置。一个只移动、不改变粒度的告警块，按 R005 字面并不违规，P004 的归因因此落空。候选补上了这一条，使 R005 自身有条文可依。
      实际禁止范围不变：基线已经靠 P004 的交叉引用和 CTC-R001 禁止无归因的移动。规则级别仍为「应」（WARNING）；调用方明确要求改变格式时，仍按要求执行。
    level_change: none
    evidence_supports: 'yes'
    evidence_note: |
      文本层面的不一致可直接对照基线核实：P004 末句与 R005 条文对不上。
      009 记录提案 8「reported again in si4 self-hosting」。build.py 还引了 si3、si4 的三次自宿主（v1 r2、v3 r1、v8 r1），这些不在本审阅可读的文件内，未核对。si5 base 自宿主 0/2 报告此项；r1 的 finding 1 涉及 P004 与标题条件，与 R005 归因无关。
      G-L-012 的 rendering 不变量（把告警块并入第 3 步即判失败）为此提供了语义依据。
      这是补齐交叉引用的最小改动，属于澄清。
    clarification_or_new: clarification
    counterexamples:
      - kind: false_fire
        task: 改写
        mode: strict
        input: |
          ## 清理旧表
          1. 执行 `DROP TABLE orders_2023`。注意：执行前确认 `orders_2023` 已归档到 `s3://archive/orders/`。
          2. 在 `#dba` 频道通报。
        candidate_behaviour: >-
          「注意：」这一句可能被当作「独立告警块」，按 R005 的新句保持原位，前置条件于是仍留在 DROP 之后。
        why_wrong: >-
          它与动作同在一个列表项、同一段内，不是独立结构块。P004 要求前置条件出现在被守护动作之前（同句前段或紧邻的上一句），这里应当前移。S1 的「独立告警块」没有带上 P004 的界定（「警告：」「注意：」段落、告警框），容易被扩大到行内的「注意：」句。不过这种歧义在基线 P004 里已经存在（P004 自己也写了「移动它属于 CTC-R005 违规」），S1 只是在 R005 中再说一遍，增量风险低。即使误用，P004（必须，第 2 层）也高于 R005（应，第 4 层），按 §2 应以 P004 为准。
      - kind: missed_fire
        task: 审阅（检查另一模型的改写）
        mode: review
        input: |
          来源（纯文本，无 Markdown 结构）：
          故障切换时先暂停写入，待复制延迟降为 0 后提升备用库。

          警告：提升完成前不得恢复写入。

          改写：
          故障切换时先暂停写入，待复制延迟降为 0 后提升备用库，提升完成前不得恢复写入。
        candidate_behaviour: >-
          R005 的触发条件是「来源含 Markdown 结构时」，所列结构项不含普通段落，因此 R005 不触发，S1 也不适用。审阅者只能按 CTC-R001（无归因改动）报告，或者不报。
        why_wrong: >-
          P004 说移动这类块「属于 CTC-R005 违规」，到了纯文本来源，这一归因又落空了。不过语义没有丢失（禁令仍在），R001 也挡住了无归因改动，危害低，只影响归因的一致性。没有失败的语义后果，因此不建议为此扩大 R005 的触发。
    conflicts:
      - >-
        与 CTC-P004 不矛盾。P004 豁免独立结构块的前移要求，S1 要求它保持原位，两者方向一致；非独立块中的条件不受 S1 约束，P004 的前移要求照常适用。
      - >-
        与 CTC-P003 的合并授权存在边界问题。调用方授权合并步骤时，如果告警块夹在被合并的两步之间，「原位」就没有定义。R005 末句「调用方明确要求改变格式时按要求执行」可以兜住，但「限定步骤数」是否算「明确要求改变格式」没有写明。暂无失败输入，仅作记录。
      - >-
        与 §4「独立告警块管辖它所依附的整个流程（CTC-P004）」用词一致。
    verdict: accept
    rationale: |
      S1 修补了 P004 与 R005 之间的归因断点：不扩大实际禁止范围，不改变级别，也保留了调用方的格式授权。两个反例的增量风险都低，而且都源于 P004 原有的措辞。

other_observations:
  - >-
    N：可选的更窄写法是把 N1 改为「调整来源的规范强度」，把授权锚定在来源文本上，排除「调整本技能规则级别」这种读法（003 §5 所说的隐患）。只有当自宿主或探针（例如调用方说「规范强度可以放宽」）出现误读时才建议采用；目前没有运行证据。
  - >-
    V1：M7 在 TV-01、TV-02 的 fail_if 中把「以 CTC-A005 报告差异本身」判为失败，但 SKILL.md 中没有对应的排除句。基线 6/6 都没有双报，所以不建议补；如果候选运行出现 T001 与 A005 并列，再考虑。
  - >-
    H：建议预登记两个探针。第一个是普通发布 runbook，其中非破坏性的改状态步骤都没有判据，用来检验 H2 是否带回成串的 P003 finding 或「待确认」条目。第二个由两条检查组成，一条之后只跟 #ops 通报，另一条之后是「通知业务方恢复写入」，用来检验「改变外部状态」在沟通类动作上的边界。此外，裁决者应查看候选在 P3-01、P3-05、TH-01 上的运行，看是否有针对第 1–2 步（改配置、reload）的 P003 finding；这些探针只对第 3 步计分，单看分数发现不了。
  - >-
    D1：建议预登记四个探针。一是豁免式许可（「须双人复核；情况紧急时，也可以事后补复核」），预期 A005；二是破坏性许可（「若磁盘紧张，也可以删除旧备份」），预期待维护者确定；三是现象／处理结构，预期报告；四是用不带「也可以」的 R4-01 原句做回归，预期仍报 R004。
  - >-
    D1：M4 提问时只给了保守选项的例子（拆批），009 对提案 23 的表述也限定为 conservative option，D1(a) 的判定标准比 M4 的证据宽。破坏性许可是否报告，需要维护者单独裁决。
  - >-
    本审阅没有读候选版本的任何运行输出，也没有读其他审阅者的文件。凡是写明「需要候选运行验证」的地方，都是从文本推断出的风险，不是观测结果。
