reviewer: naturalness
model: claude-opus-5-5
files_read:
  - dev/prompts/si5-naturalness.md
  - dev/inbox/si5/base/SKILL.md   # 通过 diff 与候选逐行核对
  - dev/inbox/si5/cand/v1/SKILL.md
passages:
  - id: N1
    candidate_text: |-
      调用方可以显式授权的本来禁止的改动限于：调整规范强度、精确的单位换算、解除某个受保护标记的保护、指定改写目标或长度上限，以及规则条文中写明的授权（CTC-P003 的合并步骤、CTC-R005 的改变格式）。
    naturalness: 5
    quotes:
      - "「调整规范强度」去掉了基线「道义强度（规范强度）」的括注式双名。「道义」是逻辑学译名，用括注并列同义词是学术译文的写法；删去后，这里与 description「控制歧义、术语与规范强度」、§3 示例「作者意图的规范强度」用同一个词，满足本技能 T 族的自宿主要求。"
      - "「调整规范强度、精确的单位换算、解除某个受保护标记的保护……」各并列项都是名词性短语或动宾短语，读得通。"
    ambiguity:
      - "「规范」在中文里也指写作规范、项目规范（§2 第 5 层的「项目体例」一类），本技能又把「必须／应／可以」称为规则级别。去掉「道义」后，单看「调整规范强度」，可能理解为调整本技能规则的严格程度（如放宽 CTC-P003 的「应」），而不是调整来源中义务与许可的强度。上下文基本排除了这种读法：列表其余各项都是对输出文本的改动；§3 首段写明模式不改变规则级别；CTC-S003 三元组现在也用「规范强度」。属低风险。"
    over_control_risk:
      - target_text: "调用方指令：「这次按宽松标准改写，判据绑定不必那么严。」来源为含「确认状态为 `READY` 后再继续」的 runbook。"
        risk: "若模型把该指令当作「调整规范强度」的授权，可能把阻塞性校验改写成附注，造成 CTC-P003 漏改。触发概率低。"
      - target_text: "调用方指令：「把文中的『建议』统一改为『应』。」"
        risk: "这是本项授权的预期用法，措辞在这里不造成偏差。"
    equivalent_rewording: "调整来源中的规范强度、精确的单位换算、……（其余不变）"
    rewording_is_equivalent_because: "列表限定的是「本来禁止的改动」，即输出相对来源的改动。本技能中只有 CTC-S003 固定规范强度，它固定的正是来源各处的规范强度。「来源中的」只是写出唯一可能的所指，授权范围不扩大也不缩小，同时排除了「本技能规则级别」这一误读。「来源」沿用本技能的既有术语。"
    normative_vocabulary: ok

  - id: N2
    candidate_text: |-
      来源含情态、义务、请求、许可、禁止、建议或对系统行为的描述时，(认识强度, 规范强度, 言语行为类型) 逐处不变。
    naturalness: 4
    quotes:
      - "「(认识强度, 规范强度, 言语行为类型)」与 CTC-S006「(原因, 结果, 强度∈{…})」、CTC-S007「(量化类型, 论域)」的元组写法一致，在规则表中可以接受。"
      - "用「规范强度」替换「道义强度」后，全文这一概念只剩一个名称（description、§3 授权、§3 示例、本条）。"
      - "扣一分：「认识强度」仍是逻辑学术语（epistemic）的直译，全文没有定义；它与「规范强度」并列时，读者要靠后面的违规例（可能→会、必须→应）才能区分两者。这一点基线已有，不是本次改动引入的。"
    ambiguity:
      - "§2 第 1 层与 description 用「情态强度」作总称，本条用「认识强度」「规范强度」作分项，层级关系没有写明。但违规例足以确定归属：可能→会属认识强度，必须→应属规范强度。不构成导致不同行为的两种读法。"
    over_control_risk:
      - target_text: "「系统不会自动重试失败的请求。」"
        risk: "本次改动只换了名称，后面的违规例（不会→禁止）锚定了描述与规范的区分，模型不会因「规范」二字把描述句升格为禁令。未发现新增风险。"
    normative_vocabulary: ok

  - id: V1
    candidate_text: |-
      ……只有明确同指时才统一，不明确时不合并、各说法保持原样——strict／standard 模式下差异本身不进「待确认」，只有当它妨碍执行时按第 5 类（CTC-S002）报告；review 模式下按 CTC-T001 报告。
    naturalness: 5
    quotes:
      - "「review 模式下按 CTC-T001 报告」与前一分句「按第 5 类（CTC-S002）报告」句式平行，靠话题链承接主语「差异」，自然。"
      - "基线「它是一条普通 finding」中英混排，「普通」指什么（不升级？不进待确认？）也不明确；改后两个问题都消失了。"
    ambiguity:
      - "条件是否延续：前一分句的「只有当它妨碍执行时」是否延续到 review 分句？分号隔开了两种模式，review 分句又没有条件词，通常读作无条件报告；但不排除读者把「妨碍执行」这一条件带进 review 分句。"
      - "「按 CTC-T001 报告」可读作两种：只借用 CTC-T001 的规则 ID 与级别（WARNING）报告差异；或按 CTC-T001 的要求在「建议修改」中给出统一后的术语。后一种读法与同句「不明确时不合并」冲突。"
    over_control_risk:
      - target_text: "（review 模式，README）「在集群页面查看实例状态。」……「每个节点的日志保存在 `/var/log/app/`。」"
        risk: "「实例」与「节点」是否同指不明确。模型会报一条 CTC-T001 WARNING，并在「建议修改」中写「统一为『节点』」，而这正是前一分句禁止的合并。结果是过度报告，并诱导作者做错误的合并。这是语义层面的张力，等义改写解决不了；review finding 是否应「只指出差异、不给统一方案」，建议交给语义审阅者决定。"
    normative_vocabulary: ok

  - id: H1
    candidate_text: |-
      检查或确认步骤没有给出判据或判据含义未定（「确认无异常」），而没有破坏性、不可逆或改变外部状态的操作取决于它的结果时，不提出、不报告。
    naturalness: 3
    quotes:
      - "「破坏性、不可逆或改变外部状态的操作」与 CTC-P004、CTC-P003 逐字相同，术语一致。三个定语里两个是形容词性成分、一个是动宾短语，类别不齐，但这在中文技术写作中常见；修饰结合只有一种：三者都是「操作」的定语。"
      - "「而没有破坏性」会让读者短暂走错路：「没有破坏性」是常用搭配（意为不具破坏性），读者先读成「该步骤无破坏性」，读到「……的操作取决于」才回头改读为「不存在……的操作」。基线「而没有破坏性或不可逆操作」已有这个问题，新增的并列项把消歧点推得更远。"
      - "一句之内有三个「或」（检查或确认、判据或判据含义未定、不可逆或改变外部状态）和两个「没有」，否定条件后又接否定结果（「没有……时，不提出」），阅读负担重。"
    ambiguity:
      - "否定作用域：「没有［破坏性、不可逆或改变外部状态的操作］取决于它的结果」只能读作「不存在任何一种这类操作依赖其结果」，不会读成「并非三者兼具」。无歧义。"
      - "「它」的先行词：可及范围内有「检查或确认步骤」「判据」「判据含义」，只有「步骤」能有「结果」，先行词唯一。"
      - "「改变外部状态」在本句没有枚举。CTC-P004 用括注（删除、DROP、覆盖、重启、扩缩容、发布、回滚、密钥轮换、清空缓存）锚定这一类，本句只有短语本身，「外部状态」的边界（写工单、发通知、写日志算不算）由读者自行判断。"
    over_control_risk:
      - target_text: "「确认无异常后，在工单中记录处理结果并通知值班群。」"
        risk: "模型可能把写工单、发通知当作「改变外部状态的操作」，从而按 CTC-A005 报告「无异常」缺判据，而基线不会报告这一句。这是措辞外延过宽带来的过度报告。"
      - target_text: "「确认无异常后，执行 `kubectl rollout restart deployment/api`。」"
        risk: "边界例：重启在 CTC-P004 的枚举之内，报告是候选的预期行为，不算过度控制。"
    equivalent_rewording: "检查或确认步骤没有给出判据或判据含义未定（「确认无异常」）时，只有当破坏性、不可逆或改变外部状态的操作取决于它的结果，才提出或报告。"
    rewording_is_equivalent_because: "记「检查或确认步骤缺判据或判据含义未定」为 C，「有此类操作依赖其结果」为 D，「提出或报告」为 R。原句是：C 且非 D → 非 R；其逆否是：C 且 R → D，正是「只有当 D，才 R」表达的必要条件。若读者把「只有……才」读成充要条件，多出的「C 且 D → R」本来就由本条前半句（缺少判据时在「待确认」中给出）成立，不产生新要求。改写去掉了「而没有破坏性」造成的歧路，也去掉了否定条件接否定结果的结构，并与 CTC-P003「只有当……才按……提出」同构。触发条件、例外范围与规则级别都不变。"
    normative_vocabulary: "ok（「不提出、不报告」与 CTC-P003「不提出」写法一致；改写后的「才提出或报告」不引入新的规范词）"

  - id: H2
    candidate_text: |-
      来源未给出操作步骤自身的成功判据时：只有当该步是破坏性、不可逆或改变外部状态的操作、且后续步骤的安全性取决于它是否成功，才按「待确认」第 2 类提出；
    naturalness: 4
    quotes:
      - "「只有当……才按「待确认」第 2 类提出」是自然的必要条件句式。"
      - "「破坏性、不可逆或改变外部状态的操作、且后续步骤……」中，顿号同时用在两个层级：定语内部（破坏性、不可逆）和两个条件之间（……的操作、且……）。基线只有「破坏性或不可逆操作、且」这一处顿号；候选新增内层顿号后，读者要靠「且」才能看出第二个顿号是条件之间的分界。"
    ambiguity:
      - "「或」与「且」的结合：理论上可读作「破坏性、不可逆，或（改变外部状态的操作且后续安全性取决于它）」。但「该步是破坏性」缺「的」，不成句，这种读法不自然；实际读法是（三者之一）且（后续安全性依赖它）。歧义很弱，主要是顿号层级造成的阅读停顿。"
    over_control_risk:
      - target_text: "「1. 将 `config.yaml` 中的 `log_level` 改为 `debug`。2. 执行 `systemctl reload app`。3. 观察日志输出。」"
        risk: "步骤 1 写配置文件，可被视为改变外部状态；模型可能认为步骤 2 的安全性取决于步骤 1 是否成功，从而对步骤 1 提出第 2 类待确认。这正是本条想避免的「成串的未决项」。第二个合取条件（后续安全性依赖它）能抑制一部分，但「安全性」本身的外延也宽。"
    equivalent_rewording: "只有当该步是破坏性、不可逆或改变外部状态的操作，且后续步骤的安全性取决于它是否成功，才按「待确认」第 2 类提出；"
    rewording_is_equivalent_because: "只把两个条件之间的「、且」改为「，且」，用逗号标出比定语内部顿号高一级的分界。两个条件仍以「且」合取，词语与结构都不变。"
    normative_vocabulary: ok

  - id: D1
    candidate_text: |-
      **不算真歧义**：一种读法在该领域不对应任何可执行操作；参数在运行时由外部唯一确定；条件只放宽操作者可以做的事、默认动作不变（「若…，也可以…」）；文本只描述系统行为，不要求读者据此行动。后两种情形缺少判据或阈值时，同样不按 CTC-A005 或 CTC-R004 提出或报告。不得因「理论上可解析出两种读法」而报告。
    naturalness: 3
    quotes:
      - "分号并列的四项读得通：冒号引出，每项是一个独立小句，形式整齐。"
      - "「放宽操作者可以做的事」搭配不当：「放宽」的常规宾语是限制、要求、范围、条件，「放宽……的事」不成搭配；「可以做的事」在技术语体中也偏口语。"
      - "「条件只放宽操作者可以做的事、默认动作不变」用顿号连接两个小句。顿号只用于连接词或短语，小句之间应当用逗号。"
      - "「后两种情形」的指代清楚，但要求读者回数分号项：前文没有用「以下情形」或编号引出这四项，「情形」这个名称是事后才出现的。四项紧邻，读者能数对；但以后若在列表中插入一项，这一指代会悄悄改变所指（维护上脆弱）。"
      - "「同样不按……」的「同样」比照对象不明：可以理解为「与前两种情形一样不报告」，也可以理解为「与不算真歧义一样，缺判据也不算」。两种理解结论相同，不影响行为，只是多一次回读。"
    ambiguity:
      - "「文本只描述系统行为」中「文本」的范围：前三项都针对单处表述（一种读法、参数、条件），这一项却用「文本」，而本技能其他地方（§1、CTC-R001）用「文本」指整篇输入。可读作「该处表述只描述系统行为」，也可读作「整篇文本只描述系统行为」。按后一种读法，以描述为主的 API 文档会被整体豁免，夹杂一句指令的文档又会被整体排除。若作者意图是逐处判定，可改为「该处表述只描述系统行为」；但这一改写只有在作者确认该意图后才等义，所以没有列入下面的等义改写。"
      - "「不按 CTC-A005 或 CTC-R004 提出或报告」：否定统辖两个析取，读作「两条规则都不据以提出，也都不据以报告」，没有「只排除其中一条」的读法。"
      - "豁免只限「判据或阈值」：在「若磁盘空间不足，也可以通知相关负责人」中，「不足」缺阈值，不报告；「相关负责人」缺接收方，按字面仍按 CTC-A005 报告。字面读法是明确的，但同一句一半报告、一半不报告，执行模型容易把整句一起放过或一起报告。"
    over_control_risk:
      - target_text: "「请求量较大时，服务端会返回 `429`。」"
        risk: "预期效果：系统行为描述中的「较大」不再按 CTC-A005 报告，API 文档中的过度报告减少。措辞在这里有效。"
      - target_text: "「若主库复制延迟较高，也可以手动将流量切换到备库。」"
        risk: "漏报风险：被放宽的是一个改变外部状态的切换操作，「较高」没有阈值，按 D1 不报告。而 H1 对同类操作设了关口：检查步骤的结果决定一项破坏性、不可逆或改变外部状态的操作时，缺判据就要报告；D1 对许可条件没有相应的例外。两处标准不一致是语义问题，措辞改写解决不了，交给语义审阅者决定。"
      - target_text: "（以描述为主的 API 文档）「调用量接近配额时，应及时申请扩容。」"
        risk: "若把「文本只描述系统行为」按整篇来读，模型会放过这条规范性指令中的「接近」「及时」，造成 CTC-R004 漏报。"
    equivalent_rewording: "**不算真歧义**：一种读法在该领域不对应任何可执行操作；参数在运行时由外部唯一确定；条件只放宽对操作者的限制，默认动作不变（「若…，也可以…」）；文本只描述系统行为，不要求读者据此行动。后两种情形即使缺少判据或阈值，也不按 CTC-A005 或 CTC-R004 提出或报告。不得因「理论上可解析出两种读法」而报告。"
    rewording_is_equivalent_because: "（1）「放宽操作者可以做的事」只能指扩大操作者被允许的做法，扩大许可范围与放宽对操作者的限制是同一件事；括注的「若…，也可以…」句式不变，继续锚定所指。（2）两个小句之间的顿号改为逗号，两个条件仍同属第三项，仍须同时成立。（3）「缺少……时，同样不……」改为「即使缺少……，也不……」，真值条件相同（缺判据或阈值 → 不据 CTC-A005 或 CTC-R004 提出或报告）；「即使」写明这是对两条规则默认行为的例外，原句的「同样」表达的也只是这一点。（4）「后两种情形」与「文本」保持原样，所指不变。"
    normative_vocabulary: "基本一致。新句用不带「得」的「不」（不按……提出或报告），与 CTC-A005「不提出、不报告」、CTC-P003「不提出」的写法一致；紧随其后的「不得因……而报告」用「不得」。按 §6，条文中的否定不改变级别，两种写法都可以接受；但同一段内「不」与「不得」相邻，读者可能推断两者强度不同。新句没有口语腔，只有「可以做的事」略偏口语，见上。"

  - id: S1
    candidate_text: |-
      来源含 Markdown 结构时，标题层级、列表项数、表格行列、围栏代码块及其语言标注、链接与引用块应保持其粒度，独立告警块保持原位。
    naturalness: 4
    quotes:
      - "「独立告警块保持原位」短而清楚，术语与 §4「独立告警块管辖它所依附的整个流程」一致。"
      - "「粒度」与「原位」是两种不同的保持对象，新分句用逗号分开、不并入前面的名词串，处理得当。"
      - "扣一分：后一分句省去了「应」。前一分句「……应保持其粒度」带情态词，后一分句「保持原位」不带，读者可能把它读成陈述，或读成更强的无条件要求。按 §6，级别由「级别」栏决定，实际仍是「应」，所以这只是自宿主层面的情态省略。"
    ambiguity:
      - "触发范围：新分句位于「来源含 Markdown 结构时」之下。CTC-P004 把「「警告：」「注意：」段落」也算作独立告警块，而纯文本来源（工单正文、聊天记录）中的「注意：」段落是否属于「Markdown 结构」，可以有两种理解。CTC-P004 又说移动这类块「属于 CTC-R005 违规」；若纯文本不触发 CTC-R005，这一引用就落空。是否覆盖纯文本属语义问题，不在本角色范围内。"
      - "「原位」的参照：读作「相对所依附流程的位置（流程前或流程后）」。没有发现第二种导致不同动作的读法。"
    over_control_risk:
      - target_text: "调用方指令「合并为两步」；来源：「1. 停止写入。\n> **警告**：下一步会清空 `orders` 表。\n2. 执行 `TRUNCATE orders;`」"
        risk: "告警块夹在两个待合并的步骤之间。模型若严格执行「保持原位」，可能拒绝合并，或在合并后的同一步中间留下一个告警块；「调用方明确要求改变格式时按要求执行」是否包括合并步骤并不明确。属边界情形，风险低。"
      - target_text: "「操作步骤：……（完）\n注意：执行前请备份数据库。」"
        risk: "预期行为：告警块留在流程末尾，不移到第 1 步旁。措辞与 CTC-P004 一致，不会引起过度改写。"
    equivalent_rewording: "……链接与引用块应保持其粒度，独立告警块应保持原位。"
    rewording_is_equivalent_because: "本条的级别栏是「应」，按 §6 级别由该栏决定，省略「应」的分句本来就只能是「应」级；补出「应」只是写明已有的级别，强度、触发条件和范围都不变。"
    normative_vocabulary: "后一分句省略「应」，见上；不影响级别。"

overall_note: |-
  1. N1、N2 把「道义强度（规范强度）」统一为「规范强度」，提高了自然度和全文术语一致性。N1 可选择写成「调整来源中的规范强度」，以排除「调整本技能规则级别」的低概率误读。
  2. H1、H2 与 CTC-P004 逐字使用「破坏性、不可逆或改变外部状态的操作」，一致性好；但这两处没有 P004 的括注枚举，「改变外部状态」的外延由执行模型自行判断，过度报告的风险主要来自这里（写工单、发通知、改配置文件）。我没有给出加交叉引用的改写：「（见 CTC-P004）」可能被读成连同 P004 的触发条件一起引入，不能保证等义。是否锚定、如何锚定，交给形式化审阅者。
  3. 自然度最弱的是 D1（「放宽……的事」搭配不当，顿号连接小句，「后两种情形」要回数，「同样」比照对象不明），已给出等义改写。「文本只描述系统行为」中「文本」是单处表述还是整篇，需要作者确认后再改。
  4. H1 的「而没有破坏性……」有歧路，且是否定条件接否定结果；建议改为与 CTC-P003 同构的「只有当……才提出或报告」，已论证等义。H2 只需把「、且」改为「，且」。S1 可补出被省略的「应」。
  5. 两处属语义张力，不是措辞问题，转交语义审阅者：V1 中 review 模式「按 CTC-T001 报告」与同句「不明确时不合并」（finding 的「建议修改」会诱导合并）；D1 对许可条件的豁免与 H1 对改变外部状态操作的关口不一致（「若延迟较高，也可以切换到备库」不报告）。
  6. 规范用词总体一致：新句沿用本技能「不提出、不报告」的写法，没有引入新的规范词，也没有口语腔或译文腔（D1 的「可以做的事」略偏口语除外）。
