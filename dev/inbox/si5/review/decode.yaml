reviewer: cold-decoder
model: claude-opus-5-5
files_read:
  - dev/prompts/si5-decode.md
  - dev/inbox/si5/cand/v1/SKILL.md
# 运行环境自动注入的 AGENTS.md／CLAUDE.md 未用于推断技能意图；未读其他仓库文件。
probes:
  - probe: |-
      1(a) 运维说明：「数据归档建议在周末执行，以降低对报表查询的影响。若归档量偏大，也可以分两天完成。」
    level: |-
      不适用：无规则触发。属于 §5「不算真歧义」中的放宽许可情形。
    scope: |-
      文档类型属 strict 的适用范围（运维操作）。改写按 strict 处理；审阅取 strict 的歧义阈值。结论在两种模式下相同。
    trigger: |-
      「若归档量偏大，也可以分两天完成」：「若…，也可以…」只放宽操作者可以做的事，默认动作（周末执行）不变。第一句「建议在周末执行」给出了具体时间，不缺判据。
    requires: |-
      改写：原样返回（CTC-R001），不追加「待确认」。
      审阅：不产生 finding，返回「未发现违规」。
    prohibits: |-
      不得按 CTC-A005 或 CTC-R004 就「偏大」提出或报告；不得补出归档量阈值（CTC-S002）；不得把「建议」「也可以」改强（CTC-S003）。
    exceptions: |-
      无。
    fork: no
    answer: |-
      不提出、不报告；无规则 ID，无严重级别。
      依据 §5「不算真歧义」：「条件只放宽操作者可以做的事、默认动作不变（「若…，也可以…」）……后两种情形缺少判据或阈值时，同样不按 CTC-A005 或 CTC-R004 提出或报告。」
    notes: |-
      这条豁免只写在 §5 正文里，CTC-A005 的表格条文本身没有这条例外，冷读者必须把两处合读。§5 点名了 CTC-A005，合读后无分叉。

  - probe: |-
      1(b) 运维说明：「数据归档须在周末执行。若归档量偏大，须分两天完成。」
    level: |-
      我的答案是「必须」（CTC-A005）；竞争读法是「应」（CTC-R004）。
    scope: |-
      strict（运维说明；「须」构成规范性指令）。
    trigger: |-
      「若归档量偏大，须分两天完成」：义务由一个无阈值的程度词条件触发，并改变默认动作。它不是「也可以」式的放宽许可，也不是系统行为描述，§5 的两类豁免都不适用。
    requires: |-
      改写：保持原句；在「待确认」中提出「偏大」缺少阈值，需要的信息是触发分两天完成的归档量阈值。
      审阅：一条 finding，规则 CTC-A005，严重级别 ERROR。
    prohibits: |-
      不得补出具体阈值（CTC-S002、CTC-A005）；不得删除条件（CTC-L001）；不得改动两处「须」的强度（CTC-S003）。
    exceptions: |-
      §5 的两类豁免（放宽许可；只描述系统行为）不适用。
    fork: yes
    readings:
      - id: A
        reading: |-
          「归档量」是可度量的量，「偏大」是描述它的程度词，因此属于 CTC-R004 的排除项「用程度词描述运行指标而未给出阈值的触发条件（「延迟较高时」）」，按 CTC-A005 处理。
        behavior: |-
          审阅报 CTC-A005／ERROR。改写进「待确认」，第四栏不填。
      - id: B
        reading: |-
          「归档量」是一次作业的数据量，不是「运行指标」（如延迟、错误率），排除项不适用；「偏大」落入 CTC-R004 的开放词类「等表示程度、时机或裁量的词」，按 CTC-R004 处理。
        behavior: |-
          审阅报 CTC-R004／WARNING；风险栏写出「操作者据此决定是否分两天」时，可按 §8 升为 ERROR。改写进「待确认」第 4 类，并按 §5「情态强度的模糊」列出两种以上强度、在第四栏给出建议。但本例的义务强度「须」本身是明确的，这项要求没有可施加的对象。
    answer: |-
      采用 A：CTC-A005，审阅定 ERROR；改写时保持原句并进「待确认」。
      依据 CTC-R004 的排除项一句。「偏大」与「较高」同属对可度量量的程度描述；CTC-R004 列举的词（尽量、尽快、必要时、视情况……）都是对行动本身的裁量或时机。
    notes: |-
      分叉源于「运行指标」的范围没有定义。本例还暴露另一处错配：§5「情态强度的模糊」一段假定每个 CTC-R004 情形的义务强度都未定，要求列出可能的强度；而本例模糊的是触发条件，义务强度是明确的。

  - probe: |-
      1(c) API 文档：「当订阅数接近配额时，服务会暂停创建新订阅，已有订阅照常运行。」
    level: |-
      不适用：命中 §5 豁免。
    scope: |-
      文档类型属 standard（API 文档）；按探针要求以 strict 改写，结论相同。审阅取 standard 的阈值。
    trigger: |-
      全句只描述系统行为，不要求读者行动；「接近配额」没有阈值。
    requires: |-
      改写：原样返回，不追加「待确认」。
      审阅：不产生 finding。
    prohibits: |-
      不得把「接近配额」补成具体阈值或百分比（CTC-S002）；不得把「会」改写为义务或承诺（CTC-S003）。
    exceptions: |-
      无。
    fork: no
    answer: |-
      不提出、不报告。
      依据 §5：「文本只描述系统行为，不要求读者据此行动。后两种情形缺少判据或阈值时，同样不按 CTC-A005 或 CTC-R004 提出或报告。」
    notes: |-
      如果没有这条豁免，「接近配额」会落入 CTC-R004 的排除项（程度词描述指标），转 CTC-A005。豁免已点名 CTC-A005，故无分叉。

  - probe: |-
      1(d) API 文档：「当订阅数接近配额时，服务会暂停创建新订阅；此时请提交配额申请。」
    level: |-
      必须（CTC-A005）。
    scope: |-
      文档类型属 standard（API 文档）；探针指定以 strict 改写。审阅取 standard 的阈值。
    trigger: |-
      新增的「此时请提交配额申请」要求读者在「接近配额」这个无阈值的时点行动。
    requires: |-
      改写：保持原句；在「待确认」中提出「接近」缺少阈值，需要的信息是触发提交申请的订阅数阈值，或暂停创建时读者能观测到的表现。
      审阅：CTC-A005／ERROR。
    prohibits: |-
      不得补出阈值（CTC-S002）；不得把「请」升格为「须」（CTC-S003）。
    exceptions: |-
      系统行为描述的豁免不再适用：豁免句的限定是「不要求读者据此行动」，而本例要求读者行动。
    fork: yes
    readings:
      - id: A
        reading: |-
          「此时」回指「当订阅数接近配额时」，读者的行动时点就是这个无阈值的条件。豁免失效，缺少执行所需的阈值，按 CTC-A005 处理。
        behavior: |-
          改写进「待确认」；审阅报 CTC-A005／ERROR。
      - id: B
        reading: |-
          「此时」就是服务暂停创建新订阅的时刻。暂停是运行时由服务唯一确定的外部事件（§5「参数在运行时由外部唯一确定」），读者无需知道阈值，等创建被暂停时提交即可，因此不算真歧义。
        behavior: |-
          不提出、不报告。
    answer: |-
      采用 A：CTC-A005，审阅定 ERROR；改写时进「待确认」。
      文本没有说明暂停怎样被读者观测到（错误码、提示），读法 B 依赖来源没有给出的可观测性。本例与 (c) 的唯一差别就是「请提交配额申请」，而 §5 的豁免边界恰好划在「不要求读者据此行动」。
    notes: |-
      还有一层不确定：CTC-A005 中「缺少执行所需的参数、阈值」这一支，是否受 standard 较高的歧义阈值（§3「普通技术读者会就此产生分歧」）约束。§3 把阈值定义在「竞争读法」上，而缺失项不是竞争读法，所以我读作与模式无关。若读作受约束，审阅（API 文档取 standard 阈值）与 strict 改写可能得出不同结论。
      「待确认」的归类：缺失阈值不是「两种以上读法都成立」，严格说应归第 5 类（CTC-S002，「不论由哪条规则发现」），而不是第 1 类。归类不影响输出格式。

  - probe: |-
      1(e) runbook：「1. 修改 `redis.conf` 的 `maxmemory` 为 `8gb`。2. 确认配置无误后，执行 `systemctl restart redis`。」
    level: |-
      必须（CTC-A005）。
    scope: |-
      strict（runbook）。
    trigger: |-
      步骤 2「确认配置无误后，执行 `systemctl restart redis`」：确认动作的判据「无误」含义未定，而重启（改变外部状态）取决于它的结果。
    requires: |-
      改写：保持原句；在「待确认」中提出「无误」的判据，即检查什么、怎样算通过。
      审阅：CTC-A005／ERROR。§8 第 2 步规定，CTC-P003 中检查或确认步骤缺少判据时，规则字段填 CTC-A005，不另列 CTC-P003。
    prohibits: |-
      不得补出判据，如具体的校验命令（CTC-S002）；不得把确认动作改写为状态描述（CTC-P003）；守护条件已在重启之前，满足 CTC-P004，不得后移。
    exceptions: |-
      CTC-A005 末句的豁免（没有破坏性操作取决于检查结果时不提出）不适用，因为重启取决于这次确认。
    fork: no
    answer: |-
      提出（改写）／报告（审阅）：CTC-A005，ERROR。
      依据 CTC-A005 末句的反面：「检查或确认步骤没有给出判据或判据含义未定（「确认无异常」），而没有破坏性、不可逆或改变外部状态的操作取决于它的结果时，不提出、不报告」，本例有重启取决于它。另依据 CTC-P003「检查或确认步骤缺少判据按 CTC-A005 处理」，定级见 §8 第 2 步。
      步骤 1 不另按 CTC-P003 第 2 类提出：来源已用步骤 2 的确认给出了验证方式，只是判据含义未定，这个问题已由上面的 finding 覆盖。
    notes: |-
      有一个弱竞争读法：「无误」可以从步骤 1 推定为「`maxmemory` 已是 `8gb`」，判据由上下文确定，因而不报告。但「无误」也可以指整份配置语法有效，两者导致的检查动作不同；而且 CTC-A005 把「确认无异常」明列为判据含义未定的范例。所以不计为分叉。
      CTC-A005 豁免句的措辞是「检查或确认步骤」，本例的确认是步骤 2 的前置分句而不是独立步骤；这不影响结论，因为重启取决于它。

  - probe: |-
      1(f) runbook：「1. 将 `app.yaml` 中的 `log.level` 改为 `info`。2. 执行 `systemctl reload app`。3. 检查 `app` 的运行情况。」
    level: |-
      不适用：命中 CTC-A005 末句的豁免和 CTC-P003 的不提出条件。
    scope: |-
      strict（runbook）。
    trigger: |-
      步骤 3「检查 `app` 的运行情况」是没有判据的检查步骤，但没有任何后续的破坏性、不可逆或改变外部状态的操作取决于它。
    requires: |-
      改写：原样返回，不追加「待确认」。
      审阅：不产生 finding。
    prohibits: |-
      不得补出检查判据或检查命令（CTC-S002）。
    exceptions: |-
      无。
    fork: yes
    readings:
      - id: A
        reading: |-
          步骤 3 命中 CTC-A005 末句的豁免。步骤 2（reload）之后没有步骤依赖它是否成功。步骤 1 修改配置文件，其成功判据就是目标值本身（`log.level` 为 `info`），也不属于 CTC-P004 列举的那类操作。所以全文不提出。
        behavior: |-
          原样返回；审阅返回「未发现违规」。
      - id: B
        reading: |-
          步骤 1 修改配置文件属于「改变外部状态」，而步骤 2 reload 的安全性取决于配置是否改对，所以步骤 1 按 CTC-P003 第 2 类提出缺失的成功判据。
        behavior: |-
          改写时「待确认」多出一项；审阅报 CTC-P003／WARNING。
    answer: |-
      采用 A：不提出、不报告。
      依据 CTC-A005 末句，以及 CTC-P003「其余操作步骤缺少判据不提出，以免正常的流程文档产生成串的未决项」。
    notes: |-
      这是一个低影响的分叉，来源是「改变外部状态」没有定义：编辑磁盘上的配置文件算不算。与 (e) 对照：(e) 的来源自己在重启前放了确认分句，(f) 没有；本技能不要求补出来源没有的检查。

  - probe: |-
      1(g) 运维说明：「若磁盘紧张，也可以删除 30 天前的备份。」
    level: |-
      我的答案是「不适用」（命中 §5 豁免）；竞争读法是「必须」（CTC-A005）。
    scope: |-
      strict（运维说明）。
    trigger: |-
      「若…，也可以…」形式，但被放宽许可的是一项破坏性、不可逆的操作（删除备份），而触发条件「磁盘紧张」没有阈值。
    requires: |-
      改写：原样返回。
      审阅：不产生 finding。
    prohibits: |-
      不得补出磁盘阈值（CTC-S002）；不得把「也可以」改为「应」或「须」（CTC-S003）。
    exceptions: |-
      无。
    fork: yes
    readings:
      - id: A
        reading: |-
          按 §5 字面：条件只放宽操作者可以做的事，默认动作（不删除）不变，所以不按 CTC-A005 或 CTC-R004 提出或报告。
        behavior: |-
          原样返回；审阅不报告。
      - id: B
        reading: |-
          被许可的动作是不可逆的删除，而它的触发条件没有定义。CTC-A005 末句和 CTC-P003 都以「是否有破坏性、不可逆或改变外部状态的操作取决于它」作为是否提出的界线，读者可能把这条界线类推到放宽许可上：「磁盘紧张」按 CTC-R004 的排除项（程度词描述指标）转 CTC-A005 提出。
        behavior: |-
          改写进「待确认」；审阅报 CTC-A005／ERROR。
    answer: |-
      采用 A：不提出、不报告。
      §5 的豁免没有为破坏性操作设除外，而 CTC-A005 的破坏性界线只写给「检查或确认步骤」，所以按字面不提出。但这是本组中风险最高的一次豁免适用：一个无阈值的条件决定了一次不可逆删除是否被允许。
    notes: |-
      次要问题：「30 天前」的边界包含性（恰好满 30 天的备份能否删除）没有约定。CTC-L004 把「之前」列为比较算子，却没有给出它的包含性。strict 的阈值（「只要存在一种…导致不同动作的读法」）与 §5「不得因「理论上可解析出两种读法」而报告」在这里互相拉扯。我不报告这一点；它不属于本探针问的「缺判据」，仅作记录。

  - probe: |-
      2(a) 「1. 在控制台把 `api` 的副本数调到 4。2. 确认 4 个 Pod 都处于 Running。」
    level: |-
      应（CTC-T001）；我认为本例不触发。
    scope: |-
      review；被审文本是 runbook 式步骤，取 strict 的阈值。
    trigger: |-
      「副本数」与「Pod」是否为同一概念的两种称呼。
    requires: |-
      不产生 finding，返回「未发现违规」。
    prohibits: |-
      不得为显得周全而制造 finding（§8）；不得把「Pod」改称「副本」或反之（CTC-T002：未确认同指前不得合并）。
    exceptions: |-
      `Running` 是状态取值，属于受保护标记（§4），不涉术语问题。步骤 2 给出了判据（Running），不涉 CTC-A005。
    fork: yes
    readings:
      - id: A
        reading: |-
          「副本数」是工作负载的数量属性，「Pod」是资源对象类型。二者是不同概念，只是在本例中 4 个副本由 4 个 Pod 实现。CTC-T001 的触发条件「同一概念……两种以上称呼」不成立。
        behavior: |-
          无 finding。
      - id: B
        reading: |-
          二者在本文中指同一组实体（4 个副本就是 4 个 Pod），而审阅者无法确认它们在调用方系统中的关系。按 §6 T 族表后一段「不明确时……review 模式下按 CTC-T001 报告」处理。
        behavior: |-
          报 CTC-T001／WARNING。
    answer: |-
      采用 A：无 finding。
      依据 CTC-T001 的触发条件「同一概念」，以及 §8「不得……为显得周全而制造 finding」。
    notes: |-
      分叉的根源：T 族表后一段说本技能「无法知道两个说法在它看不见的系统里是否同指」，却没说审阅者能否用通用领域知识（Kubernetes 中副本与 Pod 的关系）判定二者「明确不同指」。三种状态（明确同指／明确不同指／不明确）中，只有「明确同指」与「不明确」有写明的处理；「不明确」在 review 下一律报 CTC-T001，这会把外延相同、内涵不同的术语对报成不一致。

  - probe: |-
      2(b) 「请求头须携带访问令牌。令牌过期后，客户端用刷新凭据换取新的访问 token。」
    level: |-
      应（CTC-T001），映射为 WARNING。
    scope: |-
      review；API 文档，取 standard 的阈值。
    trigger: |-
      「访问令牌」与「访问 token」明确指同一概念。
    requires: |-
      一条 finding：规则 CTC-T001；严重级别 WARNING；位置「新的访问 token」；建议统一为「访问令牌」（来源中首次出现、也更明确的形式，见 CTC-T001 的选择顺序）。
    prohibits: |-
      除非风险栏能指名操作者会因此做出的不同动作，否则不得升为 ERROR；本例指不出这样的动作。不得把「刷新凭据」改为「刷新令牌」：来源与上下文都没有这个术语（CTC-T001「不得引入来源与上下文都没有出现过的新术语」）。
    exceptions: |-
      「首次出现处的中英对照属于术语定义」不适用，因为这里不是首次出现处的对照。「令牌过期后」中的「令牌」是「访问令牌」的回指简称，先行词唯一（CTC-A002），不另报。
    fork: no
    answer: |-
      CTC-T001／WARNING，一条。
      依据 CTC-T001「同一概念在本次工作单位内出现两种以上称呼时，应统一为一个术语」，以及 §8「应 → WARNING」。
    notes: |-
      无。

  - probe: |-
      2(c) 「1. 先在预发环境验证。2. 准生产环境验证通过后，再发布到生产。」
    level: |-
      应（CTC-T001），可按 §8 唯一的升级条款报 ERROR。另有一条必须级（CTC-A005）。
    scope: |-
      review；被审文本是发布步骤，取 strict 的阈值。
    trigger: |-
      「预发环境」与「准生产环境」是否同指不明确；步骤 2 的放行条件引用的环境，与步骤 1 验证的环境名称不同。
    requires: |-
      finding 1：CTC-T001，位置「准生产环境验证通过后」。风险栏写明操作者的不同动作：若二者是不同环境，操作者会在预发验证后直接发布，跳过准生产验证；若二者相同，操作者会去寻找一个并不存在的环境。据此报 ERROR。
      finding 2：CTC-A005／ERROR，位置「验证通过」。放行发布（改变外部状态，属 CTC-P004 的类别）的验证没有给出判据。
    prohibits: |-
      不得把两个名称合并或互相替换（CTC-T002：同指未经确认）；不得补出验证判据（CTC-S002）。
    exceptions: |-
      无。
    fork: yes
    readings:
      - id: A
        reading: |-
          按 T 族表后一段的字面「review 模式下按 CTC-T001 报告」，不升级。
        behavior: |-
          CTC-T001／WARNING。
      - id: B
        reading: |-
          同样按 CTC-T001 报告，但风险栏指名了操作者的不同动作，按 §8 唯一的升级条款报 ERROR。
        behavior: |-
          CTC-T001／ERROR。
      - id: C
        reading: |-
          「同一环境」与「两个环境」两种读法导致不同行为，且无法判定，因此触发 CTC-A005。可以单列，也可以按 §8 第 2 步「同一处触发多条规则时分列」与 CTC-T001 并列。
        behavior: |-
          CTC-A005／ERROR，取代或附加于 CTC-T001。
    answer: |-
      采用 B：CTC-T001／ERROR（按升级条款）；另列 finding 2（验证判据缺失，CTC-A005／ERROR）。
      T 族表后一段已指定 review 下的规则 ID，所以不以 CTC-A005 取代 CTC-T001；升级条件在本例中明确可以满足。
    notes: |-
      §8 的升级是「可以」，同一条 finding 在不同审阅者手里可能是 WARNING，也可能是 ERROR，这是分级层面的分叉。条文没有规定 CTC-T001 与 CTC-A005 是否互斥。
      同一段对 strict／standard 的处理（差异妨碍执行时，按第 5 类 CTC-S002 进「待确认」）与对 review 的处理（CTC-T001）使用不同的规则 ID。本例在改写时会进「待确认」第 5 类。

  - probe: |-
      3 「规范强度」的含义；调用方说「把这段里的『应』都改成『必须』」属于哪种授权；它与 §6「级别」栏的关系
    level: |-
      §3「调用方授权」所列的第一项「调整规范强度」。被解除的约束是 CTC-S003（必须）。
    scope: |-
      改写任务，限于调用方所指的那一段。
    trigger: |-
      调用方显式要求把「应」改为「必须」。
    requires: |-
      把该段中表达义务的「应」（含「应当」「应该」的义务用法）改为「必须」。授权本身即构成 CTC-R001 要求的归因；§7 第 7 步不把这些改动计为不成立。
    prohibits: |-
      不得借此改动段外文本；不得改动受保护标记内的「应」、含「应」字的词（响应、对应、应用）或表示推测的认识「应」；不得顺带改动其他情态词（「建议」「可以」）；不得改变本技能 §6 中任何规则的级别。
    exceptions: |-
      §3：「授权改变的是允许做什么，不改变任何语义不变量的验证方式。」
    fork: yes
    readings:
      - id: A
        reading: |-
          字符串级替换：把段内每个「应」都换成「必须」。
        behavior: |-
          「不应」变成「不必须」，禁止被改成无义务，言语行为翻转（这是 CTC-S003／CTC-A004 意义上的损坏）。「预计 5 分钟内应完成」中的推测被改成义务。「响应」之类的词按字面也在替换之列。
      - id: B
        reading: |-
          情态级替换：只改规范强度为「应」的义务用法。「不应」按同一授权加强为「不得」，而不是字面的「不必须」。认识用法的「应」不在「调整规范强度」的授权内，保持不变。
        behavior: |-
          只有义务强度改变，其余不变量保持。
    answer: |-
      采用 B。
      「规范强度」在本技能中指被处理文本中各陈述的义务强度，即义务、建议、许可、禁止的强弱。它是 CTC-S003 三元组「(认识强度, 规范强度, 言语行为类型)」的第二项，属第 1 层语义不变量，默认逐处不变（CTC-S003：「建议→必须」「必须→应」均为违规）。
      调用方的这句话属于 §3「调用方授权」：「调用方可以显式授权的本来禁止的改动限于：调整规范强度、……」。
      与 §6「级别」栏的关系：无直接关系。「级别」栏是本技能自身规则的效力等级，决定规则怎样适用，以及 review 下的严重级别（必须→ERROR、应→WARNING、可以→STYLE）。调用方授权、模式（§3「strict 不把「应」提升为「必须」」）、规则条文中的「必须」「不得」（§6）都不改变它。两者只是共用「必须／应／可以」这组词形；§7 要求翻译时情态词「不归一到本技能自身的规范词表」，也说明二者分属不同层面。
    notes: |-
      「规范强度」在全文中没有定义句，只能从 description、§3 授权清单与 CTC-S003 三元组推出；它与 §6「级别」的区分也没有明文。
      §3「strict 不把「应」提升为「必须」」既可以读作关于规则级别（上下文如此），也可以读作关于正文情态（与 CTC-S003 重复）。两种读法的行为相同，不构成分叉。
      真正的分叉在授权的展开方式：「不应」、认识「应」和含「应」字的词怎样处理，技能都没有说明。
      边界情形：被处理的文本本身是一份 CTC 式规范（如自审 SKILL.md）时，正文的规范强度与该文本「级别」栏的取值重合，这条授权会实际改变那份规范中的规则级别。

  - probe: |-
      4(a) 改写 runbook 时，文末的「注意：执行前须备份数据库。」能否移到第 1 步前
    level: |-
      CTC-R005（应），以及 CTC-P004（必须）中关于独立结构块的一句。
    scope: |-
      改写 runbook，调用方没有给出格式要求。
    trigger: |-
      文末的「注意：…」是独立结构块。
    requires: |-
      留在原位。它不论位置如何，都管辖它所依附的整个流程。
    prohibits: |-
      不得移到第 1 步前；不得复制进各步骤（§4「不得把结构条件静默复制进每个子步骤」）。
    exceptions: |-
      调用方明确要求改变格式时按要求执行（CTC-R005 末句）。
    fork: no
    answer: |-
      不能移。
      依据 CTC-P004：「作为独立结构块出现的告警（「警告：」「注意：」段落、告警框）管辖它所依附的整个流程，不论排在流程前还是流程后；本规则不要求把这类结构块移动到某个步骤旁，移动它属于 CTC-R005 违规。」以及 CTC-R005「独立告警块保持原位」。
    notes: |-
      唯一可设想的反读：CTC-R005 只是「应」级，可以被更高优先级推翻；有人会主张第 2 层（操作者读到文末才知道要先备份）压过它。CTC-P004 明言结构块的管辖与位置无关、移动它属于违规，堵住了这条路，所以不计为分叉。
      这是一项设计取舍：对按顺序执行的读者，文末的「执行前须…」确实来得太晚，本技能选择不在改写中修正它；而且「待确认」的七类中也没有能记录这一风险的类别。

  - probe: |-
      4(b) 步骤 3 句中的「确认无连接后」能否移到步骤 3 的动作之前
    level: |-
      必须（CTC-P004）。
    scope: |-
      步骤 3 的动作属于破坏性、不可逆或改变外部状态的操作（如 DROP、删除、重启）。「确认无连接」这一前提强烈暗示如此。
    trigger: |-
      来源给出的前置条件位于被守护动作之后（同句后段）。
    requires: |-
      移到同句前段，或步骤 3 内紧邻的上一句，例如「确认无连接后，执行 …」。这处改动归因于 CTC-P004。
    prohibits: |-
      不得拆成一个新的编号步骤（改变列表项数，违反 CTC-R005；按句机械拆分，违反 CTC-P001）；不得移入步骤 2 或文末（CTC-P003 的判据绑定）；不得改变阻塞性质，「后」必须仍是继续的前提（CTC-P003）。
    exceptions: |-
      若步骤 3 的动作不属于 CTC-P004 的类别，没有规则授权这次移动（CTC-R001；CTC-L003「陈述顺序可以与时间顺序不同」），应保持原样。
    fork: no
    answer: |-
      能，而且必须移（前提是步骤 3 的动作属于 CTC-P004 的类别）。
      依据 CTC-P004：「该条件必须出现在被守护动作之前——同句前段，或紧邻的上一句。」这是句内语序调整，不是结构块的移动，不触及 CTC-R005。
    notes: |-
      「紧邻的上一句」如果被理解为可以落在上一个编号步骤的末尾，条件就会离开步骤 3。按 CTC-P003 的绑定要求，它应留在步骤 3 内。

  - probe: |-
      4(c) 调用方要求「把所有注意事项合并到开头」时怎样处理
    level: |-
      CTC-R005（应）的调用方格式授权例外；CTC-P004（必须）；CTC-L001、CTC-S001、CTC-A004（必须）。
    scope: |-
      改写 runbook，调用方给出了明确的格式要求。
    trigger: |-
      调用方明确要求改变格式。
    requires: |-
      把独立的「注意：」「警告：」结构块移到开头并合并（CTC-R005 末句；§3 授权清单中的「CTC-R005 的改变格式」；授权即归因）。
      合并后，每条告警断言都可还原（CTC-S001），各块原有的管辖范围不变（CTC-L001）：原本只管辖某一节或子树的块，合并到全文开头后不得因此扩大到整个流程，需要保留取自来源结构的适用范围。
    prohibits: |-
      不得把步骤内的守护条件（如步骤 3 的「确认无连接后」）一起搬到开头：这会让条件离开被守护动作，违反 CTC-P004（必须），也违反 CTC-P003 的绑定要求和 CTC-L001 的「继续限定同一对象」；调用方可以授权的改动清单不含 CTC-P004。合并时不得把分别的禁止合成联合禁止（CTC-A004）。
    exceptions: |-
      无。
    fork: yes
    readings:
      - id: A
        reading: |-
          「注意事项」只指独立结构块，步骤内的守护条件不在此列。
        behavior: |-
          只移动并合并结构块，步骤内的条件留在原处；按调用方要求中可执行的部分完成，不作报告。
      - id: B
        reading: |-
          「所有注意事项」包括步骤内的前置条件，调用方的授权也覆盖它们。
        behavior: |-
          全部搬到开头。这违反 CTC-P004（授权清单不含它），属于失败。
      - id: C
        reading: |-
          步骤内条件的处理同 A，但认为调用方的「所有」没有被完全执行，需要告知调用方。
        behavior: |-
          想进「待确认」，却找不到对应类别：七类中只有第 7 类处理调用方要求无法满足的情形，而且只限长度上限。结果只能静默不做，或违反「此外一律不得进入」。
      - id: D
        reading: |-
          在开头列出全部注意事项，同时把步骤内的条件保留在原位，即复制而不是移动。
        behavior: |-
          步骤内条件被重复。§4 只禁止向子步骤复制，没有禁止向上复制；但 CTC-R002 要求删去不消除任何歧义的补充限定，条文没有直接裁决。
    answer: |-
      采用 A。
      依据 CTC-R005「调用方明确要求改变格式时按要求执行」；§3「调用方可以显式授权的本来禁止的改动限于：……规则条文中写明的授权（CTC-P003 的合并步骤、CTC-R005 的改变格式）」；CTC-P004「该条件必须出现在被守护动作之前」。
    notes: |-
      主要缺口：调用方的要求与必须级规则冲突、只能部分执行时，输出契约没有告知调用方的渠道（「待确认」只收七类）。读法 C 与 D 的分歧由此而来。
