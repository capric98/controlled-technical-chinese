# 冷读输出。运行环境自动注入的 AGENTS.md／CLAUDE.md 不计入读取，也未用于推断技能意图。
# 为便于逐条比对，探针 1、2、3、4 按子项拆成独立条目，探针 5 按两个请求拆成两条。
reviewer: cold-decoder
model: claude-opus-5-5
files_read:
  - dev/prompts/si6-decode.md
  - dev/inbox/si6/cand/v1/SKILL.md
probes:
  # ---------------------------------------------------------------- 探针 1
  - probe: "1(a) 「数据迁移建议在凌晨进行。若数据量较大，也可以分三个窗口迁移。」"
    level: |-
      §5「不算真歧义」中的许可豁免（无规则 ID）；豁免失效时适用 CTC-A005（必须）。
    scope: |-
      strict 改写与 review 都适用；豁免不随模式变化。
    trigger: |-
      「若…，也可以…」许可句，条件「数据量较大」没有阈值。
    requires: |-
      三项同时成立即豁免：默认动作不变；来源规定的义务不被免除；所许可的做法不在默认动作之外增加破坏性、不可逆或改变外部状态的操作。豁免成立时原样保留。
    prohibits: |-
      不得补出「数据量较大」的阈值（CTC-S002、CTC-A005）；豁免成立时不得提出或报告。
    exceptions: |-
      任一项不成立则豁免失效：「数据量较大」属于用程度词描述指标、未给阈值的触发条件，按 CTC-R004 排除项转 CTC-A005。
    fork: no
    answer: |-
      豁免成立。默认动作（凌晨迁移）不变；「建议」不是义务（CTC-S003 把「义务」与「建议」分列）；分三个窗口迁移仍是同一个迁移操作，没有在默认动作之外增加操作。
      处理：strict 原样保留，不进「待确认」；review 不产生 finding，无严重级别。规则 ID：无（豁免失效时为 CTC-A005）。
      依据：§5「条件只放宽对操作者的限制（「若…，也可以…」），而默认动作不变、来源规定的义务不被免除、所许可的做法也不在默认动作之外增加破坏性、不可逆或改变外部状态的操作」与「后两种情形即使缺少判据或阈值，也不按 CTC-A005 或 CTC-R004 提出或报告」。
    notes: |-
      残余弱读法：若把「建议」也计入「来源规定的义务」，并把「三个窗口」读作可以不在凌晨，则许可免除了凌晨建议，豁免失效，转 CTC-A005（review 为 ERROR）。「分三个窗口」字面上不排除凌晨，此读法牵强，故不记为分叉。

  - probe: "1(b) 「服务默认以 INFO 级别输出日志。若磁盘紧张，也可以把日志级别调为 WARN。」"
    level: |-
      §5 许可豁免（无规则 ID）；豁免失效时适用 CTC-A005（必须）。
    scope: |-
      strict 改写与 review。
    trigger: |-
      许可句，条件「磁盘紧张」没有阈值；被许可的做法是修改服务的日志级别配置。
    requires: |-
      同 1(a)：三项同时成立才豁免。
    prohibits: |-
      不得补出磁盘阈值（CTC-S002）；不得把许可升格为义务（CTC-S003）。
    exceptions: |-
      豁免失效时，「磁盘紧张」是未定义状态／用程度词描述运行指标而未给阈值的触发条件，按 CTC-R004 排除项转 CTC-A005。
    fork: yes
    readings:
      - id: A
        reading: |-
          调整日志级别是修改运行中服务的配置，按字面属于「改变外部状态的操作」。来源的第一句只描述系统行为，操作者没有默认动作，也没有可被「放宽」的操作者限制，因此该许可在默认动作之外增加了一项改变外部状态的操作，豁免第三项不成立。
        behavior: |-
          strict：原句保留，「待确认」增一项「磁盘紧张 | 未给出判定阈值 | 磁盘使用率或剩余空间阈值」（CTC-A005，第 1 类；作为缺失信息也可归第 5 类，输出格式相同）。review：CTC-A005，ERROR。
      - id: B
        reading: |-
          调整日志级别可逆、非破坏，不是条文意义上的「改变外部状态」（CTC-P004 列举的是删除、DROP、覆盖、重启、扩缩容、发布、回滚、密钥轮换、清空缓存，没有配置调整）；该许可只放宽操作者的限制，不免除任何义务。另一变体：把整段视为「文本只描述系统行为，不要求读者据此行动」（许可不要求行动）。
        behavior: |-
          豁免成立：strict 原样保留，不提出；review 无 finding。
    answer: |-
      A。处理：strict 进「待确认」；review 报 CTC-A005，ERROR。
      依据：§5 豁免句第三项「所许可的做法也不在默认动作之外增加破坏性、不可逆或改变外部状态的操作」——条文没有定义「外部状态」，按字面，修改服务配置即改变外部状态；且第二种豁免要求「文本只描述系统行为」，第二句是对读者的许可，不是系统行为描述。规则 ID 依据 CTC-R004「未定义的状态（「服务稳定」）…以及用程度词描述运行指标而未给出阈值的触发条件（「延迟较高时」），都不是这类词，按 CTC-A005 处理」与 §8 第 2 步。
    notes: |-
      分叉根源：「改变外部状态」没有定义，CTC-P004 的括注列举又不含配置修改，读者会据此分化。若豁免失效后把「紧张」读作 CTC-R004 的程度词，规则 ID 会变成 CTC-R004（WARNING），但 R004 排除项中的「延迟较高时」类比更接近，应走 CTC-A005。

  - probe: "1(c) 「发布前建议先在预发环境验证。若时间紧张，也可以直接发布。」"
    level: |-
      §5 许可豁免（无规则 ID）；豁免失效时适用 CTC-R004（应）。
    scope: |-
      strict 改写与 review。
    trigger: |-
      许可句，条件「时间紧张」没有判据；被许可的做法是跳过来源建议的预发验证。
    requires: |-
      同 1(a)：三项同时成立才豁免。
    prohibits: |-
      不得补出「时间紧张」的判据；不得把「建议」改为「必须」或删除（CTC-S003）。
    exceptions: |-
      豁免失效时，「时间紧张」是表示时机／裁量的无判据词（与 R004 列举的「紧急时」「条件允许时」同类），走 CTC-R004。
    fork: yes
    readings:
      - id: A
        reading: |-
          按字面：CTC-S003 把「义务」与「建议」分列，「建议先在预发环境验证」不是「来源规定的义务」；被许可的「直接发布」中的发布本来就在默认动作内，只是少了验证，没有在默认动作之外增加操作；默认动作不变。三项都成立。
        behavior: |-
          豁免成立：strict 原样保留，不提出；review 无 finding。
      - id: B
        reading: |-
          把建议视为来源规定的（可推翻的）要求，「直接发布」免除了它；或把「未经预发验证的发布」视为默认动作之外的、改变外部状态的发布。豁免不成立。
        behavior: |-
          strict：「待确认」第 4 类（CTC-R004），指出缺失判据；该条件承担的是许可而非义务，第四栏是否填写不明确，倾向省略。review：CTC-R004，WARNING；风险字段指名「操作者自行判定时间紧张而跳过预发验证直接发布」时可按 ERROR 报告。
      - id: C
        reading: |-
          B 的子分叉：把「时间紧张」读作未定义状态，而不是时机／裁量词。
        behavior: |-
          规则 ID 变为 CTC-A005，review 为 ERROR。
    answer: |-
      A（按字面）：豁免成立，strict 原样保留，review 无 finding，规则 ID 无。
      依据：§5 豁免句的三项条件，以及 CTC-S003「来源含情态、义务、请求、许可、禁止、建议…」把义务与建议分列。
    notes: |-
      这是探针 1 中影响最大的分叉：按字面读法，一条放弃发布前安全验证的许可在 strict 与 review 下都不被提出。认为这违背语义控制意图的读者会改走 B。条文没有说明两点：「来源规定的义务」是否包括建议；「所许可的做法」与默认动作比较的是操作集合，还是带前提、时点的操作。1(a)、1(c)、1(d) 的结论都取决于第二点；本输出统一按操作集合比较。

  - probe: "1(d) 「每周日清理 `/var/log/app/` 下的旧日志。若磁盘紧张，也可以提前到周五清理。」"
    level: |-
      §5 许可豁免（无规则 ID）；豁免失效时适用 CTC-A005（必须）。
    scope: |-
      strict 改写与 review。
    trigger: |-
      许可句，条件「磁盘紧张」没有阈值；被许可的做法是把破坏性、不可逆的删除提前执行。
    requires: |-
      同 1(a)：三项同时成立才豁免。
    prohibits: |-
      不得补出磁盘阈值；`/var/log/app/` 逐字符不变（CTC-S005）。
    exceptions: |-
      豁免失效时，「磁盘紧张」按 CTC-R004 排除项转 CTC-A005。
    fork: yes
    readings:
      - id: A
        reading: |-
          清理就是默认动作本身，提前到周五只是同一操作改期，没有在默认动作之外增加操作；每周清理的义务仍被履行，改期不是「免除」。
        behavior: |-
          豁免成立：strict 原样保留，不提出；review 无 finding。
      - id: B
        reading: |-
          被许可的做法是破坏性、不可逆的删除，并在默认动作不会执行删除的时点执行（日志提前两天被删）；「每周日」是义务的组成部分，被许可替换，可视为义务被部分免除。
        behavior: |-
          豁免失效：strict「待确认」增一项「磁盘紧张 | 未给出判定阈值 | 磁盘使用率或剩余空间阈值」；review 报 CTC-A005，ERROR。
    answer: |-
      A：豁免成立，strict 原样保留，review 无 finding，规则 ID 无（豁免失效时为 CTC-A005）。
      依据：§5 豁免句「所许可的做法也不在默认动作之外增加…操作」——按操作集合比较，删除已在默认动作内。
    notes: |-
      若改按时点比较（读法 B），1(a) 的分窗迁移也会落到默认动作之外，与把 1(a) 视为典型豁免的直觉冲突，所以本输出取操作集合读法。但 1(d) 的被许可做法本身是不可逆删除，读者分化的可能性高。

  - probe: "1(e) 「若队列积压，也可以临时扩容 `worker`。」（来源没有其他句子）"
    level: |-
      CTC-A005（必须）；§5 许可豁免不成立。
    scope: |-
      strict 改写与 review。
    trigger: |-
      许可句没有默认动作可承接（「也」无所承接）；被许可的做法「扩容」是 CTC-P004 列举的扩缩容；条件「队列积压」没有阈值。
    requires: |-
      保持原表述，在「待确认」中给出位置、缺失项与判定所需的信息（CTC-A005）。
    prohibits: |-
      不得补出积压阈值、扩容幅度或时长；`worker` 逐字符不变。
    exceptions: |-
      无。
    fork: no
    answer: |-
      豁免不成立：来源没有默认动作，也没有被放宽的操作者限制；扩缩容属于破坏性或改变外部状态的操作，且落在（不存在的）默认动作之外，第三项不成立。「队列积压」是未定义状态（与「服务稳定」同类），按 CTC-R004 排除项转 CTC-A005。
      处理：strict 原句保留，「待确认」增一项「队列积压 | 未给出判定阈值 | 积压长度或等待时长阈值」；review 报 CTC-A005，ERROR。
      依据：§5 豁免句第三项；CTC-P004 的操作列举「扩缩容」；CTC-R004 排除项；§8 第 2 步与级别映射。
    notes: |-
      同一句还缺扩容幅度，「临时」也没有时长或回缩条件（R004 排除项中的「未给出具体值的时长」）。二者都可按 CTC-A005 提出；是否算「执行所需」由读者判断，我倾向一并提出。这不影响探针所问的条件处理。

  # ---------------------------------------------------------------- 探针 2
  - probe: "2(a) 「1. 创建 `pv-data` 的快照。2. 把 `data` 卷缩容到 50Gi。」"
    level: |-
      CTC-P003（应）末段。
    scope: |-
      strict 改写：提出为「待确认」第 2 类。review：报 CTC-P003，WARNING；风险字段指名操作者因此会做出的不同动作时可按 ERROR（§8 唯一升级例外）。
    trigger: |-
      来源没有给出操作步骤自身的成功判据。
    requires: |-
      两项同时成立才提出：(i) 该步是破坏性、不可逆或改变外部状态的操作，或为后续这类操作建立恢复点的备份、快照；(ii) 后续步骤的安全性取决于它是否成功。
    prohibits: |-
      不得虚构判据；不满足 (i)(ii) 的步骤缺判据不提出。
    exceptions: |-
      检查或确认步骤缺判据按 CTC-A005，仅当破坏性、不可逆或改变外部状态的操作取决于其结果时才提出。
    fork: yes
    readings:
      - id: A
        reading: |-
          `pv-data` 与 `data` 是同一存储在不同层的名称（PV 与卷），快照是缩容的恢复点。步骤 1 满足 (i)(ii)。
        behavior: |-
          步骤 1 提出：快照成功判据缺失。review 报 CTC-P003，WARNING（风险写明「快照未成功即缩容，数据不可恢复」时可按 ERROR）。步骤 2 是最后一步，没有后续步骤取决于它，不提出。
      - id: B
        reading: |-
          两个标识符不同，快照不是步骤 2 的恢复点，步骤 1 不满足 (ii)。
        behavior: |-
          不按 CTC-P003 提出；对象不一致本身可能另按 CTC-A005 提出（缩容是否有恢复点无从判定）。
    answer: |-
      A：步骤 1 提出（strict「待确认」第 2 类；review CTC-P003，WARNING，可升级），步骤 2 不提出。
      依据：CTC-P003「只有当该步是破坏性、不可逆或改变外部状态的操作（为后续这类操作建立恢复点的备份、快照也算），且后续步骤的安全性取决于它是否成功，才按「待确认」第 2 类提出」。
    notes: |-
      条文没有给出判断「后续步骤的安全性取决于它是否成功」的方法：按位置（快照紧邻缩容前）判断时 (ii) 自动成立；按对象（快照对象是否就是被缩容的对象）判断时，本例取决于 `pv-data` 与 `data` 是否同一存储，而来源无法确定。

  - probe: "2(b) 「1. 备份 `nginx.conf`。2. 修改 `nginx.conf` 中的 `worker_processes`。3. 执行 `nginx -s reload`。」"
    level: |-
      CTC-P003（应）末段。
    scope: |-
      同 2(a)。
    trigger: |-
      三个步骤都没有给出自身的成功判据。
    requires: |-
      同 2(a)。
    prohibits: |-
      不得虚构判据（例如不得自行补出 `nginx -t`）。
    exceptions: |-
      同 2(a)。
    fork: yes
    readings:
      - id: A
        reading: |-
          步骤 1 的备份是步骤 2 修改同一文件的恢复点，提出。步骤 2 修改配置文件，改变外部状态；步骤 3 重载的安全性取决于修改是否成功（产出有效配置），也提出。
        behavior: |-
          「待确认」两项（第 2 类）：备份成功判据、修改成功判据。review 报两条 CTC-P003，WARNING（可升级）。步骤 3 是最后一步，不提出。
      - id: B
        reading: |-
          只有步骤 1 满足条件。「是否成功」指写入是否完成：写入失败时重载的是旧配置，重载的安全性不取决于修改是否成功；或认为修改本地文件不算「改变外部状态」。
        behavior: |-
          只提出步骤 1。
    answer: |-
      A：步骤 1、步骤 2 提出，步骤 3 不提出。处理：strict「待确认」第 2 类；review 报 CTC-P003，WARNING，风险字段指名不同动作时可按 ERROR。
      依据：CTC-P003 末段的 (i)(ii) 两项条件；步骤 1 依据括注「为后续这类操作建立恢复点的备份、快照也算」。
    notes: |-
      与成功判据无关、但同属此例：步骤 2 没有给出 `worker_processes` 的目标值，是缺少执行所需的参数，按 CTC-A005 提出（review 为 ERROR）。

  - probe: "2(c) 「1. 执行 `make test`。2. 将 `config/` 目录备份到 `/backup/config/`。」"
    level: |-
      CTC-P003（应）末段；若把步骤 1 视为检查步骤，适用 CTC-A005 末句。
    scope: |-
      同 2(a)。
    trigger: |-
      两个步骤都没有给出成功判据。
    requires: |-
      同 2(a)。
    prohibits: |-
      不得虚构判据；不得把顺序当作依赖。
    exceptions: |-
      检查步骤缺判据只有在破坏性等操作取决于其结果时才提出。
    fork: no
    answer: |-
      两步都不提出。步骤 1 不是破坏性、不可逆或改变外部状态的操作；即使把它视为检查步骤，来源也没有让步骤 2 取决于测试结果，而步骤 2 是备份，不在破坏性操作之列。步骤 2 是最后一步，后面没有它作为恢复点要保护的操作，不满足 (ii)。strict 不进「待确认」；review 无 finding。
      依据：CTC-P003「其余操作步骤缺少判据不提出」与「检查或确认步骤缺少判据按 CTC-A005 处理」；CTC-A005「只有当破坏性、不可逆或改变外部状态的操作取决于它的结果，才提出或报告」。
    notes: |-
      弱读法：把步骤 1 读作门禁检查，并把备份到固定路径读作可能覆盖旧备份（CTC-P004 列有「覆盖」），则按 CTC-A005 提出测试判据。来源没有给出这种依赖，不记为分叉。

  - probe: "2(d) 「1. 把 `users` 表导出为 `users.csv`。2. 清空 `users` 表。」"
    level: |-
      CTC-P003（应）末段。
    scope: |-
      同 2(a)。
    trigger: |-
      导出步骤没有给出成功判据，后续步骤是不可逆的清空。
    requires: |-
      同 2(a)。
    prohibits: |-
      不得虚构判据（例如行数比对）。
    exceptions: |-
      同 2(a)。
    fork: yes
    readings:
      - id: A
        reading: |-
          导出在功能上为清空建立了恢复点（同一对象 `users`），括注「为后续这类操作建立恢复点的备份、快照也算」按功能而非名称认定；写出 `users.csv` 本身也改变外部状态。清空的安全性取决于导出是否成功。
        behavior: |-
          步骤 1 提出（第 2 类）；review 报 CTC-P003，WARNING（风险写明「导出未完成即清空，数据丢失」时可按 ERROR）。步骤 2 是最后一步，不提出。
      - id: B
        reading: |-
          「导出」不是条文点名的「备份」「快照」，对数据库只读，不满足 (i)。
        behavior: |-
          不提出。
    answer: |-
      A：步骤 1 提出，步骤 2 不提出。
      依据：CTC-P003 末段及其括注。
    notes: |-
      分叉较弱：A 有两条独立路径满足 (i)。只有坚持「备份」按名称认定、且不把写文件算作改变外部状态的读者才会走 B。

  - probe: "2(e) 「1. 备份数据库。2. 将流量切换到备用集群。」"
    level: |-
      CTC-P003（应）末段。
    scope: |-
      同 2(a)。
    trigger: |-
      备份步骤没有给出成功判据，后续步骤是改变外部状态的流量切换。
    requires: |-
      同 2(a)。
    prohibits: |-
      不得虚构判据，也不得虚构备份与切换之间的依赖。
    exceptions: |-
      同 2(a)。
    fork: yes
    readings:
      - id: A
        reading: |-
          按位置：备份紧邻一项改变外部状态的操作之前，视为它的恢复点，(ii) 成立。
        behavior: |-
          步骤 1 提出（第 2 类）；review 报 CTC-P003，WARNING。
      - id: B
        reading: |-
          按对象：流量切换不改变被备份的数据库，它的回退是切回流量而不是恢复备份；来源没有给出切换的安全性取决于备份的证据，(ii) 不成立。
        behavior: |-
          不提出。
    answer: |-
      B：两步都不提出。步骤 2 是最后一步，也不提出。
      依据：CTC-P003「为后续这类操作建立恢复点」要求备份是后续操作的恢复点，以及「且后续步骤的安全性取决于它是否成功」。
    notes: |-
      与 2(a) 同源：条文没有说明 (ii) 按位置还是按对象判断。按位置判断时，任何排在高风险操作之前的备份都会自动满足 (ii)，括注「为后续这类操作建立恢复点」就失去区分力。本输出在 2(a)(b)(d)(e) 统一按对象判断，2(a) 取「同一存储」读法。

  # ---------------------------------------------------------------- 探针 3
  - probe: "3(a) 「紧急情况下，可以跳过审批直接上线。」（审阅）"
    level: |-
      CTC-R004（应）→ WARNING；按 §8 升级例外可按 ERROR。
    scope: |-
      review；被审文本是规范性指令（策略／变更流程），按 strict 阈值。
    trigger: |-
      许可的判定条件由「紧急情况下」承担，R004 列举了「紧急时」；§5 许可豁免不成立，因为「跳过审批」免除了来源预设的审批义务。
    requires: |-
      报一条 CTC-R004 finding，六个字段齐全，位置逐字引用。
    prohibits: |-
      建议修改中不得替作者给出具体判据（§5 情态模糊段与 CTC-R004「改写时不得补出来源没有的判据」）。
    exceptions: |-
      若把「紧急情况」读作未定义状态，会转 CTC-A005。
    fork: yes
    readings:
      - id: A
        reading: |-
          只按级别映射：应 → WARNING。
        behavior: |-
          CTC-R004，WARNING。
      - id: B
        reading: |-
          适用升级例外：风险字段指名操作者会做出的不同动作（一人自判紧急、跳过审批上线，另一人等待审批）。
        behavior: |-
          CTC-R004，ERROR。
      - id: C
        reading: |-
          「紧急情况」读作未定义状态（R004 排除项），而不是时机／裁量词。
        behavior: |-
          CTC-A005，ERROR。
    answer: |-
      CTC-R004。基础级别 WARNING；风险字段能指名不同动作，我会按 ERROR 报告（B）。
      依据：CTC-R004「规范性指令…的判定条件由无判据词承担时——…「紧急时」…」；§5 豁免句「来源规定的义务不被免除」在此不成立；§8「唯一允许的升级：一条「应」级违规可以按 ERROR 报告，条件是该 finding 的「风险」字段指名了操作者因此会做出的那个不同动作」。
    notes: |-
      升级是「可以」，几乎任何规范性 R004 finding 都能写出「不同动作」，所以 WARNING 与 ERROR 之间的选择在设计上就不确定。这个分叉对所有「应」级 finding 都存在。

  - probe: "3(b) 「紧急变更须在 24 小时内补录变更单。」（审阅）"
    level: |-
      CTC-R004（应）→ WARNING（可升级）；或无 finding。
    scope: |-
      review；规范性指令，strict 阈值。
    trigger: |-
      义务「须补录」是否适用于某次变更，取决于该变更是否算「紧急变更」；期限「24 小时内」是具体值。
    requires: |-
      若适用 R004：报一条 CTC-R004 finding。
    prohibits: |-
      不得对「24 小时内」报告（已有具体值，L004 下「以内」含 24）；不得补出紧急变更的定义。
    exceptions: |-
      CTC-R004 不限制「目标文档中限定观测事实的普通汉语副词」，但「紧急变更」不属于这一类。
    fork: yes
    readings:
      - id: A
        reading: |-
          「紧急」承担了义务适用范围的判定条件，属于 R004 列举的时机／裁量词（「紧急时」）。
        behavior: |-
          CTC-R004，WARNING（风险字段指名「把边界变更判为非紧急而不补录」时可按 ERROR）。
      - id: B
        reading: |-
          「紧急变更」是变更类别的名称（流程术语），不是条件词；类别定义属于变更流程，技能没有术语表可查。
        behavior: |-
          无 finding。
      - id: C
        reading: |-
          「紧急变更」读作未定义状态。
        behavior: |-
          CTC-A005，ERROR。
    answer: |-
      A：CTC-R004，WARNING。
      依据：CTC-R004 触发句「规范性指令（…SOP、策略、门禁条件）的判定条件由无判据词承担时」，「紧急」与列举的「紧急时」同属时机／裁量判断；条文没有为类别名称提供排除项。
    notes: |-
      与 3(c) 的区别（我的读法）：3(b) 的「紧急」决定一条明示的「须」义务对某次变更是否成立，边界变更存在「补录或不补录」两种动作；3(c) 的标题没有条件标记，给定文本中也没有可替代的常规流程。若审阅者把类别名称一律视为术语（B），3(b) 与 3(c) 都不报。

  - probe: "3(c) 标题「## 紧急回滚（目标 5 分钟内完成）」下的步骤（审阅）"
    level: |-
      CTC-L001（必须）的结构管辖语义；对标题本身默认无 finding；步骤按常规规则审阅。
    scope: |-
      review；runbook，strict 阈值。
    trigger: |-
      标题带「紧急」与一个具体的时间目标，下面是回滚步骤（回滚属于 CTC-P004 列举的操作）。
    requires: |-
      把标题建立的条件与目标视为管辖整个子树（CTC-L001、§4「结构也承载语义」）；步骤按 CTC-P003、CTC-P004、CTC-A005 等常规规则逐句审阅。
    prohibits: |-
      不得要求把「5 分钟内」复制进每个子步骤（§4「不得把结构条件静默复制进每个子步骤」）；不得把「目标」报为义务或改为「必须」（CTC-S003）；不得对「5 分钟内」报 CTC-R004（已有具体值）。
    exceptions: |-
      若文档中另有常规回滚流程，二者的选择条件由「紧急」承担，则按 CTC-R004 报告。
    fork: yes
    readings:
      - id: A
        reading: |-
          标题是流程名称加一个具体目标，没有「时／情况下」之类的条件标记，不是规范性指令的判定条件；给定文本中没有可替代的流程，不存在导致不同动作的读法。
        behavior: |-
          标题无 finding；步骤按常规规则审阅。
      - id: B
        reading: |-
          按 CTC-L001「标题…建立的条件管辖其子树」，标题建立了条件「紧急时」，由 R004 词承担。
        behavior: |-
          对标题报 CTC-R004，WARNING（可升级）。
    answer: |-
      A：标题本身无 finding；「目标 5 分钟内完成」作为整个流程的目标管辖子树，不分配到各步；子步骤按常规规则审阅，例如回滚步骤缺少自身成功判据时，按 CTC-P003 末段的 (i)(ii) 两项条件判断是否报告（WARNING）。
      依据：§4「标题、列表层级与表格单元格建立的条件管辖其子树（CTC-L001）…不得把结构条件静默复制进每个子步骤」；CTC-R004 的触发要求「规范性指令的判定条件」。
    notes: |-
      3(a)(b)(c) 的「紧急」分别处在条件状语、义务主语中的类别名、标题名称三种位置。条文只用列举词「紧急时」锚定 R004，没有说明类别名或标题是否算「判定条件」，读者在 3(b)、3(c) 上会分化。

  - probe: "3(d) 「服务不稳定时，暂停发布。」（审阅）"
    level: |-
      CTC-A005（必须）→ ERROR。
    scope: |-
      review；规范性指令。
    trigger: |-
      义务的条件「服务不稳定」是未定义状态，与 R004 排除项中的「服务稳定」同类。
    requires: |-
      finding 的规则字段填 CTC-A005，不另列 CTC-R004；按 CTC-A005 定级。
    prohibits: |-
      建议修改中不得补出稳定性判据。
    exceptions: |-
      不适用 §5 许可豁免：这是义务，不是许可，也不是系统行为描述。
    fork: no
    answer: |-
      CTC-A005，ERROR。
      依据：CTC-R004「未定义的状态（「服务稳定」）…都不是这类词，按 CTC-A005 处理」；§8 第 2 步「CTC-R004 排除项中的未定义状态…finding 的规则字段填 CTC-A005，不另列原规则」；§8「按第 2 步转为 CTC-A005 的 finding 按 CTC-A005 定级，不算升级」。
    notes: |-
      无。

  # ---------------------------------------------------------------- 探针 4
  - probe: "4(a) 调用方指令「把要求放宽一些」（strict 改写，来源为三条「必须」或「应」的 SOP）"
    level: |-
      §3「调用方授权」段（无规则 ID）；被解除的禁止是 CTC-S003（必须）。
    scope: |-
      strict 改写。
    trigger: |-
      调整规范强度的授权，没有指明条目，也没有指明目标强度（「一些」）。
    requires: |-
      正文不做强度调整；按第 5 类在「待确认」中请调用方指明调整哪些条目、调到何种强度。第四栏不填。
    prohibits: |-
      不得自行选择条目或强度；不得把「放宽」解释为改阈值、删条件（这些不在可授权范围内，且违反 CTC-S001、CTC-S004、CTC-L001）。
    exceptions: |-
      无。
    fork: yes
    readings:
      - id: A
        reading: |-
          「正文不改」只针对这项强度调整；正文中其他由规则触发、可归因到规则 ID 的改动照常进行。
        behavior: |-
          返回按其他规则改写后的正文，强度不变，末尾加「待确认」一项。
      - id: B
        reading: |-
          「正文不改」指整篇正文原样返回。
        behavior: |-
          返回原文，末尾加「待确认」一项。
    answer: |-
      A。强度不变，「待确认」第 5 类一项。
      依据：§3「调整规范强度的授权没有指明哪些条目、调整到何种强度时，正文不改，按第 5 类在「待确认」中请调用方指明」。
    notes: |-
      只有来源 SOP 中还有其他规则触发点时，A 与 B 才会产生不同输出。来源只有「必须」「应」两级时，有读者可能把「放宽」读作「全部必须改为应」，即视为已指明；但「一些」表明不是全部，且条文要求「指明」，这种读法不成立。

  - probe: "4(b) 调用方指令「把第 3 条的『应』改为『必须』」"
    level: |-
      §3「调用方授权」段；被解除的禁止是 CTC-S003。
    scope: |-
      strict 改写。
    trigger: |-
      已指明条目（第 3 条）与目标强度（必须）的强度调整授权。
    requires: |-
      把第 3 条的「应」改为「必须」；这项授权本身构成 CTC-R001 所要求的归因；第 7 步比对时不把它计为不成立。
    prohibits: |-
      不得同时改动其他条目的强度；不得改动第 3 条的条件、对象与阈值。
    exceptions: |-
      若第 3 条不含「应」或含多个「应」，授权的作用点不明，按第 5 类在「待确认」中请调用方指明。
    fork: no
    answer: |-
      执行：第 3 条「应」→「必须」，其余按常规规则处理。
      依据：§3「调用方可以显式授权的本来禁止的改动限于：调整来源中的规范强度…授权本身即构成 CTC-R001 所要求的归因」；§7 第 7 步「调用方已授权的改动不计为不成立」。没有授权时 strict 不得这样改：§3「strict 不把「应」提升为「必须」」。
    notes: |-
      无。

  - probe: "4(c) 调用方指令「把所有『必须』改为『应』」"
    level: |-
      §3「调用方授权」段；被解除的禁止是 CTC-S003。
    scope: |-
      strict 改写。
    trigger: |-
      已指明条目（所有「必须」）与目标强度（应）的强度调整授权。
    requires: |-
      把每个「必须」改为「应」；归因同 4(b)。
    prohibits: |-
      不得借机改动条件、例外、阈值或其他措辞。
    exceptions: |-
      若来源含「须」「务必」「不得」等同级表述，它们是否在授权范围内不明（「不得」→「不应」？），应按第 5 类请调用方指明。本例来源只有「必须」「应」，不触发。
    fork: no
    answer: |-
      执行：全部「必须」→「应」。
      依据：同 4(b)。
    notes: |-
      上述同级表述的边界只在来源含这些词时才会造成分叉。

  - probe: "4(d) 调用方指令「把这份 SOP 改得更严格」"
    level: |-
      §3「调用方授权」段；被解除的禁止是 CTC-S003。
    scope: |-
      strict 改写。
    trigger: |-
      方向为加强的强度调整授权，没有指明条目，也没有指明目标强度。
    requires: |-
      正文不做强度调整；按第 5 类在「待确认」中请调用方指明。
    prohibits: |-
      不得新增要求、阈值、校验或告警（CTC-S002）；不得把 strict 模式本身当作加强规范强度的依据（§3「strict 不把「应」提升为「必须」」）。
    exceptions: |-
      无。
    fork: yes
    readings:
      - id: A
        reading: |-
          属于没有指明条目与强度的强度调整授权。
        behavior: |-
          强度不变，「待确认」第 5 类一项（另有 4(a) 的「正文不改」范围分叉）。
      - id: B
        reading: |-
          来源只有两级，「更严格」可以唯一推出「所有应 → 必须」，视为已指明。
        behavior: |-
          把三条中的「应」全部改为「必须」。
      - id: C
        reading: |-
          「更严格」指增加约束或校验，这不在可授权范围内。
        behavior: |-
          不做，也可能不进「待确认」（静默拒绝）。
    answer: |-
      A。
      依据：§3「调整规范强度的授权没有指明哪些条目、调整到何种强度时，正文不改，按第 5 类在「待确认」中请调用方指明」；「显式授权」要求明说，「更严格」既没有点名条目，也没有点名强度。
    notes: |-
      B 的推理（两级词表下方向即目标）在条文中没有被明确排除，有读者会采用。

  - probe: "4(e) 调用方指令「改写目标：让新入职的工程师也能看懂」"
    level: |-
      §3「调用方授权」段的「指定改写目标」；语义不变量（S、L、T 族）仍按原方式验证。
    scope: |-
      strict 改写。
    trigger: |-
      调用方指定了改写目标，没有涉及规范强度。
    requires: |-
      三条「必须」「应」的强度不变；为目标服务的改动不得引入来源与上下文之外的命题；新人执行所需而来源没有的信息按第 5 类进「待确认」。
    prohibits: |-
      不得补写术语解释、背景、默认值、示例值（CTC-S002）；不得引入新术语或新译名（CTC-T001）；不得调整规范强度（这不是强度授权）。
    exceptions: |-
      无。
    fork: yes
    readings:
      - id: A
        reading: |-
          目标只确定第 2 层的「合格读者」为新入职工程师，从而降低「无需猜测」的门槛；改动仍须逐处归因到规则 ID（主要是 A、P 两族），未触发规则的文本原样返回。
        behavior: |-
          改动较少：只写出来源或上下文可确定、新人会卡住的动作、对象、位置；其余进「待确认」。
      - id: B
        reading: |-
          目标是可授权的本来禁止的改动，「授权本身即构成 CTC-R001 所要求的归因」，因此为目标服务的改写（句式更直白、语序调整、拆并句）不再需要单独的规则 ID，但仍受全部语义不变量约束。
        behavior: |-
          改动较多：未触发规则的句子也可为可读性重写，命题、强度、数值、标记、术语不变。
      - id: C
        reading: |-
          目标授权补充解释性内容。
        behavior: |-
          加入术语解释、背景说明。此读法与 CTC-S002（必须）及「授权…不改变任何语义不变量的验证方式」冲突，不成立。
    answer: |-
      B，并受 A 所列约束：为目标服务的改写可以归因到该授权；不新增命题，不改强度、数值、标记、术语；新人所需而来源缺失的信息按第 5 类进「待确认」。
      依据：§3「调用方可以显式授权的本来禁止的改动限于：…指定改写目标或长度上限…授权本身即构成 CTC-R001 所要求的归因」与「授权改变的是允许做什么，不改变任何语义不变量的验证方式」。
    notes: |-
      条文只把「指定改写目标」列为可授权项，没有说明它解除的是哪一项禁止（推测是 CTC-R001 的最小改动约束）。A 与 B 的改动量差别大。

