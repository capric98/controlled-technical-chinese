reviewer: cold-decoder
model: claude-opus-5-5
files_read:
  - dev/prompts/si6-decode-v3.md
  - dev/inbox/si6/cand/v3/SKILL.md
probes:
  - probe: |-
      1(a) 「数据迁移建议在凌晨进行。若数据量较大，也可以分三个窗口迁移。」
    level: |-
      §5「不算真歧义」中的许可放宽豁免（限制条款，没有级别栏）；豁免不成立时落到 CTC-A005（必须）。
    scope: |-
      改写（strict，SOP／变更流程）与审阅（review，按 strict 阈值）中「若…，也可以…」形式的许可句。
    trigger: |-
      许可条件「数据量较大」没有阈值。
    requires: |-
      先逐项检查 §5 的五项豁免条件：默认动作不变；来源规定的义务不被免除；所许可的做法不引入默认动作之外的破坏性、不可逆或改变外部状态的操作；不减少这类操作之前的检查或复核；不更换执行者。全部成立时不提出、不报告，改写原样返回（CTC-R001）。
    prohibits: |-
      改写时补出数据量阈值（CTC-S002）；把许可改写成义务（CTC-S003）；审阅时以「理论上可解析出两种读法」报告（§5）。
    exceptions: |-
      无。
    fork: yes
    readings:
      - id: A
        reading: |-
          分三个窗口迁移仍是默认动作（数据迁移）本身，只改变执行方式；没有新增操作，没有减少检查，没有更换执行者。「建议在凌晨」是建议，CTC-S003 把建议与义务分列，不属于「来源规定的义务」。五项条件全部成立，豁免适用。
        behavior: |-
          改写原样返回，不加「待确认」；审阅无 finding。
      - id: B
        reading: |-
          「默认动作」包含执行方式（在一个凌晨窗口内完成一次迁移）。分三个窗口等于多出两次改变外部状态的迁移会话，并打破同一维护窗口的原子性（CTC-P001），因而属于「默认动作之外」的操作，豁免不成立。「数据量较大」是用程度词描述数量而无阈值，按 CTC-R004 排除项转 CTC-A005。
        behavior: |-
          改写保留原句，「待确认」列「数据量较大」缺阈值；审阅报 CTC-A005 ERROR。
    answer: |-
      A。不提出、不报告；改写原样返回；没有规则 ID，没有严重级别。依据 §5「条件只放宽对操作者的限制（「若…，也可以…」），而默认动作不变、来源规定的义务不被免除、所许可的做法也不引入默认动作之外的破坏性、不可逆或改变外部状态的操作，不减少这类操作之前的检查或复核，也不更换其执行者……后两种情形即使缺少判据或阈值，也不按 CTC-A005 或 CTC-R004 提出或报告」。
    notes: |-
      分叉点是「默认动作之外的…操作」中的「之外」：文本没有说明同一操作改变时间、次数或切分方式是否算「之外」。1(d) 共享这一分叉。「义务」是否包括「建议」文本也没有定义；但本例的三个窗口是否仍在凌晨本身未定，所以这一支不能单独翻转结论。

  - probe: |-
      1(b) 「服务默认以 INFO 级别输出日志。若磁盘紧张，也可以把日志级别调为 WARN。」
    level: |-
      §5 许可放宽豁免；豁免不成立时为 CTC-A005（必须）。
    scope: |-
      改写（strict）与审阅（strict 阈值）中的许可句；第一句是系统行为描述，第二句是给操作者的许可。
    trigger: |-
      许可条件「磁盘紧张」没有阈值。
    requires: |-
      检查 §5 五项豁免条件。豁免不成立时，按条件性质分流：运行指标加程度词（「磁盘紧张」）属于 CTC-R004 的排除项，按 CTC-A005 保留原句并进「待确认」；审阅时规则字段填 CTC-A005（§8 第 2 步），按 CTC-A005 定级。
    prohibits: |-
      补出磁盘用量阈值（CTC-S002、CTC-A005）；把「也可以」改成「应」或「须」（CTC-S003）。
    exceptions: |-
      若整段只描述系统行为、不要求读者行动，适用 §5 的另一项豁免；本例第二句要求（许可）操作者行动，不适用。
    fork: yes
    readings:
      - id: A
        reading: |-
          「改变外部状态的操作」按字面包括修改服务配置。第一句没有任何操作者动作，第二句许可的「调日志级别」是默认之外新引入的配置变更，豁免条件「不引入默认动作之外的…改变外部状态的操作」不成立。
        behavior: |-
          改写保留原句，「待确认」加一行：`磁盘紧张 | 「磁盘紧张」未给出阈值 | 允许把日志级别调为 WARN 的磁盘用量阈值`；审阅报 CTC-A005 ERROR。
      - id: B
        reading: |-
          「改变外部状态」指 CTC-P004 所列那类有风险的操作（删除、重启、扩缩容、发布等）。调低日志级别可逆、无破坏，只是放宽对操作者的限制，豁免成立。
        behavior: |-
          改写原样返回；审阅无 finding。
    answer: |-
      A。改写：保留原句，「待确认」列「磁盘紧张」缺阈值；审阅：CTC-A005，ERROR。依据 §5 豁免条件「所许可的做法也不引入默认动作之外的破坏性、不可逆或改变外部状态的操作」不成立；「磁盘紧张」按 CTC-R004「用程度词描述运行指标而未给出阈值的触发条件（「延迟较高时」）……按 CTC-A005 处理」，并按 §8 第 2 步把规则字段填为 CTC-A005。
    notes: |-
      次级分叉：「紧张」与 1(c)「时间紧张」同词，有读者会把两者都归入 CTC-R004（WARNING）。我按条文区分：磁盘用量是运行指标，归 CTC-A005；时间紧张是操作者的处境与裁量，归 CTC-R004。两者严重级别不同（ERROR 与 WARNING），这一区分完全依赖读者对「运行指标」的理解。

  - probe: |-
      1(c) 「发布前建议先在预发环境验证。若时间紧张，也可以直接发布。」
    level: |-
      CTC-R004（应）；§5 豁免不适用。
    scope: |-
      改写（strict，发布流程）与审阅（strict 阈值）。
    trigger: |-
      许可条件「时间紧张」由无判据的时机／裁量词承担，且许可去掉了发布前的验证。
    requires: |-
      豁免不成立：发布是 CTC-P004 列举的改变外部状态的操作，许可减少了它之前的检查，违反「不减少这类操作之前的检查或复核」。改写：保留原句，在「待确认」第 4 类（CTC-R004）指出缺失的判据。审阅：报 CTC-R004 WARNING；风险字段指名「操作者以时间紧张为由跳过预发验证直接发布」时，可按 §8 唯一的升级条款报 ERROR。
    prohibits: |-
      补出「时间紧张」的具体判据（CTC-R004 改写时不得补出）；删除许可或把它改成禁止（CTC-S003）；把「建议」改为「必须」（CTC-S003）。
    exceptions: |-
      新写任务时按 CTC-R004 给出可观测的触发条件，不进「待确认」。
    fork: yes
    readings:
      - id: A
        reading: |-
          「时间紧张」与 CTC-R004 列举的「紧急时」「条件允许时」同类，是表示时机或裁量的无判据词，归 CTC-R004。
        behavior: |-
          「待确认」第 4 类一行；审阅 CTC-R004 WARNING（可升级为 ERROR）。
      - id: B
        reading: |-
          「时间紧张」是一种未定义的状态，与 CTC-R004 排除项中的「服务稳定」同类，归 CTC-A005。
        behavior: |-
          「待确认」一行（第 1 或第 5 类）；审阅 CTC-A005 ERROR，不涉及升级。
    answer: |-
      A。提出／报告，规则 CTC-R004；审阅为 WARNING，风险字段写明那个不同动作时可报 ERROR。依据 §5「不减少这类操作之前的检查或复核」（豁免不成立）与 CTC-R004 条文「「尽快」「最好」「适当」「必要时」「视情况」「条件允许时」「紧急时」「合理」等表示程度、时机或裁量的词……改写时不得补出来源没有的判据，在「待确认」中提出」。
    notes: |-
      1. 升级条款用的是「可以」，同一 finding 合规地可报 WARNING 也可报 ERROR；这不是读法分叉，但会让不同审阅者给出不同严重级别。1(f)、3(a)、探针 2 的 CTC-P003 finding 同样如此。
      2. §5 情态段要求「列出其可能的两种以上强度并给出建议」，但只针对「承担义务的条件」。本例的条件承担的是许可，我不填「待确认」第四栏；有读者可能套用情态段而填写。

  - probe: |-
      1(d) 「每周日清理 `/var/log/app/` 下的旧日志。若磁盘紧张，也可以提前到周五清理。」
    level: |-
      §5 许可放宽豁免；豁免不成立时为 CTC-A005（必须）。
    scope: |-
      改写（strict，运维 SOP）与审阅（strict 阈值）。默认动作本身是破坏性操作（清理日志）。
    trigger: |-
      许可条件「磁盘紧张」没有阈值。
    requires: |-
      检查五项豁免条件。豁免成立时不提出、不报告。
    prohibits: |-
      补出阈值；改动受保护标记 `/var/log/app/`（CTC-S005）。
    exceptions: |-
      无。
    fork: yes
    readings:
      - id: A
        reading: |-
          所许可的做法仍是默认动作（清理旧日志）本身，只是提前执行；没有引入默认动作之外的操作，没有减少检查，没有更换执行者，豁免成立。
        behavior: |-
          改写原样返回；审阅无 finding。
      - id: B
        reading: |-
          默认动作是「周日清理」；在周五执行一次破坏性删除，属于默认未安排的破坏性操作，即「默认动作之外」的操作，豁免不成立。「磁盘紧张」归 CTC-A005。
        behavior: |-
          改写保留原句并在「待确认」列「磁盘紧张」缺阈值；审阅 CTC-A005 ERROR。
    answer: |-
      A。不提出、不报告；改写原样返回。依据同 1(a)：§5「条件只放宽对操作者的限制……后两种情形即使缺少判据或阈值，也不按 CTC-A005 或 CTC-R004 提出或报告」。
    notes: |-
      与 1(a) 是同一分叉（「之外」是否涵盖同一操作的时间变化）。本探针之外：默认句中「旧日志」没有给出判定标准（多旧算旧），而它决定破坏性删除的对象范围；strict 下可能另有一条 CTC-A005。这不受许可句豁免覆盖，因为豁免针对的是许可条件，不是默认指令。

  - probe: |-
      1(e) 「若队列积压，也可以临时扩容 `worker`。」（来源没有其他句子）
    level: |-
      CTC-A005（必须）；§5 豁免不适用。
    scope: |-
      改写（strict，runbook）与审阅（strict 阈值）。来源没有默认动作。
    trigger: |-
      许可条件「队列积压」是运行指标的状态，没有阈值。
    requires: |-
      豁免不成立：来源没有默认动作，所许可的「扩容」是 CTC-P004 列举的改变外部状态的操作，属于默认动作之外。改写：保留原句，「待确认」列「队列积压」缺阈值；审阅：规则字段填 CTC-A005，ERROR。
    prohibits: |-
      补出积压阈值、扩容幅度或时长（CTC-S002、CTC-A005）；改动 `worker`（CTC-S005）。
    exceptions: |-
      无。
    fork: no
    answer: |-
      提出／报告，CTC-A005，ERROR。依据 §5 豁免条件「所许可的做法也不引入默认动作之外的破坏性、不可逆或改变外部状态的操作」不成立（CTC-P004 把扩缩容列为这类操作）；「队列积压」按 CTC-R004「用程度词描述运行指标而未给出阈值的触发条件……按 CTC-A005 处理」。
    notes: |-
      「临时」没有给出时长或缩回条件，扩容幅度也没有给出；strict 下这两项都可能各成一条 CTC-A005（缺少执行所需的参数）。它们不是本探针所问的许可条件，是否提出取决于读者是否认为它们「执行所需」。

  - probe: |-
      1(f) 「主从切换建议由 DBA 执行。紧急情况下，值班工程师也可以执行切换。」
    level: |-
      CTC-R004（应）；§5 豁免不适用。
    scope: |-
      改写（strict，运维操作）与审阅（strict 阈值）。
    trigger: |-
      许可条件「紧急情况下」由无判据词承担，且许可更换了执行者。
    requires: |-
      豁免不成立：违反「也不更换其执行者」。改写：保留原句，「待确认」第 4 类指出「紧急情况下」缺判据。审阅：CTC-R004 WARNING；风险字段指名「值班工程师自行认定紧急并执行主从切换」时可报 ERROR。
    prohibits: |-
      补出紧急的判定条件；删除或弱化执行者（CTC-A001）；把「建议」改为「必须」（CTC-S003）。
    exceptions: |-
      无。
    fork: no
    answer: |-
      提出／报告，CTC-R004；审阅 WARNING（可按升级条款报 ERROR）。依据 §5「也不更换其执行者」（豁免不成立）与 CTC-R004 列举的「紧急时」。
    notes: |-
      规则归属与是否提出都没有分叉。严重级别存在升级裁量（见 1(c) notes）；第四栏是否填写同 1(c)。

  - probe: |-
      1(g) 「生产变更建议经双人复核后执行。若改动只涉及文案，也可以由一人复核。」
    level: |-
      §5 豁免不适用；是否提出取决于 CTC-A005（必须）在 strict 阈值下是否触发。
    scope: |-
      改写（strict，变更流程）与审阅（strict 阈值）。
    trigger: |-
      许可减少了生产变更（改变外部状态的操作）之前的复核；许可条件是「改动只涉及文案」。
    requires: |-
      豁免不成立：违反「不减少这类操作之前的检查或复核」。豁免失效后，条件本身仍须按常规规则判断：「只涉及文案」不是 CTC-R004 所列的无判据词，也不是运行指标程度词；只有当它在 strict 阈值下存在竞争读法时，才按 CTC-A005 提出。
    prohibits: |-
      补出「文案」的定义；删除或收紧许可（CTC-S003、CTC-S002）。
    exceptions: |-
      §5「不得因「理论上可解析出两种读法」而报告」。
    fork: yes
    readings:
      - id: A
        reading: |-
          豁免失效只是取消了保护，本身不产生 finding。「只涉及文案」是可判定的类别条件（看改动范围即可），没有缺失的阈值或判据。
        behavior: |-
          改写原样返回；审阅无 finding。
      - id: B
        reading: |-
          strict 阈值是「只要存在一种在本文档语境下可执行、且导致不同动作的读法」。「文案」可读作仅界面文案，也可读作包含错误信息、日志文本、配置中的字符串等一切面向用户的文本；对「修改接口错误信息」这类改动，两种读法分别导致一人复核与双人复核，因此是竞争读法。
        behavior: |-
          改写保留原句，「待确认」列「文案」的范围未定；审阅 CTC-A005 ERROR。
    answer: |-
      B（把握不高）。提出／报告，CTC-A005，审阅 ERROR。依据 §5「不减少这类操作之前的检查或复核」（豁免不成立）与 §3 strict 的歧义阈值「只要存在一种在本文档语境下可执行、且导致不同动作的读法，即按竞争读法处理」，再由 CTC-A005 保持原表述并进「待确认」。
    notes: |-
      文本只规定了「豁免成立 → 不报」，没有规定「豁免不成立 → 必报」。因此对条件本身看似清楚的非豁免许可句，是否提出完全取决于读者对「文案」边界的判断。若维护者期望「减少复核的许可一律提出」，现有文字不足以保证这一行为。

  - probe: |-
      2(a) 「1. 创建 `pv-data` 的快照。2. 把 `data` 卷缩容到 50Gi。」
    level: |-
      CTC-P003（应）；审阅时 WARNING，可升级。
    scope: |-
      改写（strict）与审阅中，来源没有给出操作步骤自身成功判据的编号步骤。
    trigger: |-
      步骤 1 与步骤 2 都没有成功判据。
    requires: |-
      CTC-P003：只有当该步是破坏性、不可逆或改变外部状态的操作，且后续步骤的安全性取决于它是否成功时，才按「待确认」第 2 类提出；审阅时报 CTC-P003。其余操作步骤缺判据不提出。
    prohibits: |-
      虚构判据（CTC-P003、CTC-S002）；对每一步都提出（「以免正常的流程文档产生成串的未决项」）；改动 `pv-data`、`data`、`50Gi`（CTC-S004、CTC-S005）。
    exceptions: |-
      末步没有后续步骤，不满足第二项条件。
    fork: yes
    readings:
      - id: A
        reading: |-
          宽读法：创建快照会在存储端新建对象，按字面属于改变外部状态的操作；步骤 2 缩容是破坏性操作，其安全性取决于快照是否成功。步骤 1 两项条件都满足。
        behavior: |-
          改写：「待确认」第 2 类一行，询问快照成功的判据；审阅：步骤 1 一条 CTC-P003 WARNING。
      - id: B
        reading: |-
          窄读法：「破坏性、不可逆或改变外部状态的操作」指 CTC-P004 所列那类有风险的操作；快照、备份、导出是保护性操作，不改变被操作对象的状态，不满足第一项条件。
        behavior: |-
          两步都不提出；审阅无 finding。
    answer: |-
      A。步骤 1 提出（「待确认」第 2 类）；审阅为 CTC-P003 WARNING，风险字段写明「快照未完成即缩容」这一不同动作时可报 ERROR。步骤 2 是末步，不提出。依据 CTC-P003「来源未给出操作步骤自身的成功判据时：只有当该步是破坏性、不可逆或改变外部状态的操作，且后续步骤的安全性取决于它是否成功，才按「待确认」第 2 类提出」。
    notes: |-
      1. 宽／窄读法的分叉同样决定 2(b)、2(d) 的结论。窄读法下，「备份后执行破坏性操作」这一最典型的场景反而不会提出，而第二项条件（后续安全性取决于它）几乎就是为这种场景写的，所以我取宽读法。
      2. `pv-data` 与 `data` 是两个不同的标识符。若不能确定快照对象就是被缩容的卷，步骤 1 对步骤 2 的保护关系本身就不确定；strict 下可能另有一条 CTC-A005（两者是否同一对象）。这不在本探针问题之内。

  - probe: |-
      2(b) 「1. 备份 `nginx.conf`。2. 修改 `nginx.conf` 中的 `worker_processes`。3. 执行 `nginx -s reload`。」
    level: |-
      CTC-P003（应）。
    scope: |-
      同 2(a)。
    trigger: |-
      三步都没有成功判据。
    requires: |-
      同 2(a)；逐步检查两项条件。
    prohibits: |-
      同 2(a)；补出 `nginx -t` 之类的验证命令（CTC-S002）。
    exceptions: |-
      步骤 3 是末步。
    fork: yes
    readings:
      - id: A
        reading: |-
          宽读法 + 「是否成功」指该步是否完成：步骤 1 写出备份文件（改变外部状态），步骤 2 覆盖被备份的同一文件，其可回滚性取决于备份成功 → 提出步骤 1。步骤 2 若未成功即配置未改，步骤 3 重载旧配置无害 → 不提出。
        behavior: |-
          「待确认」第 2 类一行（步骤 1）；审阅一条 CTC-P003 WARNING。
      - id: B
        reading: |-
          窄读法：备份不算改变外部状态，步骤 1 不提出；步骤 2 修改配置属于覆盖（CTC-P004 所列），步骤 3 重载的安全性取决于步骤 2 产出可用的配置 → 提出步骤 2。
        behavior: |-
          「待确认」第 2 类一行（步骤 2）；审阅一条 CTC-P003 WARNING，位置不同。
      - id: C
        reading: |-
          把「安全性」理解为不可恢复的损害：只改一个键的配置可以手工改回，备份不是安全前提；这正是规则所说的「正常的流程文档」。
        behavior: |-
          三步都不提出；审阅无 finding。
    answer: |-
      A。步骤 1 提出，审阅 CTC-P003 WARNING；步骤 2、步骤 3 不提出。依据 CTC-P003 同一句；步骤 2 不满足「后续步骤的安全性取决于它是否成功」，步骤 3 没有后续步骤。
    notes: |-
      「是否成功」可指「该步完成了没有」，也可指「该步做得对不对」；后一种理解会把步骤 2 也纳入，使一个三步的常规配置变更产生两条未决项，与规则自述的目的相悖。条文没有区分这两种理解。

  - probe: |-
      2(c) 「1. 执行 `make test`。2. 将 `config/` 目录备份到 `/backup/config/`。」
    level: |-
      CTC-P003（应）；检查步骤缺判据转 CTC-A005（必须）。
    scope: |-
      同 2(a)。
    trigger: |-
      步骤 1 是检查步骤（运行测试），没有「测试通过」之类的判据；步骤 2 没有成功判据。
    requires: |-
      检查步骤缺判据按 CTC-A005：只有当破坏性、不可逆或改变外部状态的操作取决于它的结果时，才提出或报告。操作步骤按 CTC-P003 两项条件。
    prohibits: |-
      补出「测试全部通过」作为判据；把编号顺序读成门控关系。
    exceptions: |-
      步骤 2 是末步。
    fork: no
    answer: |-
      不提出、不报告。步骤 1 缺判据，但步骤 2 的备份在文本中不取决于测试结果，按 CTC-A005「只有当破坏性、不可逆或改变外部状态的操作取决于它的结果，才提出或报告」不提出；即使把 `make test` 当作操作步骤，它也不改变外部状态。步骤 2 没有后续步骤，不满足 CTC-P003 的第二项条件。
    notes: |-
      若读者默认编号顺序表示「测试通过后才备份」，又把写入（可能覆盖）`/backup/config/` 视为改变外部状态，会按 CTC-A005 报 ERROR。我认为编号顺序本身不构成「取决于它的结果」，文本也没有暗示这一门控。

  - probe: |-
      2(d) 「1. 把 `users` 表导出为 `users.csv`。2. 清空 `users` 表。」
    level: |-
      CTC-P003（应）。
    scope: |-
      同 2(a)。
    trigger: |-
      两步都没有成功判据；步骤 2 是破坏性且不可逆的操作。
    requires: |-
      同 2(a)。
    prohibits: |-
      同 2(a)；补出「核对行数」之类的判据。
    exceptions: |-
      步骤 2 是末步。
    fork: yes
    readings:
      - id: A
        reading: |-
          宽读法：导出写出新文件，属于改变外部状态；步骤 2 清空表的安全性完全取决于导出成功。
        behavior: |-
          步骤 1 进「待确认」第 2 类；审阅 CTC-P003 WARNING（可升级）。
      - id: B
        reading: |-
          窄读法：导出不改变被操作对象的状态，不满足第一项条件。
        behavior: |-
          不提出；审阅无 finding。
    answer: |-
      A。步骤 1 提出，审阅 CTC-P003 WARNING，风险字段写明「导出未完成即清空表」时可报 ERROR；步骤 2 不提出。依据 CTC-P003 同一句。
    notes: |-
      与 2(a) 同一分叉。本例是第二项条件最清楚的情形，窄读法在这里产生的「不提出」最难辩护。

  - probe: |-
      2(e) 「1. 备份数据库。2. 将流量切换到备用集群。」
    level: |-
      CTC-P003（应）。
    scope: |-
      同 2(a)。
    trigger: |-
      两步都没有成功判据；步骤 2 改变外部状态。
    requires: |-
      同 2(a)。
    prohibits: |-
      同 2(a)。
    exceptions: |-
      步骤 2 是末步。
    fork: yes
    readings:
      - id: A
        reading: |-
          步骤 1 按宽读法改变外部状态，但步骤 2 切换流量不修改被备份的数据；备份失败不会让切换本身变得不安全，切换的回退方式是切回。第二项条件不满足。
        behavior: |-
          不提出；审阅无 finding。
      - id: B
        reading: |-
          「先备份、再做高风险操作」的顺序本身表明作者把备份当作切换的安全前提（例如切换后出现数据分叉时的恢复点），第二项条件满足。
        behavior: |-
          步骤 1 进「待确认」第 2 类；审阅 CTC-P003 WARNING。
    answer: |-
      A。不提出、不报告。依据 CTC-P003「且后续步骤的安全性取决于它是否成功」：步骤 2 的安全性不取决于步骤 1；步骤 2 没有后续步骤。
    notes: |-
      「取决于」由读者凭领域知识判断，条文没有给出判定方法；我采用的区分是「后续步骤是否修改或销毁前一步所保护的对象」，这条标准不在文本中。「数据库」未细化到实例，按 CTC-P002「步骤已写出具体对象、只是未细化到实例……不算缺少对象」不报告。

  - probe: |-
      3(a) 「紧急情况下，可以跳过审批直接上线。」（审阅）
    level: |-
      CTC-R004（应）→ WARNING；可升级为 ERROR。
    scope: |-
      审阅 SOP／变更流程，按 strict 阈值。
    trigger: |-
      许可条件「紧急情况下」由无判据词承担；许可去掉了上线前的审批。
    requires: |-
      §5 豁免不成立：上线即发布（CTC-P004 所列改变外部状态的操作），许可减少了它之前的复核，并免除了审批这一义务。报一条 CTC-R004 finding，六个字段齐全，位置逐字引用。
    prohibits: |-
      在建议修改中补出具体的紧急判据作为已决内容；修改被审文本。
    exceptions: |-
      无。
    fork: no
    answer: |-
      CTC-R004，WARNING；风险字段指名「操作者自行认定紧急并跳过审批上线」时，可按 §8 唯一的升级条款报 ERROR。依据 §5「不减少这类操作之前的检查或复核」（豁免不成立）、CTC-R004 列举的「紧急时」，以及 §8「必须 → ERROR，应 → WARNING」。
    notes: |-
      严重级别有升级裁量（见 1(c) notes）。

  - probe: |-
      3(b) 「紧急变更须在 24 小时内补录变更单。」（审阅）
    level: |-
      无 finding（我的答案）；替代读法为 CTC-R004（应）→ WARNING。
    scope: |-
      审阅变更流程，按 strict 阈值。
    trigger: |-
      义务句，适用对象是「紧急变更」，时限为「24 小时内」。
    requires: |-
      判断「紧急」是变更类别名称还是由无判据词承担的判定条件。
    prohibits: |-
      为显得周全而制造 finding（§8）；报告没有规则 ID 的 finding。
    exceptions: |-
      「24 小时内」给出具体时限，「以内」含端点（CTC-L004），不触发 CTC-R004 或 CTC-A005。
    fork: yes
    readings:
      - id: A
        reading: |-
          「紧急变更」是变更类别的名称：一次变更是否走了紧急流程是事后可判定的事实，不是执行时由操作者裁量的条件。义务有明确的时限。
        behavior: |-
          不报告；若全文没有其他问题，返回「未发现违规」。
      - id: B
        reading: |-
          「紧急」承担了义务的触发条件，与 CTC-R004 所列「紧急时」同类，没有判据。
        behavior: |-
          报 CTC-R004 WARNING。
    answer: |-
      A。不报告。依据：CTC-R004 针对的是「规范性指令的判定条件由无判据词承担」；本句的判定条件是变更所属类别，且时限「24 小时内」是具体数值。
    notes: |-
      较弱的第三种读法：「24 小时」的起点（变更开始、变更完成或上线时刻）未定，strict 阈值下可能被报为 CTC-A005。我认为起点差异不导致不同动作，属于「理论上可解析出两种读法」，不报告。

  - probe: |-
      3(c) 标题「## 紧急回滚（目标 5 分钟内完成）」下的步骤（审阅）
    level: |-
      标题本身无 finding（我的答案）；结构条件按 CTC-L001（必须）管辖子树；替代读法为 CTC-R004（应）→ WARNING。
    scope: |-
      审阅 runbook，按 strict 阈值。
    trigger: |-
      标题建立了流程名称「紧急回滚」与时间目标「5 分钟内」。
    requires: |-
      把标题建立的限定视为管辖其下全部步骤（§4「标题、列表层级与表格单元格建立的条件管辖其子树」、CTC-L001），不要求复制进每一步；「目标」是期望而非阻塞判据，按原强度理解（CTC-S003）。标题下各步骤是否缺判据，按探针 2 的 CTC-P003 规则逐步判断。
    prohibits: |-
      要求把「5 分钟」拆进每一步；把「目标」读作硬性时限；要求结构块移位（CTC-R005）。
    exceptions: |-
      无。
    fork: yes
    readings:
      - id: A
        reading: |-
          「紧急回滚」是流程名称，「紧急」不是操作者在这些步骤内需要判断的条件；「目标 5 分钟内完成」给出了数值。
        behavior: |-
          标题不产生 finding；只按 CTC-P003 等规则审各步骤。
      - id: B
        reading: |-
          §4 明说标题建立的是条件，于是「紧急」成为该子树的判定条件：是否走这套步骤由无判据词「紧急」决定。
        behavior: |-
          对标题报一条 CTC-R004 WARNING。
    answer: |-
      A。标题不报告；它建立的限定管辖下面全部步骤；步骤本身按 CTC-P003（缺判据时）或其他被触发的规则单独判断。依据 §4「结构也承载语义」一段与 CTC-L001「标题或父级列表项建立的条件管辖其子树」。
    notes: |-
      B 读法在文档同时存在「常规回滚」时更有力：此时选哪个流程取决于「紧急」的判断。探针只给出标题，无法据此确定。

  - probe: |-
      3(d) 「服务不稳定时，暂停发布。」（审阅）
    level: |-
      CTC-A005（必须）→ ERROR。
    scope: |-
      审阅发布流程，按 strict 阈值。
    trigger: |-
      规范性指令的触发条件「服务不稳定」是未定义的状态。
    requires: |-
      CTC-R004 把「服务稳定」这类未定义状态排除在无判据词之外，转 CTC-A005；§8 第 2 步要求规则字段填 CTC-A005，不另列 CTC-R004，按 CTC-A005 定级。
    prohibits: |-
      报为 CTC-R004 WARNING；在建议修改中补出稳定性指标作为已决内容。
    exceptions: |-
      本句不是许可，§5 的许可放宽豁免不适用；CTC-A005 对检查步骤的限制也不适用（这不是检查步骤）。
    fork: no
    answer: |-
      CTC-A005，ERROR。依据 CTC-R004「未定义的状态（「服务稳定」）……都不是这类词，按 CTC-A005 处理」，§8 第 2 步「CTC-R004 排除项中的未定义状态……finding 的规则字段填 CTC-A005」，以及「按第 2 步转为 CTC-A005 的 finding 按 CTC-A005 定级，不算升级」。

  - probe: |-
      4(a) 「把要求放宽一些」（改写，strict，来源是三条「必须」或「应」的 SOP）
    level: |-
      §3 调用方授权（可授权改动的白名单；规范强度调整须同时指明条目与目标强度）。
    scope: |-
      改写 strict 中调用方关于规范强度的指令。
    trigger: |-
      调整规范强度的授权，没有指明条目，也没有指明目标强度。
    requires: |-
      不据此改动正文；按「待确认」第 5 类请调用方指明调整哪些条目、调整到何种强度。其余文本照常按规则处理（未触发规则的原样返回）。
    prohibits: |-
      自行选择条目或强度后改动；借「放宽」删除条件或阈值（CTC-S001、CTC-S004 不可授权）。
    exceptions: |-
      无。
    fork: no
    answer: |-
      不改动正文，「待确认」第 5 类一行。依据 §3「调整规范强度的授权没有指明调整哪些条目，或没有指明调整到何种强度时，不据此改动正文，按第 5 类在「待确认」中请调用方指明」。
    notes: |-
      若「放宽」指放宽数值阈值或删掉某项要求，那不在可授权清单内，同样不改。两种理解的行为相同。

  - probe: |-
      4(b) 「把第 3 条的『应』改为『必须』」
    level: |-
      §3 调用方授权。
    scope: |-
      同 4(a)。
    trigger: |-
      规范强度调整，条目（第 3 条）与目标强度（必须）都已指明。
    requires: |-
      把第 3 条的「应」改为「必须」；授权本身即 CTC-R001 所要求的归因；其余条目不动。
    prohibits: |-
      连带修改其他条目；以「strict 不把「应」提升为「必须」」为由拒绝（那条限制的是模式本身，不是调用方授权）。
    exceptions: |-
      若第 3 条本来不含「应」，授权没有可作用的对象；文本没有直接规定，我会不改并按第 5 类请调用方确认。
    fork: no
    answer: |-
      执行改动。依据 §3「调用方可以显式授权的本来禁止的改动限于：调整来源中的规范强度……授权本身即构成 CTC-R001 所要求的归因」。

  - probe: |-
      4(c) 「把所有『必须』改为『应』」
    level: |-
      §3 调用方授权。
    scope: |-
      同 4(a)。
    trigger: |-
      规范强度调整；条目以「所有『必须』」指明，目标强度「应」已指明。
    requires: |-
      把来源中全部「必须」改为「应」；「应」的条目不动。
    prohibits: |-
      改动受保护标记内的「必须」（例如被引用的错误信息、代码注释）（§4、CTC-S005）。
    exceptions: |-
      无。
    fork: no
    answer: |-
      执行改动。依据 §3 同一句；「所有」已指明条目范围，目标强度也已指明，不落入「没有指明」的情形。
    notes: |-
      本探针的来源只含「必须」「应」，不触发下列问题：若来源含「须」「务必」或否定式「不得」「禁止」（与「必须」同级），「所有『必须』」是按字面只指「必须」一词，还是指全部必须级条目，文本没有规定。

  - probe: |-
      4(d) 「把这份 SOP 改得更严格」
    level: |-
      §3 调用方授权。
    scope: |-
      同 4(a)。
    trigger: |-
      规范强度调整的方向已给出（更严），条目与目标强度都没有指明。
    requires: |-
      不据此改动正文；按「待确认」第 5 类请调用方指明条目与目标强度。
    prohibits: |-
      借「更严格」新增要求、检查、阈值或判据（CTC-S002；新增命题不在可授权清单内）；自行把「应」改为「必须」。
    exceptions: |-
      无。
    fork: no
    answer: |-
      不改动正文，「待确认」第 5 类一行。依据同 4(a)。
    notes: |-
      若读者把「改得更严格」当作「指定改写目标」，那么它不授权任何语义变化，正文同样不变，差别只在是否输出「待确认」那一行。

  - probe: |-
      4(e) 「改写目标：让新入职的工程师也能看懂」
    level: |-
      §3 调用方授权中的「指定改写目标」。
    scope: |-
      同 4(a)。
    trigger: |-
      调用方指定了改写目标，没有涉及规范强度。
    requires: |-
      接受该目标并据此设定第 2 层「合格读者」的基准（新入职工程师）；授权构成 CTC-R001 的归因。所有语义不变量照常验证（「授权改变的是允许做什么，不改变任何语义不变量的验证方式」）：规范强度逐处不变（没有获得规范强度授权），不新增来源和上下文没有的解释、定义或背景（CTC-S002），不引入新术语（CTC-T001），受保护标记不动。新人执行所需而来源没有的信息进「待确认」第 5 类。
    prohibits: |-
      补写术语解释或背景说明；改动「必须」「应」；替换来源已统一的术语。
    exceptions: |-
      无。
    fork: yes
    readings:
      - id: A
        reading: |-
          改写目标只设定读者基准；每处改动仍须由某条规则触发，产出与没有目标时接近，只是在判断 CTC-P002 的操作未定和「待确认」项时以新人为准。
        behavior: |-
          改动最少；可能多出几条「待确认」。
      - id: B
        reading: |-
          改写目标是可授权的「本来禁止的改动」，授权本身构成 CTC-R001 归因，因此允许做没有规则触发、但服务于该目标的措辞与句式改动（改用更通俗的表达、调整语序），前提是不触碰任何语义不变量，不新增命题。
        behavior: |-
          措辞改动明显多于 A；结构、强度、术语、数值不变。
      - id: C
        reading: |-
          「看懂」需要补充：把授权读成解除了 CTC-S002，可以加术语解释与背景说明。
        behavior: |-
          输出新增命题。
    answer: |-
      B。依据 §3「调用方可以显式授权的本来禁止的改动限于：……指定改写目标或长度上限……授权本身即构成 CTC-R001 所要求的归因……授权改变的是允许做什么，不改变任何语义不变量的验证方式」。若改写目标不解除任何禁止，就没有理由列在「本来禁止的改动」中，所以 A 太弱；C 违反 CTC-S002，而 CTC-S002 不在可授权清单内。
    notes: |-
      文本没有说明「指定改写目标」具体解除了哪项禁止。B 与 CTC-R001「不得以「更清楚」「更专业」为由做等义替换」、CTC-T001「不得把来源已统一的术语换成模型自己偏好的说法」之间的边界要靠读者推断，不同读者的改动量会相差很大。

  - probe: |-
      5(a) 请求「润色这份发布说明，让它更有吸引力」是否属于使用范围
    level: |-
      frontmatter `description` 的激活范围（无规范级别）。
    scope: |-
      技能激活判断。
    trigger: |-
      文档类型「发布说明」在列表中，任务是「润色」，目标是「更有吸引力」。
    requires: |-
      按 description 末句排除营销取向的润色与一般性文字润色。
    prohibits: |-
      仅凭文档类型激活。
    exceptions: |-
      无。
    fork: yes
    readings:
      - id: A
        reading: |-
          任务目的落在排除项内：「润色」是一般性文字润色，「更有吸引力」是营销取向；文档类型只决定适用范围，不压过任务排除项。
        behavior: |-
          不激活本技能。
      - id: B
        reading: |-
          「发布说明」明确列在适用文档类型中，激活；激活后「更有吸引力」不是任何规则 ID 能归因的改动，结果近乎原样返回，或只修复译文腔、口语腔缺陷。
        behavior: |-
          激活，但产出与请求意图冲突。
    answer: |-
      不属于使用范围（A）。依据 description「不用于营销文案、品牌叙事、文学写作、SEO 与一般性文字润色」；§1 也说「对这类文本，本技能不提供改写目标」。
    notes: |-
      description 的排除项混合了文本类型（营销文案、品牌叙事、文学写作、SEO）与任务类型（一般性文字润色）；当适用文档类型遇上排除的任务类型时，哪一方优先，文本没有明说。§1 用「这类文本」指称，也偏向文本类型，给 B 留了空间。

