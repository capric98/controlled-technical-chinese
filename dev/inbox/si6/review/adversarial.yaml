reviewer: adversarial
model: claude-opus-5-5
files_read:
  - dev/prompts/si6-adversarial.md
  - dev/inbox/si6/base/SKILL.md
  - dev/inbox/si6/cand/v1/SKILL.md（与基线逐行 diff，确认只有 F1、R1、G1、B1、U1 五处替换，其余逐字相同）
  - dev/inbox/si6/cand/build.py
  - dev/inbox/si6/probes/probes.yaml
  - dev/inbox/si6/probes/resolutions.yaml
  - eval/reports/raw/si6-probe-base-r1/*.claude.json（25 个探针的 output 字段）
  - eval/reports/raw/si6-probe-base-r2/*.claude.json（同上）
  - eval/reports/raw/si6-probe-base-r3/*.claude.json（同上）
  - eval/reports/raw/si6-selfhost-base-r1/SH-base.claude.json
  - eval/reports/raw/si6-selfhost-base-r2/SH-base.claude.json
  - eval/gold/gold-rendering.yaml（只读 G-R-007）
  - eval/gold/gold-procedure.yaml（只读 G-P-004）
  - eval/gold/gold-semantic.yaml（只读 G-S-001）
  - docs/decisions/000-design.md（§20；为定位读过全文的标题行）
  - docs/decisions/009-si4-criteria-bounds-metric-conditions-terminology.md（第 20–129 行与关键词检索）
  - docs/decisions/010-si5-permission-description-exemptions-guarded-threshold.md

edits:
  - id: F1
    semantic_change: >-
      frontmatter 的 description 末尾追加 §1 第二段的排除项原文。正文规则、级别、输出契约都不变，改变的只是激活元数据：
      路由层在读到正文之前就能看到不适用范围。激活之后的运行行为没有新增要求，因为 §1 已有同一句话及其后果（「本技能不提供改写目标」）。
    level_change: none
    evidence_supports: partly
    evidence_note: >-
      build.py 引用 si5 自托管 5/6 报 CTC-P005。但在本基线这份文本（si5 v2）上：010 记录 v2 r1 报、v2 r2 未报；
      si6-selfhost-base r1 报的是 CTC-T001（术语约定／术语表）与 CTC-R004（「过长」），r2「未发现违规」，都没有报 description 缺排除项。
      在这份文本上合计 1/4。finding 确实指向这处缺失，改动逐字复制 §1，是能消除它的最小改动；但失败在当前基线上已不稳定复现。
      另外，评测管线把整份 SKILL.md 直接注入模型，测不到激活层的效果，F1 唯一可测的影响是自托管中的 CTC-P005 计数。
    clarification_or_new: clarification
    counterexamples:
      - kind: false_fire
        task: 改写
        mode: strict（错误信息属 strict 适用范围）
        input: |
          调用方请求：帮我润色一下这条错误提示。
          哎呀，连接数据库失败啦，请稍后再试哦！
        candidate_behaviour: >-
          只读 description 的激活判断把「润色」匹配到新增的「一般性文字润色」排除项，不激活本技能；
          即使激活，模型也可能依据 description 把任务归为一般润色，不施加 CTC-R003。
        why_wrong: >-
          错误信息在 description 列出的适用范围之内，CTC-R003 恰好覆盖其中的口语腔（「哎呀」「啦」「哦」）。
          中文用户常用「润色」指任何改写请求，而「一般性」修饰到哪里，在激活时无从判断。这处歧义在 §1 里已经存在，
          但只在激活之后才被读到；F1 把它移到决定是否激活的位置。可信度中低：description 同时列出了「告警与错误信息」，多数路由仍会激活。
      - kind: false_fire
        task: 改写
        mode: standard（发布说明）
        input: |
          ## v3.2 发布说明
          全新架构，性能飞跃，带来前所未有的流畅体验！
          - 修复了一下 `--retry` 在超时后不生效的问题。
          - `max_conn` 的默认值由 100 改为 200。
        candidate_behaviour: >-
          首句是推广语句，模型可能依据 description 的「不用于营销文案」把整篇当作营销文案原样返回，
          不处理第一条中的口语填充「一下」（CTC-R003）。
        why_wrong: >-
          发布说明在 description 与 §3 standard 中都明确列为适用范围，一句推广语不改变文档类型。正确做法是：推广句不提供改写目标（§1），
          技术条目照常按规则处理。可信度低：description 明确点名「发布说明」，列举项可以消解冲突；正文本来就有同一排除句，行为与基线差别很小。
      - kind: missed_fire
        task: 改写
        mode: standard
        input: |
          我们的 API 网关每秒可处理 10 万请求，让你的业务飞起来！立即免费试用。
        candidate_behaviour: >-
          description 的适用列表含「API 与开发者文档」，模型可能激活，并按 CTC-R003 把「让你的业务飞起来」改成技术陈述。
        why_wrong: >-
          这是营销文案，按 §1 本技能不提供改写目标，改成技术语体会损害推广意图。但基线 §1 已有同一排除，激活后的行为与基线相同；
          F1 只会让排除更早生效，不会更晚。结论：尝试过「营销内容夹带技术数据」和「对 API 文档提出 SEO 请求」两个方向，
          都构造不出由 F1 引入的漏触发。
    conflicts:
      - 无规则冲突。description 与 §1 文字一致。Agent Skills 约束：description 由 204 字增至 235 字，远低于 1024 字的上限；YAML 仍是单行纯量，不含 ASCII 冒号加空格。
    verdict: accept
    rationale: >-
      这是澄清：逐字复制 §1，没有级别变化，正文行为不变。唯一的新风险是「一般性文字润色」进入激活路径，
      这是既有措辞换了位置，影响低，也无法在本管线中测出。没有失败输入支持修改措辞。

  - id: R1
    semantic_change: >-
      CTC-R004 开放类的列举增加「紧急时」。比基线多出的规定：规范性指令中以「紧急时」承担判定条件的，归 CTC-R004（应，review 下 WARNING，
      可按 §8 升级），不再按 R004 排除项中的「未定义的状态」归 CTC-A005（ERROR）。改写时同样进「待确认」，但类别由第 1 类变为第 4 类，
      并适用 §5 情态段的强度建议栏。
    level_change: none（规则级别不变；改归 R004 的 finding 默认严重级别由 CTC-A005 的 ERROR 变为 WARNING，M3 已接受，风险字段指名不同动作时仍可报 ERROR）
    evidence_supports: partly
    evidence_note: >-
      si6 基线上 OR-07 与 EM-01 共 6/6 报告，规则 ID 6/6 都是 CTC-A005，一致地不符合 M3 的预期（R004）。build.py 引用的 si5「分化」
      在 si6 基线上没有出现。六次运行给出的理由都用了排除项的说法：「情况紧急」「紧急情况」是「未定义的状态」。所以失败的直接原因是
      排除项的例子「服务稳定」（名词＋形容词）在表面形式上比列举词更像「情况紧急」。R1 在列举中加「紧急时」而不动排除项，与 si4 加
      「条件允许时」的先例同型（009），是最小的澄清。但它能否压过排除项，取决于模型把「情况紧急时」「紧急情况下」当作「紧急时」的变体，
      还是当作「情况＋紧急」这个未定义状态。这需要 v1 在 OR-07、EM-01 上的运行来证明，本审阅按规定不读这些输出。
    clarification_or_new: clarification（列举本是「等表示程度、时机或裁量的词」的开放类，「紧急时」属时机与裁量词）
    counterexamples:
      - kind: false_fire
        task: 改写
        mode: strict
        input: |
          ## 紧急回滚（目标 5 分钟内完成）

          1. 在发布平台点击「回滚到上一版本」，确认目标版本号为 `v3.14.2`。
          2. 回滚完成后刷新健康检查页，确认 `/healthz` 连续 3 次返回 `200`。
          3. 在 `#incident` 频道同步回滚结果与影响范围。
        candidate_behaviour: >-
          「紧急」进入列举后，模型可能把标题「紧急回滚」读作管辖子树的条件（§4：标题建立的条件管辖其子树），
          按 CTC-R004 在「待确认」中提出「『紧急』未给出判据」。
        why_wrong: >-
          这是 G-P-004，金标是过度编辑陷阱，要求基本不动、不新增内容。「紧急回滚」是流程名称，不是由读者判定的触发条件。
          列举词按表面形式匹配到流程名或类别名（「紧急回滚」「紧急变更」）就是误报。基线的列举中没有这个词，触发概率更低。
      - kind: false_fire
        task: 审阅
        mode: review
        input: |
          ## 定义
          紧急情况：`P0` 级告警持续 5 分钟以上。
          ## 规则
          1. 生产变更须经双人复核后执行。
          2. 紧急情况下，也可以先执行、事后补复核。
        candidate_behaviour: 列举中有「紧急时」，模型按表面匹配，以 CTC-R004 报告「紧急情况下」缺少判据。
        why_wrong: >-
          判定条件已由同一文档的定义给出（P0 级告警持续 5 分钟以上），R004 的触发前提「判定条件由无判据词承担」不成立。
          可信度中：列举词越具体，按词匹配的倾向越强；而在基线下，模型要先判断是否「未定义的状态」，这里显然已定义。
      - kind: missed_fire
        task: 审阅
        mode: review
        input: |
          ## 生产变更
          1. 生产变更须经双人复核后执行。
          2. 情况紧急时，也可以先执行、事后补复核。
        candidate_behaviour: >-
          模型仍把「情况紧急」读作主谓结构的未定义状态（与排除项的例子「服务稳定」同形），按排除项报 CTC-A005，R1 不起作用。
        why_wrong: >-
          违反 M3（「情况紧急时」归 CTC-R004）。基线 6/6 的理由都是这一读法；列举中的「紧急时」与「情况紧急时」「紧急情况下」都不字面相同；
          排除项与列举之间没有写出区分标准。M3 的标准（把是否、何时、多大程度行动留给读者）只写在决定里，没有写进正文。
          这是可能的漏触发，需由 v1 的运行验证。
      - kind: missed_fire
        task: 审阅
        mode: review
        input: |
          ## 主从切换
          1. 主从切换建议由 DBA 执行。
          2. 紧急时，值班工程师也可以执行切换。
        candidate_behaviour: >-
          与 G1 合用时：默认动作是切换，许可的做法没有在默认动作之外增加操作；「建议」不是义务，「来源规定的义务不被免除」不起作用；
          于是落入 §5 豁免，按「后两种情形……也不按 CTC-A005 或 CTC-R004 提出或报告」，「紧急时」不报告。
        why_wrong: >-
          与 EM-01 相比只把「须」换成「建议」，许可同样让另一个执行者对生产库做改变外部状态的操作。基线下第三个限定使它照报。
          R1 刚把「紧急时」定为 R004 词，G1 又让它在最常见的许可句式中被豁免，两处改动合起来，R1 在这一类输入上失效。
    conflicts:
      - 与 R004 排除项「未定义的状态（「服务稳定」）」以及 §8 第 2 步把「CTC-R004 排除项中的未定义状态」转 CTC-A005 的路由，在「情况紧急」上重叠；正文没有区分标准，R1 以列举压过排除，没有消除重叠。
      - §5 情态段要求改写时对 R004 项「列出其可能的两种以上强度并给出建议」，对象是「承担义务的条件」；OR-07、EM-01 中「紧急时」限定的是许可（免除或放宽义务），没有可列举的强度。改归 R004 后，改写时第四栏怎样填写未定，可能诱发编造强度。影响低。
    verdict: accept
    rationale: >-
      这是对既有开放类的澄清，有 si4「条件允许时」的先例，没有级别变化，不改排除项，也不引入探针原文。两个误报方向（流程名、文中已定义的紧急情况）
      可信度中低，而且 R004 正文的触发前提本来就排除它们，不构成修改措辞的失败输入。建议在定稿前核对 v1 上 G-P-004 的结果，
      以及 OR-07、EM-01 的规则 ID。

  - id: G1
    semantic_change: >-
      基线的第三个限定看「所许可的操作本身」是否属于破坏性、不可逆或改变外部状态的操作；候选看「所许可的做法」相对默认动作是否「增加」这类操作。
      豁免集合严格扩大（基线豁免 ⊆ 候选豁免）：凡是许可的操作本身属于这一类、但默认动作里已有同种操作的许可，都从「照报」变为「不报」。
      新进入豁免的不只 GO-03 的分批，还有：改变时机（先执行、事后补复核）、更换执行者（DBA 换成值班工程师，CI 换成人工）、
      省去默认动作中建议的检查（跳过预发验证）、缩小范围（只删 7 天前的文件）。这些情形是否仍被报告，改由「来源规定的义务不被免除」
      单独承担，而这个限定对「建议」级的检查与执行者不起作用。
    level_change: none
    evidence_supports: partly
    evidence_note: >-
      GO-03 基线 1/3 不报、2/3 报 CTC-A005，r2、r3 的理由都是「许可的操作是发布，会改变外部状态」。失败确实由第三个限定的措辞引起，
      M5 也明确要求不报。但候选把比较基准换成「默认动作之外」，作用远超 GO-03 的分批形态。登记的边界只有 OR-06、GO-02（新增删除与改配置），
      没有一个探针检验时机、执行者或省去检查。同时，OR-07 与 EM-01 在基线上的 6/6 报告都依赖第三个限定：OR-07 r1、r3 同时援引
      「免除义务」与第三个限定，r2 只援引第三个限定；EM-01 三次都以「切换会改变外部状态」为不适用豁免的理由。候选下这个理由不再成立，
      两条都只剩义务限定可依。所以这不是最小改动。
    clarification_or_new: new（改变豁免的判定对象；与 010 M8 的书面范围相抵，见 conflicts）
    counterexamples:
      - kind: false_fire
        task: 审阅
        mode: review
        input: |
          ## 发布 `billing`
          变更脚本建议先在预发环境验证，再在生产执行。若改动较小，也可以直接在生产执行。
        candidate_behaviour: >-
          这里的误触发指豁免误触发，结果是漏报。默认动作已含生产执行；许可的做法没有增加操作，只省去一项建议的检查；「建议」不是义务；
          于是豁免成立，「改动较小」不报告。
        why_wrong: >-
          「较小」决定是否在改变外部状态的生产操作之前省去验证，不同操作者会做出不同的动作（验证或不验证）。基线照报（生产执行改变外部状态）。
          同类风险在 CTC-A005 的检查步骤门槛下是要报告的：「确认无异常后发布」判据含义未定会报，而候选下「若改动较小，也可以跳过验证直接发布」
          不报，两处对「这类操作之前的检查」给出相反的处理。
      - kind: false_fire
        task: 审阅
        mode: review
        input: |
          ## 主从切换
          1. 主从切换建议由 DBA 执行。
          2. 紧急时，值班工程师也可以执行切换。
        candidate_behaviour: >-
          切换已在默认动作中，许可只更换执行者；「建议」不构成义务；豁免成立，「紧急时」既不按 CTC-R004 也不按 CTC-A005 报告。
        why_wrong: >-
          许可让未必具备资格的执行者对生产库做改变外部状态的操作，而条件没有判据。EM-01（「须由 DBA 执行」）预期报 R004，
          这里只差一个情态词，风险相同。即使是 EM-01 本身，候选下也只剩义务限定这一条依据；而豁免的前提「只放宽对操作者的限制」
          与「免除来源规定的义务」在「须」级限制上描述的是同一件事，正文没有区分标准，基线运行从未需要做这个区分。
      - kind: false_fire
        task: 改写
        mode: strict
        input: |
          ## 发布
          发布由 CI 流水线自动完成。若流水线卡住，也可以手动执行 `./deploy.sh prod`。
        candidate_behaviour: >-
          「默认动作」是系统行为（CI 发布），许可的手动发布与之同种，没有「增加」操作；豁免成立，「卡住」不进「待确认」。
        why_wrong: >-
          默认动作由系统执行、许可动作由操作者执行时，「默认动作之外」无从判定。流水线恢复后，手动发布可能造成重复发布；
          「卡住」的判据决定操作者是否做这项改变外部状态的操作。基线照报。来源没有写默认动作时（只有「若 X，也可以 Y」），
          候选会把 Y 整体视为增加，与基线一致；问题出在默认动作由另一个执行者完成的情形。
      - kind: missed_fire
        task: 审阅
        mode: review
        input: |
          ## 发布窗口
          版本发布建议安排在工作日 14:00–17:00。若待发布的变更较多，也可以分两批发布。
        candidate_behaviour: >-
          「增加……操作」可以按次数读：分两批发布比默认的一次发布多出一次发布，即在默认动作之外增加了一次改变外部状态的操作；
          豁免不成立，「较多」仍按 CTC-A005 报告。
        why_wrong: >-
          违反 M5（GO-03 不报）。候选没有说明「增加」比的是操作种类还是次数，M5 的意图是种类（「拆批发布仍是发布」）。
          这是候选在自己的目标探针上可能出现的漏触发，需由 v1 的 GO-03 运行验证。
    conflicts:
      - 与 010 M8 的书面范围冲突：M8 写的是豁免不覆盖「所许可的破坏性、不可逆或改变外部状态的动作」，GO-03 的许可动作（发布）正属此类。si6 M5 较新，但按 AGENTS.md，较新的决定只有在明确取代较旧决定时才优先；si6 的决定记录需写明 M5 收窄了 010 M8。
      - 与 CTC-A005 的检查步骤门槛（只有当破坏性、不可逆或改变外部状态的操作取决于检查结果，才提出或报告）方向相反：候选豁免「省去这类操作之前的检查」的无判据条件，而 A005 报告「这类操作之前的检查」判据未定。
      - 与 §5 同句的「来源规定的义务不被免除」：候选让 OR-07、EM-01 的报告完全依赖这一限定，而它与豁免前提「只放宽对操作者的限制」在「须」级限制上指的是同一个动作。
    verdict: revise
    revised_wording: 所许可的做法也不在默认动作之外增加破坏性、不可逆或改变外部状态的操作，不减少这类操作之前的检查或复核，也不更换其执行者
    rationale: >-
      M5 要求 GO-03 不报，候选做到了，但同时豁免了三类 M5 提问时没有呈现、也没有探针检验的许可：省去检查、推迟复核、更换执行者。
      修订保留候选的「默认动作之外」比较，只加两个限定，每个都有失败输入：减少检查或复核（跳过预发验证；OR-07 的先执行、事后补复核），
      更换执行者（建议由 DBA 执行的切换；CI 改为人工发布；EM-01）。集合关系是 基线豁免 ⊆ 修订豁免 ⊆ 候选豁免：两个新限定只约束许可做法中
      出现的「这类操作」，许可的操作本身不属这一类时（基线已豁免的情形）它们不起作用，所以修订不会让任何基线不报的条目被报告，
      没有新增要求。边界：GO-03（同种操作、同样的检查、同一执行者）不报；G-S-001 的「推迟到下一维护窗口」与 ZA-01 的「顺延到下周窗口」
      是整体推迟操作，检查仍在操作之前，不报；OR-06、GO-02 照报。修订与 M5 问题中的「只看」字面不一致，但不改变 M5 列出的任何结果；
      「省去检查、更换执行者」这两类情形需维护者决定。建议定稿前把「跳过建议的验证」与「建议级执行者加紧急时」登记为探针，
      在候选与修订上各跑三次。

  - id: B1
    semantic_change: >-
      CTC-P003 自身判据门槛的第一个条件增加括注：为后续「这类操作」（破坏性、不可逆或改变外部状态的操作）建立恢复点的备份、快照也算。
      后果：这类备份步骤缺少成功判据时，只要第二个条件成立，就按「待确认」第 2 类提出，review 下报 CTC-P003。「也算」同时暗示备份、快照
      本身不属于这一类，只有承担恢复点功能时才算。
    level_change: none
    evidence_supports: partly
    evidence_note: >-
      运行时在基线上已经如此：GO-01 3/3 报 CTC-P003，GO-01r 3/3 提出备份判据，GO-05 3/3 不报。所以没有探针在改动前失败，所引的失败是
      si5 v2 第二次冷解码把字面门槛读成不含备份，这是解码层的分叉，不是运行失败。作为澄清成立。但 M6 向维护者提问的措辞是
      「为后续破坏性操作建立恢复点的备份、快照也算」，候选写成「为后续这类操作」，把恢复点所服务的操作从破坏性操作扩大到全部改变外部状态
      的操作（重启、切流量、扩缩容、发布）。这一扩大没有证据：GO-01 的后续操作是 DROP TABLE（破坏性且不可逆），没有探针检验备份之后
      只是改变外部状态的情形。resolutions.yaml 的英文摘要写作「a later guarded operation」，与维护者所答问题的中文措辞不一致，应以所答问题为准。
    clarification_or_new: clarification（对 GO-01 形态而言）；「这类操作」超出 M6 的部分是新增
    counterexamples:
      - kind: false_fire
        task: 审阅
        mode: review
        input: |
          备份数据库后，将流量路由至备用集群。
        candidate_behaviour: >-
          备份为后续切流量（改变外部状态）建立恢复点，按括注「也算」；切流量是否安全被读作取决于备份是否成功；于是报 CTC-P003「备份缺少成功判据」。
        why_wrong: >-
          这是 G-R-007，金标是过度编辑陷阱，期望无 finding。括注「为后续这类操作建立恢复点」几乎蕴含第二个条件「后续步骤的安全性取决于它是否成功」，
          使第二个条件对备份失去过滤作用，判断因此偏向报告。按 M6 原问题的「破坏性操作」，切流量不在其内，这里不触发。可信度中：
          来源是一句连动句而不是编号步骤，模型未必把它当作 P003 的步骤。
      - kind: false_fire
        task: 改写
        mode: strict
        input: |
          ## 滚动升级 `web` 内核
          1. 为 `web-01` 创建快照。
          2. 升级 `web-01` 的内核并重启。
          3. 为 `web-02` 创建快照。
          4. 升级 `web-02` 的内核并重启。
          5. 为 `web-03` 创建快照。
          6. 升级 `web-03` 的内核并重启。
        candidate_behaviour: >-
          三个快照步骤都为后续重启（改变外部状态）建立恢复点，都缺少成功判据，「待确认」出现三条同型条目；再加上重启步骤本身，可能更多。
        why_wrong: >-
          P003 末句的目的就是「以免正常的流程文档产生成串的未决项」，HR-01 的维护者决定是只提出发布步骤这一项。重启前打快照是常规预防，
          不是破坏性操作的恢复点；按「破坏性或不可逆」这一门槛，这里不触发。
      - kind: missed_fire
        task: 审阅
        mode: review
        input: |
          ## 清理归档表
          1. 备份 `orders` 库后，执行 `DROP TABLE orders_archive;`。
          2. 在 `#dba` 频道通报。
        candidate_behaviour: >-
          备份不是独立步骤，括注挂在「该步」上，不适用；第 1 步作为整体是破坏性操作，但第 2 步（通报）的安全性不取决于它，不提出。
          备份是否成功没有被提出。
        why_wrong: >-
          风险与 GO-01 相同（DROP 依赖备份），只因写成一步而结果不同。基线同样不提出，不是 B1 引入的回归；本审阅不据此建议新增约束，
          只记录 B1 的效果依赖步骤切分。另试过「导出」「复制」这类事实上的备份（「将 `report_2023` 导出到 S3 后执行 DROP」）：
          括注按功能（建立恢复点）表述，导出到外部存储本身也可读作改变外部状态，构造不出可信的漏触发。
    conflicts:
      - 「破坏性、不可逆或改变外部状态的操作」还用于 §5 豁免与 CTC-A005 的检查步骤门槛（010 Limitations 已指出三处共用一个未定义的类）。括注只加在 P003，「也算」暗示其他两处的备份不属此类：例如「确认磁盘空间充足后，备份 `orders` 库」中的检查是否报告，会因 P003 的括注偏向不报。同一术语在三处外延不同。
      - 与 HR-01、HR-02 的维护者决定（只提出发布步骤一项）有张力：备份之后是改变外部状态的操作时，候选会增加条目。
    verdict: revise
    revised_wording: （为后续破坏性或不可逆操作建立恢复点的备份、快照也算）
    rationale: >-
      只把「这类操作」收窄为「破坏性或不可逆操作」，与 M6 所答问题中的「破坏性操作」一致；「或不可逆」沿用 009 时的门槛措辞，覆盖密钥轮换、
      覆盖写入这类恢复点有意义的操作。GO-01（DROP TABLE）仍被覆盖，GO-05 不受影响；G-R-007 与「快照后重启」的常规流程不再被括注覆盖。
      修订比候选更窄：括注纳入的备份集合是候选的子集，没有新增要求。如果维护者确认 M6 的本意是「a later guarded operation」，候选措辞成立，
      但应先在 v1 上跑 G-R-007 与一个「快照后重启」探针。

  - id: U1
    semantic_change: >-
      §3 调用方授权增加一句：调整规范强度的授权没有指明哪些条目、调整到何种强度时，正文不改，按第 5 类在「待确认」中请调用方指明。
      基线只要求授权「显式」，对「把要求放宽一些」这类有方向、无范围的授权没有写结果；候选规定的结果是不执行并提出。
      「正文不改」字面上冻结整篇正文，不只冻结规范强度。双向适用：放宽与收紧都是「调整」。
    level_change: none（§3 授权段落没有级别栏；措辞是直陈，效力相当于硬性约束）
    evidence_supports: yes
    evidence_note: >-
      AU-01 基线 r3 把全部强度降一级（「必须」改为「应」，「应」改为「建议」），r1、r2 正文不动、逐条提出。失败真实，直接源于把「放宽一些」
      读作 §3 的显式强度授权，U1 直接回答这一读法。AU-03（条目与强度都已指明）是登记的边界，基线 3/3 正确执行。不足之处：
      「正文不改」超出了消除该失败所需的范围，只需不据此改动正文。
    clarification_or_new: clarification（写出「显式授权」在强度调整上的含义；§5 已禁止替作者做出未经授权的规范决定）
    counterexamples:
      - kind: false_fire
        task: 改写
        mode: strict
        input: |
          调用方指令：改写这份 SOP，把要求放宽一些。
          ## 数据库变更
          1. 变更必须在维护窗口内执行哈。
          2. 执行前必须进行全量备份的操作。
          3. 变更脚本应先在预发环境验证。
        candidate_behaviour: 按「正文不改」原样返回整篇正文，只在「待确认」中请调用方指明放宽的范围。
        why_wrong: >-
          语气词「哈」（CTC-R003 口语腔）与名词化赘语「进行……的操作」（CTC-R003 译文腔）与授权无关，正常改写应按规则修复。
          U1 的理由只是不得替调用方决定强度，没有理由连带冻结其他可归因于规则 ID 的改动；这也与 §7 只改写被触发部分的流程相抵。
          基线 r1、r2 的做法（强度不动、逐条提出）不会阻止这些修复。
      - kind: missed_fire
        task: 改写
        mode: strict
        input: |
          调用方指令：改写这份 SOP，把第 2 条放宽一些。
          ## 数据库变更
          1. 变更必须在维护窗口内执行。
          2. 执行前必须完成全量备份。
          3. 变更脚本应先在预发环境验证。
        candidate_behaviour: >-
          「没有指明哪些条目、调整到何种强度」可读作两项都没有指明（M7 的英文摘要是 names neither … nor）；这里条目已指明，U1 不适用，
          模型自行把第 2 条从「必须」降为「应」或「可以」。
        why_wrong: >-
          目标强度仍由模型决定，这正是 U1 与 §5 要阻止的未经授权的规范决定：「应」与「可以」都比「必须」弱，选哪一个是规范决定。
          基线同样如此，不是 U1 引入的回归；但 U1 中的顿号使「只指明一项」的处理在两种读法之间分叉。按本审阅的约束（revise 不得扩大候选），
          这里不改措辞，只建议登记探针。
      - kind: missed_fire
        task: 改写
        mode: strict
        input: |
          调用方指令：改写这份 SOP，改写目标：语气别那么生硬。
          ## 数据库变更
          1. 变更必须在维护窗口内执行。
          2. 执行前必须完成全量备份。
          3. 变更脚本应先在预发环境验证。
        candidate_behaviour: >-
          模型把指令归为「指定改写目标」而不是「调整规范强度的授权」，U1 不适用；按改写目标把「必须」改为「需要」或「请」。
        why_wrong: >-
          「必须」改为「请」改变了言语行为类型（CTC-S003 明列「请→须」为违规，反向亦然），§3 末句也说授权不改变语义不变量的验证方式，
          所以基线条文已禁止。风险在于 U1 只点名强度授权，可能被反面解读为其他形式的放宽请求不受此限。可信度中低，不构成修改措辞的失败输入。
    conflicts:
      - 「待确认」第 5 类定义为「执行所需而来源与上下文都未提供的信息」（CTC-S002），此前用于文档执行所缺的信息；U1 把它用于调用方任务指令的范围。不矛盾，但扩展了第 5 类的所指，可能诱发把其他任务层面的疑问（如 AU-02 中「刚入职的工程师」的知识范围）也作为第 5 类提出。
      - 「待确认」每项一行、带「位置」栏；对整篇授权提出时是一条还是逐条（基线 AU-01 r1、r2 各三条），U1 没有说明，条目数会在运行间变化。不影响 AU-01 的判定。
      - 「正文不改」与 §7（只改写被触发的部分，被触发的部分照常改写）相抵：一处含糊的强度授权会让整篇正文的其他规则全部不执行。
    verdict: revise
    revised_wording: 调整规范强度的授权没有指明哪些条目、调整到何种强度时，不据此改动正文，按第 5 类在「待确认」中请调用方指明。
    rationale: >-
      只把「正文不改」改为「不据此改动正文」：仍然禁止依据含糊授权改动强度或内容，AU-01 的预期（强度不变、提出对应条目）不变；
      不再冻结与授权无关、可归因于规则 ID 的改动。修订比候选更窄，没有新增要求。M7 问题的措辞是「正文不动」，其对照项是「全文统一降一级」，
      修订保留这一意图；与授权无关的规则修复是否也应冻结，M7 没有被问到，需维护者确认。明确的授权不受影响：「把第 3 条的『应』改为『必须』」
      指明了条目与强度，「把所有『必须』改为『应』」以「所有『必须』」指明条目、以「应」指明强度，都照常执行。方向相反的「改得更严格一些」
      同样属于「调整」，按本句提出、不执行。

other_observations:
  - G1 与 R1 合用会相互抵消：「主从切换建议由 DBA 执行；紧急时，值班工程师也可以执行」在候选下被豁免，R1 新增的「紧急时」在最常见的许可句式中不起作用。按修订后的 G1（不更换其执行者）可恢复报告。
  - 五处改动中有三处（R1、G1、B1）的风险只能用候选的运行判定，而本审阅按规定没有读候选输出。建议核对：OR-07、EM-01 在 v1 上的规则 ID（R1 是否压过排除项，以及 G1 下是否仍被报告）；GO-03 在 v1 上是否仍因「次数」读法被报告；G-R-007、G-P-004 在 v1 与基线上的结果（gold 的基线输出不在本审阅可读范围内）。
  - 建议登记的新探针，每个对应上文一个反例，应在任何运行之前登记：跳过建议的验证（G1）；建议级执行者加紧急时（G1 与 R1）；CI 改人工发布（G1）；滚动快照加重启（B1）；只指明条目的强度授权「把第 2 条放宽一些」（U1）；含规则修复点的含糊强度授权（U1）；文中已定义的「紧急情况」（R1）。
  - G1 中「增加……操作」比的是种类还是次数没有写明。如果 v1 的 GO-03 仍分叉，可以考虑写成「别种」，但这会扩大豁免，需维护者决定，不在本次 revise 的范围内。
  - F1 的效果在激活层，现行评测把整份 SKILL.md 直接注入模型，测不到；它唯一可测的指标是自托管中的 CTC-P005 计数，而该 finding 在本基线文本上只出现了 1/4。
