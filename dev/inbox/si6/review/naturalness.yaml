passages:
  - id: F1
    candidate_text: "不用于营销文案、品牌叙事、文学写作、SEO 与一般性文字润色。"
    naturalness: 4
    quotes:
      - "「不用于……」与正面范围「……时使用」句式对称，简洁，是自然的技术说明。"
      - "列表「营销文案、品牌叙事、文学写作、SEO 与一般性文字润色」与 §1「不适用于营销文案、品牌叙事、文学写作、SEO 与一般性文字润色」逐字一致，术语一致（CTC-T001 自托管）。"
      - "动词与 §1 不同：description 用「不用于」，§1 用「不适用于」。在 description 中与「……时使用」对称，差异可以接受，不必统一。"
      - "并列项类别不齐：「营销文案」「品牌叙事」是文本类型，「文学写作」「一般性文字润色」是活动，「SEO」是领域；接在「不用于」之后都能成立，读者不会因此卡顿。"
    ambiguity:
      - "「一般性文字润色」中的「一般性」有两种读法：(a) 非技术文本的通用润色；(b) 不针对具体缺陷、只求读起来更好的润色，不论对象是不是技术文本。按 (b)，「帮我润色这段 API 文档」同时命中正面范围（改写中文技术内容）与排除范围，路由器可能不激活本技能。该短语在 §1 已经存在，但写进 description 后直接影响激活。消解它属于语义决定，本审阅不给改写；若作者意图是 (a)，可以考虑写明对象（例如「非技术文本的一般性润色」），须另经语义审阅确认。"
      - "否定与并列：「不用于 A、B……与 E」按中文习惯读作分别否定（每一项都不用于），不存在「不用于 A 与 E 同时出现」的现实读法。此处无歧义。"
    over_control_risk:
      - target_text: "请润色这段 README：「本工具可以帮你快速地进行配置文件的生成。运行 `gen-config --out ./conf` 即可。」"
        risk: "按读法 (b)，路由器可能把请求当作一般性文字润色而不激活本技能；未受控的润色可能改动 `--out ./conf` 或增删情态。这是漏激活，不是技能内部的过度改写。"
      - target_text: "发布说明：「v2.3 全面升级，性能飞跃！修复了 `--timeout` 在 Windows 上不生效的问题。」"
        risk: "发布说明在正面范围内，但首句带营销腔。模型可能因排除句把整段视为营销文案而不处理，漏掉对第二句及其受保护标记的保护。反方向（把营销句当作 CTC-R003 缺陷改写）已由 §1「对这类文本，本技能不提供改写目标」约束，风险较低。"
    equivalent_rewording: "无"
    rewording_is_equivalent_because: "现有措辞已经自然。唯一的问题是「一般性」的歧义，消解它会改变激活边界，不属于等义改写。"
    normative_vocabulary: "ok：新句是范围说明，不含规范词；用的是描述性的「不用于」，不是「不得用于」，与 description 的描述语气一致。无口语腔或译文腔。"

  - id: U1
    candidate_text: "调整规范强度的授权没有指明哪些条目、调整到何种强度时，正文不改，按第 5 类在「待确认」中请调用方指明。"
    naturalness: 3
    quotes:
      - "「没有指明哪些条目、调整到何种强度」：并列宾语不平行。前项「哪些条目」是名词性疑问短语，后项「调整到何种强度」是动词短语，前项省掉了动词「调整」，读者要先自己补出「调整哪些条目」。"
      - "「哪些」与「何种」在同一并列结构中语体不一，前者中性，后者书面。"
      - "「正文不改」：受事主语四字句，简短，但单字动词「改」在本文其他处不单独使用。本文的对应说法是「该处不改写」（§2）、「保持原表述」（§5、CTC-A005）、「原样保留」「保留原句」（§5）、「原样返回」（description、CTC-R001、§10）。「正文不改」偏口语，与这些说法都不一致。"
      - "「正文」在本文中指输出契约里的整篇改写结果（§3「只返回改写后的中文正文」「在正文末尾追加「待确认」小节」），因此「正文不改」最直接的读法是整篇正文都不改，范围大于作者可能想说的「相关条目的规范强度不调整」。"
      - "「按第 5 类在「待确认」中请调用方指明」：「指明」与前文「没有指明」呼应，衔接清楚。"
    ambiguity:
      - "否定作用域（CTC-A004 自托管）：「没有指明哪些条目、调整到何种强度时」可读作 (a) 两项中任一项没有指明即触发，或 (b) 两项都没有指明才触发。按 (b)，「把第 2 步的强度调高」（条目已指明、目标强度未指明）不触发本句，模型可能自行选定「必须」，替作者做规范决定。从本段「未获授权的同类改动一律不得做」与 §5「不得把它替换为具体强度」推断，作者意图是 (a)，但字面没有排除 (b)。消歧候选（作者确认意图是 (a) 后才等义）：「调整规范强度的授权未指明调整哪些条目，或未指明调整到何种强度时，……」。否定分别落在两个析取项上，只剩 (a) 一种读法。"
      - "「正文不改」的范围：(a) 整篇正文一律不改，包括其他规则触发的改动；(b) 只是授权涉及的规范强度不调整，其他规则触发的改动照常进行。按 (a)，同一任务中由 CTC-R003 等规则触发的改动全部冻结，已经指明的那部分授权也不执行。按 §2「该处不改写」的先例，作者意图更可能是 (b)。消歧候选（作者确认意图是 (b) 后才等义）：「……时，不调整这些条目的规范强度，按第 5 类在「待确认」中请调用方指明」，或「……时，规范强度保持来源原样，……」。"
      - "部分指明：调用方只对一部分条目给全信息时，本句没有说明已指明的部分是否照做。读法 (b) 下照做，读法 (a) 下全部不做。上一条消歧后，此问题随之消失。"
      - "分类归属（仅提示，不属于措辞问题）：第 5 类定义为「执行所需而来源与上下文都未提供的信息」，授权细节是否属于「执行所需」可能让模型犹豫。本句已明文指定第 5 类，可以视为对定义的补充，不必改。"
    over_control_risk:
      - target_text: "调用方：「把这份 runbook 里的『建议』都改成『必须』，顺便修一下译文腔。」来源：「建议在变更前对配置文件进行备份。」"
        risk: "条目（全部「建议」）与强度（必须）都已指明，本句不应触发。模型若认为「都」不算逐条指明而套用本句，会过度报告；再按「正文不改」读法 (a)，连「进行备份」的译文腔也不修，造成漏改。"
      - target_text: "调用方：「把第 3 步改为必须，其他步骤的语气也适当加强。」"
        risk: "第 3 步的条目与强度都已指明，其他步骤两项都没有指明。读法 (a)（整篇不改）会让第 3 步这项合法授权也不执行，造成漏改；只有读法 (b) 才得到「第 3 步照改，其余进「待确认」」。"
      - target_text: "调用方：「把第 2 步的强度调高。」来源：「2. 建议先暂停写入流量。」"
        risk: "否定作用域读法 (b) 下本句不触发，模型可能直接改为「2. 必须先暂停写入流量。」，替作者在「应」与「必须」之间做了选择。"
    equivalent_rewording: "调整规范强度的授权没有指明调整哪些条目、调整到何种强度时，正文不改，按第 5 类在「待确认」中请调用方指明。"
    rewording_is_equivalent_because: "只补出被省略的动词「调整」，使并列两项平行。被省略的动词在原句中由后项「调整到何种强度」唯一确定，补出它不改变命题。上面两项歧义的消歧候选不在此列，因为它们各自选定了一种读法，须先由语义审阅确认作者意图。"
    normative_vocabulary: "轻微：「正文不改」不带规范词，而上一句用「一律不得做」，强度标记不显性。在本节语境中（§2「该处不改写」同样不带规范词）读作禁止，可以接受；采纳消歧候选时也保持不带规范词即可，不必改作「不得改」，以免与「一律不得做」重复。新句无译文腔；「正文不改」略带口语腔。"

  - id: G1
    candidate_text: "条件只放宽对操作者的限制（「若…，也可以…」），而默认动作不变、来源规定的义务不被免除、所许可的做法也不在默认动作之外增加破坏性、不可逆或改变外部状态的操作"
    naturalness: 3
    quotes:
      - "「所许可的做法……增加……的操作」：主语「做法」与谓宾「增加……操作」搭配别扭。「做法」是一种处理方式，本身由操作构成；说「做法增加操作」，像是「做法」在执行动作。中文更常说「做法涉及／引入／包含某种操作」。"
      - "「动作」「做法」「操作」三个近义词同句出现。「默认动作」「被守护动作」一系用「动作」；固定短语「破坏性、不可逆或改变外部状态的操作」用「操作」（CTC-P003、CTC-P004、CTC-A005 一致）；「做法」在全文只出现这一次。读者可能停下来想「做法」与「动作」是否是不同概念（CTC-T001 自托管）。不过「做法」指「若…，也可以…」所许可的整条行动路线，与单个「动作」确有区别，用它有理由。"
      - "「也不在默认动作之外增加」：状语「在默认动作之外」置于「增加」前，「不」管辖整个「在……之外增加……」，语序合乎中文。但第三个分句约 40 字，前两个分句「默认动作不变、来源规定的义务不被免除」都很短，三项顿号并列明显尾重。"
      - "与基线相比：基线「所许可的也不是……操作」短而直接，但把门槛放在许可本身的性质上；候选要表达「相对默认动作的增量」，只能多用词。尾重是语义需要造成的，不算过度控制。"
    ambiguity:
      - "「增加」是叠加还是集合差：(a) 叠加读法，许可的做法在默认动作之上再多做一步破坏性操作才算「增加」；(b) 集合差读法，许可的做法中只要出现默认动作没有的破坏性操作就算「增加」，包括替换。按 (a)，用更具破坏性的动作替换默认动作（默认滚动重启、许可全部重启；默认等待自动恢复、许可强制删除 Pod）不算「增加」，豁免成立，缺失的判据不报告；按 (b) 不豁免。「在……之外增加」的字面偏向 (a)。消歧候选（作者确认意图是 (b) 后才等义）：「所许可的做法也不引入默认动作之外的破坏性、不可逆或改变外部状态的操作」。「默认动作之外的」改作定语，直接限定「操作」，只剩集合差读法；「引入」与「做法」的搭配也更顺。"
      - "同一操作、只放宽时间、范围或力度：许可的做法与默认动作是同一种操作（「也可以在窗口外重启」「也可以一次重启全部实例」「也可以加 `--force`」），是否算「在默认动作之外增加」，字面上不确定。放宽时间的情形多半已由「来源规定的义务不被免除」排除；放宽范围或力度的情形落在本句上，两种读法结论不同。"
      - "否定作用域：「不……增加破坏性、不可逆或改变外部状态的操作」按中文习惯读作三类操作都不增加，无现实歧义。"
    over_control_risk:
      - target_text: "默认执行滚动重启；必要时也可以直接重启全部实例。"
        risk: "许可的做法与默认动作同为重启，但影响面从逐个扩大到全部。叠加读法下不算「增加」，豁免成立，「必要时」不按 CTC-R004 提出，造成漏报，而这正是最需要判据的高风险许可。"
      - target_text: "Pod 异常时默认等待控制器自动重建；若长时间未恢复，也可以手动删除该 Pod。"
        risk: "「手动删除」是默认动作（等待）之外新出现的改变外部状态的操作，两种读法都不豁免，应按 CTC-A005 提出「长时间」。模型若把「做法」理解为整条流程，认为删除后仍由控制器重建、结果与默认相同，可能误判为没有增加操作而漏报。"
      - target_text: "默认返回缓存结果；若需要最新数据，也可以加 `--no-cache` 重新查询。"
        risk: "只读查询，没有增加破坏性操作，豁免成立，不报告。候选与基线结论相同，无过度报告风险。"
    equivalent_rewording: "无（见 ambiguity 中的消歧候选）"
    rewording_is_equivalent_because: "能改善「做法……增加……操作」搭配的写法（改用「引入」、把「默认动作之外的」改作定语）都会同时把「增加」锁定为集合差读法，不能保证等义，因此只作为消歧候选提出。"
    normative_vocabulary: "ok：句内无规范词，三个分句以「不变」「不被免除」「不……增加」描述条件，与所在段落一致。「不被免除」的「被」字句基线已有，不是新增。无口语腔；「所许可的做法」偏书面，不算译文腔。"

  - id: B1
    candidate_text: "只有当该步是破坏性、不可逆或改变外部状态的操作（为后续这类操作建立恢复点的备份、快照也算），且后续步骤的安全性取决于它是否成功，才按「待确认」第 2 类提出"
    naturalness: 4
    quotes:
      - "「（为后续这类操作建立恢复点的备份、快照也算）」：括注紧跟在被扩展的类别「破坏性、不可逆或改变外部状态的操作」之后，结合对象清楚；「这类操作」紧接先行词，指代唯一。"
      - "「也算」与本文的「不算」系列（「不算真歧义」「不算新增」「不算升级」「不算改变数制」等共 8 处）用词一致，不是口语腔。"
      - "「后续」在括注与紧随的「且后续步骤的安全性」中相隔几个字出现两次，读来略重复；两处所指不同（后续的破坏性操作／后续步骤），不造成混淆。"
      - "括注约 20 字，插在「只有当 A，且 B，才 C」中间，把 A 与「且 B」隔开。书面中文中右括号是强边界，读者一般不会把「且后续步骤……」接到括注里，整句仍可读。"
    ambiguity:
      - "结合域（风险低）：「（……也算），且后续步骤的安全性取决于它是否成功」存在一种少数读法，把「且 B」接在括注之后，读成「备份、快照在 B 成立时也算」。这样 B 只约束备份与快照，破坏性操作本身不再需要满足 B，逻辑从 (A ∨ 备份) ∧ B 变成 A ∨ (备份 ∧ B)，破坏性步骤缺判据一律提出，形成过度报告。右括号使这种读法不太可能，但不能完全排除。"
      - "指代（CTC-A002 自托管）：括注引入了「后续这类操作」「恢复点」「备份、快照」等名词，使其后「取决于它是否成功」中的「它」在可及范围内多了候选先行词。语用上仍可唯一解析为「该步」；但基线中「它」只有「该步」一个候选，候选增多是本次改动带来的。"
      - "封闭列举还是举例：「备份、快照」后没有「等」，可以读作封闭列表。「导出当前路由表」「dump 数据库」「给镜像打 tag」「保存配置副本」这类功能上建立恢复点、但名称不同的步骤，按封闭读法不算，可能漏报；按功能读法（判据是「为……建立恢复点的」，「备份、快照」只是举例）算。CTC-R004 的列表用「等」标明开放，这里没有，两处做法不一致。是否开放属于语义决定，本审阅不改。"
      - "定语结合：「为后续这类操作建立恢复点的备份、快照」中，定语可以只修饰「备份」，也可以修饰两项；只修饰「备份」时任何快照都算。后半条件「后续步骤的安全性取决于它是否成功」会再过滤一次，两种读法的实际差别很小。"
    over_control_risk:
      - target_text: "1. 执行 `cp nginx.conf nginx.conf.bak`。2. 修改 `worker_processes`。3. 执行 `nginx -s reload`。"
        risk: "第 1 步是为后续改变外部状态的操作建立恢复点的备份，后续安全性取决于它，按候选应在「待确认」第 2 类提出备份的成功判据。这类步骤在常规运维文档中很常见，可能让每个带备份步骤的 SOP 都多一条未决项，与本条「以免正常的流程文档产生成串的未决项」的目的有张力。这是规则范围问题，不是措辞问题，需要回归评测确认是否可以接受。"
      - target_text: "1. 导出当前路由表到 `routes.json`。2. 清空路由表并重新加载。"
        risk: "第 1 步功能上建立了恢复点，但不叫「备份」或「快照」。模型若按封闭列表字面匹配，会漏报它缺失的成功判据；按功能理解则会提出。"
      - target_text: "1. 重启 `metrics-exporter`。2. 在变更记录中填写本次操作时间。"
        risk: "第 1 步改变外部状态，但第 2 步的安全性不取决于它，按本意不提出。若按少数结合读法 A ∨ (备份 ∧ B)，第 1 步缺判据会被直接提出，形成过度报告。"
    equivalent_rewording: "只有当该步是破坏性、不可逆或改变外部状态的操作（为后续这类操作建立恢复点的备份、快照也算），且后续步骤的安全性取决于该步是否成功，才按「待确认」第 2 类提出"
