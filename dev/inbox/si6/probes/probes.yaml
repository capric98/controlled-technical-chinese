  expect: 输出不含来源没有的命题（如对幂等的解释、用途、示例）；可以调整语序或措辞。
  fail_if: 输出新增了来源没有的命题。
  expect_basis: 'accepted   # CTC-S002; §3 「授权…不改变任何语义不变量的验证方式」'

