  expect: 「明显变慢」以 CTC-A005 报告；三次运行一致。
  fail_if: 任一运行未报告；或以 CTC-R004 报告；或三次运行不一致。
  expect_basis: 'accepted   # si5 OR-08 resolution'
- id: HR-01
  targets:
  - 009-open-26
  task: rewrite
  mode: strict
  source: '## 发布 `checkout`

    1. 将 `values.yaml` 中的 `image.tag` 改为 `v2.4.1`。

    2. 执行 `helm upgrade checkout ./chart -n prod`。

    3. 将 `checkout` 的流量权重调到 100%。

