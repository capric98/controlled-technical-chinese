  expect_basis: product-decision
- id: AU-02
  targets:
  - 010-open-30
  task: rewrite
  mode: standard
  instruction: 改写这段 API 说明，改写目标：让刚入职的工程师也能看懂。
  source: '`POST /v1/orders` 创建订单。请求体中 `idempotency_key` 相同的请求在 24 小时内只处理一次，重复请求返回首次请求的结果。

