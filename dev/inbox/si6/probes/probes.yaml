# si6 probes — pre-registered on 2026-11-09, before any si6 probe output was seen.
#
# Baseline: SKILL.md at 37b5983 (si5 v2), frozen at dev/inbox/si6/base/SKILL.md
# (sha256 759bc53cd9c63baf0f5ba3b0d9e198af908b306b2fba57bfbbe64675f1b5d1c7).
#
# si6 targets open proposals from docs/decisions/010 (§ Open proposals after si5):
#   27 — 「破坏性、不可逆或改变外部状态的操作」 is undefined: a backup that a destructive step depends on
#        (GO-01, GO-01r), a config change that deletes data (GO-02), a permitted variant of an action the
#        default already performs (GO-03), an irreversible notification gated by an undefined check (GO-04)
#   29 — 「情况紧急时」 between R004 and A005; the maintainer chose R004 (si6 M3): OR-07, EM-01, boundary EM-02
#   30 — 「指定改写目标」 and a vague strength authorisation (AU-01, AU-02)
#   10 — the frontmatter description omits §1's exclusions (P005 in 5/6 si5 self-hosting runs); the
#        maintainer unfroze that clause (si6 M2). Tested by self-hosting counts.
#   31 — closed by the maintainer without a text change (si6 M4); TV-01 stays as regression.
#   28 — a failed exemption's fallback: no failing run; OR-06 and OR-07 are its regression.
#
# The model sees only `instruction` and `source`; `targets`, `expect`, `fail_if`, `score` and
# `expect_basis` are never sent. Three runs per probe per version. expect_basis as in si2–si5:
# accepted / proposed / product-decision.
#
# Regression probes copied verbatim from dev/inbox/si5/probes/probes.yaml (P3-01, P3-05, PR-07 originally
# si4's), with the expectations the maintainer fixed there (si5 resolutions.yaml M7–M9) or here (OR-07: M3).
cases:
- id: OR-01
  targets:
  - 009-open-23
  task: rewrite
  mode: strict
  over_edit_trap: true
  source: '批量导出建议放在凌晨执行，以减少对线上查询的影响。若导出队列较长，也可以拆成多批提交。

    '
  score: body unchanged; whether 「待确认」 has an item on 「较长」
  expect: 正文原样返回；不出现关于「导出队列较长」的「待确认」条目。
  fail_if: 「待确认」含「较长」的条目；或正文被改写。
  expect_basis: product-decision
- id: OR-02
  targets:
  - 009-open-23
  task: review
  mode: review
  instruction: 以 review 模式审阅这段运维说明，只输出问题清单。
  source: '批量导出建议放在凌晨执行，以减少对线上查询的影响。若导出队列较长，也可以拆成多批提交。

    '
  score: whether any finding cites 「较长」
  expect: 不以 CTC-A005 或 CTC-R004 报告「较长」；可以返回「未发现违规」。
  fail_if: 任一运行以 CTC-A005 或 CTC-R004 报告「较长」。
  expect_basis: product-decision
- id: OR-03
  targets:
  - 009-open-23
  task: review
  mode: review
  instruction: 以 review 模式审阅这段 API 文档，只输出问题清单。
  source: '### 连接限制

    连接数接近上限时，网关会拒绝新的长连接请求，已建立的连接不受影响。

    '
  score: whether any finding cites 「接近上限」
  expect: 不以 CTC-A005 或 CTC-R004 报告「接近上限」（对系统行为的描述，读者无须据此决定动作）；可以返回「未发现违规」。
  fail_if: 任一运行以 CTC-A005 或 CTC-R004 报告「接近上限」。
  expect_basis: proposed
- id: OR-06
  targets:
  - 009-open-23
  task: review
  mode: review
  instruction: 以 review 模式审阅这段运维说明，只输出问题清单。
  source: '### 磁盘清理

    每周日清理 `/var/log/app/` 下超过 14 天的日志。若磁盘紧张，也可以删除 `/backup/` 下 30 天前的备份。

    '
  score: whether 「紧张」 is reported; rule ID
  expect: 「磁盘紧张」以 CTC-A005 报告；三次运行一致。
  fail_if: 任一运行未报告；或三次运行不一致。
  expect_basis: 'accepted   # si5 M8'
- id: OR-07
  targets:
  - 010-open-29
  task: review
  mode: review
  instruction: 以 review 模式审阅这份变更规范，只输出问题清单。
  source: '## 生产变更

    1. 生产变更须经双人复核后执行。

    2. 情况紧急时，也可以先执行、事后补复核。

