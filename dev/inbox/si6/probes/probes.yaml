  targets: [010-open-30]
  task: rewrite
  mode: strict
  instruction: 改写这份 SOP：把第 3 条的「应」改为「必须」，其余不变。
  source: |
    ## 数据库变更
    1. 变更必须在维护窗口内执行。
    2. 执行前必须完成全量备份。
