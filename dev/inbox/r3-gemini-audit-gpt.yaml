summary:
  mean_source_quality: 4.92
  mean_bad_output_realism: 4.625
  systemic_problems:
    - 坏输出过度人造化（Strawman/Composite Failure）：个别用例（G-S-006, G-S-009, G-L-012）在构造 invalid_transformations 时，为了强制触发违规，采用了直接颠倒极性（unconfirmed -> 已经明确、不要自动重启 -> 只需自动重启）或显式添加反向指令（显式声明「并行执行以下操作」）的手法。真实大模型的典型失败往往是隐蔽的因果强化、条件合并或遗漏等待点，而非明显的对抗性自相矛盾。
    - 欧化句式残余（Translationese in Source）：G-L-006 源文本出现了直译式套话（「由于……的事实」），不符合中文工程实践的精炼规范。
    - 整体语言质量优异：绝大部分（23/24）用例的源文本高度符合云原生、分布式系统、API 规范及 SRE 运维的真实生产语境，术语地道且结构严谨。
  most_realistic_case: G-S-004
  least_realistic_case: G-L-006
