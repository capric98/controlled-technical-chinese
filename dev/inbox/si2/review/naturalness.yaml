reviewer: naturalness
model: claude-opus-5-5
files_read:
  - dev/prompts/si2-naturalness.md
  - dev/inbox/si2/base/SKILL.md
  - dev/inbox/si2/cand/full/SKILL.md
passages:
  - id: P002-tail
    # 任务说明称「行末两句」；逐行比对显示只有第二句是新增，第一句「命令已完整表达……」base 中已有。
    # 下文的评分与意见只针对新增句，第一句仅作上下文。
    candidate_text: >-
      命令已完整表达动作与对象时不再补写自然语言描述。步骤已写出对象时，不因它没有细化到实例、路径或命名空间就算缺少对象或位置，除非来源或上下文给出了多个可选对象。
    naturalness: 4
    quotes:
      - >-
        「不因它没有细化到……就算缺少对象或位置」：整体是自然的技术中文，但句式混用了书面的「不因……而……」和口语的「不能因为……就……」。「就算」在现代汉语里已经固化为让步连词（＝即使），读者会先读成「就算（即使）缺少对象或位置」，再回头改读为「就＋算（算作）」，形成轻微的花园路径效应。
      - >-
        「它」：其余条文指代非人称先行词时用「其」或名词回指（「其不确定性」「其例外见 CTC-S005」）。此处用「它」，语体比全文略低。
      - >-
        「多个可选对象」：技术中文里「可选」的主要意思是 optional（可选参数、可选字段），这里要表达的是「可供选择的、候选的」。
      - >-
        「细化到实例、路径或命名空间」：「细化」用得准确。实例对应对象，路径和命名空间对应位置，与后文「缺少对象或位置」交叉对应，写得紧凑，读者仍能还原。
    ambiguity:
      - >-
        「它」的先行词：「步骤」和「对象」都在可及范围内。按 CTC-A002 的字面要求，这本身就是本技能自己的指代问题。两种读法在此处的真值条件相同（步骤所指的对象是否带有实例、路径或命名空间限定），不会导致不同行为，但最好去掉这个代词。
      - >-
        「可选」：可读作 optional，也可读作 candidate。optional 读法在本句里讲不通，所以风险低，但逐字执行的模型可能误用，例如把「来源列出了可选参数 `--namespace`」当成「给出了多个可选对象」。
      - >-
        例外只说「多个可选对象」，没说「位置」：如果同一对象部署在多个命名空间或路径下（对象只有一个，位置有多个），按字面读法例外不触发，于是「不算缺少位置」；另一种读法把「`staging` 中的 `api`」和「`prod` 中的 `api`」看成两个候选对象，例外就会触发。两种读法导致不同行为，措辞上无法等义消解，需要语义审阅来定。
      - >-
        列举不一致：同一行前文写的是「节点、环境或命名空间」，新句写的是「实例、路径或命名空间」。如果把新句的列举读作封闭集合，没有细化到节点或环境就不在豁免之内，仍算缺少位置；如果读作举例，这两者也一并豁免。两种读法导致不同行为。
    over_control_risk:
      - target_text: >-
          上下文：「`api` 同时部署在 `staging` 与 `prod` 两个命名空间。」步骤：「3. 重启 `api`。」
        risk: >-
          这是漏报。按字面，「多个可选对象」只计对象，而对象只有 `api` 一个，所以例外不触发，新句判定「不算缺少位置」。模型既不补写命名空间，也不放进「待确认」，真正缺失的命名空间就被漏掉了，操作者可能重启错环境。这正是任务说明担心的「因『实例、路径或命名空间』的措辞漏报真正缺失的对象」。
      - target_text: >-
          单机 runbook，上下文只有一台主机 `web-01`。步骤：「2. 重启 `nginx`。」
        risk: >-
          新句只豁免实例、路径、命名空间，没有列出节点和环境。模型可能按「列出的豁免，未列出的不豁免」去推断，再依据前句「来源或上下文中可确定的部分应写出」，把每一步都改成「在 `web-01` 上重启 `nginx`」；在 review 模式下则可能逐步报 CTC-P002 WARNING。结果是成串的冗余显式化，正是 CTC-R002 要防止的情况。base 里本来就有这个倾向，新句有选择的列举把它加强了。
      - target_text: >-
          工具描述：「`--namespace`：可选参数，默认 `default`。」步骤：「执行 `kubectl rollout restart deploy/api`。」
        risk: >-
          风险低。如果把「可选」读作 optional，模型可能把「来源给出了可选参数」误当作「给出了多个可选对象」，于是触发例外，把这一步判为缺少命名空间并放进「待确认」。改用「候选」就能消除。
    equivalent_rewording: >-
      步骤已写出对象时，不因未细化到实例、路径或命名空间而算作缺少对象或位置，除非来源或上下文给出了多个候选对象。
    rewording_is_equivalent_because: >-
      (1) 删去「它」：省掉的主语由话题小句「步骤已写出对象时」承接，能还原的先行词仍然是「步骤」或「对象」，没有增加或减少读法，只是不再出现代词。
      (2)「没有」改为「未」：否定意义相同，改后与全文书面语体一致。
      (3)「就算」改为「而算作」：「不因 A 而 B」和「不因 A 就 B」都是否定原因，意思是 A 本身不足以构成 B，其他理由仍然可以构成「缺少」。这里不改成「即使 A 也不算 B」，因为那是让步断言，会把其他理由也一并否定，与原句不等义。「算作」沿用全文已有的「算」类用词（「不算真歧义」「不算新增」）。
      (4)「可选」改为「候选」：本句只有「可供选择的」这一种讲得通的读法，「候选」正是这个意思，§2 也已经用过（「两个候选改动」），改后去掉了 optional 读法。
      「对象／位置」不对称和列举不一致这两处没有处理：它们属于语义选择，不在等义改写的范围内。
    normative_vocabulary: >-
      ok。新句不含「必须」「应」「可以」「不得」，是对触发条件「缺少对象或位置」的界定，没有新增级别，符合「能澄清就不新增规则」的做法。

  - id: R003
    candidate_text: >-
      名称：反译文腔与口语化。触发 → 要求：文本含无必要的被动、名词化赘语（进行／作出／予以 + 动词）、过长的「的」字串、英语从句语序残留（「由于…的事实」）或直译连接词，或告警、错误与状态提示含情绪化感叹与口语语气词（「糟糕！」「啦」）时，在语义完全不变的前提下改用中文技术写作的常规表达。被动用于突出受事、施事未知或施事已在同句给出时是自然的技术表述。表达推测的词（「好像」「可能」）不是语气词，删改时其不确定性按 CTC-S003 保留。本规则永远低于 S 族。
    naturalness: 3
    quotes:
      - >-
        「反译文腔与口语化」：「反」的作用范围有两种读法，一是「反（译文腔与口语化）」，二是「（反译文腔）与（口语化）」。第二种字面上是「反对译文腔，并且口语化」，与正文意思相反。读者凭正文能纠正，但这正是本技能 CTC-A003 所说的那种修饰结合歧义，出现在规则名里不利于自托管。
      - >-
        「……或直译连接词，或告警、错误与状态提示含情绪化感叹与口语语气词（「糟糕！」「啦」）时」：触发句里有两层「或」嵌套，外层只靠逗号区分；主语又从「文本」换成了「告警、错误与状态提示」。整条触发条件超过 80 字，读到「时」才收束，阅读负担重。不过这不是译文腔。
      - >-
        「告警、错误与状态提示」：全文其他地方用的是「告警与错误信息」（§3 strict 适用范围、frontmatter）和「状态提示」（§1）。这里「错误」单独出现，用词与全文不一致。
      - >-
        「表达推测的词（「好像」「可能」）不是语气词，删改时其不确定性按 CTC-S003 保留」：这句自然、简洁。
      - >-
        「情绪化感叹与口语语气词」：本身自然，但在触发列表里，「与」容易被读成「两者同时」；本行前半的并列触发用的是「或」。
    ambiguity:
      - >-
        「含情绪化感叹与口语语气词」：「与」可以读作「任一出现即触发」，也可以读作「二者同时出现才触发」。本行前半用「或」，这里换成「与」，「二者同时」的读法因此更显眼。行为差异：「上传失败啦」只有语气词、没有感叹，按「二者同时」的读法就不触发。示例「糟糕！」「啦」是分开列的，倾向于「任一」读法；但改成「或」要先经语义审阅确认，本审阅不把它列为等义改写。
      - >-
        「删改时」：可以读作「执行本规则的删改时（如删除语气词）」，也可以读作「删改推测词本身时」。第二种读法暗含许可：可以把「好像」改为「可能」这类同等强度的书面词。两种读法都要求保留不确定性，行为差异小。
      - >-
        「表达推测的词……不是语气词」：作为一般命题，这在语法上不成立。句末的「吧」既是语气词，又表达推测（「是证书过期了吧？」）。按字面二分，「吧」归入语气词，不受本句保护，只剩 CTC-S003 的一般保护。
      - >-
        「感叹」：可以指叹词（糟糕、哎呀），也可以指感叹号；示例「糟糕！」两者都有。
    over_control_risk:
      - target_text: >-
          错误提示：「连接超时，是代理没配好吧？」
        risk: >-
          句末的「吧」表达推测。模型按字面二分，把它当作口语语气词删掉，得到「连接超时，代理配置有误。」，推测变成了断言，违反 CTC-S003（与「可能→会」同类）。新句只点名「好像」「可能」，反而暗示「吧」不在保护范围内。
      - target_text: >-
          错误提示：「请求被限流了，稍后再试吧。」
        risk: >-
          「吧」把指令软化成建议。删掉后得到「请求被限流，稍后重试。」，言语行为从建议变成指令，与 CTC-S003 所列「建议→必须」同类。
      - target_text: >-
          确认提示：「确定要删除实例 `db-01` 吗？」
        risk: >-
          「吗」是语气词，但不是口语语气词。如果模型把「口语语气词」放宽读成「语气词」，删去「吗」，是非问句就变成了陈述句。「口语」这个限定只有细读时才起作用。
      - target_text: >-
          告警：「磁盘快满了。」
        risk: >-
          这里的「了」处在「快……了」结构中，表示即将发生，不是口语语气词。示例中的「啦」（＝了＋啊）可能被类推到「了」上。删掉后得到不合语法的「磁盘快满」，模型继续「修复」时可能写成「磁盘已满」，把「即将」变成「已经」，改变了真值和时序（CTC-L003）。对照：句末冗余的「了」（如「连接已断开了」）删掉不损失语义，属于正常修复。
      - target_text: >-
          状态提示：「数据还在同步呢，请稍候。」
        risk: >-
          风险低。这里的「呢」只表示持续，删掉后的「数据仍在同步，请稍候。」不改变语义。列出这一例是为了说明边界：「呢」一般可以安全删除，「吧」「吗」和构式中的「了」不行。
      - target_text: >-
          安全告警：「危险！带电操作可能导致触电。」
        risk: >-
          「危险！」「警告！」是标准信号词加感叹号，不是情绪化感叹。示例「糟糕！」带感叹号，模型可能类推，删除或改写信号词，从而改变告警的严重级别标识。这类改动也不应以 CTC-R003 的名义做。
      - target_text: >-
          FAQ：「只想本地试试的话，用默认配置就行啦。」
        risk: >-
          触发条件只限于告警、错误与状态提示，但规则名里的「口语化」没有范围限定。模型如果按名称启用本规则，会在 FAQ、README、agent 指令中删除语气词、改写口语句，这是无法归因到规则的改写（CTC-R001）。另一个问题：产品有意采用的亲和语气（如「同步完成啦」）属于第 5 层的「人称与语态偏好」，而 CTC-R003 在第 4 层，按 §2 会被本规则覆盖。这是层级设计问题，留给语义审阅。
    equivalent_rewording: >-
      名称改为「反译文腔、反口语化」；触发条件中的「告警、错误与状态提示」改为「告警、错误信息与状态提示」；其余不动。
    rewording_is_equivalent_because: >-
      (1) 名称里重复「反」，只是把与正文一致的唯一读法写明。另一种读法（「反对译文腔，并且口语化」）与正文矛盾，不是这条规则可能有的意思；规则名也不承载触发条件，所以不改变规则行为。
      (2)「错误」改为「错误信息」：不论「提示」是否同时修饰三项，指的都是错误提示文本，范围不变；改后与 §1「状态提示」、§3「告警与错误信息」用词一致（本技能自身也应符合 CTC-T001）。
      「与」改「或」、「删改时」的读法、「吧」的归类这三处会改变语义或要在两种语义中选一种，不在等义改写之列。
    normative_vocabulary: >-
      ok。新增部分沿用「改用」「按 CTC-S003 保留」，没有出现新的「必须」「应」。「按 CTC-S003 保留」把 S 族的必须级要求引入这条应级规则，这与本行末「本规则永远低于 S 族」以及 §6「规则正文中的『必须』『不得』不改变该栏的级别」一致，没有级别漂移。

  - id: review-step-2
    candidate_text: >-
      2. 逐句定位违规，每条违规确定唯一的规则 ID；同一处触发多条规则时分列，不合并。规则行写明转 CTC-A005 的情形（CTC-A003 无证据、CTC-L004 边界本身歧义、CTC-P002 无法确定）引用 CTC-A005；CTC-P002 的 finding 只针对来源或上下文能确定、却没有写出的部分。
    naturalness: 3
    quotes:
      - >-
        「规则行写明转 CTC-A005 的情形（……）引用 CTC-A005」：「情形」前面挂着长定语「规则行写明转 CTC-A005 的」，主语「情形」和谓语「引用」搭配不当：引用规则 ID 的是 finding，不是情形。同一小句里 CTC-A005 出现两次，读起来机械。
      - >-
        「规则行」：这是新说法。全文已经有「规则条文」（§3「规则条文中写明的授权」）和「规则正文」（§6），这里又引入第三种。
      - >-
        「CTC-A003 无证据、CTC-L004 边界本身歧义、CTC-P002 无法确定」：用「规则 ID＋情形」的形式压缩列举，可以读懂。
      - >-
        「CTC-P002 的 finding 只针对来源或上下文能确定、却没有写出的部分」：自然，「却」恰当地标出了转折。
    ambiguity:
      - >-
        「引用 CTC-A005」有三种读法：(a) 该 finding 的规则 ID 换成 CTC-A005，取代 CTC-A003 等；(b) 同一条 finding 同时引用原规则和 CTC-A005；(c) 按前一句「同一处触发多条规则时分列」，报两条 finding。(b) 与「唯一的规则 ID」冲突，(a) 和 (c) 都与上文相容。行为差异明显：严重级别不同，CTC-A003、CTC-P002 是「应」（WARNING），CTC-A005 是「必须」（ERROR）；(c) 还会在同一位置产出重复的 finding。用哪种读法要由语义审阅来定。
      - >-
        括注里的列举是全部还是举例：按现行文本，把情形交给 CTC-A005 的规则行恰好就是这三条。如果读成举例，模型可能把 CTC-R004、CTC-P005、CTC-S002 的「待确认」情形也改引 CTC-A005，而这几种在 §3 里各有自己的类别和规则 ID。
      - >-
        「转」与 CTC-P002 原文不一致：CTC-P002 原文写的是「按 CTC-A005 报告」，不是「转」。括注已经点名 CTC-P002，读者能对上；但逐字搜索「转 CTC-A005」的模型只会找到 CTC-A003 和 CTC-L004。
      - >-
        「却没有写出」指没写在哪里：步骤里，还是整篇文档里？如果命名空间由标题统一给出，按「步骤里」的读法，每一步都算「能确定却没有写出」。
      - >-
        「只针对」排除了 CTC-P002 末句（命令已完整时不再补写自然语言描述）对应的 finding。这类冗余仍可以用 CTC-R002 报告，行为影响小。
      - >-
        在 review 模式下审计一篇独立文档时，没有单独的「来源」。此时「来源或上下文能确定」指的就是被审文本本身，但原文没有写明。
    over_control_risk:
      - target_text: >-
          runbook：「删除过期的快照和日志。」（没有上下文证据说明「过期的」是否也修饰「日志」）
        risk: >-
          按读法 (c)，审阅者会在同一位置报 CTC-A003 WARNING 和 CTC-A005 ERROR 两条，这属于 §8 禁止的「为显得周全而制造 finding」；按读法 (a)，只报一条 CTC-A005 ERROR。两个审阅者对同一文本给出的严重级别分布会不同，评测结果没法比较。
      - target_text: |-
          ## 在 `prod` 命名空间中执行
          1. 将 `api` 缩容到 0。
          2. 运行 `migrate.sh`。
          3. 恢复 `api` 副本数。
        risk: >-
          命名空间由标题管辖其下全部步骤（§4、CTC-L001），各步不写命名空间是正确的。审阅者如果只读 §8 第 2 步，「能确定、却没有写出」会让它逐步报三条 CTC-P002 WARNING，要求把结构条件复制进每一步，而这正是 §4 明确禁止的伪法律重复。CTC-P002 的新句（步骤已写出对象时，不因没有细化到命名空间就算缺少）能挡住这种读法，前提是审阅者同时应用了它。
    equivalent_rewording: >-
      规则条文中写明转 CTC-A005 的情形（CTC-A003 无证据、CTC-L004 边界本身歧义、CTC-P002 无法确定），finding 引用 CTC-A005；CTC-P002 的 finding 只针对来源或上下文能确定、却没有写出的部分。
    rewording_is_equivalent_because: >-
      (1)「规则行」改为「规则条文中」：两者指同一段文本，即表格行中「触发 → 要求」栏的内容。§3 已经用「规则条文中写明的授权」指这类内容，改后不新增术语。
      (2) 补出「引用」的主语「finding」，并用逗号把前面的部分隔成话题：原句中「情形」不能引用规则 ID，唯一能还原出的施事是这些情形下的 finding（§8 第 3 步的「规则」字段），补出它不增加也不减少读法。
      本改写不消解「换成 CTC-A005」还是「分列两条」的歧义：那要选定严重级别，属于语义决定。
    normative_vocabulary: >-
      ok。两句都用 §8 流程步骤惯用的不带情态词的祈使和限定（「引用」「只针对」），与第 2 步前半「分列，不合并」语体相同，没有出现「必须」「应」。「只针对」起限定作用，不构成新的级别。

overall_note: >-
  三处改动都没有译文腔或伪法律腔。自然度方面，P002 新句接近自然的技术中文（4 分）；R003 触发句因两层「或」嵌套和主语切换偏长（3 分）；第 2 步新句的主语和谓语搭配不当，还引入了新说法「规则行」（3 分）。
  可以等义修复的措辞问题有：P002 的「它」「就算」「可选」，R003 名称中「反」的作用范围和「错误」的用词，第 2 步的「规则行」和缺主语的「引用」。
  不能等义改写、需要语义审阅定夺的有三处：
  (1) P002 的例外只计「对象」不计「位置」，同一对象分布在多个命名空间时会漏报真正缺失的命名空间；新句列举的「实例、路径、命名空间」与前句的「节点、环境、命名空间」不一致，可能促使模型对节点和环境做冗余显式化。
  (2) R003 把「推测词」与「语气词」二分，句末的「吧」（推测、建议）和「吗」（疑问）因此失去本句的保护，只剩 CTC-S003；示例「啦」可能被类推到「快……了」构式中的「了」。
  (3) 第 2 步的「引用 CTC-A005」是换掉原规则 ID 还是分列两条，直接决定报 WARNING 还是 ERROR，以及同一位置是否出现重复 finding。
  范围问题：R003 的名称没有范围限定，可能把口语化修复扩展到告警、错误与状态提示以外的文本；另需确认第 5 层的语态偏好被第 4 层的 CTC-R003 覆盖是否是有意设计。
  说明：任务说明称 CTC-P002 改动的是「行末两句」，实际比对只有最后一句是新增。以上都是审阅假设，未改动任何被审文件。
