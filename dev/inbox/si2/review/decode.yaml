reviewer: cold-decoder
model: claude-opus-5-5
# 实际读过的文件：任务说明 dev/prompts/si2-decode.md 与被审文件 SKILL.md。
# 运行环境注入的 AGENTS.md／CLAUDE.md 未用于推断技能意图。
files_read:
  - dev/prompts/si2-decode.md
  - dev/inbox/si2/cand/full/SKILL.md
probes:
  - probe: CTC-A005
    level: 必须（§8 映射 → ERROR）
    scope: |-
      全部任务（改写、翻译、新写、审阅）与全部模式。歧义阈值随模式／文档类型变化：strict 下一种在本文档语境下可执行、且导致不同动作的读法即算竞争读法；standard 下普通技术读者会就此产生分歧才算；review 按被审文档类型取阈值（§3）。
    trigger: |-
      两个析取分支：(i) 存在两种以上导致不同行为的读法，且来源与上下文都不足以确定作者意图；(ii) 缺少执行所需的参数、阈值、接收方或判据。另外，它是三条规则的转入目标：CTC-A003 无证据、CTC-L004 边界本身歧义、CTC-P002 无法确定（§8 第 2 步）。
    requires:
      - "改写／翻译／新写：保持原表述，在正文末「待确认」中每项一行写明位置、竞争读法或缺失项、判定所需的信息（对应 `位置 | 问题 | 需要的信息`；第四栏只在 §5 情态模糊时填写）。"
      - "review：作为一条 finding 报告，规则字段写 CTC-A005，严重级别按「必须」取 ERROR（§5、§8）。"
    prohibits:
      - "静默择一。"
      - "补出缺失项（具体次数、时限、接收方、默认值、判据）。"
      - "用流畅的改写把歧义掩盖成确定句；输出多个完整备选版本；在同一处既消歧又替换关键动词（§5）。"
    exceptions:
      - "§5「不算真歧义」：一种读法在该领域不对应任何可执行操作；参数在运行时由外部唯一确定（`Retry-After` 例）；不得因「理论上可解析出两种读法」而报告。"
      - "上下文能确定读法时，不走本规则，按 CTC-A001–A004、CTC-P002 等消歧，且所选读法必须有证据（§5）。"
      - "standard 模式阈值更高。"
      - "CTC-P002 末句：已写出的对象不因未细化到实例、路径或命名空间而算缺失，除非来源或上下文给出了多个可选对象。"
      - "CTC-P003：来源未给成功判据时，只有该步是破坏性或不可逆操作、且后续步骤的安全性取决于它是否成功，才提出。"
    fork: yes
    readings:
      - id: F1-A
        reading: |-
          分支 (ii) 的缺失信息引用 CTC-A005。依据是规则行本身，以及 §5「上下文不能确定时，按 CTC-A005 保持原表述并进「待确认」」。
        behavior: review 中缺失参数类 finding 的规则字段为 CTC-A005。
      - id: F1-B
        reading: |-
          缺失信息归「待确认」第 5 类，引用 CTC-S002。依据：§3 第 1 类把 CTC-A005 限定为「两种以上读法都成立而无从判定」的歧义，不含缺失项；第 5 类注明 CTC-S002 并说明「不论由哪条规则发现」。
        behavior: |-
          review 中同一缺陷的规则字段为 CTC-S002。严重级别同为 ERROR，但不同审阅者对同一缺陷给出不同 ID，去重和按规则统计时会分成两类。改写模式下无差异，因为「待确认」行不带规则 ID。
      - id: F2-A
        reading: |-
          分支 (ii) 的「判据」覆盖任何缺失的成功判据。CTC-A005 是「必须」级，凡执行所需的判据缺失都要报告。
        behavior: 非破坏性步骤缺少成功判据时，也产生「待确认」项（review 中为 ERROR）。
      - id: F2-B
        reading: |-
          CTC-P003 对缺失成功判据的专门限定优先：只有破坏性或不可逆、且后续安全依赖它时才报告；第 1 类的定义也不包含缺失项，第 5 类明确排除第 2–4 类。
        behavior: 非破坏性步骤缺少成功判据时不报告。
      - id: F3-A
        reading: |-
          「保持原表述」只冻结歧义片段本身；同句中由其他规则触发的改动（例如 CTC-R003 去口语语气词、CTC-R006 统一标点）照常执行，只要不触及歧义处。§5 只禁止「在同一处既消歧又替换关键动词」，暗示同一处的其他改动不在禁止之列。
        behavior: 既含歧义、又含译文腔或口语的句子会被局部修复。
      - id: F3-B
        reading: |-
          整句（或整个步骤）保持原样。依据是 §5 示例「保留原句，逐项进「待确认」」，以及 §2「第 1 层不可达 — 该处不改写」。
        behavior: 同一类句子原样返回，其中的 R003／R006 缺陷不修复。
    notes: |-
      F1 与 F2 的根源相同：规则行的触发条件（歧义或缺失项）比「待确认」第 1 类的定义（只有歧义）宽。
      另一处确定但反直觉的点：CTC-A003 是「应」级，有证据可消歧时报 WARNING，无证据时转 CTC-A005 报 ERROR；同一类问题越难解决，严重级别越高。§8 称「唯一允许的升级」是应级风险字段条款，读者可能把这种转入当作第二种升级，并因此改引 CTC-A003。

  - probe: CTC-P002（全文，含最后两句）
    level: 应（review 中报 WARNING；风险字段指名操作者因此会做出的不同动作时可以报 ERROR）。正文中的「不得」不改变级别（§6）。
    scope: |-
      目标文本是可执行步骤，包括 runbook、SOP、排障步骤、变更流程。适用于全部模式：strict 阈值低，standard 按记录级别生效、阈值高；review 按被审文档类型取阈值。
    trigger: 某一步缺少动作、对象或位置。位置指操作发生的节点、环境或命名空间。
    requires:
      - "来源或上下文中可确定的部分应写出。这属于消除操作未定，不算 CTC-R002 违规（§2、CTC-R002）。"
      - "无法确定时按 CTC-A005 报告；review 中改引 CTC-A005（§8 第 2 步）。"
      - "review 中 CTC-P002 的 finding 只针对来源或上下文能确定、却没有写出的部分。"
    prohibits:
      - "把步骤压缩为「相关配置」「对应服务」「按需处理」。"
      - "删除操作发生的节点、环境或命名空间。"
      - "命令已完整表达动作与对象时，补写自然语言描述（是否构成禁止见 F4）。"
    exceptions:
      - "倒数第二句：命令已完整表达动作与对象时，不再补写自然语言描述。"
      - "最后一句：步骤已写出对象时，不因它没有细化到实例、路径或命名空间，就算缺少对象或位置；例外是来源或上下文给出了多个可选对象。"
    fork: yes
    readings:
      - id: F1-A
        reading: |-
          「对应服务」「相关配置」是规则点名的空泛占位，不算已写出对象，所以该步缺少对象：可确定时写出，不可确定时转 CTC-A005。
        behavior: 改写时要么写出对象，要么进「待确认」；review 中产生 finding。
      - id: F1-B
        reading: |-
          「服务」是已写出的对象，只是没有细化；最后一句的豁免适用，除非上下文给出多个服务。「不得压缩为…」只约束改写方的输出，不约束来源原有的措辞。
        behavior: 来源原有的「重启对应服务」原样返回，review 中无 finding。
      - id: F2-A
        reading: |-
          「可确定」要求来源明说或能唯一推出。上一步给出 `gateway.yaml`，并不能确定读取它的服务名、单元名或实例，因此转 CTC-A005。
        behavior: 改写时原样保留并进「待确认」；review 中报 CTC-A005／ERROR。
      - id: F2-B
        reading: |-
          有来源证据的合理领域推断即算可确定：`gateway.yaml` 推出网关服务，按 CTC-P002 写出。
        behavior: 改写输出「重启网关服务」；review 中报 CTC-P002／WARNING，可经风险条款升为 ERROR。规则 ID、严重级别和建议修改都与 F2-A 不同。
      - id: F3-A
        reading: |-
          最后一句只限定 CTC-P002 自己的「缺少对象或位置」判定。CTC-A005 分支 (ii)，或「待确认」第 5 类（CTC-S002），仍可就同一步缺少的执行参数（备份目标、实例名等）提出。
        behavior: 对象未细化的步骤仍可能产生 ERROR 级的「待确认」项或 finding。
      - id: F3-B
        reading: |-
          最后一句表达的是全局意图：未细化的对象不算缺失信息，CTC-A005 与 CTC-S002 也不应就此报告。
        behavior: 不产生 finding 或「待确认」项。
      - id: F4-A
        reading: |-
          「不再补写」只表示 CTC-P002 不要求补写；是否补写由 CTC-R001 决定：没有其他规则触发，就不得补。
        behavior: review 中，来源同时有命令和冗余描述时不产生 CTC-P002 finding（至多 CTC-R002）。
      - id: F4-B
        reading: 「不再补写」本身是一条禁止。
        behavior: review 中，命令加冗余自然语言描述会被报为 CTC-P002 违规。
    notes: |-
      「位置」只定义为操作发生的节点、环境或命名空间。操作参数（备份写到哪里、用什么方式）不在 CTC-P002 的三项之内，只能经 CTC-A005／CTC-S002 处理，这是 F3 的来源。
      「不得删除…节点、环境或命名空间」与 CTC-S001（必须）重叠，review 中由此产生探针 5 的双重引用问题。

  - probe: CTC-R003（全文）
    level: 应（第 4 层；规则行写「永远低于 S 族」，按 §2 也低于 A、P、T、L）；review 中报 WARNING。
    scope: |-
      所有模式下的中文输出与被审文本。第二类缺陷（情绪化感叹、口语语气词）只适用于告警、错误与状态提示。
    trigger: |-
      文本含以下任一缺陷：(a) 无必要的被动；(b) 名词化赘语「进行／作出／予以 + 动词」；(c) 过长的「的」字串；(d) 英语从句语序残留（「由于…的事实」）；(e) 直译连接词；(f) 告警、错误或状态提示中的情绪化感叹与口语语气词（「糟糕！」「啦」）。
    requires:
      - "在语义完全不变的前提下，改用中文技术写作的常规表达。"
      - "修复取能去除该缺陷的最小改动；不含该缺陷的文本不授权重写（§6 表后段）。"
      - "删改表推测的词（「好像」「可能」）时，按 CTC-S003 保留其不确定性。"
    prohibits:
      - "改变任何语义不变量；本规则永远低于 S 族。"
      - "把「好像」「可能」当作语气词删去，造成不确定性丢失。"
      - "在缺陷不存在的文本上做改写（CTC-R001）。"
    exceptions:
      - "被动用于突出受事、施事未知，或施事已在同句给出时，是自然的技术表述，不触发本规则。"
      - "表达推测的词不是语气词，不属于第 (f) 类。"
      - "第 (f) 类不覆盖告警、错误、状态提示以外文本中的口语化。"
    fork: yes
    readings:
      - id: F1-A
        reading: |-
          「好像」明确不是语气词，不在触发清单内。按 CTC-R001，没有规则触发的词原样保留；「删改时…保留」只是假设性的守护条款，不授权删改。
        behavior: 「上传好像失败了」保留「好像」。
      - id: F1-B
        reading: |-
          「删改时」预设可以删改。在错误信息中，把口语体的「好像」换成同强度的技术语体词，可以归因到 CTC-R003，只要不确定性保留。
        behavior: |-
          输出「上传似乎失败了」或「上传可能失败了」。B 读法内部还有分叉：技能没有给出认识强度刻度，「好像」→「可能」是否同强度（CTC-S003 允许同强度换词）无法从文本判定。
      - id: F2-A
        reading: 「过长」没有阈值，两个以上「的」即触发。
        behavior: 三层「的」定语会被改写。
      - id: F2-B
        reading: |-
          只有影响解析时才算过长（类推 CTC-A003 的「正常的中文多层定语不因长度或嵌套触发」）。
        behavior: 三层「的」定语通常保留。
      - id: F3-A
        reading: 三种自然被动的情形是穷举，其余被动一律「无必要」。
        behavior: |-
          对更多被动句动手；改为主动时常需补出施事，从而与 CTC-S002、CTC-A001 冲突。
      - id: F3-B
        reading: 三种情形只是示例，是否必要由语感判断。
        behavior: 改动更少，但审阅者之间不一致。
    notes: |-
      「直译连接词」也没有清单。F2、F3 让 CTC-R003 可以成为任意语感改动的归因出口，削弱 CTC-R001 的过滤作用（见探针 4）。
      第 (f) 类的适用范围写得明确，不构成分叉：README 等文本中的口语化不由本规则处理，且这类润色属于 §1 的不适用范围。

  - probe: CTC-R001 与 CTC-R003 的关系：哪些编辑可以归因到 CTC-R003
    level: CTC-R001 必须（横跨全部五层，约束全部六族的应用方式）；CTC-R003 应（第 4 层）。
    scope: 一切改写与翻译任务；review 中，CTC-R001 要求的归因就是 finding 的「规则」字段。
    trigger: CTC-R001 在每一处改动上触发；CTC-R003 只在它列明的缺陷出现时触发。
    requires:
      - "每一处改动都归因到一条具体规则 ID；未触发任何规则的文本原样返回。"
      - "归因到 CTC-R003 的编辑必须同时满足三点：(1) 针对 R003 列明的某类缺陷的具体实例；(2) 是去除该缺陷的最小改动；(3) 语义完全不变。"
      - "可以归因到 CTC-R003 的编辑：无必要的被动改为主动或无标记被动（三种自然情形除外）；删去「进行／作出／予以」，让动词直接作谓语；拆解过长的「的」字串；去除「由于…的事实」类从句残留；把直译连接词换成中文常规连接；在告警、错误、状态提示中删去情绪化感叹与口语语气词；以及让上述修复成句所必需的标点与语序随动调整。"
    prohibits:
      - "以「更清楚」「更专业」为由做等义替换，例如再试→重试、失败→未成功。"
      - "对不含缺陷的文本做重写或整体润色。"
      - "在一处 R003 修复中顺带改动别处，或把多处不相关改动混在一起。"
      - "删改表推测的词，使不确定性改变。"
      - "处理非告警类文本中的口语化：R003 第 (f) 类不覆盖，这类润色也在技能的不适用范围内。"
      - "把重复主语、碎句、话题链与连动结构的恢复归因到 CTC-R003；这些属于 CTC-R002。"
    exceptions:
      - "调用方授权的改动以授权本身作为归因（§3 调用方授权）。"
      - "§2「同层并列」：两个候选改动在同一层上等价时，保留来源已有的形式。"
    fork: yes
    readings:
      - id: F1-A
        reading: |-
          §7 第 6 步「施加自然中文渲染」只在第 3 步判定 CTC-R002／CTC-R003 已触发的地方执行。
        behavior: 未含缺陷的句子不动。
      - id: F1-B
        reading: |-
          第 6 步是对全文的无条件渲染通道，「恢复话题链与连动结构」可以施加到任何句子上。
        behavior: |-
          会对未含缺陷的句子做合句、调整语序。§6 表后段与 CTC-R001 支持 A 读法，但第 6 步写成了无条件步骤。
      - id: F2-A
        reading: 窄读：只对 R003 列明类别中明确的实例动手。
        behavior: R003 归因的改动少且可复核。
      - id: F2-B
        reading: |-
          宽读：「过长」「直译连接词」「无必要」都没有量化，凡语感认为是译文腔的地方都可以标为 CTC-R003。
        behavior: 几乎任何改动都能填上 CTC-R003，CTC-R001 的归因要求失去过滤作用。
      - id: F3
        reading: 「好像」能否删改，同探针 3 的 F1。
        behavior: 见探针 3。
    notes: |-
      两条规则的关系声明本身是一致的：CTC-R003 是缺陷检测器，不是改写许可（§6 表后段；§2「阶梯不授权改动」）。分叉来自 CTC-R003 触发条件的可量化程度，而不是来自关系声明。

  - probe: §8 审阅流程第 2 步：规则 ID 的确定；同一缺陷能否引用两个 ID
    level: |-
      流程规定，没有单一级别。严重级别映射：必须 → ERROR，应 → WARNING，可以 → STYLE。唯一的升级：应级 finding 的「风险」字段指名操作者因此会做出的不同动作时，可以报 ERROR。没有其他升级，也没有降级。
    scope: review 模式。
    trigger: 逐句比对时定位到一处违规。
    requires:
      - "每条违规确定唯一的规则 ID；同一处触发多条规则时分列，不合并。"
      - "规则行写明转 CTC-A005 的三种情形（CTC-A003 无证据、CTC-L004 边界本身歧义、CTC-P002 无法确定）引用 CTC-A005。"
      - "CTC-P002 的 finding 只针对来源或上下文能确定、却没有写出的部分。"
      - "每条 finding 写六个字段：规则、严重级别、位置、问题、风险、建议修改；位置逐字引用被审文本。"
    prohibits:
      - "报告没有规则 ID 的 finding。"
      - "把多条规则合并成一条 finding。"
      - "为显得周全而制造 finding。"
      - "发现冲突后修改被审文本或验收标准。"
    exceptions:
      - "没有 ERROR 或 WARNING 级 finding 时，返回「未发现违规」，其后最多三条 STYLE 观察。"
    fork: yes
    readings:
      - id: F1-A
        reading: |-
          「违规」指一个缺陷，必须为它挑出唯一的 ID。「同一处触发多条规则」指同一位置上的多个不同缺陷，各自成为一条 finding。同一缺陷不能引用两个 ID。
        behavior: |-
          每个缺陷只报一条 finding。例如，删除命名空间同时满足 CTC-P002（WARNING）与 CTC-S001（ERROR）的触发条件，但文本没有说明选哪一条。
      - id: F1-B
        reading: |-
          「违规」指（缺陷，规则）对。一个缺陷同时满足两条规则的触发条件时，分列为两条 finding，每条只有一个 ID。因此同一缺陷可以经两条 finding 引用两个不同 ID。
        behavior: 同一缺陷报两条 finding，finding 数量与最高严重级别都可能和 A 读法不同。
      - id: F2
        reading: |-
          在 F1-A 读法下，技能没有给出择一规则（例如「最具体的规则优先」或「最高级别优先」），只有三种转 CTC-A005 的硬性路由。
        behavior: |-
          不同审阅者对同一缺陷会选不同 ID：CTC-S001 或 CTC-P002；CTC-A005、CTC-S002 或 CTC-R004。规则字段和严重级别都可能不同。
      - id: F3-A
        reading: 三种转入情形只引用 CTC-A005，取代原规则。
        behavior: 只有一条 ERROR finding。
      - id: F3-B
        reading: 依「分列」，同时引用原规则（CTC-A003／CTC-L004／CTC-P002）与 CTC-A005。
        behavior: 同一处多出一条 WARNING finding。
    notes: |-
      我的读法：规则 ID 由「该缺陷满足哪条规则的触发条件」决定，三种转入情形强制改引 CTC-A005 并取代原规则（F3-A，「引用 CTC-A005」是替代性的表述）。第二问倾向 F1-B：一条 finding 只能有一个 ID，但同一缺陷独立满足两条规则时分列为两条 finding，所以同一缺陷可以经两条 finding 引用两个不同 ID。依据是「同一处触发多条规则时分列，不合并」。不过 F1-A 同样能自洽，仅凭文本无法排除。

  - probe: 缺失信息在 review 中的报告：(a) 重启对应服务 (b) 观察一段时间 (c) 备份数据库后路由至备用集群
    level: |-
      不是单一级别。涉及 CTC-A005（必须）、CTC-P002（应）、CTC-S002（必须）、CTC-R004（应）、CTC-P003（应）、CTC-P004（必须）。
    scope: review 模式。被审文档是 runbook，属于 strict 适用范围，采用 strict 歧义阈值（§3 review）。
    trigger: 步骤缺少对象、参数或判据。
    requires:
      - "按 §8 第 2 步确定唯一的规则 ID；可确定却未写出的报 CTC-P002，不可确定的报 CTC-A005。"
      - "按级别映射取严重级别；应级 finding 只有在风险字段指名不同动作时才可以报 ERROR。"
    prohibits:
      - "在建议修改中补出来源没有的服务名、时长或参数（CTC-S002、CTC-A005）。"
      - "为显得周全而制造 finding（§8）。"
    exceptions:
      - "CTC-P002 最后一句（已写出、未细化的对象不算缺失）。"
      - "CTC-P003 对缺失成功判据的限定。"
      - "§5「不算真歧义」。"
    fork: yes
    readings:
      - id: a-A
        reading: |-
          文件到服务的映射是领域推断，不是来源可确定的部分 → CTC-A005／ERROR。
        behavior: 建议修改为保持原句，并在待确认中索取服务名或单元名。
      - id: a-B
        reading: |-
          `gateway.yaml` 足以确定为网关服务 → CTC-P002／WARNING；风险字段写明「操作者可能重启错误的服务或漏掉重启」时可以报 ERROR。
        behavior: 建议修改为写出服务名；规则 ID 不同，严重级别取决于审阅者是否使用升级条款。
      - id: b-A
        reading: 时长是执行所需的阈值 → CTC-A005／ERROR。
        behavior: ERROR。
      - id: b-B
        reading: 归入「待确认」第 5 类 → CTC-S002／ERROR。
        behavior: 严重级别相同，规则 ID 不同（探针 1 F1）。
      - id: b-C
        reading: |-
          「一段时间」是无判据的门禁条件 → CTC-R004（第 4 类）／WARNING；风险字段写明「操作者可能在观察不足时提前下线 cache-07」时可以报 ERROR。
        behavior: 规则 ID 不同；严重级别可能是 WARNING。
      - id: c-A
        reading: |-
          CTC-P002 最后一句管辖整个判断：对象已写出、没有多个候选 → 无 finding。
        behavior: 该步计入「未发现违规」。
      - id: c-B
        reading: |-
          CTC-P002 最后一句只约束 P002 本身，备份目标与方式仍是执行所需的参数 → CTC-A005（或 CTC-S002）。
        behavior: ERROR。
      - id: c-C
        reading: |-
          把 CTC-P003 中的「该步」理解为被守护的后续步骤（路由流量），从而就备份缺少成功判据提出。
        behavior: CTC-P003／WARNING。
    answer:
      a:
        rule: CTC-A005
        severity: ERROR
        basis: |-
          「对应服务」正是 CTC-P002 点名的压缩形式，P002 触发（该步缺少对象）。上文只给出被修改的文件 `gateway.yaml`，没有给出读取该文件的服务名、单元名或实例；从文件推出服务是领域推断，不是来源可确定的部分。在 strict 阈值下，「重启网关服务」与「重启所有加载 gateway.yaml 的服务」都是可执行且动作不同的读法。按 P002「无法确定时按 CTC-A005 报告」和 §8 第 2 步的路由，引用 CTC-A005；CTC-A005 是「必须」级，因此为 ERROR。建议修改：保持原句，在待确认中索取服务名或单元名，不替作者写出服务名。
        alternative: |-
          若认定 `gateway.yaml` 足以确定为网关服务（a-B），则报 CTC-P002／WARNING；风险字段指名「重启错误的服务或漏掉重启」时可以报 ERROR。两种读法的分界只是「可确定」的证据门槛，技能没有给出这一门槛。
      b:
        rule: CTC-A005
        severity: ERROR
        basis: |-
          「一段时间」是不可逆操作 `cachectl decommission cache-07` 之前的等待时长，属于 CTC-A005 分支 (ii)「缺少执行所需的参数、阈值」。它与 §3 示例中的「多次」同型：该示例第四栏为空，说明它不按 §5 的情态模糊或 CTC-R004 处理。CTC-R004 的无判据词清单（尽量、尽可能、最好、适当、必要时、合理）不含「一段时间」，而且「一段时间」承担的是时长阈值，不是义务强度。不属于「不算真歧义」，因为它不是运行时由外部唯一确定的参数。CTC-A005 是「必须」级，直接为 ERROR，无需升级条款。
        alternative: |-
          若按「待确认」第 5 类处理，则引用 CTC-S002，同为 ERROR。若视为无判据的规范条件，则引用 CTC-R004 报 WARNING，风险字段写明「提前下线 cache-07」时可以报 ERROR。同句的「流量正常」同样缺少判据，不在本题范围内，可能另成一条 finding。
      c:
        rule: 无（不报告）
        severity: 无；该步计入「未发现违规」
        basis: |-
          CTC-P002 最后一句：步骤已写出对象（数据库、备用集群），全文没有给出多个可选的数据库或集群，因此不因未细化到实例就算缺少对象或位置。CTC-P004 已满足：前置条件「备份数据库后」位于被守护动作「将流量路由至备用集群」的同句前段。CTC-P003 不触发：缺少判据的是备份步骤，而备份本身不是破坏性或不可逆操作。§5 不允许因理论上的两种读法报告，§8 不允许为显得周全而制造 finding。
        alternative: |-
          若认为 CTC-P002 最后一句只约束 P002 本身（c-B），审阅者可能就备份目标或方式按 CTC-A005（或 CTC-S002）报 ERROR。若把 CTC-P003 的「该步」理解为后续的路由步骤（c-C），可能按 CTC-P003 报 WARNING。
    notes: |-
      三处都不涉及 CTC-A002：「对应」不在其指代成分清单（它、其、该、这、上述、前者、后者）内。
      (a) 中的「使配置生效」是目的，不是成功判据；重启不在 CTC-P003 的「破坏性或不可逆」范围内，因此 P003 也不触发。

  - probe: 错误信息「糟糕！上传好像失败了啦，请稍后再试。」的 strict 改写
    level: |-
      不是单一级别。涉及 CTC-R003（应）、CTC-S003（必须）、CTC-S002（必须）、CTC-R001（必须）、CTC-A005（必须）、CTC-R002（应）。
    scope: |-
      strict 改写；错误信息属于 strict 适用范围。输出契约：只返回改写后的正文，不加前言，不解释改动。
    trigger: |-
      CTC-R003 第 (f) 类：错误信息含情绪化感叹「糟糕！」和口语语气词「啦」。「好像」表推测，受 CTC-S003 保护。「请」表请求，受 CTC-S003 保护。
    requires:
      - "删去「糟糕！」，连同感叹号（CTC-R003，应级默认要求）。"
      - "删去「啦」，保留体标记「了」（CTC-R003）。"
      - "保留「好像」所表达的不确定性（CTC-R003 例外句；CTC-S003）。"
      - "保留「请稍后再试」的请求言语行为和「稍后」的原表述（CTC-S003、CTC-R001）。"
    prohibits:
      - "删去「好像」或改成确定断言「上传失败」（CTC-S003，认识强度由推测变为确定；§9 第 4 条）。"
      - "把「请稍后再试」改为「须稍后重试」「请务必…」（CTC-S003，请→须）。"
      - "把「稍后」改为具体时长，例如「30 秒后」（CTC-S002 来源未给的默认值与超时；CTC-A005 不得补出缺失项）。"
      - "补写失败原因（如网络中断）、错误码、处理建议（如检查网络）或免责声明（CTC-S002；§3 strict「不得虚构…失败原因或告警」）。"
      - "做等义替换，如「再试」→「重试」、「失败」→「未成功」、「上传」→「文件上传」（CTC-R001，无规则触发）。"
      - "补出主语，如「您的文件」（CTC-S002；CTC-R002，不消除任何歧义）。"
      - "为「稍后」或「好像」追加「待确认」：二者都不属于七类。「好像」是真实的不确定性，不是歧义；「稍后」在错误信息中不是执行所需的参数（§5，不得因理论上的两种读法报告）。"
      - "附加前言或改动说明（§3 输出契约）。"
    exceptions:
      - "「好像」「可能」等推测词不是语气词（CTC-R003）。"
      - "同强度换词是允许的（CTC-S003）；能否用于「好像」见 F1。"
    fork: yes
    readings:
      - id: F1-A
        reading: |-
          「好像」不在 CTC-R003 的触发清单内，按 CTC-R001 原样保留。
        behavior: 输出「上传好像失败了，请稍后再试。」
      - id: F1-B
        reading: |-
          「删改时其不确定性按 CTC-S003 保留」授权在错误信息中把口语体的「好像」换成同强度的技术语体词。
        behavior: |-
          输出「上传似乎失败了，请稍后再试。」或「上传可能失败了，请稍后再试。」；后者是否与原句同强度，技能无法判定。
      - id: F2-A
        reading: |-
          「稍后」在错误信息中是惯用请求，不是执行所需的参数。
        behavior: 不追加「待确认」。
      - id: F2-B
        reading: |-
          strict 阈值下，重试间隔是执行所需的信息，归入「待确认」第 5 类（CTC-S002）。
        behavior: 正文末追加「稍后 | 未给出重试间隔 | 重试等待时长」一行。
    answer: |-
      改写结果：上传好像失败了，请稍后再试。
      允许或要求的编辑：删去「糟糕！」（CTC-R003，错误信息中的情绪化感叹，应级默认要求）；删去「啦」并保留「了」（CTC-R003，口语语气词）。除此之外不做任何改动，依据是 CTC-R001：没有其他规则触发。
      不允许的编辑及其规则：删去「好像」或改为确定断言（CTC-S003，§9 第 4 条）；「好像」→「可能」有认识强度改变的风险（CTC-S003，见 F1）；请→须（CTC-S003）；把「稍后」具体化（CTC-S002、CTC-A005）；补写原因、错误码或建议（CTC-S002，§3 strict）；再试→重试等等义替换（CTC-R001）；补主语（CTC-S002、CTC-R002）；追加「待确认」或前言（§3 输出契约）。
      删去「糟糕！」不违反 CTC-S001 或 CTC-S003：它不承载独立命题，也不属于 S003 列出的言语行为（情态、义务、请求、许可、禁止、建议、系统行为描述），并且 R003 规则行点名了它。
    notes: |-
      本题的分叉集中在「好像」是否可以换词（F1）。在 F1-A 读法下，输出的唯一性取决于 CTC-R001 的最小改动原则。
