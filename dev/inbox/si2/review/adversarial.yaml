reviewer: adversarial
model: claude-opus-5-5
# 只列出读过内容的文件。eval/reports/raw/ 只做了目录列表，没有读取 si2-probe-full、si2-probe-noE2、si2-gold-* 的输出；
# 没有读取 dev/inbox/si2/review/ 下的其他文件。
files_read:
  - dev/prompts/si2-adversarial.md
  - dev/inbox/si2/base/SKILL.md
  - dev/inbox/si2/cand/full/SKILL.md   # 通过与基线的 diff 读取，只有三行不同
  - dev/inbox/si2/cand/build.py
  - dev/inbox/si2/probes/probes.yaml
  - eval/reports/raw/si2-probe-base-r1/PR-{01,02,03,05,07,13,14}.claude.json
  - eval/reports/raw/si2-probe-base-r2/PR-{01,02,03,05,07,13,14}.claude.json
  - eval/reports/raw/si2-probe-base-r3/PR-{01,02,03,05,07,14}.claude.json   # PR-13 r3 不存在
  - eval/gold/gold-rendering.yaml   # 只读 G-R-007、G-R-011
  - eval/reports/raw/si2-base/G-R-007.claude.json
  - eval/reports/raw/si2-base/G-R-011.claude.json
  - docs/decisions/000-design.md   # §20
  - docs/decisions/003-core-semantic-policy.md
  - docs/decisions/004-rule-set-adjudications.md

edits:
  - id: E1
    semantic_change: |
      只作用于 review 模式（§8 第 2 步）。基线中有三条规则行写明转 CTC-A005：CTC-A003「无证据时转 CTC-A005 报告」、CTC-L004「转 CTC-A005」、CTC-P002「无法确定时按 CTC-A005 报告」。它们都没有说明 finding 的「规则」字段该写哪条 ID，基线运行因此在 CTC-P002 与 CTC-A005 之间分叉。
      候选规定这三种情形一律引用 CTC-A005，并把 CTC-P002 的 finding 限定为「来源或上下文能确定、却没有写出的部分」。
      多禁止的：对无法确定的缺口引用 CTC-P002 或 CTC-A003。多允许的：无。三条规则行本身的触发与要求不变。
    level_change: |
      规则行的级别不变。实际严重级别有变化：CTC-P002（应）与 CTC-A003（应）中「无法确定」的子集改为引用 CTC-A005（必须），默认严重级别由 WARNING 变为 ERROR，也不再需要满足 §8 的风险字段升级条件。CTC-L004 本来就是必须，没有变化。
    evidence_supports: partly
    evidence_note: |
      - PR-01：「确认新证书已生效」一处，r1、r2 引 CTC-P002 / WARNING，r3 引 CTC-A005 / ERROR。同一缺口的 ID 与严重级别都分叉，原因确实是「按 CTC-A005 报告」没有指明 ID。这是 E1 最直接的证据。
      - PR-03：DROP 一步，r1 引 CTC-A005，r2、r3 引 CTC-P002（升级为 ERROR）。ID 分叉，严重级别一致。不过这些 finding 本身就是 E2 要压掉的实例级细节（实例、库、schema）；E2 生效后分叉的对象消失，PR-03 不再能作为 E1 的证据。
      - PR-07：真正的分叉在「确认流量正常后」：r1 引 CTC-A005，r2 引 CTC-R004，r3 两条都报。CTC-R004 不在 E1 列举的范围内，E1 不解决这一分叉。r1 第 3 条（哪个负载均衡实例）是 CTC-P002 / WARNING，同样会被 E2 压掉。
      - 现有规则是否已覆盖：三条规则行与 §5 都已写明转 CTC-A005，E1 只补上 review 模式下 ID 归哪条，属于澄清。
      - 是否最小：第二句可由第一句和 CTC-P002 本行推出，冗余但无害。我没有找到第二句单独造成的误报，它反而防止了同一处 P002 与 A005 双报。
      - 缺口：没有一条预登记的探针或金标规定「CTC-P002 无法确定」时应得 ERROR。PR-13 只测 CTC-P002 一侧（能确定时）。
    clarification_or_new: clarification
    counterexamples:
      - kind: false_fire
        task: review
        mode: review（被审文档为 runbook，按 strict 阈值）
        input: |
          ## 证书轮换
          1. 在 `vault` 中生成新证书。
          2. 必要时重启 `gateway`。
          3. 确认新证书已生效。
        candidate_behaviour: |
          看第 3 步「确认新证书已生效」。来源同时出现了 `vault` 与 `gateway` 两个可检查的位置，满足 E2 的例外，所以算缺少位置。审阅者无法确定是哪一个，按 E1 引 CTC-A005，报 ERROR。基线三次运行中有两次是 CTC-P002 / WARNING。
        why_wrong: |
          这一步主要缺的是验证方法和判据。CTC-P003 规定，来源没有给出成功判据时，只有破坏性或不可逆、且后续步骤的安全性取决于它的步骤才提出，目的是「以免正常的流程文档产生成串的未决项」。第 3 步是最后一步，只读。E1 让这类缺口经「P002 无法确定 → A005」拿到 ERROR，绕过了 CTC-P003 的限制和 §8 的风险字段条件。
          这一点可争：如果认定 `vault` 与 `gateway` 是两种导致不同检查动作的读法，决定 003 第 1 条支持 ERROR。
          我没有构造出不可争的误报。尝试过的方向：
          (1) standard 文档里低风险的位置缺口：读法仍然对应不同操作，003 支持 ERROR；
          (2) CTC-A003 无证据转 CTC-A005：A003 的触发本身就要求对应不同的操作对象；
          (3) 审阅改写时，把来源遗留的缺口算到改写头上：基线同样会报，只是报 WARNING；
          (4) 同一处 P002 与 A005 双报：E1 第二句反而防止了双报。
      - kind: missed_fire
        task: review
        mode: review（被审文档为 runbook，按 strict 阈值）
        input: |
          ## 调整 `billing` 连接池
          1. 将 `billing.yaml` 中的 `db.pool.max` 改为 `50`。
          2. 重启对应服务，使配置生效。
        candidate_behaviour: |
          E1 要求审阅者先二选一：能确定的引 CTC-P002，无法确定的引 CTC-A005。基线 PR-13 r2 在同构的输入上写过「标题中的 `gateway` 不一定就是可以直接重启的服务名」。在 E1 下，同样的犹豫会被路由到 CTC-A005，输出「保持原表述，请作者提供服务名」，报 ERROR。
        why_wrong: |
          对象可以由标题和配置文件名确定，按 CTC-P002 应建议写出 `billing`。PR-13 的 fail_if 明确把「以 CTC-A005 报告」判为失败。
          基线措辞含糊，审阅者可以一边存疑一边仍引 P002（PR-13 的 r1、r2 都通过）。E1 把这种存疑变成了换一条规则，结果丢掉「写出 `billing`」这条修复建议。E1 没有提供新的「能否确定」判据，只是把分叉点从「引哪条 ID」挪到了「能不能确定」。
    conflicts:
      - |
        §8 严重级别段「唯一允许的升级……没有其他升级」：E1 形式上不算升级，但它让「应」级规则的一个子集不需要风险字段就得到 ERROR。这个后果应在决定记录中明确承认，不能只作为路由的副作用出现。
      - |
        决定 003 第 1 条规定，无法消解的歧义在「读法导致不同操作时为 ERROR，否则为 WARNING」。SKILL.md 中 CTC-A005 是必须级，又没有降级，WARNING 分支走不到。这是既有的张力，E1 扩大了它覆盖的 finding 数量。
      - |
        CTC-P003 对缺失成功判据的限制，与 CTC-A005「缺少……判据」的重叠，是既有问题。E1 让更多 P002 finding 落进这块重叠区（见 false_fire 反例）。
      - |
        与 §3 输出契约、§5 没有矛盾：在这三种情形下，§5「严重级别按所引规则的级别」解析为 ERROR。
    verdict: accept
    rationale: |
      E1 把三条规则行已经写明的转向落实到 review 的 ID 字段上，是澄清而不是新增，直接消除了 PR-01 中可以复现的 ID 与严重级别分叉。
      它有真实的语义代价：CTC-P002 / CTC-A003「无法确定」子集的默认严重级别由 WARNING 变为 ERROR，build.py 的注释没有提到这一点。接受的条件有两条：
      - 在决定记录中写明这个后果；
      - 保留 PR-13 作为 P002 一侧的回归用例，并另加一条「P002 无法确定 → A005」一侧的用例。
      E1 不解决 PR-07 的 A005 / R004 分叉，不应把 PR-07 记为 E1 的收益。

  - id: E2
    semantic_change: |
      收窄 CTC-P002 的触发：已写出的对象只是没有细化到实例、路径或命名空间时，不再算「缺少对象或位置」；来源或上下文给出多个可选对象时除外。
      多允许的：对「备份数据库」「停止 `archive-sync` 服务」这类步骤，不报告、不补写。多禁止的：无。
      CTC-P002 的要求部分（写出可确定的部分、不得压缩、不得删除节点／环境／命名空间）文字不变。经 E1 联动，这类缺口也不再转 CTC-A005。
    level_change: none（CTC-P002 仍为应）
    evidence_supports: yes
    evidence_note: |
      G-R-007 的基线输出有两条 CTC-P002 / WARNING，都把实例级细化当成了缺失：哪个数据库实例、备份存到哪里、哪个备用集群。金标要求零 finding。这确实是把「缺少对象或位置」读成包含实例粒度造成的。
      同样的模式还出现在：
      - PR-01 第 1 步：哪个证书路径或角色（3 次都报）；
      - PR-03 r2 第 2、4 步：`archive-sync` 所在的节点或命名空间；
      - PR-07 r1 第 1 步：哪个负载均衡实例；
      - PR-13 r1、r2 的第 2、3 条：`gateway.yaml` 的路径、重启的环境。
      §5「不得因理论上可解析出两种读法而报告」和 §8「不得为显得周全而制造 finding」在原则上已经覆盖这类情形，只是模型没有遵循，因此 E2 是对 CTC-P002 触发边界的澄清。
      两点保留：
      (1) G-R-007 第 2 条还问了「路由哪部分流量」，这是对象的范围，不是实例、路径或命名空间，E2 可能压不掉它；
      (2) 例外条件「多个可选对象」写得比动机窄，具体见下面的反例。
    clarification_or_new: clarification
    counterexamples:
      - kind: missed_fire
        task: rewrite
        mode: strict
        input: |
          ## 修改 `gateway` 限流阈值
          1. 将 `gateway.yaml` 中的 `rate_limit.qps` 改为 `2000`。
          2. 重启对应服务，使配置生效。
        candidate_behaviour: |
          如果把「对应服务」读作已经写出的对象「服务」，它只是没有细化到实例 `gateway`。上下文只给出一个候选，不满足「多个可选对象」，按 E2 不算缺少对象。于是 CTC-P002 不触发，「对应服务」原样返回，也不进「待确认」。
        why_wrong: |
          这正好命中 PR-14 的 fail_if（「对应服务」原样保留且未报告）；同一读法也会让 PR-13 不报。
          CTC-P002 本行要求「来源或上下文中可确定的部分应写出」，还点名了「对应服务」。E2 的例外只在候选有多个时恢复触发，恰好把「唯一可确定」这种 P002 最该触发的情形排除在外。
          这种读法并不牵强：基线 PR-13 r2 的审阅者就把标题里的 `gateway` 视为不确定。
      - kind: missed_fire
        task: review
        mode: review（被审文档为 runbook，按 strict 阈值）
        input: |
          ## 发布 `api` v2
          1. 在 `staging` 命名空间中部署 `api:v2`，确认冒烟测试通过。
          2. 在 `prod` 命名空间中部署 `api:v2`。
          3. 删除旧版本的 Deployment `api-v1`。
        candidate_behaviour: |
          第 3 步已经写出对象 `api-v1`，只是没有细化到命名空间。来源给出了两个命名空间，但它们是位置，对象只有一个，字面上不满足「多个可选对象」。所以不算缺少位置，不报告。
        why_wrong: |
          删除是破坏性操作。只删 `prod`、只删 `staging`、两处都删，是三种不同的动作，来源又无法确定，应按 CTC-A005 报告（ERROR）。
          E2 前半句列出了「实例、路径或命名空间」，例外条件却只写「对象」，字面上漏掉了位置维度上的多个候选。
      - kind: false_fire
        task: review
        mode: review（被审文档为 runbook，按 strict 阈值）
        input: |
          本服务支持 MySQL 与 PostgreSQL 两种存储后端。

          ## PostgreSQL 后端升级
          1. 备份数据库。
          2. 执行 `migrate --to 12`。
        candidate_behaviour: |
          上下文给出了两个可选对象（MySQL、PostgreSQL），满足 E2 的例外，「备份数据库」于是算缺少对象。章节标题能确定是 PostgreSQL，所以按 CTC-P002 报 WARNING，建议写成「备份 PostgreSQL 数据库」。
        why_wrong: |
          标题已经确定了对象，效果等同于「上下文只给出一个候选」，而那种情形 E2 会压掉。同样的确定性，只因为文档别处提过备选，就得出相反的结论。这正是 G-R-007 式的误报，也违背 §4「标题建立的条件管辖其子树，不得复制进每个子步骤」的精神。
          注：基线同样会出这个误报，只是 E2 没能消除它。修正它需要扩大豁免，超出 revise 允许的范围，这里只记录，不改。
    conflicts:
      - |
        CTC-P002 本行内部：E2 豁免了「单一可确定候选」的情形，与同行的「可确定的部分应写出」和「不得压缩为「对应服务」」冲突（见第一个 missed_fire 反例；也违背 PR-13、PR-14 的 accepted 预期）。
      - |
        §4「结构也承载语义」与 CTC-L001：例外条件不考虑结构是否已经确定了候选（见 false_fire 反例）。
      - 与 §2 阶梯、§3 输出契约、§5 歧义处理无矛盾。
    verdict: revise
    revised_wording: |
      （替换 E2 追加的那一句；CTC-P002 行其余文字不变）
      步骤已写出对象时，不因它没有细化到实例、路径或命名空间就算缺少对象或位置，除非来源或上下文给出了多个可选的对象、实例、路径或命名空间；「相关配置」「对应服务」这类说法不算写出对象。
    rationale: |
      保留 E2 的核心：上下文没有任何候选时，不因实例粒度报缺失。这已覆盖 G-R-007 和 PR-01、PR-03、PR-07、PR-13 中多余的 finding。只做两处收窄：
      (1) 例外条件扩展到实例、路径和命名空间，第二个 missed_fire 反例因此恢复触发，并按 E1 转 CTC-A005；
      (2) 把 CTC-P002 本行已经点名的压缩说法排除出「写出对象」，PR-13、PR-14 因此回到基线行为。
      两处都只缩小豁免范围，不增加任何要求：修订后的豁免集合是候选豁免集合的子集。
      false_fire 反例里那种「结构已确定其中一个候选」的残余误报，修订版没有处理，原因见该反例的注。

  - id: E3
    semantic_change: |
      E3：CTC-R003 新增一类触发——告警、错误与状态提示含情绪化感叹与口语语气词（「糟糕！」「啦」）时，改用常规的技术表达。规则名由「反译文腔」改为「反译文腔与口语化」。
      E3b：新增「表达推测的词（「好像」「可能」）不是语气词，删改时其不确定性按 CTC-S003 保留」。
      多允许的：删除或改写这类文本中的感叹与语气词。基线没有任何规则可以作为这种改动的归因，所以 CTC-R001 不允许做。
      多禁止的：没有新的禁止。E3b 是对 CTC-S003 的重申。
      规则仍在第 4 层，仍低于 S 族。
    level_change: none（CTC-R003 仍为应）
    evidence_supports: partly
    evidence_note: |
      G-R-011 的基线输出原样返回，原因确实是没有规则 ID 可以授权删除「糟糕！」。对 CTC-R001 来说，基线行为是正确的：失败在于缺少授权，不是模型没有遵循现有规则。告警与错误信息也在适用范围内。
      但金标只要求删除「糟糕！」：rendering 不变式写的是「情绪化感叹词「糟糕！」应删除」，invalid_transformations 第 2 条也只因「糟糕」判为失败。来源里没有「啦」；「了」「好像」只是可以删，不是必须删。因此「口语语气词（「啦」）」这一半没有任何失败用例支撑，按准入门槛不应进入。
      E3b 有金标支撑：G-R-011 的 fact 不变式要求保留「原因未确认」这一状态。
      另外缺少边界反例，没有说明 E3 不该在哪里触发，比如嵌入在 agent 指令中的规定回复，或文档里引用的界面文案。
    clarification_or_new: new（E3 是新的触发类别；E3b 是对 CTC-S003 的澄清）
    counterexamples:
      - kind: false_fire
        task: rewrite
        mode: strict（agent 指令）
        input: |
          你是订单助手。调用 `create_order` 失败时，回复用户：「糟糕！订单没提交成功啦，请稍后再试。」不要编造失败原因。
        candidate_behaviour: |
          文本中有一条错误提示，同时含「糟糕！」和「啦」，满足 E3 的触发，于是改写为「订单提交失败，请稍后再试。」
        why_wrong: |
          这是 agent 指令，引号内是调用方规定的输出，是指令内容本身。改写它就改变了 agent 的行为，违反 CTC-S001（断言集合）和 CTC-S003（言语行为不变）。品牌语气属于 §1 排除的范围，不是 CTC 的改写目标。
          候选把触发写成「告警、错误与状态提示含……」，没有限定目标文本本身就是提示，所以嵌在其他文本里的提示也会命中。唯一的防线是「本规则永远低于 S 族」，这要求模型自己认出引号里的内容是被断言的对象。
      - kind: false_fire
        task: rewrite
        mode: strict（告警）
        input: |
          告警：`orders-db` 主从延迟超过 30 秒，是夜间备份把磁盘 IO 占满了吧，先别切主。
        candidate_behaviour: |
          「吧」是典型的口语语气词，E3 明确允许删除它；E3b 的例外只点名了「好像」「可能」这类词汇性的推测词。于是输出「告警：`orders-db` 主从延迟超过 30 秒，原因是夜间备份占满了磁盘 IO，先不要切主。」
        why_wrong: |
          句末的「吧」是这句话里唯一的不确定标记，表达推测。删掉它，推测的原因就成了确定的原因：认识强度上升，违反 CTC-S003；因果强度从「可能导致」升为「导致」，违反 CTC-S006。§9 第 4 条也禁止删除软限定。
          E3b 的保护靠列举词汇，覆盖不到兼有推测义的句末语气词，而 E3 又把「语气词」整类列为可删对象。
      - kind: missed_fire
        task: rewrite
        mode: strict（错误提示）
        input: |
          糟糕！`payment-api` 返回 502，请稍后重试。
        candidate_behaviour: |
          触发条件写作「含情绪化感叹与口语语气词」。如果按合取读（两者都有才触发），这句只有感叹，没有语气词，就不触发，按 CTC-R001 原样返回。
        why_wrong: |
          它与 G-R-011 是同一个缺陷，金标要求删除「糟糕！」。CTC-R003 本行其余部分都用「、」和「或」列举可以单独触发的项，只有这里改用「与」，在 CTC 自己的文本里造出了 CTC-L002 要防范的合取／析取歧义。合取读法不是多数读法，但自托管要求规则文本本身没有这种歧义。
    conflicts:
      - |
        CTC-S001 / CTC-S003：触发范围覆盖了嵌在其他文本中的提示（见第一个 false_fire 反例），只靠「低于 S 族」兜底。
      - |
        §4 把界面文案排除在受保护标记之外。与 E3 叠加后，文档里引用的界面提示（如「出错时界面显示「糟糕，出错啦！」」）会被改写，文档从此与产品对不上。这里同样只靠 S 族兜底。
      - |
        CTC-S003、CTC-S006 和 §9 第 4 条：句末表示推测的语气词（见第二个 false_fire 反例）。
      - |
        自托管：「情绪化感叹与口语语气词」存在合取／析取歧义（见 missed_fire 反例）。
      - |
        与 §2 不冲突：第 4 层描述的「专业中文技术语体」可以容纳语域问题。
    verdict: revise
    revised_wording: |
      | CTC-R003 | 应 | 反译文腔与口语化 | 文本含无必要的被动、名词化赘语（进行／作出／予以 + 动词）、过长的「的」字串、英语从句语序残留（「由于…的事实」）或直译连接词，或目标文本是告警、错误或状态提示且含情绪化感叹（「糟糕！」）时，在语义完全不变的前提下改用中文技术写作的常规表达。被动用于突出受事、施事未知或施事已在同句给出时是自然的技术表述。删改表达推测的词（「好像」「可能」）时，其不确定性按 CTC-S003 保留。本规则永远低于 S 族。 |
    rationale: |
      只保留 G-R-011 需要的最小授权：目标文本是告警、错误或状态提示，并且含情绪化感叹时，可以删改。做三处收窄：
      (1) 删去没有失败用例支撑的「口语语气词（「啦」）」。这消除了第二个 false_fire 反例的风险，也顺带消除了「与」的合取歧义（missed_fire 反例）。
      (2) 把触发限定为目标文本本身就是提示，排除嵌在 agent 指令或文档中的被引用提示（第一个 false_fire 反例）。
      (3) E3b 去掉「不是语气词」半句，因为它预设了语气词触发；只保留「删改推测词时，不确定性按 CTC-S003 保留」。
      修订后 G-R-011 仍能通过：删去「糟糕！」，其余原样，就满足它的全部不变式。
      如果编排方想保留「口语语气词」，需要先补两条用例：一条只含纯语气词的失败用例，一条句末推测语气词（「吧」）的边界用例。
      规则名沿用候选。如果担心「口语化」被读成更宽的授权，可以退回基线名称「反译文腔」，两者都不比候选宽。

other_observations:
  - |
    PR-07「确认流量正常后」一处的 A005 / R004 分叉，三处改动都没有触及。CTC-R004 列出的无判据词（尽量、尽可能、最好、适当、必要时、合理）不含「正常」，这份列表是穷举还是举例并不清楚，这才是 PR-07 分叉的来源。si2 的结果中，不应把 PR-07 的分叉是否消失归功于 E1。
  - |
    E1 与 E2 叠加后的净效果：在 review 中，已写出但不够具体的对象只在有多个候选时触发 P002，而有多个候选时通常无法确定，于是转为 A005 / ERROR。P002 实际上只剩下针对压缩说法和完全缺失的成分。这是否就是想要的结果，应在决定记录中写明。
  - |
    G-R-011 的 fact 不变式把「好像」理解为对原因的推测。但在来源中，「好像」位于「无法连接到数据库服务器」之前，字面上推测的是故障本身。CTC-S003 要求情态「逐处不变」，加上 E3b，会把推测保留在原来的位置；而金标接受把推测挪到原因上（「可能由于网络问题」）。金标与规则之间存在张力，决定记录应写明以哪个为准。
  - |
    G-R-007 基线第 2 条 finding 中的「路由哪部分流量（全部流量，还是某个服务或入口的流量）」不属于实例、路径或命名空间，E2 和修订版都可能压不掉。评估 G-R-007 时应逐条看 finding，不要只看总数。
  - |
    基线 PR-13 只有 r1、r2 两次运行（r3 文件不存在），P002 一侧的基线证据只有两次。
  - |
    决定 003 第 1 条允许 A005 类 finding 为 WARNING，但 SKILL.md 的映射（必须 → ERROR，无降级）使 WARNING 走不到。这一既有张力与 E1 直接相关，应由人工决定以哪个为准，不应由某次候选改动隐式决定。
