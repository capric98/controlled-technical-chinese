reviewer: cold-decoder
model: claude-opus-5-5
files_read:
  - dev/prompts/si2-decode-v2.md
  - dev/inbox/si2/cand/v2/SKILL.md
files_read_note: |-
  运行环境自动注入了 AGENTS.md／CLAUDE.md，未用于推断技能意图。除上面两个文件外未读仓库其他文件
  （只用 ls 确认了输出目录存在，未打开其中任何文件）。

probes:
  - probe: "1. CTC-A005"
    level: 必须（review 中映射为 ERROR）
    scope: |-
      全部任务（改写、翻译、新写、审阅）与全部模式。strict／standard 下产出「待确认」条目，review 下产出
      finding（§5）。「竞争读法」支受模式阈值调节：strict 最低（一种在本文档语境下可执行且导致不同动作的读法即算），
      standard 较高（普通技术读者会就此产生分歧才算），review 按被审文档类型选用前两者之一。
      它也是 CTC-A003（无证据）、CTC-L004（边界本身歧义）、CTC-P002（无法确定）的转出目标（§8 第 2 步）。
    trigger: |-
      满足下列两支之一：
      (1) 存在两种以上导致不同行为的读法，且来源与上下文都不足以确定作者意图；
      (2) 缺少执行所需的参数、阈值、接收方或判据。
    requires: |-
      保持原表述；在「待确认」中写出位置、竞争读法或缺失项、判定所需的信息
      （格式 `位置 | 问题 | 需要的信息`，第四栏「建议」只在情态模糊时填写，A005 条目省略）。
      review 下作为一条 finding，规则字段填 CTC-A005，级别 ERROR。
    prohibits: |-
      静默择一；补出缺失项（具体数字、默认值、超时、接收方、判据）；用流畅改写把歧义掩盖成确定句；
      输出多个完整备选版本；在同一处既消歧又替换关键动词（§5）。
    exceptions: |-
      - §5「不算真歧义」：一种读法在该领域不对应任何可执行操作；参数在运行时由外部唯一确定（`Retry-After` 例）；
        不得因「理论上可解析出两种读法」而报告。
      - CTC-P002 倒数第二句：步骤已写出具体对象、只是未细化到实例／节点／环境／路径／命名空间时，不按 A005 报告；
        来源或上下文在这些层级上给出多个候选时除外。
      - CTC-P003 末句：来源未给成功判据的步骤，只有破坏性或不可逆且后续安全依赖其成败时才提出。
      - CTC-A001：review 中施事可由上下文唯一推定时不产生 finding。
    fork: yes
    readings:
      - id: A
        reading: |-
          缺失信息支（第 2 支）在 review 中引用 CTC-A005：规则条文明列「缺少执行所需的参数、阈值、接收方、判据」，
          §5 又写「上下文不能确定时，按 CTC-A005 … review 模式下作为一条 finding 报告」。
        behavior: finding 规则字段 = CTC-A005，ERROR。
      - id: B
        reading: |-
          缺失信息归 CTC-S002：§3「待确认」第 5 类写明「执行所需而来源与上下文都未提供的信息，不论由哪条规则发现（CTC-S002）」，
          第 1 类只把「两种以上读法都成立而无从判定」的歧义归给 A005；§5 还把「多次」「升级」放在「不算真歧义」一段里。
          据此 A005 只管竞争读法，缺失信息的规则 ID 是 S002。
        behavior: 规则字段 = CTC-S002，级别同为 ERROR。按规则 ID 比对的评测会判为不一致；级别不受影响。
      - id: C
        reading: |-
          缺失的「判据」由更具体的规则接管：规范条件由无判据词承担 → CTC-R004（第 4 类）；成功判据缺失 → CTC-P003（第 2 类）。
          A005 条文列了「判据」，却没有说明它让位于 R004／P003；§8 也没有给出重叠规则之间的择一顺序。
        behavior: |-
          同一缺陷：A 读法报 ERROR（A005），C 读法报 WARNING（R004／P003 均为「应」）；
          非破坏性步骤缺成功判据时，A 读法报告，C 读法按 P003 末句不报告。
      - id: D
        reading: |-
          D1：standard 的较高阈值只定义何为「竞争读法」，缺失信息支在 standard 下照常触发。
          D2：§3 说 A 族在 standard 下「歧义阈值更高」，对整族（含缺失信息支）生效，普通技术读者不会在意的缺失项不报告。
        behavior: API 文档里的「请求失败时重试」未给次数：D1 进「待确认」，D2 原样返回、不报告。
    notes: |-
      §5「严重级别按所引规则的级别」与 §8 第 2 步（转出情形规则字段填 A005、不另列原规则）合读，结论可以确定：
      CTC-A003 有证据而未消歧时报 WARNING，无证据而转 A005 时报 ERROR。这不构成分叉，但造成「越无法判定越严重」的
      级别倒置；如非有意，应由作者确认。

  - probe: "2. CTC-P002（全文，含最后两句）"
    level: 应（review 中 WARNING；风险字段指名了操作者因此会做出的不同动作时可以按 ERROR 报告，§8）
    scope: |-
      目标文本是可执行步骤（runbook、SOP、变更流程、排障步骤；agent 指令中的步骤性内容大概率也算）；
      改写、翻译、新写与审阅。
    trigger: |-
      某一步缺少动作、对象或位置。
      - 「相关配置」「对应服务」这类说法不算写出对象 → 视为缺少对象，触发。
      - 已写出具体对象、只是未细化到实例、节点、环境、路径或命名空间 → 不算缺少，不触发，也不转 A005；
        但来源或上下文在对象或这些层级上给出了多个候选时，这一豁免不成立。
    requires: |-
      来源或上下文中可确定的部分写出；无法确定时按 CTC-A005 报告（review 中规则字段填 A005，不另列 P002）。
      review 中 P002 finding 只针对「来源或上下文能确定、却没有写出」的部分。
    prohibits: |-
      压缩为「相关配置」「对应服务」「按需处理」；删除操作发生的节点、环境或命名空间；
      命令已完整表达动作与对象时再补写自然语言描述；（与 S002 合读）补出无法从来源或上下文确定的对象或位置。
    exceptions: |-
      命令已完整表达动作与对象；具体对象未细化到实例等层级且无多候选；
      写出可确定的动作、对象或位置属于消除操作未定，不算 CTC-R002 违规（§2、R002）。
    fork: yes
    readings:
      - id: A
        reading: |-
          「可确定」的证据门槛。
          A1：命名约定等间接证据即足够——上一步修改 `gateway.yaml`，所以「对应服务」就是网关，按 P002 写出。
          A2：只有来源或上下文明说的对象才算可确定；从文件名推到服务属于推断，按 A005 报告。
        behavior: |-
          改写：A1 输出「重启网关，使配置生效。」，A2 保持原句并进「待确认」。
          review：A1 报 P002（WARNING，可升 ERROR），A2 报 A005（ERROR）。
      - id: B
        reading: |-
          「多个候选」的范围。
          B1：该层级在来源或上下文中出现过多个值即算（如前面的步骤分别使用 `staging` 与 `prod`）。
          B2：只有针对这一步明确给出的备选（「在 A 或 B 上执行」）才算。
        behavior: |-
          第 6(d) 题：B1 下豁免不成立，按缺位置处理，无法确定 → A005 ERROR；
          B2 下 `api-v1` 是具体对象，不算缺位置，不报告。
      - id: C
        reading: |-
          「…除外」的作用域。
          C1：多候选时整个豁免失效，回到主句：能确定就写出（P002），不能确定再转 A005。
          C2：多候选时直接按 A005 报告。
        behavior: 多候选但上下文能定其一时，C1 写出该值，C2 仍进「待确认」。分叉较弱，C1 更贴合句法。
      - id: D
        reading: |-
          命令表达了动作与对象、但没有带位置（如 `kubectl delete deploy api-v1` 缺 `-n`）。
          D1：豁免只覆盖动作与对象，位置仍按 P002 处理；D2：命令完整即整步豁免。
        behavior: D1 下仍需写出或报告命名空间，D2 下不处理。分叉较弱。
    notes: |-
      最后一句把第二句中的禁止形式（「相关配置」「对应服务」）同时定义为触发条件，这一点清楚。
      倒数第二句有效抑制了把「备份数据库」细化到具体实例或路径的冲动，与 S002 互补。

  - probe: "3. CTC-R003（全文）"
    level: 应（review 中 WARNING）；第 4 层；条文写明「永远低于 S 族」，按 §2 阶梯也低于第 1–3 层的 A、P、T、L 族。
    scope: |-
      改写、翻译、新写的输出，以及 review 的被审文本。感叹删除分支只在目标文本是告警、错误信息或状态提示时适用。
    trigger: |-
      分支一：文本含无必要的被动、名词化赘语（进行／作出／予以 + 动词）、过长的「的」字串、英语从句语序残留（「由于…的事实」）
      或直译连接词。
      分支二：目标文本是告警、错误信息或状态提示，且含情绪化感叹（「糟糕！」）。
    requires: |-
      分支一：在语义完全不变的前提下，改用中文技术写作的常规表达。
      分支二：删去该感叹。
      两支都取能去除缺陷的最小改动（§6 末段）。
    prohibits: |-
      缺陷不存在时以 R003 为名重写（§6 末段、R001）；任何改变 S 族不变量的修复；
      把自然的被动（突出受事、施事未知、施事已在同句给出）改成主动。
    exceptions: 被动的三种自然用法；S 族优先；不含该缺陷的文本不授权重写。
    fork: yes
    readings:
      - id: A
        reading: |-
          「情绪化感叹」的外延。
          A1：只指独立的感叹词或感叹句（「糟糕！」「哎呀」「太棒了！」），与示例同型。
          A2：也包括带情绪色彩的语气词（「啦」「呀」「哦」）、表情符号与叠用感叹号。
        behavior: 「上传好像失败了啦」：A1 保留「啦」（R001：无规则触发），A2 删去「啦」。
      - id: B
        reading: |-
          「目标文本是告警、错误信息或状态提示」中「目标文本」的所指。
          B1：被处理文档的类型（与 P002「目标文本是可执行步骤」、P005「目标文本是 agent 指令…」的用法一致）。
          B2：也包括文档内嵌的面向用户的错误信息字符串，例如 agent 指令中规定的回复语。
        behavior: 第 8(a) 题：B1 下不触发，引号内回复原样保留；B2 下删去引号内的「糟糕！」。
      - id: C
        reading: |-
          分支一的缺陷清单是封闭的还是示例性的。
          C1：封闭，只修列出的五类。
          C2：规则名「反译文腔」与 §7 第 6 步「去译文腔」表明清单只是示例，其他译文腔（「基于…」「对于…来说」
          「在…的情况下」、多余的「您」）也可以归因到 R003。
        behavior: C2 下可归因到 R003 的改动明显增多，R001 的约束力相应减弱。
    notes: |-
      未定义的判据：「过长的「的」字串」没有长度标准（「正常的中文多层定语不因长度或嵌套触发」写在 CTC-A003 而不在 R003）；
      「直译连接词」没有示例；「无必要的被动」只能从三种例外反推。这些是判据缺失，不完全算读法分叉，但会让不同执行者
      在同一句上改与不改不一致。

  - probe: "4. CTC-R001 与 CTC-R003 的关系：哪些编辑可以归因到 CTC-R003"
    level: CTC-R001 必须（约束全部规则的应用方式，横跨五层）；CTC-R003 应。
    scope: 所有改写与翻译任务；review 中 R001 的逐处归因就是 finding 的「规则」字段（§3 输出契约）。
    trigger: 任何一处改动。
    requires: |-
      每处改动都能归因到一条具体规则 ID，且该规则的触发条件确实满足；归因到 R003 的改动必须对应 R003 列出的缺陷，
      并且是去除该缺陷的最小改动（§6 末段：R002、R003 描述缺陷，不是改写许可）。
    prohibits: |-
      以「更清楚」「更专业」为由的等义替换；为体现工作量而改写；把多处不相关改动混在一起；
      借 §2 第 4 层「专业中文技术语体」做改动（§2「阶梯不授权改动」）。
    exceptions: 调用方授权本身构成归因（§3「调用方授权」）。
    fork: yes
    readings:
      - id: A
        reading: |-
          §7 第 6 步「去译文腔、去冗余主语、恢复话题链与连动结构（CTC-R002、CTC-R003）」的归属。
          A1：按两条规则的条文分配：去冗余主语、恢复话题链与连动结构属 R002（「逐句重复的主语」「被机械拆分的短句」），
          去译文腔属 R003。
          A2：括注是第 6 步整体的依据，恢复话题链与连动结构也可以归因到 R003。
        behavior: 同一改动的规则字段不同（R002 或 R003）。两条都是「应」，级别不变，只影响归因与 review 比对。
      - id: B
        reading: 同探针 3 的读法 C（缺陷清单封闭或示例性）。
        behavior: C2 下 R003 可归因的改动集合更大。
    answer: |-
      可归因到 CTC-R003 的改动（每项都须先确认缺陷存在，并且只改缺陷所在的最小片段）：
      1. 无必要的被动改为主动或无标记句。前提是施事已在来源中给出；被动用于突出受事、施事未知、施事已在同句给出时不改。
         施事未知而补出施事是 S002／A001 违规，不是 R003 改动。
      2. 去掉名词化赘语：「对配置进行修改」→「修改配置」，「予以删除」→「删除」。
      3. 拆解过长的「的」字串（无长度标准，见探针 3 notes）。
      4. 改正英语从句语序残留：「由于…的事实」→「由于…」。
      5. 替换直译连接词。
      6. 告警、错误信息或状态提示中删去情绪化感叹（「糟糕！」）。
      不能归因到 R003 的改动：
      - 口语或语体规范化（「先别切主」→「暂勿切换主库」，「没提交成功」→「提交失败」）：不在缺陷清单，§2 阶梯不授权；
      - 同强度换词（「好像」→「可能」）：没有规则触发，且 S003 下强度是否相同本身存疑；
      - 补主语、删重复主语、拆句与并句：R002／P001；
      - 术语统一：T001；排版：R006；
      - 展开四字格：§9 第 5 条禁止。
    notes: |-
      R001 的「不得做等义替换」与 R003 的「语义完全不变的常规表达」并不冲突：区分点在于是否存在 R003 列出的缺陷。
      所以 R003 的边界完全取决于缺陷清单的封闭性（读法 B），这是两者关系中唯一实质性的分叉来源。

  - probe: "5. §8 审阅流程第 2 步：规则 ID 怎样确定；同一缺陷能否引用两个不同的规则 ID"
    level: 流程规定（§8 本身没有规则级别；「确定唯一的规则 ID」「分列，不合并」「不另列原规则」按强制理解）
    scope: review 模式。
    trigger: 逐句定位到一处违规。
    requires: |-
      每条违规确定唯一的规则 ID；同一处触发多条规则时分列，不合并；
      条文写明转 A005 的三种情形（A003 无证据、L004 边界本身歧义、P002 无法确定）规则字段填 CTC-A005，不另列原规则；
      P002 finding 只针对来源或上下文能确定、却没有写出的部分；每条 finding 写六个字段，位置逐字引用。
    prohibits: 一条 finding 合并多个规则 ID；转出情形同时列原规则；没有规则 ID 的 finding；为显得周全而制造 finding。
    exceptions: 上述三种转 A005 情形。
    fork: yes
    readings:
      - id: A
        reading: |-
          「同一处触发多条规则」指同一缺陷同时违反多条规则（如删掉例外同时违反 CTC-S001 与 CTC-L001），
          应拆成每条规则一条 finding。依据：转出条款特意写「不另列原规则」，说明在其他情形下默认会另列。
        behavior: 同一缺陷可以通过两条 finding 引用两个不同的规则 ID。finding 计数与排序都受影响，ERROR 可能重复出现。
      - id: B
        reading: |-
          「同一处」指同一位置上的多个不同缺陷；一个缺陷只对应一条违规和一个 ID（「每条违规确定唯一的规则 ID」）。
          规则重叠时必须择一，但文本没有给出择一顺序。
        behavior: |-
          每个缺陷只有一条 finding，但不同审阅者可能选不同的 ID（S001 或 L001；A005、S002 或 R004；S003 或 R004），
          重叠规则级别不同时，严重级别也会随之不同。
    answer: |-
      我的读法是 A：先按触发条件确定被违反的规则；属于三种转出情形的填 CTC-A005；其余情形下，同一缺陷满足几条规则就分列几条，
      每条 finding 只带一个 ID。所以同一缺陷可以引用两个不同的规则 ID，但必须拆成两条 finding，不能在一条里并列。
    notes: |-
      不论取哪种读法，§8 都缺少重叠规则之间的优先序。这是探针 1 读法 B、C 与探针 6(b) 规则 ID 不确定的根源。

  - probe: "6. 缺失信息在 review 中的报告：(a)–(d)"
    level: 随所引规则而定：A005 必须 → ERROR；P002 应 → WARNING（风险字段指名不同动作时可升为 ERROR）。
    scope: review 模式，被审文档是 runbook，属于 strict 适用范围，采用 strict 的歧义阈值（§3 review）。
    trigger: 见各小题。
    requires: 每条 finding 一个规则 ID，写六个字段；转出情形填 A005（§8 第 2 步）。
    prohibits: 补出缺失项；没有规则 ID 的 finding；为显得周全而制造 finding（如 (c)）。
    exceptions: P002 倒数第二句（具体对象未细化）；P003 末句（非破坏性步骤缺成功判据不提出）。
    fork: yes
    readings:
      - id: A
        reading: (a) 中 `gateway.yaml` 足以确定「对应服务」是网关（探针 2 读法 A1）。
        behavior: 报 CTC-P002，按映射为 WARNING，可升为 ERROR。
      - id: B
        reading: (a) 中文件名到服务的映射属推断，不算可确定（探针 2 读法 A2）。
        behavior: 报 CTC-A005，ERROR。
      - id: C
        reading: (b)「一段时间」的规则 ID：A005（缺阈值）、S002（待确认第 5 类）、R004（无判据词）三者之一。
        behavior: A005 或 S002 → ERROR；R004 → WARNING。
      - id: D
        reading: (d) 前两步出现的两个命名空间是否算「多个候选」（探针 2 读法 B）。
        behavior: 算 → A005 ERROR；不算 → 不报告。
    answer:
      a:
        rule: CTC-P002
        severity: ERROR（映射为 WARNING，按 §8 唯一升级条件升为 ERROR）
        basis: |-
          P002 最后一句：「对应服务」不算写出对象，所以该步缺少对象。上文第 1 步修改的是 `gateway.yaml`，
          上下文提供了「这项配置属于网关」的证据，对象可以确定却没有写出，属于 P002 finding，不转 A005（§8 第 2 步）。
          「重启」会改变外部状态；风险字段可以指名不同动作：操作者重启了别的服务或没有重启网关，`gateway.yaml` 的修改不生效。
          满足升级条件，因此按 ERROR 报告。不是 CTC-A002：「对应」只有一个先行词。
          建议修改：「重启网关，使配置生效。」
          分叉：如果认为文件名不足以确定服务（读法 B），改报 CTC-A005／ERROR，并在问题字段写出「需要的信息：要重启的服务名」。
      b:
        rule: CTC-A005
        severity: ERROR
        basis: |-
          「一段时间」是执行所需的时长阈值，来源与上下文都没有给出，并且它把守的是一个不可逆操作
          （`cachectl decommission cache-07`）。A005 条文明列「缺少执行所需的参数、阈值」；§5 对同类的「多次」
          处理方式相同：保留原句，进「待确认」。
          不报 R004：「一段时间」不在 R004 列出的无判据词中，也不承担义务强度。不报 P003：来源给出了判据（「确认流量正常」），
          P003 只管判据的绑定与缺失。
          分叉：按「待确认」第 5 类的归属，规则 ID 也可以写 CTC-S002（同为 ERROR）；若把「一段时间」读作无判据词，
          则报 R004／WARNING。
          附带（题目未问）：「流量正常」同样没有判定标准，可单列一条 A005 finding。
      c:
        rule: 无（不报告）
        severity: 无
        basis: |-
          「数据库」「备用集群」是已写出的具体对象，只是没有细化到实例或路径；全文没有其他数据库或集群，不存在多个候选。
          按 P002 倒数第二句，既不算缺少对象或位置，也不按 A005 报告。
          P004 已满足：前置条件「备份数据库后」位于被守护动作（路由切换）同句前段。
          P003 不触发：缺成功判据的「备份」一步本身不是破坏性或不可逆操作，P003 末句要求两个条件同时满足（「且」）。
          如果全文只有这一处，返回「未发现违规」。
      d:
        rule: CTC-A005
        severity: ERROR
        basis: |-
          `api-v1` 是具体对象，但没有给出命名空间；第 1、2 步在 `staging` 与 `prod` 两个命名空间部署，
          上下文在命名空间层级给出了多个候选，P002 倒数第二句的豁免不成立，按缺少位置处理。
          来源无法确定删除范围（只删 `staging`、只删 `prod`，还是两者都删），P002 无法确定，转 A005；
          规则字段填 CTC-A005，不另列 P002（§8 第 2 步）。删除是破坏性操作，删错命名空间会导致不同动作。
          A005 本身就是 ERROR，不需要升级。
          分叉：如果「多个候选」只算针对本步明确列出的备选，则不报告；如果把「两处都删」视为可确定，则改报 P002。
    notes: |-
      四个小题里只有 (c) 在我的读法下没有分叉。(a) 与 (d) 的对照依赖两个未定义的门槛：「可确定」的证据强度，
      以及「多个候选」的范围。(b) 的规则 ID 取决于 A005 与 S002 的分工（探针 1 读法 B）。

  - probe: "7. 错误信息「糟糕！上传好像失败了啦，请稍后再试。」的 strict 改写"
    level: CTC-R003 应（分支二）；相关保护规则 S001、S002、S003 为必须；R001 为必须。
    scope: strict 模式（错误信息属于 strict 适用范围）；输出只返回改写后的正文，无前言。
    trigger: 目标文本是错误信息，且含情绪化感叹「糟糕！」，触发 R003 分支二；分支一的缺陷不存在。
    requires: 删去「糟糕！」；其余部分只在有规则触发时才改。
    prohibits: 改变「好像」承载的认识强度；改变「请」的言语行为；补出失败原因或等待时长；无规则触发的等义替换。
    exceptions: 无。
    fork: yes
    readings:
      - id: A
        reading: 「情绪化感叹」只指「糟糕！」这类独立感叹（探针 3 读法 A1）；「啦」是句末语气词，不在其内。
        behavior: 输出「上传好像失败了啦，请稍后再试。」
      - id: B
        reading: 「啦」（了＋啊）是带情绪色彩的感叹语气词，属于同一类情绪化感叹（探针 3 读法 A2）。
        behavior: 输出「上传好像失败了，请稍后再试。」
      - id: C
        reading: |-
          strict 的阈值最低，「稍后」缺少等待时长，按 A005／待确认第 5 类提出；
          对立读法认为用户执行「再试」不需要精确时长，不是执行所需信息。
        behavior: 前者在正文后追加「待确认」：`稍后 | 未给出重试前的等待时长 | 重试等待时长`；后者不追加。两者都不得填入具体数字。
    answer: |-
      规则要求的改动：
      - 删去「糟糕！」——CTC-R003 分支二（应，默认要求）。它对 S001 而言是纯修饰成分，删去不丢断言。
      允许的改动：
      - 删去「啦」：分叉（读法 A／B）。我取读法 A：R003 的触发词是「感叹」，示例是独立感叹词加「！」；文本没有把语气词纳入。
        触发与否不明确时，R001（必须）的「未触发任何规则的文本原样返回」是默认值，所以我保留「啦」。
      不允许的改动：
      - 删去「好像」或换成「可能」「疑似」：CTC-S003（认识强度不变）、§9 第 4 条（不得删除软限定词）；
        R003 永远低于 S 族。即使换成强度相近的词，也没有规则触发，违反 R001。
      - 「请稍后再试」→「须稍后再试」或删去「请」：CTC-S003（请求不得升格为义务）。
      - 「稍后」→「30 秒后」等具体时长：CTC-S002（来源未给的默认值与超时）、CTC-A005（不得补出缺失项）。
      - 补出失败原因（「网络异常」）、错误码或免责声明：CTC-S002。
      - 「再试」→「重试」、「上传好像失败了」→「上传失败」等措辞调整：CTC-R001（无规则触发的等义替换；后者还违反 S003）。
      - 补主语（「您的文件上传…」）：CTC-R002（不消歧的补充）、CTC-S002。
      输出（我的读法）：上传好像失败了啦，请稍后再试。
      输出（读法 B）：上传好像失败了，请稍后再试。
      「待确认」：我的读法不追加（读法 C 的分叉见上）。
    notes: |-
      读法 A 的输出保留了明显的口语卖萌语气，看起来与 R003 分支二的目的相悖；但仅凭条文，「感叹」不能确定覆盖语气词。
      这一处要靠作者写明边界才能消除分叉，例如把条文改成「情绪化感叹或语气词」，或明确排除语气词。

  - probe: "8. CTC-R003 是否触发：(a) agent 指令内嵌回复语；(b) 带猜测语气的告警"
    level: CTC-R003 应；相关保护规则 S001、S003、S005、S006 与 R001 均为必须。
    scope: |-
      strict 模式：(a) 是 agent 指令，(b) 是告警，两者都属于 strict 适用范围。
    trigger: |-
      分支二要求「目标文本是告警、错误信息或状态提示」且含情绪化感叹；分支一要求含所列的译文腔缺陷。
    requires: 触发时只删感叹，或只修所列缺陷。
    prohibits: 改变内嵌回复语的内容（若它属于指令所规定的内容）；改变猜测语气与因果强度；无规则触发的语体规范化。
    exceptions: R003 永远低于 S 族。
    fork: yes
    readings:
      - id: A
        reading: |-
          (a) 中「目标文本」指被处理文档的类型，即 agent 指令，不是错误信息；引号内是指令规定 agent 要说的话，属于指令内容
          （探针 3 读法 B1）。
        behavior: R003 不触发，全文原样返回。
      - id: B
        reading: |-
          (a) 中引号内是一条面向用户的错误信息；§4 明说「界面文案」不是受保护标记，规则触发时可以改写
          （探针 3 读法 B2）。
        behavior: 删去引号内的「糟糕！」，输出「…回复用户：「订单没提交成功，请稍后再试。」」。
      - id: C
        reading: |-
          (b) 中「吧」若被当作情绪化语气词而落入 R003，R003 会要求删除；但它同时承载认识强度，
          受 S003／S006 保护，而 R003 永远低于 S 族。
        behavior: 结论与「吧」不属于感叹的读法相同，即保留。只有忽略「吧」的猜测功能的执行者才会删它，那是 S006 违规，不是合法读法。
    answer:
      a: |-
        R003 不触发（我取读法 A）。整段是 agent 指令，不是错误信息，分支二的目标条件不满足；指令本身也没有分支一的缺陷。
        引号内的回复语是指令规定 agent 对用户说的内容（「回复用户：X」中的 X 是动作的对象）。删改它会改变 agent 被要求的行为，
        而且没有规则 ID 可以归因（R001）。不允许删改任何内容；`create_order` 是受保护标记（S005）。输出原样返回。
        分叉：读法 B 下可以删去引号内的「糟糕！」，并且只能删这一处；「没提交成功」「请稍后再试」在两种读法下都不得改
        （R001；「请」受 S003 保护）。
      b: |-
        R003 不触发。目标文本是告警，满足分支二的目标条件，但文中没有情绪化感叹；也没有分支一的缺陷
        （「把磁盘 IO 占满了」是自然的把字句，不是译文腔）。
        「是…吧」是猜测语气，承载认识强度（S003）。它给出的是推测的原因，因果强度相当于「可能导致」（S006）。
        删去「吧」，或改写成「由于夜间备份占满磁盘 IO，…」，会把推测升格为断言的唯一原因，违反 S003／S006。
        「先别切主」是暂时性禁止（S003 道义强度与言语行为；「先」限定时间范围），不得删改。
        把它规范成「暂勿执行主从切换」不是 R003 的缺陷修复，没有规则可以归因（R001）。
        `orders-db` 受保护（S005），「超过 30 秒」的数值与不含边界的算子不变（S004、L004）。输出原样返回。
    notes: |-
      (b) 还有一个与 R003 无关的潜在分叉：「先别切主」没有给出禁止何时解除（备份结束后？延迟回落到 30 秒以内后？）。
      在 strict 的最低阈值下，可以把它读作缺少执行所需的条件，按 A005／待确认第 5 类提出；也可以认为执行「暂不切主」本身
      不需要这一信息，提出反而是制造未决项。前一种读法会在正文后追加一条「待确认」，后一种不追加。
      我倾向不追加，但条文不足以确定。
