  source: '## 积压排查


    调度器内部维护一个任务队列（内存，容量上限 10000），用于暂存待分发的作业；跨服务通知走消息队列（Kafka topic `job-events`）。


    任务队列积压超过 8000 时，先确认消费者线程数是否被调低，再决定是否扩容调度器。

    消息队列积压通常与下游消费者故障有关，处理路径不同。

    '
  instruction: '压缩成值班速查条目，每条判断的适用对象保持不变。

    '
  invariants:
  - kind: terminology
    detail: '「任务队列」（调度器内存队列，上限 10000）与「消息队列」（Kafka topic `job-events`）

      是两个不同的系统对象。输出中每条判断必须仍绑定源文指定的那个对象：「积压超过 8000 →

      查消费者线程数 / 扩容调度器」只适用于任务队列；「积压与下游消费者故障有关」只适用于

      消息队列。任何一条挂到另一个对象上，判为失败。

      '
  - kind: reference
    detail: '压缩后不得出现无限定的「队列」：若输出中有「队列积压超过 8000」这类表述，

      值班无法判断该查内存队列还是 Kafka，判为失败。近义词替换同样禁止，

      例如把「任务队列」写成「作业队列」「调度队列」以外的名称，或写成「消息队列」。

      '
  - kind: token
    detail: '`job-events`、10000、8000 须逐字保留。

      '
  protected_tokens:
  - '`job-events`'
  - '8000'
  - '10000'
  authorized_token_changes: []
  invalid_transformations:
  - output: '- 队列积压超过 8000：先确认消费者线程数是否被调低，再决定是否扩容调度器。

      - 队列积压通常与下游消费者故障有关。

      '
