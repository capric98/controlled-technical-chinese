      逐条编号步骤、为每句补「调用方须／服务端将」等显式主语、或把「报表较大时」展开成

      「如果…那么…」的完整条件句并逐句拆行，判为把严格模式的显式化标准套用到标准模式

      （§6.2、§17.7）。

