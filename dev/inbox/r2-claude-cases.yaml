  task: rewrite
  mode: standard
  source: '## `confd` 运维须知


    - 修改 `upstream` 配置后须重启 `confd`；重启期间约 2 秒不可用。

    - 仅修改日志级别时执行重载（`kill -HUP`），连接不中断。

    - 每晚 02:00 生成一份备份并上传对象存储；集群内的三份副本用于在线容灾，不能替代备份。

    '
  invariants:
  - kind: terminology
    detail: '「重启」与「重载」在本文中是两个不同操作，源文已给出区分依据：重启约 2 秒不可用，

      重载（`kill -HUP`）连接不中断。输出不得把二者统一为其中之一，也不得互换。

      '
  - kind: terminology
    detail: '「备份」（每晚上传对象存储的离线拷贝）与「副本」（集群内在线容灾的三份数据）是两个不同

      对象，源文第三条明确写出「不能替代备份」。输出不得把「副本」改称「备份」或反之，

      也不得删除「不能替代备份」这一判断。

      '
  - kind: over-edit
    detail: '三条要点术语已一致且区分正确，不存在需要统一的术语问题。任何以「统一术语」为由的替换

      都判为失败。

      '
  - kind: token
    detail: '`confd`、`upstream`、`kill -HUP`、02:00 须逐字保留，「2 秒」「三份」的数值不变。

      '
  protected_tokens:
  - '`confd`'
  - '`upstream`'
  - '`kill -HUP`'
  - 02:00
  authorized_token_changes: []
  invalid_transformations:
  - output: '- 修改 `upstream` 配置后须重启 `confd`；重启期间约 2 秒不可用。

