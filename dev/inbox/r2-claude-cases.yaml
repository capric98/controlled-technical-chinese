- id: G-T-101
  category: terminology-consistency
  task: rewrite
  mode: strict
  source: '## 发布流程


    1. 新版本先以灰度发布上线，覆盖 5% 流量。

    2. 金丝雀发布期间每 5 分钟检查一次错误率。

    3. 小流量验证通过后，按 25%、50% 逐步放量。

    4. 全量发布后保留旧版本实例 24 小时，以便回滚。

    '
  invariants:
  - kind: terminology
    detail: '第 1、2、3 步中的「灰度发布」「金丝雀发布」「小流量验证」在本文中指同一个发布阶段

      （5% 流量的受控放量）。输出须在全文用同一术语指代该阶段；若输出中仍有两个及以上不同术语

      指代它，判为术语不一致。

      '
  - kind: terminology
    detail: '第 4 步的「全量发布」指 100% 放量，与上述阶段是不同概念。输出若把它也替换为统一后的

      灰度类术语（例如「灰度发布后保留旧版本实例 24 小时」），判为错误归并（§17.5）。

      '
  - kind: fact
    detail: '放量档位 5%、25%、50%、检查间隔 5 分钟、旧实例保留 24 小时的数值与单位不得增删或改动。

      '
  protected_tokens:
  - 5%
  - 25%
  - 50%
  - 24 小时
  authorized_token_changes:
  - 金丝雀发布
  - 小流量验证
  invalid_transformations:
  - output: '1. 新版本先以灰度发布上线，覆盖 5% 流量。

      2. 灰度发布期间每 5 分钟检查一次错误率。

      3. 灰度发布验证通过后，按 25%、50% 逐步放量。

      4. 灰度发布后保留旧版本实例 24 小时，以便回滚。

      '
    violated:
    - terminology
    - fact
    reason: '前三步统一是对的，第 4 步的「全量发布」被一并改成「灰度发布」，100% 放量阶段消失，

      读者会以为 5% 阶段结束后就可以下线旧实例。

      '
  - output: '1. 新版本先以灰度发布上线，覆盖 5% 流量。

      2. 金丝雀发布期间每 5 分钟检查一次错误率。

      3. 小流量验证通过后，按 25%、50% 逐步放量。

      4. 全量发布后保留旧版本实例 24 小时，以便回滚。

      '
    violated:
    - terminology
    reason: '原样返回。同一份发布流程里三个术语指同一阶段，新人无法判断是三个阶段还是一个阶段，

      严格模式下这是必须处理的问题。

      '
  over_edit_trap: false
  provenance: model-proposed-unreviewed
  notes: '一个案例内同时含「须统一」与「不得归并」，防止术语规则一刀切。

    '
