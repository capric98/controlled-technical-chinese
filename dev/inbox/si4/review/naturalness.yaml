# 编号说明：可读的三个文件都没有给出 F1…C1 与改动处的对应关系。
# 本文件按角色提示列出改动的顺序编号：
#   F1 frontmatter description；T1 §3 standard「记录级别」；T2 §6「明确边界」；
#   T3 CTC-A005 新句；T4 CTC-P003 合并授权；B1 CTC-R003 括注；
#   B2a CTC-R004 排除项；B2b §8 第 2 步括注；C1 §9 第 1 条示例。
# B2a/B2b 恰好对应同属 CTC-R004 排除项的一对改动，这与按顺序编号相吻合。
# 若编号与调用方的对应表不一致，以各项的 candidate_text 为准。
reviewer: naturalness
model: claude-opus-5-5
files_read:
  - dev/prompts/si4-naturalness.md
  - dev/inbox/si4/base/SKILL.md
  - dev/inbox/si4/cand/v1/SKILL.md
passages:
  - id: F1
    candidate_text: "……；上下文不足以确定的歧义只报告、不擅自消解；未触发规则的文本原样返回。"
    naturalness: 4
    quotes:
      - "「上下文不足以确定的歧义」：「确定」的宾语被省略了。字面上被「确定」的是「歧义」，实际要确定的是读法（§5「上下文能确定读法时」）或作者意图（CTC-A005）。读者能补出，但 description 是激活文本，贴合正文措辞更好。"
      - "「只报告、不擅自消解」：用顿号连接两个谓词短语，紧凑自然；比旧文「只报告不擅自消解」多一处停顿，更容易断读。"
      - "新增的限定语让描述与 §5 一致。旧文「歧义只报告不擅自消解」与 §5「上下文能确定读法时，按所触发的规则消歧」冲突，新文消除了这一冲突。"
    ambiguity:
      - "顿号前后的关系：两个谓词共用话题「上下文不足以确定的歧义」，是并列且互补的关系（报告，而不是消解）。「只」只管「报告」；即使读作管到两项，含义也相同。没有发现会导致不同行为的第二种读法。"
      - "「擅自」暗示经授权就可以消解。但 §3 的调用方授权清单不包括消歧，读者可能因此误以为调用方可以授权消歧。这是旧文已有的措辞，本次没有改动，只作记录。"
      - "描述只说「上下文」，CTC-A005 说「来源与上下文」。在中文技术语境中，「上下文」通常包括来源本身的前后文，不构成实际歧义。"
    over_control_risk:
      - target_text: "「重启 `api-gateway` 和 `auth-service`，然后检查它的日志。」"
        risk: "旧文可能让模型把上下文能确定的指代也报告出来（例如前文只提到一个服务时），新措辞减少了这种过度报告。反方向的风险是漏报：模型可能凭就近原则这类弱证据断定「它」指 `auth-service`，然后直接改写。描述本身没有写证据要求，靠正文 §5「所选读法必须有来源或上下文证据」兜底；「不足以确定」中「确定」的要求已经足够强，风险低。"
    equivalent_rewording: "上下文不足以确定读法的歧义只报告、不擅自消解"
    rewording_is_equivalent_because: "只是补出「确定」被省略的宾语。§5 正文写的是「上下文能确定读法时…」「上下文不能确定时…」，原文省略的宾语只能是「读法」（也就是 CTC-A005 的「作者意图」）。补出后，适用范围和处理方式都不变。"
    normative_vocabulary: ok

  - id: T1
    candidate_text: "S、L、T 三族原样生效。A、P 两族按其级别生效，歧义阈值更高：一种读法只有在普通技术读者会就此产生分歧时才算竞争读法。"
    naturalness: 5
    quotes:
      - "「记录级别」改为「级别」：删去了未定义的修饰语，与 §3 首句「全部规则按其级别生效」和 §6「级别由「级别」栏决定」用词一致，也不会再让人疑心「记录级别」是否另有所指。"
      - "「按其级别生效」是自然的技术中文表达。"
    ambiguity:
      - "「其」的先行词是「A、P 两族」，但级别属于单条规则，而不属于族（A003、P002、P003、P005 是「应」，其余是「必须」）。按字面读作「族的级别」不成立，读者会自然理解为各条规则的级别，实际歧义很小。"
      - "与前句「S、L、T 三族原样生效」放在一起时，「原样」与「按其级别」形成对照，可能被读作「A、P 两族在 standard 下不按原样生效，而按某种降低后的级别生效」。§3 首句已经写明模式不改变级别，这种读法与全文冲突，但对照效果来自句式本身。该句式旧文已有，不是本次改动引入的。"
    over_control_risk:
      - target_text: "API 文档：「先调用 `create_job` 再调用 `get_job`，它返回 202 时表示仍在排队。」"
        risk: "模型如果把「原样」与「按其级别」的对照理解为 A、P 两族在 standard 下减弱，就可能对「它」的两个先行词漏改、漏报（CTC-A002，必须）。§3 首句已经写明级别不变，因此风险低。"
    equivalent_rewording: "S、L、T 三族原样生效。A、P 两族同样按各条规则的级别生效，但歧义阈值更高：……"
    rewording_is_equivalent_because: "「各条规则的级别」只是把「其」的实际所指写出来。「同样」所表达的「S、L、T 也按级别生效」，§3 首句「三种模式下全部规则按其级别生效」已经断言过。「但」只指出差别在阈值，没有增删任何要求。这是可选改动，不改也不影响执行。"
    normative_vocabulary: ok

  - id: T2
    candidate_text: "**应** = 默认要求，可被更高优先级或规则条文写明的边界推翻"
    naturalness: 4
    quotes:
      - "「明确边界」改为「规则条文写明的边界」：把未定义的判据（「明确」由谁判断）换成可以查验的文本依据，符合「优先可测试的规则」。"
      - "「更高优先级」作光杆名词（省略了「的层」或「的规则」），略显紧缩；旧文也是这样写的，可以接受。"
      - "规则自身条文写明的边界是在限定适用范围，而不是推翻规则，所以「推翻」与这类边界搭配稍显别扭。用于跨规则的边界（如 CTC-R003「本规则永远低于 S 族」）时则贴切。"
    ambiguity:
      - "并列的结合域有两种读法。读法①：「[更高优先级] 或 [规则条文写明的边界]」（预期）。读法②：「[更高优先级或规则条文写明] 的边界」，即推翻者必须本身是一条「边界」，这会收窄第一项。读法②要求把「更高优先级」读作不带「的」的定语，可能性较低，但确实存在。"
      - "「写明的」的管辖范围：只是用「规则条文写明」修饰「边界」，不管到「更高优先级」（另见上条读法②）。"
      - "「规则条文」指这条「应」级规则自身的条文，还是任一规则的条文？例如 CTC-R002 条文中「属 CTC-P002，不在本规则禁止之列」是 R002 自身的边界。两种读法对现有规则的结果大多相同，但按后一种读法，一条规则可以凭另一条规则的文字被推翻，读者无法确定这是不是本意。"
    over_control_risk:
      - target_text: "工具描述：「失败时本工具不会自动重试，调用者需要自行重试。」"
        risk: "按旧文「明确边界」，模型可以凭直觉豁免；新文要求豁免有条文依据，这是改进，但也去掉了这条退路。CTC-R003 的条文没有为这种执行者对照写明边界，要保留「调用者」，模型只能援引「更高优先级」（CTC-A001，第 2 层）。如果按读法②，把「更高优先级」也理解为必须是写明的「边界」，模型找不到依据，就会删去「调用者」，造成过度改写。"
    equivalent_rewording: "**应** = 默认要求，可被更高优先级推翻，也可被规则条文写明的边界推翻"
    rewording_is_equivalent_because: "把两个推翻者分别放进两个谓词，排除了读法②。两项内容、「更高优先级」的不定所指和「规则条文」的所指都与原文相同，推翻依据既没有增加也没有收窄。不建议改成「可被规则条文写明的边界或更高优先级推翻」：前置以后，「规则条文写明的」可能管到「更高优先级」，而 CTC-R003 确实有「本规则永远低于 S 族」这种条文写明的优先级，会引入新的歧义。"
    normative_vocabulary: ok

  - id: T3
    candidate_text: "来源完全没有给出成功判据或验证方式的步骤，是否提出或报告按 CTC-P003 判断；给出的判据含义未定（「服务正常」）时仍按本规则。"
    naturalness: 3
    quotes:
      - "主题语「来源完全没有给出成功判据或验证方式的步骤」有 20 个字，后面接「是否提出或报告按 CTC-P003 判断」。主题—述题结构符合中文习惯，但「是否…按…判断」以一个是非问作主语，读起来像公文。"
      - "「是否提出或报告」：「提出」对应改写模式的「待确认」，「报告」对应 review 模式的 finding，原文没有点明这种对应，「或」可能被读作同义反复。"
      - "「仍按本规则」以介词短语收尾，缺少谓语动词；表中其他转交句写作「按 CTC-A005 处理」（CTC-R004）、「按 CTC-A005 报告」（CTC-P002）。"
      - "「完全没有给出」与「给出的判据含义未定」对照清楚，「完全」划出了边界，是这句话最有用的部分。"
    ambiguity:
      - "「是否提出或报告」有两种读法。读法①：是否（提出或报告），即按模式分别对应，这是预期读法。读法②：提出还是报告，二者选一，由 CTC-P003 决定。读法②不合常理，但字面上成立。"
      - "「按 CTC-P003 判断」管到哪里：只决定「是否」提出，还是也决定用哪条规则 ID、哪个严重级别报告？CTC-P003 的条文只写了「按「待确认」第 2 类提出」，没有涉及 review 模式。读者无法确定 review 中 finding 的规则字段该填 CTC-P003（应 → WARNING）还是 CTC-A005（必须 → ERROR）。§8 第 2 步只列了转入 CTC-A005 的情形，没有列这种从 CTC-A005 转出的情形。"
      - "中间情形：来源给出了判据但不完整（例如给了目标状态，没给等待时长）。这既不是「完全没有给出」，也不一定是「含义未定」，只能回到 CTC-A005 首句的「缺少执行所需的…判据」。结论是确定的，但要靠读者自己推出来，句子本身没有写。"
      - "第二分句中「给出的判据」没有写明是谁给出的：可以读作来源给出，也可以读作来源或上下文给出。"
    over_control_risk:
      - target_text: "SOP（strict）：「3. 打开监控面板，确认图表显示正常。4. 记录当前副本数。」"
        risk: "过度报告。第 3 步不是破坏性操作，判据「显示正常」含义未定，按第二分句仍走 CTC-A005（必须），一律进「待确认」；而一个完全没写判据的非破坏性步骤，按 CTC-P003 不提出。结果是判据越含糊，报告越多，CTC-P003 想避免的「成串的未决项」从这条路又回来了。这是语义设计问题，不是措辞问题，但「仍按本规则」这一措辞把这个后果写死了，建议设计方确认这是不是本意。"
      - target_text: "review 输入：「1. 执行 `DROP TABLE staging_orders`。2. 重新导入数据。」"
        risk: "错报或不一致。第 1 步不可逆，且后续步骤的安全性取决于它，按 CTC-P003 应当提出。但新句没有回答 review 模式下 finding 填哪个规则 ID：模型可能填 CTC-A005 报为 ERROR，也可能填 CTC-P003 报为 WARNING，同一输入在多次运行之间的严重级别会不一致。"
    equivalent_rewording: "某一步骤在来源中完全没有成功判据或验证方式时，是否提出或报告按 CTC-P003 判断；已给出的判据含义未定（「服务正常」）时，仍按本规则处理。"
    rewording_is_equivalent_because: "一、把 20 字的「的」字主题改为「…时」条件分句，所指的步骤集合不变。二、「已给出的」只是补出体貌，没有限定给出者，没有把范围收窄成「来源给出」。三、给「仍按本规则」补上谓语「处理」，与 CTC-R004「按 CTC-A005 处理」一致，处理方式不变。这一改写不解决上面规则 ID 与严重级别的歧义；要解决它，需要先确定意图，那已经不是等义改写。"
    normative_vocabulary: "ok（新句不含必须、应、可以、不得，转交措辞与全文一致；只是「仍按本规则」缺少谓语，见上）"

  - id: T4
    candidate_text: "来源把验证单独列为一个步骤时，该步骤保持独立；调用方授权合并步骤（明确要求合并，或限定步骤数）时可以并入相邻步骤，但合并后它必须仍是**由操作者执行**、位于被守护动作**之前**、且**逐项列全**原有判据的确认动作。"
    naturalness: 4
    quotes:
      - "「该步骤保持独立；调用方授权…时可以并入相邻步骤」：先写默认、再写例外，是自然的中文条文结构。删去「未获压缩授权则」后句子更短，也消除了「压缩授权」与 §3「CTC-P003 的合并步骤」之间的用词不一致。"
      - "括注「（明确要求合并，或限定步骤数）」插在「…时」条件分句中间，可读性尚可；但「合并步骤」与括注里的「合并」紧挨着重复，略显冗余。"
    ambiguity:
      - "括注修饰什么：它紧贴在「合并步骤」之后，读法①是说明什么算「授权」（预期）；读法②是解释「合并步骤」包括哪些操作（把「限定步骤数」也当成一种合并）。两种读法的执行结果基本相同：明确要求合并或者限定步骤数，都足以构成授权。"
      - "括注是穷尽列举还是举例？如果调用方说「如有需要可以合并步骤」，这是显式许可，不是「要求」。按穷尽读法，它不构成授权，该步骤保持独立；按举例读法，它构成授权。§3 的「显式授权」包括许可，因此两种读法会产生不同的输出。"
      - "「明确要求合并」的对象：只要要求合并任意步骤即可，还是必须涵盖这个验证步骤？调用方说「把第 4、5 步合并」时，一种读法允许顺带把第 2 步的验证并入第 3 步，另一种不允许。"
      - "「限定步骤数」没有区分上限是否低于现有步骤数。"
    over_control_risk:
      - target_text: "来源：「1. 停止 `ingest-worker`。2. 确认队列积压为 0。3. 迁移分区。」调用方：「整理成不超过 5 步的清单。」"
        risk: "过度改写。现有 3 步已经满足 5 步的上限，但字面上「限定步骤数」已经构成授权，模型可能依据 §3「授权本身即构成归因」把第 2 步并入第 3 步，做出不需要的合并。如果本意是只有在上限低于现有步骤数时才算授权，需要另作语义决定（不是等义改写）。"
      - target_text: "来源同上。调用方：「步骤有点碎，可以合并一下。」"
        risk: "漏改或过度改写。这句话算许可还是要求、合并范围包不包括第 2 步，取决于括注读作穷尽列举还是举例，也取决于「明确要求合并」的对象。"
    equivalent_rewording: null
    rewording_is_equivalent_because: "不提出改写。上述歧义只能靠确定意图来消除（括注是穷尽列举还是举例、上限是否必须低于现有步骤数），任何改写都会选定其中一种读法，因此不是等义改写。"
    normative_vocabulary: "ok（「可以并入」表示许可；「必须仍是」在「应」级规则内表达条件要求，与 §6 的说明一致）"

  - id: B1
    candidate_text: "口语腔：客套话（「麻烦您」）、语气词（「啊」「嘛」）、情绪化感叹（「哎呀！」）、口语填充（「一下」）、把读者当作谈话对象的引导（「这个工具可以帮你」；工具描述中以使用者作主语的「调用者可以…」同属此类）。"
    naturalness: 3
    quotes:
      - "括注里先给一个示例，再用分号接一个归类判断句「…同属此类」。括注从单纯举例变成了「举例＋立规则」，承载的内容比它所在的列表项还重。"
      - "「同属此类」的归类不贴切。「把读者当作谈话对象」指第二人称的对话口吻（「帮你」），而「调用者可以…」是第三人称，并没有把读者当作谈话对象，读者要停下来想它为什么「同属此类」。"
      - "下一句「不以使用者作句子主语（「调用者可以…」）」又出现同一个示例，相邻两句重复（属于自宿主检查中的「重复的规则」）。"
    ambiguity:
      - "「此类」的先行词：读法①是紧邻的「把读者当作谈话对象的引导」（预期）；读法②是整个「口语腔」类别。两种读法下「调用者可以…」都是 CTC-R003 的触发项，执行结果相同。"
      - "「以使用者作主语的「调用者可以…」」限定的是只含「可以」的句子，还是所有以使用者作主语的句子（「调用者必须…」「调用者需要…」）？「以使用者作主语」是宽口径，「调用者可以…」是窄示例，读者无法确定范围。"
    over_control_risk:
      - target_text: "工具描述：「失败时本工具不会自动重试，调用者需要自行重试。」"
        risk: "过度改写。按宽口径，「调用者需要…」也算缺陷；删去主语改成「失败时需要自行重试」后，本工具与调用者之间的执行者对照就消失了，违反 CTC-A001。CTC-R003 的层级低于第 2 层，理论上不应这样改；但新括注把这类句子从修复时应避免的写法提升为触发项，误触发的概率随之上升。"
      - target_text: "OpenAPI 参数描述：「调用方可以传入 `cursor` 继续翻页。」"
        risk: "过度改写。函数或参数描述是否算「工具描述」并不清楚。如果算，standard 模式 API 文档中常规的「调用方可以…」会被成批改写。"
    equivalent_rewording: "口语腔：客套话（「麻烦您」）、语气词（「啊」「嘛」）、情绪化感叹（「哎呀！」）、口语填充（「一下」）、把读者当作谈话对象的引导（「这个工具可以帮你」）、工具描述中以使用者作主语的「调用者可以…」。"
    rewording_is_equivalent_because: "把「调用者可以…」从「引导」的子类改为「口语腔」列表中的平级一项，它仍是 CTC-R003 的口语腔触发项，限定语「工具描述中以使用者作主语的」逐字保留。没有其他规则引用「引导」这个子类，所以归属层级的变化不影响任何触发或处理。改写去掉了括注里的分号和不贴切的「同属此类」。这里有意不补「写法」之类的中心语：补了会把窄示例推向宽口径，改变触发范围。宽口径与窄口径的问题，这一改写没有解决。"
    normative_vocabulary: ok

  - id: B2a
    candidate_text: "未定义的状态（「服务稳定」）、未给出具体值的次数或时长（「多次」「若干分钟」），以及给可测量指标设限而未给出阈值的程度说法（「延迟较高」）不是这类词，按 CTC-A005 处理。"
    naturalness: 3
    quotes:
      - "三个并列成分长度悬殊（6 字、11 字、22 字），读到第三项「给可测量指标设限而未给出阈值的程度说法」之后才出现谓语「不是这类词」，读者要记住一长串主语。"
      - "「设限而未给出阈值」读起来有自相矛盾之感：「设限」通常意味着已经给出界限值。实际要表达的是「用程度词充当界限，没有给出数值」，读者要靠示例「延迟较高」才能理解。"
      - "「程度」一词在同一句里有两种用法：本规则的对象是「表示程度、时机或裁量的词」，排除项又叫「程度说法」，等于说「程度说法不是表示程度的词」。读者必须自己区分义务的程度（「尽量」）和指标的量级（「较高」）。"
      - "「、…，以及…」的列举标点符合规范。"
    ambiguity:
      - "与本规则的正面清单重叠：「合理」「适当」明列在规则正文中，属于本规则的词；但「把连接池大小控制在合理范围内」「适当提高超时」同时也符合「给可测量指标设限而未给出阈值」。措辞没有说明哪一边优先。两种归属的输出不同：按 CTC-R004 处理时，§5 要求列出可能的强度并给出建议，review 中报 WARNING；按 CTC-A005 处理时不给建议，review 中报 ERROR。"
      - "「设限」的范围：只指上限或约束（「保持延迟较低」），还是也包括触发条件（「延迟较高时切换备用节点」）？示例「延迟较高」更像触发条件，与「设限」的字面意思不完全吻合。"
      - "谓语的管辖：「不是这类词，按 CTC-A005 处理」管全部三项（预期），还是只管紧挨着的第三项？第三项很长，前面又有「以及」，给了后一种读法可乘之机；旧文只有两项时没有这个问题。"
    over_control_risk:
      - target_text: "SOP：「把连接池大小控制在合理范围内；延迟较高时尽快扩容。」"
        risk: "错报或重复报告。「合理范围」可能归 CTC-R004（带建议），也可能归 CTC-A005（不带建议）；同一处还可能被两条规则各报一次，违背 §8 第 2 步「不另列原规则」的意图。「延迟较高」归 CTC-A005，「尽快」归 CTC-R004，模型要在一句话之内正确切分三处。"
      - target_text: "说明性文档（standard）：「该接口在高峰期延迟较高。」"
        risk: "过度报告。这是描述，不是规范条件，不在 CTC-R004 的适用范围内；但「延迟较高」与排除项的示例一字不差，模型可能按 CTC-A005 报告阈值缺失。「设限」一词本可以排除这种情形，但示例对模型的吸引力比定义强。"
    equivalent_rewording: "未定义的状态（「服务稳定」）、未给出具体值的次数或时长（「多次」「若干分钟」），以及为可测量指标设限却未给出阈值的程度说法（「延迟较高」），都不是这类词，按 CTC-A005 处理。"
    rewording_is_equivalent_because: "「给」换「为」、「而」换「却」都是同义虚词替换；加「都」和谓语前的逗号，只是写明谓语管辖全部三项（这本来就是原意），没有增删任何一项。「设限」和「程度说法」保持不变。如果把「程度说法」改成「定性说法」之类，虽然避开了与「表示程度…的词」撞词，但会把「延迟合理」这类正面清单里的词更明显地拉进排除项，改变边界，所以不属于等义改写。清单重叠的问题需要设计方作出决定。"
    normative_vocabulary: ok

  - id: B2b
    candidate_text: "规则条文写明转 CTC-A005 的情形（CTC-A003 无证据、CTC-L004 边界本身歧义、CTC-P002 无法确定、CTC-R004 排除的未定义状态、次数、时长与阈值），finding 的规则字段填 CTC-A005，不另列原规则；"
    naturalness: 3
    quotes:
      - "「CTC-R004 排除的…阈值」：CTC-R004 排除的不是「阈值」，而是「未给出阈值的程度说法」。阈值恰恰是 CTC-R004 在新写时要求给出的可观测触发条件（「阈值、状态或事件」）。这个标签把补救手段写成了排除对象。"
      - "「未定义状态、次数、时长与阈值」四项并列，「未定义」管到哪里不清楚。"
    ambiguity:
      - "「未定义」的管辖：读法①是只管「状态」，此时「CTC-R004 排除的阈值」不知所指；读法②是管全部四项，「未定义的次数、时长、阈值」大致对应 CTC-R004 原文，但 R004 用的是「未给出具体值」「未给出阈值」，不是「未定义」，两处用词不一致。"
      - "与旧文比较：旧文「未定义状态与次数、时长」用「与」分组；新文改成用顿号和「与」连接的四项平列，读法①和②都有了可能。"
    over_control_risk:
      - target_text: "review 输入（SOP）：「磁盘使用率过高时尽快扩容。」"
        risk: "错误转交。「尽快」是 CTC-R004 的典型词，但它的问题也可以说成「缺少时间阈值」。读者如果把括注理解为「凡是缺阈值的都转 CTC-A005」，就会把「尽快」也填成 CTC-A005、报为 ERROR；这样 CTC-R004 在 review 中几乎不会再出现，严重级别整体上调。正确结果是：「过高」归 CTC-A005，「尽快」归 CTC-R004。"
    equivalent_rewording: "（CTC-A003 无证据、CTC-L004 边界本身歧义、CTC-P002 无法确定、CTC-R004 中按 CTC-A005 处理的说法）"
    rewording_is_equivalent_because: "CTC-R004 条文中写明「按 CTC-A005 处理」的，正好是那三类排除项；R004 的另一项排除（限定观测事实的普通副词）写的是「不受本规则限制」，不转 CTC-A005。所以这个指称不多也不少。它直接借用 R004 自己的转交措辞，去掉了误导性的「阈值」标签，以后 R004 增删排除项时这里也不必同步修改。如果希望保留可以直接读懂的枚举，可以改用 R004 的原词：「CTC-R004 排除的未定义状态、未给出具体值的次数或时长、未给出阈值的程度说法」，同样等义，只是更长。"
    normative_vocabulary: ok

  - id: C1
    candidate_text: "「用户打开控制台。用户点击设置。用户修改端口。」应写成「用户打开控制台后，点击设置修改端口。」"
    naturalness: 5
    quotes:
      - "旧文「「…」写成「…」」没有情态词，放在「不得做的事」一节里，可以读作描述性的「（被）写成」，方向不明，甚至可能把示范句误读成反例。补上「应」以后方向清楚了。"
      - "「X 应写成 Y」是自然的规范示例句式。"
    ambiguity:
      - "§6 把「应」定义为可被推翻的默认要求。放在示例里，读法①是「这是 CTC-R002（应）触发时的示范改法」；读法②是「这是唯一正确的写法」。读法②会把示例当作固定目标，「用户打开控制台，点击设置，修改端口。」同样合规，按读法②却可能被判为不合规。实际影响小。"
    over_control_risk:
      - target_text: "「运维人员停止主库。开发人员切换连接串。运维人员启动备库。」"
        risk: "过度改写。如果模型把示例当模板机械套用，可能在多个执行者交替出现时删掉主语。CTC-R002 已经写明「多执行者交替出现时重复主语有消歧价值」，括注也引了 CTC-A001，因此风险低。"
    equivalent_rewording: null
    rewording_is_equivalent_because: "不需要改写。"
    normative_vocabulary: "ok（「应」与示例所引 CTC-R002 的级别「应」一致；条目标题中的「不得」针对的是「要求每句都有显性主语」这种做法，两者不冲突）"

overall_note: "九处改动都没有引入译文腔或口语腔，多数比 base 更清楚：F1 与 §5 对齐；T1、T2 换掉了未定义的修饰语；T4 统一了「合并授权」的用词；C1 补出了示例的方向。按优先级排序的问题：（1）B2b 的「阈值」标签把 CTC-R004 的补救手段写成了排除对象，可能导致 review 把「尽快」这类 R004 典型词错误地转给 CTC-A005 并报 ERROR；已给出等义改写，建议采纳。（2）B2a 的第三项与 R004 正面清单中的「合理」「适当」在可测量指标上重叠，「程度」一词还在同句里两用；这不是措辞能单独解决的问题，需要设计方决定归属。（3）T3 句子偏重，而且没有说明走 CTC-P003 路径时 review 中的规则 ID 和严重级别；第二分句让含义未定的判据不论步骤是否关键都必须报告，可能把 CTC-P003 想避免的成串未决项重新带回来，需要确认是否为本意。（4）T4 括注是穷尽列举还是举例、「限定步骤数」在上限已经满足时是否算授权，这两点会导致漏合并或多合并；需要确定意图，没有等义改写。（5）B1 括注里的分号和「同属此类」读起来别扭，而且与下一句重复；已给出等义改写（改为平级列表项），但宽口径与窄口径的问题仍待决定。（6）T2 的并列结合域有一种低概率的错误读法；已给出把两个推翻者分开写的等义改写。本审阅只就措辞提出意见，没有改变任何规则的级别、触发条件、要求、例外或不变量；标为「需要设计方决定」的各项都不是等义改写，不应以措辞修改的名义合入。"
