# 冷读反解码（第二轮，针对 v3）。
# 运行环境自动注入了 AGENTS.md／CLAUDE.md；未主动读取，也未用于推断技能意图。
reviewer: cold-decoder
model: claude-opus-5-5
files_read:
  - dev/prompts/si4-decode-v3.md
  - dev/inbox/si4/cand/v3/SKILL.md
probes:
  - probe: 1. 检查或确认步骤缺少判据时的处理（runbook a–d；「多次」「升级」）
    level: |
      CTC-A005「必须」：末句「检查或确认步骤没有给出判据或判据含义未定……而没有破坏性或不可逆操作取决于它的结果时，不提出、不报告（CTC-P003）」是该条触发的边界。
      CTC-P003「应」：末句「来源未给出成功判据时：只有当该步是破坏性或不可逆操作、且后续步骤的安全性取决于它是否成功，才按「待确认」第 2 类提出」。
      CTC-R004 把「未定义的状态」「未给出具体值的次数或时长」转交 CTC-A005。
    scope: |
      改写（strict，runbook 属 strict 适用范围）与审阅（review，按被审文档类型取 strict 阈值）。
    trigger: |
      (1) 检查或确认步骤没有判据，或判据含义未定（A005 末句）；
      (2) 某一步来源未给出成功判据（P003 末句）。
      两者的豁免条件写法不同：A005 看「是否有破坏性或不可逆操作取决于这一检查的结果」；P003 看「缺判据的这一步本身是否破坏性或不可逆，且后续步骤的安全性取决于它是否成功」。
    requires: |
      - 检查或确认步骤缺判据或判据含义未定，且有破坏性或不可逆操作取决于其结果：豁免不成立，回到 A005 主句——保持原表述，在「待确认」中给出位置、缺失项与所需信息；review 报 CTC-A005，ERROR。
      - 来源未给出成功判据的那一步本身是破坏性或不可逆操作，且后续步骤的安全性取决于它是否成功：按「待确认」第 2 类提出（CTC-P003）；review 报 CTC-P003，WARNING，风险字段指名操作者因此会做出的不同动作时可以报 ERROR（§8 唯一的升级）。
    prohibits: |
      补出判据、阈值或观察时长（CTC-S002；A005「不得补出缺失项」）；为没有破坏性或不可逆后续的检查步骤生成「待确认」或 finding；把检查步骤改写成状态描述（P003）。
    exceptions: |
      检查或确认步骤缺判据而没有破坏性或不可逆操作取决于其结果：不提出、不报告（A005 末句）。非破坏性步骤缺成功判据：不提出（P003 末句「其余步骤缺少判据不提出」）。
    fork: yes
    readings:
      - id: A
        reading: |
          (c) 归 CTC-P003：第 1 步删除列，是破坏性且不可逆的操作，来源没有给出成功判据；第 2 步「切回」写流量以迁移完成为前提。
          (d) 归 CTC-A005：确认步骤的判据「服务正常」含义未定，「观察一段时间」没有给出时长，而不可逆的 `nodectl destroy node-3` 取决于这一确认，A005 末句的豁免不成立。
        behavior: |
          (c) 进「待确认」一行；review 报一条 CTC-P003，默认为 WARNING。
          (d) 进「待确认」两行；review 报两条 CTC-A005，ERROR。
      - id: B
        reading: |
          (c) 也落入 A005 主句「缺少执行所需的参数、阈值、接收方、判据」。可能只报 A005，也可能按 §8「同一处触发多条规则时分列」把 A005 与 P003 都报出来。
        behavior: (c) 的严重级别变为 ERROR，或者同一处出现两条 finding。
      - id: C
        reading: |
          (c) 不提出：「后续步骤的安全性取决于它是否成功」须由来源支撑，而来源没有写出切回写流量以迁移成功为前提；推断这层依赖本身就是替作者做决定。
        behavior: (c) 没有「待确认」，也没有 finding，按 (a) 处理。
      - id: D
        reading: |
          (d) 不提出：A005 末句以「（CTC-P003）」收尾，读者因此把 P003 末句当作所有缺判据情形的统一门槛。确认步骤本身不是破坏性或不可逆操作，落入「其余步骤缺少判据不提出」。
        behavior: (d) 没有「待确认」，也没有 finding。在 destroy 之前的检查最需要报的时候反而沉默，是风险最高的读法。
      - id: E
        reading: |
          (d) 第 1 步「摘除」另按 P003 提出：摘除改变集群状态，destroy 的安全性取决于摘除是否成功。
        behavior: (d) 多一行「待确认」，或多一条 CTC-P003 WARNING。
    answer:
      a: |
        strict：原文原样返回，没有「待确认」。review：没有 finding，返回「未发现违规」。
        依据：A005 末句。第 3 步「检查 `app` 的运行情况」没有判据，但它是最后一步，没有破坏性或不可逆操作取决于它的结果。第 2 步 `systemctl reload app` 不是破坏性或不可逆操作，按 P003 末句「其余步骤缺少判据不提出」处理。
      b: |
        strict：原文原样返回，没有「待确认」。review：没有 finding。
        依据：「确认 `app` 运行正常」属于判据含义未定，A005 末句举的例子「确认无异常」与它同类。它也是 R004 所列的「未定义的状态」，但 R004 只是把它交给 A005 处理，A005 末句的豁免随之适用。§8 第 2 步只规定已有 finding 时规则字段填 A005，并不创造 finding。
      c: |
        strict：正文原样返回，追加
          待确认
          - 第 1 步 `migrate apply 0051` | 未给出迁移成功的判据，第 2 步切回写流量取决于迁移是否成功 | 判定迁移成功的方式
        review：一条 CTC-P003，WARNING。风险字段如果指名「操作者会在迁移失败或未完成时仍把写流量切回 `users-api`」，可以按 ERROR 报告。
        依据：P003 末句「只有当该步是破坏性或不可逆操作、且后续步骤的安全性取决于它是否成功，才按「待确认」第 2 类提出」；「待确认」第 2 类「来源从未给出的成功判据（CTC-P003）」。A005 末句不适用，因为这里没有检查步骤。P004 不触发：来源没有给出前置条件，规则写明「来源没有给出条件时不得虚构」。
      d: |
        strict：正文原样返回，追加
          待确认
          - 观察一段时间 | 未给出观察时长 | 观察时长
          - 确认服务正常 | 「正常」没有判据，而 `nodectl destroy node-3` 取决于这一确认 | 判定服务正常的指标与阈值
        review：两条 CTC-A005，ERROR。
        依据：A005 末句的条件「没有破坏性或不可逆操作取决于它的结果」不成立，豁免失效，回到 A005 主句「缺少执行所需的……判据时：保持原表述，并在「待确认」中给出……」。R004 写明「未定义的状态（「服务稳定」）、未给出具体值的次数或时长（「若干分钟」）……按 CTC-A005 处理」。§8 第 2 步规定规则字段填 A005，并按 A005 定级。P004 已满足，条件位于 destroy 同句的前段。第 1 步「摘除」不另行提出：它不是破坏性或不可逆操作，第 2 步的确认已经承担它的校验。
      多次与升级: |
        不受这条限制影响。这条限制只管检查或确认步骤的判据（A005 末句）和步骤的成功判据（P003 末句）。「多次」是未给出具体值的次数（R004 → A005）；「升级」缺少接收方与方式（A005 主句「缺少执行所需的……接收方」）。§5 明文规定「保留原句，逐项进「待确认」（§3 示例前两行）」。review 中两处各报一条 CTC-A005，ERROR。
    notes: |
      - 驳回 B：P003 是成功判据的专门规则，「待确认」第 2 类明确标为 CTC-P003，§8 第 2 步转 A005 的清单里也没有 P003。驳回 C：「切回」说明写流量是为迁移而切走的，这是对既有文本的读取，不是补写。驳回 D：P003 末句管的是「来源未给出成功判据」；(d) 给出了判据「服务正常」，只是含义未定，正是 A005 末句「判据含义未定」的情形。驳回 E：摘除可以撤回，不是 P003 所说的破坏性或不可逆操作。
      - 分叉的来源是 A005 末句与 P003 末句。两句各自设定豁免条件，指向互补的两种结构：检查步骤守护破坏性动作，和破坏性步骤本身缺判据。但文本没有说明两者互补；A005 末句又以「（CTC-P003）」收尾，暗示 P003 是统一门槛，读法 D 由此产生。
      - 严重级别不对称：(c) 是破坏性步骤完全没有成功判据，走 P003「应」，默认 WARNING；(d) 是守护破坏性步骤的判据含义未定，走 A005「必须」，ERROR。完全缺失的判据反而比含义未定的判据级别低。
      - §8 的升级用的是「可以」，属于许可：条件成立时报不报 ERROR 由审阅者自行决定。两个审阅者对 (c) 可能给出不同的严重级别。
  - probe: 2. CTC-R004 与 CTC-A005 的边界（五步 SOP 的审阅）
    level: CTC-R004「应」→ WARNING；CTC-A005「必须」→ ERROR。
    scope: review 模式。SOP 属 strict 适用范围，用 strict 的歧义阈值。
    trigger: |
      R004：规范性指令的判定条件由「尽量」「尽可能」「尽快」「最好」「适当」「必要时」「视情况」「合理」等表示程度、时机或裁量的词承担。
      R004 明文转给 A005 的三类：未定义的状态；未给出具体值的次数或时长；用程度词描述运行指标而未给出阈值的触发条件（「延迟较高时」）。
      A005 主句：缺少执行所需的参数、阈值、接收方、判据。
    requires: |
      R004：改写时不补判据，在「待确认」中提出，并按 §5 列出两种以上强度、给出建议；review 报 CTC-R004，WARNING，风险字段指名操作者的不同动作时可以报 ERROR。
      转给 A005 的说法：review 规则字段填 CTC-A005，不另列 R004（§8 第 2 步），按 A005 定级，即 ERROR。
    prohibits: |
      在建议修改中替作者给出具体阈值或强度（R004「改写时不得补出来源没有的判据」；§5「不得把它替换为具体强度或具体阈值」）；对转为 A005 的同一处再列一条 R004。
    exceptions: |
      目标文档中限定观测事实的普通副词（「该接口通常在 100 ms 内返回」）不受 R004 限制。
    fork: yes
    readings:
      - id: A
        reading: |
          第 3 步「适当的值」归 CTC-R004：「适当」明列在 R004 词表中，而 `db.pool.max` 的目标值不属于三类排除项中的任何一类——它不是状态，不是次数或时长，也不是运行指标。
        behavior: review 报 CTC-R004，WARNING，满足条件时可以升级为 ERROR。strict 进「待确认」；该处不承担义务强度，第四栏省略。
      - id: B
        reading: |
          第 3 步归 CTC-A005：R004 的触发对象是「判定条件」，这一步的判定条件是 `pool_exhausted` 告警，可以观测；「适当」修饰的是动作参数，属于 A005 主句「缺少执行所需的参数」。与「未给出具体值的次数或时长」转 A005 同理。
        behavior: review 报 CTC-A005，ERROR。
      - id: C
        reading: 第 3 步同时触发 R004 与 A005，按 §8「同一处触发多条规则时分列」各报一条。
        behavior: 同一处出现 R004 WARNING 与 A005 ERROR 两条 finding。
      - id: D
        reading: |
          第 1 步另有一处：「扩容 `gateway`」没有给出扩容幅度。这是缺少执行所需的参数，按 A005 主句报告；P002 的豁免只列了实例、节点、环境、路径与命名空间，不包括数量。
        behavior: 第 1 步多一条 CTC-A005 ERROR。
      - id: E
        reading: 扩容幅度不报：步骤已写出动作与对象，按 P002 豁免的精神处理，报告它属于「为显得周全而制造 finding」。
        behavior: 第 1 步只报「明显上升」一条。
    answer: |
      1.「请求量明显上升时」→ CTC-A005，ERROR。依据：R004「用程度词描述运行指标而未给出阈值的触发条件（「延迟较高时」）……按 CTC-A005 处理」——请求量是运行指标，「明显」是程度词；再按 §8 第 2 步填 A005、按 A005 定级。另外，「扩容 `gateway`」未给出幅度，我采用读法 D，报一条 CTC-A005，ERROR，依据是 A005 主句的「参数」。
      2.「尽快」→ CTC-R004，WARNING。依据：R004 词表中有「尽快」。风险字段如果指名操作者会拖延通知，可以报 ERROR。「通知值班组」已给出接收方，不报。
      3.「适当的值」→ 采用读法 A，CTC-R004，WARNING。依据：R004 词表中有「适当」，排除项不覆盖配置参数的目标值；§8 第 2 步只把「CTC-R004 中按 CTC-A005 处理的说法」改填 A005。风险字段写明「操作者会把上限调到不同的值」时可以报 ERROR。
      4.「磁盘占用偏高时」→ CTC-A005，ERROR。依据同第 1 步：磁盘占用是运行指标，「偏高」是程度词。P004 已满足，条件在「清理」之前。
      5.「必要时」→ CTC-R004，WARNING，可以升级的条件同第 2 步。依据：R004 词表中有「必要时」；§5 规定情态强度的模糊按 R004 处理。
    notes: |
      - 读法 A 与 B 的分歧在于 R004「判定条件」的范围：是「何时、是否执行」的条件，还是「如何判定合规」的条件。R004 的规则名「规范可判定」支持后者，A005 主句点名的「参数」支持前者。§5 为 R004 规定的「列出两种以上强度」对参数值没有可填的内容，这是读法 B 的旁证。
      - 词表是开放类（「等」）。「明显」「偏高」本身也是程度词，但它们描述运行指标，所以 R004 的第三类排除项更具体，优先适用。第 1、4 步因此不构成分叉。
      - 第 2、5 步的升级是许可，不是要求，不同审阅者可能给出 WARNING 或 ERROR。
  - probe: 3. CTC-R003 对工具描述与其他文本的作用
    level: CTC-R003「应」，位于第 4 层，「本规则永远低于 S 族」；CTC-R001「必须」。
    scope: |
      改写任务：a–d 按调用方指定为 standard，e 为 strict。§3 把工具描述归入 strict 适用范围，但调用方指定的模式优先于 §1 的推定；模式只影响歧义阈值，不影响 R003。R003 中关于使用者作主语的条款只作用于「工具描述」。
    trigger: |
      文本含译文腔或口语腔。口语腔包括「把读者当作谈话对象的引导（「这个工具可以帮你」）」，以及「工具描述中以使用者作主语陈述功能的句式（「调用者可以…」）」。
    requires: |
      工具描述中以使用者作主语陈述功能时，改为直接陈述功能（「获取…」「用于…」），不以使用者作句子主语；修复取能去除缺陷的最小改动（R 族表后的说明）。
    prohibits: |
      改变情态强度与言语行为类型（S003），例如把许可改成指令；改变量化与论域（S007）；删除条件或适用边界（L001、S001）；在缺陷不出现的地方改写（R001；R 族表后「描述的是缺陷，不是改写许可」）。
    exceptions: |
      被动用于突出受事、施事未知或施事已在同句给出时，属于自然的技术表述。口语禁止改作「切勿」，不改作「不得」「禁止」。
    fork: yes
    readings:
      - id: A
        reading: (c) 以使用者作主语的分句陈述的是调用权限，不是功能，R003 不触发，原样返回。
        behavior: 输出「只有管理员账号可以调用此工具，用于重置用户密码。」
      - id: B
        reading: (c) 整句是「管理员账号调用此工具，用于重置密码」，即以使用者作主语、借目的分句陈述功能，触发 R003。
        behavior: 输出「用于重置用户密码，只有管理员账号可以调用。」语义保持，但多了一处重排。
      - id: C
        reading: (e) 在 agent 指令里用「你」称呼 agent 是该文体正常的受话方式；「可以」授予许可，受 S003 保护。原样返回。
        behavior: 输出「你可以调用 `refund_order` 为用户退款。」
      - id: D
        reading: (e)「你可以…」算作「把读者当作谈话对象的引导」，触发 R003。
        behavior: |
          输出「可以调用 `refund_order` 为用户退款。」只去掉「你」，没有可归因的缺陷。更糟的输出是「调用 `refund_order` 为用户退款。」，把许可改成了指令，违反 S003。
      - id: E
        reading: (d) 开发者指南的读者就是开发者，「开发者可以…」被视同使用者作主语的句式或谈话式引导。
        behavior: 输出「`--dry-run` 可以预览迁移将要执行的 SQL。」之类，这是 R001 不允许的改动。
      - id: F
        reading: |
          P005：(a)(b)(c) 只陈述功能，(e) 只授予许可，都没有写出使用时机。改写时「来源未给出的……使用限制不得补写，在「待确认」中提出」，因此每处都要追加「待确认」（第 3 类）。
        behavior: 每处正文之后多出「待确认」小节。
    answer: |
      (a) R003 要求这项编辑（应）。输出「批量删除过期会话，单次最多 1000 条。」删去的「通过这个接口，调用者可以」正是规则点名的「调用者可以…」句式。「单次最多 1000 条」按 S004、L004 原样保留。改作「用于批量删除过期会话，单次最多 1000 条。」同样合规。
      (b) R003 要求这项编辑（应）。输出「把 Markdown 渲染成 HTML。」（「用于把 Markdown 渲染成 HTML。」同样合规）。Markdown、HTML 的拼写不变（§4）。
      (c) 不做编辑，原样返回「只有管理员账号可以调用此工具，用于重置用户密码。」（读法 A）。功能已经由「用于」直接陈述。以使用者作主语的分句陈述的是调用权限，属于 P005 要求保留的适用边界，不是 R003 点名的缺陷。「只有…可以」受 S003（许可）、S007（「只有」限定论域）与 L002 保护。R001：没有规则触发，不改。
      (d) 不做编辑，原样返回。R003 关于使用者主语的条款限定在「工具描述中」。开发者指南中第三人称的「开发者可以…」不是把读者当作谈话对象的引导，规则的示例是第二人称「帮你」。这里的「可以」是 S003 保护的许可或可能。
      (e) 不做编辑，原样返回「你可以调用 `refund_order` 为用户退款。」（读法 C）。在 agent 指令中以「你」称呼 agent 是文体本身的受话方式。「可以」是授予许可的言语行为：改成祈使句会把许可改成指令，违反 S003，而 R003 低于 S 族；只删「你」则没有可归因的规则（R001）。
      读法 F 不采用：(a)(b)(c)(e) 都写出了具体功能，具体的功能陈述本身就是使用时机。P005 要求进「待确认」的，是「用于处理相关请求」这类不含触发条件的描述，以及来源确有缺口的能力、参数上限或使用限制。
    notes: |
      - (a)(b) 删去「调用者可以」「开发者可以」时，「可以」随之消失。按 R003 自己的归类，这类句式是「陈述功能」，不是道义许可，所以不违反 S003。如果读者把这里的「可以」读作许可，就会认为 R003 必须让位于 S003、不应改动，这会产生另一个分叉；R003 正文已经点名这种句式，压低了这种读法的可能。
      - (c)(e) 是本探针的主要分叉点：R003 的「不以使用者作句子主语」脱离前半句「陈述功能」的限定、被泛化时，会误伤权限分句和 agent 指令中的受话人称。
      - 读法 F 对 strict 文本的影响较大：如果每份工具描述都追加「待确认」，正好产生 P003 末句想避免的成串未决项。P005 没有写明这一门槛。
  - probe: 4. §6「应」级定义：可被什么推翻；「规则条文写明的」修饰哪些成分
    level: 元规则（§6 级别定义）。
    scope: |
      全部「应」级规则：CTC-A003、P002、P003、P005、T001、R002、R003、R004、R005。
    trigger: 一条「应」级规则被触发，同时另有考量与之冲突。
    requires: 默认执行该要求。
    prohibits: |
      以定义所列两类之外的理由不执行，例如模型对自然度的偏好或「改动不值得」的判断。前提是把推翻来源的清单读作穷尽。
    exceptions: |
      (1) 更高优先级；(2) 规则条文写明的边界。原文：「可被更高优先级推翻，也可被规则条文写明的边界推翻」。
    fork: yes
    readings:
      - id: A
        reading: |
          「更高优先级」指 §2 五层阶梯中更高的层，含第 1 层语义不变量。同层冲突按 §2「同层并列」保留来源已有的形式。
        behavior: |
          第 2 层的「应」（A003、P002、P003、P005、R004）不会被第 3 层的「必须」（T002）推翻，因为 §2 规定「低层不得覆盖高层」。同层的「必须」不算「更高」。
      - id: B
        reading: 「更高优先级」指更高的规范级别，即任何「必须」规则，不论它在哪一层。
        behavior: |
          T002（第 3 层「必须」）可以推翻 P002、A003（第 2 层「应」）；同层中 A005 可以推翻 P002，P001 可以推翻 P003。
      - id: C
        reading: 「更高优先级」还包括调用方的显式指令，即任务层级的上下文（§1）。
        behavior: |
          「保持原措辞，只修术语」这类调用方要求可以关闭 R003、R002 等「应」级默认要求。在 A、B 读法下，调用方只能做 §3「调用方授权」列出的事项。
      - id: D
        reading: 推翻来源只是举例，不是穷尽，类似 RFC 的 SHOULD：有正当理由即可偏离。
        behavior: 模型可以凭自身判断跳过「应」级编辑，例如探针 3 的 (a)。
    answer: |
      采用读法 A，推翻来源清单为穷尽。依据：§2 的标题就是「优先级」，并写明「低层不得覆盖高层」；R003 的「本规则永远低于 S 族」是这一定义的实例。「默认要求」后面紧跟两类具名的推翻来源，没有留下其他口子。
      「规则条文写明的」只修饰「边界」。两个推翻来源由「可被……推翻，也可被……推翻」分成两个并列分句，「更高优先级」不受这个定语限制，这一点没有分叉。
      「规则条文」我读作 §6 中任何规则的条文，包括 CTC-A005 末句为 CTC-P003 写明的边界，以及 R 族表后「CTC-R002 与 CTC-R003 描述的是缺陷，不是改写许可」一段，不限于该规则自己的单元格。
    notes: |
      - 读法 A 下有一个文本没有给出口的死锁：第 2 层「应」与第 3 层「必须」如果真的冲突，T002 是硬性要求、不可推翻，又不得覆盖高层。最接近的处理是 §2「第 1 层不可达」（不改写、进「待确认」），但那条只针对第 1 层。实际文本中这类冲突罕见，因为 P002 只写出可确定的部分。
      - 「规则条文」指本条单元格还是任何规则的条文，有一个小分叉。P003 自己的单元格里有与 A005 末句近似的豁免，所以两种读法的行为差异很小。
      - 调用方能否关闭「应」级要求，文本没有写明（读法 C）。§3 只列出调用方可以放开的「本来禁止的改动」，没有说调用方能否压下「应」级要求。
      - 文本已经明确，不构成分叉：规则正文中的「必须」「不得」不改变级别。例如 P003 的「「直到…为止再继续」必须仍是继续的前提」仍属「应」级，review 中为 WARNING（可以按条件升级）。
  - probe: 5. frontmatter description 与 §5：上下文能确定读法的歧义怎样处理；二者是否一致
    level: |
      description 是激活用的概述，不设级别。§5 是规范：上下文能确定时「所选读法必须有来源或上下文证据」；消歧本身的级别随所触发的规则而定（A001、A002、A004「必须」，A003、P002「应」）。
    scope: 全部任务与模式；歧义阈值按 §3 的模式选取。
    trigger: 文本存在竞争读法或操作未定。strict 只要存在一种在本文档语境下可执行、且导致不同动作的读法即算；standard 要求普通技术读者会就此产生分歧。
    requires: |
      上下文能确定读法：按所触发的规则消歧（CTC-A001–A004、CTC-P002 等），所选读法须有来源或上下文证据，改动归因到该规则 ID（R001）。
      上下文不能确定：按 CTC-A005 保持原表述，进「待确认」；review 中作为一条 finding，按所引规则的级别定级。
    prohibits: |
      用流畅的改写掩盖歧义；输出多个完整的备选版本；在同一处既消歧又替换关键动词；没有证据就择一。
    exceptions: |
      §5「不算真歧义」的两类：一种读法在该领域不对应任何可执行操作；参数在运行时由外部唯一确定（如 `Retry-After`）。standard 阈值下普通读者不会产生分歧的读法不算竞争读法。A005 末句豁免检查步骤缺判据的情形。
    fork: no
    answer: |
      上下文能确定读法时，按所触发的规则消歧，所选读法须有证据，并可归因到规则 ID；没有规则触发时不改。
      description 只写了「上下文不足以确定的歧义只报告、不擅自消解」，没有写可确定的一支。但「不足以确定的」这一限定和「擅自」一词都蕴含：可确定的歧义可以依证据消解，规则触发时还应当或必须消解。description 是 §5 的子集，二者一致，没有矛盾。
    notes: |
      - description 没有提「证据」要求，也没有提消歧须由某条规则触发。只读 description 的调用方可能以为任何可确定的歧义都可以自由消解；正文补足了这两点。
      - description 的「只报告」没有写出例外：A005 末句的检查步骤豁免，以及 §5「不算真歧义」。这是概述不完整，不构成行为分歧，因为正文更具体、更后读。
      - review 模式下可确定的歧义怎样处理，§5 没有写，它只写了不可确定一支在 review 中的处理。按 §8「逐句定位违规」推断，应当在所触发的规则（如 A002）下报告 finding，建议修改取有证据的读法，不填 A005。A001 有一条显式边界：「施事可由上下文唯一推定时不产生 finding」。而 A001 在改写中「存在多个可能执行者……且补出的执行者必须能从来源或上下文确定」时要补出执行者。同一段文本，改写会改，审阅却不报，两种模式之间不对称。
