# 冷读反向解码：只依据 dev/inbox/si4/cand/v1/SKILL.md 的文字。
# 运行环境自动注入的 AGENTS.md／CLAUDE.md 未被用来推断技能意图。
reviewer: cold-decoder
model: claude-opus-5-5
files_read:
  - dev/prompts/si4-decode.md
  - dev/inbox/si4/cand/v1/SKILL.md
probes:
  - probe: |-
      1. CTC-A005 与 CTC-P003 的分工：步骤缺少成功判据或验证方式时，由哪条规则决定是否提出（改写）或报告（审阅）；runbook (a)(b)(c) 的处理与严重级别。
    level: |-
      CTC-P003 = 应（review 按映射为 WARNING；§8 允许在「风险」字段指名操作者的不同动作时报 ERROR）。CTC-A005 = 必须（review 为 ERROR）。
    scope: |-
      可执行步骤文本（runbook、SOP、排障步骤，属 strict 适用范围；review 也用 strict 阈值）。改写时决定是否进「待确认」，审阅时决定是否产生 finding。
    trigger: |-
      P003 分支：A005 末句「来源完全没有给出成功判据或验证方式的步骤，是否提出或报告按 CTC-P003 判断」；P003 末段「来源未给出成功判据时」。
      A005 分支：A005 末句「给出的判据含义未定（「服务正常」）时仍按本规则」；以及 A005 主句「缺少执行所需的参数、阈值、接收方、判据」，含 R004 排除出来的未给值时长（「若干分钟」）。
    requires: |-
      P003 分支：只有当该步是破坏性或不可逆操作，且后续步骤的安全性取决于它是否成功，两个条件同时成立，才按「待确认」第 2 类提出；审阅时报 CTC-P003 finding。
      A005 分支：保持原表述，在「待确认」写出位置、缺失项、判定所需的信息（三栏，无第四栏）；审阅时报 CTC-A005 ERROR。
    prohibits: |-
      补写判据（CTC-S002；P003「不得虚构判据」）；把来源已给出的判据移离被守护步骤或去掉其阻塞性质；P003 两个条件不成立时仍提出，造成「成串的未决项」。
    exceptions: |-
      P003 条件不成立的步骤缺判据时不提出、不报告。CTC-P004 只在来源给出了前置条件时生效，来源没给就不得虚构。
    fork: yes
    readings:
      - id: A
        reading: |-
          把「完全没有给出成功判据或验证方式」读作两者都没给。(a) 第 3 步「检查 `app` 的运行情况」给出了验证方式，只是没有判据，因此不进 P003 分支，按 A005 主句「缺少执行所需的…判据」处理。
        behavior: |-
          (a) 改写：正文原样返回，加一行「待确认」：检查 `app` 的运行情况 | 未给出判定运行正常的判据 | 判定成功的可观测条件。审阅：一条 CTC-A005 ERROR。
      - id: B
        reading: |-
          以 P003 自己的触发句「来源未给出成功判据时」为准，它只看有没有判据，不看有没有验证动作。A005 的「仍按本规则」只覆盖已经给出、但含义未定的判据（「服务正常」）。「运行情况」是检查的对象，不是判据。
        behavior: |-
          (a) 改写：原样返回，没有「待确认」。审阅：未发现违规。理由：第 1、2 步可逆、非破坏性，第 3 步之后没有后续步骤，P003 两个条件都不成立。
      - id: C
        reading: |-
          P003 finding 的严重级别（适用于 (b)）。按映射是 WARNING。但 P003 的提出条件「后续步骤的安全性取决于它是否成功」本身就蕴含一个可以指名的不同动作：失败时操作者仍会执行下一步。因此 §8 的升级条件几乎总能满足，ERROR 也合规。
        behavior: |-
          (b) 同一条 finding，报 WARNING 或 ERROR 都符合文本，取决于审阅者是否在「风险」字段写明该动作。文本没有规定何时必须升级、何时不得升级。
    answer: |-
      分工：来源完全没有判据时由 CTC-P003 决定，条件是「破坏性或不可逆」且「后续步骤安全取决于其成功」，两者同时成立。给出的判据含义未定时由 CTC-A005 决定，只要它导致不同行为就提出。
      (a) 我取读法 B。改写（strict）原样返回，不加「待确认」，依据 CTC-P003。审阅：未发现违规。按读法 A 则是一行「待确认」，审阅报 CTC-A005 ERROR。
      (b) 改写（strict）：正文原样返回，加一行「待确认」（第 2 类，CTC-P003）：执行 `migrate apply 0051`，删除 `users` 表的旧列 `nickname_old` | 未给出迁移成功的判据，而第 2 步切回写流量的安全性取决于迁移是否成功 | 确认迁移成功的判据或验证方式。不带第四栏。审阅：CTC-P003，按映射报 WARNING；若「风险」字段写明「迁移失败或只完成一部分时，操作者仍会把写流量切回 `users-api`」，可以报 ERROR（读法 C）。CTC-P004 不触发：来源没有给出前置条件，不得虚构。
      (c) 改写（strict）：正文原样返回，加两行「待确认」，都属 CTC-A005，都不带第四栏：
        - 观察一段时间 | 「一段时间」未给出时长 | 观察时长
        - 确认服务正常 | 「服务正常」未给出判据 | 判定服务正常的可观测条件（指标、状态或检查命令）
      审阅：两条 CTC-A005 ERROR。「一段时间」经 R004 排除句（未给值的时长）转入，按 §8 第 2 步规则字段填 A005；「服务正常」直接适用 A005 末句。`nodectl destroy node-3` 不可逆，但其后没有后续步骤，P003 不就它自身的成功判据提出。「确认服务正常后」已位于被守护动作之前，P004 满足，P003 保持绑定，正文无需改动。
    notes: |-
      A005 末句只区分了两种情形：判据和验证方式都没给（交给 P003），以及给了判据但含义未定（留在 A005）。「有验证动作、没有判据」（「检查…运行情况」「观察若干分钟」）落在两者之间，P003 的触发句与 A005 的主句都能覆盖它，这是读法 A/B 分叉的来源。按读法 A 会出现倒挂：步骤写了一个模糊的检查，报 ERROR；步骤完全没写检查，只要不是破坏性操作就什么都不报。
      (b) 中「后续步骤的安全性取决于它是否成功」需要领域推断。我判定成立，因为「切回」说明写流量是为迁移而切走的。但文本没有给出这种依赖关系的判定标准。
  - probe: |-
      2. CTC-R004 与 CTC-A005 的边界：审阅 SOP 五处的规则 ID 与严重级别；改写时哪些「待确认」带第四栏。
    level: |-
      CTC-R004 = 应（WARNING，可按 §8 升级）；CTC-A005 = 必须（ERROR）。
    scope: |-
      规范性指令（SOP）；review 按被审文档类型取 strict 阈值。
    trigger: |-
      R004：判定条件由表示程度、时机或裁量的无判据词承担，例如「尽快」「必要时」，列举以「等」结尾，是开放类。
      转 A005 的排除项：未定义的状态（「服务稳定」）；未给具体值的次数或时长（「多次」「若干分钟」）；给可测量指标设限而未给阈值的程度说法（「延迟较高」）。
    requires: |-
      R004 改写：不补判据，在「待确认」中指出缺失的判据，并按 §5 列出两种以上强度、给出建议，即第四栏。
      A005 改写：保持原表述，「待确认」只用三栏。
      review：R004 项的规则字段填 CTC-R004；排除项按 §8 第 2 步填 CTC-A005，不另列 R004，按 A005 定级，不算升级。
    prohibits: |-
      把无判据词替换为具体强度或阈值（§5「替作者做出未经授权的规范决定」）；补写判据（S002）；同一处同时列 R004 和 A005。
    exceptions: |-
      目标文档中限定观测事实的普通副词（「通常在 100 ms 内返回」）不受 R004 限制，本例不涉及。§8 的升级只对 R004（应）项有意义。
    fork: yes
    readings:
      - id: A
        reading: |-
          第 2、3 处（R004）按级别映射报 WARNING。
        behavior: |-
          第 2、3 处为 WARNING。
      - id: B
        reading: |-
          第 2、3 处的「风险」字段指名操作者因此会做出的不同动作，例如「扩容后拖延很久才通知」「值班人员各自判断是否回滚，有人回滚有人不回滚」，按 §8 唯一的升级报 ERROR。
        behavior: |-
          第 2、3 处为 ERROR。读法 A 和 B 都符合文本，级别由审阅者决定（与探针 1 读法 C 同源）。
      - id: C
        reading: |-
          第 5 步「观察」没有说明观察什么、怎样算通过。按探针 1 读法 A，这里还应另报一条缺少判据的 A005；按读法 B 不报（重启之后没有后续步骤）。
        behavior: |-
          第 5 处的 finding 是一条还是两条（「若干分钟」一条，加上「观察」缺判据一条）。
    answer: |-
      1. 「请求量明显上升时」：CTC-A005，ERROR。依据 R004 的排除句「给可测量指标设限而未给出阈值的程度说法（「延迟较高」）不是这类词，按 CTC-A005 处理」，以及 §8 第 2 步。请求量是可测量指标，「明显」没有给阈值。
      2. 「扩容后尽快通知值班组」：CTC-R004，WARNING（可升级为 ERROR）。依据 R004 列举的「尽快」。
      3. 「必要时回滚到上一版本」：CTC-R004，WARNING（可升级为 ERROR）。依据 R004 列举的「必要时」。
      4. 「响应变慢时，重启 `cache-proxy`」：CTC-A005，ERROR。响应时间是可测量指标，「变慢」没有阈值，与「延迟较高」同类，依据同第 1 处。
      5. 「重启后观察若干分钟」：CTC-A005，ERROR。依据 R004 排除句中的「未给出具体值的次数或时长（「多次」「若干分钟」）」。
      改写时第 2、3 处带第四栏，依据是 §5「列出其可能的两种以上强度并给出建议」，以及 §3「第四栏只在规则要求给出建议时填写（§5 的情态模糊）」。第 1、4、5 处走 A005，不带第四栏。示例：
        - 请求量明显上升时 | 「明显上升」未给出阈值 | 触发扩容的请求量阈值
        - 尽快通知值班组 | 「尽快」未给出时限，所承担义务的强度未定 | 通知时限与作者意图的规范强度 | 可读作「必须在扩容后立即通知」或「应在规定时限内通知」，建议按前者确认
        - 必要时回滚到上一版本 | 「必要时」未给出回滚的触发条件 | 回滚的可观测触发条件与规范强度 | 可读作「出现指定状态时必须回滚」或「由值班人员裁量是否回滚」，建议按前者确认
        - 响应变慢时 | 「变慢」未给出阈值 | 触发重启的响应时间阈值
        - 观察若干分钟 | 「若干分钟」未给出具体时长 | 观察时长
    notes: |-
      严重级别倒挂：涉及破坏性回滚的「必要时」只报 WARNING，「若干分钟」却报 ERROR。这是边界设计的结果，不是读法分叉；能否补救取决于审阅者是否使用 §8 的升级。
      「明显」本身也是程度词，而 R004 的列举是开放类；但排除句足够具体（可测量指标加上未给阈值），我不把它算作分叉。
      五处之外还有两个不确定点：扩容幅度没有给出；通知值班组的方式没有给出（§3 示例「升级处理 | 未给出升级的接收方与方式」把「方式」算作缺失项）。在 strict 阈值下它们是否算 A005 的「执行所需」，文本没有给出判据。我不把它们列入答案。
  - probe: |-
      3. CTC-R003 对工具描述与其他文本的作用：(a)(b)(c) standard、(d) strict 的改写中，哪些编辑是允许或要求的，以及预期输出。
    level: |-
      CTC-R003 = 应（第 4 层，「本规则永远低于 S 族」）。
    scope: |-
      含译文腔或口语腔的文本。只有工具描述带有专门的修复方向：改为直接陈述功能，不以使用者作主语。
    trigger: |-
      口语腔，包括「把读者当作谈话对象的引导（「这个工具可以帮你」…）」；「工具描述中以使用者作主语的「调用者可以…」同属此类」。
    requires: |-
      去除缺陷时，工具描述改为直接陈述功能（「获取…」「用于…」），不以使用者作句子主语。修复取能去除缺陷的最小改动（§6 末段）。
    prohibits: |-
      改变语义不变量（S 族优先）；对不含该缺陷的文本做重写（R001 及 §6 末段）；把口语禁止改成「不得」「禁止」。
    exceptions: |-
      被动用于突出受事、施事未知或施事已在同句给出时是自然的。工具描述条款只适用于「工具描述中」。
    fork: yes
    readings:
      - id: A
        reading: |-
          「调用者可以…」里的「可以」表示工具具备的能力，属于对系统行为的描述。R003 已经把这个句式本身定为缺陷，并给出修复形式（「获取…」「用于…」），所以删去整个使用者框架不违反 S003。
        behavior: |-
          (a) 输出「批量删除过期会话，单次最多 1000 条。」(b) 输出「把 Markdown 渲染成 HTML。」
      - id: B
        reading: |-
          「可以」是 S003 保护的许可情态，而 R003 低于 S 族，所以只能去掉使用者主语，「可」要保留。
        behavior: |-
          (a) 输出「可用于批量删除过期会话，单次最多 1000 条。」(b) 输出「可用于把 Markdown 渲染成 HTML。」
      - id: C
        reading: |-
          (d) agent 指令里的「你」也算「把读者当作谈话对象的引导」，由 R003 去掉，同时按 S003 保留「可以」。
        behavior: |-
          (d) 输出「可以调用 `refund_order` 为用户退款。」而不是原样返回。
      - id: D
        reading: |-
          P005 末句「改写时来源未给出的能力、参数上限或使用限制不得补写，在「待确认」中提出」逐字执行：凡是没写使用时机或适用边界的工具描述和 agent 指令，都要提出。与之对照，「待确认」是封闭清单，第 3 类只收「工具描述缺失的触发条件」，而具体的功能陈述（「批量删除过期会话」）可以视为已经给出了触发条件。
        behavior: |-
          按逐字读法，(b)、(d)（可能还有 (a)）要追加「待确认」，例如「调用 `refund_order` | 未给出退款的使用时机与适用边界 | 允许退款的条件」。按封闭清单读法，不追加。
    answer: |-
      (a) R003 要求编辑（应），归因于「工具描述中以使用者作主语」。输出：「批量删除过期会话，单次最多 1000 条。」写成「用于批量删除过期会话，单次最多 1000 条。」同样合规。「单次最多 1000 条」按 CTC-S004、CTC-L004 原样保留。
      (b) R003 要求编辑（应）。「开发者」是该函数的使用者，属于「以使用者作主语」一类，「调用者可以」只是其中一例。输出：「把 Markdown 渲染成 HTML。」「把…渲染成」不改为「将…为」，因为这一改动没有规则可以归因（R001）。
      (c) 不得编辑，原样返回。工具描述条款限于「工具描述中」；第三人称的「开发者可以」不是把读者当作谈话对象的引导；「可以」受 S003 保护；未触发规则的文本原样返回（R001）。输出：「开发者可以通过 `--dry-run` 预览迁移将要执行的 SQL。」
      (d) 不得编辑，原样返回。这是 agent 指令，不是工具描述。「你」指明执行者（A001），「可以」是授予 agent 的许可（S003）；在 agent 指令里用「你」称呼执行者是常规体例，不是口语腔。输出：「你可以调用 `refund_order` 为用户退款。」
      P005：我取封闭清单读法，(a)(b)(d) 都不追加「待确认」。
    notes: |-
      §3 把工具描述归入 strict 适用范围，而探针为 (a)(b) 指定了 standard。§1 只在模式未指定时才推定，所以调用方指定的模式优先；模式不影响 R003。
      R003 没有说明工具描述里的「调用者可以」不构成 S003 意义上的许可，也没有说明 agent 指令中的「你」是否豁免。这两点是读法 B、C 的来源。
  - probe: |-
      4. CTC-P003 的合并授权：来源「1. 启动 `worker`。2. 确认 `/healthz` 返回 200。3. 将 `worker` 加入路由。」在四种调用方指令下，第 2 步能否并入相邻步骤。
    level: |-
      CTC-P003 = 应；合并授权属于 §3「规则条文中写明的授权（CTC-P003 的合并步骤…）」。
    scope: |-
      来源把验证单独列为一个步骤的流程文本。
    trigger: |-
      「调用方授权合并步骤（明确要求合并，或限定步骤数）」。
    requires: |-
      未获授权时，第 2 步保持独立。获授权时，第 2 步可以并入相邻步骤，但合并后必须仍由操作者执行、位于被守护动作之前，并逐项列全原有判据。
    prohibits: |-
      把确认动作改写成不需要操作者动作的状态描述（「节点就绪后加入路由」）；丢掉任一判据；做未获授权的同类改动（§3「未获授权的同类改动一律不得做」）；以简洁或长度为名删除成功判据（§3、CTC-S001）。
    exceptions: |-
      不合并就无法满足长度上限时，按 CTC-S001 返回完全合规的最短文本，并在「待确认」第 7 类说明上限未能满足。
    fork: yes
    readings:
      - id: A
        reading: |-
          P003 括注里的「明确要求合并，或限定步骤数」是授权的穷尽定义；字数上限不属于其中任何一种。
        behavior: |-
          (b) 不合并，保持三步。
      - id: B
        reading: |-
          §3 把「长度上限」也列为调用方可以显式授权的改动，而 S001 要求返回最短的合规文本，所以字数上限也授权了合并。
        behavior: |-
          (b) 输出两步：「1. 启动 `worker`。2. 确认 `/healthz` 返回 200 后，将 `worker` 加入路由。」（合并几乎不减少字数。）
    answer: |-
      (a)「压缩到不超过 2 步」：能合并，依据「限定步骤数」。输出例：「1. 启动 `worker`。2. 确认 `/healthz` 返回 200 后，将 `worker` 加入路由。」
      (b)「全文控制在 40 字以内」：不能合并（读法 A）。字数上限既不是「明确要求合并」，也不是「限定步骤数」；§3「未获授权的同类改动一律不得做」；S001「调用方给定的长度上限不授权删除任何条件…」。来源是否已在 40 字以内取决于计字方式：只计汉字约 11 字，计全部非空白字符约 49 字。若判定超限，正文原样返回，并在「待确认」第 7 类说明上限未能满足。
      (c)「合并可以合并的步骤」：能合并，依据「明确要求合并」，且 P003 写明第 2 步在授权下「可以并入相邻步骤」。输出同 (a)；并入第 1 步也满足三项约束：「1. 启动 `worker`，确认 `/healthz` 返回 200。2. 将 `worker` 加入路由。」三步不能并成一步，因为启动和加入路由是两个操作目标（CTC-P001）。
      (d)「精简措辞」：不能合并。它既没有要求合并，也没有限定步骤数；来源也没有可以精简的地方，原样返回。
    notes: |-
      (a)(c) 的合并会改变列表项数，而 R005 要求保持列表项数（应）。合并授权是否同时构成 R005 的「调用方明确要求改变格式」，文本没有明说；我把它视为合并授权的必然结果。
      (c) 并入前一步还是后一步，文本没有规定；§10 示例并入了后一步，那种写法的阻塞性质更明显。
