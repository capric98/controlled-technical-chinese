      6. frontmatter 的 description 与 §5：上下文能确定读法的歧义怎样处理；二者是否一致。
    level: |-
      §5 第一段：消歧时「所选读法必须有来源或上下文证据」。description 是激活用的摘要，不设规范级别。
    scope: |-
      全部模式下的歧义处理。
    trigger: |-
      存在歧义，且上下文（包括来源）能确定或不能确定作者意图。
    requires: |-
      能确定时：按所触发的规则消歧（CTC-A001–A004、CTC-P002 等），所选读法要有证据。不能确定时：按 CTC-A005 保持原表述，进「待确认」；review 模式下作为 finding 报告，按所引规则的级别定级。
    prohibits: |-
      用流畅的改写把歧义掩盖成确定句；输出多个完整的备选版本；在同一处既消歧又替换关键动词。
    exceptions: |-
      §5 列出的两种不算真歧义的情形；standard 阈值（只有普通技术读者会产生分歧时才算竞争读法）。
    fork: no
    answer: |-
      description 只写了不能确定的一半：「上下文不足以确定的歧义只报告、不擅自消解」，没有提到能确定时怎样处理。§5 第一段补上了另一半：按所触发的规则消歧，并且要有证据。二者一致，没有矛盾。description 这一句与 §5 第二段及 CTC-A005 相符；能确定时的消歧仍受 description 末句「未触发规则的文本原样返回」约束，因为 §5 要求「按所触发的规则」消歧，没有触发规则就没有消歧的依据。
    notes: |-
      「上下文」一词有两种用法。§1 指「调用方给定的上下文（术语约定、已授权的改动、长度上限）」；§5 的两段首句和 description 中的「上下文」按语境应包括来源文本，而 CTC-A005 写作「来源与上下文都不足以确定」，§5 第一段写作「来源或上下文证据」。如果按 §1 的窄义读 §5 第二段，来源能确定、调用方上下文不能确定的歧义会被送去 A005 报告，这与 A005 条文冲突（来源足以确定时 A005 不触发）。A005 条文写得明确，所以按宽义读，不构成分叉；但建议在 §5 和 description 中统一写作「来源与上下文」。
