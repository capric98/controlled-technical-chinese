    level: |-
      §6：「应 = 默认要求，可被更高优先级或规则条文写明的边界推翻」。
    scope: |-
      全部「应」级规则：CTC-A003、P002、P003、P005、R004、T001、R002、R003、R005。
    trigger: |-
      「应」级要求与更高优先级的要求冲突，或者当前情形落入规则条文写明的边界。
    requires: |-
      没有被推翻时，按默认执行「应」级要求。规则正文里的「必须」「不得」不改变该规则的级别。
    prohibits: |-
      strict 不把「应」提升为「必须」；低层不得覆盖高层（§2）；任何模式下都不得以简洁或长度为名删除条件、前提、例外、守护条件、成功判据、阈值、默认值或受保护标记（§3）。
    exceptions: |-
      §8 的唯一升级改变的是 finding 的严重级别，不是规则级别，也不构成推翻。
    fork: yes
    readings:
      - id: A
        reading: |-
          「更高优先级」指 §2 的层级阶梯（该节标题即「优先级」），高层的要求推翻低层的「应」。
        behavior: |-
          调用方的指令只能通过 §3 列出的授权和规则条文写明的授权起作用。
      - id: B
        reading: |-
          「更高优先级」还包括级别更高的规则，即「必须」级规则，不论它在哪一层。
        behavior: |-
          例如 CTC-T002（必须，第 3 层）可以推翻 CTC-P002／P003／P005／R004（应，第 2 层）；按读法 A 则不能。实际冲突罕见。
      - id: C
        reading: |-
          「更高优先级」还包括调用方的显式指令。
        behavior: |-
          调用方要求「保留原有口语语气」或「每步都写出主语」时，按读法 C，R003／R002 让位；按读法 A，它们照常生效。§3 的授权清单只覆盖「本来禁止的改动」，没有说明调用方能否免除某条「应」级要求，所以这里由读法决定。
    answer: |-
      可以推翻「应」的来源有两类：更高优先级（我取读法 A，即 §2 的层级，「低层不得覆盖高层」），以及规则条文写明的边界（包括条文里写明的调用方授权）。
      可以推翻，例 1：CTC-R005（应）「不得把表格拍平为句子」被它自己的条文边界「调用方明确要求改变格式时按要求执行」推翻。调用方要求把表格改写成段落时，照做。
      可以推翻，例 2：CTC-P003（应）「来源把验证单独列为一个步骤时，该步骤保持独立」被条文「调用方授权合并步骤（明确要求合并，或限定步骤数）时可以并入相邻步骤」推翻，见 §10 示例。
