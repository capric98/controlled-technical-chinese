reviewer: adversarial
model: claude-opus-5-5
files_read:
  - "dev/prompts/si4-adversarial.md"
  - "dev/inbox/si4/base/SKILL.md"
  - "dev/inbox/si4/cand/v1/SKILL.md"
  - "dev/inbox/si4/cand/build.py"
  - "dev/inbox/si4/probes/probes.yaml"
  - "dev/inbox/si4/probes/resolutions.yaml"
  - "eval/reports/raw/si4-probe-base-r1/*.claude.json（22 个探针全部）"
  - "eval/reports/raw/si4-probe-base-r2/*.claude.json（22 个探针全部）"
  - "eval/reports/raw/si4-probe-base-r3/*.claude.json（22 个探针全部）"
  - "eval/reports/raw/si4-selfhost-base-r1/SH-base.claude.json"
  - "eval/reports/raw/si4-selfhost-base-r2/SH-base.claude.json"
  - "eval/gold/gold-procedure.yaml（仅 G-P-003）"
  - "eval/gold/gold-rendering.yaml（仅 G-R-010）"
  - "eval/gold/gold-tokens.yaml（仅 G-T-101）"
  - "eval/disagreements/D004-misdiagnosed-checkpoint-merge.md"
  - "docs/decisions/000-design.md（§20；另查看了章节标题列表）"
  - "docs/decisions/003-core-semantic-policy.md"
  - "docs/decisions/004-rule-set-adjudications.md"
  - "docs/decisions/007-si2-review-routing-and-p002-boundary.md"
  - "docs/decisions/008-si3-register-r004-class-status-scope.md"
edits:
  - id: F1
    semantic_change: |
      description 中「只报告、不消解」的对象从全部歧义收窄为「上下文不足以确定的歧义」，与 §5 的两段一致：上下文能确定时按所触发的规则消歧，不能确定时按 CTC-A005 保持原表述并进「待确认」。
      运行时行为由 §5 与 CTC-A005 决定，description 只影响激活与读者预期。没有任何规则的触发或要求因此改变。
    level_change: none
    evidence_supports: "yes"
    evidence_note: |
      si4 基线自宿主 r2 第 1 条（CTC-A005）报告的正是这一句：description 可读作「一切歧义都只报告」，与 §5 矛盾。
      候选措辞与维护者决定 M2 的 to 字段逐字相同；diff 核对过，description 其余部分逐字未变。这是能消除该 finding 的最小改动。
    clarification_or_new: clarification
    counterexamples: []
    conflicts: []
    verdict: accept
    rationale: |
      构造不出可信反例。尝试过的方向：
      （1）「足以确定」被放宽成「取最可能的读法」：§5 要求所选读法有来源或上下文证据，「足以」本身也设了门槛；description 不是运行时依据。
      （2）「不算真歧义」（`Retry-After` 的秒数）是否因此被暗示要报告：基线「歧义只报告」有同样的暗示，正文 §5 明确排除，不是新漏洞。
      （3）「擅自」暗示调用方可以授权消歧：基线已有「擅自」；§3 的授权清单不含消歧，未变。
      （4）description 写「上下文」，CTC-A005 写「来源与上下文」：§5 的两句也只写「上下文」，与 §5 一致。
      （5）激活范围：文档类型与任务列表未动，不变。

  - id: T
    semantic_change: |
      本条合写 T1、T3、T4；T2 单列。
      T1「记录级别」→「级别」：纯术语统一，「级别」栏在别处没有第二个名字，行为不变。
      T3 §9 第 1 条示例加「应」：写明示例方向，与第 2 条的「不得写成」对称；「应」与该示例所依据的 CTC-R002（应）同级，不新增规则。
      T4「明确边界」→「规则条文写明的边界」：这一处不是纯术语。基线的「明确边界」未定义，可读作规则条文自带的除外、调用方给定的约束、文档类型的适用范围，甚至模型自认的边界；候选只保留第一种。效果是「应」级规则更难被条文之外的理由推翻。
      实际收窄的范围有限：§3 的调用方授权独立起作用（它连 S003、S004、S005 这类「必须」的禁止都能解除），条文写明的授权（P003 合并步骤、R005 改变格式）本来就算「规则条文写明」。真正被排除的，是既不在 §3 授权清单内、也不属于 §2 更高层的调用方指示。
    level_change: none（级别栏未变；T4 收窄的是「应」的可推翻条件）
    evidence_supports: "yes"
    evidence_note: |
      T1：si4 基线自宿主 r1 第 7 条、r2 第 4 条（2/2）；007、008 都记录过它。
      T4：si4 基线自宿主 r2 第 2 条。该 finding 建议的写法是「规则条文写明的除外情形或调用方授权」，候选去掉了「或调用方授权」。这是候选自己的取舍，自宿主证据既不支持也不反对。
      T3：依据 build.py 所引的 si3 自宿主；si4 基线两次自宿主都没有报告它。si4 基线 r1 第 5 条报告的是 §9 引导句的双重否定，T3 不处理那一处。
    clarification_or_new: clarification
    counterexamples:
      - kind: false_fire
        task: 改写（T4）
        mode: strict
        input: |
          调用方指示：只返回改写后的工具描述，不要附加任何说明或「待确认」。
          来源：
          `get_orders`：查询订单。
        candidate_behaviour: |
          CTC-P005（应）要求在「待确认」中提出缺失的使用时机。调用方的指示不在 §3 授权清单内（清单讲的是「本来禁止的改动」），也不属于 §2 的更高层；按 T4，它推翻不了 P005，于是仍追加「待确认」，违背调用方指示。也可能模型照调用方做，但已没有文本依据。
        why_wrong: |
          基线的「明确边界」可以容纳调用方的明确约束，T4 把这条路关了。调用方能否压掉「应」级规则的报告是产品问题；若答案是能，这与 D004 记录的失败同形（技能拒绝合法的调用方指令）。概率中低，模型一般会服从调用方。
      - kind: missed_fire
        task: 改写（T3）
        mode: strict
        input: |
          用户打开控制台。用户点击设置。用户修改端口。
        candidate_behaviour: |
          §9 引导句写「以下约束……不得照做」，各条本身又写成「不得……」。按 si4 基线自宿主 r1 第 5 条指出的字面双重否定读法，第 1 条里新加的「应写成「用户打开控制台后，点击设置修改端口。」」也落在「不得照做」之下，可读成不要合并，三个重复主语保留。
        why_wrong: |
          CTC-R002 要求删去逐句重复的主语。T3 想消除示例的方向歧义，但引导句不改，给示例加规范词「应」，反而让双重否定读法多了一个可被否定的对象。概率低：条目标题已写明「不得要求每句都有显性主语」，多数读者会按意图读。
    conflicts: []
    verdict: accept
    rationale: |
      T1 构造不出反例。尝试过：「A、P 两族按其级别生效」与 §3 首句重复后，「S、L、T 三族原样生效」会不会被读成这三族不按级别；T001 是「应」，「原样生效」仍是按级别生效，不影响行为。
      T3 的反例依赖一个已有的引导句缺陷，修引导句不属本轮；T3 本身方向正确。
      T4 让「应」的可推翻条件比自宿主的建议更窄。第一条反例是产品问题，不是语义回退，所以接受；请维护者确认调用方指示能否推翻「应」级规则的报告义务。

  - id: T2
    semantic_change: |
      删去「压缩授权」，把「授权合并步骤」定义为「明确要求合并，或限定步骤数」，并把「该步骤保持独立」改成句首的默认陈述。合并后的完整性要求不变：由操作者执行、位于被守护动作之前、判据列全。
      与基线的差别：基线的「压缩授权」没有定义，字面可包括一切压缩请求；候选是封闭的两种形式。由此产生两点变化：
      （1）字数或篇幅上限（「全文控制在 60 字以内」「请精简」「压缩篇幅」）明确不算合并授权。基线 PC-01 3/3 本来就这样做，行为不变。
      （2）只要求减少步骤、却既不出现「合并」也不给数字的指令（「步骤越少越好」），从可能算授权变成不算。
    level_change: none
    evidence_supports: "yes"
    evidence_note: |
      术语 finding 来自 si4 基线自宿主 r2 第 5 条，它明确提出：只授权「压缩到 N 步」或只给长度上限时，是否算获得授权无法判定。候选的括注正好回答这个问题，且与已有行为一致：
      PR-09（步数上限）基线 3/3 合并，校验完整；
      PC-01（字数上限）基线 3/3 保持三步，按第 7 类报告上限未满足；r3 还在「待确认」里建议「或授权合并步骤」，说明模型已经把字数上限和合并授权分开。
      与 D004 一致：G-P-003 的指令同时含「合并可以合并的步骤」和「不超过 3 步」。与 §3 授权清单把「长度上限」和「CTC-P003 的合并步骤」分列也一致。
      「请精简」「压缩篇幅」落在不授权一边：校验步骤保持独立，其余措辞照常收紧，满足不了上限时走第 7 类。这与 CTC-S001 和 PC-01 一致。
    clarification_or_new: clarification
    counterexamples:
      - kind: missed_fire
        task: 改写
        mode: strict
        input: |
          调用方指示：请精简下面的步骤，步骤越少越好。
          1. 停止 `ingest-worker`。
          2. 确认队列 `ingest.pending` 的积压为 0。
          3. 执行 `kafka-topics --delete --topic ingest.raw`。
        candidate_behaviour: |
          指示里没有「合并」，也没有步数，不属于括注的两种形式。第 2 步保持独立，输出仍是三步。
        why_wrong: |
          「步骤越少越好」实质上就是要求合并步骤。基线的「压缩授权」能容纳它，候选的封闭括注把它排除了，形状与 D004 相同（技能拒绝合法的压缩指令）。这里没有明确步数，校验点也完整，危害只在指令服从。括注的这一侧没有探针确定过，属产品问题。
      - kind: false_fire
        task: 改写
        mode: strict
        input: |
          调用方指示：合并重复的步骤。
          1. 将 `ingest` 集群切到维护模式。
          2. 停止 `ingest-worker`。
          3. 将 `ingest` 集群切到维护模式。
          4. 确认队列 `ingest.pending` 的积压为 0。
          5. 执行 `kafka-topics --delete --topic ingest.raw`。
        candidate_behaviour: |
          「明确要求合并」字面成立，模型可能以「已获合并授权」为由把第 4 步也并入第 5 步（「确认……为 0 后，执行……」）。
        why_wrong: |
          调用方只授权合并重复的步骤。合并后完整性要求仍然满足，没有语义损失，但这是一处超出授权范围的无请求改动（CTC-R001）。基线「调用方授权合并步骤时」有同样的范围缺口，括注既没有让它更好，也没有让它更坏。概率低。
    conflicts: []
    verdict: accept
    rationale: |
      括注把 PR-09 与 PC-01 已经稳定的行为写成文本，消除了自宿主报告的双名，没有与 D004、G-P-003、§3 授权清单或第 7 类冲突。
      另试过「把这三步改写成一句话」：格式改变由 CTC-R005 授权；即使不算合并授权，校验写成同一句中由操作者执行、位于删除之前、判据完整的分句，也满足 P003 的完整性要求，不构成失败。
      §10 示例标题仍写「压缩指令与校验点」，指的是调用方的指令，不是授权的名称，不冲突。
      第一条反例是封闭括注的代价，只能扩大括注来修，不在 revise 的权限内；记下交维护者。

  - id: B1
    semantic_change: |
      CTC-A005 行末加两句。
      第一句把「来源完全没有给出成功判据或验证方式的步骤」移出 A005：改写时是否在「待确认」中提出、审阅时是否报告，都改按 CTC-P003 末句的限制判断（只有破坏性或不可逆、且后续步骤的安全性取决于它是否成功的步骤才提出）。
      第二句把「给出的判据含义未定」留在 A005。
      多允许的：非破坏性步骤（包括只读的收尾检查）缺判据时，审阅不再报告；基线 P3-01 有 2/3 报了 A005/ERROR。
      多禁止的：无。
      改变的触发：A005「缺少……判据」一项的覆盖范围缩小；P003 末句的限制从改写扩展到审阅（「提出或报告」）。
    level_change: |
      规则级别不变。效果上，「成功判据缺失」这类缺口从 CTC-A005（必须 → ERROR，不需要升级条件）改走 CTC-P003（应 → WARNING，可按 §8 升级），并多了破坏性限制。这是 M5 的决定；记在这里，是因为它是一处看得见的严重级别变化。
    evidence_supports: partly
    evidence_note: |
      失败确实存在，且由 A005 的「缺少……判据」引起：P3-01 基线 r1、r3 以 CTC-A005/ERROR 报告只读收尾检查，r2「未发现违规」；P3-02 改写 3/3 不提。M5 要求两种模式统一按 P003 的限制。
      但候选措辞不一定命中 P3-01 本身（见第一条反例）。「完全没有给出成功判据或验证方式」处在否定辖域里，自然读法是「两者都没有给出」；而 P3-01 第 3 步本身就是一个验证动作（「检查……运行情况」），只是没有判据。按这个读法 B1 不适用，A005 照旧报告。build.py 注释和 M5 的说法是「缺判据或缺验证方式」，与这一读法不同。
      此外，第一句以「步骤」为话题，「提出或报告」没有宾语，字面可读成「整个步骤是否提出或报告按 P003」，会把同一步骤上的接收方、参数缺口一并带走（第二条反例）。
      结论：方向对，是澄清，但措辞不是能可靠解决该失败的最小改动。
    clarification_or_new: clarification
    counterexamples:
      - kind: false_fire
        task: 审阅
        mode: review
        input: |
          ## 更新 `search-api` 缓存配置
          1. 将 `search.yaml` 中的 `cache.ttl` 改为 `600`。
          2. 执行 `systemctl reload search-api`。
          3. 检查 `search-api` 的运行情况。
        candidate_behaviour: |
          第 3 步给出了验证动作「检查……运行情况」。按「完全没有给出成功判据或验证方式」的「两者都没有」读法，它不属于 B1 第一句；「运行情况」也可以被当作「给出的判据含义未定」，落进 B1 第二句。两条路径都回到 CTC-A005/ERROR，与基线 r1、r3 相同。
        why_wrong: |
          M5 明确要求这一步在审阅中按 P003 的限制不报告，B1 正是为此加的，却在它的目标探针上留下两条回到 A005 的读法。预测 v1 上 P3-01 仍可能分叉；按要求我没有读 v1 的输出，需要用 si4-probe-v1-* 核对。
      - kind: missed_fire
        task: 改写；审阅
        mode: strict；review
        input: |
          ## 调用超时处理
          1. 调用 `billing-api` 超时后重试，多次失败则升级处理。
        candidate_behaviour: |
          按字面读法，这一步来源没有给出任何成功判据或验证方式，于是「是否提出或报告按 CTC-P003 判断」；它不是破坏性操作，P003 不提出，「多次」「升级」两项一起被放过。
        why_wrong: |
          与 §3 示例前两行和 §5「逐项进「待确认」」直接矛盾。缺的是次数阈值和接收方，属 A005 的「参数、阈值、接收方」，不是成功判据。B1 第一句的话题是「步骤」而不是「缺失项」，才给了这种读法。概率中低，但修正成本只是把宾语写明。
      - kind: missed_fire
        task: 审阅
        mode: review
        input: |
          ## 主库切换
          1. 主库不可用时，必要时手动触发切换。
          2. 切换完成后，尽快通知业务方。
          3. 视情况暂停 `batch-runner` 的定时任务。
        candidate_behaviour: |
          （即 R4-01。基线在「切换完成后」已经分叉：r2 报 CTC-P003/WARNING，r3 报 CTC-A005/ERROR，r1 未报。）候选下有三条路径：把「完成」当作给出但含义未定的判据，走 A005/ERROR；把它当作切换步骤没有判据，走 P003，再看主库切换算不算「破坏性或不可逆」——这一点也未定，于是可能报 WARNING，也可能完全不报。
        why_wrong: |
          B1 声称划出了 P003 与 A005 的界线，但在一个基线已观测到的分叉上，它没有定下规则 ID，还多出一种结果（不报告）。「X 完成后」在真实 runbook 中随处可见，这条线不可判。
      - kind: false_fire
        task: 审阅
        mode: review
        input: |
          ## 更新 `search-api` 缓存配置
          1. 将 `search.yaml` 中的 `cache.ttl` 改为 `600`。
          2. 执行 `systemctl reload search-api`。
          3. 确认 `search-api` 运行正常。
        candidate_behaviour: |
          「运行正常」是给出但含义未定的判据，按 B1 第二句和 R004 排除项（未定义的状态）走 CTC-A005/ERROR。
        why_wrong: |
          在操作上与 P3-01 等价（只读收尾、后面没有步骤），只多了一个谓词，结果却从「不报告」变成 ERROR，正是 M5 想消除的那种报告。这是 si3 Q3（未定义状态 → A005）与 M5（缺判据只在破坏性步骤上报告）之间没有裁决的接缝，B1 的措辞单独修不好，也不应由本次替作者决定；记下交维护者。
    conflicts:
      - |
        「待确认」第 2 类（CTC-P003）：一致，第 2 类就是来源从未给出的成功判据。P003 末句只写「提出」，审阅一侧靠 B1 的「或报告」桥接，可以接受。
      - |
        「待确认」第 5 类（CTC-S002）：第 5 类排除第 2–4 类，成功判据缺口属第 2 类的对象，仔细读不会改走第 5 类；但第 5 类写着「不论由哪条规则发现」，007 已记录过 S002 残留。A005 这条路关掉后，P3-01 的缺口有可能改以 CTC-S002 报告，需要在 v1 输出中检查。
      - |
        R004 排除项「未定义的状态」：B1 第二句与它一致（「服务正常」→ A005），由此产生第四条反例的接缝。
      - |
        §3 示例前两行与 §5「超时后重试，多次失败则升级处理」：按第二条反例的字面读法相矛盾；修订措辞消除这一读法。
    verdict: revise
    revised_wording: |
      不得静默择一，不得补出缺失项。步骤缺少成功判据或缺少验证方式时，这一缺失是否提出或报告按 CTC-P003 判断；给出的判据含义未定（「服务正常」）时仍按本规则。
    rationale: |
      两处改动，都只收窄或消歧，不新增要求：
      （1）「来源完全没有给出成功判据或验证方式的步骤」→「步骤缺少成功判据或缺少验证方式时」。重复「缺少」，把析取写在缺失上，缺其一即适用，与 build.py 注释和 M5 的说法（a missing verification method or criterion）一致；去掉「完全」，消除「只要写了个验证动作就不算」的读法，P3-01 因此确定落在 B1 内。覆盖范围等于候选的既定意图，不比它宽。
      （2）加「这一缺失」作「提出或报告」的宾语，把移交范围从整个步骤收窄到判据缺口本身；同一步骤上的接收方、参数、次数缺口仍按 A005 报告。
      未处理：第三、四条反例（「完成后」「运行正常」）是 si3 Q3 与 M5 之间的接缝，需要维护者裁决或新探针。
      破坏性步骤缺判据仍会报告：P3-03 基线 3/3 以 CTC-P003 报告判据缺口，三次都按 §8 升为 ERROR；P3-04 3/3 按第 2 类提出。末步是破坏性操作、后面没有步骤时，不再有规则报告它，这是 M5 限制本身的结果，不算本改动的缺陷。

  - id: B2
    semantic_change: |
      CTC-R004 的排除项新增一类：「给可测量指标设限而未给出阈值的程度说法（「延迟较高」）」，按 CTC-A005 处理；§8 第 2 步同步加「与阈值」。
      变化：「负载过高」「占用偏大」一类不再进 R004，也就不再带 §5 的第四栏强度建议，改为按 A005 报缺阈值。R004 的开放类本身不变。
    level_change: |
      规则级别不变。效果上这类缺口从 R004（应 → WARNING，可升级）改走 A005（必须 → ERROR）。R4-04 基线 r2 的 R004 已是按 §8 升级的 ERROR，所以严重级别的实际变化主要落在未升级的运行上。这是 M4 的决定。
    evidence_supports: partly
    evidence_note: |
      R4-04 基线 A005、R004、A005 分叉；R4-07（「偏大」，候选没有引用的词）基线 R004、R004、A005。M4 裁定这类词归 A005。改动针对的失败真实存在，且是对 R004 已有排除项的扩展，不是新规则。
      但「给可测量指标设限」的字面范围比 M4 所问的宽。M4 问的是条件中的「过高」；「设限」字面也覆盖给配置参数定一个没写数值的目标值（「调到适当的上限」），而那正是 R004 名单上的「适当」——004 §8 把「适当」作为情态模糊词并入了 R004。
    clarification_or_new: clarification
    counterexamples:
      - kind: false_fire
        task: 审阅
        mode: review
        input: |
          ## 连接池调整
          1. 将 `order-api` 的 `db.pool.max_size` 调到适当的上限。
          2. 执行 `systemctl restart order-api`。
        candidate_behaviour: |
          「适当的上限」字面就是「给可测量指标设限而未给出阈值的程度说法」，可以走 A005；同时「适当」在 R004 名单内。同一处的两个规则 ID 都有字面依据，预测会分叉。
        why_wrong: |
          基线在这里只有 R004 一种读法。004 §8 与 M4 都把「适当」留在 R004，并要求 §5 的强度建议（必须调还是可以调，上限由谁定）。B2 在 R004 名单词上制造了新的 A005/R004 分叉，正是 R4-04 要消除的那类失败。
      - kind: missed_fire
        task: 审阅
        mode: review
        input: |
          ## 限流
          1. 入口流量突增时，打开 `gateway` 的 `rate-limit` 降级开关。
          2. 流量回落后关闭该开关。
        candidate_behaviour: |
          「突增」「回落」是变化说法，不是给指标定一个水平，「设限」能否覆盖它们不确定。R004 的开放类（表示程度的词）和 A005（未定义的状态）两边都有依据。
        why_wrong: |
          按 M4 的原则（缺的是数值 → A005），这里应走 A005。B2 的例子和措辞只覆盖水平词（较高、过高、偏大），变化词的 R004/A005 分叉照旧。这不是 B2 引入的回退，是它没有覆盖的同类。
      - kind: missed_fire
        task: 改写
        mode: strict
        input: |
          ## 表维护
          1. 业务流量较低时，执行 `VACUUM FULL orders`。
        candidate_behaviour: |
          「流量较低」走 A005，「待确认」只列缺失的阈值，不带第四栏。
        why_wrong: |
          「较低时」可读作硬性前提（`VACUUM FULL` 会锁表，不满足就不得执行），也可读作时机建议。这是强度问题，而 §5 只在 R004 一侧要求列出强度并给出建议。A005 的「竞争读法」可以写下这两种读法，所以信息不一定丢，丢的是 §5 要求的建议。对纯触发条件（「CPU 负载过高时扩容」）不存在强度问题，B2 在那里不丢任何东西。
    conflicts:
      - |
        004 §8：「适当」是 R004 的情态模糊词；B2 的字面范围能把「适当的上限／值」拉进 A005（第一条反例）。
      - |
        R004 名单内的「尽快」「及时」：它们不点名任何指标，正常读法不受 B2 影响；但「及时」可被读作「给耗时设了一个没写出来的时限」。R4-06 基线 3/3 报 R004，v1 上是否保持要看 v1 输出（我未读）。
      - |
        R004 排除项「未定义的状态」：与 B2 重叠（「负载过高」两者都是），去向都是 A005，不冲突。§5 的第四栏与 §3 示例第 3 行「尽快回滚」不受影响。
      - |
        §8 第 2 步（B2b）用「阈值」指称这一类，R004 行称「程度说法」；两处名称不同但指同一排除项，影响小。
    verdict: revise
    revised_wording: |
      （B2a）未定义的状态（「服务稳定」）、未给出具体值的次数或时长（「多次」「若干分钟」），以及给运行指标设限而未给出阈值的程度说法（「延迟较高」）不是这类词，按 CTC-A005 处理。
      （B2b）不变：CTC-R004 排除的未定义状态、次数、时长与阈值）
    rationale: |
      只把「可测量指标」收窄为「运行指标」，即延迟、负载、磁盘占用、错误率、队列积压这类运行时观测到的量。运行指标是可测量指标的子集，范围只缩不扩。
      R4-04（CPU 负载）、R4-07（磁盘占用）和例子「延迟较高」都仍在范围内；配置参数的目标值（「调到适当的上限」「设为合理的超时」）退出 B2，按基线留在 R004；「尽快」「及时」不点名指标，也不在范围内。
      未处理：变化词（「突增」「变慢」）的分叉。修好它要扩大 B2，不在 revise 的权限内，可作为下一轮探针。

  - id: C1
    semantic_change: |
      CTC-R003 的口语腔类型「把读者当作谈话对象的引导」加注：工具描述中以使用者作主语的「调用者可以…」同属此类。
      基线只在修复句里提到「调用者可以…」（「去除这些缺陷时……不以使用者作句子主语」），也就是只在已有列明缺陷时才改。候选让它本身成为缺陷：工具描述中没有其他口语腔、只有第三人称使用者框架时，R003 也触发。作用域写明「工具描述中」，开发者指南等其他文体不受影响。
    level_change: none
    evidence_supports: partly
    evidence_note: |
      目标是让冷读者预测出维护者对 RG-15 的裁决（决定 008 裁决 1，开放提案 20）。运行时行为本来就是这样：基线 RG-15 3/3、RG-10 3/3 改为「该函数用于…」一类写法；RG-22（开发者指南中的同一框架）3/3 原样返回；RG-17 3/3「未发现违规」。所以 C1 对 Opus 的运行时收益为零，价值在于文本与行为对齐，风险是新的误触发。
      作用域限于工具描述是对的，RG-22 是它的边界。但「以使用者作主语的「…可以…」」没有区分「陈述功能」与「陈述使用限制或许可」，而后者在工具描述里很常见。
      分类说明：按 008 裁决 1，行为已由现有类型覆盖；但基线文本推不出这一点（si3 第二次冷解码把 RG-15 读成原样返回），对冷读者而言 C1 扩展了一个已有「应」级规则的缺陷类，与 004 §8 同类，不是新规则。
    clarification_or_new: new
    counterexamples:
      - kind: false_fire
        task: 审阅
        mode: review
        input: |
          `reset_password`：重置指定用户的登录密码。只有管理员账号可以调用此工具。
        candidate_behaviour: |
          「管理员账号」是使用者，作主语，后接「可以调用」，字面落入「工具描述中以使用者作主语的「调用者可以…」」，报 CTC-R003 WARNING。改写时，这一条许可它改成「供管理员账号调用」（丢掉「只有」，违反 CTC-S007），或「仅限管理员账号调用」（语义保持，但属无缺陷改动）。
        why_wrong: |
          这句不是会话引导，而是 CTC-P005 要求保留的使用限制；RG-12 基线 3/3 保留了同类限制原句。把限制句报成语域缺陷是误报，改写时还给了削弱量化的机会。R003「永远低于 S 族」能挡住语义损失，挡不住误报。
      - kind: false_fire
        task: 改写
        mode: standard
        input: |
          ## `migrate` 命令
          - `--dry-run`：开发者可以用它预览迁移脚本将要执行的 SQL。
        candidate_behaviour: |
          命令行工具的选项说明在字面上也是「工具描述」，C1 触发，改为「`--dry-run`：预览迁移脚本将要执行的 SQL。」
        why_wrong: |
          这是开发者文档（standard 适用范围），与 RG-22 同一文体，人称属第 5 层体例（§2「不得升格」）。「工具描述」在 strict 适用范围里指供 agent 调用的「工具与函数描述」，C1 没有点明，命令行工具的参考文档会被卷进来。属过度编辑，不改变语义。
      - kind: missed_fire
        task: 改写
        mode: standard
        input: |
          该工具允许调用者按用户 ID 查询审计日志，单次最多返回 100 条。
        candidate_behaviour: |
          使用者是「允许」的宾语，不是主语，C1 字面不适用；没有其他列明缺陷，按 CTC-R001 原样返回。
        why_wrong: |
          G-R-010 的 rendering 不变量要求消除「这个工具能够允许…」框架；007 记录过模型保留「这个工具允许调用者获取…」。C1 只覆盖主语位置，宾语位置的同一框架仍会漏掉。修好它要扩大范围，不在 revise 的权限内。
    conflicts:
      - |
        CTC-S007、CTC-P005：第一条反例。
      - |
        §2「不得升格」：第二条反例把开发者文档的人称当成第 4 层缺陷。
      - |
        008 曾拒绝「把引导收窄到工具描述」（adversarial revision 1）。那是收窄整个类型；C1 是在类型内加一个限于工具描述的子例，不冲突。
      - |
        RG-16（agent 指令中的「你可以调用」是许可）：C1 限于工具描述，不触发。system prompt 内嵌的工具清单兼有两种文体，其中「只有……时，调用方才可以调用它」这类许可加限制的句子与第一条反例同类，由修订措辞排除。
    verdict: revise
    revised_wording: |
      把读者当作谈话对象的引导（「这个工具可以帮你」；工具描述中以使用者作主语陈述功能的「调用者可以…」同属此类）。
    rationale: |
      只加「陈述功能的」，范围是候选的子集：RG-15、RG-10 这类「开发者／调用者可以 + 功能」仍在内；「只有管理员可以调用」「只有……时调用方才可以……」这类使用限制与许可退出 C1，由 CTC-S007、CTC-S003、CTC-P005 管。
      第二、三条反例不在本修订范围内（修它们要改作用域或扩大范围），记入 other_observations。

other_observations:
  - |
    C1 与 R003 修复句都写「工具描述」，strict 适用范围写「工具与函数描述」。C1 的目标探针 RG-15 是函数描述（「通过这个函数…」）。Opus 能把函数映射到工具（基线 RG-15 3/3），但 C1 的目的正是冷读者的可预测性，冷读者未必这样映射；同一个词也会把命令行工具的参考文档卷进来（C1 第二条反例）。改成「工具与函数描述」会在函数一侧扩大字面范围，不在本次 revise 的权限内，交维护者决定。
  - |
    B1 与「X 完成后」：R4-01 的「切换完成后」在基线上已分叉（r2 P003/WARNING，r3 A005/ERROR）。候选与修订措辞都没有定下「完成」是给出但含义未定的判据，还是根本没有判据，也没有定下主库切换算不算「破坏性或不可逆」。建议作为下一轮探针登记。
  - |
    B1 与 M5 的直接后果：末步是破坏性操作、后面没有步骤时，判据缺失不再由任何规则报告。这符合 M5 的限制，记在这里是因为它是 A005 一路关掉后才出现的空档。
  - |
    按要求没有读任何 v1 输出。上面的几处预测需要用 si4-probe-v1-* 核对：P3-01 是否仍有 A005 或改以 CTC-S002 报告；R4-06 的「及时」是否仍为 R004；RG-12 的管理员限制是否被改写。
