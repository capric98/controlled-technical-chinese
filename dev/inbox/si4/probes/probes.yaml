  score: whether CTC-R003 is cited on 「您可以通过」
  expect: 不以 CTC-R003 报告「您可以通过」（开发者指南的常规第二人称，属体例层）；可以返回「未发现违规」。
  fail_if: 以 CTC-R003 报告「您可以」。
  expect_basis: proposed   # adversarial review: house style is layer 5 (§2 不得升格)

# New si4 boundary: the same third-person frame as RG-15, in developer-guide prose rather than a
# tool or function description. A proposal-20 clause scoped to tool descriptions must leave it alone.
- id: RG-22
  targets: [008-open-20]
  task: rewrite
  mode: standard
  over_edit_trap: true
  source: |
    ## 预览变更
    开发者可以通过 `--dry-run` 预览迁移脚本将要执行的 SQL。
  protected_tokens: [--dry-run]
  expect: 正文原样返回。这是开发者指南的说明性散文，不是工具或函数描述；没有列明的口语腔缺陷（CTC-R001）。
  fail_if: 任何改动。
  expect_basis: proposed   # RG-17's reading applied to a third-person frame; R003's repair form names tool descriptions

# ---------------------------------------------------------------- T: 「压缩授权」 versus a length cap
# P003 says 「未获压缩授权则该步骤保持独立；调用方授权合并步骤时可以并入相邻步骤」, and §3 lists a length cap
# and P003's merge as separate authorisations. A character cap that cannot be met is category 7, not a
# licence to merge the verification step.
- id: PC-01
  targets: [proposal-T2]
  task: rewrite
  mode: strict
  instruction: 以 strict 模式改写下面的步骤，全文控制在 60 字以内。
  source: |
    1. 停止 `ingest-worker`。
    2. 确认队列 `ingest.pending` 的积压为 0。
    3. 执行 `kafka-topics --delete --topic ingest.raw`。
  protected_tokens: [ingest-worker, ingest.pending, "kafka-topics --delete --topic ingest.raw"]
  score: three steps kept, the check still an operator action before the delete with 「积压为 0」; 「待确认」 notes the cap
  expect: 第 2 步仍是由操作者执行、位于删除之前、判据「积压为 0」完整的确认动作；「待确认」说明长度上限未能满足（第 7 类）。记录第 2 步是否仍独立成步，以及三次运行是否一致。
  fail_if: 判据丢失；或改写为状态描述（「积压清零后删除…」）；或三次运行在第 2 步是否独立成步上不一致（记录，交维护者）。
  expect_basis: accepted   # integrity: CTC-P003 and D004. Whether a length cap is 「压缩授权」 (merge allowed) is product-decision: §3 lists the cap and P003's merge separately, while P003 itself says 「压缩授权」

# ---------------------------------------------------------------- added 2026-10-29, before any output of these four
