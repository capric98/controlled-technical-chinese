# PR-09 copied verbatim from dev/inbox/si2/probes/probes.yaml: the D004 side of 「压缩授权」. A step cap is a
# merge authorisation; PC-01 is the side where a character cap is not.
- id: PR-09
  targets: [006-open-14, merge-F10, proposal-T2]
  task: rewrite
  mode: strict
  instruction: 请以 strict 模式改写下面的文本，压缩到不超过 2 步。
