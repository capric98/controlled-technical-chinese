# si4 probes — pre-registered on 2026-10-29, before any si4 probe output was seen.
#
# Baseline: SKILL.md at 5a04c5c (si3 v6), frozen at dev/inbox/si4/base/SKILL.md
# (sha256 7458bbbb1e3426b1eb7367d8a93d8a0fdef6708c6492feadf6ed53596425b860).
#
# si4 targets open proposals from docs/decisions/008 (§ Open proposals after si3):
#   15 — CTC-A005's 「缺少……判据」 overlaps CTC-P003's bound on missing success criteria
#   19 — the probes si3 did not run: a degree word on a state, 「条件允许时」, the suggestion 「吧」,
#        a colloquial word outside the five 口语腔 types, 「及时」
#   20 — whether R003 should say that a third-person user frame (「开发者可以…」) counts as
#        reader-directed guidance; the runtime behaviour is fixed by the RG-15 ruling, so these probes
#        are its regression set
#   T  — the terminology findings that recur in self-hosting (proposal 18 「记录级别」, P003's
#        「压缩授权」, §9 item 1's direction). They are tested by self-hosting counts; PC-01 is the
#        behavioural check for 「压缩授权」, the one with an operational reading
#
# The model sees only `instruction` and `source` (tools/ctc_eval.py build_prompt); `targets`,
# `expect`, `fail_if`, `score` and `expect_basis` are never sent.
#
# Each probe runs three times per SKILL.md version. A fork counts as demonstrated when the runs
# disagree on the scored behaviour, or agree on the reading `fail_if` names.
#
# expect_basis, as in si2 and si3:
#   accepted          — an accepted decision, 000-design.md or SKILL.md's own text fixes it
#   proposed          — the orchestrator's reading; the human gate decides whether it stands
#   product-decision  — no accepted text fixes it; the maintainer decides, and the probe only
#                       measures whether the runs agree
#
# RG-08, RG-10, RG-12, RG-16 and RG-17 are copied verbatim from dev/inbox/si3/probes/probes.yaml.
# RG-15 is copied with the expectation the maintainer fixed at the acceptance of decision 008
# (dev/inbox/si3/probes/resolutions.yaml, resolutions_at_acceptance).
cases:
# ---------------------------------------------------------------- proposal 15: A005 / P003 overlap
# CTC-P003's last sentence bounds missing success criteria: only a destructive or irreversible step
# whose success later steps depend on is raised. CTC-A005 reports a missing 「判据」 with no such bound,
# and review routes it to ERROR. P3-01/P3-02 are a read-only closing check with nothing after it;
# P3-03/P3-04 are the boundary, a destructive step that the next step depends on.
- id: P3-01
  targets: [007-open-15]
  task: review
  mode: review
  instruction: 以 review 模式审阅这份 runbook，只输出问题清单。
  source: |
    ## 更新 `search-api` 缓存配置
    1. 将 `search.yaml` 中的 `cache.ttl` 改为 `600`。
    2. 执行 `systemctl reload search-api`。
    3. 检查 `search-api` 的运行情况。
  score: whether any finding at step 3 (「运行情况」) cites CTC-A005 or CTC-P003
  expect: 不以 CTC-A005 或 CTC-P003 报告第 3 步缺少检查项或判据（只读的收尾检查，后续没有步骤依赖它）；可以返回「未发现违规」。
  fail_if: 任一运行以 CTC-A005 或 CTC-P003 报告第 3 步缺少检查项或判据。
  expect_basis: proposed   # CTC-P003 last sentence read as the specific provision over A005's 「缺少……判据」

- id: P3-02
  targets: [007-open-15]
  task: rewrite
  mode: strict
  source: |
    ## 更新 `search-api` 缓存配置
    1. 将 `search.yaml` 中的 `cache.ttl` 改为 `600`。
    2. 执行 `systemctl reload search-api`。
    3. 检查 `search-api` 的运行情况。
  protected_tokens: [search-api, search.yaml, cache.ttl, "600"]
  score: body unchanged; whether 「待确认」 has an item on step 3
  expect: 正文原样返回；「待确认」不出现关于第 3 步检查项或判据的条目（可以没有「待确认」）。
  fail_if: 「待确认」含第 3 步缺少判据的条目；或正文补出判据。
  expect_basis: proposed   # same reading as P3-01

- id: P3-03
  targets: [007-open-15]
  task: review
  mode: review
  instruction: 以 review 模式审阅这份 runbook，只输出问题清单。
  source: |
    ## 下线旧字段
    1. 执行 `migrate apply 0042`，删除 `orders` 表的旧列 `legacy_status`。
    2. 将写流量切回 `orders-api`。
  score: whether step 1's missing success criterion is reported; rule ID per run
  expect: 第 1 步缺少成功判据被报告（破坏性、不可逆，且第 2 步的安全性取决于它是否成功）；三次运行引用同一规则 ID；同一处不同时引 CTC-P003 与 CTC-A005。
  fail_if: 任一运行未报告；或三次运行引用的规则 ID 不一致；或同一运行在该处同时引 CTC-P003 与 CTC-A005。
  expect_basis: accepted   # CTC-P003 last sentence (reported); the rule ID is product-decision

- id: P3-04
  targets: [007-open-15]
  task: rewrite
  mode: strict
  source: |
    ## 下线旧字段
    1. 执行 `migrate apply 0042`，删除 `orders` 表的旧列 `legacy_status`。
    2. 将写流量切回 `orders-api`。
  protected_tokens: ["migrate apply 0042", orders, legacy_status, orders-api]
  score: body unchanged; 「待确认」 has an item on step 1's success criterion
  expect: 正文原样返回，不补出判据；「待确认」含第 1 步成功判据的条目。
  fail_if: 「待确认」没有该条目；或正文补出判据。
  expect_basis: accepted   # CTC-P003 last sentence; §3 category 2

# ---------------------------------------------------------------- proposal 19: the probes si3 did not run
# A degree word on a state. 「过高」 is a degree word (R004's class); 「负载过高」 is also an undefined
# state (R004's exclusion → A005). Which one is a product question; a double citation or a fork is not.
- id: R4-04
  targets: [008-open-19]
  task: review
  mode: review
  instruction: 以 review 模式审阅这份 SOP，只输出问题清单。
  source: |
    ## `api` 集群扩容
    1. CPU 负载过高时，按 `scale-out.md` 扩容 `api` 节点。
    2. 扩容完成后，在 `#ops` 频道通报。
  score: rule IDs at 「负载过高」
  expect: 「负载过高」被报告；每次运行在该处只引一条规则；三次运行一致。
  fail_if: 任一运行未报告；或同一运行在该处同时引 CTC-R004 与 CTC-A005；或三次运行引用不一致。
  expect_basis: product-decision

# 「条件允许时」: a discretion condition (R004's class) or an undefined state (A005). §5 asks for a strength
# question (the fourth column) only on the R004 side.
- id: R4-05
  targets: [008-open-19]
  task: review
  mode: review
  instruction: 以 review 模式审阅这份 SOP，只输出问题清单。
  source: |
    ## 日志归档
    1. 每日 02:00 执行 `logrotate -f /etc/logrotate.d/app`。
    2. 条件允许时，将归档日志同步到 `s3://logs-archive/app/`。
  score: rule IDs at 「条件允许」
  expect: 「条件允许」被报告；每次运行在该处只引一条规则；三次运行一致。
  fail_if: 任一运行未报告；或同一运行在该处同时引 CTC-R004 与 CTC-A005；或三次运行引用不一致。
  expect_basis: product-decision

- id: R4-05r
  targets: [008-open-19]
  task: rewrite
  mode: strict
  source: |
    ## 日志归档
    1. 每日 02:00 执行 `logrotate -f /etc/logrotate.d/app`。
    2. 条件允许时，将归档日志同步到 `s3://logs-archive/app/`。
  protected_tokens: ["logrotate -f /etc/logrotate.d/app", "s3://logs-archive/app/", "02:00"]
  score: body unchanged; a 「待确认」 item on 「条件允许」; whether it carries a fourth (strength) column
  expect: 正文原样返回；「待确认」含「条件允许」一项；记录该项是否带第四栏的强度建议。
  fail_if: 「条件允许时」被替换为具体条件或删除；或没有「待确认」条目；或三次运行在第四栏上不一致（记录，交维护者）。
  expect_basis: accepted   # unchanged + item: CTC-R004 / CTC-A005 both say 保持原表述并提出; the fourth column is product-decision

- id: R4-06
  targets: [008-open-19]
  task: review
  mode: review
  instruction: 以 review 模式审阅这份 SOP，只输出问题清单。
  source: |
    ## 磁盘告警处理
    1. 收到 `disk_usage > 90%` 告警后，及时清理 `/var/log/app/` 下的归档日志。
    2. 清理后确认磁盘使用率低于 80%。
  score: rule IDs at 「及时」
  expect: 「及时」以 CTC-R004 报告；三次运行一致。
  fail_if: 任一运行未报告；或以 CTC-A005 报告；或三次运行引用不一致。
  expect_basis: proposed   # CTC-R004's open class names timing words; si3's cold decoder chose R004

# The suggestion 「吧」 (si3 PR-18 covered only the guess 「吧」). Raising it to 「不得」「禁止」 changes the
# speech act (CTC-S003). Whether a bare 「先不要切主」 keeps the force is a product question.
- id: RG-20
  targets: [008-open-19]
  task: rewrite
  mode: strict
  source: |
    主库复制延迟超过 30 秒时，先别切主吧，等 DBA 确认后再操作。
  protected_tokens: ["30 秒"]
  score: strength not raised; how 「吧」 is rendered (kept / 建议 / bare)
  expect: 不升格为「不得」「禁止」「必须」「严禁」「须」；「30 秒」与「等 DBA 确认后」保留；记录「吧」的处理方式。
  fail_if: 出现「不得」「禁止」「必须」「严禁」「须」；或改动「30 秒」；或三次运行在「吧」的处理上不一致（记录，交维护者）。
  expect_basis: accepted   # the raise: CTC-S003 and R003's strength sentence; the bare form is product-decision

# A colloquial word outside the five 口语腔 types.
- id: RG-21
  targets: [008-open-19]
  task: rewrite
  mode: strict
  source: |
    配置同步搞定了，共更新 12 项。
  protected_tokens: ["12"]
  score: whether 「搞定」 is rendered; 「12 项」 kept
  expect: 三次运行对「搞定了」的处理一致；「12 项」不变。
  fail_if: 三次运行不一致；或改动「12 项」。
  expect_basis: product-decision

